<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Food Truck Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: frantic, cozy, 16-bit arcade
   IDEA: inside the food truck at lunch rush — customers at the window, stations on the counter
   PICTURE: pixel-art truck interior, animal customers with order bubbles, a grid of cooking stations
   COLOUR and TYPE: warm cream, tomato red, mustard; Pixelify Sans
   LAYOUT: chunky pixel HUD, the scene fills the screen, day summary and shop as pixel panels */
:root{--ink:#4a2c1d;--edge:#4a2c1d;--cream:#fff3d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#3b2418;font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;color:var(--ink);cursor:pointer}
#app{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;flex-direction:column;background:#3b2418}
#top{display:flex;gap:5px;padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;align-items:center;background:#e8574a;border-bottom:4px solid var(--edge)}
.pill{flex:1;display:flex;align-items:center;gap:3px;height:34px;background:var(--cream);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:0 6px 0 2px;font-weight:700;font-size:16px;white-space:nowrap}
.pill img{width:26px;height:26px;}
.pill small{font-size:11px}
#goalP{position:relative;overflow:hidden;flex:1.3}
#goalP #goalBar{position:absolute}
#goalP .tk{position:absolute;top:0;bottom:0;width:3px;background:rgba(74,44,29,.28);z-index:0}#goalP .tk.on{background:#e8574a}
@keyframes spop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.45) rotate(8deg)}100%{transform:scale(1)}}.stars img.pop{animation:spop .45s}
#goalBar{position:absolute;left:0;top:0;bottom:0;background:#ffd34d;width:0;transition:width .3s;z-index:0}
#goalP *{position:relative;z-index:1}
.sq{width:36px;height:36px;border:3px solid var(--edge);background:var(--cream);box-shadow:3px 3px 0 var(--edge);padding:0;flex:none;position:relative}
.sq img{width:26px;height:26px;display:block;margin:auto}
#sndx{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:#e8574a}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;width:100%;height:calc(100% - max(env(safe-area-inset-bottom),10px) - 8px);display:block;}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}
.ov.hide{display:none}
.panel{background:var(--cream);border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);padding:16px;max-width:360px;width:100%}
#title{background-size:cover;background-position:center top;align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
#logo{width:min(360px,92vw);display:block;margin:0 auto 6px;filter:drop-shadow(4px 4px 0 rgba(74,44,29,.6))}
#tchef{width:96px;display:block;margin:0 auto}
.how{font-size:15px;line-height:1.35;margin:8px 0 12px}
.btn{background:#e8574a;color:#fff;border:4px solid var(--edge);box-shadow:4px 4px 0 var(--edge);font-size:20px;font-weight:700;padding:8px 22px;min-height:48px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.btn.alt{background:#7cc36b}
.btn.off{background:#bbb;color:#eee}
h2{margin:0 0 4px;font-size:28px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars img{width:44px;}
.stars img.dim{filter:grayscale(1) brightness(.6);opacity:.5}
.row{display:flex;justify-content:space-between;font-size:16px;padding:3px 2px;border-bottom:2px dashed rgba(74,44,29,.25)}
.up{display:flex;align-items:center;gap:8px;border:3px solid var(--edge);background:#fff;padding:6px;margin-top:8px;text-align:left}
.up img{width:36px;height:36px;}
.up div{flex:1}.up b{display:block;font-size:15px}.up small{font-size:12px}
.up .btn{font-size:14px;padding:4px 10px;min-height:38px;box-shadow:3px 3px 0 var(--edge)}
.pips{letter-spacing:2px;font-size:12px;color:#e8574a}
.home{display:none;margin-top:12px;font-weight:700;color:#fff;font-size:15px;text-decoration:underline;text-shadow:2px 2px 0 var(--edge)}
body.inhub .home{display:inline-block}
@keyframes bob{to{transform:translateY(-6px)}}
#logo,#tchef{animation:bob .9s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){#logo,#tchef{animation:none}}
.ov{overflow:auto;touch-action:pan-y}
.cur{display:flex;justify-content:center;gap:12px;font-weight:700;font-size:16px;margin:6px 0 10px}.cur span{display:flex;align-items:center;gap:3px}
.ic{width:20px;height:20px;vertical-align:-4px}
.gem{display:inline-block;width:11px;height:11px;background:#e84fd0;border:2px solid #4a2c1d;transform:rotate(45deg);margin:0 6px 1px 4px;box-shadow:inset 2px 2px 0 #ff9ef0}
.btn.sm{font-size:15px;padding:5px 12px;min-height:42px;box-shadow:3px 3px 0 var(--edge)}.btn.off{background:#bbb}
.hrow{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0 0}
.cele{position:relative;height:70px}.cele .chef{height:70px;animation:bob .5s ease-in-out infinite alternate}.cele .pile{position:absolute;left:60%;bottom:2px}.cele .pile img{width:30px;height:30px;margin-left:-12px}
.rw{font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;margin:2px 0 6px}.rw small{font-size:13px;color:#e8574a}.rw .ic{width:28px;height:28px}
h2.wd{color:#f0a000;text-shadow:2px 2px 0 #4a2c1d;font-size:32px}
.chest{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;border:3px solid var(--edge);background:#fff;padding:5px 8px;margin-top:8px}.cbar{flex:1;height:12px;background:#e6d9c0;border:2px solid var(--edge)}.cbar div{height:100%;background:#7cc36b}
.cf{position:fixed;top:-12px;width:8px;height:6px;z-index:30;animation:cfall linear forwards;pointer-events:none}@keyframes cfall{to{transform:translateY(110vh) rotate(540deg)}}
.st{margin:10px 0 0;font-weight:700}
.pill{border-radius:14px;border-width:3px}.sq{border-radius:14px}.panel{border-radius:24px}.btn{border-radius:18px}.up{border-radius:14px}.chest{border-radius:12px}.cbar{border-radius:8px;overflow:hidden}
#top{border-bottom-width:3px}.gem{border-radius:2px}
.ov:not(.hide) .panel{animation:pin .32s cubic-bezier(.2,1.5,.4,1)}@keyframes pin{from{transform:scale(.82);opacity:0}}
.btn,.sq,.pill{transition:transform .09s ease,box-shadow .09s ease,background .2s}.sq:active{transform:scale(.92)}
#goalBar{transition:width .35s cubic-bezier(.2,1,.3,1)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill" style="flex:.8"><small>DAY</small>&nbsp;<span id="vDay">1</span></div>
    <div class="pill"><img data-art="i_clock" alt=""><span id="vTime">75</span></div>
    <div class="pill" id="goalP"><div id="goalBar"></div><img data-art="i_star" alt=""><span id="vGoal">0</span><i class="tk" style="left:50%"></i><i class="tk" style="left:75%"></i></div>
    <div class="pill"><img data-art="i_coin" alt=""><span id="vCo">0</span></div>
    <button class="sq" id="snd" aria-label="Sound"><img data-art="i_sound" alt=""><span id="sndx"></span></button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div class="ov" id="title"><div><img id="logo" data-art="logo" alt="Food Truck Rush"><div class="panel">
  <img id="tchef" data-art="i_chef" alt="">
  <p class="how">Tap a machine to cook. When it's ready, tap again and it flies to a customer who ordered it. Serve whole orders before patience runs out! Gold <b>VIP</b>s pay double. Keep a combo going for <b>FRENZY</b>, and tap the chef when he glows!</p>
  <div class="cur" id="cur"></div><button class="btn alt" id="play" style="font-size:26px;padding:8px 40px">Day 1</button><div class="hrow"><button class="btn sm" id="bDaily">Daily gift!</button></div><div id="hShop"></div><a class="home" href="../index.html">← All games</a></div></div></div>
<div class="ov hide" id="dayEnd"><div class="panel" id="dePanel"></div></div>

  const dt=FDT;for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*(p.k==='steam'?1.6:1.1);if(p.k==='coin'){if(p.life<.62){p.vx=p.vx*.86+(W*.8-p.x)*.9;p.vy=p.vy*.86+(-30-p.y)*.9;}else p.vy+=900*dt;}if(p.life<=0){P.splice(i,1);continue;}
    if(p.k==='coin')spr('i_coin',p.x,p.y,16);else if(p.k==='heart'){ctx.globalAlpha=p.life;spr('i_heart',p.x,p.y,14);ctx.globalAlpha=1;}
    else if(p.k==='dot'){ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.3,0,7);ctx.fill();ctx.globalAlpha=1;}
    else if(p.k==='spark'){ctx.globalAlpha=Math.min(1,p.life*2.2);ctx.fillStyle='#ffe98a';ctx.beginPath();ctx.arc(p.x,p.y,1+p.life*6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.life*3,0,7);ctx.fill();ctx.globalAlpha=1;}
    else if(p.k==='conf'){ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.x*.03+p.life*7);ctx.scale(1,Math.cos(p.life*11+p.x));ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillRect(-4,-3,8,6);ctx.restore();ctx.globalAlpha=1;}
    else{ctx.globalAlpha=p.life*0.6;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,3+(1-p.life)*8,0,7);ctx.fill();ctx.globalAlpha=1;}}
  for(let i=F.length-1;i>=0;i--){const f=F[i],u=Math.max(0,(t-f.t0)/1000);if(u>=1){F.splice(i,1);continue;}ctx.save();ctx.globalAlpha=u>0.7?(1-u)/0.3:1;ctx.translate(clamp(f.x,60,W-60),f.y-u*36);
    const sc=(u<0.12?easeOutBack(u/0.12):1)*f.z;ctx.scale(sc,sc);ctx.font=FONT(18);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#4a2c1d';ctx.lineJoin='round';ctx.strokeText(f.s,0,0);ctx.fillStyle=f.c;ctx.fillText(f.s,0,0);ctx.restore();}
  if(G.rush&&G.run){const u=(t-G.rushT)/1000;if(u<2.2){const sc=u<0.2?easeOutBack(u/0.2):1;ctx.save();ctx.globalAlpha=u>1.8?(2.2-u)/0.4:1;ctx.translate(W/2,H*0.38);ctx.scale(sc,sc);box(-120,-24,240,48,'#e8574a','#4a2c1d',4);ctx.font=FONT(24);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('RUSH HOUR!',0,1);ctx.restore();}
    else{ctx.font=FONT(12);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=Math.floor(t/400)%2?'#ffd34d':'#fff';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText('RUSH HOUR +2',8,16);ctx.fillText('RUSH HOUR +2',8,16);}}
  if(G.spT&&t>=G.spT&&t-G.spT<2600&&G.run){const u=(t-G.spT)/1000,sc=u<0.2?easeOutBack(u/0.2):1,m=MENU.find(x=>x.k===G.special);ctx.save();ctx.globalAlpha=u>2.2?(2.6-u)/0.4:1;ctx.translate(W/2,H*0.36);ctx.scale(sc,sc);box(-130,-34,260,68,'#fff3d6','#4a2c1d',4);
    spr(G.special,-92,0,48);ctx.font=FONT(13);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#e8574a';ctx.fillText("TODAY'S SPECIAL",-60,-12);ctx.font=FONT(18);ctx.fillStyle='#4a2c1d';ctx.fillText(`${m.n}  pays ×2`,-60,12);ctx.restore();}
  {const cb=chefBtn(),full=G.power>=1,pu=full?1+.08*Math.sin(t*.012):1;ctx.save();ctx.translate(cb.x,cb.y);ctx.scale(pu,pu);
   if(full){ctx.fillStyle=`rgba(255,211,77,${.45+.25*Math.sin(t*.012)})`;ctx.beginPath();ctx.arc(0,0,cb.r*1.35,0,7);ctx.fill();}
   ctx.fillStyle='#4a2c1d';ctx.beginPath();ctx.arc(2,3,cb.r,0,7);ctx.fill();ctx.fillStyle=full?'#fff6c2':'#fff3d6';ctx.beginPath();ctx.arc(0,0,cb.r,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4a2c1d';ctx.stroke();
   ctx.lineWidth=5;ctx.strokeStyle=G.gold>0?'#4aa3df':'#ff8a3d';ctx.beginPath();ctx.arc(0,0,cb.r-4,-Math.PI/2,-Math.PI/2+Math.PI*2*(G.gold>0?G.gold/6:G.power));ctx.stroke();
   ctx.globalAlpha=full||G.gold>0?1:.6;spr('i_chef',0,0,cb.r*1.25);ctx.globalAlpha=1;
   if(full){ctx.font=FONT(11);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText('TAP!',0,-cb.r-4);ctx.fillStyle='#ffd34d';ctx.fillText('TAP!',0,-cb.r-4);}ctx.restore();}
  if(G.bonus){const gp=giftPos(t),sz=44+4*Math.sin(t*.01);ctx.fillStyle=`rgba(255,211,77,${.4+.2*Math.sin(t*.012)})`;ctx.beginPath();ctx.arc(gp.x,gp.y,30,0,7);ctx.fill();spr('i_gift',gp.x,gp.y,sz);spr('i_sparkle',gp.x+22,gp.y-20,14+4*Math.sin(t*.02));ctx.font=FONT(11);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText('TAP!',gp.x,gp.y+34);ctx.fillStyle='#fff';ctx.fillText('TAP!',gp.x,gp.y+34);}
  if(G.combo>=2&&G.run){ctx.font=FONT(15);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';const s=`COMBO ${G.combo}`;ctx.strokeText(s,10,gy-10);ctx.fillStyle=G.combo>=5?'#ff8a3d':'#fff';ctx.fillText(s,10,gy-10);}
  if(G.frenzy>0){ctx.lineWidth=8;ctx.strokeStyle=`hsl(${(t*.4)%360} 95% 60%)`;ctx.strokeRect(4,4,W-8,H-8);ctx.font=FONT(15);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText('FRENZY ×2',10,gy-36);ctx.fillStyle='#ffd34d';ctx.fillText('FRENZY ×2',10,gy-36);ctx.fillStyle='#4a2c1d';ctx.fillRect(10,gy-32,92,6);ctx.fillStyle='#ff8a3d';ctx.fillRect(10,gy-32,92*G.frenzy/8,6);}
  if(G.gold>0){ctx.fillStyle=`rgba(255,220,90,${.1+.05*Math.sin(t*.02)})`;ctx.fillRect(0,0,W,H);}
  if(G.flash>0){ctx.fillStyle=`rgba(232,60,50,${G.flash*.35})`;ctx.fillRect(0,0,W,H);}
  if(G.flashW>0){ctx.fillStyle=`rgba(255,255,255,${G.flashW*.6})`;ctx.fillRect(0,0,W,H);}
  if(G.ban){const u=(t-G.ban.t)/G.ban.d;if(u>=1)G.ban=null;else{const sc=u<.1?easeOutBack(u/.1):1;ctx.save();ctx.globalAlpha=u>.8?(1-u)/.2:1;ctx.translate(W/2,H*.27);ctx.scale(sc,sc);ctx.rotate(-.04);ctx.font=FONT(Math.min(24,W*.058));ctx.textAlign='center';ctx.textBaseline='middle';const w=ctx.measureText(G.ban.s).width+28;box(-w/2,-22,w,44,G.ban.c,'#4a2c1d',4);ctx.fillStyle='#fff';ctx.fillText(G.ban.s,0,1);ctx.restore();}}
  if(G.count>0){ctx.fillStyle='rgba(59,36,24,.45)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=8;ctx.strokeStyle='#4a2c1d';ctx.font=FONT(46);const s=G.count>.7?`DAY ${SV.day}`:'OPEN!';ctx.strokeText(s,W/2,H*.4);ctx.fillStyle=G.count>.7?'#fff':'#ffd34d';ctx.fillText(s,W/2,H*.4);ctx.font=FONT(18);ctx.lineWidth=5;const g2=`Goal: ${goalFor(SV.day)} coins`+(G.fest?' · FESTIVAL!':'');ctx.strokeText(g2,W/2,H*.4+44);ctx.fillStyle='#fff';ctx.fillText(g2,W/2,H*.4+44);}
  // final seconds warning
  const left=G.len-G.t;if(left>0&&left<10&&G.run){ctx.font=FONT(14);ctx.textAlign='center';ctx.fillStyle=Math.floor(t/300)%2?'#e8574a':'#fff';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText(`Closing in ${Math.ceil(left)}!`,W/2,ly+18);ctx.fillText(`Closing in ${Math.ceil(left)}!`,W/2,ly+18);}
  if(left<=0&&G.run){ctx.font=FONT(14);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText('Finish the last orders!',W/2,ly+18);ctx.fillText('Finish the last orders!',W/2,ly+18);}}
function frame(t){const dt=Math.min(0.05,(t-last)/1000);last=t;FDT=dt;if(G&&G.run)step(dt);draw(t);requestAnimationFrame(frame);}

/* day end + shop */
function endDay(){music(false);const gl=goalFor(SV.day),e=G.earned,st=e>=gl*2?3:e>=gl*1.5?2:e>=gl?1:0,win=st>0,R={sb:0,gem:0,chest:null,prev:SV.streak||0};
  SV.stars[SV.day]=Math.max(SV.stars[SV.day]||0,st);
  if(win){SV.day++;SV.streak=R.prev+1;R.sb=Math.round(e*Math.min(1,(SV.streak-1)*.1));SV.coins+=R.sb;if(st===3){R.gem=1;SV.gems++;}SV.chest=(SV.chest||0)+1;if(SV.chest>=3){SV.chest=0;R.chest={c:60+SV.day*10};SV.gems+=3;SV.coins+=R.chest.c;}SFX.win();}
  else{SV.streak=0;SFX.angry();}save();showSummary(e,gl,st,win,R);}
const GEM='<i class="gem"></i>',COIN=`<img alt="" src="${ART_SRC.i_coin}" class="ic">`,STAR=`<img alt="" src="${ART_SRC.i_star}" class="ic">`;
const starsTot=()=>Object.values(SV.stars).reduce((a,b)=>a+b,0);
function partyDOM(el){for(let i=0;i<40;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${rnd(0,100)}%;background:${pick(['#e8574a','#ffd34d','#7cc36b','#4aa3df','#e84fd0'])};animation-delay:${rnd(0,1.4)}s;animation-duration:${rnd(1.6,2.8)}s`;el.appendChild(d);}}
function closeEnd(){$('dayEnd').classList.add('hide');$('dayEnd').querySelectorAll('.cf').forEach(e=>e.remove());}
function showSummary(e,gl,st,win,R){const p=$('dePanel'),SI=ART_SRC.i_star;
  p.innerHTML=`<h2 class="${win?'wd':''}">${win?pick(['Well done!','Yum-tastic!','Great service!']):'Not quite…'}</h2><div class="stars">${[1,2,3].map(i=>`<img alt="" src="${SI}" class="dim">`).join('')}</div>
   ${win?`<div class="cele"><img alt="" src="${ART_SRC.i_chef}" class="chef"><div class="pile">${COIN}${COIN}${COIN}</div></div>`:''}
   <div class="rw">${COIN}<b id="eCnt">0</b>${R.sb?`<small>+${R.sb} streak</small>`:''}${R.gem?`&nbsp;${GEM}<b>+1</b>`:''}</div>
   <div class="row"><span>Goal · ★★ · ★★★</span><b>${gl} · ${Math.round(gl*1.5)} · ${gl*2}</b></div><div class="row"><span>Served / walked away</span><b>${G.served} / ${G.lost}</b></div>
   ${win?`<div class="row"><span>Win streak: ${SV.streak}</span><b>+${Math.min(100,SV.streak*10)}% coins tomorrow</b></div>
   <div class="chest"><span>${R.chest?`Chest! ${GEM}+3 ${COIN}+${R.chest.c}`:'Treasure chest'}</span><div class="cbar"><div style="width:${R.chest?100:SV.chest/3*100}%"></div></div><b>${R.chest?'3/3':SV.chest+'/3'}</b></div>`:`<div class="row"><span>Win streak</span><b>lost</b></div>`}
   <p style="font-size:13px;margin:6px 0 0">${win&&unlocked(SV.day)>unlocked(SV.day-1)?`New station tomorrow: <b>${MENU[unlocked(SV.day)-1].n}</b>!`:''}</p>
   <div class="hrow" id="xbtn"></div>
   <div class="hrow"><button class="btn sm" id="goHome">Upgrades</button><button class="btn ${win?'alt':''}" id="nextDay">${win?`Day ${SV.day}`:`Retry`}</button></div>`;
  const xb=$('xbtn'),mk=(html,fn)=>{const b=document.createElement('button');b.className='btn sm';b.innerHTML=html;b.onclick=()=>{ac();fn(b);};xb.appendChild(b);};
  if(win&&SV.gems>=5)mk(`Double coins! ${GEM}5`,b=>{if(SV.gems<5)return;SV.gems-=5;SV.coins+=e;save();b.remove();$('eCnt').textContent=e*2;SFX.win();upd();});
  if(!win&&R.prev>=2&&SV.gems>=10)mk(`Keep streak of ${R.prev}  ${GEM}10`,b=>{if(SV.gems<10)return;SV.gems-=10;SV.streak=R.prev;save();b.textContent='Streak saved!';b.onclick=null;SFX.win();});
  [1,2,3].forEach(i=>{if(i<=st)setTimeout(()=>{const im=p.querySelectorAll('.stars img')[i-1];if(im){im.classList.remove('dim');im.classList.add('pop');tone(660+i*220,.2,'square',.07);buzz(15);}},300+i*420);});
  const t0=now(),cnt=()=>{const u=Math.min(1,(now()-t0)/900),el=$('eCnt');if(!el||el.textContent==e*2)return;el.textContent=Math.round(e*u);if(u<1)requestAnimationFrame(cnt);};cnt();
  if(win)partyDOM($('dayEnd'));$('dayEnd').classList.remove('hide');$('nextDay').onclick=()=>{ac();closeEnd();startDay();};$('goHome').onclick=()=>{ac();closeEnd();home();};}
function renderShop(el){el.innerHTML=`<p class="st">Upgrades</p>`+
  UPG.map(u=>{const lv=SV[u.k],cost=u.c[lv];return `<div class="up"><img alt="" src="${ART_SRC[u.ic]}"><div><b>${u.n}</b><small>${u.d}</small><div class="pips">${'■'.repeat(lv)}${'□'.repeat(5-lv)}</div></div>
   ${cost===undefined?'<b>MAX</b>':`<button class="btn ${SV.coins>=cost?'':'off'}" data-u="${u.k}">${cost}</button>`}</div>`;}).join('');
  el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ac();const u=UPG.find(x=>x.k===b.dataset.u),cost=u.c[SV[u.k]];if(SV.coins<cost){SFX.no();return;}SV.coins-=cost;SV[u.k]++;SFX.win();save();cur();renderShop(el);});}

/* home screen: currencies, daily gift, upgrades */
function cur(){$('cur').innerHTML=`<span>${STAR}${starsTot()}</span><span>${COIN}${SV.coins}</span><span>${GEM}${SV.gems}</span><span>STREAK ${SV.streak||0}</span>`;}
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),DAILY=[{c:50},{c:100},{g:2},{c:200},{g:5}];
function home(){G=null;P=[];F=[];FL=[];$('title').classList.remove('hide');$('play').textContent=`Day ${SV.day}`;cur();const can=SV.dl!==dayNum(),b=$('bDaily');b.classList.toggle('off',!can);b.textContent=can?'Daily gift!':'Next gift tomorrow';
  const first=SV.day<=1;document.querySelector('#title .how').style.display=first?'':'none';$('tchef').style.display=first?'':'none';renderShop($('hShop'));}
$('bDaily').onclick=()=>{ac();const d=dayNum();if(SV.dl===d){SFX.no();return;}SV.ds=SV.dl===d-1?(SV.ds%5)+1:1;SV.dl=d;const r=DAILY[SV.ds-1];if(r.c)SV.coins+=r.c;if(r.g)SV.gems+=r.g;save();SFX.win();$('bDaily').textContent=`Gift ${SV.ds}/5: +${r.c||r.g} ${r.c?'coins':'gems'}!`;$('bDaily').classList.add('off');cur();renderShop($('hShop'));};
$('play').onclick=()=>{ac();$('title').classList.add('hide');startDay();};
home();
layout();requestAnimationFrame(frame);
window.FTR={get G(){return G;},rect:stRect,end(){G.len=G.t+0.1;}};
}
</script>
