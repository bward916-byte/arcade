<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Food Truck Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: frantic, cozy, 16-bit arcade
   IDEA: inside the food truck at lunch rush — customers at the window, stations on the counter
   PICTURE: pixel-art truck interior, animal customers with order bubbles, a grid of cooking stations
   COLOUR and TYPE: warm cream, tomato red, mustard; Pixelify Sans
   LAYOUT: chunky pixel HUD, the scene fills the screen, day summary and shop as pixel panels */
:root{--ink:#4a2c1d;--edge:#4a2c1d;--cream:#fff3d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#3b2418;font-family:'Pixelify Sans',ui-monospace,monospace;color:var(--ink)}
button{font-family:inherit;color:var(--ink);cursor:pointer}
#app{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;flex-direction:column;background:#3b2418}
#top{display:flex;gap:5px;padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;align-items:center;background:#e8574a;border-bottom:4px solid var(--edge)}
.pill{flex:1;display:flex;align-items:center;gap:3px;height:34px;background:var(--cream);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:0 6px 0 2px;font-weight:700;font-size:16px;white-space:nowrap}
.pill img{width:26px;height:26px;image-rendering:pixelated}
.pill small{font-size:11px}
#goalP{position:relative;overflow:hidden}
#goalBar{position:absolute;left:0;top:0;bottom:0;background:#ffd34d;width:0;transition:width .3s;z-index:0}
#goalP *{position:relative;z-index:1}
.sq{width:36px;height:36px;border:3px solid var(--edge);background:var(--cream);box-shadow:3px 3px 0 var(--edge);padding:0;flex:none;position:relative}
.sq img{width:26px;height:26px;image-rendering:pixelated;display:block;margin:auto}
#sndx{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:#e8574a}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;width:100%;height:calc(100% - max(env(safe-area-inset-bottom),10px) - 8px);display:block;image-rendering:pixelated}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}
.ov.hide{display:none}
.panel{background:var(--cream);border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);padding:16px;max-width:360px;width:100%}
#title{background-size:cover;background-position:center top;align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
#logo{width:min(360px,92vw);display:block;margin:0 auto 6px;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 rgba(74,44,29,.6))}
#tchef{width:96px;image-rendering:pixelated;display:block;margin:0 auto}
.how{font-size:15px;line-height:1.35;margin:8px 0 12px}
.btn{background:#e8574a;color:#fff;border:4px solid var(--edge);box-shadow:4px 4px 0 var(--edge);font-size:20px;font-weight:700;padding:8px 22px;min-height:48px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.btn.alt{background:#7cc36b}
.btn.off{background:#bbb;color:#eee}
h2{margin:0 0 4px;font-size:28px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars img{width:44px;image-rendering:pixelated}
.stars img.dim{filter:grayscale(1) brightness(.6);opacity:.5}
.row{display:flex;justify-content:space-between;font-size:16px;padding:3px 2px;border-bottom:2px dashed rgba(74,44,29,.25)}
.up{display:flex;align-items:center;gap:8px;border:3px solid var(--edge);background:#fff;padding:6px;margin-top:8px;text-align:left}
.up img{width:36px;height:36px;image-rendering:pixelated}
.up div{flex:1}.up b{display:block;font-size:15px}.up small{font-size:12px}
.up .btn{font-size:14px;padding:4px 10px;min-height:38px;box-shadow:3px 3px 0 var(--edge)}
.pips{letter-spacing:2px;font-size:12px;color:#e8574a}
.home{display:none;margin-top:12px;font-weight:700;color:#fff;font-size:15px;text-decoration:underline;text-shadow:2px 2px 0 var(--edge)}
body.inhub .home{display:inline-block}
@keyframes bob{to{transform:translateY(-6px)}}
#logo,#tchef{animation:bob .9s steps(3) infinite alternate}
@media (prefers-reduced-motion:reduce){#logo,#tchef{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill" style="flex:.8"><small>DAY</small>&nbsp;<span id="vDay">1</span></div>
    <div class="pill"><img data-art="i_clock" alt=""><span id="vTime">75</span></div>
    <div class="pill" id="goalP"><div id="goalBar"></div><img data-art="i_star" alt=""><span id="vGoal">0/60</span></div>
    <div class="pill"><img data-art="i_coin" alt=""><span id="vCo">0</span></div>
    <button class="sq" id="snd" aria-label="Sound"><img data-art="i_sound" alt=""><span id="sndx"></span></button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div class="ov" id="title"><div><img id="logo" data-art="logo" alt="Food Truck Rush"><div class="panel">
  <img id="tchef" data-art="i_chef" alt="">
  <p class="how">Tap a station to cook. When it's ready, tap again and it flies to a customer who ordered it. Serve whole orders before patience runs out! Gold <b>VIP</b> customers pay double.</p>
  <button class="btn" id="play">Start Day 1</button><br><a class="home" href="../index.html">← All games</a></div></div></div>
<div class="ov hide" id="dayEnd"><div class="panel" id="dePanel"></div></div>

{

/* sound */
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(f,d=0.1,type='square',v=0.06,when=0,slide=0){if(!AC||SV.snd)return;try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}

/* layout: backdrop rect */
let W=0,H=0,bx=0,by=0,bw=0,bh=0,tile=60,gx=0,gy=0;
function layout(){const vh=window.visualViewport?window.visualViewport.height:innerHeight;$('app').style.height=vh+'px';
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const ar=1037/1554;bh=H;bw=bh*ar;if(bw<W){bw=W;bh=bw/ar;}bx=(W-bw)/2;by=Math.min(0,H-bh);
  tile=Math.floor(Math.min(W*0.92/4,(H-(by+bh*0.47))/3.25));gx=(W-tile*4)/2;gy=H-tile*3-8;}

const cookDur=m=>m.t*Math.pow(0.88,SV.speed);

function spawnCust(){const free=[0,1,2].filter(i=>!G.cust[i]);if(!free.length)return;const i=pick(free),n=G.st.length;

  const used=G.cust.filter(Boolean).map(c=>c.a),P2=patienceFor(cnt);
  const vip=SV.day>=2&&Math.random()<0.16,P3=vip?P2*0.8:P2;
  G.cust[i]={a:pick(PALS.filter(a=>!used.includes(a))),items,pat:P3,pmax:P3,t0:now(),st:'in',mood:0,vip};if(vip)SFX.ready();}
function upd(){if(!G)return;$('vTime').textContent=Math.max(0,Math.ceil(G.len-G.t));$('vCo').textContent=SV.coins;const gl=goalFor(SV.day);
  $('vGoal').textContent=`${G.earned}/${gl}`;$('goalBar').style.width=Math.min(100,G.earned/gl*100)+'%';}

/* positions */
const custX=i=>bx+bw*(0.24+0.26*i),ledgeY=()=>by+bh*0.442;
function stRect(i){const c=i%4,r=Math.floor(i/4);return{x:gx+c*tile,y:gy+r*tile,w:tile,h:tile};}

/* input */
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(!G||!G.run)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  G.st.forEach((s,i)=>{const q=stRect(i);if(x>=q.x&&x<q.x+q.w&&y>=q.y&&y<q.y+q.h)tapStation(s,i);});});
['touchstart','touchmove','touchend'].forEach(ev=>cv.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
function tapStation(s,i){const t=now();
  if(s.state==='idle'){s.state='cook';s.t0=t;s.dur=cookDur(s.m)*1000;s.tap=t;SFX.tap();return;}
  if(s.state==='ready'){
    // find customer needing it, prefer least patience
    let best=-1,bp=1e9;G.cust.forEach((c,ci)=>{if(c&&c.st==='idle'&&c.items.some(it=>it.k===s.m.k&&!it.got&&!it.inbound)){if(c.pat<bp){bp=c.pat;best=ci;}}});
    if(best<0){s.shake=t;SFX.no();floatT(stRect(i).x+tile/2,stRect(i).y,'No order!','#e8574a');return;}
    const c=G.cust[best],it=c.items.find(x=>x.k===s.m.k&&!x.got&&!x.inbound);it.inbound=true;
    const q=stRect(i);FL.push({k:s.m.k,x0:q.x+tile/2,y0:q.y+tile/2,ci:best,it,t0:t});s.state='idle';SFX.send();}}
function deliver(f){const c=G.cust[f.ci];if(!c)return;f.it.got=true;f.it.inbound=false;c.bump=now();
  if(c.items.every(x=>x.got))pay(f.ci);}
function pay(ci){const c=G.cust[ci],base=c.items.reduce((a,it)=>a+MENU.find(m=>m.k===it.k).p*(it.k===G.special?2:1),0),frac=c.pat/c.pmax;
  G.combo++;const tip=Math.round(base*frac*0.6*Math.pow(1.2,SV.tips)),bonus=G.combo>=3?G.combo:0,tot=(base+tip+bonus+(G.rush?2:0))*(c.vip?2:1);
  SV.coins+=tot;G.earned+=tot;G.served++;c.st='out';c.t1=now();c.mood=1;SFX.pay();
  floatT(custX(ci),ledgeY()-bh*0.2,c.vip?`VIP ×2  +${tot}`:`+${tot}`,'#ffd34d',c.vip?1.5:1.3);if(tip>0)floatT(custX(ci),ledgeY()-bh*0.14,`tip ${tip}`,'#fff',0.8);if(bonus)floatT(W/2,ledgeY()-bh*0.26,`Combo x${G.combo}!`,'#ff8a3d',1.2);
  for(let k=0;k<10;k++)P.push({x:custX(ci),y:ledgeY()-bh*0.1,vx:rnd(-160,160),vy:rnd(-380,-160),life:1,k:'coin'});
  for(let k=0;k<6;k++)P.push({x:custX(ci),y:ledgeY()-bh*0.16,vx:rnd(-60,60),vy:rnd(-120,-40),life:1,k:'heart'});
  setTimeout(()=>{if(G)G.cust[ci]=null;},700);save();upd();}
function floatT(x,y,s,c,z=1){F.push({x,y,s,c,z,t0:now()});}

/* loop */
let last=now();
function step(dt){const t=now();G.t+=dt;
  if(!G.rush&&G.len-G.t<=22&&G.t<G.len){G.rush=true;G.rushT=now();SFX.bell();}
  if(G.t<G.len){G.nextCust-=dt;if(G.nextCust<=0){spawnCust();G.nextCust=clamp(rnd(3.2,6.5)-SV.day*0.18,1.6,6.5)*(G.rush?0.62:1);}}
  G.st.forEach(s=>{if(s.state==='cook'&&t-s.t0>=s.dur){s.state='ready';s.rt=t;SFX.ready();}});
  G.cust.forEach((c,ci)=>{if(!c||c.st!=='idle')return;c.pat-=dt;if(c.pat<=0){c.st='out';c.t1=t;c.mood=2;G.lost++;G.combo=0;SFX.angry();floatT(custX(ci),ledgeY()-bh*0.2,'Hmph!','#e8574a',1.1);
    FL.forEach(f=>{if(f.ci===ci)f.dead=true;});setTimeout(()=>{if(G)G.cust[ci]=null;},800);}});
  for(let i=FL.length-1;i>=0;i--){const f=FL[i];if(t-f.t0>380){if(!f.dead)deliver(f);FL.splice(i,1);}}
  if(G.t>=G.len&&!G.cust.some(c=>c&&c.st==='idle')&&!FL.length&&G.run){G.run=false;setTimeout(endDay,600);}
  else if(G.t>=G.len+12&&G.run){G.run=false;setTimeout(endDay,300);}
  upd();}
function spr(k,x,y,s){const im=ART[k];if(!im)return;ctx.drawImage(im,x-s/2,y-s/2,s,s);}
function box(x,y,w,h,fill,edge='#4a2c1d',sh=3){ctx.fillStyle=edge;ctx.fillRect(x+sh,y+sh,w,h);ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);ctx.lineWidth=3;ctx.strokeStyle=edge;ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);}
function draw(t){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);
  if(ART.bg)ctx.drawImage(ART.bg,bx,by,bw,bh);
  if(!G)return;
  // customers behind ledge
  const ly=ledgeY(),cs=Math.min(bh*0.2,W*0.3);
  G.cust.forEach((c,ci)=>{if(!c)return;let x=custX(ci),y=ly+cs*0.18,a=1;const age=(t-c.t0)/1000;
    if(c.st==='in'){const u=Math.min(1,age/0.5);y+=(1-u)*cs*0.8;if(u>=1)c.st='idle';}
    if(c.st==='out'){const u=(t-c.t1)/600;if(u>=1)return;y+=u*u*cs;a=1-u;}
    if(c.bump&&t-c.bump<200)y-=Math.sin((t-c.bump)/200*Math.PI)*8;
    const panic=c.st==='idle'&&c.pat/c.pmax<0.25;if(panic)x+=Math.sin(t*0.05)*2;
    ctx.globalAlpha=a;if(c.vip){ctx.fillStyle=`rgba(255,211,77,${0.35+0.15*Math.sin(t*0.008)})`;ctx.beginPath();ctx.arc(x,y-cs*0.5,cs*0.52,0,Math.PI*2);ctx.fill();}spr(c.a,x,y-cs*0.5+Math.sin(t*0.004+ci)*1.5,cs);ctx.globalAlpha=1;});
  // redraw ledge strip over customers
  if(ART.bg){const sy=0.432,ey=0.48;ctx.drawImage(ART.bg,0,ART.bg.height*sy,ART.bg.width,ART.bg.height*(ey-sy),bx,by+bh*sy,bw,bh*(ey-sy));}
  // bubbles
  G.cust.forEach((c,ci)=>{if(!c||c.st==='out')return;const x=custX(ci),n=c.items.length,is=Math.min(30,W*0.075),pad=5,w2=n*is+(n-1)*3+pad*2,h2=is+pad*2+8;
    const bxx=clamp(x-w2/2,4,W-w2-4),byy=ly-cs*1.08-h2;box(bxx,byy,w2,h2,c.vip?'#fff1b8':'#fff',c.vip?'#b8860b':'#4a2c1d');if(c.vip){spr('i_star',bxx-2,byy-2,22);ctx.font=FONT(10);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#b8860b';ctx.fillText('VIP',bxx+w2/2,byy-4);}
    c.items.forEach((it,j)=>{const ix=bxx+pad+j*(is+3)+is/2,iy=byy+pad+is/2;ctx.globalAlpha=it.got?0.35:1;spr(it.k,ix,iy,is);ctx.globalAlpha=1;if(it.k===G.special&&!it.got)spr('i_star',ix+is*0.38,iy-is*0.38,is*0.5);
      if(it.got){ctx.fillStyle='#4caf50';ctx.font=FONT(16);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',ix,iy);}});
    const fr=clamp(c.pat/c.pmax,0,1);ctx.fillStyle='#4a2c1d';ctx.fillRect(bxx+pad,byy+h2-8,w2-pad*2,5);ctx.fillStyle=fr>0.5?'#7cc36b':fr>0.25?'#ffd34d':'#e8574a';ctx.fillRect(bxx+pad,byy+h2-8,(w2-pad*2)*fr,5);});
  // stations
  G.st.forEach((s,i)=>{const q=stRect(i),pad=4;let ox=0;if(s.shake&&t-s.shake<300)ox=Math.sin((t-s.shake)*0.08)*4;
    const ready=s.state==='ready';box(q.x+pad+ox,q.y+pad,q.w-pad*2-3,q.h-pad*2-3,ready?'#fff6c2':s.state==='cook'?'#ffe2c8':'#fff3d6');
    const cx=q.x+q.w/2+ox-1.5,cy=q.y+q.h/2-1.5,is=tile*0.62;
    if(s.state==='idle'){ctx.globalAlpha=0.55;spr(s.m.k,cx,cy,is*0.9);ctx.globalAlpha=1;}
    else if(s.state==='cook'){const u=clamp((t-s.t0)/s.dur,0,1);spr(s.m.k,cx,cy,is*(0.55+0.4*u));
      ctx.lineWidth=5;ctx.strokeStyle='#4a2c1d';ctx.beginPath();ctx.arc(cx,cy,tile*0.36,-Math.PI/2,-Math.PI/2+Math.PI*2*u);ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#ff8a3d';ctx.stroke();
      if(Math.random()<0.15)P.push({x:cx+rnd(-10,10),y:cy-is*0.3,vx:rnd(-10,10),vy:rnd(-60,-30),life:1,k:'steam'});}
    else{const b=Math.abs(Math.sin((t-s.rt)*0.008))*4;spr(s.m.k,cx,cy-b,is*1.05);if(ART.i_sparkle&&Math.sin(t*0.01+i)>0.6)spr('i_sparkle',cx+is*0.4,cy-is*0.4,is*0.5);}
    ctx.font=FONT(10);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#4a2c1d';ctx.fillText(ready?'TAP!':s.m.n,cx,q.y+q.h-pad-6);
    if(s.m.k===G.special){ctx.fillStyle='#ffd34d';ctx.fillRect(q.x+pad+ox,q.y+pad,q.w-pad*2-3,13);ctx.font=FONT(9);ctx.fillStyle='#4a2c1d';ctx.fillText('★ SPECIAL ×2',cx,q.y+pad+10);}});
  // locked tiles preview
  for(let i=G.st.length;i<12;i++){const q=stRect(i);box(q.x+4,q.y+4,q.w-11,q.h-11,'rgba(255,243,214,.45)','rgba(74,44,29,.55)');spr('i_lock',q.x+q.w/2-1.5,q.y+q.h/2-6,tile*0.3);ctx.font=FONT(11);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='rgba(74,44,29,.85)';ctx.fillText(`Day ${i-1}`,q.x+q.w/2-1.5,q.y+q.h-14);}
  // flyers
  FL.forEach(f=>{const u=clamp((t-f.t0)/380,0,1),tx=custX(f.ci),ty=ly-cs*0.7;spr(f.k,f.x0+(tx-f.x0)*u,f.y0+(ty-f.y0)*u-Math.sin(u*Math.PI)*60,tile*0.5*(1-u*0.3));});
  // particles
  const dt=1/60;for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*(p.k==='steam'?1.6:1.1);if(p.k==='coin')p.vy+=900*dt;if(p.life<=0){P.splice(i,1);continue;}
    if(p.k==='coin')spr('i_coin',p.x,p.y,16);else if(p.k==='heart'){ctx.globalAlpha=p.life;spr('i_heart',p.x,p.y,14);ctx.globalAlpha=1;}
    else{ctx.globalAlpha=p.life*0.6;ctx.fillStyle='#fff';ctx.fillRect(p.x-3,p.y-3,6,6);ctx.globalAlpha=1;}}
  for(let i=F.length-1;i>=0;i--){const f=F[i],u=Math.max(0,(t-f.t0)/1000);if(u>=1){F.splice(i,1);continue;}ctx.save();ctx.globalAlpha=u>0.7?(1-u)/0.3:1;ctx.translate(clamp(f.x,60,W-60),f.y-u*36);
    const sc=(u<0.12?easeOutBack(u/0.12):1)*f.z;ctx.scale(sc,sc);ctx.font=FONT(18);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#4a2c1d';ctx.lineJoin='round';ctx.strokeText(f.s,0,0);ctx.fillStyle=f.c;ctx.fillText(f.s,0,0);ctx.restore();}
  if(G.rush&&G.run){const u=(t-G.rushT)/1000;if(u<2.2){const sc=u<0.2?easeOutBack(u/0.2):1;ctx.save();ctx.globalAlpha=u>1.8?(2.2-u)/0.4:1;ctx.translate(W/2,H*0.38);ctx.scale(sc,sc);box(-120,-24,240,48,'#e8574a','#4a2c1d',4);ctx.font=FONT(24);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('RUSH HOUR!',0,1);ctx.restore();}
    else{ctx.font=FONT(12);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=Math.floor(t/400)%2?'#ffd34d':'#fff';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText('RUSH HOUR +2',8,16);ctx.fillText('RUSH HOUR +2',8,16);}}
  if(G.spT&&t-G.spT<2600&&G.run){const u=(t-G.spT)/1000,sc=u<0.2?easeOutBack(u/0.2):1,m=MENU.find(x=>x.k===G.special);ctx.save();ctx.globalAlpha=u>2.2?(2.6-u)/0.4:1;ctx.translate(W/2,H*0.36);ctx.scale(sc,sc);box(-130,-34,260,68,'#fff3d6','#4a2c1d',4);
    spr(G.special,-92,0,48);ctx.font=FONT(13);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#e8574a';ctx.fillText("TODAY'S SPECIAL",-60,-12);ctx.font=FONT(18);ctx.fillStyle='#4a2c1d';ctx.fillText(`${m.n}  pays ×2`,-60,12);ctx.restore();}
  // final seconds warning
  const left=G.len-G.t;if(left>0&&left<10&&G.run){ctx.font=FONT(14);ctx.textAlign='center';ctx.fillStyle=Math.floor(t/300)%2?'#e8574a':'#fff';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText(`Closing in ${Math.ceil(left)}!`,W/2,ly+18);ctx.fillText(`Closing in ${Math.ceil(left)}!`,W/2,ly+18);}
  if(left<=0&&G.run){ctx.font=FONT(14);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.lineWidth=4;ctx.strokeStyle='#4a2c1d';ctx.strokeText('Finish the last orders!',W/2,ly+18);ctx.fillText('Finish the last orders!',W/2,ly+18);}}
function frame(t){const dt=Math.min(0.05,(t-last)/1000);last=t;if(G&&G.run)step(dt);draw(t);requestAnimationFrame(frame);}

/* day end + shop */
function endDay(){const gl=goalFor(SV.day),e=G.earned,st=e>=gl*2?3:e>=gl*1.5?2:e>=gl?1:0,win=st>0;
  SV.stars[SV.day]=Math.max(SV.stars[SV.day]||0,st);if(win){SV.day++;SFX.win();}else SFX.angry();save();showSummary(e,gl,st,win);}
function showSummary(e,gl,st,win){const p=$('dePanel'),SI=ART_SRC.i_star;
  p.innerHTML=`<h2>${win?'Day complete!':'Not quite…'}</h2><div class="stars">${[1,2,3].map(i=>`<img alt="" src="${SI}" class="${i<=st?'':'dim'}">`).join('')}</div>
   <div class="row"><span>Earned</span><b>${e}</b></div><div class="row"><span>Goal</span><b>${gl}</b></div><div class="row"><span>Served</span><b>${G.served}</b></div><div class="row"><span>Walked away</span><b>${G.lost}</b></div>
   <div id="shop"></div><p style="font-size:13px;margin:8px 0">${win&&unlocked(SV.day)>unlocked(SV.day-1)?`New station tomorrow: <b>${MENU[unlocked(SV.day)-1].n}</b>!`:''}</p>
   <button class="btn ${win?'alt':''}" id="nextDay">${win?`Start Day ${SV.day}`:`Retry Day ${SV.day}`}</button>`;
  renderShop();$('dayEnd').classList.remove('hide');$('nextDay').onclick=()=>{ac();$('dayEnd').classList.add('hide');startDay();};}
function renderShop(){const s=$('shop');s.innerHTML=`<p style="margin:10px 0 0;font-weight:700">Upgrades · <img alt="" src="${ART_SRC.i_coin}" style="width:18px;vertical-align:-3px;image-rendering:pixelated"> ${SV.coins}</p>`+
  UPG.map(u=>{const lv=SV[u.k],cost=u.c[lv];return `<div class="up"><img alt="" src="${ART_SRC[u.ic]}"><div><b>${u.n}</b><small>${u.d}</small><div class="pips">${'■'.repeat(lv)}${'□'.repeat(5-lv)}</div></div>
   ${cost===undefined?'<b>MAX</b>':`<button class="btn ${SV.coins>=cost?'':'off'}" data-u="${u.k}">${cost}</button>`}</div>`;}).join('');
  s.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=UPG.find(x=>x.k===b.dataset.u),cost=u.c[SV[u.k]];if(SV.coins<cost){SFX.no();return;}SV.coins-=cost;SV[u.k]++;SFX.win();save();renderShop();});}

$('play').textContent=`Start Day ${SV.day}`;
$('play').onclick=()=>{ac();$('title').classList.add('hide');startDay();};
layout();requestAnimationFrame(frame);
window.FTR={get G(){return G;},rect:stRect,end(){G.len=G.t+0.1;}};
}
</script>
</body>
