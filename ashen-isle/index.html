(()=>{

const glc=document.createElement('canvas'),glx=glc.getContext('2d'),g2c=document.createElement('canvas'),g2x=g2c.getContext('2d'),g3c=document.createElement('canvas'),g3x=g3c.getContext('2d');let gimg,gl8;
let W=0,H=0,cols=0,rows=0,cw=0,chh=0,fs=0,qscale=1,CH,CR,CG,CB,DEP,img,px8;

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.width=Math.max(64,Math.floor(innerWidth*dpr));H=cv.height=Math.max(64,Math.floor(innerHeight*dpr));

  cols=Math.ceil(W/cw);rows=Math.max(12,Math.floor(H/chh));chh=H/rows;

/* ---------- world ---------- */
const N=400,WS=200,MID=100,TOP=13;
const G=new Float32Array(N*N),O=new Float32Array(N*N),M=new Uint8Array(N*N),B=new Uint8Array(N*N);
let seed=90210;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const RT=new Float32Array(4096);for(let i=0;i<4096;i++)RT[i]=rnd();
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const x0=xi&63,x1=(xi+1)&63,y0=(yi&63)<<6,y1=((yi+1)&63)<<6;
  const a=RT[x0+y0],b=RT[x1+y0],c=RT[x0+y1],d=RT[x1+y1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>(vn(x,y)*.5+vn(x*2.1,y*2.1)*.25+vn(x*4.3,y*4.3)*.125+vn(x*8.7,y*8.7)*.0625)/.9375;
const sstep=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};
const sites=[],embers=[],hares=[];
function gen(){
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const x=i*.5,z=j*.5,dx=x-MID,dz=z-MID,r=Math.hypot(dx,dz),d=r/88;
    let g=(fbm(x*.03+7,z*.03+3)-.30-d*d*.5)*10;
    const w=sstep(11,6,r);g=g*(1-w)+2.6*w;
    G[i+j*N]=g<-2.5?-2.5:g;
  }
  const gA=(x,z)=>G[(x*2|0)+(z*2|0)*N];
  for(let k=0;k<5;k++){
    const a=k*Math.PI*2/5+rnd()*.6+.4;let sx=MID,sz=MID;
    for(let r=52;r>20;r-=2){sx=MID+Math.cos(a)*r;sz=MID+Math.sin(a)*r;if(gA(sx,sz)>1.1)break}

    for(let j=-16;j<=16;j++)for(let i=-16;i<=16;i++){
      const r=Math.hypot(i,j)*.5,w=sstep(7.5,4.5,r),k2=((sx*2|0)+i)+((sz*2|0)+j)*N;

    }
    sites.push({x:sx,z:sz,got:false});
    for(let p=0;p<6;p++){
      const pa=p*Math.PI/3+.3,ci=(sx+Math.cos(pa)*4)*2|0,cj=(sz+Math.sin(pa)*4)*2|0,hh=rnd()<.3?1.1:3+rnd()*1.2;
      for(let j=0;j<2;j++)for(let i=0;i<2;i++){const q=ci+i+(cj+j)*N;O[q]=hh;M[q]=3;B[q]=1}
    }
  }
  // spire
  for(let j=-10;j<=10;j++)for(let i=-10;i<=10;i++){
    const r=Math.hypot(i,j)*.5,q=(MID*2+i)+(MID*2+j)*N;
    if(r<1.7){O[q]=9;M[q]=3;B[q]=1}else if(r<3.1){O[q]=1.2;M[q]=3;B[q]=1}else if(r<4.4){O[q]=.35;M[q]=3}
  }
  const far=(x,z,d1,d2)=>{if(Math.hypot(x-MID,z-MID)<d2)return false;for(const s of sites)if(Math.hypot(x-s.x,z-s.z)<d1)return false;return true};
  for(let t=0;t<2600;t++){
    const x=20+rnd()*160,z=20+rnd()*160,g=gA(x,z);
    if(g<.9||g>4.3||vn(x*.07+9,z*.07)<.45||!far(x,z,8.5,12))continue;
    const hh=3.2+rnd()*2.4,rad=1.2+rnd()*.6,ci=x*2|0,cj=z*2|0,rr=Math.ceil(rad*2);
    for(let j=-rr;j<=rr;j++)for(let i=-rr;i<=rr;i++){
      const r=Math.hypot(i,j)*.5;if(r>=rad)continue;const q=ci+i+(cj+j)*N,v=hh*Math.pow(1-r/rad,.8);
      if(M[q]===3)continue;if(v>O[q]){O[q]=v;M[q]=1}
    }

  }

    const x=15+rnd()*170,z=15+rnd()*170,g=gA(x,z);

    const rad=.6+rnd()*.8,hh=rad*(.8+rnd()*.6),ci=x*2|0,cj=z*2|0,rr=Math.ceil(rad*2);
    for(let j=-rr;j<=rr;j++)for(let i=-rr;i<=rr;i++){
      const r=Math.hypot(i,j)*.5;if(r>=rad)continue;const q=ci+i+(cj+j)*N;if(M[q]===1||M[q]===3)continue;

function hAt(x,z){

function gAt(x,z){

  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.frequency.value=55;o2.frequency.value=82.7;g.gain.value=0;o.connect(g);o2.connect(g);g.connect(AC.destination);o.start();o2.start();droneG=g}catch(_){AC=null}}
function tone(f,d,type,vol,slide,delay){if(!AC)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);

function save(){try{localStorage.setItem('cairnlight1',JSON.stringify({g:sites.map(s=>s.got),b:beacon,e:embers.map(m=>m.got),m:P.max,w:wardenDead}))}catch(_){}}

const keys={};let joy=null,joyV={x:0,z:0},wantAtk=false,anyTap=false;

/* ---------- sprites ---------- */
const PL=[
 ["   _^_    ","  /o o\\   ","  \\_=_/   "," /#####\\  ","/|#####|\\ "," |#####| *"," /##|##\\  "," _|   |_  "],

/* ---------- render ---------- */

  {const l=Math.hypot(lx,ly,lz);lx/=l;ly/=l;lz/=l}
  {const k=1-.65*rain;lr*=k;lg*=k;lb*=k}
  const dn=sstep(-.25,.1,e),wk=1-.3*rain,ar=(.05+(.40-.06*hi-.05)*dn)*wk+flash*.7,ag=(.07+(.28+.12*hi-.07)*dn)*wk+flash*.75,ab=(.14+(.30+.20*hi-.14)*dn)*wk+flash*.9;
  let fr=.02+(.75-.19*hi-.02)*dn,fg=.03+(.45+.2*hi-.03)*dn,fb=.08+(.32+.4*hi-.08)*dn;{const gy=(fr+fg+fb)/3*.8;fr+=(gy-fr)*rain+flash*.4;fg+=(gy-fg)*rain+flash*.4;fb+=(gy*1.1-fb)*rain+flash*.5}
  const cloudy=sunI*(1-rain)>.1,ct=T*.05;
  const mA=Math.min(1,night*.5+sstep(.4,0,Math.abs(e))*.65+rain*.35),mr=fr*.8+.10,mg=fg*.8+.12,mb=fb*.8+.16;

  if(rain>.6&&Math.random()<dt*.1){flash=1;noise(1.8,80,.5,.25+Math.random()*.6);noise(1.2,160,.25,.4)}
  if(AC){const nt=sstep(.1,-.2,Math.sin(dayT*Math.PI*2));windN.g.gain.value=.035+.02*Math.sin(T*.37)+.03*rain;windN.fl.frequency.value=380+160*Math.sin(T*.23);rainN.g.gain.value=.05*rain;droneG.gain.value=state==='title'?.03:.035*nt}
  if(state==='title'){barTo=rows*.2;cam.d+=(1.75-cam.d)*dt;cam.x=MID+Math.sin(T*.11)*7;cam.z=MID+4+Math.cos(T*.14)*5;cam.y=2.6;
    if(anyTap&&titleT>1.2)start();anyTap=false;wantAtk=false;return}
  dayT=(dayT+dt/(beacon?90:250))%1;
  const e=Math.sin(dayT*Math.PI*2),night=sstep(.1,-.2,e);
  let mx=0,mz=0;
  if(state==='play'){
    if(keys.ArrowLeft||keys.KeyA)mx-=1;if(keys.ArrowRight||keys.KeyD)mx+=1;if(keys.ArrowUp||keys.KeyW)mz-=1;if(keys.ArrowDown||keys.KeyS)mz+=1;
    mx+=joyV.x;mz+=joyV.z;const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
  }
  P.moving=Math.hypot(mx,mz)>.15;
  if(P.moving){
    const wade=gAt(P.x,P.z)<-.05?.6:1,sp=7.2*wade*dt,nx=P.x+mx*sp,nz=P.z+mz*sp;
    if(!blocked(nx,P.z))P.x=nx;if(!blocked(P.x,nz))P.z=nz;
    const l=Math.hypot(mx,mz);P.fx=mx/l;P.fz=mz/l;if(Math.abs(mx)>.2)P.left=mx<0;P.up=mz<-.45;P.walk+=dt*9;
    if((P.walk/2|0)!==stepN){stepN=P.walk/2|0;if(wade<1)noise(.12,1500,.05);else{noise(.06,700+Math.random()*300,.05);burst(P.x,P.y+.1,P.z,2,'.,',.6,.55,.42,.8,.4)}}
    if(wade<1&&Math.random()<dt*14)burst(P.x,.1,P.z,1,"~'.",.7,.9,1,1.5,.5);
  }
  P.y=Math.max(0,gAt(P.x,P.z));P.inv-=dt;P.atk-=dt;P.cd-=dt;
  if(wantAtk&&state==='play'&&P.cd<=0){P.cd=.42;P.atk=.2;noise(.14,2600,.09);
    const a0=Math.atan2(P.fz,P.fx),ch=Math.abs(P.fx)>Math.abs(P.fz)?(P.fx>0?')':'('):(P.fz>0?'v':'^');
    for(let k=-5;k<=5;k++)for(let r=0;r<2;r++){const a=a0+k*.2,rr=2.1+r*.7;
      parts.push({x:P.x+Math.cos(a)*rr,y:P.y+1.3,z:P.z+Math.sin(a)*rr,vx:Math.cos(a)*3,vy:0,vz:Math.sin(a)*3,life:.16+r*.04,max:.2,ch:ch.charCodeAt(0),r:1,g:.95,b:.7,gr:0})}
    for(const s of shades){const dx=s.x-P.x,dz=s.z-P.z,d=Math.hypot(dx,dz);if(d<3.6&&(dx*P.fx+dz*P.fz)/(d+.01)>-.25){s.hp--;s.hit=.15;s.kx=dx/(d+.01)*14;s.kz=dz/(d+.01)*14;shake=.5;hitstop=.07;tone(190,.16,'square',.07,70);
      burst(s.x,s.y+1.5,s.z,6,"*+'",.8,.6,1,3,.5)}}
    if(warden){const w=warden,dx=w.x-P.x,dz=w.z-P.z,d=Math.hypot(dx,dz);if(d<4.6&&(dx*P.fx+dz*P.fz)/(d+.01)>-.25){w.hp--;w.hit=.15;hitstop=.08;shake=.7;tone(150,.2,'square',.08,60);burst(w.x,w.y+2.5,w.z,8,"*+'",1,.5,.3,4,.6)}}
  }
  wantAtk=false;anyTap=false;
  // sigils
  if(state==='play'){
    for(const s of sites)if(!s.got&&Math.hypot(s.x-P.x,s.z-P.z)<1.9){s.got=true;burst(s.x,s.y+1.8,s.z,34,"*+.'<>",.5,1,1,5,1.3);shake=.6;slow=1.3;[523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,'triangle',.09,0,i*.09));
      let n=0;for(const q of sites)if(q.got)n++;narr.length=0;narrT=0;
      if(n<5)say("Sigil "+["one","two","three","four"][n-1]+" of five.");else{say("The sigils hum as one.");say("Return to the spire.")}
      P.hp=Math.min(P.max,P.hp+1);rsx=s.x;rsz=s.z+2.5;if(blocked(rsx,rsz)){rsz=s.z}save()}
    for(const m of embers)if(!m.got&&Math.abs(m.x-P.x)<1.6&&Math.abs(m.z-P.z)<1.6){m.got=true;emb++;burst(m.x,P.y+1,m.z,10,"*'.",1,.6,.2,3,.7);tone(880,.18,'triangle',.07,1320);
      if(emb%4===0&&P.max<8){P.max++;P.hp=P.max;narr.length=0;narrT=0;say("Your flame grows stronger.")}save()}
    if(!beacon&&!wardenDead&&!warden&&sites.every(s=>s.got)&&Math.hypot(P.x-MID,P.z-MID)<17){warden={x:MID,z:MID+5.5,y:0,hp:12,hit:0,t:0,mode:0,dx:0,dz:0,life:0};rainTo=1;weatherT=999;
      narr.length=0;narrT=0;say("Something stirs beneath the spire.");say("The Hollow Warden wakes.");tone(45,3,'sawtooth',.12,35);shake=1;shades.forEach(s=>s.hp=0)}
    if(warden){const w=warden;w.life+=dt;w.hit-=dt;w.t+=dt;const dx=P.x-w.x,dz=P.z-w.z,d=Math.hypot(dx,dz)+.01;
      if(w.mode===0){if(w.life>1.5){w.x+=dx/d*2.7*dt;w.z+=dz/d*2.7*dt}if(w.t>3.2&&d<15){w.mode=1;w.t=0;tone(300,.7,'sawtooth',.06,90)}}
      else if(w.mode===1){if(w.t>.7){w.mode=2;w.t=0;w.dx=dx/d;w.dz=dz/d;noise(.5,300,.2)}}
      else{w.x+=w.dx*12.5*dt;w.z+=w.dz*12.5*dt;if(Math.random()<dt*40)burst(w.x,w.y+1,w.z,1,"~'",.6,.3,.9,2,.5);if(w.t>.55){w.mode=0;w.t=0}}
      w.y=Math.max(0,gAt(w.x,w.z));
      if(d<2.4&&P.inv<=0&&w.life>1.5)hurt(w.mode===2?2:1);
      if(w.hp<=0){burst(w.x,w.y+2.5,w.z,60,"~*+.'#",.7,.45,1,7,1.6);flash=1;shake=2;noise(2,70,.5);tone(220,1.5,'sawtooth',.08,30);wardenDead=true;warden=null;rainTo=0;weatherT=200;slow=1.2;
        narr.length=0;narrT=0;say("The Warden is unmade.");save()}}
    if(!beacon&&wardenDead&&sites.every(s=>s.got)&&Math.hypot(P.x-MID,P.z-MID)<9){beacon=true;state='end';endT=0;barTo=rows*.15;narr.length=0;narrT=0;
      say("The sigils rise.",2.5);shades.forEach(s=>s.hp=0);shake=1.2;rainTo=0;weatherT=200;save();tone(55,5,'sawtooth',.08,110);[262,330,392,523,659,784].forEach((f,i)=>tone(f,2.2,'triangle',.07,0,.3+i*.28))}
    P.regen+=dt*(night<.3?1:.3);if(P.regen>14){P.regen=0;if(P.hp<P.max)P.hp++}
    // shades
    spawnT-=dt;let got=0;for(const s of sites)if(s.got)got++;
    if(!beacon&&!warden&&night>.55&&spawnT<0&&shades.length<2+(got>>1)){spawnT=5+Math.random()*4;
      for(let n=0;n<10;n++){const a=Math.random()*6.28,x=P.x+Math.cos(a)*17,z=P.z+Math.sin(a)*17;if(gAt(x,z)>.2){const big=got>=2&&Math.random()<.4;shades.push({x,z,y:0,hp:big?4:2,big,hit:0,kx:0,kz:0,life:0,ph:Math.random()*9});tone(big?70:110,.9,'sine',.06,big?50:80);break}}}
  }
  if(night<.6)for(const h of hares){h.t-=dt;const dx=h.x-P.x,dz=h.z-P.z,d=Math.hypot(dx,dz)+.01;
    if(d<6){h.vx=dx/d*9;h.vz=dz/d*9;h.t=.6}else if(h.t<0){h.t=1+Math.random()*4;const a=Math.random()*6.28,bk=Math.hypot(h.x-h.hx,h.z-h.hz)>10;h.vx=bk?(h.hx-h.x)*.4:Math.cos(a)*3;h.vz=bk?(h.hz-h.z)*.4:Math.sin(a)*3}
    const sp=Math.hypot(h.vx,h.vz);if(sp>.3){const nx=h.x+h.vx*dt,nz=h.z+h.vz*dt;if(!blocked(nx,nz)&&gAt(nx,nz)>.1){h.x=nx;h.z=nz}h.hop+=dt*(6+sp);h.vx*=Math.pow(.2,dt);h.vz*=Math.pow(.2,dt)}else h.hop=0}
  for(let i=shades.length-1;i>=0;i--){const s=shades[i];s.life+=dt;s.hit-=dt;
    const dx=P.x-s.x,dz=P.z-s.z,d=Math.hypot(dx,dz)+.01,sp=state==='play'?(s.big?2.6:3.3):0;
    s.x+=(dx/d*sp+s.kx)*dt;s.z+=(dz/d*sp+s.kz)*dt;s.kx*=Math.pow(.01,dt);s.kz*=Math.pow(.01,dt);s.y=Math.max(0,gAt(s.x,s.z));
    if(d<(s.big?1.9:1.4)&&P.inv<=0&&state==='play'&&s.life>.8){s.kx=-dx/d*10;s.kz=-dz/d*10;hurt(1)}
    if(s.hp<=0||night<.2||d>45){burst(s.x,s.y+1.5,s.z,16,"~.'*",.6,.4,.95,3.5,.9);shades.splice(i,1)}}
  if(state==='dead'){deadT+=dt;if(deadT>2.6){P.x=rsx;P.z=rsz;P.hp=P.max;P.inv=2;dayT=.03;shades.length=0;if(warden){warden=null;rainTo=0;weatherT=120}fadeTo=1;state='play';say("You wake by cold stone. Dawn.")}}
  if(state==='end'){endT+=dt;cam.d+=(2.3-cam.d)*dt*.35;
    if(endT>3&&endT-dt<=3)say("The beacon burns again.",3);
    if(endT>8&&anyTapLatch){state='play';barTo=2;say("The isle is yours to wander.")}}
  else if(state!=='title')cam.d+=((slow>0?.74:warden?1.25:P.moving?1.07:1)-cam.d)*Math.min(1,dt*(slow>0?6:.9));
  anyTapLatch=false;
  if(beacon&&Math.random()<dt*30)parts.push({x:MID+(Math.random()-.5)*2,y:12,z:MID+(Math.random()-.5)*2,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,vz:(Math.random()-.5)*2,life:2,max:2,ch:42,r:1,g:.7,b:.3,gr:-.5});
  if(night<.3&&rain<.3&&state!=='title'&&Math.random()<dt*6)parts.push({x:cam.x+(Math.random()-.5)*36,y:cam.y+1+Math.random()*5,z:cam.z+(Math.random()-.6)*28,vx:.8+Math.random(),vy:-.3-Math.random()*.4,vz:(Math.random()-.5),life:4,max:4,ch:Math.random()<.5?46:44,r:1,g:.92,b:.55,gr:0});
  if(night>.4&&Math.random()<dt*7)parts.push({x:cam.x+(Math.random()-.5)*34,y:cam.y+1+Math.random()*3,z:cam.z+(Math.random()-.6)*26,vx:(Math.random()-.5),vy:(Math.random()-.3)*.6,vz:(Math.random()-.5),life:3,max:3,ch:46,r:.8,g:1,b:.4,gr:0});
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=p.gr*dt}
  const k=Math.min(1,dt*3.2),tx=state==='end'?MID:P.x+P.fx*(P.moving?2:0),tz=state==='end'?MID:P.z+P.fz*(P.moving?1.5:0)-1.2;
  cam.x+=(tx-cam.x)*k;cam.z+=(tz-cam.z)*k;cam.y+=(P.y-cam.y)*Math.min(1,dt*2);
}
let anyTapLatch=false;

/* ---------- input ---------- */
addEventListener('keydown',ev=>{if(ev.repeat)return;audioInit();keys[ev.code]=true;anyTap=anyTapLatch=true;if(ev.code==='Space'||ev.code==='Enter'||ev.code==='KeyJ')wantAtk=true;if(ev.code.startsWith('Arrow')||ev.code==='Space')ev.preventDefault()});
addEventListener('keyup',ev=>{keys[ev.code]=false});
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();audioInit();anyTap=anyTapLatch=true;
  if(joy){wantAtk=true;return}
  joy={id:ev.pointerId,ox:ev.clientX,oy:ev.clientY,t:performance.now(),moved:false,touch:ev.pointerType!=='mouse'};try{cv.setPointerCapture(ev.pointerId)}catch(_){}} );
cv.addEventListener('pointermove',ev=>{if(!joy||ev.pointerId!==joy.id)return;const dx=ev.clientX-joy.ox,dy=ev.clientY-joy.oy,l=Math.hypot(dx,dy),R=46;
  if(l>10)joy.moved=true;if(joy.moved){const m=Math.min(1,l/R);joyV.x=dx/(l||1)*m;joyV.z=dy/(l||1)*m;if(l>R*1.6){joy.ox=ev.clientX-dx/l*R*1.6;joy.oy=ev.clientY-dy/l*R*1.6}}});
const up=ev=>{if(!joy||ev.pointerId!==joy.id)return;if(!joy.moved&&performance.now()-joy.t<350)wantAtk=true;joy=null;joyV.x=joyV.z=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy=null;joyV.x=joyV.z=0});
cv.addEventListener('contextmenu',ev=>ev.preventDefault());

/* ---------- loop ---------- */
gen();resize();addEventListener('resize',resize);
let lt=0,slowN=0,avg=16;
function frame(ms){
  const dt=Math.min(.05,(ms-lt)/1000||.016);lt=ms;
  const t0=performance.now();if(hitstop>0)hitstop-=dt;else update(slow>0?dt*.35:dt);render();const el=performance.now()-t0;avg+=(el-avg)*.05;
  if(avg>30){if(++slowN>50&&qscale<1.7){qscale*=1.15;slowN=0;avg=16;resize()}}else slowN=0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game={P,sites,embers,get warden(){return warden},update,render,cam,dbg(o){if('dayT'in o)dayT=o.dayT;if('rain'in o){rain=rainTo=o.rain;weatherT=999}},get state(){return state}};
})();
</script></body></html>
