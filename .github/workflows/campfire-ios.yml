name: Campfire iOS

# The native iPhone app: compiles on a GitHub Mac, takes simulator screenshots, uploads to TestFlight.
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/campfire-ios/**'
      - '.github/workflows/campfire-ios.yml'

permissions:
  contents: write

concurrency:
  group: campfire-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/campfire-ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # The app ships with a copy of the guide so a first launch works with no signal. Take the newest one from the site;
      # if the site does not answer, the copy already in the repo is used.
      - name: Refresh the guide packed inside the app
        run: |
          if curl -fsS --max-time 30 https://qcampfire.com/api/guide -o /tmp/guide.json && grep -q '"lists"' /tmp/guide.json; then cp /tmp/guide.json Resources/guide.json; fi
          ls -l Resources/guide.json

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      # Built unsigned: the export step does the real signing.
      - name: Compile
        id: archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Campfire.xcodeproj -scheme Campfire -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 60

      - name: Screenshots in the simulator
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          xcodebuild build \
            -project Campfire.xcodeproj -scheme Campfire -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 15
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Campfire.app"
          # A Pro Max simulator gives screenshots at the size the App Store asks for.
          LINE=$(xcrun simctl list devices available | grep -E "iPhone.*Pro Max" | head -1)
          if [ -z "$LINE" ]; then LINE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1); fi
          UDID=$(echo "$LINE" | grep -oE "[0-9A-F-]{36}")
          echo "simulator $LINE"
          echo "$LINE" > "$RUNNER_TEMP/simulator.txt"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          for shot in list ad post guide areamap shows alerts map; do
            xcrun simctl terminate "$UDID" com.brianward.quartzsitecampfire 2>/dev/null || true
            if [ "$shot" = list ]; then
              xcrun simctl launch "$UDID" com.brianward.quartzsitecampfire
            else
              xcrun simctl launch "$UDID" com.brianward.quartzsitecampfire "-demo-$shot"
            fi
            sleep 12
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$shot.png"
          done

      - name: Sign and upload to TestFlight
        id: testflight
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 30
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log" | tail -n 30

      - name: Remove the key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # The result (compile errors, upload outcome, screenshots) goes to a scratch branch so it can be read without signing in.
      - name: Publish the build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outcome }}
          TESTFLIGHT: ${{ steps.testflight.outcome }}
        run: |
          OUT="$RUNNER_TEMP/logout"; mkdir -p "$OUT"; cd "$OUT"
          {
            echo "run $GITHUB_RUN_NUMBER  commit $GITHUB_SHA"
            echo "compile: $ARCHIVE   testflight: $TESTFLIGHT"
            echo "---- compile errors"
            grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/build.log" | sort -u | head -n 120 || true
            echo "---- export"
            grep -iE "error|\*\* EXPORT" "$RUNNER_TEMP/export.log" | head -n 30 || true
            echo "---- upload"
            tail -n 25 "$RUNNER_TEMP/upload.log" || true
          } 2>/dev/null | sed -e "s/${ASC_KEY_ID:-no-key-id}/***/g" -e "s/${ASC_ISSUER_ID:-no-issuer-id}/***/g" > log.txt
          for f in "$RUNNER_TEMP"/shots/*.png; do
            if [ -f "$f" ]; then sips -Z 1300 "$f" --out "$OUT/$(basename "$f")" >/dev/null 2>&1 || true; fi
          done
          # Full-size copies for the App Store listing.
          mkdir -p store
          cp "$RUNNER_TEMP"/shots/*.png store/ 2>/dev/null || true
          cp "$RUNNER_TEMP/simulator.txt" store/ 2>/dev/null || true
          git init -q
          git checkout -q -b campfire-ios-buildlog
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -qm "Campfire iOS build $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/campfire-ios-buildlog
