'use strict';
/* LONG DUSK — an ASCII RPG. Single file, canvas-rendered glyph world. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Courier New",ui-monospace,Menlo,Consolas,monospace';
let W=0,H=0,DPR=1,CW=20,CH=24,FS=22,vign=null;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
const rgb=(r,g,b)=>'rgb('+(r<0?0:r>255?255:r|0)+','+(g<0?0:g>255?255:g|0)+','+(b<0?0:b>255?255:b|0)+')';
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+(a<0?0:a>1?1:a).toFixed(3)+')';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR|0;cv.height=H*DPR|0;
  CH=clamp(Math.max(H/38,W/100/.56),12,26);CW=CH*.56;FS=Math.round(CH*.95);GY=Math.round(H*.72);
  vign=document.createElement('canvas');vign.width=Math.max(2,W>>1);vign.height=Math.max(2,H>>1);
  const g=vign.getContext('2d'),gr=g.createRadialGradient(vign.width/2,vign.height/2,Math.min(vign.width,vign.height)*.25,vign.width/2,vign.height/2,Math.hypot(vign.width,vign.height)*.56);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.82)');g.fillStyle=gr;g.fillRect(0,0,vign.width,vign.height);
}

/* ---------------- audio ---------------- */
let AC=null,master=null,ambF=null,ambG=null,nbuf=null,muted=false,musT=1,musRoot=110;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
    nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;ambF=AC.createBiquadFilter();ambF.type='lowpass';ambF.frequency.value=300;ambG=AC.createGain();ambG.gain.value=.05;
    s.connect(ambF);ambF.connect(ambG);ambG.connect(master);s.start()}catch(e){AC=null}}
function setAmb(i){musRoot=[110,98,82.4,130.8][i<0?3:i];if(!AC)return;const f=[420,2600,160,300][i<0?3:i],g=[.05,.09,.07,.05][i<0?3:i];
  try{ambF.frequency.setTargetAtTime(f,AC.currentTime,.8);ambG.gain.setTargetAtTime(g,AC.currentTime,.8)}catch(e){}}
function tone(f,d,type,v,slide){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noiz(d,v,fq){if(!AC||muted)return;try{const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='lowpass';f.frequency.value=fq||800;
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.02)}catch(e){}}
function pad(f,d,v){if(!AC||muted)return;try{const t=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(master);
  for(const dt of[-5,5]){const o=AC.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=dt;o.connect(g);o.start(t);o.stop(t+d+.05)}}catch(e){}}
const SCALE=[0,3,5,7,10,12,15];
function music(dt){musT-=dt;if(musT>0)return;musT=2+Math.random()*2.2;pad(musRoot*Math.pow(2,SCALE[Math.random()*SCALE.length|0]/12)*2,4.5,.04);
  if(Math.random()<.45)pad(musRoot*Math.pow(2,SCALE[Math.random()*3|0]/12),6,.05)}
const later=(f,ms)=>setTimeout(f,ms);
const sfx={
  step(w){noiz(.04,w?.05:.022,w?1800:480)},
  hit(){noiz(.08,.16,1500);tone(180,.08,'square',.07,-90)},
  crit(){noiz(.14,.22,2600);tone(320,.16,'sawtooth',.09,-220)},
  hurt(){tone(110,.2,'sawtooth',.12,-60);noiz(.12,.14,600)},
  pick(){tone(880,.07,'square',.05);later(()=>tone(1320,.09,'square',.05),60)},
  chest(){[523,659,784].forEach((f,i)=>later(()=>tone(f,.14,'triangle',.1),i*80))},
  lvl(){[392,523,659,784,1047].forEach((f,i)=>later(()=>tone(f,.2,'triangle',.1),i*90))},
  rest(){pad(220,2.5,.08);pad(330,2.5,.06)},
  thunder(){noiz(1.8,.35,220)},
  boom(){noiz(1.2,.4,160);tone(70,.9,'sine',.3,-35)},
  die(){tone(220,1.2,'sawtooth',.1,-180)},
  drink(){tone(500,.25,'sine',.1,400)},
  alert(){tone(660,.1,'square',.04,200)},

};

/* ---------------- palette & grids ---------------- */
const PAL=[];const pc=(r,g,b,o)=>PAL.push(Object.assign({c:[r,g,b],sway:0,flame:0,emit:0},o||{}))-1;
const C={NONE:pc(0,0,0),SOIL:pc(128,98,64),SOILD:pc(74,58,42),GRASS:pc(84,176,82,{sway:1}),TURF:pc(64,142,64),FLOWER:pc(240,135,180),ROCK:pc(135,135,140),
  TRUNK:pc(104,78,54),LEAF:pc(44,128,60),LEAF2:pc(64,154,74),BUSH:pc(34,92,50),MUD:pc(104,94,68),REED:pc(134,158,78,{sway:1}),DEAD:pc(118,114,106),MOSS:pc(74,116,88),
  STONE:pc(128,128,150),STONED:pc(66,66,84),BRICK:pc(78,78,100),BANNER:pc(160,44,44),WOOD:pc(156,114,68),FLAME:pc(255,170,60,{emit:1,flame:1}),
  SHROOM:pc(110,235,225,{emit:.9}),IRON:pc(96,96,108),FORE:pc(40,48,46)};
const CHS=[];for(let i=0;i<128;i++)CHS.push(String.fromCharCode(i));
const OFF=70,RWS=50,GB=34;let GY=0;
function grid(w){return{w,ch:new Uint8Array(w*RWS),pl:new Uint8Array(w*RWS),bg:new Uint8Array(w*RWS)}}
function setc(g,x,y,ch,p,bg){x+=OFF;if(x<0||x>=g.w||y<0||y>=RWS)return;const c=x+y*g.w;g.ch[c]=typeof ch==='string'?ch.charCodeAt(0):ch;g.pl[c]=p;g.bg[c]=bg?1:0}
function put(g,x,y,s,p,bg){for(let i=0;i<s.length;i++)if(s[i]!==' ')setc(g,x+i,y,s[i],p,bg)}
const pickc=(s,h)=>s[Math.min(s.length-1,(h*s.length)|0)];

/* ---------------- sprites ---------------- */
const norm=a=>{const w=Math.max(...a.map(s=>s.length));return a.map(s=>s.padEnd(w))};
const MIR={'/':'\\','\\':'/','(':')',')':'(','<':'>','>':'<','[':']',']':'[','{':'}','}':'{'};

const HERO={cx:4.5,
  idle:mk(HEAD,['  /|#|\\*',' / |#|'],LEGS[0]),
  walk:[1,2,3,4].map(i=>mk(HEAD,['  /|#|\\*',' / |#|'],LEGS[i])),

  a1:mk(HEAD,['  *|#|-===>','   |#|'],['   / \\_','  /    \\']),
  a2:mk(HEAD,['  *|#|\\','   |#| \\'],['   / \\  `-','  _| |_']),
  hurt:mk(['  .-.','  |x<'],[' \\|#|/*','  |#|'],['  / /',' /_/_']),
  dead:norm(['','','','',' ___.-._','/_#_#|x>  *'])};
const SPR={
  wolf:{f:[['  ,/|_______',' <o   ,     \\~','  `V-(  __  )','   /_/   \\_\\'],['  ,/|_______',' <o   ,     \\~','  `V-(  __  )','    \\_\\ /_/']]},
  goblin:{f:[[' ,___,',' (o o)','<-]H[\\','  / \\'],[' ,___,',' (o o)','<-]H[\\','  | |']]},
  elder:{f:[['    /\\   /\\','   /  \\_/  \\_____________','  / o        ~~~~~~~~     \\',' <__    ,   ~~~~~~~~~~~    \\~~','   VVV-(                   )','       |  |\\________/|  |\\/','      /_/ /_/       /_/ /_/'],
            ['    /\\   /\\','   /  \\_/  \\_____________','  / o        ~~~~~~~~     \\',' <__    ,   ~~~~~~~~~~~    \\~~','   VVV-(                   )','       |  |\\________/|  |\\/','       \\_\\ \\_\\     \\_\\ \\_\\']]},
  toad:{f:[['  _o__o_',' (  --  )',' /_\\__/_\\'],['  _o__o_',' (  --  )',' /_/  \\_\\']]},
  wisp:{f:[[' .*.','* o *',' \'*\''],[' *.*','. o .',' *\'*']]},
  drowned:{f:[['  ,~,',' (o o)','==|~|\\','  |~| \\','  | |',' _| |_'],['  ,~,',' (o o)','==|~|\\','  |~| \\','  |  \\',' _|  _\\']]},
  hag:{f:[['     /\\','    /  \\','  _/____\\_','   (o  o)',' Y  |%%|\\',' |=/|%%| \\',' |  |%%|',' | /%%%%\\',' |/%%%%%%\\'],['     /\\','    /  \\','  _/____\\_','   (o  o)',' Y  |%%|\\',' |=/|%%| \\',' |  |%%|',' |  /%%%%\\',' | /%%%%%%\\']]},
  skel:{f:[['  .-.',' (o o)','<--+-.','  /#\\ \\','  / \\',' _| |_'],['  .-.',' (o o)','<--+-.','  /#\\ \\','  | \\',' _|  \\_']]},
  knight:{f:[['   ,=.','  [|-|]',' /[###]\\','<=[###](O)','  [###]','  /   \\',' _|   |_'],['   ,=.','  [|-|]',' /[###]\\','<=[###](O)','  [###]','  |   \\',' _|    \\_']]},
  shade:{f:[['  ,^,',' (o o)',' /)~(\\','  (~)','   v'],['  ,^,',' (o o)',' /)~(\\','  )~(','   \'']]},
  king:{f:[['     \\|/|\\|/','     |WWWWW|','    /  o o  \\','    \\  ===  /','   __\\_____/__','  /  |#####|  \\',' /   |#####|   \\','<====|#####|   (O)','     |#####|','     /## ##\\','   _/##/ \\##\\_'],
           ['     \\|/|\\|/','     |WWWWW|','    /  o o  \\','    \\  ===  /','   __\\_____/__','  /  |#####|  \\',' /   |#####|   \\','<====|#####|   (O)','     |#####|','     |## ##|','   _/##| |##\\_']]}};
for(const k in SPR)SPR[k].f=SPR[k].f.map(norm);
const FIREF=[['  )',' (^)','/_=_\\'],['  (',' )^(','/_=_\\'],['  \'',' (*)','/_=_\\'],['  ^',' {^}','/_=_\\']].map(norm);
const CHESTF=[norm([' ___','[_o_]']),norm(['\\___/','[   ]'])];
const GATEF=norm(['  _____',' /     \\','|  :::  |','|  :::  |','|  :::  |','|  :::  |','|  :::  |']);
const BEACF=norm([' \\     /','  \\___/','   | |','   | |','  _| |_',' /_____\\']);
const BEACL=[norm(['   ) (','  (^^^)',' (^^*^^)']),norm(['   ( )','  )^^^(',' (^*^^^)'])];

/* ---------------- monsters ---------------- */
const MON={
  wolf:{c:[175,175,190],hp:9,atk:4,def:0,xp:4,spd:11,reach:8,hw:6,wind:.42,acd:.9},
  goblin:{c:[120,200,90],hp:13,atk:5,def:0,xp:6,spd:7.5,reach:5.5,hw:3,wind:.45,acd:.9},
  elder:{c:[235,235,255],hp:60,atk:9,def:1,xp:30,spd:9,reach:15,hw:13,wind:.55,acd:1.1,boss:1,title:'THE ELDER WOLF'},
  toad:{c:[150,190,90],hp:18,atk:8,def:1,xp:9,spd:6,reach:6,hw:4,wind:.5,acd:1,hop:1},
  wisp:{c:[140,210,255],hp:9,atk:8,def:0,xp:8,spd:10,reach:4.5,hw:2,wind:.4,acd:.8,fly:1,light:[.35,.65,1.05]},
  drowned:{c:[110,160,150],hp:34,atk:12,def:2,xp:14,spd:4.5,reach:5.5,hw:3,wind:.6,acd:1.1},
  hag:{c:[190,255,170],hp:130,atk:15,def:3,xp:60,spd:5.5,reach:8,hw:5,wind:.55,acd:1,boss:1,title:'THE FEN HAG',light:[.4,.9,.4]},
  skel:{c:[225,225,205],hp:28,atk:13,def:2,xp:14,spd:7,reach:5.5,hw:3,wind:.45,acd:.9},
  knight:{c:[150,170,215],hp:44,atk:15,def:4,xp:22,spd:5,reach:7,hw:4.5,wind:.6,acd:1.1},

/* ---------------- region generation ---------------- */
let R=null;
function addEnt(R,k,x){const d=MON[k],e={k,x,fy:0,hp:Math.round(d.hp*1.5),mhp:Math.round(d.hp*1.5),face:-1,awake:false,met:false,wind:0,acd:0,atkT:0,flash:0,kb:0,anim:Math.random()*10,p2:false,mv:false};R.ents.push(e);return e}
function genRegion(kind,seed){const rnd=mulberry(seed),len=[520,560,600][kind],o=rnd()*900,gw=len+OFF*2;
  const R={kind,len,ents:[],items:[],chests:[],lights:[],locked:kind<2,kingDead:false,wl:kind===1?GB+1:0,
    name:['THE HOLLOW WOOD','THE DROWNED FEN','THE SUNKEN KEEP'][kind],sub:['CHAPTER I','CHAPTER II','CHAPTER III'][kind],hint:['East, through the trees.','East, toward the pale light.','Find the Beacon.'][kind],
    amb:[[.2,.25,.38],[.17,.22,.25],[.11,.11,.17]][kind],fog:[[40,70,60],[60,80,90],[50,40,60]][kind],rain:kind===1,dust:kind===2};
  const fx=[20,Math.round(len*.5),len-92];R.fires=fx.map(x=>({x}));R.gate=kind<2?{x:len-14}:null;R.beacon=kind===2?{x:len-16,lit:false}:null;
  const fr=kind===1?15:10,flat=x=>x<34||x>len-64||fx.some(f=>Math.abs(x-f)<fr);
  R.gh=new Int16Array(gw);let prev=GB;
  for(let i=0;i<gw;i++){const x=i-OFF;let h=kind===0?Math.min(GB+2,GB-Math.round((vnoise(x/26+o,1)-.5)*9)):kind===1?Math.min(GB+3,GB+1-Math.round((vnoise(x/16+o,2)-.5)*8)):GB-2*Math.round((vnoise(x/38+o,3)-.5)*3.4);
    if(flat(x))h=kind===1?Math.min(prev,GB):prev;h=clamp(h,prev-1,prev+1);if(i%2)h=prev;R.gh[i]=prev=h}
  const g=R.play=grid(gw);
  for(let i=0;i<gw;i++){const x=i-OFF,h=R.gh[i];
    for(let r=h;r<RWS;r++){const hs=hash(x*7+kind,r*13);let ch,p;
      if(r===h){ch=kind===0?pickc('mwnvmw',hs):kind===1?pickc('.,-_.~',hs):pickc('====-=',hs);p=kind===0?C.TURF:kind===1?C.MUD:C.STONE}
      else if(kind===2){ch=((x+(r&1)*3)%6+6)%6===0?'|':'_';p=r<h+3?C.BRICK:C.STONED}
      else{ch=hs<.5?' ':pickc('.:,;\'o',hs*2-1);p=r<h+3?C.SOIL:C.SOILD}
      setc(g,x,r,ch,p,1)}
    const hs=hash(x*3+kind*77,5),wet=R.wl&&h>R.wl;if(fx.some(f=>Math.abs(x-f)<4))continue;
    if(kind===0){if(hs<.3)setc(g,x,h-1,pickc('"\',v"',hs*3.3),C.GRASS);else if(hs<.34){setc(g,x,h-1,'|',C.GRASS);setc(g,x,h-2,'*',C.FLOWER)}else if(hs<.355)put(g,x,h-1,'(_)',C.ROCK);else if(hs<.37)setc(g,x,h-1,'T',C.SHROOM)}
    else if(kind===1){if(wet){if(hs<.25)for(let k=1;k<=2+((hs*40|0)%3);k++)setc(g,x,R.wl-k,k===1?'|':pickc('|!/',hash(x,k)),C.REED)}else if(hs<.2)setc(g,x,h-1,pickc('",;',hs*5),C.REED);else if(hs<.23)setc(g,x,h-1,'T',C.SHROOM);else if(hs<.245)put(g,x,h-1,'(_)',C.ROCK)}
    else{if(hs<.06)setc(g,x,h-1,pickc('.,%;',hs*16),C.STONE);
      if(((x%28)+28)%28===14&&x>30&&x<len-6){setc(g,x,h-8,'*',C.FLAME);setc(g,x,h-7,'Y',C.IRON);setc(g,x,h-6,'|',C.IRON);R.lights.push({x,row:h-8,r:11,c:[1.05,.65,.28]})}}}
  for(let i=0,tr=0;i<4&&tr<200;tr++){const x=70+(rnd()*(len-190)|0);if(fx.some(f=>Math.abs(x-f)<22)||R.chests.some(c=>Math.abs(c.x-x)<34))continue;R.chests.push({x,open:false});i++}
  const pick3=p=>{const q=rnd();if(kind===0)return p<.25||q<.5?'wolf':'goblin';if(kind===1)return p<.3?(q<.6?'toad':'wisp'):q<.35?'toad':q<.65?'wisp':'drowned';return p<.3?(q<.75?'skel':'shade'):q<.35?'skel':q<.7?'knight':'shade'};
  for(let x=62;x<len-80;x+=13+rnd()*14){if(fx.some(f=>Math.abs(x-f)<26))continue;const k=pick3(x/len);addEnt(R,k,x);if(k==='wolf'&&rnd()<.4)addEnt(R,'wolf',x+7)}
  R.boss=addEnt(R,['elder','hag','king'][kind],len-46);
  for(const e of R.ents)e.fy=R.gh[Math.round(e.x)+OFF]-1;
  R.mid=genMid(R,rnd);R.fore=genFore(R,rnd);return R}
function genMid(R,rnd){const kind=R.kind,w=Math.ceil(R.len*.6)+OFF*2,g=grid(w),X0=-OFF,X1=w-OFF;
  if(kind===0){const MG=GB-3;
    for(let x=X0;x<X1;x++){const top=MG-Math.round(vnoise(x/5,7)*3);for(let r=top;r<RWS;r++)setc(g,x,r,r===top?pickc('^"*^n',hash(x,r)):hash(x,r)<.3?pickc('.:\'',hash(r,x)):' ',C.BUSH,1)}
    for(let x=X0+2;x<X1-4;x+=6+(rnd()*8|0)){const tw=2+(rnd()*2|0),th=13+(rnd()*13|0),top=Math.max(2,MG-th),rx=5+rnd()*5,ry=3+rnd()*2.5,cx=x+tw/2,cy=top+1,lp=rnd()<.5?C.LEAF:C.LEAF2;
      for(let r=top;r<MG+1;r++)for(let i=0;i<tw;i++)setc(g,x+i,r,i===0||i===tw-1?'|':':',C.TRUNK,1);
      for(let r=Math.floor(cy-ry);r<=cy+ry;r++)for(let c=Math.floor(cx-rx);c<=cx+rx;c++){const d=((c-cx)/rx)**2+((r-cy)/ry)**2,h=hash(c*5+x,r*3);if(d<1&&(d<.6||h<.65))setc(g,c,r,pickc('&%@#&%*',h),h<.3?C.LEAF2:lp,1)}}}
  else if(kind===1){const MG=GB-1;
    for(let x=X0;x<X1;x++){const top=MG-Math.round(vnoise(x/7,9)*2);for(let r=top;r<RWS;r++){const h=hash(x,r);setc(g,x,r,r===top?pickc('~-_~',h):h<.25?pickc('~-.',h*4):' ',C.MOSS,1)}
      if(hash(x,3)<.18)for(let k=1;k<=1+(hash(x,4)*3|0);k++)setc(g,x,top-k,'|',C.REED)}

const P={},cam={x:0,y:GB,zoom:1,la:0},parts=[],JOY={on:false,id:-1,ox:0,oy:0,x:0,y:0},keys=[];
const G={state:'boot',t:0,region:0,cine:null,lb:0,msg:'',msgT:0,shake:0,hurt:0,flash:0,hitstop:0,slow:0,bolt:0,boltT:6,bolt2:0};

/* ---------------- gameplay ---------------- */
sfx.swing=()=>noiz(.08,.07,3400);
function gainXP(n){P.xp+=n;while(P.xp>=need(P.lv)){P.xp-=need(P.lv);P.lv++;P.mhp+=6;P.atk++;if(P.lv%4===0)P.def++;P.hp=P.mhp;G.flash=.35;ring(P.x,P.fy-3,[255,230,140],'+');num(P.x,P.fy-8,'LEVEL '+P.lv,[255,230,140],1.6);sfx.lvl()}}
const PREACH=7;
function target(){let b=null,bd=1e9;for(const e of R.ents){const d=Math.abs(e.x-P.x)-MON[e.k].hw*.6;if(d<PREACH&&d<bd){bd=d;b=e}}return b}
function swing(){const fx=P.x+P.face*5,fy=P.fy-3;for(let i=-2;i<=2;i++)part(fx+(2-Math.abs(i))*P.face*.8,fy+i*.9,P.face*6,0,.14,P.face>0?(i<0?'\\':i>0?'/':')'):(i<0?'/':i>0?'\\':'('),[255,250,230],{sz:1.2});

function strike(e){const d=MON[e.k];let dmg=Math.max(1,P.atk-d.def+(Math.random()*3|0)),crit=Math.random()<.12;if(crit)dmg*=2;
  e.hp-=dmg;e.flash=.14;e.awake=true;e.kb=P.face*(d.boss?4:crit?16:10);G.hitstop=crit?.09:.045;G.shake=Math.max(G.shake,crit?.5:.25);
  const ey=e.fy-2;burst(e.x,ey,'*',d.c,crit?12:6);num(e.x,ey-3,crit?dmg+'!':''+dmg,crit?[255,220,90]:[255,255,255],crit?2:1.4);crit?sfx.crit():sfx.hit();
  if(e.k==='king'&&!e.p2&&e.hp>0&&e.hp<e.mhp/2){e.p2=true;G.shake=1;G.flash=.4;sfx.boom();say('The King calls the dead.');for(const o of[-16,-24]){const s=addEnt(R,'skel',clamp(e.x+o,8,R.len-8));s.fy=gyAt(s.x);s.awake=true;ring(s.x,s.fy-2,[225,225,205],'.')}}

function kill(e){const d=MON[e.k];R.ents.splice(R.ents.indexOf(e),1);P.kills++;burst(e.x,e.fy-2,'x',d.c,d.boss?40:16);

function hitPlayer(e){const d=MON[e.k],dmg=Math.max(2,Math.round(d.atk*1.3)-P.def+(Math.random()*3|0)-1);P.hp-=dmg;P.inv=.55;P.kb=(P.x<e.x?-1:1)*(d.boss?24:15);G.hurt=1;G.shake=Math.max(G.shake,.55);G.hitstop=.05;

const costA=()=>20+15*P.upA,costD=()=>20+15*P.upD;
function buy(k){if(k==='a'){if(P.gold<costA())return say('Not enough gold.');P.gold-=costA();P.upA++;P.atk++;say('Blade honed.  ATK +1')}else{if(P.gold<costD())return say('Not enough gold.');P.gold-=costD();P.upD++;P.def++;say('Mail mended.  DEF +1')}sfx.chest();ring(P.x,P.fy-3,[255,215,90],'*')}

function updEnemy(e,dt){const d=MON[e.k],dx=P.x-e.x,ad=Math.abs(dx);e.flash-=dt;e.anim+=dt;e.mv=false;

const SCR={rain:[],leaf:[],dust:[]};
for(let i=0;i<90;i++)SCR.rain.push({x:Math.random(),y:Math.random(),s:.9+Math.random()*.8});
for(let i=0;i<22;i++)SCR.leaf.push({x:Math.random(),y:Math.random(),p:Math.random()*6.28,s:.03+Math.random()*.04});

function updatePlay(rdt){
  G.t+=rdt;music(rdt);
  G.lb=lerp(G.lb,G.cine?1:0,1-Math.exp(-rdt*5));G.shake=Math.max(0,G.shake-rdt*2.4);G.hurt=Math.max(0,G.hurt-rdt*1.8);G.flash=Math.max(0,G.flash-rdt*1.4);G.msgT-=rdt;G.bolt=Math.max(0,G.bolt-rdt*3.2);
  if(G.cine){const c=G.cine;c.t+=rdt;if(c.t>=c.dur){G.cine=null;if(c.done)c.done()}}
  if(G.hitstop>0){G.hitstop-=rdt;return}
  let dt=rdt;if(G.slow>0){G.slow-=rdt;dt*=.3}
  const busy=!!G.cine;if(!busy)P.time+=rdt;P.inv-=dt;
  if(P.hp>0){const dir=busy?0:inputX();
    if(P.kb){P.x=clamp(P.x+P.kb*dt,5,R.len-6);P.kb*=Math.pow(.0004,dt);if(Math.abs(P.kb)<1)P.kb=0}
    if(P.at>=0){P.at+=dt;if(!P.hitDone&&P.at>=.12){P.hitDone=true;swing()}if(P.at>=.4){P.at=-1;P.acd=.1}}
    else if(!busy){P.acd-=dt;if(P.acd<=0){const tg=target();if(tg){if(!dir)P.face=tg.x<P.x?-1:1;if((tg.x-P.x)*P.face>-1){P.at=0;P.hitDone=false;sfx.swing()}}}}
    P.moving=false;
    if(dir){if(P.at<0)P.face=dir;const wet=inWater(P.x);let nx=P.x+dir*15*(wet?.62:1)*(P.at>=0?.3:1)*dt;
      for(const e of R.ents){const d=MON[e.k];if(d.fly)continue;const lim=d.hw*.7+2;if((e.x-P.x)*dir>0&&Math.abs(e.x-nx)<lim)nx=Math.abs(e.x-P.x)<lim?P.x:e.x-dir*lim}
      nx=clamp(nx,5,R.len-6);if(R.gate&&R.locked&&nx>R.gate.x-8){nx=Math.min(nx,R.gate.x-8);if(G.msgT<=0)say('Something bars the way.')}if(R.beacon)nx=Math.min(nx,R.beacon.x-5);
      if(nx!==P.x){const d=Math.abs(nx-P.x);P.walkT+=d;P.stepT+=d;P.x=nx;P.moving=true;if(P.stepT>3.2){P.stepT=0;sfx.step(wet);if(wet)part(P.x,R.wl-.2,0,0,.5,'o',[130,180,220]);else part(P.x-dir,P.fy+.3,-dir*2,-2,.35,'.',[150,140,120])}}}}
  P.fy+=(gyAt(P.x)-P.fy)*(1-Math.exp(-dt*16));
  if(!busy&&P.hp>0){
    for(const f of R.fires)if(Math.abs(f.x-P.x)<6)rest(f);
    for(const c of R.chests)if(!c.open&&Math.abs(c.x-P.x)<3.5)openChest(c);
    if(R.gate&&!R.locked&&Math.abs(R.gate.x-P.x)<3){sfx.rest();G.cine={k:'out',t:0,dur:1.6,title:'',done:()=>loadRegion(G.region+1)}}
    if(R.beacon&&!R.beacon.lit&&Math.abs(R.beacon.x-P.x)<6.5){if(R.kingDead)lightBeacon();else if(G.msgT<=0)say('The Beacon is cold. Something guards it.')}}
  for(let i=R.items.length-1;i>=0;i--){const it=R.items[i],gy=gyAt(it.x);it.age+=dt;it.vy+=30*dt;it.y=Math.min(gy,it.y+it.vy*dt);const dx=P.x-it.x;
    if(it.age>.35&&P.hp>0){if(Math.abs(dx)<10)it.x+=Math.sign(dx)*Math.min(Math.abs(dx),22*dt);if(Math.abs(dx)<2.5){R.items.splice(i,1);if(it.k==='g'){P.gold+=it.n;num(P.x,P.fy-7,'+'+it.n,[255,215,80],1.2)}else{P.pot++;num(P.x,P.fy-7,'+potion',[255,120,170],1.2)}sfx.pick()}}}
  for(let i=R.ents.length-1;i>=0;i--){const e=R.ents[i];if(!e)continue;if(!G.cine&&Math.abs(e.x-P.x)<70)updEnemy(e,dt);else e.flash-=dt;const d=MON[e.k],ty=gyAt(e.x)-(d.fly?3+Math.sin(e.anim*3)*.8:0);e.fy+=(ty-e.fy)*(1-Math.exp(-dt*14))}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  if(P.hp>0&&Math.random()<dt*6)part(P.x+P.face*3+(Math.random()-.5),P.fy-3.5,(Math.random()-.5)*2,-3-Math.random()*3,.7+Math.random()*.6,Math.random()<.5?'.':'\'',[255,170,70]);
  for(const f of R.fires)if(Math.abs(f.x-P.x)<60&&Math.random()<dt*9)part(f.x+(Math.random()-.5)*2,gyAt(f.x)-2,(Math.random()-.5)*2,-4-Math.random()*4,.9+Math.random()*.8,'.\'*'[Math.random()*3|0],[255,150,50]);
  if(R.beacon&&R.beacon.lit&&Math.random()<dt*30)part(R.beacon.x+(Math.random()-.5)*5,gyAt(R.beacon.x)-7,(Math.random()-.5)*6,-8-Math.random()*8,1.5,'*',[255,210,110]);
  if(R.rain){G.boltT-=dt;if(G.boltT<=0){G.boltT=5+Math.random()*10;G.bolt=1;G.bolt2=.16;later(()=>sfx.thunder(),300+Math.random()*700)}if(G.bolt2>0){G.bolt2-=dt;if(G.bolt2<=0)G.bolt=.75}
    if(Math.random()<dt*20){const x=cam.x+(Math.random()-.5)*W/CW;if(inWater(x))part(x,R.wl-.1,0,0,.45,'o',[150,190,230])}}
  let tx=P.x+cam.la,tz=1;cam.la+=(P.face*5-cam.la)*(1-Math.exp(-rdt*2));const c=G.cine;
  if(c&&c.k==='pan'){const u=c.t/c.dur,wv=u<.25?ease(u/.25):u>.8?1-ease((u-.8)/.2):1;tx=lerp(tx,c.x-4,wv);tz=1+.2*wv}
  const kf=1-Math.exp(-rdt*6);cam.x+=(tx-cam.x)*kf;cam.y+=(P.fy-cam.y)*(1-Math.exp(-rdt*4));cam.zoom+=(tz-cam.zoom)*kf}

/* ---------------- render ---------------- */
let LMR=new Float32Array(1),LMG=new Float32Array(1),LMB=new Float32Array(1),LMc=1,LMr=1,LI=0;
function lmReset(){LMc=Math.ceil(W/CW)+2;LMr=Math.ceil(H/CH)+2;const n=LMc*LMr;if(LMR.length<n){LMR=new Float32Array(n);LMG=new Float32Array(n);LMB=new Float32Array(n)}LMR.fill(0,0,n);LMG.fill(0,0,n);LMB.fill(0,0,n)}
const wx2s=x=>(x-cam.x)*CW+W/2,wy2s=r=>(r-cam.y)*CH+GY;
function lightW(x,row,r,cr,cg,cb){const sx=wx2s(x),sy=wy2s(row),rp=r*CH,ca=Math.max(0,(sx-rp)/CW|0),cb2=Math.min(LMc-1,(sx+rp)/CW|0),ra=Math.max(0,(sy-rp)/CH|0),rb=Math.min(LMr-1,(sy+rp)/CH|0);

  if(G.msgT>0&&!c){const a=clamp(G.msgT,0,1),fs=clamp(Math.round(W/24),14,19);ctx.font='bold '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';const lines=wrap(G.msg,W*.9);let y=H*.2+fs*3;for(const l of lines){const w=ctx.measureText(l).width;ctx.fillStyle='rgba(0,0,0,'+(.6*a).toFixed(2)+')';ctx.fillRect(W/2-w/2-10,y-fs*.8,w+20,fs*1.6);ctx.fillStyle='rgba(255,236,190,'+a.toFixed(2)+')';ctx.fillText(l,W/2,y);y+=fs*1.6}}

    if(c.k==='card'){const a=clamp(1-c.t/1,0,1);if(a>0){ctx.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')';ctx.fillRect(0,0,W,H)}
      if(c.title){const fo=clamp((c.dur-c.t)/.8,0,1);ctx.globalAlpha=fo;ctx.font='bold '+(fs*.45|0)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#b89a6a';ctx.fillText(c.sub.split('').join(' '),W/2,H*.3-fs);
        const n=Math.floor(c.t*14),s=c.title.slice(0,n);ctx.font='bold '+fs+'px '+FONT;ctx.fillStyle='#ffe9b8';ctx.fillText(s,W/2-(ctx.measureText(c.title).width-ctx.measureText(s).width)/2,H*.3);
        if(n>=c.title.length){ctx.fillStyle='#b89a6a';ctx.fillText('-'.repeat(Math.min(c.title.length,Math.floor((c.t-c.title.length/14)*30))),W/2,H*.3+fs*.9)}ctx.globalAlpha=1}}
    else if(c.k==='pan'){const a=clamp(Math.min(c.t-.6,c.dur-c.t-.3)*2,0,1);ctx.globalAlpha=a;ctx.font='bold '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H*.26-fs,W,fs*2);ctx.fillStyle='#ff5040';ctx.fillText(c.title,W/2,H*.26);ctx.globalAlpha=1}
    else if(c.k==='out'){const a=clamp(c.t/(c.dur*.55),0,1);ctx.fillStyle=c.white?'rgba(255,244,214,'+a.toFixed(3)+')':'rgba(0,0,0,'+a.toFixed(3)+')';ctx.fillRect(0,0,W,H);

/* ---------------- cinematic side-scene (intro / title / ending) ---------------- */
const LAYB=[.56,.69,.84],LAYA=[.2,.15,.09],LAYP=[.25,.5,1],LAYF=[.07,.11,.17],LAYQ=[1.3,4.1,7.7];
const NB=[[22,24,50],[13,15,32],[5,6,13]],DB=[[120,140,190],[62,112,84],[30,72,42]];
function hgt(x,l){const f=LAYF[l],p=LAYQ[l];return .5+.5*clamp(.55*Math.sin(x*f+p)+.3*Math.sin(x*f*2.3+p*2)+.5*(vnoise(x*.33+p*10,l*9)-.5),-1,1)}
const TOWER=[' | ','/^\\','|*|','| |','| |','|_|'];
const SP=[];for(let i=0;i<60;i++)SP.push({x:Math.random(),y:Math.random(),s:.4+Math.random(),p:Math.random()*6.28});
function drawScene(s,t){
  const sw=clamp(Math.round(Math.min(W/44,H/26)),8,15),sh=Math.round(sw*1.7),cols=Math.ceil(W/sw)+2,rows=H/sh,day=s.day;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(lerp(3,60,day),lerp(4,125,day),lerp(14,225,day)));g.addColorStop(.72,rgb(lerp(24+70*s.sun,255,day),lerp(13+26*s.sun,205,day),lerp(42,150,day)));g.addColorStop(1,rgb(lerp(8,255,day),lerp(6,220,day),lerp(16,170,day)));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.font='bold '+(sh*.92|0)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  const sa=(1-day)*(1-.6*s.sun);
  if(sa>.03)for(let y=0;y<rows*.66;y++)for(let x=0;x<cols;x++){const h=hash(x*3+11,y*7+5);if(h>.945){const tw=.45+.55*Math.sin(t*(1+h*3)+h*100);ctx.fillStyle='rgba(205,215,255,'+(sa*tw).toFixed(2)+')';ctx.fillText(h>.988?'*':h>.968?'+':'.',x*sw+sw/2,y*sh+sh/2)}}
  const scx=W*.64,scy=H*s.sunY,pul=s.sun<.2?1+.08*Math.sin(t*6)+.05*Math.sin(t*13.7):1,rr=Math.max(2.2,rows*.085)*(.4+.6*s.sun)*pul*sh;
  const sc=[lerp(170,255,Math.min(1,s.sun*1.6)),lerp(45,228,s.sun),lerp(22,lerp(130,235,day),s.sun)];
  ctx.globalCompositeOperation='lighter';glowAt(scx,scy,rr*(3+3*s.sun),[sc[0]|0,sc[1]*.7|0,sc[2]*.5|0],.2+.4*s.sun);ctx.globalCompositeOperation='source-over';
  for(let y=Math.floor((scy-rr)/sh);y<=(scy+rr)/sh;y++)for(let x=Math.floor((scx-rr)/sw);x<=(scx+rr)/sw;x++){const X=x*sw+sw/2,Y=y*sh+sh/2,d=Math.hypot(X-scx,Y-scy)/rr;if(d>=1)continue;
    const k=1-d*.45;ctx.fillStyle=rgb(sc[0]*k,sc[1]*k,sc[2]*k);ctx.fillText(d<.45?'@':d<.7?'O':d<.88?'o':'*',X,Y)}
  for(let l=0;l<3;l++){const off=s.cam*LAYP[l],io=Math.floor(off),fr=off-io,bgc=[lerp(NB[l][0],DB[l][0],day)+(l===0?40*s.sun*(1-day):0),lerp(NB[l][1],DB[l][1],day)+(l===0?14*s.sun*(1-day):0),lerp(NB[l][2],DB[l][2],day)],bgS=rgb(bgc[0],bgc[1],bgc[2]),fgS=rgb(bgc[0]*1.9+14,bgc[1]*1.9+14,bgc[2]*1.9+16),fgD=rgb(bgc[0]*1.35+4,bgc[1]*1.35+4,bgc[2]*1.35+5);
    const sy=wx=>(LAYB[l]-LAYA[l]*hgt(wx,l))*rows;
    for(let x=-1;x<cols;x++){const wx=x+io,hy=sy(wx),top=Math.round(hy),X=(x-fr)*sw;ctx.fillStyle=bgS;ctx.fillRect(X,top*sh,sw+1,H-top*sh);
      const dn=sy(wx+1)-hy,dp=hy-sy(wx-1);let ch=dp<-.2&&dn>.2?'^':dn<-.32?'/':dn>.32?'\\':'_';
      if(l===0&&hgt(wx,0)>.78){ctx.fillStyle=rgb(lerp(150,255,day),lerp(160,255,day),lerp(200,255,day));if(ch==='_')ch='*'}else ctx.fillStyle=fgS;
      ctx.fillText(ch,X+sw/2,top*sh+sh/2-(ch==='_'?sh*.3:0));
      ctx.fillStyle=fgD;for(let k=1;k<7;k++){const h=hash(wx*3+l*17,k*5+l);if(h<.24)ctx.fillText(l===2&&day>.5?'"\',.'[(h*16|0)%4]:'.:\',;'[(h*20|0)%5],X+sw/2,(top+k)*sh+sh/2)}}
    if(l===1){const twx=Math.round(cols/2)+15,x=twx-io,X=(x-fr)*sw;if(X>-sw*3&&X<W+sw*3){const top=Math.round(sy(twx));
        for(let r=0;r<TOWER.length;r++)for(let c=0;c<3;c++){const ch=TOWER[r][c];if(ch===' ')continue;const cx=X+(c-1)*sw+sw/2,cy=(top-TOWER.length+r+1)*sh+sh/2;ctx.fillStyle=bgS;ctx.fillRect(cx-sw/2,cy-sh/2,sw+1,sh+1);
          if(ch==='*'){if(s.flame){ctx.fillStyle=rgb(255,180+50*Math.sin(t*14),70);ctx.fillText('*^'[(t*8|0)&1],cx,cy);ctx.globalCompositeOperation='lighter';glowAt(cx,cy,sh*5,[255,150,60],.4);ctx.globalCompositeOperation='source-over'}}
          else{ctx.fillStyle=fgS;ctx.fillText(ch,cx,cy)}}}}}
  if(s.walker>=0){const col=lerp(.15,.82,s.walker)*cols,X=col*sw,wy=((LAYB[2]-LAYA[2]*hgt(col+s.cam,2))*rows),Y=(Math.round(wy)-1)*sh+sh/2+Math.abs(Math.sin(t*7))*-2;
    ctx.globalCompositeOperation='lighter';glowAt(X,Y,sh*4.5*(1+.07*Math.sin(t*11)),[255,160,70],.5);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff0c8';ctx.fillText('@',X,Y);ctx.fillStyle='#ffb040';ctx.font='bold '+(sh*.5|0)+'px '+FONT;ctx.fillText('*',X+sw*.7,Y-sh*.2);ctx.font='bold '+(sh*.92|0)+'px '+FONT}
  for(const p of SP){let x,y,col,ch;if(s.emb){y=1-((p.y+t*p.s*.06)%1);x=(p.x+Math.sin(t*.7+p.p)*.03+1)%1;col='rgba(255,'+(130+p.s*60|0)+',50,'+(.25+.5*y).toFixed(2)+')';ch=p.s>1?'*':'.'}
    else{y=(p.y+t*p.s*.035)%1;x=((p.x+t*.012+Math.sin(t*.5+p.p)*.02)%1+1)%1;col='rgba(215,225,255,'+(.3*(1-day)).toFixed(2)+')';ch=p.s>1.1?'*':'.'}
    ctx.fillStyle=col;ctx.fillText(ch,x*W,y*H)}}

const BEATS=[
  {txt:'In the last year of the long dusk, the sun went out.',dur:6,sun:[1,1],cam:[0,0]},
  {txt:'It did not set. It guttered, like a candle at the end of its wick.',dur:8.5,sun:[1,.08],cam:[0,6]},
  {txt:'High on the mountain, the lamp-keepers saved a single ember.',dur:7.5,sun:[.08,.06],cam:[6,34],flame:1},
  {txt:'They gave it to the one soul fool enough to carry it down.',dur:7.5,sun:[.06,.05],cam:[34,60],flame:1,walk:[.12,.5]},
  {txt:'Through the Hollow Wood. Across the Drowned Fen. Down to the Sunken Keep, where the Beacon waits.',dur:10,sun:[.05,.05],cam:[60,90],walk:[.5,.74]}];
const ENDB=[{txt:'The Beacon caught.',dur:5.5},{txt:'And far above the Keep, the Fen, the Wood... something answered.',dur:8},{txt:'The long dusk was over.',dur:8}];
const TSPD=30;
function startIntro(){G.state='intro';IN.i=0;IN.t=0;setAmb(-1)}
function gotoTitle(){G.state='title';TI.t=0;setAmb(-1)}
function advIntro(){const b=BEATS[IN.i];if(IN.t*TSPD<b.txt.length){IN.t=Math.max(IN.t,b.txt.length/TSPD);return}if(IN.i<BEATS.length-1){IN.i++;IN.t=0}else gotoTitle()}
function startEnding(){G.state='ending';G.cine=null;EN.i=0;EN.t=0;EN.T=0;EN.done=false;setAmb(-1);musRoot=146.8}
function advEnd(){if(EN.done){if(EN.t>1.5)gotoTitle();return}const b=ENDB[EN.i];if(EN.t*TSPD<b.txt.length){EN.t=b.txt.length/TSPD;return}if(EN.i<ENDB.length-1){EN.i++;EN.t=0}else{EN.done=true;EN.t=0}}
function drawBarsText(txt,n,skip){const top=H*.08,bot=Math.max(H*.2,110);ctx.fillStyle='#000';ctx.fillRect(0,0,W,top);ctx.fillRect(0,H-bot,W,bot);
  typeText(txt,n,H-bot/2,clamp(Math.round(W/23),15,22),'#e9dcc0');
  if(n>=txt.length&&((G.t*2|0)&1)){ctx.font='14px '+FONT;ctx.textAlign='center';ctx.fillStyle='#8a7a5a';ctx.fillText('v',W/2,H-14)}}
const FNT={L:['10000','10000','10000','10000','11111'],O:['01110','10001','10001','10001','01110'],N:['10001','11001','10101','10011','10001'],G:['01111','10000','10111','10001','01110'],
  D:['11110','10001','10001','10001','11110'],U:['10001','10001','10001','10001','01110'],S:['01111','10000','01110','00001','11110'],K:['10001','10010','11100','10010','10001']};
function drawLogo(t,cy){const wide=W>H*1.25,lines=wide?['LONG DUSK']:['LONG','DUSK'],ls=Math.min(wide?W/56:W/27,26),lh=ls*1.2,blk=5*lh+lh*1.3,total=lines.length*5*lh+(lines.length-1)*lh*1.3,y0=cy-total/2;
  ctx.globalCompositeOperation='lighter';glowAt(W/2,cy,Math.max(total,ls*26),[255,120,40],.16*clamp(t,0,1));ctx.globalCompositeOperation='source-over';
  ctx.font='bold '+(lh*.98|0)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  lines.forEach((ln,li)=>{const wd=ln.length*6-1,xs=W/2-wd*ls/2;for(let ci=0;ci<ln.length;ci++){const gl=FNT[ln[ci]];if(!gl)continue;for(let r=0;r<5;r++)for(let c=0;c<5;c++){if(gl[r][c]!=='1')continue;
      const gx=ci*6+c,rev=t*24-(gx+li*10+r*2);if(rev<0)continue;const X=xs+gx*ls+ls/2,Y=y0+li*blk+r*lh+lh/2,h=hash(gx+li*50,r),k=r/4,fl=.86+.14*Math.sin(t*3+h*20);
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(X-ls/2,Y-lh/2,ls+.6,lh+.6);
      if(rev<5){ctx.fillStyle='#fff';ctx.fillText('%@&$*+'[(rev+h*6|0)%6],X,Y)}else{ctx.fillStyle=rgb(lerp(255,215,k)*fl,lerp(232,80,k)*fl,lerp(150,30,k)*fl);ctx.fillText('#',X,Y)}}}});
  return{bottom:y0+total,ls}}

function update(dt){
  if(G.state==='play')return updatePlay(dt);
  G.t+=dt;if(G.state!=='boot')music(dt);
  if(G.state==='intro'){const b=BEATS[IN.i],was=Math.floor(IN.t*TSPD);IN.t+=dt;const now=Math.floor(IN.t*TSPD);if(now>was&&now<=b.txt.length&&now%2===0)sfx.type();if(IN.t>b.dur){if(IN.i<BEATS.length-1){IN.i++;IN.t=0}else gotoTitle()}}
  else if(G.state==='title')TI.t+=dt;
  else if(G.state==='ending'){EN.t+=dt;EN.T+=dt;if(!EN.done&&EN.t>ENDB[EN.i].dur){if(EN.i<ENDB.length-1){EN.i++;EN.t=0}else{EN.done=true;EN.t=0}}}}
function fmtTime(s){s|=0;return(s/60|0)+':'+('0'+s%60).slice(-2)}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';const t=G.t;
  if(G.state==='play')return drawPlay();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(G.state==='boot'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const fs=clamp(Math.round(W/22),15,22);ctx.font='bold '+fs+'px '+FONT;
    const art=['  ( )  ','  /^\\  ',' | * | ',' |___| '];art.forEach((l,i)=>{ctx.fillStyle=i===2?rgb(255,170+50*Math.sin(t*9),70):'#7a6a4a';ctx.fillText(l,W/2,H*.38+i*fs*1.25)});
    ctx.globalCompositeOperation='lighter';glowAt(W/2,H*.38+2*fs*1.25,fs*6,[255,140,50],.3+.05*Math.sin(t*7));ctx.globalCompositeOperation='source-over';
    if((t*1.6|0)&1||t<.5){ctx.fillStyle='#e9dcc0';ctx.fillText('[ TAP TO LIGHT THE LAMP ]',W/2,H*.62)}ctx.font=(fs*.75|0)+'px '+FONT;ctx.fillStyle='#665a44';ctx.fillText('best with sound',W/2,H*.62+fs*2);return}
  if(G.state==='intro'){const b=BEATS[IN.i],u=clamp(IN.t/b.dur,0,1);
    drawScene({sun:lerp(b.sun[0],b.sun[1],ease(u)),day:0,cam:lerp(b.cam[0],b.cam[1],u),walker:b.walk?lerp(b.walk[0],b.walk[1],u):-1,flame:b.flame,sunY:.3,emb:0},t);
    if(vign)ctx.drawImage(vign,0,0,W,H);
    const dark=IN.i===0?1:IN.i===1?clamp(1-IN.t/2.5,0,1):0;if(dark>0){ctx.fillStyle='rgba(0,0,0,'+dark.toFixed(3)+')';ctx.fillRect(0,0,W,H)}
    if(IN.i===0)typeText(b.txt,IN.t*TSPD,H*.48,clamp(Math.round(W/21),16,24),'#e9dcc0');else drawBarsText(b.txt,IN.t*TSPD);
    drawButtons();return}
  if(G.state==='title'){const tt=TI.t;drawScene({sun:.1+.02*Math.sin(t*2),day:0,cam:90+tt*1.5,walker:.5,flame:0,sunY:.3,emb:1},t);if(vign)ctx.drawImage(vign,0,0,W,H);
    const lg=drawLogo(tt,H*.3),fs=clamp(Math.round(W/30),11,16);ctx.font='bold '+fs+'px '+FONT;ctx.textAlign='center';
    ctx.fillStyle='rgba(215,180,120,'+clamp(tt-2,0,1).toFixed(2)+')';ctx.fillText('A N   A S C I I   T A L E',W/2,lg.bottom+fs*2.2);
    if(tt>2.6){if((t*1.5|0)&1){ctx.font='bold '+(fs*1.25|0)+'px '+FONT;ctx.fillStyle='#fff0c8';ctx.fillText('[ TAP TO BEGIN ]',W/2,H*.9-fs*2)}
      ctx.font=fs*.9+'px '+FONT;ctx.fillStyle='rgba(170,160,140,.8)';ctx.fillText('drag left / right to walk  -  your blade swings itself',W/2,H*.9+fs*.4)}
    const a=clamp(1-tt/1.2,0,1);if(a>0){ctx.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')';ctx.fillRect(0,0,W,H)}return}
  if(G.state==='ending'){const day=ease(clamp((EN.T-2)/15,0,1));drawScene({sun:day,day,cam:EN.T*1.2,walker:-1,flame:day<.6,sunY:lerp(.7,.26,day),emb:0},t);
    const a=clamp(1-EN.T/2.5,0,1);if(a>0){ctx.fillStyle='rgba(255,244,214,'+a.toFixed(3)+')';ctx.fillRect(0,0,W,H)}
    if(!EN.done)drawBarsText(ENDB[EN.i].txt,EN.t*TSPD);
    else{const k=clamp(EN.t/1.5,0,1),fs=clamp(Math.round(W/12),26,54);ctx.fillStyle='rgba(0,0,0,'+(.45*k).toFixed(2)+')';ctx.fillRect(0,0,W,H);ctx.globalAlpha=k;ctx.font='bold '+fs+'px '+FONT;ctx.fillStyle='#fff3d0';ctx.fillText('T H E   E N D',W/2,H*.3);
      ctx.font='bold '+(fs*.36|0)+'px '+FONT;ctx.fillStyle='#ffe0a0';['LEVEL '+P.lv,'FOES FELLED  '+P.kills,'TIMES THE EMBER GUTTERED  '+P.deaths,'TIME  '+fmtTime(P.time)].forEach((l,i)=>ctx.fillText(l,W/2,H*.46+i*fs*.6));
      if(EN.t>1.5&&((t*1.5|0)&1)){ctx.fillStyle='#fff';ctx.fillText('[ TAP ]',W/2,H*.82)}ctx.globalAlpha=1}}}

/* ---------------- input ---------------- */
function onDown(e){if(e.preventDefault)e.preventDefault();initAudio();const x=e.clientX,y=e.clientY;
  if(G.state==='boot')return startIntro();
  for(const b of buttons())if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b.fn();
  if(G.state==='intro')return advIntro();
  if(G.state==='title'){if(TI.t>1.5)startGame();return}
  if(G.state==='ending')return advEnd();
  if(G.cine){if(G.cine.k==='card'&&G.cine.title&&G.cine.t>1.2)G.cine.t=Math.max(G.cine.t,G.cine.dur-.6);return}
  if(!JOY.on){JOY.on=true;JOY.id=e.pointerId;JOY.ox=JOY.x=x;JOY.oy=JOY.y=y}}
function onMove(e){if(JOY.on&&e.pointerId===JOY.id){JOY.x=e.clientX;JOY.y=e.clientY;const dx=JOY.x-JOY.ox;if(Math.abs(dx)>60)JOY.ox+=dx-Math.sign(dx)*60}}
function onUp(e){if(e.pointerId===JOY.id)JOY.on=false}
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'};
function onKey(e){const k=KM[e.key];if(k){if(!keys.includes(k))keys.push(k);if(e.preventDefault)e.preventDefault();return}
  if(e.repeat)return;initAudio();
  if(G.state!=='play'){if(e.key===' '||e.key==='Enter'){if(G.state==='boot')startIntro();else if(G.state==='intro')advIntro();else if(G.state==='title'){if(TI.t>1.5)startGame()}else advEnd()}else if(e.key==='Escape'&&G.state==='intro')gotoTitle();return}
  if(e.key==='q'||e.key==='Q'||e.key===' '||e.key==='p')drink();else if(e.key==='1'&&!G.cine&&nearFire(P.x,6))buy('a');else if(e.key==='2'&&!G.cine&&nearFire(P.x,6))buy('d');
  else if(e.key==='m'){muted=!muted;if(master)master.gain.value=muted?0:.6}}
function onKeyUp(e){const k=KM[e.key],i=keys.indexOf(k);if(i>=0)keys.splice(i,1)}
cv.addEventListener('pointerdown',onDown);window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
window.addEventListener('keydown',onKey);window.addEventListener('keyup',onKeyUp);window.addEventListener('resize',resize);window.addEventListener('blur',()=>{keys.length=0;JOY.on=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
resize();resetPlayer();
let last=0;function frame(ts){const now=ts/1000,dt=Math.min(.05,Math.max(0,now-last));last=now;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
