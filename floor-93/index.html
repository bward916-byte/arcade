<script>// ---- 00_core.js
'use strict';
// ===== FLOOR 93 — core (from Nightrise) =====
const TAU = Math.PI * 2;
const M = 32;                 // world px per metre
const FLOOR_H = 3.2 * M;      // one storey
const PLAYER_FLOOR = 83;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const sgn = v => v < 0 ? -1 : 1;

// Deterministic RNG so crowds are reproducible per seed
function RNG(seed) {

  r.int = (a, b) => Math.floor(r.range(a, b + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  // weighted pick: [[item, weight], ...]
  r.weighted = arr => { let t = 0; for (const a of arr) t += a[1]; let x = r() * t; for (const a of arr) { x -= a[1]; if (x <= 0) return a[0]; } return arr[arr.length - 1][0]; };
  for (let i = 0; i < 4; i++) r();
  return r;
}
const rng = RNG(Date.now() & 0x7fffffff);

// ---- colour helpers (ink palette is deliberately muted, comic-book paper feel)
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1); }

const INK = '#0b0e1c';
const PAPER = '#f2ecdf';
const SHADOW = 'rgba(6,8,20,.45)';
let PAPER_SHADOW = false;

// ---- always night. One fixed palette, tuned so lit windows carry the scene.
const NIGHT = { skyTop: '#070a18', skyBot: '#1b2446', tint: '#22284a', tintK: .35, glow: .19, night: 1, hour: 22 };
function dayPalette() { return NIGHT; }

// ---- tiny event bus
const Bus = { _h: {}, on(e, f) { (this._h[e] = this._h[e] || []).push(f); }, emit(e, d) { (this._h[e] || []).forEach(f => f(d)); } };

function hash2(a, b) { let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b | 0) + 0x7f4a7c15, 0xc2b2ae35); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15; return (h >>> 0) / 4294967296; }

// ---- 01_gfx.js
// ===== gfx: canvases, noise textures, baked pieces, lights =====
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
const rgba = (rgb, a) => `rgba(${rgb},${a})`;

// ---- tileable value noise -> small canvases used as patterns (grime, stucco, asphalt, grain)
function makeNoise(o) {
  const size = o.size || 256, c = mkCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  const oct = o.oct || 4, seed = o.seed || 1, rgb = o.rgb || [0, 0, 0], lo = o.lo === undefined ? .45 : o.lo, gain = o.gain || 2.2, amax = o.max === undefined ? 1 : o.max;
  const sm = t => t * t * (3 - 2 * t);
  const val = (x, y, cx, cy, s) => {
    const fx = x * cx / size, fy = y * cy / size, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
    const h = (i, j) => hash2(((i % cx) + cx) % cx + s * 57, ((j % cy) + cy) % cy + s * 131);
    return lerp(lerp(h(x0, y0), h(x0 + 1, y0), tx), lerp(h(x0, y0 + 1), h(x0 + 1, y0 + 1), tx), ty);
  };
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let v = 0, amp = .5, cx = o.cx || 8, cy = o.cy || 8, tot = 0;
    for (let k = 0; k < oct; k++) { v += val(x, y, cx, cy, seed + k * 17) * amp; tot += amp; amp *= .5; cx *= 2; cy *= 2; }
    v /= tot;
    const a = clamp((v - lo) * gain, 0, 1) * amax, i = (y * size + x) * 4;
    d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = a * 255;
  }
  g.putImageData(img, 0, 0); return c;
}
const Tex = {
  c: {}, p: {}, _g: null,
  defs: {
    grime:   { seed: 3, cx: 10, cy: 3, oct: 4, lo: .46, gain: 3, max: .8 },                    // vertical streaks of dirt
    blotch:  { seed: 9, cx: 5, cy: 5, oct: 4, lo: .44, gain: 2.6, max: .7 },
    speck:   { seed: 5, cx: 64, cy: 64, oct: 2, lo: .5, gain: 3.2, max: .55 },
    light:   { seed: 7, cx: 6, cy: 6, oct: 4, lo: .5, gain: 2.4, max: .5, rgb: [255, 255, 255] },
    grain:   { seed: 11, cx: 128, cy: 128, oct: 1, lo: .3, gain: 1.6, max: .9, size: 256 },
    leaf:    { seed: 13, cx: 40, cy: 30, oct: 3, lo: .45, gain: 3, max: .7, rgb: [6, 30, 12] },
    leafHi:  { seed: 15, cx: 44, cy: 34, oct: 2, lo: .55, gain: 3.4, max: .5, rgb: [190, 230, 130] },
    grass:   { seed: 17, cx: 30, cy: 90, oct: 3, lo: .46, gain: 2.8, max: .6, rgb: [20, 50, 12] },
    stone:   { seed: 19, cx: 6, cy: 18, oct: 4, lo: .42, gain: 2.6, max: .6, rgb: [70, 60, 40] },
  },
  canvas(k) { return this.c[k] || (this.c[k] = makeNoise(this.defs[k])); },
  pat(k) { if (!this._g) this._g = mkCanvas(2, 2).getContext('2d'); return this.p[k] || (this.p[k] = this._g.createPattern(this.canvas(k), 'repeat')); },
  // fill a rect (current path if none given) with a noise pattern at an alpha
  fill(ctx, k, x, y, w, h, a) { ctx.save(); ctx.globalAlpha *= a === undefined ? 1 : a; ctx.fillStyle = this.pat(k); ctx.fillRect(x, y, w, h); ctx.restore(); },
};

// ---- small drawing helpers
function lg(ctx, x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]); return g; }
function rg(ctx, x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]); return g; }
function poly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
function fillPoly(ctx, pts, col) { poly(ctx, pts); ctx.fillStyle = col; ctx.fill(); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(ctx, x, y, w, h, r, col) { rr(ctx, x, y, w, h, r); ctx.fillStyle = col; ctx.fill(); }
const _p2d = {};
function P2(d) { return _p2d[d] || (_p2d[d] = new Path2D(d)); }
function fp(ctx, d, col) { ctx.fillStyle = col; ctx.fill(P2(d)); }
function sp(ctx, d, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(P2(d)); }
// additive soft light
function glow(ctx, x, y, r, rgb, a) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rg(ctx, x, y, 0, r, [0, rgba(rgb, a), .3, rgba(rgb, a * .35), 1, rgba(rgb, 0)]);
  ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function ellipseGlow(ctx, x, y, rx, ry, rgb, a) { ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); glow(ctx, 0, 0, rx, rgb, a); ctx.restore(); }
// soft dark blob (contact shadows)
function softShadow(ctx, x, y, rx, ry, a) {

  ctx.fillStyle = rg(ctx, 0, 0, 0, rx, [0, `rgba(0,0,0,${a})`, .6, `rgba(0,0,0,${a * .5})`, 1, 'rgba(0,0,0,0)']);

// neon lettering: blurred coloured pass under a hot core
function neon(ctx, text, x, y, size, rgb, core, spacing) {
  ctx.save(); ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (spacing && 'letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.shadowColor = rgba(rgb, 1); ctx.shadowBlur = size * .9; ctx.fillStyle = rgba(rgb, .9); ctx.fillText(text, x, y); ctx.fillText(text, x, y);
  ctx.shadowBlur = size * .25; ctx.fillStyle = core || '#fff4e8'; ctx.fillText(text, x, y); ctx.restore();

// the mark: ring, ten ticks, small tower

  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = lw || r * .14;
  ctx.beginPath(); ctx.arc(0, 0, r * .75, 0, TAU); ctx.stroke();

// ---- baked pieces: static art is painted once per zoom tier into offscreen canvases
const Bake = {
  m: new Map(), px: 0, budget: 16e6, left: 0, frame: 0, max: 2,
  begin() { this.left = 2; this.frame++; },
  want(scale) { return clamp(Math.pow(2, Math.ceil(Math.log2(Math.max(scale, .001)) - .3)), 1 / 32, this.max); },
  // x,y,w,h in the caller's current coordinate space; fn(g, s) paints in that same space
  draw(ctx, key, x, y, w, h, want, fn) {
    let e = this.m.get(key);
    const need = !e || e.s < want * .7 || e.s > want * 2.6;
    if (need && (!e || this.left > 0)) { this.left--; e = this.bake(key, x, y, w, h, want, fn, e); }
    e.f = this.frame; ctx.drawImage(e.c, x - 1, y - 1, w + 2, h + 2);
  },
  bake(key, x, y, w, h, s, fn, old) {
    this.n = (this.n || 0) + 1; if (old) this.px -= old.c.width * old.c.height;
    // never let one piece exceed what phones can allocate
    while ((w + 2) * s * (h + 2) * s > 4.2e6 && s > 1 / 32) s /= 2;
    const c = mkCanvas((w + 2) * s, (h + 2) * s), g = c.getContext('2d');

    g.save(); g.beginPath(); g.rect(x - 1, y - 1, w + 2, h + 2); g.clip(); fn(g, s); g.restore();

  },
  evict() {
    const arr = [...this.m.entries()].filter(e => e[1].f < this.frame - 1).sort((a, b) => a[1].f - b[1].f);
    for (const [k, e] of arr) { if (this.px < this.budget * .75) break; this.px -= e.c.width * e.c.height; e.c.width = e.c.height = 1; this.m.delete(k); }
  },
  clear() { this.m.forEach(e => { e.c.width = e.c.height = 1; }); this.m.clear(); this.px = 0; },
};

// ---- lights. Glows are additive; pools are ground-level lights that brighten people and place shadows.
const Lights = {
  list: [], pools: [], day: false, amb: .3,
  clear() { this.list.length = 0; this.pools.length = 0; },
  add(x, y, r, rgb, a) { this.list.push(x, y, r, rgb, a); },
  pool(x, y, rx, ry, i) { this.pools.push(x, y, rx, ry, i); },
  at(x, y) {
    if (this.day) return 1;
    let v = this.amb; const p = this.pools;
    for (let i = 0; i < p.length; i += 5) { const dx = (x - p[i]) / p[i + 2], dy = (y - p[i + 1]) / p[i + 3], d = dx * dx + dy * dy; if (d < 1) v += p[i + 4] * (1 - d); }
    return Math.min(1, v);
  },
  groundShadow(ctx, x, y, h, w) { softShadow(ctx, x + (this.day ? -h * .22 : 0), y + 1, w * (this.day ? 1.5 : 1), h * .07, this.day ? .34 : .5); },
  draw(ctx) { const L = this.list; for (let i = 0; i < L.length; i += 5) glow(ctx, L[i], L[i + 1], L[i + 2], L[i + 3], L[i + 4]); },
};

// ---- sound: tiny oscillator blips, started on the first tap or key
const Sfx = {
  ctx: null, ok: false, on: true,
  init() { if (this.ctx || typeof window === 'undefined' || !(window.AudioContext || window.webkitAudioContext)) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.ok = true; } catch (e) {} },
  unlock() { this.init(); try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  tone(f, dur, type, vol, slide) { if (!this.ok || !this.on) return; try { const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, c.currentTime); if (slide) o.frequency.linearRampToValueAtTime(slide, c.currentTime + dur); g.gain.setValueAtTime(vol || .04, c.currentTime); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur); } catch (e) {} },
  coin() { this.tone(880, .09, 'triangle', .06); setTimeout(() => this.tone(1320, .14, 'triangle', .05), 70); },
  pick() { this.tone(520, .1, 'sine', .06, 760); },
  bad() { this.tone(180, .2, 'square', .03, 120); },
  ok2() { this.tone(660, .1, 'sine', .05); setTimeout(() => this.tone(990, .18, 'sine', .05), 90); },
  step() { this.tone(300, .05, 'sine', .02); },
  ding() { this.tone(1046, .5, 'sine', .05); },

// a robed figure, the same shape as on the carved walls
function drawRobed(ctx, x, y, h, a, tone) {
  if (a <= 0.01) return; ctx.save(); ctx.globalAlpha = a; softShadow(ctx, x, y + 1, h * .2, h * .035, .5);
  ctx.translate(x, y); ctx.scale(h / 100, h / 100);
  fp(ctx, 'M-17 0q3-46 9-68q9-5 16 0q6 22 9 68z', tone || '#15131f'); fp(ctx, 'M-9 -66q-3-24 9-32q12 8 9 32q-9 5-18 0z', tone || '#15131f');

  ctx.restore();

// ---- 02_input.js
// ===== input: one pad for touch, keyboard and a physical controller =====
// Everything on screen is laid out in "virtual" units: the screen is always 540 units tall.
const VH = 540;
const Pad = {
  // positions in virtual units, recomputed when the screen changes
  stick: { x: 82, y: VH - 78, r: 58 }, A: { x: 0, y: 0, r: 40 }, B: { x: 0, y: 0, r: 30 }, zOut: { x: 0, y: 0, r: 22 }, zIn: { x: 0, y: 0, r: 22 }, mute: { x: 0, y: 0, r: 18 },
  layout(VW) {
    this.A.x = VW - 64; this.A.y = VH - 62; this.B.x = VW - 150; this.B.y = VH - 50;
    this.zOut.x = VW - 160; this.zOut.y = VH - 134; this.zIn.x = VW - 44; this.zIn.y = VH - 134;
    this.mute.x = VW - 32; this.mute.y = 82;
  },

const Input = {
  keys: {}, axisX: 0, axisY: 0, u: 1, VW: 960,
  // one-frame events
  a: false, b: false, zin: false, zout: false, tap: null, navX: 0, navY: 0, any: false, mute: false,
  stick: { on: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 }, held: {}, _nav: { x: 0, y: 0, t: 0 }, _gp: {},
  init(canvas) {
    const kd = e => {
      if (!this.keys[e.code]) { this.press(e.code); Sfx.unlock(); }
      this.keys[e.code] = true; this.any = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
    };
    window.addEventListener('keydown', kd);
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.stick.on = false; });

      if (hit(Pad.B)) { this.b = true; this.held[id] = 'B'; return; }

      if (hit(Pad.zIn, 6)) { this.zin = true; return; }
      if (hit(Pad.mute, 6)) { this.mute = true; return; }

    };

  },
  press(code) {
    if (code === 'Space' || code === 'Enter' || code === 'KeyE') this.a = true;
    if (code === 'KeyB' || code === 'Escape' || code === 'Tab' || code === 'KeyI') this.b = true;
    if (code === 'Minus' || code === 'KeyQ' || code === 'NumpadSubtract') this.zout = true;
    if (code === 'Equal' || code === 'KeyX' || code === 'NumpadAdd') this.zin = true;

  },
  update(dt) {
    let x = 0, y = 0; const k = this.keys;

// ===== landmarks: Chichén Itzá (pyramid, chamber), shared helpers, the flight cut =====
// The pyramid is a real 3D stepped pyramid projected at a 3/4 angle so one face is lit and one is in shade.

    fillPoly(g, pq(-w, y0, w, w, y0, w, w, y0 + h * .2, w, -w, y0 + h * .2, w), 'rgba(0,0,0,.16)');

  hall:      { root: 46, scale: 'minor', bpm: 60, wave: 'sine', vol: .03, bass: .3, density: .3, pad: true },

  landmark:  { root: 47, scale: 'major', bpm: 76, wave: 'triangle', vol: .04, bass: .5, density: .55 },
  other:     { root: 51, scale: 'lydian', bpm: 54, wave: 'sine', vol: .045, bass: .45, density: .5, pad: true },
  plain:     { root: 50, scale: 'dorian', bpm: 58, wave: 'sine', vol: .04, bass: .4, density: .4, pad: true },

    if (n >= 26) { G.cards = 7; G.cardWaiting = false; sell('jadecup', 'ruby', 'silk'); G.cash = 200; G.stamps.push('greatwall'); }

  start(G) { this.snap = G.snapshot(); this.list = this.stops(); G.demo = true; this.auto = true; this.show(G, 0); },
  stop(G) {
    G.demo = false; G.close(); Camera.seq = null; UI.toast = null;
    G.fresh(); G.apply(this.snap); G.setHat(G.hat); G.enterAt(this.snap.where); G.open(Panels.title());
  },
  show(G, i) {
    if (i >= this.list.length) { this.stop(G); return; }
    this.i = Math.max(0, i); this.t = 0; this.cool = .6; this.cur = this.list[this.i];
    G.close(); UI.toast = null; Camera.seq = null; this.cur.go(G); G.fade = .7;
  },
  // runs right after the inputs are read: uses them to steer the tour, then hands the game its own
  update(dt, G) {
    const tap = Input.tap, VW = UI.VW;
    const next = Input.a || Input.navX > 0 || (tap && tap.x > VW * .62), prev = Input.navX < 0 || (tap && tap.x < VW * .38);
    if (Input.b) { Input.endFrame(); Input.navX = Input.navY = 0; this.stop(G); return; }
    if (tap && !next && !prev) this.auto = !this.auto;
    if (next) this.show(G, this.i + 1); else if (prev) { this.auto = false; this.show(G, this.i - 1); }
    else if (this.auto) { this.t += dt; if (this.t > (this.cur.dur || 7)) this.show(G, this.i + 1); }
    if (!G.demo) { Input.endFrame(); Input.navX = Input.navY = 0; return; }
    Input.a = Input.b = Input.zin = Input.zout = false; Input.tap = null; Input.navX = Input.navY = 0; Input.modal = true;
    const S = this.cur, p = G.player, d = S.to === undefined ? 0 : S.to - p.x;
    Input.axisX = Math.abs(d) > 8 ? sgn(d) : 0; Input.axisY = 0; this.cool -= dt;
  },
  // he does the things he walks past
  after(G) { const S = this.cur, a = G.scene.act; if (S.auto && a && a.fn && this.cool <= 0 && S.auto.test(a.label)) { a.fn(); this.cool = .5; } },
