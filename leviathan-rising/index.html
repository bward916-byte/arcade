<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leviathan Rising</title>
<style>
html,body{margin:0;height:100%;background:#03121c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth||800;H=window.innerHeight||400;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
window.addEventListener('resize',resize);resize();

const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(Math.random()*a.length)|0];
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

/* ---------- world ---------- */
const SHORE=7600,WORLD_W=12800,DEEP=1700,LAND_Y=-26,CITY_X=SHORE+430;
function terrainY(x){
  if(x>=SHORE){const t=clamp((x-SHORE)/260,0,1);return LAND_Y*t*t*(3-2*t);}
  const t=clamp((x-2200)/(SHORE-2200),0,1);
  const base=DEEP*Math.pow(1-t,1.1);
  const n=(Math.sin(x*0.004)*60+Math.sin(x*0.011+1)*30+Math.sin(x*0.031)*10)*Math.min(1,base/220);
  return Math.max(0,base+n);
}
const waveY=(x,t)=>Math.sin(x*0.02+t*1.4)*3+Math.sin(x*0.007-t*0.8)*4;

const STAGES=[
 {r:6,name:'HATCHLING',tip:'Eat small fish. Flee anything bigger than you.'},
 {r:13,name:'SERPENT',tip:'Hunt tuna and barracuda. Sharks still bite.'},
 {r:24,name:'SHIP SHAKER',tip:'Ram boats from below to shake the crew loose.'},
 {r:46,name:'LEVIATHAN',tip:'Sink ships. Swallow whales. The navy is coming.'},
 {r:84,name:'TITAN',tip:'The land is yours. Crush the city.'}];
const MAXR=150,NSEG=13;
const SKIN=[
 {body:'#6fcfb0',belly:'#dcf7e4',dark:'#2f7f6b',glow:null},
 {body:'#3aa58c',belly:'#bfead0',dark:'#1f5e52',glow:null},
 {body:'#2b7f7a',belly:'#9ad6c0',dark:'#153f40',glow:null},
 {body:'#215a63',belly:'#7fb9a6',dark:'#0e2a33',glow:'#5ff0ff'},
 {body:'#24443c',belly:'#93a37c',dark:'#0a1a18',glow:'#ff7a2a'}];

const PREY={
 minnow:{r:2.2,gain:2.4,spd:62,L:1.7,ry:0.8,tail:0.9,wag:16,minD:25,cols:['#cfeef2','#b7dfe8','#e3f3c8']},
 fish:{r:4.5,gain:9.5,spd:70,L:1.5,ry:1,tail:1,wag:12,minD:30,cols:['#ffb347','#ff6f61','#ffd166','#7bdff2','#f78fb3','#b8f2a0']},
 tuna:{r:9,gain:56,spd:112,L:2,ry:0.85,tail:1.1,wag:11,minD:90,cols:['#5d7fa3','#6c8fb5','#4f6f94']},
 barracuda:{r:8.5,gain:50,spd:118,L:3,ry:0.5,tail:0.8,wag:13,minD:80,hunter:true,bite:5,cols:['#aeb9c2']},
 shark:{r:19,gain:250,spd:122,L:2.4,ry:0.8,tail:1.2,wag:7,minD:170,hunter:true,bite:10,cols:['#70808d','#5f6f7c']},
 whale:{r:42,gain:820,spd:52,L:2.6,ry:0.9,tail:0.9,wag:2.5,minD:460,cols:['#3d5a73','#35506a']}};
const SHIPS={
 row:{w:44,h:9,minR:16,hp:25,crew:1,spd:8,bonus:80},
 fish:{w:105,h:18,minR:26,hp:90,crew:3,spd:14,bonus:220,harpoon:true},
 cargo:{w:290,h:38,minR:48,hp:420,crew:8,spd:18,bonus:700},
 war:{w:330,h:34,minR:60,hp:600,crew:10,spd:26,bonus:1100,charges:true}};

/* ---------- audio ---------- */
let AC=null,noiseBuf=null;const lastSfx={};
function initAudio(){if(AC)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}catch(e){}}
function tone(f0,f1,dur,type,vol){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function noise(dur,vol,freq){if(!AC)return;try{if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+0.02);}catch(e){}}
function sfx(name,arg){
  if(mode!=='play')return;const now=Date.now(),gap={chomp:60,splash:180,crash:120,boom:120,hurt:150,scream:120,crumble:160}[name]||0;
  if(now-(lastSfx[name]||0)<gap)return;lastSfx[name]=now;
  if(name==='chomp'){noise(0.09,0.25,arg?700:1800);tone(arg?140:260,60,0.12,'square',0.08);}
  else if(name==='splash')noise(0.35,0.16,1200);
  else if(name==='crash'){noise(0.5,0.35,420);tone(95,32,0.4,'sawtooth',0.12);}
  else if(name==='boom'){noise(0.8,0.45,240);tone(70,25,0.6,'sine',0.3);}
  else if(name==='hurt')tone(300,120,0.18,'square',0.12);
  else if(name==='dash')noise(0.2,0.1,900);
  else if(name==='crumble')noise(0.25,0.2,300);
  else if(name==='roar'){tone(110,45,1.3,'sawtooth',0.26);tone(73,38,1.4,'square',0.1);noise(1.2,0.2,500);}
  else if(name==='scream')tone(900+Math.random()*500,500,0.22,'triangle',0.04);
}

/* ---------- state ---------- */
let mode='title',G=null;
const input={x:0,y:0,dash:false,kx:0,ky:0,joy:null,dashPid:null};
const keys={};
const maxHp=p=>30+p.r*4;

function makePlayer(r){
  const x=r>40?5300:6450,y=terrainY(x)*0.5;
  const p={x,y,vx:0,vy:0,a:Math.PI,flip:-1,r2:r*r,r,hp:0,segs:[],dash:0,dashCd:0,jaw:0,chomp:0,inv:2,hurt:0,ground:false,wasWet:true};
  p.hp=maxHp(p);for(let i=1;i<=NSEG;i++)p.segs.push({x:x+i*r*0.72,y});
  return p;
}
function stageOf(r){let s=0;for(let i=0;i<STAGES.length;i++)if(r>=STAGES[i].r-0.001)s=i;return s;}
function newGame(stage){
  const p=makePlayer(STAGES[stage].r);
  G={t:0,p,stage,prey:[],ships:[],swim:[],people:[],cars:[],tanks:[],helis:[],builds:[],parts:[],proj:[],texts:[],
    cam:{x:p.x,y:p.y,s:1},shake:0,slow:0,flash:0,toast:null,banner:null,deadT:0,won:false,wonT:0,
    spawnT:0,shipT:4,tankT:3,heliT:8,peopleT:2,stats:{fish:0,crew:0,ships:0,people:0,builds:0},total:0};
  G.cam.s=targetScale();
  genCity();initShips();
  for(let i=0;i<40;i++)spawnTick(true);
}
function targetScale(){return Math.sqrt(W*H)/(200+G.p.r*11);}

function genCity(){
  const cols=['#4a4e69','#5c5470','#3d405b','#6b5b6e','#52606d','#7a5c58','#464e5e'];
  let x=CITY_X,i=0;
  while(x<WORLD_W-440){
    const prog=(x-CITY_X)/(WORLD_W-CITY_X),w=rand(70,150),h=rand(80,200)+prog*rand(60,260);
    G.builds.push({x,w,h,hp:w*h/38,max:w*h/38,shake:0,dead:false,fall:0,col:pick(cols),seed:i*7.3+1,fx:0});
    x+=w+rand(10,46);i++;
  }
  G.builds.push({x:WORLD_W-380,w:170,h:560,hp:2600,max:2600,shake:0,dead:false,fall:0,col:'#3f4a66',seed:99,fx:0,tower:true});
  G.total=G.builds.length;
  for(let k=0;k<46;k++)addPerson(rand(CITY_X,WORLD_W-120));
  for(let k=0;k<9;k++)addPerson(rand(SHORE+70,SHORE+250));
  const cc=['#c0392b','#2980b9','#f1c40f','#ecf0f1','#27ae60','#8e44ad'];
  for(let k=0;k<7;k++)G.cars.push({x:rand(CITY_X,WORLD_W-150),vx:(Math.random()<0.5?-1:1)*rand(40,70),col:pick(cc)});
}
function addPerson(x){G.people.push({x,vx:0,dir:Math.random()<0.5?-1:1,t:rand(0,10),panic:false,col:pick(['#e74c3c','#3498db','#f1c40f','#ecf0f1','#2ecc71','#e67e22','#9b59b6'])});}
function addShip(type,x,dir){const d=SHIPS[type];G.ships.push({type,x,vx:d.spd*dir,tilt:0,tv:0,hp:d.hp,crew:d.crew,hitCd:0,atkT:rand(1,3),sink:0,sy:0,ejCd:0});}
function initShips(){
  for(let i=0;i<4;i++)addShip('row',rand(5700,7250),Math.random()<0.5?-1:1);
  for(let i=0;i<3;i++)addShip('fish',rand(3800,6600),Math.random()<0.5?-1:1);
  addShip('cargo',rand(1500,3000),1);addShip('cargo',rand(3600,5200),-1);
}

/* ---------- particles ---------- */
function part(x,y,vx,vy,life,size,col,kind,g){if(G.parts.length>650)G.parts.shift();G.parts.push({x,y,vx,vy,life,max:life,size,col,kind:kind||0,g:g||0,rot:rand(0,TAU)});}
const Z=()=>1/G.cam.s;
function blood(x,y,n,sc){const z=Z();for(let i=0;i<n;i++)part(x+rand(-4,4)*sc,y+rand(-4,4)*sc,rand(-30,30)*sc*0.4,rand(-30,30)*sc*0.4,rand(0.6,1.4),rand(5,11)*z*Math.min(2.2,0.6+sc*0.12),'#b3121f',4);}
function bubbles(x,y,n,sp){const z=Z();for(let i=0;i<n;i++)part(x+rand(-sp,sp),y+rand(-sp,sp),rand(-12,12),rand(-70,-25),rand(0.8,2),rand(1.5,4)*z,'#dff6ff',1);}
function splash(x,n,pw){const z=Z();for(let i=0;i<n;i++)part(x+rand(-pw,pw)*0.3,-1,rand(-1,1)*pw*1.4,-rand(0.4,1.6)*pw*2.2,rand(0.5,1.1),rand(2,4.5)*z,'#e8fbff',5,520);sfx('splash');}
function debris(x,y,n,col,sc){const z=Z();for(let i=0;i<n;i++)part(x+rand(-8,8)*sc,y+rand(-8,8)*sc,rand(-130,130)*sc,rand(-220,-20)*sc,rand(0.7,1.6),rand(3,7)*z,col,2,560);}
function dust(x,y,n,sc){const z=Z();for(let i=0;i<n;i++)part(x+rand(-20,20)*sc,y+rand(-10,10)*sc,rand(-50,50)*sc,rand(-50,-5)*sc,rand(0.9,2.2),rand(10,22)*z,'#b9aea0',3);}
function boom(x,y,sc){const z=Z();for(let i=0;i<14;i++)part(x,y,rand(-150,150)*sc,rand(-170,60)*sc,rand(0.3,0.7),rand(6,13)*z,pick(['#ffd35c','#ff8a2a','#ff4b1f']),0);for(let i=0;i<8;i++)part(x,y,rand(-40,40),rand(-70,-20),rand(1,2),rand(10,18)*z,'#3a3636',3);G.shake=Math.max(G.shake,7);sfx('boom');}
function floatText(x,y,txt,col){G.texts.push({x,y,txt,col:col||'#fff',t:1.3});}
function toast(txt,t){if(mode!=='play')return;if(G.toast&&G.toast.txt===txt&&G.toast.t>0.4)return;G.toast={txt,t:t||2.2};}

/* ---------- growth / damage ---------- */
function grow(g){
  const p=G.p;p.r2+=g;p.r=Math.min(MAXR,Math.sqrt(p.r2));p.hp=Math.min(maxHp(p),p.hp+2+g*0.04);
  const s=stageOf(p.r);
  if(s>G.stage){G.stage=s;G.slow=0.7;G.flash=0.6;G.shake=12;p.hp=maxHp(p);p.inv=2;G.banner={title:STAGES[s].name,sub:STAGES[s].tip,t:4.2};sfx('roar');bubbles(p.x,p.y,24,p.r*2);}
}
function hurt(d){
  const p=G.p;if(mode!=='play'||p.inv>0||G.deadT>0||G.won)return;
  p.hp-=d;p.hurt=0.25;p.inv=0.35;G.shake=Math.max(G.shake,5);sfx('hurt');blood(p.x,p.y,3,p.r*0.3);
  if(p.hp<=0){G.deadT=2.4;blood(p.x,p.y,26,p.r*0.5);G.banner={title:'SLAIN',sub:'You return smaller, and angrier.',t:2.4};G.proj.length=0;}
}
function respawn(){
  const p=G.p,base=STAGES[G.stage].r;
  p.r2=Math.max(base*base,p.r2*0.85);p.r=Math.sqrt(p.r2);
  if(p.x>SHORE-500)p.x=SHORE-900;
  p.y=Math.max(p.r,terrainY(p.x)*0.5);p.vx=p.vy=0;p.hp=maxHp(p);p.inv=3;
  p.segs.forEach((s,i)=>{s.x=p.x-(i+1)*p.r*0.72;s.y=p.y;});
  G.tanks.length=0;G.helis.length=0;G.proj.length=0;
}
function hitPlayer(x,y,rad){
  const p=G.p;if(Math.hypot(x-p.x,y-p.y)<p.r*0.85+rad)return true;
  for(let i=0;i<8;i++){const s=p.segs[i],k=(i+1)/NSEG;if(Math.hypot(x-s.x,y-s.y)<p.r*(1-0.8*Math.pow(k,1.4))+rad)return true;}
  return false;
}
function circRect(cx,cy,cr,x0,y0,x1,y1){
  const nx=clamp(cx,x0,x1),ny=clamp(cy,y0,y1),dx=cx-nx,dy=cy-ny,d2=dx*dx+dy*dy;
  if(d2>cr*cr)return null;const d=Math.sqrt(d2);
  if(d<0.001){const l=cx-x0,r=x1-cx,t=cy-y0,b=y1-cy,m=Math.min(l,r,t,b);
    if(m===b)return{nx:0,ny:1,pen:b+cr};if(m===t)return{nx:0,ny:-1,pen:t+cr};if(m===l)return{nx:-1,ny:0,pen:l+cr};return{nx:1,ny:0,pen:r+cr};}
  return{nx:dx/d,ny:dy/d,pen:cr-d};
}

/* ---------- player ---------- */
function updPlayer(dt){
  const p=G.p,spd=95+p.r*2.4,titan=p.r>=STAGES[4].r;
  let ix=mode==='play'?input.x:0,iy=mode==='play'?input.y:0;
  if(mode==='title'){ix=Math.cos(G.t*0.35)*0.5;iy=Math.sin(G.t*0.8)*0.3;}
  const wet=p.y>0&&p.x<SHORE+5;
  if(p.dashCd>0)p.dashCd-=dt;if(p.dash>0)p.dash-=dt;if(p.inv>0)p.inv-=dt;if(p.hurt>0)p.hurt-=dt;if(p.chomp>0)p.chomp-=dt;
  if(input.dash&&p.dashCd<=0&&mode==='play'){
    let dx=ix,dy=iy;const m=Math.hypot(dx,dy);if(m<0.2){dx=Math.cos(p.a);dy=Math.sin(p.a);}else{dx/=m;dy/=m;}
    p.dash=0.34;p.dashCd=0.85;p.vx+=dx*spd*1.7;p.vy+=dy*spd*1.7;sfx('dash');if(wet)bubbles(p.x,p.y,8,p.r);
  }
  input.dash=false;
  if(wet){p.vx+=ix*spd*6*dt;p.vy+=iy*spd*6*dt;p.vx-=p.vx*6*dt;p.vy-=p.vy*6*dt;}
  else{
    const gy=terrainY(p.x)-p.r*0.55,h=gy-p.y,lim=p.r*3.4;
    if(titan&&p.x>SHORE-400){
      const s2=spd*0.8;p.vx+=ix*s2*5*dt;p.vx-=p.vx*5*dt;
      const up=iy<-0.2&&h<=lim;let ty=iy;if(h>lim&&ty<0)ty=0;
      p.vy+=ty*s2*5*dt;p.vy-=p.vy*5*dt;
      if(!up)p.vy+=(h>lim?1100:700)*dt;
    }else{p.vy+=(600+p.r*5)*dt;p.vx+=ix*spd*1.2*dt;p.vx-=p.vx*0.6*dt;}
  }
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  const nowWet=p.y>0&&p.x<SHORE+5;
  if(nowWet!==p.wasWet&&p.x<SHORE&&Math.abs(p.vy)>50){splash(p.x,Math.min(22,6+p.r*0.3),18+p.r*1.6);}
  p.wasWet=nowWet;
  if(p.x<60+p.r){p.x=60+p.r;if(p.vx<0)p.vx*=-0.3;}
  if(p.x>WORLD_W-70){p.x=WORLD_W-70;if(p.vx>0)p.vx=0;}
  if(!titan&&p.x>SHORE-30-p.r){p.x=SHORE-30-p.r;if(p.vx>0)p.vx=-40;toast('Not big enough for land yet — keep eating',2.4);}
  const gy=terrainY(p.x)-p.r*0.55;
  if(p.y>gy){p.y=gy;if(p.vy>0)p.vy=0;p.ground=true;}else p.ground=false;
  const sp=Math.hypot(p.vx,p.vy);
  if(sp>12){const ta=Math.atan2(p.vy,p.vx);let da=ta-p.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;p.a+=da*Math.min(1,10*dt);}
  const c=Math.cos(p.a);if(c>0.25)p.flip=1;else if(c<-0.25)p.flip=-1;
  let px=p.x,py=p.y;const gap=p.r*0.72;
  for(const s of p.segs){
    if(!(s.y>0&&s.x<SHORE+5))s.y+=260*dt;
    const dx=s.x-px,dy=s.y-py,d=Math.hypot(dx,dy)||1;s.x=px+dx/d*gap;s.y=py+dy/d*gap;
    const g=terrainY(s.x)-p.r*0.3;if(s.y>g)s.y=g;px=s.x;py=s.y;
  }
  if(nowWet&&Math.random()<dt*(2+sp*0.02))bubbles(p.x-Math.cos(p.a)*p.r,p.y-Math.sin(p.a)*p.r,1,p.r*0.5);
}
const mouth=()=>{const p=G.p;return{x:p.x+Math.cos(p.a)*p.r*0.6,y:p.y+Math.sin(p.a)*p.r*0.6};};

/* ---------- prey ---------- */
function spawnPrey(type,x,y,leader){
  const d=PREY[type],r=d.r*rand(0.85,1.2),col=pick(d.cols);
  const f={type,x,y,r,vx:rand(-10,10),vy:0,spd:d.spd*rand(0.8,1.15),t:rand(0,10),gain:d.gain*(r/d.r)*(r/d.r),leader:leader||null,col,alive:true,biteCd:0,wt:0,wh:0,ox:rand(-22,22),oy:rand(-14,14)};
  G.prey.push(f);return f;
}
function spawnTick(init){
  const p=G.p,r=p.r,vw=W/G.cam.s,vh=H/G.cam.s;
  const want={minnow:r<30?36:14,fish:r<46?16:8,tuna:r>8?(r<60?8:4):2,barracuda:r<30?3:0,shark:r>10?(r<70?5:3):0,whale:r>34?3:0};
  const have={};for(const f of G.prey)have[f.type]=(have[f.type]||0)+1;
  for(const type in want){
    if((have[type]||0)>=want[type])continue;
    const d=PREY[type],side=Math.random()<0.5?-1:1;
    let x=init?p.x+rand(-vw,vw):p.x+side*(vw/2+rand(60,520));
    x=clamp(x,120,SHORE-120);
    if(!init&&Math.abs(x-p.x)<vw/2+30)continue;
    if(init&&Math.abs(x-p.x)<120)continue;
    const bed=terrainY(x);if(bed<d.minD)continue;
    const y=type==='whale'?rand(90,Math.max(100,bed-70)):clamp(p.y+rand(-vh,vh),d.r+12,bed-d.r-12);
    if(type==='minnow'){const l=spawnPrey(type,x,y);for(let i=0;i<8;i++)spawnPrey(type,x+rand(-25,25),clamp(y+rand(-15,15),6,bed-6),l);}
    else spawnPrey(type,x,y);
  }
}
function updPrey(dt){
  const p=G.p,m=mouth(),vw=W/G.cam.s;let near=false;
  for(const f of G.prey){
    const d=PREY[f.type];f.t+=dt;if(f.biteCd>0)f.biteCd-=dt;
    const dx=p.x-f.x,dy=p.y-f.y,dist=Math.hypot(dx,dy);
    if(Math.abs(dx)>vw/2+950){f.alive=false;continue;}
    const edible=p.r>f.r*1.25,danger=d.hunter&&f.r>p.r*1.1&&mode==='play'&&G.deadT<=0;
    let th,sp=f.spd*0.42;
    if(edible&&dist<f.r*4+p.r*3+40&&G.deadT<=0){th=Math.atan2(-dy,-dx);sp=f.spd;}
    else if(danger&&dist<330&&p.y>0){th=Math.atan2(dy,dx);sp=f.spd*0.92;}
    else if(f.leader&&f.leader.alive){const tx=f.leader.x+f.ox-f.x,ty=f.leader.y+f.oy-f.y;th=Math.atan2(ty,tx);sp=f.spd*(Math.hypot(tx,ty)>12?0.7:0.3);}
    else{f.wt-=dt;if(f.wt<=0){f.wh=rand(-0.45,0.45)+(Math.random()<0.5?0:Math.PI);f.wt=rand(2,5);}th=f.wh;}
    let dvx=Math.cos(th)*sp,dvy=Math.sin(th)*sp;
    const bed=terrainY(f.x);
    if(f.y<f.r+12)dvy=Math.abs(sp)*0.6;if(f.y>bed-f.r-12)dvy=-Math.abs(sp)*0.6;
    if(f.x<140){dvx=Math.abs(sp);f.wh=0;}if(f.x>SHORE-90||bed<Math.max(d.minD*0.8,f.r*2.6+16)){dvx=-Math.abs(sp);f.wh=Math.PI;}
    f.vx+=(dvx-f.vx)*Math.min(1,3*dt);f.vy+=(dvy-f.vy)*Math.min(1,3*dt);
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.y=clamp(f.y,f.r*0.7+2,Math.max(f.r+3,bed-f.r*0.7));
    if(G.deadT>0)continue;
    const L=d.L*f.r*0.8,cx=clamp(m.x,f.x-L,f.x+L),md=Math.hypot(m.x-cx,m.y-f.y);
    if(edible&&md<p.r*3)near=true;
    if(md<p.r*0.9+f.r*d.ry*0.7){
      if(edible){f.alive=false;grow(f.gain);G.stats.fish++;p.chomp=0.16;sfx('chomp',f.r>12);blood(f.x,f.y,f.r>12?12:(f.r>4?4:1),f.r);
        if(f.r>12){G.shake=Math.max(G.shake,f.r*0.2);floatText(f.x,f.y-f.r,f.type==='whale'?'WHALE DEVOURED':'+'+Math.round(f.gain));}}
      else if(danger&&f.biteCd<=0){hurt(d.bite);f.biteCd=1.1;}
    }
  }
  G.prey=G.prey.filter(f=>f.alive);
  return near;
}

/* ---------- ships & swimmers ---------- */
function eject(s,n){
  const d=SHIPS[s.type];
  for(let i=0;i<n&&s.crew>0;i++){s.crew--;G.swim.push({x:s.x+rand(-d.w,d.w)*0.4,y:-d.h*0.6,vx:rand(-70,70)+s.tv*30,vy:-rand(90,190),air:true,t:rand(0,9),life:70,col:pick(['#f1c40f','#e67e22','#ecf0f1','#e74c3c'])});sfx('scream');}
}
function sinkShip(s){
  const d=SHIPS[s.type];s.sink=0.001;eject(s,s.crew);G.stats.ships++;grow(d.bonus*0.5);
  debris(s.x,-d.h*0.3,Math.min(26,8+d.w*0.08),'#7a5a3a',1+d.w*0.004);splash(s.x,16,30+d.w*0.2);
  G.shake=Math.max(G.shake,6+d.w*0.03);sfx('crash');floatText(s.x,-d.h-10,'SUNK','#ffd35c');
}
function updShips(dt){
  const p=G.p,playing=mode==='play'&&G.deadT<=0&&!G.won;
  for(const s of G.ships){
    const d=SHIPS[s.type];
    if(s.sink>0){s.sink+=dt;s.sy+=(12+s.sink*10)*dt;s.tilt+=0.25*dt*(s.tv>=0?1:-1);if(Math.random()<dt*14)bubbles(s.x+rand(-d.w,d.w)*0.4,s.sy,1,6);continue;}
    s.x+=s.vx*dt;if(s.hitCd>0)s.hitCd-=dt;if(s.ejCd>0)s.ejCd-=dt;
    const rb=s.type==='row'?SHORE-240:s.type==='fish'?SHORE-430:SHORE-900;
    if(s.x<260&&s.vx<0)s.vx=d.spd;if(s.x>rb&&s.vx>0)s.vx=-d.spd;
    s.tv+=(-s.tilt*8-s.tv*1.5)*dt;s.tilt=clamp(s.tilt+s.tv*dt,-1.1,1.1);
    if(Math.abs(s.tilt)>0.45&&s.crew>0&&s.ejCd<=0){eject(s,1);s.ejCd=0.5;}
    if(G.deadT>0)continue;
    const c=circRect(p.x,p.y,p.r*0.8,s.x-d.w/2,-d.h*0.55,s.x+d.w/2,d.h*0.6);
    if(c){
      const sp=Math.hypot(p.vx,p.vy);
      if(s.hitCd<=0&&sp>50){
        s.hitCd=0.45;const dir=p.x<s.x?1:-1;
        if(p.r>=d.minR){
          let dmg=(6+p.r*0.45)*(p.dash>0?2.2:1)*clamp(sp/220,0.6,1.8);if(p.r>=d.minR*2.2)dmg=9999;
          s.hp-=dmg;s.tv+=dir*clamp(0.8+dmg/d.hp*5,0.8,3.2);G.shake=Math.max(G.shake,4+d.w*0.02);
          debris(p.x,Math.min(p.y,0),5,'#7a5a3a',0.8);sfx('crash');
          if(Math.random()<0.45+dmg/d.hp*2)eject(s,Math.random()<0.3?2:1);
          if(s.hp<=0)sinkShip(s);
        }else if(p.r>=d.minR*0.6){s.tv+=dir*0.5;toast('Too small to tip this one — yet');}
        else toast('That ship is far too big for you');
      }
      if(s.sink<=0){p.x+=c.nx*c.pen;p.y+=c.ny*c.pen;const vn=p.vx*c.nx+p.vy*c.ny;if(vn<0){p.vx-=1.6*vn*c.nx;p.vy-=1.6*vn*c.ny;}}
    }
    if(!playing)continue;
    s.atkT-=dt;const dx=p.x-s.x,dist=Math.hypot(dx,p.y);
    if(d.harpoon&&s.crew>0&&p.r>=d.minR*0.7&&dist<300&&s.atkT<=0){s.atkT=2.6;const a=Math.atan2(p.y+d.h,dx);shoot('harp',s.x,-d.h,Math.cos(a)*300,Math.sin(a)*300,5);}
    if(d.charges&&s.atkT<=0){
      if(p.y>25&&Math.abs(dx)<240){s.atkT=1.5;shoot('charge',s.x+rand(-d.w,d.w)*0.4,4,0,75,24);}
      else if(p.y<=25&&dist<950){s.atkT=1.9;const a=Math.atan2(p.y+d.h,dx);shoot('shell',s.x,-d.h*1.1,Math.cos(a)*430,Math.sin(a)*430-30,10);}
    }
  }
  G.ships=G.ships.filter(s=>s.sink<7);
  // swimmers
  const m=mouth();
  for(const w of G.swim){
    w.t+=dt;w.life-=dt;
    if(w.air){w.vy+=420*dt;w.x+=w.vx*dt;w.y+=w.vy*dt;if(w.y>=0&&w.vy>0){w.air=false;w.y=1;splash(w.x,4,12);}}
    else{w.y=1.5+Math.sin(w.t*5)*0.8;const away=Math.sign(w.x-p.x)||1;w.x+=away*7*dt;w.x=clamp(w.x,100,SHORE-40);}
    if(G.deadT<=0&&p.r>=9&&Math.hypot(m.x-w.x,m.y-w.y)<p.r*0.9+5){w.life=-1;grow(110);G.stats.crew++;p.chomp=0.16;sfx('chomp',false);blood(w.x,w.y,5,4);floatText(w.x,w.y-10,'+110','#ff9d9d');}
  }
  G.swim=G.swim.filter(w=>w.life>0);
  // fleet upkeep
  G.shipT-=dt;
  if(G.shipT<=0){
    G.shipT=7;const vw=W/G.cam.s,cnt={};for(const s of G.ships)if(s.sink<=0)cnt[s.type]=(cnt[s.type]||0)+1;
    const want={row:4,fish:3,cargo:2,war:G.stage>=4?3:G.stage>=3?2:0};
    for(const t in want){if((cnt[t]||0)>=want[t])continue;
      const x=t==='row'?SHORE-300:270,dir=t==='row'?-1:1;
      if(Math.abs(x-p.x)>vw/2+SHIPS[t].w){addShip(t,x,dir);break;}}
  }
}

/* ---------- projectiles ---------- */
function shoot(type,x,y,vx,vy,dmg){G.proj.push({type,x,y,vx,vy,dmg,life:type==='charge'?8:3.2,ty:G.p.y+rand(-20,30)});}
function updProj(dt){
  const p=G.p;
  for(const b of G.proj){
    b.life-=dt;
    if(b.type==='charge'){
      b.y+=b.vy*dt;if(Math.random()<dt*8)bubbles(b.x,b.y,1,2);
      if(b.y>=b.ty||b.y>terrainY(b.x)-8||b.life<=0||hitPlayer(b.x,b.y,6)){
        b.life=-1;const R=110+p.r,d=Math.hypot(b.x-p.x,b.y-p.y);bubbles(b.x,b.y,22,34);part(b.x,b.y,0,0,0.45,70,'#e8fbff',6);G.shake=Math.max(G.shake,5);sfx('boom');
        if(d<R)hurt(4+b.dmg*(1-d/R));
      }
      continue;
    }
    if(b.type==='shell')b.vy+=80*dt;
    if(b.type==='harp'&&b.y>0){b.vx-=b.vx*1.2*dt;b.vy-=b.vy*1.2*dt;b.vy+=40*dt;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(G.deadT<=0&&hitPlayer(b.x,b.y,3)){b.life=-1;hurt(b.dmg);if(b.type==='shell')boom(b.x,b.y,0.6);continue;}
    if(b.type==='shell'){
      if(b.x>SHORE&&b.y>terrainY(b.x)){b.life=-1;boom(b.x,terrainY(b.x),0.5);}
      else if(b.x<=SHORE&&b.y>2&&b.vy>0){b.life=-1;splash(b.x,8,20);}
    }
  }
  G.proj=G.proj.filter(b=>b.life>0);
}

/* ---------- land ---------- */
function updLand(dt){
  const p=G.p,m=mouth(),titan=p.r>=STAGES[4].r,ashore=p.x>SHORE-150&&titan,sp=Math.hypot(p.vx,p.vy),alive=G.deadT<=0;
  let left=0;
  for(const b of G.builds){
    if(b.shake>0)b.shake-=dt;
    if(b.dead){if(b.fall<1){b.fall=Math.min(1,b.fall+dt*0.85);if(Math.random()<dt*30)dust(b.x+rand(0,b.w),LAND_Y-rand(0,20),1,1.4);}continue;}
    left++;
    if(!alive)continue;
    if(circRect(p.x,p.y,p.r*0.85,b.x,LAND_Y-b.h,b.x+b.w,LAND_Y)){
      const dps=p.r*0.9*(p.dash>0?3.5:1)*(sp>30?1:0.35);
      b.hp-=dps*dt;b.shake=0.15;p.vx-=p.vx*2.2*dt;b.fx-=dt;
      if(b.fx<=0){b.fx=0.09;debris(clamp(p.x,b.x,b.x+b.w),clamp(p.y,LAND_Y-b.h,LAND_Y),2,b.col,1);dust(clamp(p.x,b.x,b.x+b.w),clamp(p.y,LAND_Y-b.h,LAND_Y),1,1);sfx('crumble');G.shake=Math.max(G.shake,2.5);}
      if(b.hp<=0){
        b.dead=true;G.stats.builds++;grow(240+b.w*b.h/90);G.shake=16;sfx('crash');sfx('boom');
        dust(b.x+b.w/2,LAND_Y-b.h*0.3,22,2.4);debris(b.x+b.w/2,LAND_Y-b.h*0.5,22,b.col,1.6);
        floatText(b.x+b.w/2,LAND_Y-b.h-10,b.tower?'THE TOWER FALLS':'CRUSHED','#ffd35c');
        for(let i=0,n=3+(Math.random()*5|0);i<n;i++)addPerson(b.x+rand(0,b.w));
      }
    }else if(b.hp<b.max*0.5&&Math.random()<dt*3)part(b.x+rand(0,b.w),LAND_Y-b.h*rand(0.3,1),rand(-8,8),-rand(20,45),rand(0.8,1.6),rand(7,13)*Z(),'#4a4444',3);
  }
  // people
  for(const h of G.people){
    h.t+=dt;const dx=h.x-p.x;
    h.panic=ashore&&Math.abs(dx)<420+p.r*2;
    if(h.panic)h.dir=dx>=0?1:-1;else if(Math.random()<dt*0.3)h.dir*=-1;
    h.x+=h.dir*(h.panic?46:11)*dt;
    if(h.x<SHORE+45){h.x=SHORE+45;h.dir=1;}if(h.x>WORLD_W-80){h.x=WORLD_W-80;h.dir=-1;}
    const y=terrainY(h.x);
    if(alive&&titan&&Math.hypot(m.x-h.x,m.y-(y-5))<p.r*0.9+5){h.dead=true;grow(110);G.stats.people++;p.chomp=0.14;sfx('chomp',false);if(Math.random()<0.4)sfx('scream');blood(h.x,y-5,4,4);}
  }
  G.people=G.people.filter(h=>!h.dead);
  G.peopleT-=dt;
  if(G.peopleT<=0){G.peopleT=1.5;if(G.people.length<26&&left>0){const live=G.builds.filter(b=>!b.dead);const b=pick(live);if(Math.abs(b.x-p.x)>300)addPerson(b.x+rand(0,b.w));}}
  // cars
  for(const c of G.cars){
    c.x+=c.vx*dt;if(c.x<CITY_X-60&&c.vx<0)c.vx*=-1;if(c.x>WORLD_W-90&&c.vx>0)c.vx*=-1;
    if(alive&&titan&&circRect(p.x,p.y,p.r*0.85,c.x-10,LAND_Y-8,c.x+10,LAND_Y)){c.dead=true;boom(c.x,LAND_Y-5,0.7);grow(60);}
  }
  G.cars=G.cars.filter(c=>!c.dead);
  if(mode!=='play'||G.won)return left;
  // army
  const vw=W/G.cam.s,destroyed=G.stats.builds;
  if(ashore&&alive){
    G.tankT-=dt;
    if(G.tankT<=0){G.tankT=6;if(G.tanks.length<Math.min(5,2+(destroyed/5|0))){const x=clamp(p.x+(Math.random()<0.75?1:-1)*(vw/2+160),SHORE+300,WORLD_W-100);if(Math.abs(x-p.x)>vw/2+40)G.tanks.push({x,cd:rand(1,2.5),dir:-1});}}
    G.heliT-=dt;
    if(G.heliT<=0){G.heliT=9;if(destroyed>=2&&G.helis.length<Math.min(3,1+(destroyed/8|0)))G.helis.push({x:Math.min(WORLD_W+200,p.x+vw/2+200),y:LAND_Y-500,h:rand(230,400),side:Math.random()<0.5?-1:1,cd:2,burst:0,bt:0,st:rand(4,8),t:0});}
  }
  for(const t of G.tanks){
    const dx=p.x-t.x;t.dir=dx>=0?1:-1;if(Math.abs(dx)>470)t.x+=t.dir*30*dt;t.cd-=dt;
    if(alive&&t.cd<=0&&Math.abs(dx)<760){t.cd=2.6;const a=Math.atan2(p.y-(LAND_Y-12),dx);shoot('shell',t.x+t.dir*14,LAND_Y-13,Math.cos(a)*370,Math.sin(a)*370-45,12);}
    if(alive&&circRect(p.x,p.y,p.r*0.85,t.x-15,LAND_Y-13,t.x+15,LAND_Y)){t.dead=true;boom(t.x,LAND_Y-8,1);grow(170);floatText(t.x,LAND_Y-30,'TANK CRUSHED','#ffd35c');}
  }
  G.tanks=G.tanks.filter(t=>!t.dead);
  for(const h of G.helis){
    h.t+=dt;h.st-=dt;if(h.st<=0){h.side*=-1;h.st=rand(4,8);}
    const tx=p.x+h.side*(270+p.r),ty=LAND_Y-h.h+Math.sin(h.t*1.3)*14;
    h.x+=clamp(tx-h.x,-170,170)*dt*1.2;h.y+=clamp(ty-h.y,-140,140)*dt*1.4;
    h.cd-=dt;if(alive&&h.cd<=0&&Math.abs(h.x-p.x)<700){h.cd=2.5;h.burst=4;h.bt=0;}
    if(h.burst>0){h.bt-=dt;if(h.bt<=0){h.bt=0.12;h.burst--;const a=Math.atan2(p.y-h.y,p.x-h.x)+rand(-0.05,0.05);shoot('bullet',h.x,h.y+6,Math.cos(a)*520,Math.sin(a)*520,3);}}
    if(alive&&Math.hypot(p.x-h.x,p.y-h.y)<p.r*0.9+16){h.dead=true;boom(h.x,h.y,1.2);grow(220);floatText(h.x,h.y-20,'SWATTED','#ffd35c');}
  }
  G.helis=G.helis.filter(h=>!h.dead);
  return left;
}

/* ---------- step ---------- */
function step(raw){
  let dt=Math.min(0.033,raw);if(G.slow>0){G.slow-=raw;dt*=0.35;}
  G.t+=dt;const p=G.p;
  // input merge
  let ix=input.kx,iy=input.ky;
  if(input.joy){ix=(input.joy.x-input.joy.ox)/48;iy=(input.joy.y-input.joy.oy)/48;}
  try{const gp=navigator.getGamepads&&navigator.getGamepads()[0];if(gp){if(Math.hypot(gp.axes[0],gp.axes[1])>0.2){ix=gp.axes[0];iy=gp.axes[1];}if(gp.buttons[0]&&gp.buttons[0].pressed&&!input.gpB)input.dash=true;input.gpB=gp.buttons[0]&&gp.buttons[0].pressed;}}catch(e){}
  const im=Math.hypot(ix,iy);if(im>1){ix/=im;iy/=im;}if(im<0.12){ix=0;iy=0;}
  input.x=ix;input.y=iy;
  if(G.deadT>0){G.deadT-=raw;if(G.deadT<=0)respawn();}
  else if(!G.won)updPlayer(dt);
  const near=updPrey(dt);
  updShips(dt);updProj(dt);
  const left=updLand(dt);
  if(mode==='play'&&!G.won&&left===0){G.won=true;G.wonT=0;sfx('roar');G.flash=0.8;}
  if(G.won)G.wonT+=raw;
  // jaw
  let jt=near?0.9:0.12+Math.sin(G.t*2)*0.04;
  if(!near){const m=mouth();for(const w of G.swim)if(Math.hypot(w.x-m.x,w.y-m.y)<p.r*3){jt=0.9;break;}
    if(p.r>=STAGES[4].r&&p.x>SHORE)jt=0.55+Math.sin(G.t*3)*0.1;}
  if(p.chomp>0)jt=0;p.jaw+=(jt-p.jaw)*Math.min(1,16*dt);
  G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=0.25;spawnTick(false);}
  // particles
  for(const q of G.parts){
    q.life-=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.kind===1){q.x+=Math.sin(G.t*6+q.rot)*8*dt;if(q.y<=0)q.life=-1;}
    else if(q.kind===3||q.kind===4){q.vx-=q.vx*1.5*dt;q.vy-=q.vy*1.5*dt;}
    else if(q.kind===2){q.rot+=6*dt;if(q.x>SHORE&&q.y>terrainY(q.x)){q.y=terrainY(q.x);q.vy*=-0.3;q.vx*=0.6;}}
    else if(q.kind===5&&q.y>1&&q.vy>0)q.life=-1;
  }
  G.parts=G.parts.filter(q=>q.life>0);
  for(const t of G.texts){t.t-=dt;t.y-=18*dt*Z();}
  G.texts=G.texts.filter(t=>t.t>0);
  if(G.toast){G.toast.t-=raw;if(G.toast.t<=0)G.toast=null;}
  if(G.banner){G.banner.t-=raw;if(G.banner.t<=0)G.banner=null;}
  if(G.shake>0)G.shake=Math.max(0,G.shake-raw*26);
  if(G.flash>0)G.flash-=raw;
  // camera
  const cam=G.cam;cam.s+=(targetScale()-cam.s)*Math.min(1,1.6*raw);
  const vw=W/cam.s,vh=H/cam.s;
  let tx=p.x+p.vx*0.25,ty=p.y+p.vy*0.15;
  if(p.x>SHORE-200&&p.r>=STAGES[4].r)ty-=vh*0.14;
  tx=clamp(tx,vw/2,Math.max(vw/2,WORLD_W-vw/2));
  cam.x+=(tx-cam.x)*Math.min(1,4*raw);cam.y+=(ty-cam.y)*Math.min(1,4*raw);
}

/* ---------- render ---------- */
function person(x,y,col,t,panic,flail,sc){
  const s=sc||1,sw=Math.sin(t*(panic?16:7))*2.4*s;
  ctx.strokeStyle='#1c1c22';ctx.lineWidth=1.3*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y-4*s);ctx.lineTo(x+sw,y);ctx.moveTo(x,y-4*s);ctx.lineTo(x-sw,y);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=2.1*s;ctx.beginPath();ctx.moveTo(x,y-4*s);ctx.lineTo(x,y-7.6*s);ctx.stroke();
  ctx.lineWidth=1.1*s;ctx.beginPath();
  if(panic||flail){const f=Math.sin(t*14)*1.6*s;ctx.moveTo(x,y-7*s);ctx.lineTo(x-3*s,y-10.5*s+f);ctx.moveTo(x,y-7*s);ctx.lineTo(x+3*s,y-10.5*s-f);}

  ctx.font='700 10px '+FONT;shadowText('PREVIEW A STAGE',W/2,by-10,'rgba(255,255,255,0.7)');
  titleBtns=[];
  for(let i=0;i<n;i++){const x=W/2-tw/2+i*(bw+gap);titleBtns.push({x,y:by,w:bw,h:bw,i});ctx.fillStyle='rgba(255,255,255,0.13)';ctx.fillRect(x,by,bw,bw);ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1;ctx.strokeRect(x+0.5,by+0.5,bw-1,bw-1);ctx.font='800 16px '+FONT;ctx.fillStyle='#fff';ctx.fillText(String(i+1),x+bw/2,by+26);}
}

/* ---------- input ---------- */
function startGame(stage){initAudio();if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}mode='play';newGame(stage);G.banner={title:STAGES[stage].name,sub:STAGES[stage].tip,t:4};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const x=e.clientX,y=e.clientY;
  if(mode==='title'){for(const b of titleBtns)if(x>=b.x-4&&x<=b.x+b.w+4&&y>=b.y-4&&y<=b.y+b.h+4){startGame(b.i);return;}startGame(0);return;}
  if(G.won){if(G.wonT>1.5){mode='title';newGame(0);}return;}
  if(Math.hypot(x-(W-74),y-(H-84))<62){input.dash=true;input.dashPid=e.pointerId;return;}
  if(!input.joy)input.joy={id:e.pointerId,ox:x,oy:y,x,y};
  else input.dash=true;
},{passive:false});
cv.addEventListener('pointermove',e=>{if(input.joy&&e.pointerId===input.joy.id){input.joy.x=e.clientX;input.joy.y=e.clientY;const dx=input.joy.x-input.joy.ox,dy=input.joy.y-input.joy.oy,m=Math.hypot(dx,dy);if(m>70){input.joy.ox+=dx/m*(m-70);input.joy.oy+=dy/m*(m-70);}}},{passive:false});
function pUp(e){if(input.joy&&e.pointerId===input.joy.id)input.joy=null;}
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function keyVec(){input.kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);input.ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);}
window.addEventListener('keydown',e=>{
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(mode==='title'){if(e.code==='Space'||e.code==='Enter')startGame(0);else if(/^Digit[1-5]$/.test(e.code))startGame(+e.code.slice(5)-1);return;}
  if(G.won&&G.wonT>1.5&&(e.code==='Space'||e.code==='Enter')){mode='title';newGame(0);return;}
  if((e.code==='Space'||e.code==='ShiftLeft')&&!e.repeat)input.dash=true;
  keys[e.code]=true;keyVec();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;keyVec();});

/* ---------- loop ---------- */
newGame(0);
let last=0;
function frame(ts){const raw=Math.min(0.1,(ts-last)/1000||0.016);last=ts;step(raw);render();requestAnimationFrame(frame);}
if(typeof window.__TEST__==='undefined')requestAnimationFrame(frame);
else window.__lev={step,render,startGame,get G(){return G;},input,grow,set mode(m){mode=m;}};
</script>
</body>
