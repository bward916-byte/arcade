<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roofline — swipe parkour</title>
<style>
html,body{margin:0;height:100%;background:#0e1320;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;color:#e8edf3}
#c{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,11,20,.58);text-align:center;padding:20px;box-sizing:border-box}
#ov.hide{display:none}
#ov h1{margin:0;font:800 42px system-ui,sans-serif;letter-spacing:.14em;color:#ffcf5a}
#ov p{margin:0;font:600 15px/1.45 system-ui,sans-serif;opacity:.92}
.moves{display:grid;grid-template-columns:auto auto;gap:5px 14px;font:600 14px system-ui,sans-serif;text-align:left;opacity:.92}
.moves b{color:#ffcf5a;white-space:nowrap}
.row{display:flex;gap:12px}
#ov button{min-width:132px;height:56px;border-radius:14px;border:0;font:800 18px system-ui,sans-serif;letter-spacing:.08em;background:#ffcf5a;color:#1a1408;touch-action:manipulation}
#ov button.alt{background:#253047;color:#e8edf3}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov">
  <h1 id="ovT">ROOFLINE</h1>
  <p id="ovS">Rooftops. Drones. No limits.</p>
  <div class="moves" id="ovM">
    <b>↑</b><span>super jump · kong flip · wall run</span>
    <b>↑ ↑ ↑ in air</b><span>stack front flips</span>
    <b>←</b><span>backflips</span>
    <b>→</b><span>corkscrew dash · smash signs + drones</span>
    <b>↓ in air</b><span>meteor slam</span>
    <b>↓</b><span>power slide</span>
  </div>
  <div class="row"><button id="bPlay">PLAY</button><button id="bDemo" class="alt">DEMO</button></div>
</div>
<script>
'use strict';
// =====================================================================
//  Roofline — swipe parkour built on Stride ("feet follow the hips").
//  * On the ground the runner is pure Stride: hips lead, feet run a
//    distance-driven stride cycle, planted feet are locked.
//  * Every parkour move is a short keyframed clip (hip, lean, spin, both
//    ankles, both hands) blended with Hermite curves from wherever the body
//    is, so moves start and end without pops. Arms reach with IK.
//  * In the air the hips follow real ballistic physics; the limbs ease
//    toward leap / landing / tuck poses.
//  * Landing hands the feet straight back to Stride's cycle at the phase
//    that matches where the stance foot touched down.
// =====================================================================
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const sm=k=>{k=clamp(k,0,1);return k*k*(3-2*k);};
const rot=(x,y,a)=>{const c=Math.cos(a),s=Math.sin(a);return [x*c-y*s,x*s+y*c];};

// ---------- body dimensions (px) ----------
const THIGH=28.5, SHIN=27.5, L=THIGH+SHIN, LR=L*0.985;
const ANK=4.5, HEEL=4.5, TOE=15;
const TORSO=31, UA=18.5, FA=17, HEAD=8.6;
const GRAV=1100, JUMPV=520, HARD=560, PX_M=62;

// ---------- course: flat rooftops with ledges, signs, gaps, walls and drops ----------
let P=[],WALLS=[],OB=[],cx=0,cy=0,rnd=Math.random;
const STAIRS=[], PIT=1500;
function rng(seed){seed=Math.max(1,Math.floor(seed)%2147483646);return()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};}
function to(x,y){P.push([x,y]);cx=x;cy=y;}
function flat(d){to(cx+d,cy);}
function drop(y){to(cx+0.5,y);}
function rise(y){WALLS.push({x:cx+0.25,top:y});to(cx+0.5,y);}
let lastK='';
function chunk(){
  const d=clamp((cx-600)/9000,0,1);
  flat(Math.max(lerp(240,130,d)+rnd()*140,lastK==='air'?420:0));
  const r=rnd(); lastK=r>=0.4?'air':'';
  if(r<0.15){const w=14+rnd()*10,h=27+rnd()*7;OB.push({t:'bar',x:cx,w,h,y:cy});flat(w);}
  else if(r<0.4&&r>=0.27){OB.push({t:'drone',x:cx,w:24,y:cy,hy:cy-76});flat(24);}
  else if(r<0.27){const w=26+rnd()*22;OB.push({t:'sign',x:cx,w,y:cy,bot:cy-52,c:Math.floor(rnd()*3)});flat(w);}
  else if(r<0.6){const w=lerp(90,160,d)+rnd()*50,y0=cy,dy=Math.round((rnd()*140-40)/5)*5;drop(y0+PIT);flat(w-1);rise(y0+dy);}
  else if(r<0.78)rise(cy-(90+rnd()*lerp(70,170,d)));
  else drop(cy+90+rnd()*lerp(80,180,d));
}
function newCourse(seed){lastK='';P=[];WALLS=[];OB=[];rnd=rng(seed);to(-700,0);flat(1100);}
function ensureCourse(){while(cx<H.x+1800)chunk();}

function g(x){
  if(x<=P[0][0])return P[0][1]; const n=P.length-1; if(x>=P[n][0])return P[n][1];
  let lo=0,hi=n; while(hi-lo>1){const m=(lo+hi)>>1; if(P[m][0]<=x)lo=m; else hi=m;}
  const a=P[lo],b=P[hi]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);
}
const sg=g, gradeAt=()=>0;
const stairAt=x=>STAIRS.find(s=>x>=s.x0-4&&x<=s.x1+4)||null;
function minGround(a,b){if(a>b){const t=a;a=b;b=t;}let m=Infinity;for(let x=a;x<=b;x+=1.5)m=Math.min(m,g(x));return Math.min(m,g(b));}
function straddles(x,dir){const h=x-dir*HEEL,t=x+dir*TOE,gh=g(h),gt=g(t);for(let k=1;k<6;k++){if(Math.abs(g(h+(t-h)*k/6)-(gh+(gt-gh)*k/6))>1.5)return true;}return false;}
function snap(x,dir){if(!straddles(x,dir))return x;for(let o=1;o<=26;o++){if(!straddles(x-dir*o,dir))return x-dir*o;if(!straddles(x+dir*o,dir))return x+dir*o;}return x;}
function footSpot(x){return snap(x,H.dir);}
function safeSpot(tx){const g0=g(H.x);for(let x=H.x;x<=tx+TOE;x+=2){if(Math.abs(g(x)-g0)>8)return Math.min(tx,x-(TOE+3));}return tx;}   // never plant a foot past a roof edge
const groundAng=x=>{const k=(g(x+5)-g(x-5))/10;return Math.abs(k)>0.9?0:Math.atan(k);};

// ---------- character ----------
let H,F,MV=null;
const AP={f:[[0,0,0],[0,0,0]],h:[[0,0],[0,0]],lead:0};      // air pose, hip-relative
const input={dir:0,run:false};
function resetRunner(){
  H={x:0,y:0,v:0,dir:1,p:0,run:0,mode:'stand',lean:0.05,acc:0,t:0,mv:0,spin:0,piv:[0,0],posed:false,handT:null,handW:null,comp:0,
     vx:0,vy:0,vxm:0,spinGoal:0,spinStart:0,tw:0,dash:null,dashUsed:false,meteor:false,wall:null,flip:null,flipped:false,rollQ:false,dead:false,fell:false,queue:null,buf:null,coyote:0,lastG:0,S:30,airT:0,spinV:0};
  F=[{plant:true,x:6,th:0},{plant:true,x:-8,th:0}];
  H.y=g(H.x)-ANK-0.97*L; H.lastG=g(H.x); H.handW=[[H.x+3,H.y-4],[H.x+6,H.y-4]]; MV=null;
}

function plantPose(x,th){
  const a=groundAng(x), O=[x,g(x)], rho=a+H.dir*th;
  const t0=rot(H.dir*TOE,0,a), T=[O[0]+t0[0],O[1]+t0[1]];
  const k=rot(H.dir*TOE,ANK,rho); return {A:[T[0]-k[0],T[1]-k[1]],rho};
}
function swingPose(f){
  const e=f.e, end=plantPose(f.tx,0), A1=end.A, y0=f.y0, y1=A1[1];
  const top=minGround(f.x0-HEEL,f.tx+H.dir*TOE)-ANK-3;
  const c=Math.min(y0,y1,top)-lerp(0.07*L,0.11*L,H.run), u=1-e;
  const up=y0-y1>4;
  let ax=lerp(f.x0,A1[0],sm(up?(e-0.12)/0.88:e)), ay=u*u*u*y0+3*u*u*e*c+3*u*e*e*c+e*e*e*y1;
  if(!f.timed){const k=H.run*Math.sin(Math.PI*clamp(e/0.7,0,1)); ay-=k*0.3*L; ax-=H.dir*k*0.08*L;}
  const mid=end.rho-H.dir*0.25;
  const rho=e<0.7?lerp(f.r0,mid,sm(e/0.7)):lerp(mid,end.rho,sm((e-0.7)/0.3));
  ay=Math.min(ay,minGround(ax-H.dir*HEEL,ax+H.dir*(TOE+3))-ANK-1);
  for(const lx of[-HEEL,TOE]){const v=rot(H.dir*lx,ANK,rho);ay=Math.min(ay,g(ax+v[0])-v[1]-0.5);}
  return {A:[ax,ay],rho};
}
const pose=f=>H.posed?f.P:(f.plant?plantPose(f.x,f.th):swingPose(f));
function lift(f,s0,tx,timed,dur){const p=pose(f);f.plant=false;f.x0=p.A[0];f.y0=p.A[1];f.r0=p.rho;f.s0=clamp(s0,0,0.95);f.e=0;f.tx=tx;f.timed=!!timed;f.t=0;f.dur=dur||0;}
function land(f){f.plant=true;f.x=f.tx;f.th=0;f.timed=false;}
const timedActive=()=>F.some(f=>!f.plant&&f.timed);
function standSpots(){
  const front=H.dir*F[0].x>=H.dir*F[1].x?0:1, s=[];
  s[front]=snap(H.x+H.dir*0.07*L,H.dir); s[1-front]=snap(H.x-H.dir*0.09*L,H.dir); return s;
}
function strideLen(v){v=Math.max(v,1);const f=lerp(0.55+0.26*v/L,1.32+0.06*v/L,H.run);return Math.max(v/f,0.35*L);}

// ---------- Stride: ground locomotion (unchanged core) ----------
function stride(dt){
  const want=input.dir;
  H.run+=clamp((input.run?1:0)-H.run,-dt*2.2,dt*2.2);
  const run=H.run, beta=lerp(0.62,0.36,run), ahead=lerp(0.5,0.36,run);
  if(H.mode==='stand'&&want!==0&&want!==H.dir&&!timedActive()){H.dir=want;}
  const going=want!==0&&want===H.dir;
  const gr=gradeAt(H.x), st=stairAt(H.x+H.dir*8);
  let S, vMax, f;
  if(st){const n=(run>0.5&&H.v>2.4*L&&input.dir===H.dir&&2*st.w<=0.95*L&&2*st.r<=0.5*L)?2:1; S=2*st.w*n; f=lerp(0.95,1.5,run); vMax=S*f;}
  else vMax=lerp(1.5*L,4.2*L,run)/(1+0.9*Math.abs(gr));
  const v0=H.v, tgt=going?vMax:0, acc=tgt>H.v?3.5*L:6*L;
  H.v+=clamp(tgt-H.v,-acc*dt,acc*dt);
  H.acc=lerp(H.acc,(H.v-v0)/dt,Math.min(1,dt*6));
  if(!st){const v=Math.max(H.v,1);f=lerp(0.55+0.26*v/L,1.32+0.06*v/L,run);S=v/f/(1+0.8*Math.abs(gr));}
  S=Math.max(S,0.35*L); H.S=S;

  if(H.mode==='stand'&&going&&!timedActive()){
    H.mode='go'; const b=H.dir*F[0].x<H.dir*F[1].x?0:1;
    H.p=((Math.max(beta,0.5)+1e-4-b*0.5)%1+1)%1;
  }
  if(H.mode==='go'&&!going&&H.v<0.6*L){
    H.mode='stand'; H.v=0; const sp=standSpots();
    F.forEach((ft,i)=>{if(!ft.plant){lift(ft,0,sp[i],true,0.14+0.2*(1-ft.e));}});
  }
  if(H.mode==='go'){
    const dx=H.v*dt; H.x+=H.dir*dx;
    H.p=(H.p+dx/S)%1;
    F.forEach((ft,i)=>{
      const q=(H.p+i*0.5)%1, inStance=q<beta, s=(q-beta)/(1-beta);
      const predict=()=>safeSpot(footSpot(H.x+H.dir*(S*(1-q)+ahead*beta*S)));
      if(ft.plant&&!inStance)lift(ft,s,predict());
      else if(!ft.plant&&inStance)land(ft);
      if(ft.plant){const u=q/beta;ft.th=lerp(0.55,0.95,run)*sm((u-0.5)/0.5);}
      else{ft.e=clamp((s-ft.s0)/(1-ft.s0),0,1); if(ft.e<0.5)ft.tx=predict();}
    });
  } else {
    F.forEach(ft=>{
      if(ft.plant)ft.th*=Math.exp(-dt*10);
      else{ft.t+=dt;ft.e=clamp(ft.t/ft.dur,0,1);if(ft.e>=1)land(ft);}
    });
    if(!timedActive()){
      const sp=standSpots(); let w=-1,wd=0.16*L;
      F.forEach((ft,i)=>{const d=Math.abs(ft.x-sp[i]);if(d>wd){wd=d;w=i;}});
      if(w>=0)lift(F[w],0,sp[w],true,0.3);
    }
  }
  const hh=lerp(0.97*L,0.9*L,run)+ANK;
  let ty=sg(H.x)-hh+H.comp*0.2*L;
  if(H.mode==='go')ty+=run*0.05*L*Math.cos(4*Math.PI*(H.p-ahead*beta));
  else ty+=Math.sin(H.t*1.7)*0.4;
  F.forEach(ft=>{
    if(ft.plant||ft.e<0.45)return;
    const A=plantPose(ft.tx,0).A, dx=A[0]-H.x;
    if(Math.abs(dx)<LR){const cy=A[1]-Math.sqrt(LR*LR-dx*dx);if(cy>ty)ty=lerp(ty,cy,sm((ft.e-0.45)/0.55));}
  });
  H.y+=(ty-H.y)*Math.min(1,dt*14);
  F.forEach(ft=>{
    if(!ft.plant)return;
    let A=plantPose(ft.x,ft.th).A;
    const behind=H.dir*(A[0]-H.x)<0;
    while(behind&&Math.hypot(A[0]-H.x,A[1]-H.y)>LR&&ft.th<1.0){ft.th+=0.04;A=plantPose(ft.x,ft.th).A;}
    const dx=A[0]-H.x;
    if(Math.abs(dx)<LR){const cy=A[1]-Math.sqrt(LR*LR-dx*dx);if(H.y<cy)H.y=cy;}
  });
  const lt=H.mode==='go'?0.05+0.15*run+clamp(H.acc/(10*L),-0.08,0.12)+H.comp*0.3:0.02;
  H.lean+=(lt-H.lean)*Math.min(1,dt*5);
  H.mv+=((H.mode==='go'?clamp(H.v/(1.2*L),0,1):0)-H.mv)*Math.min(1,dt*4);
}

// ---------- hand the body back to Stride after a move or a landing ----------
function toGround(v,comp,si){
  const A=F.map(ft=>ft.P.A), rh=F.map(ft=>ft.P.rho), gap=A.map(a=>g(a[0])-ANK-a[1]);
  if(si==null)si=gap[0]<=gap[1]?0:1;
  H.posed=false;H.mode='go';H.spin=0;H.piv=[0,0];H.handT=null;H.v=v;H.comp=Math.max(H.comp,comp||0);H.dead=false;H.flip=null;H.queue=null;
  const run=H.run, beta=lerp(0.62,0.36,run), ahead=lerp(0.5,0.36,run), S=strideLen(v);
  const q=clamp(ahead*beta-(A[si][0]-H.x)/S,0,beta*0.8);
  H.p=((q-si*0.5)%1+1)%1;
  const st=F[si];st.plant=true;st.x=snap(A[si][0],H.dir);st.th=0;st.timed=false;
  const o=F[1-si], qo=(q+0.5)%1;
  if(qo>=beta){o.plant=false;o.x0=A[1-si][0];o.y0=Math.min(A[1-si][1],g(A[1-si][0])-ANK);o.r0=rh[1-si];o.s0=clamp((qo-beta)/(1-beta),0,0.95);o.e=0;o.tx=A[1-si][0]+S*0.5;o.timed=false;o.t=0;o.dur=0;}
  else{o.plant=true;o.x=snap(A[1-si][0],H.dir);o.th=0;o.timed=false;}
  H.lastG=g(H.x);
}

// ---------- keyframed moves ----------
// key: u (0..1), hip [x,y], lean, spin, ankle0 [x,y,rho], ankle1, hand0 [x,y], hand1 (hand0 = far arm, moves with leg 0)
function K(u,hip,lean,spin,f0,f1,h0,h1){return {u,v:[hip[0],hip[1],lean,spin,f0[0],f0[1],f0[2],f1[0],f1[1],f1[2],h0[0],h0[1],h1[0],h1[1]]};}
function startMove(kind,keys,dur,o){
  const piv=o.piv||H.piv||[0,0], ps=F.map(ft=>pose(ft)), hw=H.handT||H.handW, bx=o.bx, by=o.by, hx=H.x, hy=H.y;
  const v0=[hx+piv[0]-bx,hy+piv[1]-by,H.lean,H.spin];
  ps.forEach(p=>v0.push(o.rel?p.A[0]-hx:p.A[0]-bx,o.rel?p.A[1]-hy:p.A[1]-by,p.rho));
  hw.forEach(h=>v0.push(o.rel?h[0]-hx:h[0]-bx,o.rel?h[1]-hy:h[1]-by));
  const ks=[{u:0,v:v0},...keys], n=ks.length, C=14, Mt=ks.map(()=>new Array(C).fill(0));
  for(let i=0;i<n;i++){const a=ks[Math.max(0,i-1)],b=ks[Math.min(n-1,i+1)];for(let c=0;c<C;c++)Mt[i][c]=(b.v[c]-a.v[c])/(b.u-a.u);}
  if(o.v0){Mt[0][0]=o.v0[0]*dur;Mt[0][1]=o.v0[1]*dur;}
  if(o.v1){Mt[n-1][0]=o.v1[0]*dur;Mt[n-1][1]=o.v1[1]*dur;}
  F.forEach((ft,i)=>ft.P={A:ps[i].A.slice(),rho:ps[i].rho});
  H.handT=hw.map(h=>h.slice());
  MV={kind,ks,Mt,dur,t:0,o,piv,bx,by};
  H.mode='move';H.posed=true;H.piv=piv;H.queue=null;
}
function stepMove(dt){
  const m=MV; m.t+=dt; const u=clamp(m.t/m.dur,0,1);
  let i=0; while(i<m.ks.length-2&&u>m.ks[i+1].u)i++;
  const a=m.ks[i],b=m.ks[i+1],du=b.u-a.u,t=clamp((u-a.u)/du,0,1),t2=t*t,t3=t2*t;
  const h00=2*t3-3*t2+1,h10=t3-2*t2+t,h01=-2*t3+3*t2,h11=t3-t2;
  const v=a.v.map((p,c)=>h00*p+h10*du*m.Mt[i][c]+h01*b.v[c]+h11*du*m.Mt[i+1][c]);
  H.x=m.bx+v[0]-m.piv[0];H.y=m.by+v[1]-m.piv[1];H.lean=v[2];H.spin=v[3];
  const rel=m.o.rel, upright=Math.abs(Math.sin(H.spin/2))<0.03;
  for(let k=0;k<2;k++){const A=rel?[H.x+v[4+3*k],H.y+v[5+3*k]]:[m.bx+v[4+3*k],m.by+v[5+3*k]];if(upright)A[1]=Math.min(A[1],g(A[0])-ANK);F[k].P={A,rho:v[6+3*k]};}
  H.handT=[0,1].map(k=>rel?[H.x+v[10+2*k],H.y+v[11+2*k]]:[m.bx+v[10+2*k],m.by+v[11+2*k]]);
  if(moveChecks(u))return;
  if(u>=1){MV=null;m.o.end();}
}
function startVault(b){
  const bw=b.w,bh=b.h,v=Math.max(H.v,150),dx=bw+40-(H.x-b.x);
  startMove('vault',[
    K(0.32,[-25,-bh-26],1.25,0,[-62,-bh-28,2.3],[-54,-bh-20,2.1],[4,-bh-1],[9,-bh-1]),
    K(0.55,[bw*0.5+4,-bh-32],0.55,0,[bw*0.5+18,-bh-26,0.4],[bw*0.5+12,-bh-22,0.5],[bw*0.5+10,-bh-30],[bw*0.5+4,-bh-26]),
    K(0.78,[bw+22,-66],0.3,0,[bw+36,-14,0.1],[bw+24,-20,0.3],[bw+48,-82],[bw+30,-74]),
    K(1,[bw+40,-51],0.35,0,[bw+48,-ANK,0],[bw+30,-ANK,0],[bw+66,-72],[bw+46,-64])],
    dx/(v*1.1),{bx:b.x,by:b.y,v0:[v,0],v1:[v,60],end:()=>{award('KONG',50);H.v=v;enterAir(-430);H.spinGoal=2*Math.PI;}});   // kong straight into a front flip
}
function startSlide(sign){
  const v=Math.max(H.v,130)*1.15,D=Math.max(v*0.62,sign?(sign.x+sign.w+12-H.x)/0.86:0),bx=H.x,by=g(H.x);
  startMove('slide',[
    K(0.16,[0.17*D,-34],-0.5,0,[30,28,-0.3],[18,30,0.2],[-16,22],[16,-14]),
    K(0.32,[0.33*D,-14],-1.15,0,[48,9.5,-0.35],[26,9.5,-0.2],[-30,12],[6,-24]),
    K(0.72,[0.74*D,-14],-1.15,0,[48,9.5,-0.35],[26,9.5,-0.2],[-30,12],[6,-24]),
    K(1,[D,-55],0.3,0,[10,50.5,0],[-14,50.5,0],[24,-14],[-10,6])],

// ---------- ground checks + input ----------
function groundChecks(){

}

// ---------- game state, scoring, effects ----------

  ctx.strokeStyle='rgba(170,190,230,.22)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<140;i++){const x=((i*97.3-H.t*260-camX*0.6)%(cw+80)+cw+80)%(cw+80)-40,y=((i*53.7+H.t*900)%(ch+40)+ch+40)%(ch+40)-20;ctx.moveTo(x,y);ctx.lineTo(x-5,y+16);}ctx.stroke();
  if(G.flash>0){ctx.fillStyle=`rgba(255,255,255,${0.45*G.flash})`;ctx.fillRect(0,0,cw,ch);}
  if(G.call){const t=G.call.t,sc=t<0.12?lerp(2.2,1,t/0.12):1;ctx.save();ctx.translate(cw/2,ch*0.32);ctx.scale(sc,sc);ctx.rotate(-0.06);ctx.globalAlpha=clamp((1-t)*2.5,0,1);ctx.textAlign='center';ctx.font='italic 900 38px system-ui,sans-serif';ctx.lineWidth=7;ctx.strokeStyle='#1a0505';ctx.strokeText(G.call.txt,0,0);ctx.fillStyle='#ff3b30';ctx.fillText(G.call.txt,3,3);ctx.fillStyle='#ffd23a';ctx.fillText(G.call.txt,0,0);ctx.restore();ctx.globalAlpha=1;}
  const sp=Math.abs(H.mode==='air'?H.vx:H.vxm);if(sp>360||H.mode==='wall'){ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.5;for(let i=0;i<14;i++){const y=Math.random()*ch,x=Math.random()*cw,l=40+Math.random()*90;ctx.beginPath();if(H.mode==='wall'){ctx.moveTo(x,y);ctx.lineTo(x,y+l);}else{ctx.moveTo(x,y);ctx.lineTo(x-l,y);}ctx.stroke();}}
  if(G.state!=='title'){
    ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='800 26px system-ui,sans-serif';ctx.fillText(Math.floor(G.dist)+' m',16,40);
    ctx.font='700 14px system-ui,sans-serif';ctx.fillStyle='#ffcf5a';ctx.fillText('STYLE '+G.style+(G.mult>1?'   ×'+G.mult:''),16,62);
    ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('BEST '+best,cw-16,30);
    if(G.state==='demo'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='800 14px system-ui,sans-serif';ctx.fillText('DEMO · tap to play',cw/2,30);}
  }
}

// ---------- screens + input ----------
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovS=document.getElementById('ovS'),ovM=document.getElementById('ovM'),bPlay=document.getElementById('bPlay');
function startGame(isBot){
  newCourse(1+Math.floor(Math.random()*2e9));resetRunner();
  G={state:isBot?'demo':'play',bot:isBot,dist:0,style:0,mult:1,x0:H.x,overT:0,botN:0,botT:0,slow:0,shake:0,freeze:0,flash:0,call:null,lt:3,bolt:null};SCARF.length=0;POP=[];PART=[];GHOST=[];
  input.dir=1;input.run=true;camX=H.x;camY=g(H.x)-58;ov.classList.add('hide');
}
function gameOver(){
  if(G.state==='demo'){startGame(true);return;}
  const s=score();if(s>best){best=s;try{localStorage.setItem('roofline-best',best);}catch(e){}}
  G.state='over';ovT.textContent=H.fell?'FELL':'WIPEOUT';ovS.innerHTML=`${Math.floor(G.dist)} m · style ${G.style}<br><b style="color:#ffcf5a;font-size:22px">${s}</b> &nbsp;·&nbsp; best ${best}`;
  ovM.style.display='none';bPlay.textContent='RETRY';ov.classList.remove('hide');
}
bPlay.addEventListener('click',()=>startGame(false));
document.getElementById('bDemo').addEventListener('click',()=>startGame(true));
let sw=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();sw={x:e.clientX,y:e.clientY,done:false};});
cv.addEventListener('pointermove',e=>{if(!sw||sw.done)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.hypot(dx,dy)>24){sw.done=true;swipe(Math.abs(dy)>=Math.abs(dx)?(dy<0?'u':'d'):(dx>0?'r':'l'));}});
cv.addEventListener('pointerup',()=>{if(sw&&!sw.done&&G.state==='demo')startGame(false);sw=null;});
cv.addEventListener('pointercancel',()=>{sw=null;});
addEventListener('contextmenu',e=>e.preventDefault());

newCourse(12345);resetRunner();camX=H.x;camY=g(H.x)-58;
let last=performance.now(),acc=0,paused=false;
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;if(paused)dt=0;if(G.freeze>0){G.freeze-=dt;dt=0;}if(G.slow>0){G.slow-=dt;dt*=0.35;}acc+=dt;
  while(acc>=1/120){step(1/120);acc-=1/120;}
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__cx=()=>camX;window.__cy=()=>camY;window.SIM={get H(){return H},get F(){return F},get G(){return G},get MV(){return MV},get OB(){return OB},get WALLS(){return WALLS},g,step,draw,startGame,swipe,pause:v=>paused=v,LOG,scanAhead};
</script></body></html>
