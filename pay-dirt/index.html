function tone(f,d,ty,v,dl){if(!AC)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}

 if(st==0)pluck(r,musT,.55,.07*soft,'sine');if(st==4)pluck(r+7,musT,.5,.055*soft,'sine');

 musT+=sleep?.42:.29;musS++}}
