<style>
/* Sister site to Quartzsite Campfire: same roadside-sign type and quiet cards,
   but the header is the lake at sundown with the bridge and a balloon drifting over. */
:root{
  --bg:#e9ecec; --surface:#fdfefe; --ink:#16202a; --muted:#52606b; --line:#cdd6d8;
  --primary:#0b6a86; --on-primary:#fff; --accent:#c8481c; --gold:#8f6400; --soft:#dcecf1;

  --display:"Alfa Slab One","Rockwell",Georgia,serif; --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f151c; --surface:#18212b; --ink:#f1ece2; --muted:#a9b4bd; --line:#2e3b47;
  --primary:#5cc8e6; --on-primary:#04222c; --accent:#ff8250; --gold:#f2c14e; --soft:#16303a;
  --ok:#6fd08d; --warn:#f0c060; --land-a:#2a2433; --land-b:#1b1722; --road:#8f8aa0; --water:#3f9bd3; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--body)}
body.big{font-size:20px}
.app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column}

#hero h1{position:absolute;left:16px;top:12px;margin:0;font:400 27px/1 var(--display);letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.55)}
#hero h1 span{color:#ffc061}
#hero p{position:absolute;left:16px;top:44px;margin:0;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#big{position:absolute;right:10px;bottom:8px;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.5);background:rgba(8,10,28,.5);color:#fff;font:700 13px var(--body);cursor:pointer}

main>*{flex-shrink:0}

nav a[aria-current="page"]{color:var(--primary)}

a{color:var(--primary);font-weight:700}

.evb{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}

.next a{color:#fff}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.when{font-weight:700;color:var(--primary)}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:0;background:var(--primary);color:var(--on-primary);font:700 1em var(--body);cursor:pointer}

textarea{resize:vertical;min-height:64px}
.note{border-left:4px solid var(--warn);background:var(--soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.9em}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
details>summary{font-weight:700;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:flex-start;min-height:32px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;font:400 20px/1 var(--display);transition:transform .25s}
details[open]>summary::before{transform:rotate(45deg);background:var(--primary);color:var(--on-primary)}
.list{display:flex;flex-direction:column;gap:10px}
.map{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--land-a)}
.map svg{display:block;width:100%;height:auto}
.map text{font:700 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land-a);stroke-width:3px;stroke-linejoin:round}
.map .lbl{fill:var(--muted);font-weight:400;font-style:italic}
.map .lake{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.map .road{stroke:var(--road);stroke-width:5;fill:none;stroke-linejoin:round}
.map .dash{stroke:var(--land-a);stroke-width:1.2;stroke-dasharray:6 6;fill:none}
.map .pin{cursor:pointer}
.map .pin circle.dot{fill:var(--surface);stroke:var(--ok);stroke-width:3}
.map .pin.fee circle.dot{stroke:var(--gold)} .map .pin.poi circle.dot{stroke:var(--primary)}
.map .pin.sel circle.dot{stroke:var(--accent);stroke-width:5}
.map .pin .hit{fill:transparent}
.lg{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--ok);vertical-align:-2px;margin:0 4px 0 8px}
.lg.fee{border-color:var(--gold)} .lg.poi{border-color:var(--primary)}
@media (prefers-reduced-motion:no-preference){
  @keyframes drift{from{transform:translate(-40px,6px)}to{transform:translate(420px,-10px)}}
  @keyframes bob{50%{transform:translateY(-3px)}}
  @keyframes shimmer{to{stroke-dashoffset:-40}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .balloon{animation:drift 70s linear infinite} .balloon g{animation:bob 4s ease-in-out infinite}
  .shim{animation:shimmer 6s linear infinite}
  main.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
}
#asking{flex:none;display:flex;background:var(--soft);border-bottom:1px solid var(--line)}#asking[hidden]{display:none}
#asking .go{flex:1;text-align:left;background:none;border:0;padding:8px 14px;color:var(--primary);font:700 .85em var(--body);cursor:pointer}
#asking .x{background:none;border:0;padding:0 14px;color:var(--primary);font:400 24px/1 var(--body);cursor:pointer}
.warnmsg{color:var(--accent);font-weight:700;font-size:.9em}.warnmsg:empty{display:none}
button:disabled{opacity:.5;cursor:default}
</style>

/* ---------- content, researched Nov 27 2026 ---------- */
const AREAS=[
 {id:'heights',n:'Havasu Heights',k:'free',la:34.6627,lo:-114.3078,t:'Small',d:'Free BLM. Reached by a paved road toward a small housing area, so it is easy to get into. Small and crowded in winter.'},
 {id:'lonetree',n:'Lone Tree',k:'free',la:34.6279,lo:-114.3298,t:'Easy in, busy',d:'Free BLM, 14-day limit. Right off Hwy 95 between town and I-40 (a camper puts it at mile marker 195). Easiest for big rigs, but rigs pack in tight, there is no shade and it gets windy. Also an off-road staging area.'},
 {id:'craggy',n:'Craggy Wash',k:'free',la:34.5850,lo:-114.3683,t:'Closest to town',d:'Free BLM, 14-day limit, north of town off Hwy 95. Camping starts about a quarter mile up the wash and the land runs back for miles. Very popular; campers report a camp host and strong cell signal. No water, toilets or trash.'},
 {id:'hroad',n:'Havasu Road (south BLM)',k:'free',la:34.4336,lo:-114.2181,t:'Open desert',d:'Free BLM south of town. Most camping is in the first quarter mile; past that you need high-clearance 4WD. Flat and hard packed. Some highway noise.'},
 {id:'standard',n:'Standard Wash',k:'free',la:34.4193,lo:-114.1991,t:'Off-road crowd',d:'Free BLM, 14-day limit. A designated off-highway vehicle area, so weekends are loud. Camping is in the first half mile, which is bumpy and soft in places; trailers and motorhomes still make it.'},
 {id:'scenic',n:'Scenic View',k:'free',la:34.3970,lo:-114.1737,t:'Smaller',d:'Free BLM. A dirt road about a mile long across the highway from a viewpoint; camp in the first quarter mile.'},
 {id:'steps',n:'The Steps',k:'fee',la:34.3336,lo:-114.1360,t:'Permit needed',d:'Arizona State Trust Land, not BLM. You need a State Land recreational permit to camp here, and campers report a 14-days-per-year limit on trust land. Once an unfinished RV park, so it is terraced and popular.'},
 {id:'statepark',n:'Lake Havasu State Park',k:'fee',la:34.4897,lo:-114.3562,t:'Paid, on the lake',d:'699 London Bridge Rd, (928) 855-2784. Paid sites with water and electric, showers, beach, boat ramps. The public dump station is here: $15 if you are not camping in the park.'},
 {id:'cattail',n:'Cattail Cove State Park',k:'fee',la:34.354,lo:-114.166,approx:1,t:'Paid, quieter',d:'State park south of town on the lake. Slower pace than the big park, with showers and a dog park. Its dump station is for park guests only.'}
];
const POI=[
 {id:'bridge',n:'London Bridge',la:34.4716,lo:-114.3475,approx:1,d:'The bridge, the English Village, the visitor center and the Bridgewater Channel walk. Pick up the lighthouse guide at the visitor center.'},
 {id:'sara',n:'SARA Park',la:34.425,lo:-114.275,approx:1,d:'Free county park: the Crack in the Mountain slot-canyon hike, about 80 miles of bike trails, a big dog park, rodeo grounds and the Winter Blast fireworks.'},
 {id:'dam',n:'Parker Dam',la:34.2965,lo:-114.1394,approx:1,d:'The dam that made the lake, about 16 miles south. Most of its 320 feet is below the riverbed.'}
];
const EVENTS=[
 {n:'London Bridge Swap Meet',b:['OCT–APR','Sundays'],w:'Sundays through the cooler months',p:'London Bridge Plaza Association, (928) 680-5685',s:'typ',d:'The weekly swap meet. Sources give the season as October to late April or Labor Day to Memorial Day, so call for dates.'},
 {n:'Festival of Lights',b:['NOV–DEC','nightly'],w:'Late November through December',p:'English Village, under London Bridge',s:'typ',d:'Hundreds of thousands of lights along the channel. Free to walk.'},

 {n:'Buses by the Bridge',b:['JAN','mid'],w:'Mid January (Jan 15–18 last season)',p:'Lake Havasu State Park, Windsor 4',s:'typ',d:'Hundreds of VW buses camp out by the lake. Live music, vendors, Sunday pancake breakfast.'},
 {n:'Havasu Balloon Festival & Fair',b:['JAN','21–24'],f:1,date:'2027-01-21',w:'January 21–24, 2027',p:'Lake Havasu State Park, Windsor 4, 171 London Bridge Rd',s:'ok',d:'The signature winter event: mass launches over the channel, night glow, carnival and vendors. Pilots decide each morning on wind, so check their Facebook page. Pets are not allowed on the grounds.'},

const FAQ=[
 ['How do I find Craggy Wash, and what is it like?','Forum regulars say to turn at the immediate north end of the airport runway and follow the track in about half a mile. It is sheltered from the wind, and rigs up to 43 feet have been reported. Cell reports conflict: older posts say weak, recent ones say strong and that Starlink works. Some campers describe unpleasant run-ins and long-term occupants near the front, while others stay happily; the usual advice is to drive farther in, or use the flat a little north.',2],
 ['What if every RV park is full?','Forum posters say winter spaces are few and far between and that some people have had to change sites daily. The state park has roomier, cheaper sites but a 14-day limit, and opens a dry overflow lot by the beach when the campground is full (reviewers report about $25 a night and a 7-day limit). Book the state park well ahead.',2],
 ['Can I boondock on the lake side of Hwy 95?','No. The free camping is on the east side of the highway. For water-side camping, forum posters point to two paid BLM campgrounds on the California side of the river, Crossroads and Empire Landing.',2],
 ['Is there a dump station besides the state park, or on the north side?','The state park is the one everyone names. Campers also say: some RV parks let non-guests dump for a fee (Crazy Horse Campground and Sam\'s Beachcomber on the island were named); the Elks Lodge has one free for members, (928) 453-3557; and truck stops at the Hwy 95 and I-40 junction, about 15 miles north of London Bridge, may have one, so check first. A city RV dump with a posted season was also mentioned but nobody confirmed where or when. One tip: the state park line is shorter after 1 pm. Heading north, a reviewer reports a free two-lane dump at Moabi Regional Park near Needles, just before the fee booth. J Bird Storage has a dump too, but it is for its storage renters only.',1],
 ['Where can I empty a portable tote tank?','Not at the state park: two separate campers report being turned away with a tote. Replies suggest paying an RV park to dump, or a septic pump-out service that comes to your site (John Smith Septic and Jackpots were named).',1],
 ['Who does mobile RV repair?','Names campers gave each other: Black Sheep RV Repair, (928) 566-2834; Desert RV Werks; Bennett\'s RV Repairs; First Class RV & Marine, (928) 412-8686; Happy Camper. A common arrival problem is a water line that froze on the drive down.',1],
 ['Which RV park is best for the winter, and what does a month cost?','Replies say it depends on what you want. With a boat, Sam\'s Beachcomber. Islander was called the prettiest. Full-timers also mentioned Prospectors RV Resort. One covered 50 by 20 foot pad at River Bound was quoted at $700 a month. Several people said parks do not answer the phone, so start early.',1],
 ['Where do people actually boondock?','Replies point to Craggy Wash, just north of the airport off Hwy 95, and to the open BLM desert south of town along Hwy 95 across from SARA Park, which has off-road trails. One camper said the first BLM turn south of town has lake views.',1],
 ['Can I camp overnight on the lake shore?','Replies say yes at the designated boat-in sites: buy the pass at the Windsor launch ramp in the state park. The fee covers restrooms, tables and grills at those sites. People disagreed about anchoring out for free, so ask the park.',1],
 ['Where can I camp for free?','On BLM land north and south of town: Craggy Wash, Lone Tree and Havasu Heights to the north; Havasu Road, Standard Wash and Scenic View to the south. Open the Map tab for each one.'],
 ['Is there water, a toilet or trash at the free areas?','No. None of them have any services. Arrive with full water and empty tanks, and pack your trash out.'],
 ['How long can I stay?','14 days in a BLM area. Campers report the rule is that you then move at least 25 miles. Enforcement varies, so ask the camp host or call the BLM Lake Havasu Field Office at (928) 505-1200.'],
 ['Where do I dump and fill water?','Lake Havasu State Park, 699 London Bridge Rd. Non-campers pay $15 and do not pay the park entry fee just to dump. There are two dump lanes and a drinking-water spigot. Campers report long waits in season, and one was told portable tote tanks were not allowed. Boondocks RV Station in Parker (dump, filtered water, propane) gets very good reviews if you are heading south.'],
 ['Is Havasu like Quartzsite?','No. There is no long-term permit area with water and a dump station here. Free camping is smaller and more crowded, and most winter visitors stay in RV parks and resorts. The trade is a real city: big stores, a hospital, restaurants and the lake.'],
 ['Do I need a permit at The Steps?','Yes. It is Arizona State Trust Land, not BLM. Buy a recreational permit from the State Land Department before you camp.'],
