<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh}
</style></head><body><canvas id="c"></canvas><script>
'use strict';
(function(){
// ================= CORE =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Courier New",Courier,monospace';
let W=0,H=0,DPR=1,CR=0.6,vignette=null,scanPat=null;
const gl1=document.createElement('canvas'),g1=gl1.getContext('2d');
const gl2=document.createElement('canvas'),g2=gl2.getContext('2d');
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  gl1.width=Math.max(2,Math.round(cv.width/4));gl1.height=Math.max(2,Math.round(cv.height/4));
  gl2.width=Math.max(2,Math.round(cv.width/12));gl2.height=Math.max(2,Math.round(cv.height/12));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.font='bold 100px '+FONT;CR=(ctx.measureText('M').width/100)||0.6;
  const s=document.createElement('canvas');s.width=2;s.height=3;const sc2=s.getContext('2d');sc2.fillStyle='rgba(0,0,0,0.2)';sc2.fillRect(0,2,2,1);scanPat=ctx.createPattern(s,'repeat');
  vignette=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.max(W,H)*0.72);
  vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,0.78)');
}
window.addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
let SEED=4242;
function rng(){SEED=(SEED+0x6D2B79F5)|0;let t=SEED;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const R=(a,b)=>a+Math.random()*(b-a);
const NS=9173;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+NS)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){let s=0,a=0.5,f=1;for(let i=0;i<4;i++){s+=a*vn(x*f,y*f);f*=2;a*=0.5;}return s/0.9375;}
function rgb(r,g,b){return 'rgb('+(r>255?255:r<0?0:r|0)+','+(g>255?255:g<0?0:g|0)+','+(b>255?255:b<0?0:b|0)+')';}
function rgba(r,g,b,a){return 'rgba('+(r>255?255:r<0?0:r|0)+','+(g>255?255:g<0?0:g|0)+','+(b>255?255:b<0?0:b|0)+','+clamp(a,0,1).toFixed(3)+')';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}

// ================= AUDIO =================
let AC=null,master=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.75;master.connect(AC.destination);startAmbient();}catch(e){AC=null;}
}
function getNoise(){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}return noiseBuf;}
function tone(f,d,type,v,f2,delay){if(!AC)return;try{const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||0.1,t0+Math.min(0.02,d/3));g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+0.05);}catch(e){}}
function noise(d,v,freq,type,delay){if(!AC)return;try{const t0=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=getNoise();const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||800;const g=AC.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random());s.stop(t0+d+0.05);}catch(e){}}
function startAmbient(){
  try{
    const g=AC.createGain();g.gain.value=0.045;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;lp.connect(g);g.connect(master);
    [55,55.35,82.4,110.2].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();});
    const s=AC.createBufferSource();s.buffer=getNoise();s.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=0.8;const wg=AC.createGain();wg.gain.value=0.035;s.connect(bp);bp.connect(wg);wg.connect(master);s.start();
    const lfo=AC.createOscillator();lfo.frequency.value=0.07;const lg=AC.createGain();lg.gain.value=320;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  }catch(e){}
}
function setMute(m){muted=m;if(master)master.gain.value=m?0:0.75;}
const sfx={
  step(){noise(0.04,0.018,900);},
  blip(){tone(500+Math.random()*90,0.03,'square',0.01);},
  hit(){noise(0.2,0.3,2200);tone(140,0.22,'square',0.07,45);},
  crit(){noise(0.2,0.3,2200);tone(140,0.22,'square',0.07,45);tone(660,0.5,'triangle',0.09,1320);noise(0.5,0.15,5000,'highpass');},
  fire(){noise(0.7,0.22,700,'bandpass');tone(180,0.6,'sawtooth',0.05,520);},
  heal(){[523,659,784,1046].forEach((f,i)=>tone(f,0.5,'sine',0.06,0,i*0.08));},
  parry(){tone(1500,0.2,'square',0.05,2600);noise(0.12,0.2,6000,'highpass');},
  hurt(){tone(95,0.35,'sawtooth',0.12,38);noise(0.25,0.2,500);},
  battle(){tone(110,0.9,'sawtooth',0.09,40);noise(0.9,0.2,300);tone(55,1.2,'sine',0.15,30);},
  beacon(){[220,277,330,440,554].forEach((f,i)=>tone(f,3,'triangle',0.05,0,i*0.12));noise(1.4,0.25,1200,'bandpass');},
  win(){[392,494,587,784].forEach((f,i)=>tone(f,0.6,'triangle',0.07,0,i*0.11));},
  lvl(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0.7,'square',0.035,0,i*0.09));},
  flag(){tone(1800,0.08,'square',0.045);},
  seal(){tone(70,2.5,'sawtooth',0.15,30);noise(2,0.35,400);},
  die(){tone(220,1.6,'triangle',0.1,55);},
  whoosh(){noise(1.3,0.16,500,'bandpass');tone(70,1.2,'sine',0.07,210);for(let i=0;i<5;i++)tone(300+Math.random()*1500,0.03,'square',0.012,0,0.2+i*0.12);},
  boom(){tone(48,2.2,'sine',0.25,28);noise(1.5,0.3,180);tone(311,2.5,'sawtooth',0.02,290,0.4);},
  title(){[110,165,220,277,330].forEach((f,i)=>tone(f,4,'triangle',0.045,0,i*0.18));noise(2,0.15,900,'bandpass');},
  shatter(){noise(1.2,0.35,3000,'highpass');tone(880,1.2,'triangle',0.06,110);},
  chime(){const sc=[220,261.6,293.7,329.6,392,440,523.3];const f=sc[Math.floor(Math.random()*sc.length)];tone(f,3,'sine',0.028);tone(f*2,2,'sine',0.01,0,0.02);tone(f,3,'sine',0.013,0,0.45);}
};

// ================= CINEMATIC =================
let cine=null,cap=null;
function play(steps){cine={s:steps,i:-1,w:0};lbTarget=1;next();}
function endCine(){cine=null;cap=null;lbTarget=0;camLock=false;camK=5;}
function next(){
  while(cine){
    cine.i++;
    if(cine.i>=cine.s.length){endCine();return;}
    const st=cine.s[cine.i];
    if(st.cam){camLock=true;camT.x=st.cam[0];camT.y=st.cam[1];camT.z=st.cam[2];camK=st.k||1.2;if(st.snap){cam.x=camT.x;cam.y=camT.y;cam.z=camT.z;}continue;}
    if(st.release){camLock=false;camK=4;continue;}
    if(st.fn){st.fn();continue;}
    if(st.wait!==undefined){cine.w=st.wait;cap=null;return;}
    if(st.say){cap={who:st.who||'',text:st.say,shown:0,done:false};return;}
  }
}
function updateCine(dt){if(!cine)return;if(cap){if(!cap.done){const p=Math.floor(cap.shown);cap.shown+=dt*46;if(Math.floor(cap.shown)!==p&&p%3===0)sfx.blip();if(cap.shown>=cap.text.length){cap.shown=cap.text.length;cap.done=true;}}return;}cine.w-=dt;if(cine.w<=0)next();}
function cineTap(){if(!cine)return;if(cap){if(!cap.done){cap.shown=cap.text.length;cap.done=true;}else{cap=null;next();}}}

// ================= WIPE =================
let wipe=null;
function doWipe(mid,dur){wipe={t:0,dur:dur||1,mid,md:false};}
function drawWipe(){const h=wipe.dur/2;let c=wipe.t<h?wipe.t/h:1-(wipe.t-h)/h;c=clamp(c,0,1);c=c*c*(3-2*c);
  const fs=18,cw=fs*CR,ch=fs;const cols=Math.ceil(W/cw)+1,rows=Math.ceil(H/ch)+1;const md=Math.hypot(W/2,H/2);
  ctx.font='bold '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const x=q*cw,y=r*ch;const d=Math.hypot(x+cw/2-W/2,y+ch/2-H/2)/md;const v=d*0.7+hash(q,r)*0.3;const dep=c*1.08-v;if(dep<=0)continue;
    if(dep>0.16){ctx.fillStyle='#000';ctx.fillRect(x,y,cw+1,ch+1);continue;}
    ctx.fillStyle='#000';ctx.fillRect(x,y,cw+1,ch+1);
    const g=dep>0.1?'\u2593':dep>0.05?'\u2592':'\u2591';const k=1-dep/0.16;ctx.fillStyle=rgb(255*k,120*k*k,40*k*k);ctx.fillText(g,x+cw/2,y+ch/2);}}

// ================= POST FX =================
function bloom(a1,a2){
  g1.clearRect(0,0,gl1.width,gl1.height);g1.drawImage(cv,0,0,gl1.width,gl1.height);
  g2.clearRect(0,0,gl2.width,gl2.height);g2.drawImage(gl1,0,0,gl2.width,gl2.height);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;
  ctx.globalAlpha=a1;ctx.drawImage(gl1,0,0,cv.width,cv.height);ctx.globalAlpha=a2;ctx.drawImage(gl2,0,0,cv.width,cv.height);ctx.restore();
}
function post(){ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);}
function lbH(){return lb*clamp(H*0.15,54,120);}
function drawBars(){const h=lbH();if(h<0.5)return;ctx.fillStyle='#000';ctx.fillRect(0,0,W,h*0.72);ctx.fillRect(0,H-h,W,h);}
function drawCaption(c,who){
  if(!c)return;const fz=clamp(H*0.042,13,19);ctx.font=fz+'px '+FONT;const lines=wrap(c.text,Math.min(W*0.84,720));
  const lh=fz*1.35;const bh=Math.max(lbH(),lines.length*lh+(who?fz*1.4:0)+20);let y=H-bh+12;
  ctx.textAlign='center';ctx.textBaseline='top';
  if(who){ctx.font='bold '+(fz*0.78)+'px '+FONT;ctx.fillStyle='#e8a050';ctx.fillText(who.split('').join(' '),W/2,y);y+=fz*1.3;ctx.font=fz+'px '+FONT;}
  let left=Math.floor(c.shown);
  for(const l of lines){const s=l.slice(0,Math.max(0,left));left-=l.length+1;ctx.fillStyle='#e9dcc4';ctx.fillText(s,W/2,y);y+=lh;}
  if(c.done&&Math.sin(time*6)>0){ctx.fillStyle='#e8a050';ctx.fillText('\u25bc',W/2,y-4);}
}
function muteButton(){const s=34;btn(W-s-10,10,s,s,muted?'x':'\u266a',()=>setMute(!muted),{fs:15});}
function btn(x,y,w,h,label,fn,o){o=o||{};buttons.push({x,y,w,h,fn,off:!!o.off});
  ctx.fillStyle=o.off?'rgba(20,14,10,0.55)':'rgba(32,18,10,0.78)';rr(x,y,w,h,8);ctx.fill();
  ctx.strokeStyle=o.off?'rgba(120,90,60,0.35)':(o.hl?'rgba(255,200,110,1)':'rgba(225,150,70,0.8)');ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=o.off?'rgba(150,120,90,0.45)':'#ffdca8';ctx.font='bold '+(o.fs||14)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w/2,y+h/2+1);}

// ================= ASCII INTRO =================
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
const IR={cols:0,rows:0,fs:12,cw:7,ch:12,WU:1,HU:1};
let bufA=null,bufB=null,mask=null,logoF=null,arrived=null;
const RAMP=' .,:;-=+*#%@';
const SCR='01#$%&@*+=<>/\\|?!{}[]';
function mkBuf(n){return{l:new Float32Array(n),r:new Uint8ClampedArray(n),g:new Uint8ClampedArray(n),b:new Uint8ClampedArray(n)};}
function introGrid(){const fs=clamp(Math.min(W/(98*CR),H/31),8,17);const cw=fs*CR,ch=fs*1.05;const cols=Math.ceil(W/cw),rows=Math.ceil(H/ch);
  if(cols!==IR.cols||rows!==IR.rows){sc.width=cols;sc.height=rows;const n=cols*rows;bufA=mkBuf(n);bufB=mkBuf(n);mask=new Float32Array(n);logoF=new Uint8Array(n);arrived=new Uint8Array(n).fill(1);IR.cols=cols;IR.rows=rows;IR.cw=cw;IR.ch=ch;if(IN.trans&&IN.trans.type!=='converge')makeMask(IN.trans.type);}
  IR.fs=fs;IR.cw=cw;IR.ch=ch;IR.WU=cols;IR.HU=rows*ch/cw;}
function sample(fn,t,p,buf){sx.setTransform(1,0,0,1,0,0);sx.globalCompositeOperation='source-over';sx.globalAlpha=1;sx.fillStyle='#000';sx.fillRect(0,0,IR.cols,IR.rows);
  sx.setTransform(1,0,0,IR.cw/IR.ch,0,0);sx.save();fn(sx,t,p||{});sx.restore();
  const d=sx.getImageData(0,0,IR.cols,IR.rows).data;const n=IR.cols*IR.rows;
  for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];buf.r[i]=r;buf.g[i]=g;buf.b[i]=b;buf.l[i]=(0.3*r+0.59*g+0.11*b)/255;}}
function makeMask(type){const cols=IR.cols,rows=IR.rows,md=Math.hypot(W/2,H/2);for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const u=i/cols,v=j/rows;let m;
  if(type==='radial'){m=Math.hypot((u-0.5)*W,(v-0.5)*H)/md*0.85+(vn(i*0.15,j*0.3)-0.5)*0.3+0.06;}
  else if(type==='sweep'){m=u*0.82+(vn(i*0.08,j*0.25)-0.5)*0.36+0.09;}
  else if(type==='rise'){m=(1-v)*0.78+(vn(i*0.2,j*0.2)-0.5)*0.42+0.11;}
  else m=hash(i,j);
  mask[j*cols+i]=clamp(m,0,1);}}
// --- scenes (drawn in square units: WU x HU) ---
function emberDots(c,t,n,w,h,speed){for(let i=0;i<n;i++){const sp=(0.04+hash(i,1)*0.08)*speed;const life=(t*sp+hash(i,2))%1;const x=w*hash(i,3)+Math.sin(t*0.8+i)*2.5;const y=h*(1.05-life*1.15);const s=0.45+hash(i,4)*1.1;const a=Math.sin(life*Math.PI);c.fillStyle='rgba(255,'+(130+(hash(i,5)*110|0))+',60,'+a.toFixed(3)+')';c.beginPath();c.arc(x,y,s,0,7);c.fill();}}
function flameTongues(c,cx,by,spread,n,maxH,t,bw){c.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const k=(i-(n-1)/2);const off=k*spread;const hh=maxH*(0.55+0.45*vn(t*2.3+i*3.1,i))*(1-Math.abs(k)/(n*0.9));if(hh<0.4)continue;const sway=(vn(t*1.7+i,5)-0.5)*maxH*0.35;const x0=cx+off,top=by-hh;
  const gr=c.createLinearGradient(0,by,0,top);gr.addColorStop(0,'rgba(255,250,210,0.95)');gr.addColorStop(0.3,'rgba(255,180,50,0.85)');gr.addColorStop(0.7,'rgba(225,70,20,0.6)');gr.addColorStop(1,'rgba(120,20,10,0)');
  c.fillStyle=gr;c.beginPath();c.moveTo(x0-bw,by);c.quadraticCurveTo(x0-bw*1.3+sway*0.3,by-hh*0.5,x0+sway,top);c.quadraticCurveTo(x0+bw*1.3+sway*0.3,by-hh*0.5,x0+bw,by);c.closePath();c.fill();}c.globalCompositeOperation='source-over';}
const SC={
  embers(c,t){const w=IR.WU,h=IR.HU;const g=c.createRadialGradient(w/2,h*1.08,0,w/2,h*1.08,h*0.95);g.addColorStop(0,'rgba(150,55,20,'+(0.5+0.1*Math.sin(t*2)).toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,w,h);emberDots(c,t,80,w,h,1);},
  hearth(c,t,p){const w=IR.WU,h=IR.HU,cx=w/2,by=h*0.84,die=p.die||0,life=1-die;
    let g=c.createRadialGradient(cx,by-h*0.18,0,cx,by-h*0.18,h*1.0);g.addColorStop(0,'rgba(255,140,50,'+(0.6*life).toFixed(3)+')');g.addColorStop(0.45,'rgba(130,45,15,'+(0.35*life).toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
    if(die>0){g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(40,60,120,'+(0.4*die).toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,w,h);}
    const hc=rgb(105*life+34*die,58*life+42*die,34*life+66*die);
    const houses=[[0.03,0.2,0.3],[0.22,0.11,0.17],[0.74,0.2,0.33],[0.62,0.1,0.16]];
    for(const q of houses){const x=w*q[0],ww=w*q[1],hh=h*q[2];c.fillStyle=hc;c.fillRect(x,by-hh,ww,hh);c.beginPath();c.moveTo(x-ww*0.1,by-hh);c.lineTo(x+ww/2,by-hh-hh*0.45);c.lineTo(x+ww*1.1,by-hh);c.fill();
      c.fillStyle=rgba(255,190,90,life*(0.7+0.3*Math.sin(t*3+x)));c.fillRect(x+ww*0.3,by-hh*0.65,ww*0.14,hh*0.2);}
    c.fillStyle=rgb(40*life+18*die,26*life+20*die,18*life+30*die);c.fillRect(0,by,w,h-by);
    c.fillStyle=rgb(125,112,100);c.beginPath();c.moveTo(cx-w*0.1,by-h*0.07);c.lineTo(cx+w*0.1,by-h*0.07);c.lineTo(cx+w*0.065,by+h*0.02);c.lineTo(cx-w*0.065,by+h*0.02);c.closePath();c.fill();

function moveBody(b,dt,oneway){
  const hw=b.w/2;
  if(b.vx!==0){let nx=b.x+b.vx*dt;const edge=b.vx>0?nx+hw:nx-hw;const tx=Math.floor(edge);const y0=Math.floor(b.y-b.h+0.05),y1=Math.floor(b.y-0.05);let hit=false;
    for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){hit=true;break;}
    if(hit){nx=b.vx>0?tx-hw-0.001:tx+1+hw+0.001;b.vx=0;b.hitWall=true;}else b.hitWall=false;b.x=nx;}
  b.onG=false;let ny=b.y+b.vy*dt;const x0=Math.floor(b.x-hw+0.02),x1=Math.floor(b.x+hw-0.02);
  if(b.vy>=0){const ty=Math.floor(ny);for(let tx=x0;tx<=x1;tx++){const t=T(tx,ty);if(SOLID[t]||(oneway&&ONEWAY[t]&&b.y<=ty+0.02&&!(b.drop>0))){ny=ty;b.vy=0;b.onG=true;break;}}}
  else{const ty=Math.floor(ny-b.h);for(let tx=x0;tx<=x1;tx++){if(solid(tx,ty)){ny=ty+1+b.h;b.vy=0;break;}}}
  b.y=ny;
}
function stepBody(b,dt,oneway){const n=Math.max(1,Math.ceil(Math.max(Math.abs(b.vx),Math.abs(b.vy))*dt/0.4));for(let i=0;i<n;i++)moveBody(b,dt/n,oneway);}
function overlap(ax0,ay0,ax1,ay1,bx0,by0,bx1,by1){return ax0<bx1&&ax1>bx0&&ay0<by1&&ay1>by0;}
function pbox(){return[P.x-P.w/2,P.y-P.h,P.x+P.w/2,P.y];}

// ================= PLAYER =================
function onOneway(){const ty=Math.round(P.y);return ONEWAY[T(Math.floor(P.x),ty)]===1;}
function updatePlayer(dt){
  if(P.dead){P.vx*=0.9;P.vy=Math.min(26,P.vy+55*dt);stepBody(P,dt,true);return;}
  let dir=0,down=false;
  if(!cine&&!wipe){if(KEYS.arrowleft||KEYS.a)dir-=1;if(KEYS.arrowright||KEYS.d)dir+=1;if(KEYS.arrowdown||KEYS.s)down=true;
    if(joy){const vx=joy.x-joy.bx,vy=joy.y-joy.by;if(vx>14)dir=1;else if(vx<-14)dir=-1;if(vy>34&&vy>Math.abs(vx))down=true;}}
  const atking=P.atkT>0;const target=dir*9*(atking&&P.onG?0.4:1);const acc=P.onG?75:45;
  if(P.hurtT>0)P.hurtT-=dt;else{if(target>P.vx)P.vx=Math.min(target,P.vx+acc*dt);else if(target<P.vx)P.vx=Math.max(target,P.vx-acc*dt);}
  if(dir&&!atking)P.face=dir;
  P.coyote=P.onG?0.1:P.coyote-dt;P.jbuf-=dt;
  if(P.jbuf>0&&P.coyote>0){if(down&&onOneway()){P.drop=0.3;P.jbuf=0;P.y+=0.05;}else{P.vy=-21;P.coyote=0;P.jbuf=0;sfx.jump();dust(P.x,P.y,5);}}
  P.vy+=55*dt*((!jumpHeld&&P.vy<0)?2.2:1);P.vy=Math.min(26,P.vy);P.drop-=dt;
  const wasG=P.onG;stepBody(P,dt,true);if(!wasG&&P.onG&&P.vy===0){dust(P.x,P.y,4);sfx.land();}
  P.inv=Math.max(0,P.inv-dt);P.atkT=Math.max(0,P.atkT-dt);P.fireCd=Math.max(0,P.fireCd-dt);P.swing=Math.max(0,P.swing-dt);
  P.mpT+=dt;if(P.mpT>4){P.mpT=0;P.mp=Math.min(P.mmp,P.mp+1);}
  P.anim+=dt*(Math.abs(P.vx)>0.5?Math.abs(P.vx)*1.1:2);
  // hazards
  const cx=Math.floor(P.x);
  if(P.y>LH+2||T(cx,Math.floor(P.y-0.6))===WATER){splash();return;}
  if(T(cx,Math.floor(P.y-0.3))===THORN&&P.inv<=0){hurt(5,P.x-P.face);P.vy=-14;}
  if(P.onG&&P.drop<=0&&solid(Math.floor(P.x-0.45),Math.round(P.y))&&solid(Math.floor(P.x+0.45),Math.round(P.y))&&T(cx,Math.round(P.y)-1)!==THORN){P.safeX=P.x;P.safeY=P.y;}
  // attack hits
  if(P.atkT>0.1){const reach=P.atkN===2?3.2:2.8;const x0=P.face>0?P.x-0.3:P.x-reach,x1=P.face>0?P.x+reach:P.x+0.3,y0=P.y-3.3,y1=P.y+0.3;
    for(const e of enemies){if(!e.alive||P.hitSet.has(e))continue;if(overlap(x0,y0,x1,y1,e.x-e.w/2,e.y-e.h,e.x+e.w/2,e.y)){P.hitSet.add(e);const crit=Math.random()<0.15;const d=Math.round(P.atk*(P.atkN===2?1.6:1)*R(0.9,1.15)*(crit?2:1));hitEnemy(e,d,P.face*(P.atkN===2?10:6),crit);}}
    if(K.alive&&bossStarted&&K.st!=='sleep'&&!P.hitSet.has(K)){const bb=bossBox();if(overlap(x0,y0,x1,y1,bb[0],bb[1],bb[2],bb[3])){P.hitSet.add(K);const crit=Math.random()<0.15;hitBoss(Math.round(P.atk*(P.atkN===2?1.6:1)*R(0.9,1.15)*(crit?2:1)),crit,P.x+P.face*2,P.y-1.5);}}}
  // pickups
  for(const p of picks){const dx=P.x-p.x,dy=(P.y-1.2)-p.y,d=Math.hypot(dx,dy);if(d<3.5&&p.t>0.35){p.vx+=dx/d*60*dt;p.vy+=dy/d*60*dt;}if(d<0.9&&p.t>0.35){p.dead=true;if(p.k==='coin'){P.gold++;sfx.coin();}else{P.pot++;sfx.heal();pop(P.x,P.y-3.5,'+1 potion',[255,140,190]);}}}
  picks=picks.filter(p=>!p.dead);
}
function splash(){for(let i=0;i<20;i++)wpart(P.x+R(-1,1),Math.min(P.y,35),R(-3,3),R(-9,-3),R(0.4,0.9),'~',[120,170,255],25);sfx.hurt();
  P.hp-=6;flash=0.25;flashCol='120,160,255';if(P.hp<=0){P.hp=0;die();return;}P.x=P.safeX;P.y=P.safeY;P.vx=0;P.vy=0;P.inv=1.2;pop(P.x,P.y-3.5,'-6',[255,90,70]);}
function hurt(d,fromX){if(P.inv>0||P.dead||cine)return;P.hp-=d;P.inv=1.1;P.hurtT=0.25;P.vx=(P.x>=fromX?1:-1)*9;P.vy=-9;shake=Math.max(shake,0.6);flash=0.18;flashCol='255,60,40';sfx.hurt();pop(P.x,P.y-3.5,'-'+d,[255,90,70],1.1);
  for(let i=0;i<10;i++)wpart(P.x,P.y-1.5,R(-5,5),R(-6,1),R(0.3,0.8),"'",[200,40,40],20);if(P.hp<=0){P.hp=0;die();}}
function doAtk(){if(cine||wipe||P.dead||mode!=='explore')return;const it=nearInteract();if(it){interact(it);return;}
  if(P.atkT>0&&!(P.atkT<=0.14&&P.atkN<2))return;P.atkN=(P.atkT>0)?P.atkN+1:0;P.atkT=0.3;P.swing=0.16;P.hitSet=new Set();sfx.swing();if(!P.onG&&P.vy>0)P.vy*=0.4;}
function doFire(){if(cine||wipe||P.dead||mode!=='explore'||P.mp<3||P.fireCd>0)return;P.mp-=3;P.fireCd=0.35;sfx.fire();projs.push({k:'fire',x:P.x+P.face*0.9,y:P.y-1.7,vx:P.face*17,vy:0,life:1.1,dmg:P.atk*2+3,mine:true});}
function drinkPotion(){if(P.pot<1||P.hp>=P.mhp||P.dead)return;P.pot--;const h=Math.round(P.mhp*0.6);P.hp=Math.min(P.mhp,P.hp+h);sfx.heal();pop(P.x,P.y-3.5,'+'+h,[140,255,160],1.1);for(let i=0;i<16;i++)wpart(P.x+R(-1,1),P.y-R(0,3),0,R(-3,-1),R(0.6,1.1),'+',[120,255,150],0);}
function die(){P.dead=true;slowT=1.0;sfx.die();play([{wait:1.4},{say:'Your lantern gutters out...'},{fn:respawn},{say:'You wake at the last flame you lit. Half your gold is gone.'},{release:true}]);}
function respawn(){P.dead=false;P.hp=P.mhp;P.mp=P.mmp;P.gold=Math.floor(P.gold/2);P.x=P.ckX;P.y=P.ckY;P.vx=P.vy=0;P.inv=1.5;projs=[];waves=[];spears=[];
  if(bossStarted){bossStarted=false;rect(DOOR.x,DOOR.y0,DOOR.x+1,DOOR.y1,AIR);resetBoss();enemies=enemies.filter(e=>!e.summoned);}
  cam.x=P.x;cam.y=P.y-3.5;camT.x=cam.x;camT.y=cam.y;}

// ================= ENEMIES =================
function hitEnemy(e,d,kx,crit){e.hp-=d;e.flash=0.15;e.vx=kx;e.vy=e.D.fly?-2:-5;e.st='stun';e.t=0.3;hitstop=crit?0.09:0.05;shake=Math.max(shake,crit?0.7:0.3);
  sparks(e.x,e.y-e.h*0.6,crit?18:9,e.D.fly?[170,220,255]:[255,220,140]);sfx.hit();if(crit){sfx.crit();pop(e.x,e.y-e.h-1.6,'CRIT',[255,240,120],1.2);}
  pop(e.x,e.y-e.h-0.6,String(d),crit?[255,240,120]:[255,210,170],crit?1.3:1);if(e.hp<=0)killEnemy(e);}
function killEnemy(e){e.alive=false;foes++;const D=e.D;const art=D.run[0];dissolveArt(art,e.x,e.y,e.face,D.col);
  const g=D.gold[0]+Math.floor(Math.random()*(D.gold[1]-D.gold[0]+1));for(let i=0;i<g;i++)picks.push({k:'coin',x:e.x,y:e.y-1,vx:R(-4,4),vy:R(-10,-5),t:0});
  if(Math.random()<0.15)picks.push({k:'pot',x:e.x,y:e.y-1,vx:R(-2,2),vy:-9,t:0});
  if(!e.summoned){P.xp+=D.xp;pop(e.x,e.y-e.h-1.6,'+'+D.xp+' XP',[200,190,255],0.8);if(P.xp>=need())levelUp();}}
function levelUp(){while(P.xp>=need()){P.xp-=need();P.lvl++;P.mhp+=8;P.mmp+=2;P.atk+=1;}P.hp=P.mhp;P.mp=P.mmp;sfx.lvl();flash=0.3;flashCol='255,220,140';banner={text:'LEVEL '+P.lvl,sub:'HP '+P.mhp+'   MP '+P.mmp+'   ATK '+P.atk,t:0};burst(P.x,P.y-1.5,40);}
function aheadGround(e){return standable(Math.floor(e.x+e.face*(e.w/2+0.3)),Math.round(e.y));}
function updateEnemies(dt){
  for(const e of enemies){if(!e.alive)continue;if(Math.abs(e.x-P.x)>36)continue;const D=e.D;e.flash=Math.max(0,e.flash-dt);e.anim+=dt*6;e.cd-=dt;e.t-=dt;
    const dx=P.x-e.x,dy=P.y-e.y,adx=Math.abs(dx);const canSee=!P.dead&&!cine&&!wipe;
    if(D.fly){
      if(e.st==='stun'){e.vx*=0.9;e.vy*=0.9;if(e.t<=0)e.st='patrol';}
      else{const ag=canSee&&adx<13&&Math.abs(dy)<10;const tx=ag?P.x-Math.sign(dx||1)*2.5:e.hx+Math.sin(time*0.5+e.hx)*4,ty=(ag?P.y-3.2:e.hy)+Math.sin(time*2+e.hx)*0.8;
        e.vx+=((tx-e.x)*1.4-e.vx)*Math.min(1,dt*2);e.vy+=((ty-e.y)*1.4-e.vy)*Math.min(1,dt*2);const sp=Math.hypot(e.vx,e.vy);if(sp>D.spd*(ag?1.3:0.6)){e.vx*=D.spd*(ag?1.3:0.6)/sp;e.vy*=D.spd*(ag?1.3:0.6)/sp;}
        e.face=dx>0?1:-1;if(ag&&e.cd<=0){e.cd=R(2.4,3.4);const a=Math.atan2((P.y-1.4)-(e.y-2),dx);projs.push({k:'orb',x:e.x,y:e.y-2,vx:Math.cos(a)*7,vy:Math.sin(a)*7,life:3,dmg:5,c:[150,210,255]});tone(700,0.25,'sine',0.03,300);}}
      e.x+=e.vx*dt;e.y+=e.vy*dt;}
    else{
      const ag=canSee&&adx<(e.type==='wolf'?11:9)&&Math.abs(dy)<4.5;
      if(e.st==='stun'){e.vx*=Math.pow(0.02,dt);if(e.t<=0&&e.onG)e.st='patrol';}
      else if(e.type==='wolf'){
        if(e.st==='leap'){if(e.onG&&e.t<=0){e.st='patrol';e.vx=0;}}
        else if(ag){e.face=dx>0?1:-1;if(adx<4.2&&e.cd<=0&&e.onG){e.st='leap';e.t=0.2;e.vx=e.face*10;e.vy=-11;e.cd=1.7;tone(180,0.2,'sawtooth',0.04,90);}else e.vx=aheadGround(e)?e.face*D.spd:0;}
        else{e.vx=e.face*2;if(Math.abs(e.x-e.hx)>5&&Math.sign(e.x-e.hx)===e.face)e.face*=-1;if(!aheadGround(e)||e.hitWall)e.face*=-1;}}
      else if(e.type==='knight'){
        if(e.st==='wind'){e.vx=0;if(e.t<=0){e.st='slash';e.t=0.22;const x0=e.face>0?e.x:e.x-2.6,x1=e.face>0?e.x+2.6:e.x;const pb=pbox();if(overlap(x0,e.y-3,x1,e.y,pb[0],pb[1],pb[2],pb[3]))hurt(D.dmg,e.x);sfx.swing();}}
        else if(e.st==='slash'){if(e.t<=0){e.st='rec';e.t=0.6;}}
        else if(e.st==='rec'){e.vx=0;if(e.t<=0)e.st='patrol';}
        else if(ag){e.face=dx>0?1:-1;if(adx<2.4&&e.cd<=0){e.st='wind';e.t=0.55;e.cd=1.3;}else e.vx=(aheadGround(e)&&adx>1.6)?e.face*D.spd:0;}
        else{e.vx=e.face*1.2;if(Math.abs(e.x-e.hx)>4&&Math.sign(e.x-e.hx)===e.face)e.face*=-1;if(!aheadGround(e)||e.hitWall)e.face*=-1;}}
      e.vy=Math.min(26,e.vy+50*dt);stepBody(e,dt,true);
      if(e.y>LH+2||T(Math.floor(e.x),Math.floor(e.y-0.5))===WATER){e.alive=false;foes++;P.xp+=e.D.xp;if(P.xp>=need())levelUp();}}
    // contact
    if(e.alive&&!P.dead&&e.st!=='stun'){const pb=pbox();const s=0.7;if(overlap(e.x-e.w/2*s,e.y-e.h*0.9,e.x+e.w/2*s,e.y,pb[0],pb[1],pb[2],pb[3]))hurt(D.dmg,e.x);}}
}

// ================= BOSS =================
function bossBox(){return[K.x-4,K.y-K.lift-14,K.x+4,K.y-K.lift];}
function hitBoss(d,crit,hx,hy){if(!K.alive)return;K.hp-=d;K.flash=0.15;hitstop=crit?0.09:0.05;shake=Math.max(shake,crit?0.8:0.35);sparks(hx,hy,crit?20:10,[220,170,255]);sfx.hit();if(crit){sfx.crit();pop(hx,hy-2.5,'CRIT',[255,240,120],1.3);}
  pop(hx,hy-1.5,String(d),crit?[255,240,120]:[230,200,255],crit?1.4:1.1);if(K.hp<=0){K.hp=0;bossDie();}}
function pickAttack(){const sp=K.p2?1.35:1;const adx=Math.abs(P.x-K.x);const r=Math.random();
  if(adx<7&&r<0.5){K.st='wind';K.t=0.65/sp;return;}
  const q=Math.random();if(q<0.34){K.st='rise';K.t=0.6;tone(90,0.6,'sawtooth',0.05,200);}
  else if(q<0.67){K.st='cast';K.cast='spear';K.t=0.5;const n=K.p2?5:3;for(let i=0;i<n;i++){const x=clamp(P.x+(i-(n-1)/2)*3.2+R(-0.5,0.5),ARENA.x0+1,ARENA.x1);spears.push({x,t:0.85,act:0});}tone(220,0.5,'triangle',0.04,110);}
  else{K.st='cast';K.cast='orb';K.t=0.45;}}
function updateBoss(dt){
  if(!K.alive||K.st==='sleep')return;K.flash=Math.max(0,K.flash-dt);K.t-=dt;const sp=K.p2?1.35:1;const dx=P.x-K.x;
  switch(K.st){
    case 'idle':if(Math.abs(dx)>5)K.x+=Math.sign(dx)*1.7*sp*dt;K.x=clamp(K.x,ARENA.x0+6,ARENA.x1-5);if(K.t<=0)pickAttack();break;
    case 'rise':K.lift=Math.min(10,K.lift+dt*22);K.x+=(clamp(P.x,ARENA.x0+6,ARENA.x1-5)-K.x)*Math.min(1,dt*3.5);if(K.t<=0){K.st='hang';K.t=0.45/sp;}break;
    case 'hang':if(K.t<=0){K.st='drop';}break;
    case 'drop':K.lift=Math.max(0,K.lift-dt*70);if(K.lift<=0){shake=1.3;sfx.boom();for(let i=0;i<30;i++)wpart(K.x+R(-5,5),K.y-0.2,R(-8,8),R(-6,-1),R(0.4,0.9),'.',[180,160,190],20);
      waves.push({x:K.x-5,d:-1,life:3},{x:K.x+5,d:1,life:3});const pb=pbox();if(overlap(K.x-4,K.y-6,K.x+4,K.y,pb[0],pb[1],pb[2],pb[3]))hurt(10,K.x);K.st='rec';K.t=0.9/sp;}break;
    case 'cast':if(K.t<=0){if(K.cast==='orb'){const n=K.p2?5:3;const ex=K.x,ey=K.y-K.lift-11.5;const a0=Math.atan2((P.y-1.4)-ey,P.x-ex);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*0.22;projs.push({k:'orb',x:ex,y:ey,vx:Math.cos(a)*8,vy:Math.sin(a)*8,life:4,dmg:6,c:[255,110,220]});}tone(500,0.4,'sine',0.05,200);}
      K.st='rec';K.t=0.9/sp;}break;
    case 'wind':if(K.t<=0){K.st='sweep';K.t=0.3;sfx.swing();noise(0.4,0.2,800);const pb=pbox();if(P.y>27.4&&overlap(K.x-9,26,K.x+9,30,pb[0],pb[1],pb[2],pb[3]))hurt(10,K.x);for(let i=0;i<24;i++)wpart(K.x+R(-9,9),29.5,R(-3,3),R(-2,0),R(0.3,0.6),'~',[200,150,255],0);}break;
    case 'sweep':if(K.t<=0){K.st='rec';K.t=0.8/sp;}break;
    case 'rec':if(K.t<=0){K.st='idle';K.t=K.p2?0.55:0.95;}break;
    case 'roar':if(K.t<=0){K.st='rec';K.t=0.3;}break;}
  if(!K.p2&&K.hp<=K.mhp/2&&K.st!=='rise'&&K.st!=='hang'&&K.st!=='drop'){K.p2=true;K.st='roar';K.t=1.7;K.lift=0;shake=1.6;flash=0.5;flashCol='200,60,255';sfx.boom();banner={text:'THE HOLLOW KING ROARS',sub:'cold fire pours from the broken crown',t:0};
    for(const sx2 of [ARENA.x0+3,ARENA.x1-3]){const e=mkEnemy('wraith',sx2,ARENA.floor);e.summoned=true;e.hy=20;enemies.push(e);}}
  if(K.lift<2&&K.st!=='roar'){const pb=pbox();if(overlap(K.x-3,K.y-12,K.x+3,K.y,pb[0],pb[1],pb[2],pb[3]))hurt(5,K.x);}
  for(const w of waves){w.x+=w.d*13*dt;w.life-=dt;const pb=pbox();if(P.onG&&Math.abs(P.x-w.x)<0.9&&P.y>29.4)hurt(8,w.x-w.d);}
  waves=waves.filter(w=>w.life>0&&w.x>ARENA.x0&&w.x<ARENA.x1+1);
  for(const s of spears){if(s.act>0){s.act-=dt;if(Math.abs(P.x-s.x)<0.9&&P.y>26)hurt(9,s.x);}else{s.t-=dt;if(s.t<=0&&!s.fired){s.fired=true;s.act=0.45;noise(0.2,0.15,2000);for(let i=0;i<6;i++)wpart(s.x,29.8,R(-2,2),R(-6,-2),R(0.3,0.5),'.',[220,210,200],20);}}}
  spears=spears.filter(s=>!(s.fired&&s.act<=0));
}
function bossDie(){K.alive=false;foes++;slowT=1.4;flash=0.6;flashCol='230,200,255';sfx.win();sfx.boom();dissolveArt(KING,K.x,K.y-K.lift,1,[210,190,230],0.85);burst(K.x,K.y-8,80);
  for(const e of enemies)if(e.summoned)e.alive=false;projs=[];waves=[];spears=[];
  play([{wait:2.6},{say:'The Hollow King falls to ash. The crypt is silent.'},{fn:()=>{rect(DOOR.x,DOOR.y0,DOOR.x+1,DOOR.y1,AIR);dawnTarget=1;}},
    {cam:[34.5,25.5,0.9],k:0.32},{wait:5.5},{fn:()=>{hearthLit=true;burst(34.5,29,160);sfx.beacon();shake=0.6;flash=0.35;flashCol='255,200,120';}},{wait:1.5},
    {say:'In Vael, the Hearth takes the flame back.'},{say:'And for the first time in a hundred years, the sky remembers morning.'},{fn:()=>{endCine();camLock=true;camT.x=34.5;camT.y=25.5;camT.z=0.9;mode='end';endT=0;}}]);}

// ================= PROJECTILES / PICKUPS =================
function updateProjs(dt){
  for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.k==='fire'){if(Math.random()<0.8)wpart(p.x-p.vx*0.02,p.y+R(-0.2,0.2),R(-1,1),R(-2,0),R(0.2,0.45),Math.random()<0.5?'*':'.',[255,R(120,220),50],-2);
      if(solid(Math.floor(p.x),Math.floor(p.y))){p.life=0;sparks(p.x,p.y,12,[255,170,60]);}
      for(const e of enemies){if(!e.alive||p.life<=0)continue;if(overlap(p.x-0.4,p.y-0.4,p.x+0.4,p.y+0.4,e.x-e.w/2,e.y-e.h,e.x+e.w/2,e.y)){p.life=0;hitEnemy(e,Math.round(p.dmg*R(0.9,1.1)),Math.sign(p.vx)*7,false);burst(p.x,p.y,14);}}
      if(p.life>0&&K.alive&&bossStarted&&K.st!=='sleep'){const bb=bossBox();if(overlap(p.x-0.4,p.y-0.4,p.x+0.4,p.y+0.4,bb[0],bb[1],bb[2],bb[3])){p.life=0;hitBoss(Math.round(p.dmg*R(0.9,1.1)),false,p.x,p.y);burst(p.x,p.y,14);}}}
    else{if(Math.random()<0.5)wpart(p.x,p.y,R(-0.5,0.5),R(-0.5,0.5),0.3,'.',p.c,0);
      if(p.k==='orb'&&!K.alive&&K.st!=='sleep'){}
      const pb=pbox();if(overlap(p.x-0.35,p.y-0.35,p.x+0.35,p.y+0.35,pb[0],pb[1],pb[2],pb[3])){p.life=0;hurt(p.dmg,p.x);}
      if(solid(Math.floor(p.x),Math.floor(p.y)))p.life=0;}}
  projs=projs.filter(p=>p.life>0);
  for(const p of picks){p.t+=dt;p.vy=Math.min(20,p.vy+40*dt);p.x+=p.vx*dt;const ny=p.y+p.vy*dt;if(p.vy>0&&standable(Math.floor(p.x),Math.floor(ny))){p.y=Math.floor(ny);p.vy*=-0.35;p.vx*=0.7;}else p.y=ny;if(solid(Math.floor(p.x),Math.floor(p.y-0.2)))p.vx*=-0.5;if(p.y>LH+2)p.dead=true;}
  picks=picks.filter(p=>!p.dead);
}

// ================= STORY =================
function nearInteract(){if(!P.onG||P.dead)return null;for(const n of npcs)if(Math.abs(n.x-P.x)<2&&Math.abs(n.y-P.y)<2)return{type:'npc',n,label:n.kind==='merchant'?'BUY':'TALK'};
  for(const b of BEACONS)if(!b.lit&&Math.abs(b.x+0.5-P.x)<2.6&&Math.abs(b.y-P.y)<2)return{type:'beacon',b,label:'LIGHT'};return null;}
function interact(it){if(it.type==='npc')talk(it.n);else lightBeacon(it.b);}
function talk(n){
  if(n.kind==='elder'){P.hp=P.mhp;P.mp=P.mmp;sfx.heal();const lit=BEACONS.filter(b=>b.lit).length;
    const line=lit===0?'The Northern Watch is on the hill past the fields. Go east, child.':lit<3?lit+' of 3 burn. I can feel it in my bones. Keep going east.':'The seal is broken. The crypt lies at the end of the road.';
    play([{say:line,who:'ELDER MARA'},{say:'Rest a moment. Your wounds close by the hearthstones.',who:'ELDER MARA'}]);}
  else if(n.kind==='merchant'){if(P.gold>=10){P.gold-=10;P.pot++;sfx.heal();play([{say:'One potion. Ten gold. Drink it when the dark gets close.',who:'TOBIN'}]);}else play([{say:'Ten gold for a potion, friend. The wolves carry coin, oddly enough.',who:'TOBIN'}]);}

    if(!P.dead){const lx=P.face>0?r[0]+r[2]+VW.cw*0.3:r[0]-VW.cw*0.3;const ly=r[1]+VW.ch*1.5+Math.sin(time*3)*1.5;ctx.fillStyle=rgb(255,225,130);ctx.fillText('*',lx,ly);}
    if(P.swing>0){const k=P.swing/0.16;const s=w2s(P.x,P.y);const arcs=P.atkN===2?['-','=','=','>']:P.atkN===1?['\\','-','/']:['/','-','\\'];ctx.font='900 '+(VW.fs*1.15).toFixed(1)+'px '+FONT;
      for(let i=0;i<arcs.length;i++){const ax=s[0]+P.face*VW.TW*(0.9+i*0.55),ay=s[1]-VW.ch*(P.atkN===2?1.6:(2.6-i*0.8));let c=arcs[i];if(P.face<0&&FLIP[c])c=FLIP[c];ctx.fillStyle=rgba(255,245,210,k);ctx.fillText(c,ax,ay);}ctx.font='bold '+VW.fs.toFixed(1)+'px '+FONT;}}
  // projectiles
  for(const p of projs){const s=w2s(p.x,p.y);ctx.fillStyle=p.k==='fire'?rgb(255,240,180):rgb(p.c[0],p.c[1],p.c[2]);ctx.font='900 '+(VW.fs*1.1).toFixed(1)+'px '+FONT;ctx.fillText(p.k==='fire'?'@':'o',s[0],s[1]);}
  ctx.font='bold '+VW.fs.toFixed(1)+'px '+FONT;
  for(const w of waves){for(let k=-1;k<=1;k++){const s=w2s(w.x+k*0.5,29.5);ctx.fillStyle=rgb(210,150,255);ctx.fillText(k===0?'^':'~',s[0],s[1]);}}
  for(const sp of spears){const s=w2s(sp.x,30);if(sp.act>0){const hgt=Math.min(4,(0.45-sp.act)*40+1);for(let k=0;k<hgt;k++){ctx.fillStyle=rgb(235,225,210);ctx.fillText(k===Math.floor(hgt)-1?'^':'|',s[0],s[1]-VW.ch*(k+0.5));}}else if(!sp.fired){ctx.fillStyle=rgba(255,70,60,0.5+0.5*Math.sin(time*20));ctx.fillText('!',s[0],s[1]-VW.ch*0.5);}}
  for(const p of wparts){const a=clamp(p.life/p.max,0,1);const s=w2s(p.x,p.y);ctx.fillStyle=rgb(p.c[0]*a,p.c[1]*a,p.c[2]*a);ctx.fillText(p.ch,s[0],s[1]);}
  for(const p of pops){const a=clamp(1.2-p.t,0,1);const s=w2s(p.x,p.y);ctx.font='900 '+(VW.fs*0.9*p.s).toFixed(1)+'px '+FONT;ctx.fillStyle=rgba(p.c[0],p.c[1],p.c[2],a);ctx.fillText(p.text,s[0],s[1]-p.t*40);}
  ctx.font='bold '+VW.fs.toFixed(1)+'px '+FONT;
}
function drawBoss(){const lt=lightAt(K.x,K.y-8);const fl=K.flash>0;const tint=K.p2?[225,170,255]:[195,185,210];const wob=K.st==='roar'?(Math.random()-0.5)*0.6:0;
  if(K.lift>0.5){const s=w2s(K.x,30);ctx.fillStyle=rgba(0,0,0,0.6);for(let k=-4;k<=4;k++)ctx.fillText('_',s[0]+k*VW.cw,s[1]-VW.ch*0.6);}
  sprite(KING,K.x+wob,K.y-K.lift,1,(c,r)=>fl?'#fff':(r===4&&(c==='O'))?rgb(255,lerp(70,160,0.5+0.5*Math.sin(time*6)),220):(r<3&&!K.p2)?shade([230,190,90],lt,1.2):shade(tint,lt,1.2));
  if(K.st==='wind'){const s=w2s(K.x,K.y-K.lift-15);ctx.fillStyle=rgb(255,80,60);ctx.font='900 '+(VW.fs*1.6).toFixed(1)+'px '+FONT;ctx.fillText('!',s[0],s[1]);ctx.font='bold '+VW.fs.toFixed(1)+'px '+FONT;}}
function drawAsh(){const s=clamp(H*0.03,9,13);ctx.font=s+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=dawn>0.5?'rgba(255,240,220,0.18)':'rgba(190,190,205,0.3)';for(const a of ASH)ctx.fillText(a.ch,a.x*W,a.y*H);}
function barText(x,y,label,cur,max,col,n){ctx.fillStyle='#bba890';ctx.fillText(label,x,y);x+=ctx.measureText(label+' ').width;const f=Math.round(clamp(cur/max,0,1)*n);const a='['+'|'.repeat(f),b='.'.repeat(n-f)+']';ctx.fillStyle=col;ctx.fillText(a,x,y);x+=ctx.measureText(a).width;ctx.fillStyle='#4a3f36';ctx.fillText(b,x,y);x+=ctx.measureText(b+' ').width;ctx.fillStyle='#d8c8b0';ctx.fillText(cur+'/'+max,x,y);}
function drawHUD(){const s=clamp(H*0.038,10,15);ctx.font='bold '+s+'px '+FONT;ctx.textAlign='left';ctx.textBaseline='top';const x=12;let y=10;
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(x-6,y-5,s*CR*29,s*5.6,6);ctx.fill();
  ctx.fillStyle='#e8a050';ctx.fillText('LANTERN-BEARER  LV '+P.lvl,x,y);y+=s*1.15;
  barText(x,y,'HP',P.hp,P.mhp,'#ff6a4a',12);y+=s*1.1;barText(x,y,'MP',P.mp,P.mmp,'#6aa8ff',12);y+=s*1.1;barText(x,y,'XP',P.xp,need(),'#c8a8ff',12);y+=s*1.15;
  ctx.fillStyle='#ffd25a';ctx.fillText('$ '+P.gold,x,y);
  btn(x+s*CR*7,y-3,s*CR*11,s*1.35,'! x'+P.pot,drinkPotion,{off:P.pot<1,fs:Math.round(s*0.85)});
  const o=objective();if(o){ctx.textAlign='center';ctx.textBaseline='top';ctx.font='bold '+(s*0.95)+'px '+FONT;ctx.fillStyle='rgba(255,200,130,0.9)';ctx.fillText('> '+o.text+' <',W/2,10);}
  if(bossStarted&&K.alive){const n=30,f=Math.round(clamp(K.hp/K.mhp,0,1)*n);ctx.textAlign='center';ctx.font='bold '+s+'px '+FONT;ctx.fillStyle='#d8a0ff';ctx.fillText('THE HOLLOW KING',W/2,10+s*1.4);ctx.fillStyle='#c060ff';ctx.fillText('['+'|'.repeat(f)+'.'.repeat(n-f)+']',W/2,10+s*2.6);}}
function drawControls(){const s=clamp(Math.min(W,H)*0.1,30,50);const it=nearInteract();
  pads=[{id:'jump',x:W-s*1.35,y:H-s*1.35,r:s,label:'JUMP'},{id:'atk',x:W-s*3.55,y:H-s*1.05,r:s*0.85,label:it?it.label:'STRIKE',hl:!!it},{id:'fire',x:W-s*2.75,y:H-s*3.25,r:s*0.68,label:'FIRE',off:P.mp<3}];
  for(const p of pads){const held=[...padPtr.values()].indexOf(p.id)>=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=held?'rgba(90,45,15,0.6)':'rgba(20,10,5,0.35)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=p.off?'rgba(150,110,80,0.25)':p.hl?rgba(255,210,120,0.7+0.3*Math.sin(time*6)):'rgba(255,190,120,0.45)';ctx.stroke();
    ctx.font='bold '+Math.round(p.r*0.36)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=p.off?'rgba(255,200,150,0.3)':'#ffdca8';ctx.fillText(p.label,p.x,p.y);}
  if(joy){ctx.strokeStyle='rgba(255,190,120,0.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.bx,joy.by,s*1.1,0,7);ctx.stroke();let vx=joy.x-joy.bx,vy=joy.y-joy.by;const m=Math.hypot(vx,vy),mx=s*1.1;if(m>mx){vx=vx/m*mx;vy=vy/m*mx;}ctx.fillStyle='rgba(255,190,120,0.35)';ctx.beginPath();ctx.arc(joy.bx+vx,joy.by+vy,s*0.45,0,7);ctx.fill();}
  else{ctx.strokeStyle='rgba(255,190,120,0.13)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s*1.9,H-s*1.9,s*1.1,0,7);ctx.stroke();ctx.font=(s*0.3)+'px '+FONT;ctx.fillStyle='rgba(255,190,120,0.22)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('< RUN >',s*1.9,H-s*1.9);}
  if(it&&it.type==='npc'){const p=w2s(it.n.x,it.n.y-4.4);ctx.font='bold '+(VW.fs*0.65).toFixed(1)+'px '+FONT;ctx.fillStyle='rgba(255,220,170,0.95)';ctx.fillText(it.n.name,p[0],p[1]);}}
function drawArrow(){const o=objective();if(!o)return;const p=w2s(o.x,o.y);if(p[0]>30&&p[0]<W-30&&p[1]>40&&p[1]<H-30)return;const a=Math.atan2(p[1]-H/2,p[0]-W/2);const rx=W/2-34,ry=H/2-40;const k=1/Math.max(Math.abs(Math.cos(a))/rx,Math.abs(Math.sin(a))/ry);
  ctx.save();ctx.translate(W/2+Math.cos(a)*k,H/2+Math.sin(a)*k);ctx.rotate(a);ctx.font='bold 22px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=rgba(255,190,90,0.55+0.4*Math.sin(time*4));ctx.fillText('>',0,0);ctx.restore();}
function drawBanner(){if(!banner)return;const t=banner.t,a=t<0.25?t/0.25:clamp((2.6-t)/0.6,0,1);const bs=clamp(H*0.09,22,56);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+bs.toFixed(1)+'px Georgia,serif';ctx.fillStyle=rgba(255,225,150,a);ctx.fillText(banner.text,W/2,H*0.36);if(banner.sub){ctx.font='bold '+(bs*0.32).toFixed(1)+'px '+FONT;ctx.fillStyle=rgba(255,235,200,a*0.9);ctx.fillText(banner.sub,W/2,H*0.36+bs*0.85);}}
function drawEnd(){const a=clamp(endT/2,0,1);ctx.fillStyle=rgba(0,0,0,0.4*a);ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';const s=clamp(Math.min(W/9,H/5),28,90);
  ctx.font='900 '+s+'px Georgia,serif';const g=ctx.createLinearGradient(0,H*0.3-s/2,0,H*0.3+s/2);g.addColorStop(0,'#fff6d6');g.addColorStop(0.5,'#ffb447');g.addColorStop(1,'#c8361a');ctx.fillStyle=g;ctx.globalAlpha=a;ctx.fillText('EMBERFALL',W/2,H*0.3);
  ctx.font='bold '+(s*0.3)+'px '+FONT;ctx.fillStyle='#ffe6c0';ctx.fillText('T H E   E N D',W/2,H*0.3+s*0.85);
  ctx.font=(s*0.22)+'px '+FONT;ctx.fillStyle='#ffeedd';const mm=Math.floor(playTime/60),ss=Math.floor(playTime%60);ctx.fillText('Level '+P.lvl+'   \u00b7   '+foes+(foes===1?' foe':' foes')+' felled   \u00b7   '+mm+'m '+(ss<10?'0':'')+ss+'s',W/2,H*0.3+s*1.35);
  if(endT>3){ctx.fillStyle=rgba(255,230,180,0.6+0.4*Math.sin(time*3));ctx.fillText('[  tap to play again  ]',W/2,H*0.8);}ctx.globalAlpha=1;}
function renderExplore(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  renderWorld();drawEntities();bloom(0.38,0.3);
  if(dawn>0.01){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgba(255,170,120,0.18*dawn));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  drawAsh();post();
  if(P.hp/P.mhp<0.3&&mode==='explore'&&!P.dead){ctx.fillStyle=rgba(160,0,0,0.1+0.08*Math.sin(time*5));ctx.fillRect(0,0,W,H);}
  drawBars();
  if(mode==='explore'&&!cine&&!wipe){drawHUD();drawControls();drawArrow();}else pads=[];
  drawBanner();
  if(cap)drawCaption(cap,cap.who);
  if(mode==='end')drawEnd();
  muteButton();
}

// ================= INPUT =================
function padAt(x,y){for(const p of pads)if(Math.hypot(x-p.x,y-p.y)<=p.r*1.15)return p;return null;}
function padDown(id){if(id==='jump'){P.jbuf=0.13;jumpHeld=true;}else if(id==='atk')doAtk();else if(id==='fire')doFire();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const x=e.clientX,y=e.clientY;
  for(const b of buttons){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(!b.off)b.fn();return;}}
  if(wipe)return;
  if(mode==='gate'||mode==='intro'){introTap();return;}
  if(mode==='end'){if(endT>3)location.reload();return;}
  if(cine){cineTap();return;}
  if(P.dead)return;
  const p=padAt(x,y);if(p){if(!p.off||p.id!=='fire'){padPtr.set(e.pointerId,p.id);padDown(p.id);}try{cv.setPointerCapture(e.pointerId);}catch(err){}return;}
  if(x<W*0.5){joy={id:e.pointerId,bx:x,by:y,x,y};try{cv.setPointerCapture(e.pointerId);}catch(err){}}
},{passive:false});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;}});
function endPtr(e){if(joy&&e.pointerId===joy.id)joy=null;const id=padPtr.get(e.pointerId);if(id){padPtr.delete(e.pointerId);if(id==='jump'&&[...padPtr.values()].indexOf('jump')<0)jumpHeld=false;}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(KEYS[k])return;KEYS[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0)e.preventDefault();initAudio();
  if(mode==='gate'||mode==='intro'){if(k===' '||k==='enter')introTap();if(k==='escape')skipIntro();return;}
  if(mode==='end'){if((k===' '||k==='enter')&&endT>3)location.reload();return;}
  if(cine){if(k===' '||k==='enter'||k==='j'||k==='x')cineTap();return;}
  if(k===' '||k==='w'||k==='arrowup'||k==='z'){P.jbuf=0.13;jumpHeld=true;}
  if(k==='j'||k==='x'||k==='enter')doAtk();if(k==='k'||k==='c')doFire();if(k==='h'||k==='q')drinkPotion();});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();KEYS[k]=false;if(k===' '||k==='w'||k==='arrowup'||k==='z')jumpHeld=false;});

// ================= LOOP =================
function update(dtr){
  let dt=dtr;if(slowT>0){slowT-=dtr;dt=dtr*0.35;}
  shake=Math.max(0,shake-dtr*1.8);flash=Math.max(0,flash-dtr*2.2);
  lb+=(lbTarget-lb)*Math.min(1,dtr*4);
  if(wipe){wipe.t+=dtr;if(!wipe.md&&wipe.t>=wipe.dur/2){wipe.md=true;wipe.mid();}if(wipe&&wipe.t>=wipe.dur)wipe=null;}
  if(hitstop>0){hitstop-=dtr;dt=0;}
  time+=dt;
  if(mode==='gate'||mode==='intro')updateIntro(dtr);
  else updateWorld(dt);
  if(mode==='explore'||mode==='end')updateCine(dtr);
  const kk=1-Math.exp(-dtr*(camLock?camK:5));cam.x+=(camT.x-cam.x)*kk;cam.y+=(camT.y-cam.y)*kk;cam.z+=(camT.z-cam.z)*kk;
  if(mode!=='gate'&&mode!=='intro'){const fs=baseFS()*cam.z,TW=fs*CR*2,ch=fs*1.04;const hw=W/2/TW,hh=H/2/ch;cam.x=clamp(cam.x,hw,LW-hw);cam.y=clamp(cam.y,Math.min(hh,LH-hh),LH-hh-0.5);}
  for(let i=wparts.length-1;i>=0;i--){const p=wparts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;if(p.life<=0)wparts.splice(i,1);}
  for(const a of ASH){a.y+=a.s*dtr*0.04;a.x-=dtr*0.012*a.s;if(a.y>1.02){a.y=-0.02;a.x=Math.random()*1.1;}if(a.x<-0.02)a.x=1.02;}
}
function draw(){buttons=[];ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(mode==='gate'||mode==='intro')renderIntro();else renderExplore();
  if(wipe)drawWipe();
  if(flash>0){ctx.fillStyle='rgba('+flashCol+','+Math.min(1,flash).toFixed(3)+')';ctx.fillRect(0,0,W,H);}}
let last=performance.now();
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}
buildLevel();spawnAll();
window.EMB={get mode(){return mode;},set mode(v){mode=v;},IN,P,K:()=>K,BEACONS,get enemies(){return enemies;},goBeat,beginGame,introTap,doAtk,doFire,cineTap,tiles,T,
  step(dt,n){for(let i=0;i<n;i++)update(dt);draw();},teleport(x,y){P.x=x;P.y=y===undefined?groundAt(Math.floor(x),0):y;P.vx=P.vy=0;cam.x=x;cam.y=P.y-3.5;camT.x=cam.x;camT.y=cam.y;},
  skipToWorld(){mode='explore';cine=null;cap=null;lb=0;lbTarget=0;camLock=false;},lightAll(){for(const b of BEACONS)b.lit=true;breakSeal();},setDawn(v){dawn=v;dawnTarget=v;},get cine(){return cine;},keys:KEYS,solid,standable,setJump(v){jumpHeld=v;if(v)P.jbuf=0.13;}};
requestAnimationFrame(frame);
})();
</script></body></html>
