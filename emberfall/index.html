function initAudio(){

function tone(f,d,type,v,f2,delay){if(!AC)return;try{const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||0.1,t0+Math.min(0.02,d/3));g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+0.05);}catch(e){}}

function startAmbient(){
  try{
    const g=AC.createGain();g.gain.value=0.045;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;lp.connect(g);g.connect(master);
    [55,55.35,82.4,110.2].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();});
    const s=AC.createBufferSource();s.buffer=getNoise();s.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=0.8;const wg=AC.createGain();wg.gain.value=0.035;s.connect(bp);bp.connect(wg);wg.connect(master);s.start();

}

const FLOWC=[[225,120,175],[235,205,90],[125,155,235],[235,235,235]];
const GCH=[',','.','`',"'"];
const FIRE=['^','*','&','^'];
function tileBase(t,v){return t===FLOWER?FLOWC[v&3]:TC[t];}
function tileChar(t,v,x,y){
  switch(t){
    case GRASS:return GCH[v&3];
    case TALL:{const w=Math.sin(x*0.35+y*0.12-time*1.8)+0.5*Math.sin(x*0.11-time*0.7);return w>0.9?'/':w<-0.9?'\\':(v&1?'"':';');}

    case MOUNT:return v&1?'^':'\u25b2';

const MW=150,MH=96,N=MW*MH;
const map=new Uint8Array(N),vari=new Uint8Array(N),seen=new Uint8Array(N),vis=new Uint8Array(N),reach=new Uint8Array(N);
const I=(x,y)=>y*MW+x;
const inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
const V={x:26,y:50};
const POI={b:[{x:40,y:13,lit:false},{x:122,y:24,lit:false},{x:72,y:84,lit:false}],crypt:{x:128,y:74}};
const TORCHES=[];
function inner(x,y){return x>=2&&y>=2&&x<MW-2&&y<MH-2;}
function clearCircle(cx,cy,r){for(let y=cy-r-2;y<=cy+r+2;y++)for(let x=cx-r-2;x<=cx+r+2;x++){if(!inner(x,y))continue;const d=Math.hypot(x-cx,y-cy)+(vn(x*0.4,y*0.4)-0.5)*3;if(d<r)map[I(x,y)]=rng()<0.18?TALL:GRASS;}}
function paintRoad(x,y){if(!inner(x,y))return;const k=I(x,y),t=map[k];if(t===WATER)map[k]=BRIDGE;else if(t!==BRIDGE&&t!==WALL&&t!==FLOOR&&t!==DOOR&&t!==HEARTH&&t!==BEACON&&t!==SEAL&&t!==GRAVE)map[k]=ROAD;}
function carve(ax,ay,bx,by){let x=ax,y=ay,g=0;paintRoad(x,y);while((x!==bx||y!==by)&&g++<4000){const dx=bx-x,dy=by-y;
  if(Math.abs(dx)>=Math.abs(dy)){if(rng()<0.72)x+=Math.sign(dx);else y+=(dy!==0&&rng()<0.55)?Math.sign(dy):(rng()<0.5?1:-1);}
  else{if(rng()<0.72)y+=Math.sign(dy);else x+=(dx!==0&&rng()<0.55)?Math.sign(dx):(rng()<0.5?1:-1);}
  x=clamp(x,3,MW-4);y=clamp(y,3,MH-4);paintRoad(x,y);paintRoad(x+1,y);
  for(const o of [[0,1],[0,-1],[-1,0],[2,0]]){const k=I(x+o[0],y+o[1]);if(map[k]===TREE&&rng()<0.5)map[k]=TALL;}}}
function straight(ax,ay,bx,by){const n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));for(let i=0;i<=n;i++){const x=Math.round(lerp(ax,bx,i/n)),y=Math.round(lerp(ay,by,i/n));for(const o of [[0,0],[1,0],[0,1]]){const k=I(x+o[0],y+o[1]);if(!inner(x+o[0],y+o[1]))continue;const t=map[k];if(t===WATER)map[k]=BRIDGE;else if(BLOCK[t]&&t!==HEARTH&&t!==BEACON&&t!==SEAL)map[k]=ROAD;}}}
function house(x0,y0,w,h,dx,dy){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){const e=x===x0||y===y0||x===x0+w-1||y===y0+h-1;map[I(x,y)]=e?WALL:FLOOR;}map[I(dx,dy)]=DOOR;TORCHES.push({x:dx+1,y:dy===y0?y0-1:y0+h});}
function flood(){reach.fill(0);const q=[I(V.x,V.y+3)];reach[q[0]]=1;while(q.length){const k=q.pop();const x=k%MW,y=(k/MW)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const n=I(nx,ny);if(reach[n]||BLOCK[map[n]])continue;reach[n]=1;q.push(n);}}}
function genWorld(){
  SEED=4242;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const e=fbm(x/24,y/24),m=fbm(x/10+70,y/10+30),rv=fbm(x/34+11,y/34+90),k=I(x,y);
    let t=GRASS;
    if(e>0.68)t=MOUNT;else if(e<0.3)t=WATER;else if(Math.abs(rv-0.5)<0.016)t=WATER;
    else if(m>0.6)t=TREE;else if(m>0.53)t=rng()<0.6?TREE:TALL;else if(m>0.45&&rng()<0.55)t=TALL;else if(rng()<0.014)t=FLOWER;
    if(!inner(x,y))t=MOUNT;
    map[k]=t;vari[k]=(rng()*256)|0;
  }
  clearCircle(V.x,V.y,14);
  for(const b of POI.b)clearCircle(b.x,b.y,6);
  clearCircle(POI.crypt.x,POI.crypt.y,11);
  // village
  for(let y=47;y<=53;y++)for(let x=22;x<=30;x++)map[I(x,y)]=ROAD;
  house(15,41,7,5,18,45);house(31,41,8,5,34,45);house(15,55,7,5,18,55);house(31,55,8,5,35,55);
  map[I(V.x,V.y)]=HEARTH;
  // beacons
  for(const b of POI.b){for(let a=0;a<12;a++){const ang=a/12*Math.PI*2;if(rng()<0.6){const x=Math.round(b.x+Math.cos(ang)*3),y=Math.round(b.y+Math.sin(ang)*3);map[I(x,y)]=RUBBLE;}}}
  // ruins near south beacon
  const s=POI.b[2];
  for(let i=0;i<16;i++){const x0=s.x+Math.round((rng()-0.5)*22),y0=s.y+Math.round((rng()-0.5)*12);if(Math.hypot(x0-s.x,y0-s.y)<5)continue;const horiz=rng()<0.5,len=3+Math.floor(rng()*4);for(let j=0;j<len;j++){const x=horiz?x0+j:x0,y=horiz?y0:y0+j;if(inner(x,y)&&rng()<0.8)map[I(x,y)]=WALL;}}
  for(let i=0;i<26;i++){const x=s.x+Math.round((rng()-0.5)*24),y=s.y+Math.round((rng()-0.5)*14);if(inner(x,y)&&!BLOCK[map[I(x,y)]])map[I(x,y)]=rng()<0.5?GRAVE:BONES;}
  // crypt
  const C=POI.crypt;
  for(let y=C.y-3;y<=C.y+3;y++)for(let x=C.x-5;x<=C.x+5;x++){const e=x===C.x-5||x===C.x+5||y===C.y-3||y===C.y+3;map[I(x,y)]=e?WALL:FLOOR;}
  map[I(C.x-5,C.y)]=SEAL;
  for(let i=0;i<6;i++){const x=C.x-3+Math.floor(rng()*7),y=C.y-2+Math.floor(rng()*5);if(map[I(x,y)]===FLOOR)map[I(x,y)]=BONES;}
  for(let gy=C.y-7;gy<=C.y+7;gy+=3)for(let gx=C.x-12;gx<=C.x-7;gx+=3){if(Math.abs(gy-C.y)<2)continue;if(rng()<0.8)map[I(gx,gy)]=GRAVE;}
  for(let gx=C.x-4;gx<=C.x+4;gx+=2){if(rng()<0.7)map[I(gx,C.y-6)]=GRAVE;if(rng()<0.7)map[I(gx,C.y+6)]=GRAVE;}
  // roads
  carve(26,46,POI.b[0].x,POI.b[0].y+2);
  carve(31,50,POI.b[1].x-2,POI.b[1].y+1);
  carve(26,54,26,62);carve(26,62,POI.b[2].x,POI.b[2].y-2);
  carve(POI.b[2].x+2,POI.b[2].y,C.x-7,C.y);
  for(const b of POI.b)map[I(b.x,b.y)]=BEACON;
  map[I(V.x,V.y)]=HEARTH;
  flood();
  const targets=[[POI.b[0].x,POI.b[0].y+1],[POI.b[1].x,POI.b[1].y+1],[POI.b[2].x,POI.b[2].y-1],[C.x-6,C.y]];
  for(const tg of targets){if(!reach[I(tg[0],tg[1])]){straight(V.x,V.y+4,tg[0],tg[1]);flood();}}
}

let cine=null,cap=null;
function play(steps){cine={s:steps,i:-1,w:0};lbTarget=1;next();}
function endCine(){cine=null;cap=null;lbTarget=0;camLock=false;camK=5;}
function next(){
  while(cine){
    cine.i++;
    if(cine.i>=cine.s.length){endCine();return;}
    const st=cine.s[cine.i];
    if(st.cam){camLock=true;camT.x=st.cam[0];camT.y=st.cam[1];camT.z=st.cam[2];camK=st.k||1.2;if(st.snap){cam.x=camT.x;cam.y=camT.y;cam.z=camT.z;}continue;}
    if(st.release){camLock=false;camK=4;continue;}
    if(st.fn){st.fn();continue;}
    if(st.wait!==undefined){cine.w=st.wait;cap=null;return;}
    if(st.say){cap={who:st.who||'',text:st.say,shown:0,done:false};return;}
  }
}
function updateCine(dt){if(!cine)return;if(cap){if(!cap.done){const p=Math.floor(cap.shown);cap.shown+=dt*46;if(Math.floor(cap.shown)!==p&&p%3===0)sfx.blip();if(cap.shown>=cap.text.length){cap.shown=cap.text.length;cap.done=true;}}return;}cine.w-=dt;if(cine.w<=0)next();}
function cineTap(){if(!cine)return;if(cap){if(!cap.done){cap.shown=cap.text.length;cap.done=true;}else{cap=null;next();}}}

    for(let i=0;i<n;i++){const u=(i+0.5)/n,d=Math.abs(u-0.5);ctx.fillStyle=d<0.055?'#ffd25a':d<0.15?'#c88040':'#4a3a30';ctx.fillText(d<0.055?'=':'-',mx+(i+0.5)*cw,my);}
    ctx.fillStyle='#fff';ctx.fillText('\u2588',mx+B.meter*mw,my);ctx.fillStyle='#e8a050';ctx.fillText('[',mx-cw,my);ctx.fillText(']',mx+mw+cw,my);}
  if(B.phase==='enemy'&&B.wind&&B.wind.flagged&&!B.wind.done){const hfs2=clamp(H*0.12,30,70);ctx.font='900 '+hfs2+'px '+FONT;ctx.textAlign='center';ctx.fillStyle=rgb(255,80,60);ctx.fillText('!',L.hx,gy-hh-hfs2*0.7);}
  for(const p of B.pops){const a=clamp(1.3-p.t,0,1);ctx.font='900 '+(s*1.5*p.s*(1+0.3*Math.max(0,0.15-p.t)/0.15)).toFixed(1)+'px '+FONT;ctx.textAlign='center';ctx.fillStyle=rgba(p.c[0],p.c[1],p.c[2],a);ctx.fillText(p.text,p.x,p.y-p.t*50);}
  if(B.banner){const t=B.banner.t,a=t<0.2?t/0.2:clamp((1.6-t)/0.5,0,1);const bs=clamp(H*0.1,26,64)*(1+Math.max(0,0.2-t));ctx.font='900 '+bs.toFixed(1)+'px Georgia,serif';ctx.textAlign='center';ctx.fillStyle=rgba(255,225,150,a);ctx.fillText(B.banner.text,L.areaW/2,H*0.4);}
  if((B.phase==='win'||B.phase==='lose')&&B.canExit){ctx.font=s+'px '+FONT;ctx.textAlign='center';ctx.fillStyle=rgba(255,210,150,0.5+0.4*Math.sin(time*4));ctx.fillText('[ tap to continue ]',L.areaW/2,gy+(H-bh-gy)*0.4);}
  muteButton();
}

// ================= INPUT =================
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const x=e.clientX,y=e.clientY;
  for(const b of buttons){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(!b.off)b.fn();return;}}
  if(wipe)return;
  if(mode==='gate'||mode==='intro'){introTap();return;}
  if(mode==='end'){if(endT>3)location.reload();return;}
  if(mode==='battle'){battleTap();return;}
  if(cine){cineTap();return;}
  if(x<W*0.55){joy={id:e.pointerId,bx:x,by:y,x,y};try{cv.setPointerCapture(e.pointerId);}catch(err){}}else act();
},{passive:false});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;}});
function endJoy(e){if(joy&&e.pointerId===joy.id)joy=null;}
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
  if(k===' '||k==='Enter'){e.preventDefault();initAudio();if(mode==='gate'||mode==='intro')introTap();else if(mode==='battle')battleTap();else if(mode==='end'){if(endT>3)location.reload();}else act();}
  if(mode==='battle'&&B&&B.phase==='menu'){const m={'1':'atk','2':'fire','3':'mend','4':'item','5':'flee'}[k];if(m)cmd(m);}
  if(k==='Escape')skipIntro();});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;});

// ================= LOOP =================
function update(dtr){
  let dt=dtr;if(slowT>0){slowT-=dtr;dt=dtr*0.3;}
  time+=dt;shake=Math.max(0,shake-dtr*1.8);flash=Math.max(0,flash-dtr*2.2);
  lb+=(lbTarget-lb)*Math.min(1,dtr*4);
  if(wipe){wipe.t+=dtr;if(!wipe.md&&wipe.t>=wipe.dur/2){wipe.md=true;wipe.mid();}if(wipe&&wipe.t>=wipe.dur)wipe=null;}
  if(mode==='gate'||mode==='intro')updateIntro(dtr);
  else if(mode==='battle')updateBattle(dt);
  else updateExplore(dt);
  if(mode==='explore'||mode==='end')updateCine(dtr);
  const kk=1-Math.exp(-dtr*(camLock?camK:5));cam.x+=(camT.x-cam.x)*kk;cam.y+=(camT.y-cam.y)*kk;cam.z+=(camT.z-cam.z)*kk;
  for(let i=wparts.length-1;i>=0;i--){const p=wparts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;if(p.life<=0)wparts.splice(i,1);}
  for(let i=bparts.length-1;i>=0;i--){const p=bparts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.99;p.life-=dt;if(p.life<=0)bparts.splice(i,1);}
  for(const a of ASH){a.y+=a.s*dtr*0.04;a.x-=dtr*0.012*a.s;if(a.y>1.02){a.y=-0.02;a.x=Math.random()*1.1;}if(a.x<-0.02)a.x=1.02;}
}
function draw(){buttons=[];ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(mode==='gate'||mode==='intro')renderIntro();else if(mode==='battle'&&B)renderBattle();else renderExplore();
  if(wipe)drawWipe();
  if(flash>0){ctx.fillStyle='rgba('+flashCol+','+Math.min(1,flash).toFixed(3)+')';ctx.fillRect(0,0,W,H);}}
let last=performance.now();
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}
genWorld();spawnWorld();computeVis();
window.EMB={get mode(){return mode;},set mode(v){mode=v;},IN,P,POI,get B(){return B;},get enemies(){return enemies;},get boss(){return boss;},goBeat,beginGame,startBattle,cmd,strike,battleTap,introTap,act,map,reach,I,ETYPES,
  step(dt,n){for(let i=0;i<n;i++){update(dt);}draw();},teleport(x,y){P.x=x;P.y=y;P.rx=x;P.ry=y;cam.x=x;cam.y=y;computeVis();},
  skipToWorld(){mode='explore';cine=null;cap=null;lb=0;lbTarget=0;revealAll=false;camLock=false;},lightAll(){for(const b of POI.b)b.lit=true;breakSeal();},setDawn(v){dawn=v;dawnTarget=v;},get cine(){return cine;},cineTap};
requestAnimationFrame(frame);
})();
</script></body></html>
