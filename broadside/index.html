<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Broadside</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#0b1620;overflow:hidden;touch-action:none;font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// STRIDE-START — 'Stride: feet follow the hips' wrapped as a per-character factory
function makeStride(ctx,g,opts){
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const sm=k=>{k=clamp(k,0,1);return k*k*(3-2*k);};
const rot=(x,y,a)=>{const c=Math.cos(a),s=Math.sin(a);return [x*c-y*s,x*s+y*c];};
// ---------- body dimensions (px) ----------
const THIGH=28.5, SHIN=27.5, L=THIGH+SHIN, LR=L*0.985;      // leg length, comfortable reach
const ANK=4.5, HEEL=4.5, TOE=15;                              // foot: ankle height, heel and toe from ankle
const TORSO=34.5, UA=21.5, FA=17.5, HEAD=6.9;          // adult proportions: head = 1/7.6 of standing height
const STAIRS=[];let XMIN=opts.xmin,XMAX=opts.xmax;
function sg(x){let s=0;for(let k=-4;k<=4;k++)s+=g(x+k*L*0.11);return s/9;}       // smoothed line the hips ride on
const gradeAt=x=>(sg(x+12)-sg(x-12))/24;                                        // + = downhill going right
const stairAt=x=>STAIRS.find(s=>x>=s.x0-4&&x<=s.x1+4)||null;
function minGround(a,b){if(a>b){const t=a;a=b;b=t;}let m=Infinity;for(let x=a;x<=b;x+=1.5)m=Math.min(m,g(x));return Math.min(m,g(b));}
function straddles(x,dir){const h=x-dir*HEEL,t=x+dir*TOE,gh=g(h),gt=g(t);for(let k=1;k<6;k++){if(Math.abs(g(h+(t-h)*k/6)-(gh+(gt-gh)*k/6))>1.5)return true;}return false;}
function snap(x,dir){if(!straddles(x,dir))return x;for(let o=1;o<=26;o++){if(!straddles(x+dir*o,dir))return x+dir*o;if(!straddles(x-dir*o,dir))return x-dir*o;}return x;}
function footSpot(x){                                            // on a flight: centre the shoe on the nearest tread; elsewhere: don't straddle an edge
  const sa=STAIRS.find(s=>x>=s.x0&&x<s.x1);
  if(sa){const k=Math.floor((x-sa.x0)/sa.w);return sa.x0+sa.w*(k+0.5)-H.dir*(TOE-HEEL)/2;}
  return snap(x,H.dir);
}
const groundAng=x=>{const k=(g(x+5)-g(x-5))/10;return Math.abs(k)>0.9?0:Math.atan(k);};   // a riser under the sole isn't a slope

const H={x:opts.x,y:0,v:0,dir:1,p:0,run:0,mode:'stand',front:0,lean:0.05,acc:0,t:0,mv:0,label:'standing'};
const F=[{plant:true,x:opts.x+6,th:0},{plant:true,x:opts.x-8,th:0}];        // 0 = near leg, 1 = far leg
H.y=sg(H.x)-ANK-0.97*L;
const input={dir:0,run:false};
const M={frames:0,dragMax:0,unreach:0,sink:0,slipMax:0};       // test metrics

// planted pose: ankle and foot angle from the locked contact x and heel lift th
function plantPose(x,th){
  const a=groundAng(x), O=[x,g(x)], rho=a+H.dir*th;
  const t0=rot(H.dir*TOE,0,a), T=[O[0]+t0[0],O[1]+t0[1]];
  const k=rot(H.dir*TOE,ANK,rho); return {A:[T[0]-k[0],T[1]-k[1]],rho};
}
function swingPose(f){
  const e=f.e, end=plantPose(f.tx,0), A1=end.A, y0=f.y0, y1=A1[1];
  const top=minGround(f.x0-HEEL,f.tx+H.dir*TOE)-ANK-3;
  const c=Math.min(y0,y1,top)-lerp(0.07*L,0.11*L,H.run), u=1-e;
  const up=y0-y1>4;                                              // stepping up: lift first, then travel
  let ax=lerp(f.x0,A1[0],sm(up?(e-0.12)/0.88:e)), ay=u*u*u*y0+3*u*u*e*c+3*u*e*e*c+e*e*e*y1;
  if(!f.timed){const k=H.run*Math.sin(Math.PI*clamp(e/0.7,0,1)); ay-=k*0.3*L; ax-=H.dir*k*0.08*L;}    // run: heel comes up behind, then the knee drives
  const mid=end.rho-H.dir*0.25;
  const rho=e<0.7?lerp(f.r0,mid,sm(e/0.7)):lerp(mid,end.rho,sm((e-0.7)/0.3));
  ay=Math.min(ay,minGround(ax-H.dir*HEEL,ax+H.dir*(TOE+3))-ANK-1); // never through a tread or nosing
  for(const lx of[-HEEL,TOE]){const v=rot(H.dir*lx,ANK,rho);ay=Math.min(ay,g(ax+v[0])-v[1]-0.5);}
  return {A:[ax,ay],rho};
}
const pose=f=>f.plant?plantPose(f.x,f.th):swingPose(f);
function lift(f,s0,tx,timed,dur){const p=pose(f);f.plant=false;f.x0=p.A[0];f.y0=p.A[1];f.r0=p.rho;f.s0=clamp(s0,0,0.95);f.e=0;f.tx=tx;f.timed=!!timed;f.t=0;f.dur=dur||0;}
function land(f){f.plant=true;f.x=f.tx;f.th=0;f.timed=false;}
const timedActive=()=>F.some(f=>!f.plant&&f.timed);

function standSpots(){
  const front=H.dir*F[0].x>=H.dir*F[1].x?0:1, s=[];
  s[front]=snap(H.x+H.dir*0.07*L,H.dir); s[1-front]=snap(H.x-H.dir*0.09*L,H.dir); return s;
}

function step(dt){
  H.t+=dt;
  const want=input.dir;
  H.run+=clamp((input.run?1:0)-H.run,-dt*2.2,dt*2.2);
  const run=H.run, beta=lerp(0.62,0.36,run), ahead=lerp(0.5,0.36,run);   // a runner lands closer under the body
  if(H.mode==='stand'&&want!==0&&want!==H.dir&&!timedActive()){H.dir=want;}
  const going=want!==0&&want===H.dir;
  const gr=gradeAt(H.x), st=stairAt(H.x+H.dir*8);

  // ---- speed and stride ----
  let S, vMax, f;
  // two treads a step only at a real run
  if(st){const n=(run>0.5&&H.v>2.4*L&&input.dir===H.dir&&2*st.w<=0.95*L&&2*st.r<=0.5*L)?2:1; S=2*st.w*n; f=lerp(0.95,1.5,run); vMax=S*f;}
  else vMax=lerp(1.5*L,4.2*L,run)/(1+0.9*Math.abs(gr));
  const wall=H.dir>0?XMAX-H.x:H.x-XMIN, v0=H.v, tgt=going?Math.min(vMax,Math.sqrt(2*5*L*Math.max(0,wall-4))):0, acc=tgt>H.v?3.5*L:6*L;
  H.v+=clamp(tgt-H.v,-acc*dt,acc*dt);
  H.acc=lerp(H.acc,(H.v-v0)/dt,Math.min(1,dt*6));
  if(!st){const v=Math.max(H.v,1);f=lerp(0.55+0.26*v/L,1.32+0.06*v/L,run);S=v/f/(1+0.8*Math.abs(gr));}
  S=Math.max(S,0.35*L);

  // ---- mode changes ----
  if(H.mode==='stand'&&going&&!timedActive()){
    H.mode='go'; const b=H.dir*F[0].x<H.dir*F[1].x?0:1;          // the trailing foot steps first
    H.p=((Math.max(beta,0.5)+1e-4-b*0.5)%1+1)%1;
  }
  if(H.mode==='go'&&!going&&H.v<0.6*L){                          // slow enough: the next steps are settling steps
    H.mode='stand'; H.v=0; const sp=standSpots();
    F.forEach((ft,i)=>{if(!ft.plant){lift(ft,0,sp[i],true,0.14+0.2*(1-ft.e));}});
  }

  // ---- stride cycle ----
  if(H.mode==='go'){
    const dx=H.v*dt; H.x=clamp(H.x+H.dir*dx,XMIN,XMAX);
    let rate=1; const sa=stairAt(H.x+H.dir*S*0.6)||st;           // on (or nearing) stairs: pace the cycle so each midstance lands over a tread
    if(sa){const c0=sa.x0+sa.w/2-H.dir*(TOE-HEEL)/2, err=(((H.p-ahead*beta-H.dir*(H.x-c0)/S)%0.5)+0.75)%0.5-0.25; rate=1-clamp(err*3,-0.45,0.45);}
    H.p=(H.p+rate*dx/S)%1;
    F.forEach((ft,i)=>{
      const q=(H.p+i*0.5)%1, inStance=q<beta, s=(q-beta)/(1-beta);
      const predict=()=>footSpot(H.x+H.dir*(S*(1-q)+ahead*beta*S));
      if(ft.plant&&!inStance)lift(ft,s,predict());
      else if(!ft.plant&&inStance)land(ft);
      if(ft.plant){const u=q/beta;ft.th=lerp(0.55,0.95,run)*sm((u-0.5)/0.5);}
      else{ft.e=clamp((s-ft.s0)/(1-ft.s0),0,1); if(ft.e<0.5)ft.tx=predict();}
    });
  } else {
    F.forEach(ft=>{
      if(ft.plant)ft.th*=Math.exp(-dt*10);
      else{ft.t+=dt;ft.e=clamp(ft.t/ft.dur,0,1);if(ft.e>=1)land(ft);}
    });
    if(!timedActive()){                                          // settle: step a foot under the body if it's out of place
      const sp=standSpots(); let w=-1,wd=0.16*L;
      F.forEach((ft,i)=>{const d=Math.abs(ft.x-sp[i]);if(d>wd){wd=d;w=i;}});
      if(w>=0)lift(F[w],0,sp[w],true,0.3);
    }
  }

  // ---- hips: ride the smoothed ground; dip only as far as a planted foot needs ----
  const hh=lerp(0.97*L,0.9*L,run)+ANK;
  let ty=sg(H.x)-hh;
  if(H.mode==='go')ty+=run*0.05*L*Math.cos(4*Math.PI*(H.p-ahead*beta));
  else ty+=Math.sin(H.t*1.7)*0.4;
  F.forEach(ft=>{                                                // ease down ahead of a landing that needs it
    if(ft.plant||ft.e<0.45)return;
    const A=plantPose(ft.tx,0).A, dx=A[0]-H.x;
    if(Math.abs(dx)<LR){const cy=A[1]-Math.sqrt(LR*LR-dx*dx);if(cy>ty)ty=lerp(ty,cy,sm((ft.e-0.45)/0.55));}
  });
  H.y+=(ty-H.y)*Math.min(1,dt*14);
  F.forEach(ft=>{
    if(!ft.plant)return;
    let A=plantPose(ft.x,ft.th).A;
    const behind=H.dir*(A[0]-H.x)<0;
    while(behind&&Math.hypot(A[0]-H.x,A[1]-H.y)>LR&&ft.th<1.0){ft.th+=0.04;A=plantPose(ft.x,ft.th).A;}   // peel the heel first
    const dx=A[0]-H.x;
    if(Math.abs(dx)<LR){const cy=A[1]-Math.sqrt(LR*LR-dx*dx);if(H.y<cy)H.y=cy;}                       // then the hips dip
  });

  // ---- upper body ----
  const gd=gr*H.dir;
  const lt=H.mode==='go'?0.05+0.15*run+clamp(H.acc/(10*L),-0.08,0.12)-clamp(gd,-0.6,0.6)*0.18+(st&&st.up===(H.dir>0)?0.08:0):0.02;
  H.lean+=(lt-H.lean)*Math.min(1,dt*5);
  H.mv+=((H.mode==='go'?clamp(H.v/(1.2*L),0,1):0)-H.mv)*Math.min(1,dt*4);     // how much the arms swing

  hairStep(dt);
  H.front=(frontOn&&H.mode==='stand'&&!timedActive()&&!input.dir)?1:0;    // turns to face you once settled

  // ---- label + metrics ----
  H.label=H.mode==='stand'?'standing':(st?((st.up===(H.dir>0))?'stairs up':'stairs down'):(run>0.5?'running':'walking'))+(H.mode==='go'&&Math.abs(gr)>0.15&&!st?(gd>0?' · downhill':' · uphill'):'');
  M.frames++;
  F.forEach(ft=>{
    const A=pose(ft).A, d=Math.hypot(A[0]-H.x,A[1]-H.y);
    if(d-L>M.unreach){M.unreach=d-L;M.uAt=Math.round(H.x)+(ft.plant?'P':'s');}
    if(ft.plant){if(H.dir*(H.x-A[0])/L>M.dragMax){M.dragMax=H.dir*(H.x-A[0])/L;M.dAt=Math.round(H.x);}}
    else{const p=pose(ft);for(const lx of[-HEEL,0,TOE]){const v=rot(H.dir*lx,ANK,p.rho),dp=p.A[1]+v[1]-g(p.A[0]+v[0]);if(dp>M.sink){M.sink=dp;M.sAt=Math.round(H.x)+':'+lx;}}}
  });
}

// ---------- IK ----------
function ik(hx,hy,ax,ay,l1,l2,bend){
  const dx=ax-hx,dy=ay-hy;let d=Math.hypot(dx,dy);d=clamp(d,Math.abs(l1-l2)+0.01,l1+l2-0.01);
  const a=Math.atan2(dy,dx),b=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1)),ang=a-bend*b;
  const K=[hx+l1*Math.cos(ang),hy+l1*Math.sin(ang)],ka=Math.atan2(ay-K[1],ax-K[0]);
  return {K,A:[K[0]+l2*Math.cos(ka),K[1]+l2*Math.sin(ka)]};
}

let showFeet=false,lastZ=1,frontOn=!!opts.frontIdle;
function limb(a,b,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
// A tapered capsule between two joints, shaded like a cylinder lit from the upper left.
function cap(a,b,ra,rb,col){
  const th=Math.atan2(b[1]-a[1],b[0]-a[0]);let nx=-Math.sin(th),ny=Math.cos(th);if(nx*-0.6+ny*-0.8<0){nx=-nx;ny=-ny;}
  ctx.beginPath();ctx.arc(a[0],a[1],ra,th+Math.PI/2,th+Math.PI*1.5);ctx.arc(b[0],b[1],rb,th-Math.PI/2,th+Math.PI/2);ctx.closePath();
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,r=(ra+rb)/2,gr=ctx.createLinearGradient(mx+nx*r,my+ny*r,mx-nx*r,my-ny*r);
  gr.addColorStop(0,shade(col,1.18));gr.addColorStop(0.35,col);gr.addColorStop(1,shade(col,0.62));ctx.fillStyle=gr;ctx.fill();
}
const lerp2=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
// ---------- body: limbs and torso drawn as anatomical outlines ----------
// Sizes follow adult measurements scaled so the head is 1/7.6 of standing height:
// shoulders ~2 head-heights wide, waist 1.3, hips 1.55; elbow at the waist, wrist at the crotch, fingertips mid-thigh.
const smoothPath=pts=>{const N=pts.length,mid=i=>[(pts[i%N][0]+pts[(i+1)%N][0])/2,(pts[i%N][1]+pts[(i+1)%N][1])/2];
  ctx.beginPath();let m0=mid(N-1);ctx.moveTo(m0[0],m0[1]);for(let i=0;i<N;i++){const q=pts[i],m2=mid(i);ctx.quadraticCurveTo(q[0],q[1],m2[0],m2[1]);}ctx.closePath();};
// A limb between joints a and b. front/back: [t, half-width] along the bone (t 0..1), on the facing side and the other side.
function limb2(a,b,front,back,col,face,light){
  const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1e-6,u=[dx/len,dy/len];
  let n=[-u[1],u[0]];if(n[0]*face<0||(n[0]===0&&face<0))n=[-n[0],-n[1]];
  const at=(t,w)=>[a[0]+u[0]*t*len+n[0]*w,a[1]+u[1]*t*len+n[1]*w];
  const pts=[...front.map(([t,w])=>at(t,w)),...back.slice().reverse().map(([t,w])=>at(t,-w))];
  smoothPath(pts);
  const mid=at(0.45,0),wm=Math.max(...front.map(q=>q[1]),...back.map(q=>q[1]));
  const lit=light==null?1:light, gr=ctx.createLinearGradient(mid[0]+n[0]*wm,mid[1]+n[1]*wm,mid[0]-n[0]*wm,mid[1]-n[1]*wm);
  gr.addColorStop(0,shade(col,0.92*lit));gr.addColorStop(0.3,shade(col,1.12*lit));gr.addColorStop(0.62,shade(col,0.98*lit));gr.addColorStop(1,shade(col,0.66*lit));
  ctx.fillStyle=gr;ctx.fill();
  return {at,n,u,len};
}
function fold(p0,c,p1,col,w){ctx.strokeStyle=col;ctx.lineWidth=w||0.45;ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.quadraticCurveTo(c[0],c[1],p1[0],p1[1]);ctx.stroke();}


function drawLeg(ft,near){
  const p=pose(ft), leg=ik(H.x,H.y,p.A[0],p.A[1],THIGH,SHIN,H.dir), m=near?1:0.78, d=H.dir;
  const pant=shade(FL.pants,m), shoe=shade(FL.shoe,m), hip=[H.x,H.y], K=leg.K, A=leg.A;
  // trousers: thigh (quads in front, hamstrings behind), then the shin with the calf behind
  const th=limb2(hip,K,[[-0.12,4.6],[0.12,5.9],[0.4,5.8],[0.72,4.9],[0.95,4.1],[1.06,3.8]],[[-0.12,6.2],[0.15,6.4],[0.42,5.3],[0.75,4.3],[0.97,3.9],[1.06,3.6]],pant,d);
  const sh=limb2(K,A,[[-0.06,3.9],[0.15,3.7],[0.55,3.2],[0.85,3.0],[1.0,3.1]],[[-0.06,3.9],[0.18,4.6],[0.36,4.7],[0.62,3.8],[0.88,3.2],[1.0,3.2]],pant,d);
  ctx.fillStyle=pant;ctx.beginPath();ctx.arc(K[0],K[1],3.9,0,7);ctx.fill();                                  // fills the knee joint
  const bend=Math.abs(Math.atan2(K[1]-hip[1],K[0]-hip[0])-Math.atan2(A[1]-K[1],A[0]-K[0]));
  const fc=shade(pant,0.62);
  if(bend>0.2){for(const k of[-1,0.6]){fold(sh.at(-0.02,-3.4),sh.at(0.04+k*0.02,-1),sh.at(0.1+k*0.04,1.5),fc);}}            // creases behind the knee
  fold(th.at(0.25,2.5),th.at(0.55,3.4),th.at(0.85,2.2),shade(pant,0.75),0.4);                                                    // crease down the front of the thigh
  fold(sh.at(0.72,2.6),sh.at(0.82,0.5),sh.at(0.9,-2.4),fc,0.4);fold(sh.at(0.82,2.8),sh.at(0.9,0.6),sh.at(0.96,-2.6),fc,0.35);   // break above the boot
  // boot, drawn in the foot's frame (x forward, y down, origin at the ankle)
  const W=(x,y)=>{const v=rot(d*x,y,p.rho);return [A[0]+v[0],A[1]+v[1]];};
  const path=pts=>{ctx.beginPath();pts.forEach((q,i)=>{const w=W(q[0],q[1]);i?ctx.lineTo(w[0],w[1]):ctx.moveTo(w[0],w[1]);});ctx.closePath();};
  const top=W(0,-3), bot=W(0,ANK), sg=ctx.createLinearGradient(top[0],top[1],bot[0],bot[1]);sg.addColorStop(0,shade(shoe,1.5));sg.addColorStop(1,shoe);
  path([[-HEEL,ANK-1],[-HEEL-0.6,ANK-4],[-HEEL+0.8,-1.5],[1.5,-2.2],[6,ANK-4.6],[TOE-3,ANK-3.4],[TOE-0.6,ANK-2.4],[TOE,ANK-1.2],[TOE-0.4,ANK]]);ctx.fillStyle=sg;ctx.fill();
  path([[-HEEL-0.3,ANK-1.5],[TOE-0.2,ANK-1.5],[TOE-0.5,ANK],[-HEEL,ANK]]);ctx.fillStyle=shade(shoe,0.55);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=0.4;ctx.beginPath();let w1=W(-HEEL,ANK-1.5),w2=W(TOE-0.4,ANK-1.5);ctx.moveTo(w1[0],w1[1]);ctx.lineTo(w2[0],w2[1]);ctx.stroke();
  ctx.strokeStyle=shade(FL.shoe,2.2);ctx.lineWidth=0.45;for(let i=0;i<3;i++){const c=W(2.2+i*1.6,-1.2+i*0.95);ctx.beginPath();ctx.moveTo(c[0]-d*0.9,c[1]-0.5);ctx.lineTo(c[0]+d*0.6,c[1]+0.5);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,.18)';const gl=W(TOE-3.2,ANK-3.1);ctx.beginPath();ctx.ellipse(gl[0],gl[1],1.6,0.6,p.rho,0,7);ctx.fill();
  // trouser hem resting on the boot
  const hm=limb2(sh.at(0.86,0),A,[[0,3.3],[1,3.6]],[[0,3.3],[1,3.6]],shade(pant,0.95),d);
  return {p,A};
}
// Hand seen from the side: back of the hand toward us, thumb forward, fingers loosely curled (a fist at a run).
function drawHand(w,dirA,skin,fist){
  ctx.save();ctx.translate(w[0],w[1]);ctx.rotate(dirA);ctx.scale(1,H.dir);   // x along the forearm, +y toward the front
  const g=ctx.createLinearGradient(0,-3,0,3.5);g.addColorStop(0,shade(skin,0.82));g.addColorStop(0.5,shade(skin,1.06));g.addColorStop(1,shade(skin,0.9));ctx.fillStyle=g;
  const L1=lerp(10.5,7,fist);
  smoothPath([[-0.6,-1.9],[3,-2.5],[6.5,-2.3],[L1-1,-1.3],[L1+0.4,0.3],[L1-0.6,1.9],[6.2,2.6],[3,2.4],[-0.6,1.9]]);ctx.fill();
  ctx.strokeStyle=shade(skin,0.62);ctx.lineWidth=0.3;ctx.globalAlpha=0.7;
  for(const k of[-1.2,0,1.1]){ctx.beginPath();ctx.moveTo(L1*0.62,k*0.8);ctx.quadraticCurveTo(L1*0.85,k*0.75,L1-0.4,k*0.55+0.3);ctx.stroke();}   // finger gaps

// ---------- ships ----------
function hullW(s){return s.len*(1-0.7*s.facing);}
function shipY(s){return s.shore?-46:wave(s.x)+s.sink*55;}
function shipTilt(s){if(s.shore)return 0;return Math.atan(waveSlope(s.x))*0.85*(s===player?1-0.7*zoom:1)+s.sink*0.55*s.dir;}
function guns(s){const g=s.facing<0.5?3:1;return s===player?Math.max(1,Math.min(g,count('guns'))):g;}
function fire(s){
  const n=guns(s),w=hullW(s),y=s.shore?-87:shipY(s)-s.hgt*0.3,tilt=shipTilt(s);
  const elev=s.angle*Math.PI/180-tilt*s.dir, v=380+s.power*440;
  for(let i=0;i<n;i++){
    const off=(n===1?w*0.42:(-0.25+0.25*i)*w)*(s.shore?1.5:1), gx=s.x+off*s.dir, spread=(i-(n-1)/2)*0.012;
    balls.push({x:gx,y,vx:Math.cos(elev+spread)*v*s.dir,vy:-Math.sin(elev+spread)*v,o:s,trail:[]});
    smoke(gx+12*s.dir,y,s.dir,7);flash(gx+14*s.dir,y);
  }
  s.cool=RELOAD;shake=Math.max(shake,n*2.2);boom(0.5,0.5,900);

function updShip(s,dt,inp){if(s.shore){inp=Object.assign({},inp,{left:0,right:0});s.wantBow=false;s.vx=0;}
  if(s.hp<=0){s.sink=Math.min(1.6,s.sink+dt*0.35);s.vx*=0.95;s.x+=s.vx*dt;return;}
  s.facing+=((s.wantBow?1:0)-s.facing)*Math.min(1,dt*1.7);
  const top=65+95*s.facing;
  if(inp.left)s.vx-=top*2.2*dt;if(inp.right)s.vx+=top*2.2*dt;
  s.vx=clamp(s.vx,-top,top)*Math.pow(0.25,dt);
  s.x=clamp(s.x+s.vx*dt,arena.x0,arena.x1);
  if(inp.up)s.angle=Math.min(72,s.angle+38*dt);if(inp.down)s.angle=Math.max(14,s.angle-38*dt);
  s.cool=Math.max(0,s.cool-dt);s.hitFlash=Math.max(0,s.hitFlash-dt);
  if(inp.fire&&s.cool<=0){s.charging=true;s.power=Math.min(1,s.power+dt*0.85);}
  else if(s.charging){fire(s);s.charging=false;s.power=0;}
}
function hitTest(b,s){
  if(s.hp<=0)return false;
  const w=hullW(s),y=shipY(s),dx=Math.abs(b.x-s.x);

  if(dx<w*0.3+4&&b.y>y-135&&b.y<y-s.hgt*0.75)return Math.random()<0.45;
  return false;
}

function updVoyage(dt){
  if(V.ev)return;
  tod=(tod+dt/DAY_LEN)%1;if(tod<dt/DAY_LEN){V.day++;say(`Day ${V.day} at sea.`);}
  V.mod=V.mod.filter(m=>(m.t-=dt)>0);V.calm=Math.max(0,V.calm-dt);V.storm=Math.max(0,V.storm-dt);V.rowing=Math.max(0,V.rowing-dt);V.mutinyCd=Math.max(0,V.mutinyCd-dt);
  V.crew.forEach(c=>{c.sick=Math.max(0,c.sick-dt);if(c.sick>0)c.role='hold';});
  const rig=eff('rigging'),helm=eff('helm'),pump=eff('pumps'),cook=eff('galley'),fish=eff('fishing');
  // speed
  let spd=16*(0.3+0.7*Math.min(1,rig/3))*(0.35+0.65*V.sails/100)*(0.6+0.4*V.rudder/100)*(helm>0?1:0.6)*(0.75+0.25*morale()/100);
  if(V.calm>0)spd*=V.rowing>0?0.4:0.1;V.mod.forEach(m=>{if(m.k==='spd')spd*=m.v;});
  V.speed=spd;V.dist+=spd*dt;player.x+=spd*dt*6;
  // wear, consumption, repairs
  const per=dt/DAY_LEN,n=V.crew.length;
  V.food-=18*per*n/6*(cook>0?0.75:1);V.water-=20*per*n/6;V.rum-=9*per;
  V.sails-=3*per*(V.storm>0?6:1);V.sails+=rig*1.1*dt*(V.sails<100?1:0)*0.35;
  V.hull-=(1+V.leaks*14)*per;V.hull+=pump*0.9*dt*(V.hull<100?1:0)*0.5;if(V.leaks&&pump>0&&V.hull>55)V.leaks=0;
  V.rudder-=1.5*per*(helm>0?1:4);V.rudder+=helm*0.3*dt*(V.rudder<100?1:0);
  V.food+=fish*0.35*dt;
  // fatigue & morale
  const hungry=V.food<25,thirsty=V.water<25,dry=V.rum<=0;
  V.crew.forEach(c=>{
    if(c.role==='hold')c.fat=Math.max(0,c.fat-50*per*2.2);else c.fat=Math.min(100,c.fat+50*per*(V.storm>0?1.6:1));
    c.m-=(2+(hungry?10:0)+(thirsty?12:0)+(dry?6:0)+(V.storm>0?3:0)+(c.fat>80?10:0))*per*4;
    c.m+=((V.food>60&&V.water>60&&V.rum>20?1.5:0)+(cook>0?1.5:0))*per*4;c.m=clamp(c.m,0,100);});
  if(V.food<=0&&V.water<=0&&Math.random()<dt*0.05&&n>1)loseCrew(pick(V.crew),'dies of thirst');
  V.food=clamp(V.food,0,100);V.water=clamp(V.water,0,100);V.rum=clamp(V.rum,0,100);V.sails=clamp(V.sails,5,100);V.rudder=clamp(V.rudder,5,100);V.hull=Math.min(100,V.hull);
  // events
  V.eventT-=dt;
  if(morale()<20&&V.mutinyCd<=0&&n>=2){openEvent(MUTINY);}
  else if(V.eventT<=0){const night=light<0.3;const pool=EVENTS.filter(e=>!e.night||night);let tot=pool.reduce((a,e)=>a+e.w,0),r=Math.random()*tot,e=pool[0];for(const x of pool){r-=x.w;if(r<=0){e=x;break;}}openEvent(e);}
  if(V.hull<=0){winner='enemy';mode='over';V.log='She goes down by the head.';}
  else if(n===0){winner='enemy';mode='over';V.log='A ship with no crew is a coffin.';}
  else if(V.dist>=V.total){mode='arrived';zoomOn=false;}
  // camera & zoom
  zoom=lerp(zoom,zoomOn?1:0,Math.min(1,dt*3));
  const farS=Math.min(cw/1400,ch/720),nearS=Math.min(cw/(player.len*1.12),ch/292);
  cam.scale=lerp(cam.scale,lerp(farS,nearS,zoom),Math.min(1,dt*3));
  cam.cx=lerp(cam.cx,player.x+lerp(320,8,zoom),Math.min(1,dt*3));
  seaLine=lerp(0.6,0.7,zoom);
  V.logT-=dt;
}

function toLocal(px,py){const s=player,X=sx(s.x),Y=sy(shipY(s)),tl=shipTilt(s);let dx=(px-X)/cam.scale,dy=(py-Y)/cam.scale;const c=Math.cos(-tl),sn=Math.sin(-tl);return{x:(dx*c-dy*sn)*s.dir,y:dx*sn+dy*c};}
function crewAt(lx,ly){let best=null,bd=14;V.crew.forEach(c=>{const d=Math.hypot(c.px-lx,c.py-6-ly);if(d<bd){bd=d;best=c;}});return best;}
function stationAt(lx,ly){for(const k in ST){const s=ST[k];if(lx>=s.x-4&&lx<=s.x+s.w+4&&ly>=s.y-4&&ly<=s.y+s.h+4)return k;}return null;}
function assign(c,k){if(c.sick>0&&k!=='hold'){say(`${c.n} is too sick to work.`);return;}if(k!=='hold'&&count(k)>=ST[k].cap){say(`${ST[k].l} is full.`);return;}c.role=k;say(`${c.n} → ${ST[k].l}.`);}
function voyageTap(x,y){
  if(V.ev){for(const b of V.ev.btns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){choose(b.i);return;}return;}
  for(const b of vbtns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
    if(b.id==='zoom'){zoomOn=!zoomOn;sel=null;}
    return;}
  if(zoom>0.7){const l=toLocal(x,y);const c=crewAt(l.x,l.y);
    if(c){sel=sel===c?null:c;if(sel)say(`${c.n} — ${c.role==='hold'?'off watch':ST[c.role].l.toLowerCase()}, ${c.fat>70?'exhausted':c.fat>40?'tired':'fresh'}. Tap a station.`);return;}
    const k=stationAt(l.x,l.y);
    if(k){if(sel){assign(sel,k);sel=null;}else say(`${ST[k].l} ${k==='hold'?count('hold'):count(k)+'/'+ST[k].cap} — ${ST[k].desc}.`);return;}
    if(Math.abs(l.x)>player.len*0.8||l.y>60||l.y<-170){zoomOn=false;sel=null;}
  } else {const l=toLocal(x,y);if(Math.abs(l.x)<player.len*0.7&&l.y<30&&l.y>-170)zoomOn=true;}
}

function groundRaw(x){if(x<0)return wave(x);if(x<600)return -x*0.03;if(x<900)return -18-(x-600)/300*52;if(x<1700)return -70-(x-900)*0.045+Math.sin(x*0.02)*3;if(x<2050)return -106-(x-1700)*0.36;if(x<2300)return -232-Math.sin((x-2050)*0.03)*4;if(x<2700)return -232+(x-2300)/400*150+Math.sin(x*0.03)*2;if(x<3280)return -82+(x-2700)*0.02+Math.sin(x*0.02)*3;if(x<3470)return lerp(-70,-3,(x-3280)/190);return lerp(-3,70,Math.min(1,(x-3470)/140));}
const PADS=[[55,50],[350,84],[520,34],[1000,62],[1100,36],[1180,14],[1250,86],[1400,44],[1480,34],[1560,56],[1690,26],[2110,76],[2215,30],[2275,24],[2745,54],[2850,42],[2960,70],[3130,44]].map(([c,hw])=>({a:c-hw,b:c+hw,c}));
function ground(x){if(x<0||x>3300)return groundRaw(x);const B=30;let L=null,R=null;for(const p of PADS){if(x>=p.a&&x<=p.b)return groundRaw(p.c);if(p.b<x)L=p;else if(!R&&p.a>x)R=p;}
  const raw=groundRaw(x),ss=u=>u*u*(3-2*u);
  if(L&&R&&R.a-L.b<2*B)return lerp(groundRaw(L.c),groundRaw(R.c),ss((x-L.b)/(R.a-L.b)));
  if(L&&x-L.b<B)return lerp(groundRaw(L.c),raw,ss((x-L.b)/B));
  if(R&&R.a-x<B)return lerp(groundRaw(R.c),raw,ss((R.a-x)/B));
  return raw;}

function update(dt){
  FDT=dt;
  if(mode==='battle'&&parts.length<260)for(const s of [player,enemy]){if(!s||s.shore||s.hp<=0||s.hp>50)continue;const sev=1-s.hp/50;if(Math.random()<dt*(3+sev*9)){const fx=s.x+rnd(-0.3,0.3)*s.len,fy=shipY(s)-s.hgt*rnd(0.5,0.8);parts.push({t:'smoke',hot:1,x:fx,y:fy,vx:rnd(-12,12),vy:rnd(-55,-28),life:rnd(1.4,2.4),r:rnd(4,8)});if(Math.random()<0.5+sev*0.4)parts.push({t:'spark',x:fx,y:fy,vx:rnd(-30,30),vy:rnd(-120,-50),life:rnd(.4,.9),r:1});}}
  if(demo){demoTick(dt);if(mode==='voyage')dt*=demo.speed;}
  t+=dt;wind=36*Math.sin(t*0.05)+14*Math.sin(t*0.13);shake*=Math.pow(0.02,dt);
  if(banner&&(banner.life-=dt)<=0)banner=null;
  light=(Math.sin(tod*Math.PI*2-Math.PI/2)+1)/2;
  if(mode==='battle'){updBattle(dt);zoom=lerp(zoom,0,dt*3);seaLine=lerp(seaLine,0.6,dt*3);}
  else if(mode==='boarding')updBoarding(dt);
  else if(mode==='voyage')updVoyage(dt);
  else if(mode==='island'){updIsland(dt);for(const it of I.items)if(it.pick&&Math.abs(I.kid.x-it.x)<12){I.items=I.items.filter(x=>x!==it);I.shells++;I.shellV+=it.k==='shell'?2:1;isay(it.k==='shell'?'A pretty shell. Worth a coin or two.':'A corked bottle — a note inside? No. Rum. Empty.');}}
  else if(mode==='over'&&enemy)updShip(player,dt,{});
  if(mode!=='battle'&&mode!=='over')player.hitFlash=0;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    if(p.t==='spark'){p.vy+=G*0.5*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else if(p.t==='drop'||p.t==='deb'){p.vy+=G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='deb'&&p.y>wave(p.x)){parts.splice(i,1);}}
    else if(p.t==='smoke'){p.vx+=wind*0.6*dt;p.vx*=Math.pow(0.3,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=18*dt;}
  }
}

function nextStep(){if(mode!=='battle')input.fire=false;if(!demo)return;demo.i++;demo.t=0;demo.acted=false;demo.dwell=0;demo.ptr.press=false;input.left=input.right=0;if(demo.i>=STEPS.length){stopDemo();return;}const s=STEPS[demo.i];demo.cap=s.cap;if(!s.target&&!s.tick)demo.ptr.show=false;if(s.on)s.on();}
function demoTick(dt){if(!demo)return;if(mode==='over'){stopDemo();return;}const s=STEPS[demo.i];if(!s)return;demo.t+=dt*0.62;const P=demo.ptr;P.pressT=Math.max(0,P.pressT-dt);
  if(s.target&&!demo.acted){const tg=s.target();if(tg){P.show=true;const dx=tg.x-P.x,dy=tg.y-P.y,dist=Math.hypot(dx,dy),step=Math.min(dist,(300+dist*3)*dt);if(dist>1){P.x+=dx/dist*step;P.y+=dy/dist*step;}
      if(dist<6){demo.dwell+=dt;if(demo.dwell>0.4){P.pressT=0.3;s.act();demo.acted=true;}}}}
  if(s.tick)s.tick(dt);
  if(demo&&demo.t>=s.d&&(!s.target||demo.acted))nextStep();
  if(demo&&mode==='voyage'&&demo.i<22)V.eventT=9999;if(demo&&mode==='battle'&&player.hp<35)player.hp=35;}
function autopilot(dt){if(mode!=='battle'||!enemy||enemy.hp<=0)return;
  const near=Math.abs(enemy.x-player.x)<900;input.left=near?1:0;
  if(player.cool<=0&&!player.charging&&!demo.aimT){demo.aimT=rnd(36,56);}
  if(demo.aimT){const diff=demo.aimT-player.angle;if(Math.abs(diff)>1){player.angle+=Math.sign(diff)*Math.min(Math.abs(diff),38*dt);const b=btnC(diff>0?'up':'down');if(b){demo.ptr.x=b.x;demo.ptr.y=b.y;demo.ptr.show=true;demo.ptr.press=true;}}
    else if(!player.charging&&!input.fire){input.fire=true;demo.want=0;}}
  if(input.fire){const d=Math.abs(enemy.x-player.x)-(player.shore?70:0),th=player.angle*Math.PI/180,v=Math.sqrt(d*G/Math.max(0.2,Math.sin(2*th)));if(!demo.want)demo.want=clamp((v-380)/440+rnd(-0.04,0.04),0.1,1);const want=demo.want;
    const b=btnC('fire');if(b){demo.ptr.x=b.x;demo.ptr.y=b.y;demo.ptr.show=true;demo.ptr.press=true;}
    if(player.power>=want||player.cool>0){input.fire=false;demo.aimT=0;demo.want=0;demo.ptr.press=false;demo.ptr.pressT=0.2;}}
  else if(!demo.aimT)demo.ptr.press=false;
  if(enemy.hp<40&&!player.shore)enemy.hp=40;}
function drawPointer(){if(!demo||!demo.ptr.show)return;const P=demo.ptr,r=P.press||P.pressT>0?13:17;
  ctx.fillStyle=P.press||P.pressT>0?'rgba(255,220,150,0.55)':'rgba(255,255,255,0.28)';ctx.beginPath();ctx.arc(P.x,P.y,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,r,0,7);ctx.stroke();
  if(P.pressT>0){ctx.strokeStyle=`rgba(255,220,150,${P.pressT*3})`;ctx.beginPath();ctx.arc(P.x,P.y,r+(0.3-P.pressT)*60,0,7);ctx.stroke();}}
// ---------- autosave ----------
const SAVE_KEY='broadside.save.v1';let saveT=0;
function saveGame(){if(PREV)return;try{let data=null;
  if((mode==='island'||(player&&player.shore))&&I){const o=Object.assign({},I);o.raid=null;o.dive=null;o.rowing=null;o.fishing=null;o.haul=null;o.pour=null;o.cp=[];o.rc=[];o.pops=[];o.prompts=[];data={mode:'island',I:o,tod};}
  else if((mode==='voyage'||mode==='battle'||mode==='boarding')&&V){const o=Object.assign({},V);o.ev=null;let h=null;if(I_home){h=Object.assign({},I_home);h.rowing=h.fishing=h.haul=h.pour=h.raid=null;h.cp=[];h.rc=[];h.pops=[];h.prompts=[];}data={mode:'voyage',V:o,tod,I:h};}
  if(data)localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;const d=JSON.parse(raw);
  if(d.mode==='island'){newIsland();Object.assign(I,d.I);I.dive=null;I.rowing=null;I.fishing=null;I.haul=null;I.pour=null;I.cp=[];I.rc=[];I.pops=[];I.prompts=[];I.kid.tx=I.kid.x;I.lvl=I.lvl||{};I.goods=I.goods||{};I.chart=false;I.pile=I.pile||{};I.dmg=I.dmg||{};if(I.raidIn===undefined)I.raidIn=5;tod=d.tod||0.3;mode='island';enterIsland();isay('Welcome back.');}
  else{I_home=d.I||null;newVoyage();Object.assign(V,d.V);V.ev=null;V.mod=V.mod||[];tod=d.tod||0.3;player.x=600;mode='voyage';say('Welcome back, captain.');}
  return true;}catch(e){return false;}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
// ---------- loop ----------
let last=performance.now();
let frameErrs=0;
function frame(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;try{update(dt);draw();drawPreviewUI();if(!demo){saveT+=dt;if(saveT>4){saveT=0;saveGame();}}}catch(e){try{for(let i=0;i<40;i++)ctx.restore();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}catch(_){}if(frameErrs++<5&&typeof console!=='undefined')console.error(e);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
