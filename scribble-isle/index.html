<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scribble Isle</title>
<style>
html,body{margin:0;height:100%;background:#fff4dc;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const mkc=()=>document.createElement('canvas');
const bgc=mkc(),bgx=bgc.getContext('2d'),ikc=mkc(),ikx=ikc.getContext('2d'),mc=mkc(),mkx=mc.getContext('2d'),atl=mkc(),tc=mkc();
let W=0,H=0,cols=0,rows=0,cw=0,chh=0,qscale=1,dpr=1,MT,LV,DEP,CHS,TM,SOL,img,px8,iimg,ik8;
const TS=28,NM=8,NL=5,NV=4,OS=1.85;

/* ---------- scratch atlas: every cell is a little bundle of pen strokes ---------- */
function mkAtlas(){
  atl.width=NL*NV*TS;atl.height=NM*TS;const c=atl.getContext('2d');c.lineCap='round';c.lineJoin='round';c.strokeStyle='#fff';c.fillStyle='#fff';
  let s=777;const r=()=>{s=s*16807%2147483647;return s/2147483647},R=(a,b)=>a+(b-a)*r();
  for(let m=0;m<NM;m++)for(let l=1;l<=NL;l++)for(let v=0;v<NV;v++){
    c.save();c.translate(((l-1)*NV+v)*TS,m*TS);c.beginPath();c.rect(0,0,TS,TS);c.clip();
    let n=[0,2,4,6,9,13][l];if(m===6)n=[0,1,1,2,2,3][l];if(m===2)n=n*2;
    for(let k=0;k<n;k++){
      const x=R(5,TS-5),y=R(5,TS-5);c.globalAlpha=R(.6,1);c.lineWidth=R(1.3,2.5);c.beginPath();
      if(m===0){const a=-1.57+R(-.45,.45),L=R(6,11);c.moveTo(x,y+L/2);c.quadraticCurveTo(x+R(-2.5,2.5),y,x+Math.cos(a)*L,y+L/2+Math.sin(a)*L)}
      else if(m===1){const L=R(10,18),u=R(2,3.5);c.moveTo(x-L/2,y);c.quadraticCurveTo(x-L/4,y-u,x,y);c.quadraticCurveTo(x+L/4,y+u,x+L/2,y)}
      else if(m===2){if(r()<.75){c.arc(x,y,R(.8,1.7),0,6.3);c.fill();continue}c.moveTo(x-2,y);c.lineTo(x+2,y+R(-1,1))}
      else if(m===3){const a=((k&1)?.8:-.8)+R(-.2,.2),L=R(9,15);c.moveTo(x-Math.cos(a)*L/2,y-Math.sin(a)*L/2);c.lineTo(x+Math.cos(a)*L/2,y+Math.sin(a)*L/2)}
      else if(m===4){const a=R(0,6.3);c.arc(x,y,R(2.5,5),a,a+R(3,5.6))}
      else if(m===5){c.lineWidth=R(2.4,3.8);let px=R(1,5),py=y;c.moveTo(px,py);for(let q=0;q<5;q++){px+=R(4,6.5);py=y+((q&1)?-1:1)*R(2.5,5);c.lineTo(px,py)}}
      else if(m===6){const L=R(4,6.5),a0=R(0,1);for(let q=0;q<3;q++){const a=a0+q*1.047;c.moveTo(x-Math.cos(a)*L,y-Math.sin(a)*L);c.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L)}}
      else{const a=-.95+R(-.12,.12),L=R(10,17);c.moveTo(x-Math.cos(a)*L/2,y-Math.sin(a)*L/2);c.lineTo(x+Math.cos(a)*L/2,y+Math.sin(a)*L/2)}
      c.stroke();
    }
    c.restore();
  }
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.width=Math.max(64,Math.floor(innerWidth*dpr));H=cv.height=Math.max(64,Math.floor(innerHeight*dpr));
  cols=Math.round(Math.min(124,Math.max(56,innerWidth/8.5))/qscale);cw=W/cols;rows=Math.max(14,Math.round(H/(cw*1.12)));chh=H/rows;
  const n=cols*rows;MT=new Uint8Array(n);LV=new Uint8Array(n);SOL=new Uint8Array(n);DEP=new Float32Array(n);CHS=new Uint8Array(n);for(let i=0;i<n;i++)CHS[i]=Math.random()*256;
  bgc.width=ikc.width=cols;bgc.height=ikc.height=rows;img=bgx.createImageData(cols,rows);px8=img.data;iimg=ikx.createImageData(cols,rows);ik8=iimg.data;for(let i=3;i<ik8.length;i+=4)ik8[i]=255;
  mc.width=W;mc.height=H;
  tc.width=cols;tc.height=rows;const t=tc.getContext('2d',{willReadFrequently:true});t.clearRect(0,0,cols,rows);
  const f=Math.min(rows*.2,cols*.15);t.font='900 '+f+'px "Arial Black",Arial,Helvetica,sans-serif';t.textAlign='center';t.textBaseline='middle';t.fillStyle='#fff';
  t.fillText('SCRIBBLE',cols/2,rows*.3);t.fillText('ISLE',cols/2,rows*.3+f*1.02);
  const d=t.getImageData(0,0,cols,rows).data;TM=new Uint8Array(n);for(let i=0;i<n;i++)TM[i]=d[i*4+3]>110?1:0;
}

/* ---------- world ---------- */
const N=400,MID=100,TOP=13.5,BASE=2.6;
const G=new Float32Array(N*N),O=new Float32Array(N*N),M=new Uint8Array(N*N),B=new Uint8Array(N*N),K=new Uint8Array(N*N);
let seed=4242;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const RT=new Float32Array(4096);for(let i=0;i<4096;i++)RT[i]=rnd();
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const x0=xi&63,x1=(xi+1)&63,y0=(yi&63)<<6,y1=((yi+1)&63)<<6;
  const a=RT[x0+y0],b=RT[x1+y0],c=RT[x0+y1],d=RT[x1+y1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>(vn(x,y)*.5+vn(x*2.1,y*2.1)*.25+vn(x*4.3,y*4.3)*.125+vn(x*8.7,y*8.7)*.0625)/.9375;
const sstep=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};
const KC=[[.97,.25,.3],[1,.6,.1],[.3,.8,.22],[.18,.58,1],[.74,.4,.98]];
const TP=[[1,.45,.66],[1,.6,.14],[.56,.86,.14],[.08,.76,.6],[1,.82,.14],[.76,.42,.96],[.96,.3,.3]];
const FLC=[[1,.3,.5],[1,.85,.1],[1,1,1],[.6,.45,1],[1,.5,.1]];
const sites=[],drops=[],buns=[],friends=[];
function gen(){
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const x=i*.5,z=j*.5,r=Math.hypot(x-MID,z-MID),d=r/88;
    let g=(fbm(x*.03+7,z*.03+3)-.30-d*d*.5)*10;
    const w=sstep(19,12,r);g=g*(1-w)+BASE*w;
    G[i+j*N]=g<-2.5?-2.5:g;
  }
  const gA=(x,z)=>G[(x*2|0)+(z*2|0)*N];
  for(let k=0;k<5;k++){
    const a=k*Math.PI*2/5+rnd()*.6+.4;let sx=MID,sz=MID;
    for(let r=52;r>24;r-=2){sx=MID+Math.cos(a)*r;sz=MID+Math.sin(a)*r;if(gA(sx,sz)>1.1)break}
    const base=Math.max(1.2,gA(sx,sz));
    for(let j=-16;j<=16;j++)for(let i=-16;i<=16;i++){
      const r=Math.hypot(i,j)*.5,w=sstep(7.5,4.5,r),k2=((sx*2|0)+i)+((sz*2|0)+j)*N;
      G[k2]=G[k2]*(1-w)+base*w;
    }
    sites.push({x:sx,z:sz,y:0,got:false,kx:MID,ky:12,kz:MID});
    for(let p=0;p<6;p++){
      const pa=p*Math.PI/3+.3,ci=(sx+Math.cos(pa)*4.2)*2|0,cj=(sz+Math.sin(pa)*4.2)*2|0,hh=1+rnd()*1.1;
      for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const q=ci+i+(cj+j)*N;O[q]=hh*(i||j?.72:1);M[q]=4;K[q]=k;if(!i&&!j)B[q]=1}
    }
  }
  // lighthouse
  for(let j=-10;j<=10;j++)for(let i=-10;i<=10;i++){
    const r=Math.hypot(i,j)*.5,q=(MID*2+i)+(MID*2+j)*N;
    if(r<1.7){O[q]=9.6;M[q]=3;B[q]=1}else if(r<3.1){O[q]=1.2;M[q]=3;B[q]=1}else if(r<4.4){O[q]=.3;M[q]=3}
  }
  // cottages
  [[-9,-5],[-13,3],[9,-5],[13,3],[-4,-13],[5,-13]].forEach(([ox,oz],n)=>{const ci=(MID+ox)*2,cj=(MID+oz)*2;
    for(let j=-4;j<=4;j++)for(let i=-5;i<=5;i++){const q=ci+i+(cj+j)*N;G[q]=BASE;if(Math.abs(i)<=3&&Math.abs(j)<=2){O[q]=2.1+(1-Math.abs(j)/2.7)*1.6;M[q]=5;B[q]=1;K[q]=(n*3+1)%TP.length}}});
  const far=(x,z,d1,d2)=>{if(Math.hypot(x-MID,z-MID)<d2)return false;for(const s of sites)if(Math.hypot(x-s.x,z-s.z)<d1)return false;return true};
  for(let t=0;t<2600;t++){
    const x=20+rnd()*160,z=20+rnd()*160,g=gA(x,z);
    if(g<.9||g>4.3||vn(x*.07+9,z*.07)<.45||!far(x,z,8.5,20))continue;
    const hh=3+rnd()*2.2,rad=1.4+rnd()*.8,ci=x*2|0,cj=z*2|0,rr=Math.ceil(rad*2),kc=(vn(x*.045+31,z*.045+17)*14+rnd()*1.6|0)%TP.length;
    for(let j=-rr;j<=rr;j++)for(let i=-rr;i<=rr;i++){
      const r=Math.hypot(i,j)*.5;if(r>=rad)continue;const q=ci+i+(cj+j)*N,v=hh*Math.pow(1-(r/rad)*(r/rad),.55);
      if(M[q]>=3)continue;if(v>O[q]){O[q]=v;M[q]=1;K[q]=kc}
    }
    B[ci+cj*N]=1;B[ci+1+cj*N]=1;B[ci+(cj+1)*N]=1;B[ci-1+cj*N]=1;B[ci+(cj-1)*N]=1;
  }
  for(let t=0;t<380;t++){
    const x=15+rnd()*170,z=15+rnd()*170,g=gA(x,z);
    if(g<.2||!far(x,z,6,20))continue;
    const rad=.6+rnd()*.8,hh=rad*(.8+rnd()*.6),ci=x*2|0,cj=z*2|0,rr=Math.ceil(rad*2);
    for(let j=-rr;j<=rr;j++)for(let i=-rr;i<=rr;i++){
      const r=Math.hypot(i,j)*.5;if(r>=rad)continue;const q=ci+i+(cj+j)*N;if(M[q]===1||M[q]>=3)continue;
      const v=hh*Math.sqrt(1-(r/rad)*(r/rad));if(v>O[q]){O[q]=v;M[q]=2}
      if(rad>.9&&r<rad*.6)B[q]=1;
    }
  }
  const reach=new Uint8Array(N*N),st=[MID*2+(MID*2+18)*N];reach[st[0]]=1;
  while(st.length){const q=st.pop(),i=q%N,j=q/N|0;
    for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=i+di,b=j+dj;if(a<1||b<1||a>N-2||b>N-2)continue;const k=a+b*N;
      if(reach[k]||B[k]||G[k]<-.3)continue;reach[k]=1;st.push(k)}}
  for(const s of sites){let n=0;while(!reach[(s.x*2|0)+(s.z*2|0)*N]&&n++<200){const dx=MID-s.x,dz=MID-s.z,l=Math.hypot(dx,dz);s.x+=dx/l*.5;s.z+=dz/l*.5}}
  for(let t=0;t<4000&&drops.length<24;t++){const x=20+rnd()*160,z=20+rnd()*160;if(!reach[(x*2|0)+(z*2|0)*N]||gA(x,z)<.6||Math.hypot(x-MID,z-MID)<15)continue;
    if(drops.some(m=>Math.hypot(m.x-x,m.z-z)<12))continue;drops.push({x,z,got:false})}
  for(let t=0;t<3000&&buns.length<14;t++){const x=25+rnd()*150,z=25+rnd()*150,g=gA(x,z);if(!reach[(x*2|0)+(z*2|0)*N]||g<.8||g>4||Math.hypot(x-MID,z-MID)<16)continue;
    if(buns.some(m=>Math.hypot(m.x-x,m.z-z)<9))continue;
    const c=[[1,1,1],[1,.8,.88],[.8,.92,1],[1,.95,.7],[.9,.84,1]][buns.length%5];
    buns.push({x,z,hx:x,hz:z,vx:0,vz:0,t:rnd()*3,hop:0,f:false,pal:{W:c,K:[.2,.15,.3],P:[1,.5,.65]}})}
}
function hAt(x,z){
  const fx=x*2,fz=z*2;if(fx<0||fz<0||fx>=N-1||fz>=N-1)return -2.5;
  const i=fx|0,j=fz|0,u=fx-i,v=fz-j,k=i+j*N,a=G[k],b=G[k+1],c=G[k+N],d=G[k+N+1];
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v+O[((fx+.5)|0)+((fz+.5)|0)*N];
}
function gAt(x,z){
  const fx=x*2,fz=z*2;if(fx<0||fz<0||fx>=N-1||fz>=N-1)return -2.5;
  const i=fx|0,j=fz|0,u=fx-i,v=fz-j,k=i+j*N,a=G[k],b=G[k+1],c=G[k+N],d=G[k+N+1];
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
const blocked=(x,z)=>{const fx=x*2+.5|0,fz=z*2+.5|0;if(fx<1||fz<1||fx>N-2||fz>N-2)return true;return B[fx+fz*N]===1||gAt(x,z)<-.35};

/* ---------- state ---------- */
const P={x:MID,z:MID+9,y:BASE,fx:0,fz:1,walk:0,moving:false,up:false,jy:0,jv:0};
const cam={x:MID,y:BASE,z:MID+3,d:3.7};
let state='intro',T=0,introT=0,titleT=0,endT=0,bar=0,barTo=0,reveal=0,colorAmt=0,dusk=0,duskTo=0,festival=false,nDrops=0,stepN=0,fwT=0,cheer=0;
const parts=[],narr=[],trail=[];let narrT=0;
const say=(t,d=3)=>narr.push({t,d});
const say1=(t,d)=>{narr.length=0;narrT=0;say(t,d)};
const hue=h=>{h=((h%1)+1)%1*6;const i=h|0,f=h-i,q=1-f,a=[[1,f,0],[q,1,0],[0,1,f],[0,q,1],[f,0,1],[1,0,q]][i%6];return[.22+.78*a[0],.22+.78*a[1],.22+.78*a[2]]};

/* ---------- audio ---------- */
let AC=null,noiseBuf=null,seaG=null,nextN=0,stepI=0;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;noiseBuf=buf;
  const sr=AC.createBufferSource();sr.buffer=buf;sr.loop=true;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=520;seaG=AC.createGain();seaG.gain.value=.02;sr.connect(fl);fl.connect(seaG);seaG.connect(AC.destination);sr.start();
  nextN=AC.currentTime+.1}catch(_){AC=null}}
function tone(f,d,type,vol,slide,delay){if(!AC)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(_){}}
function noise(d,f,vol,delay){if(!AC)return;try{const t=AC.currentTime+(delay||0),sr=AC.createBufferSource();sr.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);sr.connect(fl);fl.connect(g);g.connect(AC.destination);sr.start(t,Math.random());sr.stop(t+d+.05)}catch(_){}}
const PENT=[262,294,330,392,440,523,587,659,784];
const MEL=[4,-1,5,4,2,-1,4,-1,5,-1,7,5,4,-1,-1,-1,2,-1,4,2,0,-1,2,-1,4,5,4,2,0,-1,-1,-1,5,-1,7,8,7,-1,5,-1,4,-1,5,7,5,-1,-1,-1,2,4,5,-1,4,2,0,-1,2,-1,1,-1,0,-1,-1,-1];
const BAS=[131,98,110,98,175,131,98,131];
function music(){if(!AC||AC.state!=='running')return;if(nextN<AC.currentTime)nextN=AC.currentTime+.05;
  while(nextN<AC.currentTime+.25){const d=nextN-AC.currentTime,m=MEL[stepI%64];
    if(m>=0)tone(PENT[m]*(festival||state==='end'?2:1),.42,'triangle',.032,0,d);
    if(stepI%8===0)tone(BAS[(stepI>>3)%8],1.5,'sine',.05,0,d);
    if(stepI%4===2)tone(BAS[(stepI>>3)%8]*3,.3,'sine',.014,0,d);
    stepI++;nextN+=.25}}
function save(){try{localStorage.setItem('scribbleisle1',JSON.stringify({g:sites.map(s=>s.got),d:drops.map(m=>m.got),b:buns.map(b=>b.f),f:festival}))}catch(_){}}
function load(){try{const d=JSON.parse(localStorage.getItem('scribbleisle1')||'null');if(d&&d.g){d.g.forEach((v,i)=>{if(sites[i])sites[i].got=!!v});
  if(d.d)d.d.forEach((v,i)=>{if(drops[i])drops[i].got=!!v});nDrops=drops.filter(m=>m.got).length;
  if(d.b)d.b.forEach((v,i)=>{if(buns[i]&&v){buns[i].f=true;buns[i].x=P.x+(i%5-2);buns[i].z=P.z+2+(i/5|0);friends.push(buns[i])}});
  festival=!!d.f;if(festival){dusk=duskTo=.6}return d.g.some(v=>v)||nDrops>0||friends.length>0}}catch(_){}return false}
const keys={};let joy=null,joyV={x:0,z:0},wantHop=false,anyTap=false;

/* ---------- sprites: letters are colours, each cell is scribbled in ---------- */
const PPAL={R:[.96,.2,.25],S:[1,.82,.64],K:[.2,.14,.3],Y:[1,.8,.08],B:[.2,.42,.95],W:[1,1,1]};
const PB=["   W   ","  RRR  "," RRRRR "," SKSKS ","  SSS  "," YYYYY ","SYYYYYS"," YYYYY "];
const LEG=[" B   B ","  B  B "," B  B  "];
const PF=LEG.map(l=>PB.concat([l]));
const PK=PF.map(f=>f.map((r,i)=>i===3?" RRRRR ":r));
const PH=["   W   ","  RRR  "," RRRRR ","SSKSKSS","  SSS  "," YYYYY "," YYYYY "," YYYYY ","  B B  "];
const KITE=["  A  "," AWA ","AWAWA"," AWA ","  A  "];
const BUN=[" W W","WWWW","WKWP"],STAR=[" Y ","YWY"," Y "];
let EL=[1,1,1];

/* ---------- camera / projection ---------- */
const TANF=Math.tan(24*Math.PI/180),FL=Math.hypot(14,13),FY=-14/FL,FZ=-13/FL,UY=-FZ,UZ=FY;
let Cx=0,Cy=0,Cz=0,aspect=1,barI=0,pr=1,pg=.955,pb=.86;
function proj(x,y,z){const vx=x-Cx,vy=y-Cy,vz=z-Cz,zc=vy*FY+vz*FZ;if(zc<.5)return null;const yc=vy*UY+vz*UZ;
  return{c:(vx/(zc*TANF*aspect)*.5+.5)*cols,r:(.5-yc/(zc*TANF)*.5)*rows,d:Math.sqrt(vx*vx+vy*vy+vz*vz)}}
function cell(k,r,g,b,m,lv){const q=k*4;px8[q]=r*255;px8[q+1]=g*255;px8[q+2]=b*255;px8[q+3]=255;ik8[q]=r*150;ik8[q+1]=g*135;ik8[q+2]=b*160;MT[k]=m;LV[k]=lv}
function sprite(L,x,y,z,ax,pal,bias,m){
  const p=proj(x,y,z);if(!p)return;const c0=Math.round(p.c)-ax,r0=Math.round(p.r)-L.length+1;
  for(let r=0;r<L.length;r++){const s=L[r],j=r0+r;if(j<barI||j>=rows-barI)continue;
    for(let c=0;c<s.length;c++){const ch=s[c];if(ch===' ')continue;const i=c0+c;if(i<0||i>=cols)continue;const k=i+j*cols;
      if(DEP[k]<p.d-bias)continue;const col=pal[ch];cell(k,col[0]*EL[0],col[1]*EL[1],col[2]*EL[2],m||5,3);SOL[k]=1}}

    if(hit(12.6)){say1('But the wind took all five kites.',2);noise(2.2,600,.12)}
    if(introT>12.4&&introT<15.5&&Math.random()<dt*40){const a=Math.random()*6.28;parts.push({x:MID+Math.cos(a)*3,y:6+Math.random()*8,z:MID+Math.sin(a)*3,vx:Math.cos(a)*16,vy:1,vz:Math.sin(a)*16,life:.9,max:.9,m:1,r:1,g:1,b:1,gr:0})}
    sites.forEach((s,n)=>{const u=sstep(12.4+n*.25,15.4+n*.25,introT),a=n*1.2566+T*1.5;
      s.kx=MID+Math.cos(a)*1.2*(1-u)+(s.x-MID)*u;s.kz=MID+Math.sin(a)*1.2*(1-u)+(s.z-MID)*u;s.ky=(13.2+n*.5)*(1-u)+(s.y+1.7)*u+Math.sin(u*Math.PI)*7});
    if(hit(16.6))say1('Go and get them back!',2.2);
    if(hit(17.8)||hit(18.7)){P.jv=8;tone(330,.18,'sine',.06,660)}
    if(introT<10.6){camTx=MID;camTz=MID+3;camD=3.25;camK=.6;camDK=.12}
    else if(introT<16.2){camTx=MID;camTz=MID+1;camD=1.9;camK=1;camDK=.7}
    else{camTx=P.x;camTz=P.z-1.2;camD=1.05;camK=1.6;camDK=1}
    if(anyTap&&introT>.5)skipIntro();else if(introT>20.4){state='title';titleT=0;narr.length=0;narrT=0}
  }else if(state==='title'){
    titleT+=dt;barTo=rows*.09;camTx=P.x+Math.sin(T*.2)*2;camTz=P.z-3.5;camD=1.45;camK=1;camDK=.6;
    if(anyTap&&titleT>.8)start();
  }else if(state==='play'){
    if(keys.ArrowLeft||keys.KeyA)mvx-=1;if(keys.ArrowRight||keys.KeyD)mvx+=1;if(keys.ArrowUp||keys.KeyW)mvz-=1;if(keys.ArrowDown||keys.KeyS)mvz+=1;
    mvx+=joyV.x;mvz+=joyV.z;const l=Math.hypot(mvx,mvz);if(l>1){mvx/=l;mvz/=l}
    if(wantHop&&P.jy<=0){P.jv=8.5;tone(330,.18,'sine',.06,700);noise(.08,1800,.03)}
  }else if(state==='end'){
    endT+=dt;duskTo=.72;camTx=MID;camTz=MID+1;camD=2.2;camK=1;camDK=.35;
    if(endT>2.5){fwT-=dt;if(fwT<0){fwT=.35+Math.random()*.5;firework()}}
    if(endT>2.5&&endT-dt<=2.5)say1('The festival begins!',3);
    if(Math.random()<dt*2)P.jv=P.jy<=0?7:P.jv;
    if(endT>9&&anyTap){state='play';festival=true;duskTo=.6;barTo=Math.max(2,rows*.07);say1('The isle is yours to wander.',3);save()}
  }
  wantHop=false;anyTap=false;
  P.moving=Math.hypot(mvx,mvz)>.15;
  if(P.moving){
    const wade=gAt(P.x,P.z)<-.05?.6:1,sp=7.4*wade*dt,nx=P.x+mvx*sp,nz=P.z+mvz*sp;
    if(!blocked(nx,P.z))P.x=nx;if(!blocked(P.x,nz))P.z=nz;
    const l=Math.hypot(mvx,mvz);P.fx=mvx/l;P.fz=mvz/l;P.up=mvz<-.45;P.walk+=dt*9;
    if((P.walk/2|0)!==stepN){stepN=P.walk/2|0;
      if(wade<1){noise(.12,1500,.04);burst(P.x,.2,P.z,3,1,[1,1,1],1.6,.5)}
      else{noise(.05,700+Math.random()*300,.03);const g=gAt(P.x,P.z);if(g>.5){const c=FLC[Math.random()*5|0];parts.push({x:P.x-P.fx*.8+(Math.random()-.5),y:g+.15,z:P.z-P.fz*.8+(Math.random()-.5),vx:0,vy:0,vz:0,life:5,max:5,m:6,r:c[0],g:c[1],b:c[2],gr:0})}}}
    if(!trail.length||Math.hypot(trail[0].x-P.x,trail[0].z-P.z)>.8){trail.unshift({x:P.x,z:P.z});if(trail.length>90)trail.pop()}
  }
  P.y=Math.max(0,gAt(P.x,P.z));
  if(P.jv||P.jy>0){P.jy+=P.jv*dt;P.jv-=24*dt;if(P.jy<=0){P.jy=0;P.jv=0;burst(P.x,P.y+.3,P.z,7,6,null,2.4,.7);noise(.07,500,.04);for(const h of friends)h.hop=h.hop||.01,h.jt=.5}}
  if(state==='play'){
    sites.forEach((s,n)=>{
      if(!s.got&&Math.hypot(s.x-P.x,s.z-P.z)<2){s.got=true;burst(s.x,s.y+2,s.z,40,6,null,5,1.4);burst(s.x,s.y+2,s.z,16,5,KC[n],4,1.1);cheer=.8;[523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,'triangle',.08,0,i*.09));
        if(sites.every(q=>q.got))say1('All five! Take them to the lighthouse.',4);save()}
      const tx=s.got?P.x+(n-2)*1.5-P.fx*1.4:s.x,tz=s.got?P.z-2-P.fz*1.2-(n&1):s.z,ty=s.got?P.y+5.4+(n&1)*.9+Math.sin(T*1.7+n)*.35:s.y+1.7+Math.sin(T*2+n)*.3,k=Math.min(1,dt*(s.got?2.5:6));
      s.kx+=(tx-s.kx)*k;s.ky+=(ty-s.ky)*k;s.kz+=(tz-s.kz)*k});
    for(const m of drops)if(!m.got&&Math.abs(m.x-P.x)<1.6&&Math.abs(m.z-P.z)<1.6){m.got=true;nDrops++;burst(m.x,P.y+1,m.z,12,6,[1,.85,.2],3,.7);tone(880,.18,'triangle',.07,1320);save()}
    if(!festival&&sites.every(s=>s.got)&&Math.hypot(P.x-MID,P.z-MID)<9){state='end';endT=0;barTo=rows*.13;narr.length=0;narrT=0;cheer=1;
      tone(131,4,'sine',.07);[262,330,392,523,659,784].forEach((f,i)=>tone(f,2,'triangle',.06,0,.3+i*.25))}
  }else if(state==='title'){sites.forEach((s,n)=>{s.kx=s.x;s.kz=s.z;s.ky=s.y+1.7+Math.sin(T*2+n)*.3})}
  if(state==='end'||festival&&state==='play'&&sites.every(s=>s.got)&&false){}
  if(state==='end')sites.forEach((s,n)=>{const a=T*.8+n*1.2566,k=Math.min(1,dt*1.5);s.kx+=(MID+Math.cos(a)*4.5-s.kx)*k;s.kz+=(MID+Math.sin(a)*4.5-s.kz)*k;s.ky+=(14+Math.sin(T*2+n)*.6-s.ky)*k});
  if(festival&&state==='play'){fwT-=dt;if(fwT<0){fwT=1.5+Math.random()*2.5;firework()}}
  // bunnies
  for(const h of buns){
    if(!h.f){const dx=h.x-P.x,dz=h.z-P.z,d=Math.hypot(dx,dz);
      if(state==='play'&&d<2.8){h.f=true;friends.push(h);burst(h.x,P.y+1.4,h.z,9,6,[1,.4,.6],2.5,.9,-1);tone(700,.12,'sine',.06,1050);tone(1050,.14,'sine',.06,1400,.12);save();continue}
      h.t-=dt;if(h.t<0){h.t=1+Math.random()*4;const a=Math.random()*6.28,bk=Math.hypot(h.x-h.hx,h.z-h.hz)>8;h.vx=bk?(h.hx-h.x)*.4:Math.cos(a)*3;h.vz=bk?(h.hz-h.z)*.4:Math.sin(a)*3}
      const sp=Math.hypot(h.vx,h.vz);if(sp>.3){const nx=h.x+h.vx*dt,nz=h.z+h.vz*dt;if(!blocked(nx,nz)&&gAt(nx,nz)>.1){h.x=nx;h.z=nz}h.hop+=dt*(6+sp);h.vx*=Math.pow(.2,dt);h.vz*=Math.pow(.2,dt)}else h.hop=0;
    }else{const n=friends.indexOf(h);let tx,tz;
      if(state==='end'){const a=n*6.28/Math.max(1,friends.length)-T*.7;tx=MID+Math.cos(a)*6.5;tz=MID+Math.sin(a)*6.5}
      else{const tr=trail[Math.min(trail.length-1,2+n*2)];tx=tr?tr.x:P.x;tz=tr?tr.z:P.z+1.5+n}
      const dx=tx-h.x,dz=tz-h.z,d=Math.hypot(dx,dz);h.jt=(h.jt||0)-dt;
      if(d>45){h.x=P.x;h.z=P.z+1}else if(d>.5){const sp=Math.min(11,d*4);h.x+=dx/d*sp*dt;h.z+=dz/d*sp*dt;h.hop+=dt*(8+sp)}else if(h.jt>0||state==='end')h.hop+=dt*9;else h.hop=0}
  }
  // ambient life
  if(colorAmt>=1&&Math.random()<dt*5){const c=hue(Math.random());parts.push({x:cam.x+(Math.random()-.5)*34*cam.d,y:cam.y+1+Math.random()*3,z:cam.z+(Math.random()-.6)*26*cam.d,vx:(Math.random()-.5)*3,vy:(Math.random()-.4)*1.2,vz:(Math.random()-.5)*3,life:3,max:3,m:6,r:c[0],g:c[1],b:c[2],gr:0,fl:1})}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=p.gr*dt;if(p.fl){p.vx+=(Math.random()-.5)*14*dt;p.vz+=(Math.random()-.5)*14*dt;p.vy+=(Math.random()-.5)*8*dt}}
  if(parts.length>700)parts.splice(0,parts.length-700);
  const k=Math.min(1,dt*camK);cam.x+=(camTx-cam.x)*k;cam.z+=(camTz-cam.z)*k;cam.d+=(camD-cam.d)*Math.min(1,dt*camDK);
  cam.y+=((state==='play'||state==='title'?P.y:BASE)-cam.y)*Math.min(1,dt*2);
  if(seaG)seaG.gain.value=.012+.01*Math.sin(T*.6);
}

/* ---------- input ---------- */
addEventListener('keydown',ev=>{if(ev.repeat)return;audioInit();keys[ev.code]=true;anyTap=true;if(ev.code==='Space'||ev.code==='Enter'||ev.code==='KeyJ')wantHop=true;if(ev.code.startsWith('Arrow')||ev.code==='Space')ev.preventDefault()});
addEventListener('keyup',ev=>{keys[ev.code]=false});
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();audioInit();anyTap=true;
  if(joy){wantHop=true;return}
  joy={id:ev.pointerId,ox:ev.clientX,oy:ev.clientY,t:performance.now(),moved:false,touch:ev.pointerType!=='mouse'};try{cv.setPointerCapture(ev.pointerId)}catch(_){}});
cv.addEventListener('pointermove',ev=>{if(!joy||ev.pointerId!==joy.id)return;const dx=ev.clientX-joy.ox,dy=ev.clientY-joy.oy,l=Math.hypot(dx,dy),R=46;
  if(l>10)joy.moved=true;if(joy.moved){const m=Math.min(1,l/R);joyV.x=dx/(l||1)*m;joyV.z=dy/(l||1)*m;if(l>R*1.6){joy.ox=ev.clientX-dx/l*R*1.6;joy.oy=ev.clientY-dy/l*R*1.6}}});
const up=ev=>{if(!joy||ev.pointerId!==joy.id)return;if(!joy.moved&&performance.now()-joy.t<350)wantHop=true;joy=null;joyV.x=joyV.z=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy=null;joyV.x=joyV.z=0});
cv.addEventListener('contextmenu',ev=>ev.preventDefault());

/* ---------- loop ---------- */
gen();mkAtlas();resize();addEventListener('resize',resize);
let lt=0,slowN=0,avg=16;
function frame(ms){
  const dt=Math.min(.05,(ms-lt)/1000||.016);lt=ms;
  const t0=performance.now();update(dt);render();const el=performance.now()-t0;avg+=(el-avg)*.05;
  if(avg>30){if(++slowN>50&&qscale<1.8){qscale*=1.15;slowN=0;avg=16;resize()}}else slowN=0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game={P,sites,drops,buns,friends,cam,update,render,skipIntro,start,gAt,blocked,get state(){return state},get introT(){return introT},set introT(v){introT=v},get cols(){return cols},get rows(){return rows},
  dbg(o){if('dusk'in o)dusk=duskTo=o.dusk;if('state'in o)state=o.state;if('endT'in o)endT=o.endT}};
})();
</script></body></html>
