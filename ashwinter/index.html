function fkLocal(kf){
  const rot=kf.rot, up=rotF(0,-1,rot), down=[-up[0],-up[1]];
  const neck=[up[0]*CFG.torso,up[1]*CFG.torso], sh=[neck[0]-up[0]*2.4,neck[1]-up[1]*2.4];
  const hd=rotF(0,-1,rot+kf.head), hl=CFG.neck+CFG.headR, head=[neck[0]+hd[0]*hl,neck[1]+hd[1]*hl];
  const legs=[],arms=[];
  for(let i=0;i<2;i++){
    const th=rotF(down[0],down[1],-kf.l[i][0]), knee=[th[0]*CFG.thigh,th[1]*CFG.thigh];        // leg raised forward
    const sd=rotF(th[0],th[1],kf.l[i][1]), ank=[knee[0]+sd[0]*CFG.shin,knee[1]+sd[1]*CFG.shin];  // knee folds back
    legs.push({k:knee,a:ank,pitch:rot-kf.l[i][0]+kf.l[i][1]+kf.toe});                            // boot square to the shin
    const ud=rotF(down[0],down[1],-kf.a[i][0]), el=[sh[0]+ud[0]*CFG.upperArm,sh[1]+ud[1]*CFG.upperArm];
    const fd=rotF(ud[0],ud[1],-kf.a[i][1]), hand=[el[0]+fd[0]*CFG.foreArm,el[1]+fd[1]*CFG.foreArm]; // elbow folds forward
    arms.push({e:el,h:hand});
  }
  return {neck:neck,sh:sh,head:head,headA:rot+kf.head,legs:legs,arms:arms};
}
/* How far below the hips the supporting part sits, so the hips can be set to put it on the ground. */
function supportDrop(fk,sup){
  if(sup==='feet') return Math.max(fk.legs[0].a[1],fk.legs[1].a[1])+CFG.ankleH;
  if(sup==='hands') return Math.max(fk.arms[0].h[1],fk.arms[1].h[1])+1.4;
  if(sup==='back') return Math.max(fk.neck[1],fk.sh[1],4.5)+5.2;
  return 0;
}
function fkToPose(w,fk,hx,hy){
  const F=w.facing, W=p=>({x:hx+F*p[0],y:hy+p[1]});
  const legs=fk.legs.map(L=>{ const k=W(L.k), a=W(L.a); return {kx:k.x,ky:k.y,ax:a.x,ay:a.y,pitch:L.pitch,face:F}; });
  const arms=fk.arms.map(A=>{ const e=W(A.e), h=W(A.h); return {ex:e.x,ey:e.y,hx:h.x,hy:h.y}; });
  const head=W(fk.head); head.a=F*fk.headA;
  return {hip:{x:hx,y:hy},neck:W(fk.neck),sh:W(fk.sh),head:head,legs:legs,arms:arms,face:F,prop:null};
}
/* Room needed for a run of tricks: flat ground across the whole travel. */
function trickExtent(seq){ let x=0,lo=0,hi=0,F=1; for(const n of seq){ const kf=TRICKS[n]; for(const k of kf){ lo=Math.min(lo,x+F*k.x); hi=Math.max(hi,x+F*k.x); } x+=F*kf[kf.length-1].x; if(TURNS[n]) F=-F; } return [lo-8,hi+8]; }
function canTrick(w,world,seq){ const [lo,hi]=trickExtent(seq), g=world.yAt(w.x), F=w.facing;
  for(let k=Math.min(F*lo,F*hi);k<=Math.max(F*lo,F*hi);k+=4) if(Math.abs(world.yAt(clamp(w.x+k,world.x0,world.x1))-g)>0.5) return false;
  return w.x+Math.min(F*lo,F*hi)>world.x0&&w.x+Math.max(F*lo,F*hi)<world.x1; }
function startTricks(w,world,seq){
  if(w.mode!=='walk'||w.jump||w.pick||w.act||w.hp<=0||!canTrick(w,world,seq)) return false;
  if(w.carry) dropCarry(w); w.dancing=w.reading=false; w.stopX=null;
  startFade(w,0.18); w.mode='trick';
  w.trick={seq:seq.slice(),i:-1,cur:{rot:0,x:0,head:0,toe:0,l:[[0,0],[0,0]],a:[[0,0],[0,0]]}};
  nextTrick(w,world); return true;
}
function nextTrick(w,world){
  const T=w.trick; T.i++;
  if(T.i>=T.seq.length){ finishTricks(w,world); return; }
  T.name=T.seq[T.i]; T.kf=TRICKS[T.name]; T.t=0; T.x0=w.x; T.g=world.yAt(w.x); T.seg=-1; T.landed=[];
  T.speed=vary(w,0.06);                                                          // no two tries quite the same tempo
}
function finishTricks(w,world){ const F=w.facing; w.trick=null; standUp(w,world); w.lean=0; w.facing=w.dir=w.kneeF=F;
  if(w.ko){ w.ko=false; w.events.push({type:'fightOver',loser:w}); if(w.foe){ w.foe.foe=null; w.foe.ai=null; } w.foe=null; w.ai=null; } w.events.push({type:'land',x:w.x,y:world.yAt(w.x),speed:30,stone:world.s[world.indexAt(w.x)].w<40}); }
function stepTrick(w,world,dt){
  const T=w.trick, kf=T.kf, F=w.facing; T.t+=dt*T.speed;
  let i=0; while(i<kf.length-2&&T.t>=kf[i+1].t) i++;
  const A=kf[i], B=kf[i+1], u=clamp((T.t-A.t)/(B.t-A.t),0,1);
  if(T.seg!==i){ T.seg=i; T.xs=w.x;
    if(A.sup==='air'&&(i===0||kf[i-1].sup!=='air')){                                 // leaving the ground: one arc to wherever the next grounded frame needs the hips
      let j=i+1; while(j<kf.length-1&&kf[j].sup==='air') j++;
      const y0=w.y-T.g, y1=-supportDrop(fkLocal(kf[j]),kf[j].sup), Tt=(kf[j].t-A.t)/T.speed;
      T.arc={t0:A.t,y0:y0,vy0:(y1-y0-0.5*CFG.gravity*Tt*Tt)/Tt};
      w.events.push({type:'jump',x:w.x,y:T.g}); }
    if(A.sup!=='air'&&i>0&&kf[i-1].sup==='air') w.events.push({type:'land',x:w.x,y:T.g,speed:120,stone:world.s[world.indexAt(w.x)].w<40});
  }
  const cur=lerpKF(A,B,ss(u),T.cur), fk=fkLocal(cur);
  T.x0=clamp(T.x0+w.hitV*dt,world.x0+8,world.x1-8);                              // knocked back: the whole move slides
  const hx=T.x0+F*cur.x; let hy;
  if(A.sup==='air'){ const tt=(T.t-T.arc.t0)/T.speed; hy=T.g+T.arc.y0+T.arc.vy0*tt+0.5*CFG.gravity*tt*tt; }
  else hy=T.g-supportDrop(fk,A.sup);
  w.x=hx; w.y=hy; w.vx=0; w.lean=F*cur.rot; w.label=T.name;
  const P=fkToPose(w,fk,hx,hy); w.last=P;
  if(w.foe) checkHits(w,P,world);
  for(let k=0;k<2;k++){ w.feet[k].ax=P.legs[k].ax; w.feet[k].ay=P.legs[k].ay; w.feet[k].pitch=P.legs[k].pitch; w.feet[k].planted=A.sup==='feet'; }
  if(T.t>=kf[kf.length-1].t){
    if(TURNS[T.name]){ w.facing=w.dir=w.kneeF=-F; }
    if(ROLL_AFTER[T.name]){ w.trick=null; standUp(w,world); w.vx=w.facing*70; if(canRoll(w,world)) startRoll(w,world); return w.last; }
    nextTrick(w,world);
  }
  return P;
}

/* =====================  FIGHTING: strikes that connect, bodies that react  =====================
   A strike keyframe list carries HITS: which limb, when it is live, how hard, and where it lands (high or low).
   While a strike is live, the limb's tip is tested against the opponent's body; on contact the opponent takes
   the hit (knockback, a reaction, health), the striker feels it too (a little recoil), and both freeze for a
   few frames so the impact registers. A block turns a hit into a shove. Enough hits, or a sweep, and he goes down. */
const HITS={
  punch:  [{limb:'hand',i:1,t0:0.06,t1:0.16,power:7,kb:70,high:true},{limb:'hand',i:0,t0:0.32,t1:0.42,power:9,kb:85,high:true}],
  hook:   [{limb:'hand',i:1,t0:0.14,t1:0.26,power:11,kb:95,high:true}],
  upper:  [{limb:'hand',i:1,t0:0.16,t1:0.28,power:12,kb:60,high:true,lift:true}],
  elbow:  [{limb:'hand',i:1,t0:0.12,t1:0.22,power:9,kb:70,high:true}],
  fkick:  [{limb:'foot',i:0,t0:0.26,t1:0.4,power:12,kb:130,high:false}],
  rkick:  [{limb:'foot',i:0,t0:0.26,t1:0.42,power:15,kb:120,high:true}],
  knee:   [{limb:'foot',i:0,t0:0.14,t1:0.26,power:10,kb:60,high:false,knee:true}],
  sweep:  [{limb:'foot',i:1,t0:0.3,t1:0.46,power:6,kb:40,high:false,sweep:true}],
  bkick:  [{limb:'foot',i:0,t0:0.3,t1:0.44,power:16,kb:160,high:false}]
};
const REACTS={hitHigh:1,hitLow:1,hitBlock:1,knockdown:1,getup:1};
function bodyHit(def,px,py,high){                                   // is a point inside the defender's torso or head?
  const P=def.last; if(!P) return false;
  const hx=P.hip.x,hy=P.hip.y,nx=P.neck.x,ny=P.neck.y, dx=nx-hx,dy=ny-hy, L2=dx*dx+dy*dy||1;
  const u=clamp(((px-hx)*dx+(py-hy)*dy)/L2,0,1), cx=hx+dx*u, cy=hy+dy*u;
  if(Math.hypot(px-cx,py-cy)<7.5) return true;
  if(Math.hypot(px-P.head.x,py-P.head.y)<CFG.headR+2.5) return true;
  if(high) return false;
  for(const L of P.legs){ const ddx=L.ax-L.kx, ddy=L.ay-L.ky, l2=ddx*ddx+ddy*ddy||1;   // low blows and sweeps find the legs
    const v=clamp(((px-L.kx)*ddx+(py-L.ky)*ddy)/l2,0,1); if(Math.hypot(px-(L.kx+ddx*v),py-(L.ky+ddy*v))<6) return true; }
  return false;
}
function limbTip(P,h){ return h.limb==='hand'?{x:P.arms[h.i].hx,y:P.arms[h.i].hy}:(h.knee?{x:P.legs[h.i].kx,y:P.legs[h.i].ky}:{x:P.legs[h.i].ax,y:P.legs[h.i].ay}); }
function isBlocking(def,dirFromAtt){ return def.mode==='trick'&&def.trick.name==='block'&&def.facing===-dirFromAtt; }
function landHit(att,def,h,world){
  const dir=att.facing, blocked=isBlocking(def,dir);
  att.freeze=def.freeze=blocked?0.04:0.07;                            // hit-stop: the frame holds for an instant
  att.hitV-=dir*h.kb*(blocked?0.45:0.18);                             // the striker feels it too
  att.events.push({type:blocked?'block':'hit',x:(att.x+def.x)/2,y:def.y-10,power:h.power});
  def.foeSeen=true;
  if(blocked){ def.hitV+=dir*h.kb*0.35; def.guardHits=(def.guardHits||0)+1; if(def.guardHits>=3){ def.guardHits=0; forceTrick(def,world,'hitBlock',dir); } return; }
  def.hp=Math.max(0,def.hp-h.power*vary(att,0.15)); def.hitV+=dir*h.kb;
  if(h.lift) def.hitVy=-90;
  const down = def.hp<=0 || h.sweep || def.mode!=='walk'&&def.mode!=='trick';
  forceTrick(def,world,down?'knockdown':(h.high?'hitHigh':'hitLow'),dir);
}
function forceTrick(w,world,name,dir){                                 // a reaction interrupts whatever he was doing
  if(w.mode==='trick'&&w.trick&&(w.trick.name==='knockdown'||w.trick.name==='getup')&&name!=='knockdown') return;
  if(w.mode==='vine'){ w.vine.held=false; w.vine=null; } if(w.mode==='hang') w.hang=null; if(w.mode==='wall') w.wall=null; if(w.mode==='mantle') w.mantle=null;
  if(w.mode!=='walk'&&w.mode!=='trick'){ if(w.mode==='air'){ w.flip=null; } standUp(w,world); }
  if(w.carry) dropCarry(w); w.dancing=w.reading=false; w.act=null; w.jump=null; w.pick=null; w.stopX=null;
  w.facing=w.dir=w.kneeF=-dir;                                         // he takes it facing the blow
  startFade(w,0.08); w.mode='trick';
  const ko=name==='knockdown'&&w.hp<=0;
  if(ko){ w.ko=true; if(w.foe&&w.foe.ai) w.foe.ai.on=false; if(w.ai) w.ai.on=false; }
  w.trick={seq:name==='knockdown'?(ko?['knockdown','kolie','getup']:['knockdown','getup']):[name],i:-1,cur:{rot:0,x:0,head:0,toe:0,l:[[0,0],[0,0]],a:[[0,0],[0,0]]},react:true};
  nextTrick(w,world);
}
function checkHits(att,P,world){
  const T=att.trick, hs=HITS[T.name], def=att.foe; if(!hs||!def||T.react) return;
  for(let k=0;k<hs.length;k++){ const h=hs[k]; if(T.landed[k]||T.t<h.t0||T.t>h.t1) continue;
    if(def.mode==='trick'&&/knockdown|kolie|getup/.test(def.trick.name)) continue;      // no hitting a man when he's down
    const tip=limbTip(P,h); if(bodyHit(def,tip.x,tip.y,h.high)){ T.landed[k]=true; landHit(att,def,h,world); } }
}

/* ---------- the AI: get in range, pick a shot, guard, keep moving ---------- */
function fightAI(w,world,dt){
  const f=w.foe, ai=w.ai; if(!f||!ai) return {in:0};
  ai.t-=dt;
  const dx=f.x-w.x, d=Math.abs(dx), dir=Math.sign(dx)||w.facing;
  const foeDown=f.mode==='trick'&&f.trick&&(f.trick.name==='knockdown'||f.trick.name==='getup');
  const foeStriking=f.mode==='trick'&&f.trick&&HITS[f.trick.name]&&!f.trick.react;
  const busy=w.mode!=='walk';
  if(!ai.on){ if(w.hp>0&&!ai.bowed&&f.mode==='trick'&&f.trick&&f.trick.name==='kolie'&&f.trick.t>1.2){ ai.bowed=true; return {cmd:'bow'}; } return {in:0}; }   // the winner takes a bow
  if(w.hp<=0) return {in:0};
  if(!busy&&w.facing!==dir&&d>6){ w.facing=w.dir=w.kneeF=dir; startFade(w,0.12); }     // square up
  if(busy) return {in:0};
  if(ai.t>0) return {in:ai.move*dir};
  ai.t=0.12+w.rand()*0.3; ai.move=0;
  if(foeDown){ if(d<40) ai.move=-0.6; return {in:ai.move*dir}; }                        // give him room to get up
  const r=w.rand();
  if(foeStriking&&d<34&&r<ai.guard){ return {cmd:'block'}; }
  if(foeStriking&&d<34&&r<ai.guard+0.15){ ai.move=-1.2; ai.t=0.3; return {in:ai.move*dir}; }   // step out of it
  if(d>36){ ai.move=r<0.15?1.6:0.9; ai.t=0.25; return {in:ai.move*dir}; }
  if(d<19){ ai.move=-0.7; return {in:ai.move*dir}; }
  if(r<ai.aggr){ const pool=d<22?['punch','hook','upper','elbow','knee','sweep']:['fkick','rkick','bkick','punch']; return {cmd:pool[Math.floor(w.rand()*pool.length)]}; }
  if(r<ai.aggr+0.2){ ai.move=(w.rand()<0.5?1:-1)*0.5; ai.t=0.25; }                   // shuffle
  return {in:ai.move*dir};
}
function setFight(a,b,aiA,aiB){
  a.foe=b; b.foe=a; a.hp=b.hp=100; a.hitV=b.hitV=0;
  a.ai=aiA?{on:true,t:0,move:0,aggr:aiA.aggr||0.5,guard:aiA.guard||0.35}:null;
  b.ai=aiB?{on:true,t:0,move:0,aggr:aiB.aggr||0.5,guard:aiB.guard||0.35}:null;
}

/* =====================  POSE PLUMBING  ===================== */
function bone(ax,ay,bx,by,len){ let dx=bx-ax, dy=by-ay, d=Math.hypot(dx,dy); if(d<1e-6){dx=0;dy=1;d=1;} return [ax+dx/d*len,ay+dy/d*len]; }

/* Two-bone limb from (hx,hy) reaching for (ax,ay); sign picks which way the middle joint folds. */
function solve2(hx,hy,ax,ay,l1,l2,sign){
  let dx=ax-hx, dy=ay-hy, d=Math.hypot(dx,dy); if(d<1e-6){dx=0;dy=1;d=1;}
  const dc=clamp(d,Math.abs(l1-l2)+0.01,l1+l2-0.01), ux=dx/d, uy=dy/d;
  const a=(l1*l1-l2*l2+dc*dc)/(2*dc), h=Math.sqrt(Math.max(l1*l1-a*a,0));
  return {kx:hx+ux*a+sign*uy*h, ky:hy+uy*a-sign*ux*h, ax:hx+ux*dc, ay:hy+uy*dc};
}

function poseOf(w,o){
  const sf=clamp(Math.abs(w.vx)/CFG.walkSpeed,0,1), F=w.facing;
  const off=clamp(w.by-w.y,-1.6,1.6), breath=Math.sin(w.breathP)*(0.3+1.2*w.exert)*(1-0.7*sf);   // heavier, faster breathing when he's worked hard
  const hip={x:w.x+w.sway,y:w.y};
  const R=w.airRot, L=w.lean+R;
  const neck={x:hip.x+Math.sin(L)*CFG.torso, y:hip.y-Math.cos(L)*CFG.torso+off-breath};
  const ha=w.lean*0.35+R*0.85+F*(w.headAdd+w.gaze)+0.03*wobble(w,2,w.time*1.3), hl=CFG.neck+CFG.headR;
  const head={x:neck.x+Math.sin(ha)*hl, y:neck.y-Math.cos(ha)*hl, a:ha};
  const tx=(neck.x-hip.x)/CFG.torso, ty=(neck.y-hip.y)/CFG.torso;
  const sh={x:neck.x-tx*2.4, y:neck.y-ty*2.4};
  const legs=[],arms=[];
  for(let i=0;i<2;i++){
    const f=w.feet[i]; const L=solve2(hip.x,hip.y,f.ax,f.ay,CFG.thigh,CFG.shin,w.kneeF); L.pitch=f.pitch; L.face=f.face; legs.push(L);
    const th=w.lean*0.6+R+F*w.arm[i], th2=th+F*w.armB[i];
    const ex=sh.x+Math.sin(th)*CFG.upperArm, ey=sh.y+Math.cos(th)*CFG.upperArm;
    arms.push({ex:ex,ey:ey,hx:ex+Math.sin(th2)*CFG.foreArm,hy:ey+Math.cos(th2)*CFG.foreArm});
  }
  return {hip:hip,neck:neck,head:head,sh:sh,legs:legs,arms:arms,face:F,prop:o?o.prop:null};
}

/* Cross-fade between two poses bone by bone, so limbs swing across instead of stretching. */
function startFade(w,dur){ if(w.last) w.fade={from:w.last,t:0,dur:dur,x0:w.x}; }
function blendPose(A,B,t,dx){
  const L=(a,b)=>a+(b-a)*t;
  const child=(pa,ca,pb,cb,pn)=>{ const ox=L(ca.x-pa.x,cb.x-pb.x), oy=L(ca.y-pa.y,cb.y-pb.y), len=L(Math.hypot(ca.x-pa.x,ca.y-pa.y),Math.hypot(cb.x-pb.x,cb.y-pb.y)), d=Math.hypot(ox,oy)||1e-6;
    return {x:pn.x+ox/d*len,y:pn.y+oy/d*len}; };
  const hip={x:L(A.hip.x+dx,B.hip.x),y:L(A.hip.y,B.hip.y)};
  const neck=child(A.hip,A.neck,B.hip,B.neck,hip), sh=child(A.neck,A.sh,B.neck,B.sh,neck), head=child(A.neck,A.head,B.neck,B.head,neck);
  head.a=L(A.head.a,B.head.a);
  const legs=[],arms=[];
  for(let i=0;i<2;i++){
    const la=A.legs[i], lb=B.legs[i], k=child(A.hip,{x:la.kx,y:la.ky},B.hip,{x:lb.kx,y:lb.ky},hip), a=child({x:la.kx,y:la.ky},{x:la.ax,y:la.ay},{x:lb.kx,y:lb.ky},{x:lb.ax,y:lb.ay},k);
    legs.push({kx:k.x,ky:k.y,ax:a.x,ay:a.y,pitch:L(la.pitch,lb.pitch),face:lb.face});
    const aa=A.arms[i], ab=B.arms[i], e=child(A.sh,{x:aa.ex,y:aa.ey},B.sh,{x:ab.ex,y:ab.ey},sh), h=child({x:aa.ex,y:aa.ey},{x:aa.hx,y:aa.hy},{x:ab.ex,y:ab.ey},{x:ab.hx,y:ab.hy},e);
    arms.push({ex:e.x,ey:e.y,hx:h.x,hy:h.y});
  }
  return {hip:hip,neck:neck,head:head,sh:sh,legs:legs,arms:arms,face:B.face,prop:B.prop};
}

/* =====================  COMMANDS and the one update everything goes through  ===================== */
function command(w,world,name){
  if(w.mode==='roll'||w.mode==='mantle'||w.mode==='trick') return false;
  if(w.pick&&w.pick.phase!=='approach') return false;                   // committed until he's back up
  if(w.pick&&name!=='pick') w.pick=null;                                // anything else calls off the walk over
  if(w.mode==='vine'){ if(name==='jump'){ letGo(w,true); return true; } if(name==='crawl'){ letGo(w,false); return true; }
    if(name==='throw'&&!w.act){ w.act={name:'throw',t:0,done:false}; return true; } return false; }
  if(w.mode==='hang'){ if(name==='jump'||name==='climb'){ startMantle(w,w.hang); return true; }
    if(name==='crawl'||name==='roll'){ w.hang=null; w.grabCd=0.28; toAir(w); return true; } return false; }
  if(w.mode==='wall'){ if(name==='jump'){ const F=w.wall.hi; w.wall=null; w.grabCd=0.3; toAir(w); w.vx=-F*70; w.vy=-CFG.jumpV*0.7; return true; }
    if(name==='crawl'){ w.wall=null; w.grabCd=0.25; toAir(w); return true; } return false; }
  if(w.mode==='crawl'){ if(name==='crawl'||name==='jump'){ standUp(w,world); return true; } return false; }
  if(w.mode==='air'){
    if(name==='jumpEnd'){ if(w.vy<0) w.vy*=CFG.jumpCut; return true; }                   // let go early: a shorter jump
    if(name==='roll'&&!w.flip){ w.flip={th:0}; w.events.push({type:'roll'}); return true; }
    if(name==='throw'&&!w.act){ w.act={name:'throw',t:0,done:false}; return true; }
    if(name==='climb'){ const h=nearestGrip(world,w.x+w.facing*2,w.y-20,w.grabCd); if(h){ grabVine(w,h); return true; } }
    return false; }
  switch(name){
    case 'jump':  if(w.jump) return false; w.jump={t:0}; w.dancing=false; return true;
    case 'jumpEnd': if(w.jump){ w.jump.cut=true; return true; } return false;           // a quick tap is a hop
    case 'roll':  if(w.jump||!canRoll(w,world)) return false; startRoll(w,world); return true;
    case 'crawl': if(w.jump) return false; enterCrawl(w,world); return true;
    case 'throw': if(w.act) return false; w.act={name:'throw',t:0,done:false}; w.dancing=false; return true;
    case 'clap':  if(w.act) return false; if(w.carry) dropCarry(w); w.act={name:'clap',t:0,n:0,max:CFG.variety?3+Math.floor(w.rand()*3):4,f:3.4*vary(w,0.1)}; return true;
    case 'climb': {                                                   // reach for whatever is in front of us
      const e=world.edges.find(q=>q.climb&&Math.abs(w.x-(q.x-q.hi*9))<26&&w.y>q.y+12&&w.y<q.floor);
      if(e){ w.x=e.x-e.hi*9; grabWall(w,e); return true; }
      const h=nearestGrip(world,w.x+w.facing*2,w.y-22,0); if(h){ grabVine(w,h); return true; }
      return false; }
    case 'pick': {
      if(w.pick||w.jump) return false;
      if(w.carry){ const F=w.facing, gx=w.x+F*(CFG.pickReach+3); if(Math.abs(world.yAt(gx)-world.yAt(w.x))>1) return false;
        w.pick={item:w.carry,phase:'reach',t:0,put:true,gx:gx,gy:world.yAt(gx)-w.carry.r}; w.dancing=w.reading=false; return true; }
      const it=nearestItem(w,world); if(!it) return false;
      w.pick={item:it,phase:'approach',t:0,gx:it.x,gy:it.y,sq:vary(w,0.05),hg:vary(w,0.05)}; w.dancing=w.reading=false; w.act=null; return true; }
    case 'read':  if(w.carry) dropCarry(w); w.reading=!w.reading; w.readT=0.6; w.dancing=false; return true;
    case 'routine':    return startTricks(w,world,ROUTINE);
    case 'backflip':   return startTricks(w,world,['backflip']);
    case 'handspring': return startTricks(w,world,['bhs']);
    case 'fhandspring':return startTricks(w,world,['fhs']);
    case 'kick':       w.kickN=(w.kickN||0)+1; return startTricks(w,world,[w.kickN%2?'fkick':'rkick']);
    case 'fkick': case 'rkick': case 'hook': case 'upper': case 'elbow': case 'knee': case 'bkick': case 'sweep': case 'block': case 'dodge': return startTricks(w,world,[name]);
    case 'punch':      return startTricks(w,world,['stance','punch']);
    case 'kipup':      return startTricks(w,world,['kipup']);
    case 'dive':       return startTricks(w,world,['dive']);
    case 'dance': if(w.carry) dropCarry(w); w.dancing=!w.dancing; w.danceT=0; w.reading=false; return true;
  }
  return false;
}

function updateWalker(w,world,input,dt,vert){
  if(w.freeze>0){ w.freeze-=dt; return w.last; }                        // hit-stop
  if(w.ai&&w.ai.on&&w.foe){ const a=fightAI(w,world,dt); if(a.cmd) command(w,world,a.cmd); input=a.in||0; }
  w.hitV*=Math.exp(-6*dt); if(Math.abs(w.hitV)<1) w.hitV=0;
  if(w.foe&&w.foe.mode!=='air'&&(w.mode==='walk'||w.mode==='trick'&&w.trick&&!/knockdown|kolie|getup|bhs|backflip|fhs/.test(w.trick.name))){   // two bodies can't share a spot
    const d=w.foe.x-w.x; if(Math.abs(d)<17&&Math.abs(w.foe.y-w.y)<24){ const push=Math.sign(d||w.facing)*(17-Math.abs(d))*0.5; w.x-=push; if(w.trick) w.trick.x0-=push; } }
  w.time+=dt; w.world=world;
  const work = w.mode==='walk' ? clamp(Math.abs(w.vx)/CFG.walkSpeed,0,1)*(0.3+0.45*w.stair)+(w.dancing?0.55:0)
             : w.mode==='air'||w.mode==='roll' ? 0.7 : w.mode==='crawl' ? 0.45 : 1;   // hanging, climbing and swinging are hard
  w.exert+=(work-w.exert)*(1-Math.exp(-(work>w.exert?0.45:0.08)*dt));
  w.breathP+=dt*(1.6+2.8*w.exert)*(1+0.25*wobble(w,3,w.time*0.25));
  input=Math.abs(input)<0.06?0:clamp(input,-2,2);
  vert=Math.abs(vert||0)<0.3?0:clamp(vert,-1,1); w.vertAmt=Math.abs(vert);
  w.climbHeld=vert<0; w.downHeld=vert>0;
  if(w.mode!=='air') w.grabCd-=dt;
  stepVines(world,dt,w.vine,w.time);
  if(w.mode!=='walk') w.stopX=null;                                    // a rest point only means anything while on his feet
  if(w.mode!=='air'){ const k=Math.exp(-9*dt); w.airRot*=k; w.airLeg*=k; w.airOm=w.airLegV=0; }   // on landing, the last of the spin is absorbed
  let P;
  if(w.mode==='crawl') P=stepCrawl(w,world,input,dt);
  else if(w.mode==='roll') P=stepRoll(w,world,input,dt);
  else if(w.mode==='vine') P=stepVine(w,world,input,dt);
  else if(w.mode==='hang') P=stepHang(w,world,input,dt);
  else if(w.mode==='mantle') P=stepMantle(w,world,dt);
  else if(w.mode==='wall') P=stepWall(w,world,input,dt);
  else if(w.mode==='trick') P=stepTrick(w,world,dt);
  else{ if(w.pick&&w.mode==='walk') input=pickDrive(w,world,input,dt);
    const o=overlay(w,dt); if(w.mode==='air') stepAir(w,world,input,dt,o); else stepWalk(w,world,input,dt,o);
    P = w.flip ? tuckPose(w,w.x,w.y,w.flip.th,w.facing) : poseOf(w,o);
    if(w.mode==='walk'||w.mode==='air') pickArms(w,P,world); }
  if(w.carry&&!(w.mode==='walk'||w.mode==='air')) dropCarry(w);          // needs both hands for this
  if(w.pick) w.label = w.pick.phase==='approach' ? 'going to pick it up' : (w.pick.put?'putting it down':'picking it up');
  else if(w.carry&&w.mode==='walk') w.label+=' (carrying)';
  if(!P) P=w.last;
  if(w.fade){ const f=w.fade; f.t+=dt;
    if(f.t>=f.dur) w.fade=null;
    else{ P=blendPose(f.from,P,ss(f.t/f.dur),w.x-f.x0);
      // limbs swinging across mustn't dip through the floor: slide the joint along the ground at full bone length instead
      const fix=(px,py,o,kx,ky,len,pad)=>{ const fy=world.yAt(o[kx])-pad; if(o[ky]<=fy) return; const dy=fy-py;
        if(Math.abs(dy)<len){ o[kx]=px+(o[kx]>=px?1:-1)*Math.sqrt(len*len-dy*dy); o[ky]=fy; } };
      for(const L of P.legs){ const ox=L.ax-L.kx, oy=L.ay-L.ky; fix(P.hip.x,P.hip.y,L,'kx','ky',CFG.thigh,1.8); L.ax=L.kx+ox; L.ay=L.ky+oy; fix(L.kx,L.ky,L,'ax','ay',CFG.shin,2.2); }
      for(const A of P.arms){ const ox=A.hx-A.ex, oy=A.hy-A.ey; fix(P.sh.x,P.sh.y,A,'ex','ey',CFG.upperArm,1.5); A.hx=A.ex+ox; A.hy=A.ey+oy; fix(A.ex,A.ey,A,'hx','hy',CFG.foreArm,1.4); } } }
  w.last=P;

  // --- thrown stones
  for(let i=w.shots.length-1;i>=0;i--){ const s=w.shots[i];
    if(s.rest||s.held) continue;
    const R=s.r||1.3;
    s.vy+=CFG.gravity*dt; let nx=s.x+s.vx*dt, ny=s.y+s.vy*dt; const g=world.yAt(nx)-R; s.a+=s.vx*dt*0.12;
    if(nx<world.x0-20||nx>world.x1+20){ s.vx*=-0.3; nx=s.x; }
    if(ny>g){ if(s.y>g+R+0.2){ s.vx*=-0.3; nx=s.x; ny=Math.min(ny,world.yAt(nx)-R); }            // struck a riser
      else{ ny=g; if(Math.abs(s.vy)>40) w.events.push({type:'thud',speed:Math.abs(s.vy)}); s.vy*=-0.36; s.vx*=0.55; if(Math.abs(s.vy)<22){ s.vy=0; if(Math.abs(s.vx)<8) s.rest=true; } } }
    s.x=nx; s.y=ny; }

  // --- scarf: a short rope pinned behind the neck
  const sc=w.scarf, F=w.facing;
  sc[0].x=P.neck.x-(P.neck.y<P.hip.y-8?F*2.6:0); sc[0].y=P.neck.y+0.6;
  for(let i=1;i<sc.length;i++){ const p=sc[i], vx=(p.x-p.ox)*0.975, vy=(p.y-p.oy)*0.975; p.ox=p.x; p.oy=p.y;
    p.x+=vx+(-F*60-w.vx*3+Math.sin(w.time*5.3+i*1.3)*70)*dt*dt; p.y+=vy+520*dt*dt; }
  for(let k=0;k<3;k++) for(let i=1;i<sc.length;i++){ const a2=sc[i-1], b=sc[i]; let dx=b.x-a2.x, dy=b.y-a2.y; const d=Math.hypot(dx,dy)||1e-6, e=(d-2.6)/d; b.x-=dx*e; b.y-=dy*e; }
  return P;
}

/* =====================  THE DEMO REEL  =====================
   Every move, played at real speed. Each clip starts a fresh character, plays his lead-up out of sight
   ("pre", simulated seconds), then shows the part worth seeing ("show", seconds on screen).
   c: commands at simulated times; go: the stick (in, up), an optional caption for the moment (cap),
   and anything that has to wait for him to get somewhere. */
const DEMO_SPEED=1;
function demoScenes(world){
  const M=world.marks, C=(h,n)=>command(h,world,n);
  const pace=t=>t<1.3?{in:0.45,cap:'Stroll'}:t<2.3?{in:1,cap:'Walk'}:t<3.2?{in:1.5,cap:'Jog'}:t<4.2?{in:2,cap:'Run'}:{in:0,cap:'Stop from a run'};
  return [
    {n:'Stroll',                     x:1945, pre:0.4,  show:5.0, go:t=>pace(t)},
    {n:'Walk, turn round, stop',     x:2020, pre:0.5,  show:1.9, go:t=>({in:t<1.1?1:(t<1.8?-1:0),cap:t<1.1?'Walk':(t<1.8?'Turn round':'Stop')})},
    {n:'Up the stairs',              x:215,  pre:0.9,  show:1.2, go:()=>({in:1})},
    {n:'Running up the stairs',      x:215,  pre:0.6,  show:1.0, go:()=>({in:2})},
    {n:'Down the stairs',            x:690,  pre:0.7,  show:1.2, go:()=>({in:1})},
    {n:'Standing about',             x:2050, pre:2.6,  show:1.4},
    {n:'Hop, then a full jump',      x:2050, pre:0.05, show:1.5, c:[[0.06,'jump'],[0.1,'jumpEnd'],[0.72,'jump']],
       go:t=>({cap:t<0.6?'Hop (tap)':'Full jump (hold)'})},
    {n:'Running leap',               x:1960, pre:0.9,  show:1.1, c:[[1.0,'jump']], go:()=>({in:2})},
    {n:'Crawl',                      x:2000, pre:0.4,  show:1.3, c:[[0.02,'crawl']], go:t=>({in:t>0.35?1:0})},
    {n:'Tumble roll',                x:2000, pre:0.4,  show:1.2, c:[[0.55,'roll']], go:()=>({in:1.3})},
    {n:'Pick up a stone',            x:2025, pre:0.05, show:3.3, c:[[0.02,'pick']], go:(t,h,m)=>{
       if(h.carry&&!h.pick){ if(m.t0==null) m.t0=t; if(t-m.t0<0.9) return {in:1,cap:'Carry it'};
         if(!m.put){ m.put=1; C(h,'pick'); } }
       return {cap:m.put?'Set it down':(h.pick&&h.pick.phase==='approach'?'Go to it':'Pick up a stone')}; }},
    {n:'Pick up an apple, throw it', x:2130, pre:0.05, show:2.2, c:[[0.02,'pick']], go:(t,h,m)=>{
       if(h.carry&&!h.pick&&!m.thrown){ m.thrown=1; C(h,'throw'); } return {}; }},
    {n:'Reading on the move',        x:2000, pre:0.7,  show:1.1, c:[[0.02,'read']], go:t=>({in:t>0.3?1:0})},
    {n:'Clap',                       x:2050, pre:0.05, show:1.15, c:[[0.06,'clap']]},
    {n:'Dance',                      x:2050, pre:0.4,  show:1.3, c:[[0.02,'dance']]},
    {n:'Air flip',                   x:2000, pre:0.55, show:1.2, c:[[0.62,'jump'],[0.76,'roll']], go:()=>({in:2})},
    {n:'Catch a ledge, hang, pull up', x:2340, pre:0.62, show:1.8, go:(t,h)=>{
       if(h.mode==='walk'&&h.x>2362&&h.y>-60&&Math.abs(h.vx)<3&&t>0.3) C(h,'jump');
       if(h.mode==='hang') return {in:h.limbT>0.45?1:0};
       return {in:h.y<-84?0:1.4}; }},
    {n:'Vine to vine',               x:2560, pre:2.3,  show:2.2, go:(t,h)=>{
       if(h.mode==='walk'&&h.x>M.ravine+8&&h.x<M.ravine+22) C(h,'jump');
       if(h.mode==='vine'&&h.vine.th*h.facing>0.45&&h.vine.om*h.facing>0.85) C(h,'jump');
       return {in:1}; }},
    {n:'Fall, roll out',             x:2400, pre:0.45, show:1.2, go:t=>({in:t<1.1?-1.5:0})},
    {n:'Climb the ivy',              x:2945, pre:0.2,  show:1.4, c:[[0.02,'climb']], go:()=>({up:-1})},
    {n:'Shinny up a vine',           x:3292, pre:0.3,  show:1.1, c:[[0.02,'climb']], go:t=>({up:t>0.1?-1:0})},
    {n:'Gymnastics routine',         x:2000, pre:0.02, show:14.6, c:[[0.02,'routine']], go:(t,h)=>({cap:TRICK_NAMES[h.label]||'Gymnastics routine'})},
    {n:'Sparring match',             x:2040, pre:0.02, show:75, fight:true, go:(t,h)=>{ const f=h.foe, ko=h.hp<=0?'Red wins':(f&&f.hp<=0?'Blue wins':null); return {cap:ko||(t<1?'Sparring: Blue v Red':(TRICK_NAMES[h.label]||'Blue: '+h.label)), done:!!ko&&h.mode==='walk'&&(!f||f.mode==='walk')}; }}
  ];
}
/* One simulated tick of a demo clip: fires due commands and returns the stick. */
function demoTick(d,h){
  const sc=d.sc, t=d.st;
  while(sc.c&&d.ci<sc.c.length&&t>=sc.c[d.ci][0]) command(h,d.world,sc.c[d.ci++][1]);
  const a=(sc.go&&sc.go(t,h,d.mem))||{}; d.st+=1/120; d.cap=a.cap||sc.n; if(a.done) d.done=true; return a;
}

root.WalkEngine={setFight:setFight,HITS:HITS,TRICK_NAMES:TRICK_NAMES,TRICKS:TRICKS,ROUTINE:ROUTINE,demoScenes:demoScenes,demoTick:demoTick,DEMO_SPEED:DEMO_SPEED,resetWorld:resetWorld,CFG:CFG,LEG:LEG,buildWorld:buildWorld,createWalker:createWalker,updateWalker:updateWalker,command:command,poseOf:poseOf,footRange:footRange};
})(typeof globalThis!=='undefined'?globalThis:this);

// ===== demo reel: a scripted tour through every part of the game, run on the real systems =====
const DEMO = { on: false, i: -1, t: 0, scene: null, cap: '', keep: null };
const look = (x, y, z) => { cam.tx = x; cam.ty = y; cam.tz = z; cam.z = lerp(cam.z, z, .06); cam.x = lerp(cam.x, x, .08); cam.y = lerp(cam.y, y, .08); clampCam(); };
const follow = (a, z, dy = -40) => { if (a) look(a.x, (a.y != null ? a.y : G.world.fy2y(a.fy)) + dy, z); };
const SCENES = [
  { cap: 'Day in the shelter: tap a face, then a spot — they search, dig and cook', dur: 9,

    tick(t) { const d = G.survivors[0]; follow(d, 1.7, -30); } },
  { cap: 'Double-tap to run — fast, but everyone hears it', dur: 5,

    tick(t) { follow(G.survivors[2], 1.5, -30); } },
  { cap: 'Workbench: scrap and parts become a stove, beds, a radio, barricades', dur: 7,
    setup() { Object.assign(G.inv, { scrap: 9, parts: 4, wood: 10, cloth: 4 }); const n = G.survivors[1]; n.task = null; const b = G.world.spotById('bench'); n.path = G.world.path(n.x, n.f, b.x, b.f); n.task = { spot: b, kind: 'craft', recipe: RECIPES[0], t: 0, dur: 4 }; G.sel = 1; },
    tick(t) { if (t > 4.5) G.built.stove = true; follow(G.survivors[1], 1.4, -40); } },
  { cap: 'Nightfall: who goes out, who stands guard, who sleeps', dur: 4,
    setup() { G.hour = 20; G.phase = 'plan'; G.plan = { Dale: 'scav', Noor: 'guard', Teo: 'sleep' }; G.planLoc = LOCATIONS[0]; UI.modal = { kind: 'plan' }; look(700, G.world.fy2y(1) - 60, .9); },
    tick() {} },
  { cap: 'The street: climb the wrecks, outrun the dead, be home by five', dur: 11,
    setup() { UI.modal = null; beginNight(); IN.ptrs.set(99, { x: 150, y: H - 60 }); const z = TR.zombies[0]; if (z) { z.x = TR.x - 160; z.state = 'chase'; z.alert = 2; z.wk = null; } },

    tick(t) { const p = SC.player; if (UI.modal && UI.modal.kind === 'loot') { if (t > 5.5) { UI.modal = null; } } if (t > 5.6 && !p.task && !p.path && DEMO.keep[1] && !DEMO.k2) { DEMO.k2 = true; scUseSpot(DEMO.keep[1]); } } },

    tick(t) { const p = SC.player, z = DEMO.keep; if (z && z.alive && Math.abs(z.x - p.x) < 70 && p.attackT <= 0) { p.facing = z.x < p.x ? -1 : 1; scAttack(); } } },

];
function demoStart() { DEMO.on = true; DEMO.i = -1; DEMO.t = 0; DEMO.k2 = false; demoNext(); }
function demoNext() {
  DEMO.i++; DEMO.t = 0; DEMO.k2 = false; if (DEMO.i >= SCENES.length) { demoStop(); return; }
  DEMO.scene = SCENES[DEMO.i]; DEMO.cap = DEMO.scene.cap; try { DEMO.scene.setup(); } catch (e) { console.warn('demo', e); demoNext(); }
}
function demoStop() { DEMO.on = false; DEMO.scene = null; IN.ptrs.delete(99); UI.modal = null; cam.lock = false; TR.active = false; SC.active = false; G.phase = 'title'; }
function demoTick(dt) { if (!DEMO.on || !DEMO.scene) return; DEMO.t += dt; try { DEMO.scene.tick(DEMO.t); } catch (e) { console.warn('demo', e); } if (DEMO.t >= DEMO.scene.dur) demoNext(); }
function drawDemoBar() {
  if (!DEMO.on) return; const h = 54; ctx.fillStyle = 'rgba(10,10,12,.78)'; ctx.fillRect(0, H - h, W, h);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, H - h, W, 2); ctx.fillStyle = GOLD; ctx.fillRect(0, H - h, W * ((DEMO.i + Math.min(1, DEMO.t / DEMO.scene.dur)) / SCENES.length), 2);

  textButton(W - 104, H - h / 2 - 17, 90, 34, 'EXIT', () => demoStop(), {});

const AUDIO = {
  ac: null, master: null, on: true, ambient: null,
  unlock() { if (HEADLESS || this.ac) return; try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ac.createGain(); this.master.gain.value = .5; this.master.connect(this.ac.destination); this.startAmbient(); } catch (e) { } },
  startAmbient() {
    const ac = this.ac; const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = buf.getChannelData(0); let l = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; l = (l + .02 * w) / 1.02; d[i] = l * 3.5; }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
    const g = ac.createGain(); g.gain.value = .35; src.connect(f); f.connect(g); g.connect(this.master); src.start();

  },

    if (!this.ac || !this.on) return; const ac = this.ac; const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);

      case 'done': this.tone(520, .12, 'sine', .15, 260); setTimeout(() => this.tone(780, .15, 'sine', .12), 90); break;
      case 'dig': this.noise(.12, .25, 500); break;

      case 'hurt': this.tone(200, .25, 'square', .15, -120); this.noise(.15, .3, 900); break;
      case 'shot': this.noise(.25, .6, 1800); this.tone(90, .2, 'square', .3, -60); break;
      case 'open': this.noise(.2, .15, 700); break;

    if (f < nF - 1) { const mid = rooms.filter(o => o.f === f && !o.locked); const rm = mid[Math.floor(r() * mid.length)]; const rw = rm.x1 - rm.x0, sx = rw > 2 * STAIR_W + 60 ? rm.x0 + STAIR_W + 30 + r() * (rw - 2 * STAIR_W - 60) : (rm.x0 + rm.x1) / 2; stairs.push({ x: sx, a: f, b: f + 1 }); }

// ===== game state, day loop, night resolution, save =====

const SAVE_KEY = 'ashwinter2';

function newGame() {
  G = { phase: 'day', day: 1, hour: 6, inv: { wood: 2, water: 2, canned: 1 }, survivors: SURVIVOR_TEMPLATES.slice(0, 3).map((t, i) => makeSurvivor(t, i)), world: makeShelter(), built: {}, flags: {}, collectorWater: 0, sel: 0, plan: {}, planLoc: null, report: [], event: null, msg: '', msgT: 0 };
  UI.modal = null; UI.ff = false; initFx(); homeCam(); homeMsg('Tap a face, then an icon', 'search'); save();
}
function homeCam() { const w = G.world; fitCam({ x0: w.x0 - 120, x1: w.x1 + 120, y0: w.fy2y(2) - FLOOR_H - 170, y1: w.groundY + 240 }); cam.y = cam.ty = cam.y + 50 / cam.z; clampCam(); }
function save() {
  if (DEMO.on) return;
  if (HEADLESS) return;

}

// ---------- day: input ----------

// ---------- day: update ----------
function updateHome(dt) {

  const speed = UI.ff ? 3 : 1; const gdt = dt * speed;

    if (s.sayT > 0) s.sayT -= dt; if (s.eatT > 0) s.eatT -= dt;
    // needs drift
    s.hunger = clamp(s.hunger - gdt * 30 / DAY_LEN, 0, 100);
    if (s.hunger <= 0) s.health = clamp(s.health - gdt * 8 / DAY_LEN, 0, 100);
    if (s.infected) s.health = clamp(s.health - gdt * 6 / DAY_LEN, 0, 100);
    if (s.hunger < 30 || s.health < 40) s.morale = clamp(s.morale - gdt * 10 / DAY_LEN, 0, 100);
    if (s.health <= 0) { s.alive = false; s.pose = 'dead'; homeMsg(s.name + ' died', 'dead', RED); AUDIO.sfx('bad'); for (const o of G.survivors) o.morale = clamp(o.morale - 20, 0, 100); continue; }

    tk.t += gdt * (tk.kind === 'dig' || tk.kind === 'board' || tk.kind === 'repair' ? (s.trait === 'handy' ? 1.4 : 1) : 1);
    switch (tk.kind) {

      case 'door': s.pose = G.inv.crowbar ? 'hammer' : 'cook'; break;
      case 'bed': s.pose = 'sleep'; s.fatigue = clamp(s.fatigue + gdt * 1.6, 0, 100); break;
      case 'radio': s.pose = 'cook'; break;
      case 'collector': s.pose = 'search'; break;
      case 'stove': s.pose = 'cook'; tk.spot.active = true; break;
      case 'craft': s.pose = 'hammer'; if (Math.floor(tk.t * 2.3) !== Math.floor((tk.t - gdt) * 2.3)) AUDIO.sfx('hammer'); break;
      case 'board': case 'repair': s.pose = 'hammer'; s.facing = -1; if (Math.floor(tk.t * 2.3) !== Math.floor((tk.t - gdt) * 2.3)) AUDIO.sfx('hammer'); break;
      case 'bench': s.pose = 'idle'; if (!UI.modal) { UI.modal = { kind: 'craft', who: G.survivors.indexOf(s) }; s.task = null; } break;
      case 'exit': s.task = null; break;
    }

      const sp = tk.spot;
      switch (tk.kind) {
        case 'search': case 'dig': giveLoot(sp, s); sp.left--; if (sp.left <= 0) { s.task = null; } else tk.t = 0; break;
        case 'door': sp.room.open = true; s.task = null; AUDIO.sfx('done'); if (!G.inv.crowbar && Math.random() < .3) { G.inv.lockpick--; homeMsg('lockpick snapped', 'lockpick', RED); } break;
        case 'bed': s.task = null; s.morale = clamp(s.morale + 5, 0, 100); break;
        case 'radio': s.task = null; G.flags.radioToday = true; for (const o of G.survivors) if (o.alive) o.morale = clamp(o.morale + 10, 0, 100); s.say = 'heart'; s.sayT = 2; if (!G.flags.heardRadio && G.day >= 2) { G.flags.heardRadio = true; homeMsg('Convoy at the airport · day 20', 'radio', GOLD); } break;
        case 'collector': { const n = G.collectorWater; G.collectorWater = 0; G.inv.water = (G.inv.water || 0) + n; floatIcon(s.x, w.fy2y(s.fy) - 60, 'water', n); s.task = null; AUDIO.sfx('pick'); break; }
        case 'stove': sp.active = false; G.inv.meal = (G.inv.meal || 0) + COOK.give.meal; floatIcon(s.x, w.fy2y(s.fy) - 60, 'meal', 2); s.task = null; AUDIO.sfx('done'); break;
        case 'craft': { const rc = tk.recipe; if (rc.build) { G.built[rc.id] = true; homeMsg(ITEMS[rc.give] ? '' : rc.id + ' built', rc.icon, GOLD); } else { G.inv[rc.give] = (G.inv[rc.give] || 0) + 1; floatIcon(s.x, w.fy2y(s.fy) - 60, rc.give, 1); } s.task = null; AUDIO.sfx('done'); break; }
        case 'board': tk.bar.level++; tk.bar.hp = tk.bar.level * 30; s.task = null; AUDIO.sfx('done'); break;
        case 'repair': tk.bar.hp = tk.bar.level * 30; s.task = null; AUDIO.sfx('done'); break;
      }
    }
  }

// ---------- night ----------

  else { resolveNight(null); }
}

  const r = TR.result; const p = TR.player; const w = G.world; cam.lock = false; TR.active = false; SC.active = false;
  UI.modal = null; p.hasPack = false; p.visible = true; p.hidden = false; p.task = null; p.path = null; p.x = 140; p.fy = 1; p.f = 1;
  if (r.died) { p.alive = false; p.health = 0; }

function resolveNight(scav) {

  for (const s of guards) s.fatigue = clamp(s.fatigue - 15, 0, 100);
  const scavS = alive.find(s => G.plan[s.name] === 'scav'); if (scavS) scavS.fatigue = clamp(scavS.fatigue - 25, 0, 100);
  for (const s of alive) { s.hunger = clamp(s.hunger - 18, 0, 100); if (s.hunger <= 0) { s.health = clamp(s.health - 15, 0, 100); line('hungry', s.name + ' is starving', RED); } if (s.infected) { s.health = clamp(s.health - 16, 0, 100); line('infected', s.name + ': the bite is getting worse', GREEN); } if (s.fatigue <= 0) { s.health = clamp(s.health - 5, 0, 100); } }

    const def = guards.reduce((a, s) => a + (G.inv.pistol && G.inv.ammo >= 2 ? 3 : G.inv.bat ? 2 : G.inv.knife ? 2 : 1) * (s.trait === 'strong' ? 1.5 : 1), 0) + (G.built.trap ? 1 : 0);

    let left = strength - kills;

    }

}
function bname(b) { return b.id === 'frontdoor' ? 'Front door' : b.id === 'garagedoor' ? 'Garage door' : 'A window'; }

// ---------- main loop ----------
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastT) / 1000 || 0); lastT = now;
  UI.hits = [];
  if (DEMO.on) demoTick(dt);
  switch (G.phase) {
    case 'title': _T += dt; drawTitle(); break;
    case 'day': case 'plan': case 'dawn': case 'event': case 'win': case 'lose': {
      if (G.phase === 'day' && !UI.modal) updateHome(dt); else _T += dt;
      const hour = G.phase === 'plan' ? 20 : G.phase === 'dawn' || G.phase === 'event' ? 6.5 : G.hour;
      drawScene(G.world, hour, G.survivors, { t: _T, dt, lights: G.phase === 'plan' ? homeLights() : (G.hour > 17 ? homeLights() : []) });
      if (G.phase === 'day' || G.phase === 'plan') drawHomeHud(dt);
      if (UI.modal) { switch (UI.modal.kind) { case 'plan': drawPlan(); break; case 'map': drawMap(); break; case 'dawn': drawDawn(); break; case 'event': drawEvent(); break; case 'craft': drawCraft(); break; } }
      if (G.phase === 'win') drawEnd(true); if (G.phase === 'lose') drawEnd(false);
      break;
    }
    case 'travel': {

      drawStreet(dt); drawTravelHud(dt);
      if (UI.modal) { switch (UI.modal.kind) { case 'scavEnd': drawScavEnd(); break; case 'inv': drawScavInv(); break; } }
      break;
    }
    case 'scav': {
      if (!UI.modal) scUpdate(dt); else _T += dt;
      const actors = [SC.player, ...SC.zombies]; drawScene(SC.world, Math.min(23.5, nightHour()), actors, { t: _T, dt, lights: SC.lights });
      drawScavHud(dt);
      if (UI.modal) { switch (UI.modal.kind) { case 'loot': drawLoot(); break; case 'leave': drawLeave(); break; case 'scavEnd': drawScavEnd(); break; case 'inv': drawScavInv(); break; } }
      break;
    }
  }
  drawDemoBar();
  handleTaps();
  // orientation hint
  if (H > W && G.phase !== 'title') { ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(W / 2 - 110, H - 40, 220, 30, 8); ctx.fill(); txt('rotate your phone ↻', W / 2, H - 25, 14, INK); }
}

  requestAnimationFrame(frame);
