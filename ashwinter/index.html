<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101114">
<title>ASHWINTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#101114;overflow:hidden;height:100%;width:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---- 00_core.js ----
'use strict';
// ===== ASHWINTER core =====
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const ease = t => t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const HEADLESS = typeof document === 'undefined';
let W = 960, H = 540, DPR = 1, canvas = null, ctx = null;

const cam = { x: 700, y: 300, z: 0.8, tx: 700, ty: 300, tz: 0.8, minZ: 0.45, maxZ: 1.8, bounds: { x0: 0, x1: 1500, y0: -300, y1: 600 } };
const w2sx = x => (x - cam.x) * cam.z + W / 2;
const w2sy = y => (y - cam.y) * cam.z + H / 2;
const s2wx = x => (x - W / 2) / cam.z + cam.x;
const s2wy = y => (y - H / 2) / cam.z + cam.y;

function resize() {
  if (HEADLESS) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ---- cached textures ----
const TEX = {};
function noiseTex(name, w, h, fn) {
  if (TEX[name]) return TEX[name];
  if (HEADLESS) return null;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); const img = g.createImageData(w, h); const d = img.data;
  const r = mulberry(name.length * 977 + 13);
  for (let i = 0; i < w * h; i++) { const [cr, cg, cb, ca] = fn(r, (i % w) / w, Math.floor(i / w) / h); d[i * 4] = cr; d[i * 4 + 1] = cg; d[i * 4 + 2] = cb; d[i * 4 + 3] = ca; }
  g.putImageData(img, 0, 0); TEX[name] = c; return c;
}
function grainPattern() {
  const c = noiseTex('grain', 128, 128, r => { const v = 128 + (r() - .5) * 90; return [v, v, v, 255]; });
  if (!TEX._gp) TEX._gp = c ? ctx.createPattern(c, 'repeat') : '#777'; return TEX._gp;
}
function plasterPattern() {
  const c = noiseTex('plaster', 160, 160, r => { const v = (r() * .6 + r() * .4 - .5) * 36; return [0, 0, 0, Math.abs(v) + 6]; });
  if (!TEX._pp) TEX._pp = c ? ctx.createPattern(c, 'repeat') : 'rgba(0,0,0,0.1)'; return TEX._pp;
}

// ---- drawing helpers ----
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function txt(s, x, y, size, color, align = 'center', weight = '600', font = 'Oswald, Impact, sans-serif') {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function shade(c, k) { // darken/lighten hex color
  const n = parseInt(c.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  r = clamp(Math.round(r * k), 0, 255); g = clamp(Math.round(g * k), 0, 255); b = clamp(Math.round(b * k), 0, 255);
  return `rgb(${r},${g},${b})`;
}
function rgba(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }

// ---- input ----
const IN = { taps: [], downs: [], ptrs: new Map(), dragging: false, pinchD: 0, downT: 0, downX: 0, downY: 0, moved: 0, lastTapT: 0 };
function initInput() {
  if (HEADLESS) return;
  const el = canvas;
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    IN.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
    IN.downs.push({ x: e.clientX, y: e.clientY });
    if (IN.ptrs.size === 1) { IN.downT = performance.now(); IN.downX = e.clientX; IN.downY = e.clientY; IN.moved = 0; IN.dragging = false; }
    if (IN.ptrs.size === 2) { const [a, b] = [...IN.ptrs.values()]; IN.pinchD = dist(a.x, a.y, b.x, b.y); }
    AUDIO.unlock();
  });
  el.addEventListener('pointermove', e => {
    const p = IN.ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    IN.moved += Math.abs(dx) + Math.abs(dy);
    if (IN.ptrs.size === 1) {
      if (IN.moved > 8 && !UI.modal && !cam.lock) { IN.dragging = true; cam.tx -= dx / cam.z; cam.x = cam.tx; cam.ty -= dy / cam.z; cam.y = cam.ty; clampCam(); }
    } else if (IN.ptrs.size === 2) {
      const [a, b] = [...IN.ptrs.values()]; const d = dist(a.x, a.y, b.x, b.y);
      if (IN.pinchD > 0 && !UI.modal && !cam.lock) { const k = d / IN.pinchD; zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, cam.z * k); }
      IN.pinchD = d; IN.dragging = true;
    }
  });
  const up = e => {
    const p = IN.ptrs.get(e.pointerId); IN.ptrs.delete(e.pointerId); if (!p) return;
    if (IN.ptrs.size === 0 && !IN.dragging && IN.moved < 12 && performance.now() - IN.downT < 500) IN.taps.push({ x: e.clientX, y: e.clientY });
    if (IN.ptrs.size === 0) IN.dragging = false;
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e => { e.preventDefault(); if (!UI.modal) zoomAt(e.clientX, e.clientY, cam.z * (e.deltaY < 0 ? 1.1 : 0.9)); }, { passive: false });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') UI.escape(); });
}
function zoomAt(sx, sy, nz) {
  nz = clamp(nz, cam.minZ, cam.maxZ); const wx = s2wx(sx), wy = s2wy(sy);
  cam.z = nz; cam.tz = nz;
  cam.x = wx - (sx - W / 2) / cam.z; cam.y = wy - (sy - H / 2) / cam.z; cam.tx = cam.x; cam.ty = cam.y; clampCam();
}
function clampCam() {
  const b = cam.bounds; const hw = W / 2 / cam.z, hh = H / 2 / cam.z;
  const cx0 = Math.min(b.x0 + hw, (b.x0 + b.x1) / 2), cx1 = Math.max(b.x1 - hw, (b.x0 + b.x1) / 2);
  const cy0 = Math.min(b.y0 + hh, (b.y0 + b.y1) / 2), cy1 = Math.max(b.y1 - hh, (b.y0 + b.y1) / 2);
  cam.x = clamp(cam.x, cx0, cx1); cam.y = clamp(cam.y, cy0, cy1); cam.tx = cam.x; cam.ty = cam.y;
}
function fitCam(b, pad = 40) {
  cam.bounds = b; const z = clamp(Math.min(W / (b.x1 - b.x0 + pad * 2), H / (b.y1 - b.y0 + pad * 2)), cam.minZ, cam.maxZ);
  cam.z = cam.tz = Math.max(z, cam.minZ); cam.x = cam.tx = (b.x0 + b.x1) / 2; cam.y = cam.ty = (b.y0 + b.y1) / 2; clampCam();
}

// ---- audio (procedural, tiny) ----
const AUDIO = {
  ac: null, master: null, on: true, ambient: null,
  unlock() { if (HEADLESS || this.ac) return; try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ac.createGain(); this.master.gain.value = .5; this.master.connect(this.ac.destination); this.startAmbient(); } catch (e) { } },
  startAmbient() {
    const ac = this.ac; const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = buf.getChannelData(0); let l = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; l = (l + .02 * w) / 1.02; d[i] = l * 3.5; }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
    const g = ac.createGain(); g.gain.value = .35; src.connect(f); f.connect(g); g.connect(this.master); src.start();
    this.ambient = g;
    const lfo = ac.createOscillator(); lfo.frequency.value = .07; const lg = ac.createGain(); lg.gain.value = 180; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  },
  tone(freq, dur, type = 'sine', vol = .2, slide = 0) {
    if (!this.ac || !this.on) return; const ac = this.ac, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur); o.connect(g); g.connect(this.master); o.start(); o.stop(ac.currentTime + dur);
  },
  noise(dur, vol = .3, freq = 1200) {
    if (!this.ac || !this.on) return; const ac = this.ac; const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; const g = ac.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(this.master); s.start();
  },
  sfx(name) {
    switch (name) {
      case 'tap': this.tone(620, .05, 'triangle', .05); break;
      case 'pick': this.tone(880, .09, 'triangle', .12, 300); break;
      case 'done': this.tone(520, .12, 'sine', .15, 260); setTimeout(() => this.tone(780, .15, 'sine', .12), 90); break;
      case 'dig': this.noise(.12, .25, 500); break;
      case 'hammer': this.noise(.05, .35, 2500); this.tone(180, .06, 'square', .08); break;
      case 'groan': this.tone(110, .7, 'sawtooth', .08, -40); break;
      case 'hurt': this.tone(200, .25, 'square', .15, -120); this.noise(.15, .3, 900); break;
      case 'shot': this.noise(.25, .6, 1800); this.tone(90, .2, 'square', .3, -60); break;
      case 'open': this.noise(.2, .15, 700); break;
      case 'alarm': this.tone(440, .3, 'square', .1); setTimeout(() => this.tone(440, .3, 'square', .1), 350); break;
      case 'bad': this.tone(160, .5, 'sawtooth', .15, -80); break;
      case 'bang': this.noise(.3, .5, 300); this.tone(60, .3, 'square', .25); break;
    }
  }
};

// ---- 05_icons.js ----
// ===== procedural icon set (designed on a 32px grid, centered) =====
const ICON_COLORS = {
  wood: '#b07a3c', scrap: '#8d9299', parts: '#c9b36a', cloth: '#9c6b8f', water: '#5fa8d3', canned: '#c75b4a', raw: '#d98f6a', meal: '#e2b35d',
  bandage: '#eee6d8', meds: '#6fcf97', fuel: '#f0a24a', books: '#7f9bc9', lockpick: '#cfd3d8', shovel: '#b0b0a6', crowbar: '#d0433a', knife: '#d9dde2', bat: '#c89a5c', pistol: '#7a7f86', ammo: '#d6b25a', backpack: '#8c7a5a'
};
function drawIcon(name, x, y, s, color) {
  const k = s / 32; ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  const c = color || ICON_COLORS[name] || '#e8e4dc';
  ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const P = () => ctx.beginPath(), S = () => ctx.stroke(), F = () => ctx.fill();
  const M = (a, b) => ctx.moveTo(a, b), L = (a, b) => ctx.lineTo(a, b);
  switch (name) {
    // ---- materials ----
    case 'wood': P(); rr(-13, -3, 26, 9, 3); F(); P(); rr(-10, -11, 22, 8, 3); ctx.fillStyle = shade('#b07a3c', .8); F(); P(); ctx.fillStyle = '#e7c48f'; ctx.arc(-13, 1.5, 3.5, 0, TAU); F(); break;
    case 'scrap': P(); M(-12, 10); L(-4, -12); L(4, -4); L(12, -12); L(8, 10); ctx.closePath(); F(); P(); ctx.fillStyle = shade('#8d9299', .6); ctx.arc(2, 2, 2.5, 0, TAU); F(); break;
    case 'parts': P(); ctx.arc(0, 0, 8, 0, TAU); S(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; P(); M(Math.cos(a) * 8, Math.sin(a) * 8); L(Math.cos(a) * 12.5, Math.sin(a) * 12.5); S(); } P(); ctx.arc(0, 0, 3, 0, TAU); F(); break;
    case 'cloth': P(); M(-13, -8); ctx.quadraticCurveTo(-4, -14, 4, -8); ctx.quadraticCurveTo(10, -3, 13, -9); L(10, 10); ctx.quadraticCurveTo(0, 4, -10, 11); ctx.closePath(); F(); break;
    case 'water': P(); M(0, -13); ctx.quadraticCurveTo(11, 3, 9, 7); ctx.arc(0, 7, 9, 0, Math.PI); ctx.quadraticCurveTo(-11, 3, 0, -13); F(); P(); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.arc(-3.5, 5, 2.5, 0, TAU); F(); break;
    case 'canned': P(); rr(-9, -12, 18, 24, 3); F(); ctx.fillStyle = '#eee'; P(); rr(-9, -5, 18, 8, 1); F(); ctx.fillStyle = shade('#c75b4a', .6); P(); ctx.ellipse(0, -12, 9, 2.5, 0, 0, TAU); F(); break;
    case 'raw': P(); ctx.ellipse(0, 2, 12, 8, -.4, 0, TAU); F(); ctx.fillStyle = '#f6e6d6'; P(); rr(7, -12, 4, 12, 2); F(); break;
    case 'meal': P(); M(-13, -2); L(13, -2); ctx.quadraticCurveTo(12, 12, 0, 12); ctx.quadraticCurveTo(-12, 12, -13, -2); F(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; for (let i = -1; i <= 1; i++) { P(); M(i * 6, -6); ctx.quadraticCurveTo(i * 6 + 2, -10, i * 6, -14); S(); } break;
    case 'bandage': P(); rr(-14, -6, 28, 12, 6); F(); ctx.fillStyle = '#c9b7a0'; for (let i = -1; i <= 1; i++)for (let j = -1; j <= 1; j += 2) { P(); ctx.arc(i * 5, j * 2.3, 1.1, 0, TAU); F(); } break;
    case 'meds': P(); rr(-9, -14, 18, 28, 5); F(); ctx.fillStyle = '#fff'; P(); rr(-9, -14, 18, 10, 5); F(); ctx.fillStyle = '#1c2a22'; P(); rr(-3, -2, 6, 10, 1); F(); break;
    case 'fuel': P(); rr(-9, -8, 18, 21, 2); F(); P(); rr(-6, -13, 7, 6, 1); F(); P(); M(9, -4); L(13, -8); L(13, 4); ctx.lineWidth = 2; S(); break;
    case 'books': P(); rr(-12, -10, 9, 22, 1); F(); ctx.fillStyle = '#c9634e'; P(); rr(-2, -13, 9, 25, 1); F(); ctx.fillStyle = '#d9c38a'; P(); rr(8, -8, 5, 20, 1); F(); break;
    // ---- tools / weapons ----
    case 'lockpick': P(); M(-13, 10); L(9, -12); S(); P(); M(9, -12); L(13, -8); S(); P(); M(-13, 10); L(-9, 12); S(); P(); M(-6, -2); L(2, -10); S(); break;
    case 'shovel': P(); M(0, -14); L(0, 2); S(); P(); M(-4, -14); L(4, -14); S(); P(); M(-7, 2); L(7, 2); L(5, 13); ctx.quadraticCurveTo(0, 16, -5, 13); ctx.closePath(); F(); break;
    case 'crowbar': ctx.lineWidth = 4.5; P(); M(-9, 12); L(7, -4); S(); P(); ctx.arc(4, -7, 4.5, Math.PI * .25, Math.PI * 1.35, true); S(); ctx.lineWidth = 3; P(); M(-12, 9); L(-6, 15); S(); break;
    case 'knife': P(); M(-12, 10); L(-4, 2); S(); ctx.fillStyle = '#d9dde2'; P(); M(-4, 2); L(10, -12); L(14, -8); L(0, 6); ctx.closePath(); F(); ctx.fillStyle = '#5a4a3a'; P(); M(-13, 11); L(-7, 5); L(-4, 8); L(-10, 14); ctx.closePath(); F(); break;
    case 'bat': ctx.lineWidth = 4; P(); M(-11, 11); L(-2, 2); S(); ctx.lineWidth = 7; P(); M(-2, 2); L(10, -10); S(); break;
    case 'pistol': P(); rr(-13, -8, 24, 7, 2); F(); P(); rr(-10, -3, 8, 13, 2); F(); P(); rr(-1, -1, 6, 4, 1); ctx.fillStyle = '#333'; F(); break;
    case 'ammo': for (let i = -1; i <= 1; i++) { P(); rr(i * 7 - 2.5, -4, 5, 14, 1); F(); P(); ctx.fillStyle = '#9a7b3a'; ctx.arc(i * 7, -4, 2.5, Math.PI, 0); F(); ctx.fillStyle = c; } break;
    case 'backpack': P(); rr(-11, -8, 22, 22, 5); F(); P(); ctx.strokeStyle = c; M(-6, -8); ctx.quadraticCurveTo(0, -16, 6, -8); S(); ctx.fillStyle = shade('#8c7a5a', .6); P(); rr(-7, 2, 14, 8, 2); F(); break;
    // ---- needs / status ----
    case 'hungry': P(); M(-12, 0); L(12, 0); ctx.quadraticCurveTo(11, 12, 0, 12); ctx.quadraticCurveTo(-11, 12, -12, 0); F(); P(); M(-6, -4); L(-6, -14); M(-3, -4); L(-3, -14); M(-9, -4); L(-9, -14); S(); break;
    case 'tired': P(); ctx.arc(0, 0, 11, .94, TAU - .94); ctx.arc(5, 0, 9, TAU - 1.4, 1.4, true); ctx.closePath(); F(); break;
    case 'hurt': P(); rr(-4, -13, 8, 26, 2); F(); P(); rr(-13, -4, 26, 8, 2); F(); break;
    case 'sad': P(); ctx.arc(0, 0, 12, 0, TAU); S(); P(); ctx.arc(0, 10, 7, Math.PI * 1.15, Math.PI * 1.85); S(); P(); ctx.arc(-4, -3, 1.6, 0, TAU); ctx.arc(4, -3, 1.6, 0, TAU); F(); break;
    case 'infected': P(); ctx.arc(0, -2, 10, 0, TAU); F(); ctx.fillStyle = '#1a1a1a'; P(); ctx.arc(-4, -3, 2.5, 0, TAU); ctx.arc(4, -3, 2.5, 0, TAU); F(); P(); rr(-6, 6, 12, 7, 2); ctx.fillStyle = c; F(); ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.5; P(); M(-2, 6); L(-2, 13); M(2, 6); L(2, 13); S(); break;
    case 'dead': P(); ctx.arc(0, -2, 10, 0, TAU); F(); ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; P(); M(-7, -6); L(-1, 0); M(-1, -6); L(-7, 0); M(1, -6); L(7, 0); M(7, -6); L(1, 0); S(); break;
    // ---- actions ----
    case 'search': P(); ctx.arc(-3, -3, 8, 0, TAU); S(); ctx.lineWidth = 4; P(); M(3, 3); L(12, 12); S(); break;
    case 'craft': ctx.lineWidth = 3.5; P(); M(-10, 12); L(2, 0); S(); P(); M(-4, -8); L(4, -12); L(12, -4); L(8, 2); L(0, -6); ctx.closePath(); F(); break;
    case 'cook': P(); rr(-12, -4, 24, 14, 4); F(); P(); M(-14, -4); L(14, -4); S(); P(); M(0, -4); L(0, -8); S(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; for (let i = -1; i <= 1; i++) { P(); M(i * 5, -9); ctx.quadraticCurveTo(i * 5 + 2, -12, i * 5, -15); S(); } break;
    case 'eat': P(); M(-8, -14); L(-8, 14); M(-11, -14); L(-11, -6); ctx.quadraticCurveTo(-8, -2, -5, -6); L(-5, -14); S(); P(); M(7, 14); L(7, -2); ctx.quadraticCurveTo(12, -6, 10, -14); ctx.quadraticCurveTo(4, -12, 4, -4); L(7, -2); S(); break;
    case 'sleep': P(); ctx.arc(0, 0, 11, .94, TAU - .94); ctx.arc(5, 0, 9, TAU - 1.4, 1.4, true); ctx.closePath(); F(); break;
    case 'bed': P(); rr(-14, -2, 28, 9, 2); F(); P(); M(-13, 7); L(-13, 13); M(13, 7); L(13, 13); S(); P(); ctx.fillStyle = '#f0ebe0'; rr(-11, -7, 9, 5, 2); F(); break;
    case 'guard': P(); M(0, -14); L(12, -9); ctx.quadraticCurveTo(12, 6, 0, 14); ctx.quadraticCurveTo(-12, 6, -12, -9); ctx.closePath(); F(); ctx.fillStyle = '#1b1f22'; P(); M(0, -8); L(7, -5); ctx.quadraticCurveTo(7, 4, 0, 8); ctx.closePath(); F(); break;
    case 'heal': P(); rr(-4, -13, 8, 26, 2); F(); P(); rr(-13, -4, 26, 8, 2); F(); break;

// ===== world: rooms, stairs, hotspots, navigation (shared by shelter and scavenge sites) =====
const STAIR_W = 55;
class World {
  constructor(def) {
    this.x0 = def.x0; this.x1 = def.x1; this.nFloors = def.nFloors; this.groundY = def.groundY === undefined ? GROUND_Y : def.groundY;
    this.rooms = def.rooms.map(r => Object.assign({ open: !r.locked }, r));
    this.stairs = def.stairs; this.spots = def.spots; this.barricades = def.barricades || []; this.props = def.props || [];
    this.hides = def.hides || []; this.site = def.site || null;
    // auto door spots for locked rooms
    for (const r of this.rooms) if (r.locked) {
      const left = this.rooms.find(o => o.f === r.f && o.x1 === r.x0), right = this.rooms.find(o => o.f === r.f && o.x0 === r.x1);
      const x = left ? r.x0 : r.x1; const dir = left ? 1 : -1;
      this.spots.push({ id: 'door_' + r.name, f: r.f, x, type: 'door', room: r, dir, tool: r.locked });
    }
  }
  fy2y(fy) { return this.groundY - (fy - 1) * FLOOR_H; }
  roomAt(x, f) { return this.rooms.find(r => r.f === f && x >= r.x0 && x <= r.x1); }
  passable(xa, xb, f) {
    const lo = Math.min(xa, xb), hi = Math.max(xa, xb);
    for (const r of this.rooms) if (r.f === f && r.x1 > lo + 1 && r.x0 < hi - 1 && !r.open) return false;
    return true;
  }
  stairsFor(f) { return this.stairs.filter(s => s.a === f || s.b === f); }
  // waypoints from (x,f) to (tx,tf) or null
  path(x, f, tx, tf, depth = 0) {
    tx = clamp(tx, this.x0 + 20, this.x1 - 20);
    if (depth > 4) return null;
    if (f === tf) { if (!this.roomAt(tx, tf) || !this.roomAt(tx, tf).open || !this.passable(x, tx, f)) return null; return [{ x: tx, fy: tf }]; }
    const up = tf > f; let best = null, bd = 1e9;
    for (const s of this.stairsFor(f)) {
      const other = s.a === f ? s.b : s.a; if ((other > f) !== up) continue;
      const foot = up ? s.x - STAIR_W : s.x + STAIR_W, head = up ? s.x + STAIR_W : s.x - STAIR_W;
      if (!this.passable(x, foot, f)) continue;
      const rest = this.path(head, other, tx, tf, depth + 1); if (!rest) continue;
      const d = Math.abs(x - foot) + Math.abs(head - tx) + Math.abs(other - tf) * 200;
      if (d < bd) { bd = d; best = [{ x: foot, fy: f }, { x: head, fy: other }, ...rest]; }
    }
    return best;
  }
  spotById(id) { return this.spots.find(s => s.id === id); }
}

// ---- actor motion along waypoints ----
function moveActor(a, dt, speed) {
  if (!a.path || !a.path.length) { a.moving = false; return true; }
  const w = a.path[0]; const dx = w.x - a.x, dfy = w.fy - a.fy;
  const onStairs = Math.abs(dfy) > 0.001; const sp = speed * (onStairs ? .75 : 1);
  const len = Math.hypot(dx, dfy * FLOOR_H); const step = sp * dt;
  if (len <= step) { a.x = w.x; a.fy = w.fy; a.path.shift(); if (!a.path.length) { a.moving = false; a.f = Math.round(a.fy); return true; } return false; }
  a.x += dx / len * step; a.fy += dfy / len * step; a.facing = dx < 0 ? -1 : 1; a.moving = true; a.walkPhase += dt * sp * .045; a.f = Math.round(a.fy);
  return false;
}

// ===== scavenge mode: site generation, zombies, stealth, loot, backpack =====
const STACK = { wood: 4, scrap: 4, parts: 4, cloth: 4, water: 3, canned: 3, raw: 3, meal: 2, bandage: 3, meds: 3, fuel: 2, books: 3, ammo: 6 };
const NIGHT_TOTAL = 330; // real seconds 20:00 → 05:00

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function makeSite(loc, day) {

    for (let i = 0; i < n; i++) {
      const room = { f, x0: cuts[i], x1: cuts[i + 1], name: loc.id + f + i, col: palette[(f + i) % palette.length] };
      // lock end rooms (not the exit room on floor 0 left)
      if (lockedLeft > 0 && (i === n - 1 || (i === 0 && f > 0)) && r() < .7) { room.locked = r() < .5 ? 'lockpick' : 'crowbar'; lockedLeft--; }
      rooms.push(room);

    if (f < nF - 1) { const mid = rooms.filter(o => o.f === f && !o.locked); const rm = mid[Math.floor(r() * mid.length)]; const sx = clamp(rm.x0 + 80 + r() * (rm.x1 - rm.x0 - 160), x0 + 120, x1 - 120); stairs.push({ x: sx, a: f, b: f + 1 }); }
  }

  const exitRoom = rooms.find(o => o.f === 0 && o.x0 === x0); if (exitRoom.locked) delete exitRoom.locked;

    for (let i = 0; i < n; i++) {

function packAdd(pack, cap, id, n = 1) {

// ---- 70_game.js ----
// ===== game state, day loop, night resolution, save =====
const DAY_LEN = 210; // real seconds for 06:00 → 20:00
const SAVE_KEY = 'ashwinter2';
let G = { nightT: 0, phase: 'title', day: 1, hour: 6, inv: {}, survivors: [], world: null, built: {}, flags: {}, collectorWater: 0, sel: 0, plan: {}, planLoc: null, report: [], event: null, msg: '', msgT: 0 };

function newGame() {
  G = { phase: 'day', day: 1, hour: 6, inv: { wood: 2, water: 2, canned: 1 }, survivors: SURVIVOR_TEMPLATES.slice(0, 3).map((t, i) => makeSurvivor(t, i)), world: makeShelter(), built: {}, flags: {}, collectorWater: 0, sel: 0, plan: {}, planLoc: null, report: [], event: null, msg: '', msgT: 0 };
  UI.modal = null; UI.ff = false; initFx(); homeCam(); homeMsg('Tap a face, then an icon', 'search'); save();
}
function homeCam() { const w = G.world; fitCam({ x0: w.x0 - 120, x1: w.x1 + 120, y0: w.fy2y(2) - FLOOR_H - 170, y1: w.groundY + 240 }); cam.y = cam.ty = cam.y + 50 / cam.z; clampCam(); }
function save() {
  if (HEADLESS) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ day: G.day, inv: G.inv, built: G.built, flags: G.flags, collectorWater: G.collectorWater, shelter: serializeShelter(G.world), survivors: G.survivors.map(s => ({ name: s.name, hunger: s.hunger, fatigue: s.fatigue, health: s.health, morale: s.morale, wounded: s.wounded, infected: s.infected, alive: s.alive })) })); } catch (e) { }
}
function loadSave() { if (HEADLESS) return null; try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { if (!HEADLESS) try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
function continueGame() {
  const d = loadSave(); if (!d) return newGame();
  G = { phase: 'day', day: d.day, hour: 6, inv: d.inv, built: d.built, flags: d.flags, collectorWater: d.collectorWater || 0, world: makeShelter(d.shelter), survivors: d.survivors.map((s, i) => Object.assign(makeSurvivor(SURVIVOR_TEMPLATES.find(t => t.name === s.name), i), s)), sel: 0, plan: {}, planLoc: null, report: [], event: null, msg: '', msgT: 0 };
  G.sel = Math.max(0, G.survivors.findIndex(s => s.alive)); UI.modal = null; initFx(); homeCam();
}

// ---------- day: input ----------
function homeTapWorld(wx, wy) {
  const s = G.survivors[G.sel]; if (!s || !s.alive) return; const w = G.world;
  let bf = 0, bd = 1e9; for (let f = 0; f < w.nFloors; f++) { const d = Math.abs(w.fy2y(f) - 40 - wy); if (d < bd) { bd = d; bf = f; } }
  const path = w.path(s.x, s.f, wx, bf); if (!path) { homeMsg('locked', 'lock', RED); return; }
  s.task = null; s.path = path; AUDIO.sfx('tap');
}
function homeUseSpot(spot) {
  const s = G.survivors[G.sel]; if (!s || !s.alive) return; const w = G.world; const info = spotInfo(spot); if (!info) return;
  if (info.disabled) { if (spot.type === 'door') homeMsg('need ' + ITEMS[spot.tool].n.toLowerCase(), spot.tool, RED); else if (spot.type === 'stove') homeMsg('2 raw + water + fuel', 'cook', RED); else if (spot.type === 'collector') homeMsg('empty · wait for rain', 'water', RED); else if (spot.type === 'radio') homeMsg('already listened today', 'radio', RED); return; }
  const path = w.path(s.x, s.f, spot.x + (spot.type === 'door' ? -spot.dir * 30 : 0), spot.f); if (!path) { homeMsg('locked', 'lock', RED); return; }
  // another survivor already working there?
  if (G.survivors.some(o => o !== s && o.alive && o.task && o.task.spot === spot && spot.type !== 'bed')) { homeMsg('busy', 'people'); return; }
  const dur = { search: 6, dig: G.inv.shovel ? 5 : 11, door: 5, bed: 20, radio: 8, collector: 3, stove: COOK.dur, bench: 0 }[spot.type] || 5;
  s.path = path; s.task = { spot, kind: spot.type, t: 0, dur };
  if (spot.type === 'stove') { pay(COOK.cost); }
  AUDIO.sfx('tap');
}
function homeUseBarricade(b) {
  const s = G.survivors[G.sel]; if (!s || !s.alive) return; const info = barricadeInfo(b);
  if (info.disabled) { homeMsg(b.level >= 3 && b.hp >= 90 ? 'fully boarded' : 'need ' + Object.entries(info.icon === 'repair' ? REPAIR_COST : BOARD_COST).map(([k, v]) => v + ' ' + k).join(' + '), 'wood', RED); return; }
  const path = G.world.path(s.x, s.f, b.x + 40, b.f); if (!path) { homeMsg('locked', 'lock', RED); return; }
  const kind = info.icon === 'repair' ? 'repair' : 'board'; pay(kind === 'repair' ? REPAIR_COST : BOARD_COST);
  s.path = path; s.task = { bar: b, kind, t: 0, dur: kind === 'repair' ? 6 : 9 }; AUDIO.sfx('tap');
}
function giveLoot(spot, s) {
  const [id, n] = pick(spot.loot); const got = Math.max(1, Math.round(n * rnd(.6, 1.2)));
  if (ITEMS[id].tool && G.inv[id] > 0) { G.inv.scrap = (G.inv.scrap || 0) + 1; floatIcon(s.x, G.world.fy2y(s.fy) - 60, 'scrap', 1); return; }
  G.inv[id] = (G.inv[id] || 0) + (ITEMS[id].tool ? 1 : got); floatIcon(s.x, G.world.fy2y(s.fy) - 60, id, ITEMS[id].tool ? 1 : got); AUDIO.sfx('pick');
}

// ---------- day: update ----------
function updateHome(dt) {
  const w = G.world; _T += dt;
  const speed = UI.ff ? 3 : 1; const gdt = dt * speed;
  G.hour += gdt * 14 / DAY_LEN;
  for (const s of G.survivors) {
    if (!s.alive) { s.pose = 'dead'; continue; }
    if (s.sayT > 0) s.sayT -= dt; if (s.eatT > 0) s.eatT -= dt;
    // needs drift
    s.hunger = clamp(s.hunger - gdt * 30 / DAY_LEN, 0, 100);
    if (s.hunger <= 0) s.health = clamp(s.health - gdt * 8 / DAY_LEN, 0, 100);
    if (s.infected) s.health = clamp(s.health - gdt * 6 / DAY_LEN, 0, 100);
    if (s.hunger < 30 || s.health < 40) s.morale = clamp(s.morale - gdt * 10 / DAY_LEN, 0, 100);
    if (s.health <= 0) { s.alive = false; s.pose = 'dead'; homeMsg(s.name + ' died', 'dead', RED); AUDIO.sfx('bad'); for (const o of G.survivors) o.morale = clamp(o.morale - 20, 0, 100); continue; }
    s.poseExtra = null;
    if (s.path && s.path.length) { moveActor(s, gdt, 70 * (s.trait === 'runner' ? 1.2 : 1)); s.pose = 'walk'; continue; }
    s.moving = false;
    if (s.eatT > 0) { s.pose = 'eat'; continue; }
    const tk = s.task;
    if (!tk) { s.pose = 'idle'; continue; }
    tk.t += gdt * (tk.kind === 'dig' || tk.kind === 'board' || tk.kind === 'repair' ? (s.trait === 'handy' ? 1.4 : 1) : 1);
    switch (tk.kind) {
      case 'search': s.pose = 'search'; break;
      case 'dig': s.pose = 'dig'; if (Math.floor(tk.t * 1.6) !== Math.floor((tk.t - gdt) * 1.6)) AUDIO.sfx('dig'); break;
      case 'door': s.pose = G.inv.crowbar ? 'hammer' : 'cook'; break;
      case 'bed': s.pose = 'sleep'; s.fatigue = clamp(s.fatigue + gdt * 1.6, 0, 100); break;
      case 'radio': s.pose = 'cook'; break;
      case 'collector': s.pose = 'search'; break;
      case 'stove': s.pose = 'cook'; tk.spot.active = true; break;
      case 'craft': s.pose = 'hammer'; if (Math.floor(tk.t * 2.3) !== Math.floor((tk.t - gdt) * 2.3)) AUDIO.sfx('hammer'); break;
      case 'board': case 'repair': s.pose = 'hammer'; s.facing = -1; if (Math.floor(tk.t * 2.3) !== Math.floor((tk.t - gdt) * 2.3)) AUDIO.sfx('hammer'); break;
      case 'bench': s.pose = 'idle'; if (!UI.modal) { UI.modal = { kind: 'craft', who: G.survivors.indexOf(s) }; s.task = null; } break;
      case 'exit': s.task = null; break;
    }
    if (tk && tk.t >= tk.dur && tk.kind !== 'bench') {
      const sp = tk.spot;
      switch (tk.kind) {
        case 'search': case 'dig': giveLoot(sp, s); sp.left--; if (sp.left <= 0) { s.task = null; } else tk.t = 0; break;
        case 'door': sp.room.open = true; s.task = null; AUDIO.sfx('done'); if (!G.inv.crowbar && Math.random() < .3) { G.inv.lockpick--; homeMsg('lockpick snapped', 'lockpick', RED); } break;
        case 'bed': s.task = null; s.morale = clamp(s.morale + 5, 0, 100); break;
        case 'radio': s.task = null; G.flags.radioToday = true; for (const o of G.survivors) if (o.alive) o.morale = clamp(o.morale + 10, 0, 100); s.say = 'heart'; s.sayT = 2; if (!G.flags.heardRadio && G.day >= 2) { G.flags.heardRadio = true; homeMsg('Convoy at the airport · day 20', 'radio', GOLD); } break;
        case 'collector': { const n = G.collectorWater; G.collectorWater = 0; G.inv.water = (G.inv.water || 0) + n; floatIcon(s.x, w.fy2y(s.fy) - 60, 'water', n); s.task = null; AUDIO.sfx('pick'); break; }
        case 'stove': sp.active = false; G.inv.meal = (G.inv.meal || 0) + COOK.give.meal; floatIcon(s.x, w.fy2y(s.fy) - 60, 'meal', 2); s.task = null; AUDIO.sfx('done'); break;
        case 'craft': { const rc = tk.recipe; if (rc.build) { G.built[rc.id] = true; homeMsg(ITEMS[rc.give] ? '' : rc.id + ' built', rc.icon, GOLD); } else { G.inv[rc.give] = (G.inv[rc.give] || 0) + 1; floatIcon(s.x, w.fy2y(s.fy) - 60, rc.give, 1); } s.task = null; AUDIO.sfx('done'); break; }
        case 'board': tk.bar.level++; tk.bar.hp = tk.bar.level * 30; s.task = null; AUDIO.sfx('done'); break;
        case 'repair': tk.bar.hp = tk.bar.level * 30; s.task = null; AUDIO.sfx('done'); break;
      }
    }
  }
  if (G.hour >= 20) { G.hour = 20; for (const s of G.survivors) { s.task = null; s.path = null; } G.plan = {}; for (const s of G.survivors) if (s.alive) G.plan[s.name] = 'sleep'; G.planLoc = null; G.phase = 'plan'; UI.modal = { kind: 'plan' }; UI.ff = false; UI.invOpen = false; UI.survOpen = -1; }
  if (!G.survivors.some(s => s.alive)) { G.phase = 'lose'; }
}
function homeLights() {
  const w = G.world; const L = [];
  if (G.hour > 17) { L.push({ x: 300, y: w.fy2y(1) - 60, r: 160, a: .5 }); L.push({ x: 720, y: w.fy2y(1) - 70, r: 140, a: G.built.stove ? .5 : .25 }); L.push({ x: 340, y: w.fy2y(2) - 60, r: 150, a: .4 }); L.push({ x: 1240, y: w.fy2y(0) - 70, r: 130, a: .45 }); for (const b of w.barricades) if (b.kind === 'win') L.push({ x: b.x, y: w.fy2y(b.f) - 80, r: 50, c: '120,140,180', a: .25 }); }
  return L;
}

// ---------- night ----------
function beginNight() {
  UI.modal = null; const scavName = Object.keys(G.plan).find(n => G.plan[n] === 'scav');
  if (scavName) { const s = G.survivors.find(v => v.name === scavName); startTravel(s); }
  else { resolveNight(null); }
}
function finishScavenge() {
  const r = TR.result; const p = TR.player; const w = G.world; cam.lock = false; TR.active = false; SC.active = false;
  UI.modal = null; p.hasPack = false; p.visible = true; p.hidden = false; p.task = null; p.path = null; p.x = 140; p.fy = 1; p.f = 1;
  if (r.died) { p.alive = false; p.health = 0; }
  else { for (const s of r.pack) G.inv[s.id] = (G.inv[s.id] || 0) + s.n; if (r.kills) p.morale = clamp(p.morale + r.kills * 2, 0, 100); }
  resolveNight(r);
}
function resolveNight(scav) {
  const rep = []; const w = G.world; const alive = G.survivors.filter(s => s.alive);
  const line = (icon, text, color) => rep.push({ icon, text, color });
  if (scav) { if (scav.died) line('dead', TR.player.name + (scav.timeout ? ' never made it back before dawn' : ' was lost out there'), RED); else line('backpack', TR.player.name + ' brought home ' + scav.pack.reduce((a, s) => a + s.n, 0) + ' items · ' + scav.kills + ' put down', GREEN); }
  const guards = alive.filter(s => G.plan[s.name] === 'guard'), sleepers = alive.filter(s => G.plan[s.name] === 'sleep');
  const beds = 1 + (G.built.bed ? 1 : 0);
  sleepers.forEach((s, i) => { s.fatigue = clamp(s.fatigue + (i < beds ? 70 : 45), 0, 100); if (i < beds) s.morale = clamp(s.morale + 3, 0, 100); });
  for (const s of guards) s.fatigue = clamp(s.fatigue - 15, 0, 100);
  const scavS = alive.find(s => G.plan[s.name] === 'scav'); if (scavS) scavS.fatigue = clamp(scavS.fatigue - 25, 0, 100);
  for (const s of alive) { s.hunger = clamp(s.hunger - 18, 0, 100); if (s.hunger <= 0) { s.health = clamp(s.health - 15, 0, 100); line('hungry', s.name + ' is starving', RED); } if (s.infected) { s.health = clamp(s.health - 16, 0, 100); line('infected', s.name + ': the bite is getting worse', GREEN); } if (s.fatigue <= 0) { s.health = clamp(s.health - 5, 0, 100); } }
  // attack
  const chance = Math.min(.8, .18 + G.day * .035 + (G.flags.horde ? .3 : 0)); G.flags.horde = false;
  if (Math.random() < chance) {
    let strength = ri(1, 2 + Math.floor(G.day / 4)) + (G.day > 10 ? 1 : 0);
    const def = guards.reduce((a, s) => a + (G.inv.pistol && G.inv.ammo >= 2 ? 3 : G.inv.bat ? 2 : G.inv.knife ? 2 : 1) * (s.trait === 'strong' ? 1.5 : 1), 0) + (G.built.trap ? 1 : 0);
    if (G.built.trap) line('trap', 'The trap caught one', GREEN);
    const kills = Math.min(strength, Math.floor(def)); if (guards.length && G.inv.pistol && G.inv.ammo >= 2 && kills > 0) G.inv.ammo -= 2;
    line('zombie', strength + ' at the walls' + (kills ? ' · ' + kills + ' put down by ' + (guards.map(g => g.name).join(', ') || 'the trap') : ''), kills >= strength ? GREEN : GOLD);
    let left = strength - kills;
    if (left > 0) {
      const weakest = w.barricades.slice().sort((a, b) => (a.level * 30 ? a.hp : -1) - (b.level * 30 ? b.hp : -1))[0];
      if (weakest.level === 0) { breach(weakest, sleepers, guards, line); }
      else { weakest.hp -= left * 14; if (weakest.hp <= 0) { weakest.level = Math.max(0, weakest.level - 1); weakest.hp = weakest.level * 30; line('board', bname(weakest) + ' boards torn down', RED); if (weakest.level === 0) breach(weakest, sleepers, guards, line); } else line('repair', bname(weakest) + ' damaged', GOLD); }
    }
  } else line('moon', 'A quiet night', DIM);
  if (G.built.collector && Math.random() < .45) { G.collectorWater += 2; line('rain', 'Rain filled the collector', '#8ab'); }
  for (const s of alive) if (s.health <= 0) { s.alive = false; line('dead', s.name + ' died in the night', RED); for (const o of G.survivors) o.morale = clamp(o.morale - 20, 0, 100); }
  G.flags.radioToday = false;
  G.day++; G.hour = 6; G.report = rep; G.phase = 'dawn'; UI.modal = { kind: 'dawn' };
  for (const s of G.survivors) { s.task = null; s.path = null; s.pose = 'idle'; if (s.alive) { s.x = 200 + G.survivors.indexOf(s) * 100; s.fy = 1; s.f = 1; } }
  G.sel = Math.max(0, G.survivors.findIndex(s => s.alive));
  // event
  G.event = null; const pool = EVENTS.filter(e => e.req(G)); if (pool.length && Math.random() < .5) G.event = pick(pool);
  homeCam(); save();
}
function bname(b) { return b.id === 'frontdoor' ? 'Front door' : b.id === 'garagedoor' ? 'Garage door' : 'A window'; }
function breach(b, sleepers, guards, line) {
  const victim = sleepers.length ? pick(sleepers) : (guards.length ? pick(guards) : null); if (!victim) return;
  victim.health = clamp(victim.health - 25, 0, 100); victim.wounded = true; let t = bname(b) + ' breached · ' + victim.name + ' bitten'; if (Math.random() < .4 && !victim.infected) { victim.infected = true; t += ' · infected'; }
  line('hurt', t, RED); for (const o of G.survivors) o.morale = clamp(o.morale - 10, 0, 100); AUDIO.sfx('bad');
}
function afterDawn() {
  UI.modal = null;
  if (!G.survivors.some(s => s.alive)) { G.phase = 'lose'; return; }
  if (G.day >= 20) { G.phase = 'win'; return; }
  if (G.event) { G.phase = 'event'; UI.modal = { kind: 'event' }; return; }
  G.phase = 'day';
}
function applyEvent(ev, c) {
  switch (c.fx) {
    case 'join': { const used = G.survivors.map(s => s.name); const t = SURVIVOR_TEMPLATES.find(x => !used.includes(x.name)); if (t) { const s = makeSurvivor(t, G.survivors.length); s.hunger = 40; G.survivors.push(s); homeMsg(t.name + ' joined · ' + TRAIT_DESC[t.trait], 'people', GOLD); } break; }
    case 'morale-': for (const s of G.survivors) s.morale = clamp(s.morale - 8, 0, 100); break;
    case 'trade': G.inv.scrap -= 4; G.inv.meds = (G.inv.meds || 0) + 1; break;
    case 'give': G.inv.bandage--; for (const s of G.survivors) s.morale = clamp(s.morale + 10, 0, 100); break;
    case 'rainwater': G.collectorWater += 3; break;
    case 'radio': G.flags.heardRadio = true; break;
    case 'horde': G.flags.horde = true; break;
  }
  G.event = null; UI.modal = null; G.phase = 'day'; save();
}

// ---------- main loop ----------
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastT) / 1000 || 0); lastT = now;
  UI.hits = [];
  switch (G.phase) {
    case 'title': _T += dt; drawTitle(); break;
    case 'day': case 'plan': case 'dawn': case 'event': case 'win': case 'lose': {
      if (G.phase === 'day' && !UI.modal) updateHome(dt); else _T += dt;
      const hour = G.phase === 'plan' ? 20 : G.phase === 'dawn' || G.phase === 'event' ? 6.5 : G.hour;
      drawScene(G.world, hour, G.survivors, { t: _T, dt, lights: G.phase === 'plan' ? homeLights() : (G.hour > 17 ? homeLights() : []) });
      if (G.phase === 'day' || G.phase === 'plan') drawHomeHud(dt);
      if (UI.modal) { switch (UI.modal.kind) { case 'plan': drawPlan(); break; case 'map': drawMap(); break; case 'dawn': drawDawn(); break; case 'event': drawEvent(); break; case 'craft': drawCraft(); break; } }
      if (G.phase === 'win') drawEnd(true); if (G.phase === 'lose') drawEnd(false);
      break;
    }
    case 'travel': {
      if (!UI.modal) trUpdate(dt); else _T += dt;
      drawStreet(dt); drawTravelHud(dt);
      if (UI.modal) { switch (UI.modal.kind) { case 'scavEnd': drawScavEnd(); break; case 'inv': drawScavInv(); break; } }
      break;
    }
    case 'scav': {
      if (!UI.modal) scUpdate(dt); else _T += dt;
      const actors = [SC.player, ...SC.zombies]; drawScene(SC.world, Math.min(23.5, nightHour()), actors, { t: _T, dt, lights: SC.lights });
      drawScavHud(dt);
      if (UI.modal) { switch (UI.modal.kind) { case 'loot': drawLoot(); break; case 'leave': drawLeave(); break; case 'scavEnd': drawScavEnd(); break; case 'inv': drawScavInv(); break; } }
      break;
    }
  }
  handleTaps();
  // orientation hint
  if (H > W && G.phase !== 'title') { ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(W / 2 - 110, H - 40, 220, 30, 8); ctx.fill(); txt('rotate your phone ↻', W / 2, H - 25, 14, INK); }
}
function init() {
  canvas = document.getElementById('c'); ctx = canvas.getContext('2d'); resize(); window.addEventListener('resize', resize); initInput(); initFx();
  requestAnimationFrame(frame);
}
if (!HEADLESS) window.addEventListener('load', init);

</script>
