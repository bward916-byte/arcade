<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101114">
<title>ASHWINTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#101114;overflow:hidden;height:100%;width:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(root){
'use strict';

/* ---- Everything worth tuning lives here. World units: the character is ~64 tall. ---- */
const CFG = {
  // body
  thigh:13.65, shin:14, ankleH:2.1, torso:17.5, neck:1.4, headR:3.4, upperArm:9.6, foreArm:11.5,
  footBack:2.3, footBall:3.6, footToe:6.4,      // sole points measured from under the ankle
  // pace
  walkSpeed:50, runSpeed:96, accel:420, decel:560, stopDecel:300, stopLead:1.8, stopExtra:7,   // stopping: how hard he brakes, and how far past his hips the last foot lands   // input 1 = walk, 2 = flat-out run; anything between is a jog
  cadenceUp:2.15, cadenceDown:2.4,            // treads per second on stairs (sets stair pace from tread width)
  // stepping
  stepMin:8, stepMax:22,                     // step length at a crawl / at full walk
  swingSlow:0.40, swingFast:0.34, swingRun:0.22, swingStair:0.34, swingSettle:0.20,   // seconds a foot spends in the air
  liftSlow:2.4, liftFast:4.6, liftRun:7.5, liftStair:2.6,    // how high the heel rises behind in early swing
  loadDip:1.3, strikeJolt:16, doubleSupport:0.11,   // both feet down for about a tenth of a second each step at a walk                 // the knee gives a little as each heel lands, and the body feels it
  stepRun:27, crouchRun:2.2,                  // stride and knee bend at a full run
  // posture
  crouchIdle:0.12, crouchWalk:0.3,             // how far below "legs locked straight" the hips ride
  heelOff:0.6, heelStrike:0.25, toeFirstUp:0.12, toeFirstDown:0.35,    // foot pitch, radians
  leanSpeed:0.07, leanAccel:0.06, leanClimb:0.17, leanDescend:-0.03,
  armSwing:0.03,
  // jumping
  jumpV:165, jumpFromSpeed:0.22, jumpCut:0.45, gravity:520, jumpRun:78, jumpPrep:0.07, squatJump:7,
  // crawling, rolling, throwing, reading, dancing
  crawlSpeed:20, crawlAccel:110, crawlStride:9,
  rollDist:50, rollDistRun:84, rollTime:0.6,
  throwVx:215, throwVy:-115,
  readSlow:0.55, danceBeat:2,
  // what counts as a step rather than a cliff or a wall
  maxStepUp:13, maxStepDown:15,
  // vines, ledges, walls
  grabR:16, gripMin:14, hangCM:20, vineDamp:0.12, vinePump:3.4, shinny:34, releaseKick:34,
  swingG:3.1,
  rightK:14, rightC:3.2, legSwingK:30, legSwingC:4.5,   // after letting go: how the body's spin and the legs' swing play out in the air                                        // a vine swings like a short rope, not a long slow pendulum
  pickReach:10, pickSquat:19, pickHinge:1.05,        // how far ahead a thing on the ground is picked from, and how low he goes
  variety:1.35,                                         // 0 = identical every time; 1 = a person
  climbSpeed:26, mantleTime:0.5, flipSpin:1.5, vineArc:1.3, vineTop:250
};

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
/* ---- Variety: no two steps, jumps or reaches are quite the same ----
   Each character has a seed. vary() and jitter() give a fresh random nudge per event (a step, a jump, a throw);
   wobble() is smooth drift over time (posture, pace, gaze). CFG.variety scales all of it; 0 makes him a metronome. */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function vary(w,amt){ return 1+(w.rand()*2-1)*amt*CFG.variety; }
function jitter(w,amt){ return (w.rand()*2-1)*amt*CFG.variety; }
function wobble(w,ch,t){ const i=Math.floor(t), f=t-i;
  const h=k=>{ const x=Math.sin(k*127.1+ch*311.7+w.seed*0.0137)*43758.5453; return (x-Math.floor(x))*2-1; };
  return lerp(h(i),h(i+1),f*f*(3-2*f))*CFG.variety; }
const ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const LEG=CFG.thigh+CFG.shin, LMAX=LEG*0.992;

/* ---------------- World: nothing but level surfaces. A stair is a run of narrow ones. ---------------- */
function buildWorld(){
  const s=[]; let x=0,y=0;
  const flat=len=>{ s.push({x0:x,x1:x+len,y:y,w:len}); x+=len; };
  // n risers; rise>0 climbs, rise<0 descends. The flat that follows is the last tread.
  const stairs=(n,tread,rise)=>{ for(let i=0;i<n;i++){ y-=rise; if(i<n-1){ s.push({x0:x,x1:x+tread,y:y,w:tread}); x+=tread; } } };

  const drop=h=>{ y+=h; }, rise=h=>{ y-=h; };          // a face too tall to step: a cliff going down, a wall going up
  const vines=[], vine=(vx,vy,len)=>vines.push({ax:vx,ay:vy,len:len,th:0.12*(vines.length%2?1:-1),om:0,held:false});
  const marks={}, ivy=[];                              // ivy: the faces that can be climbed

  flat(240);
  stairs(8,12,7);      flat(96);        // ordinary stairs to a landing
  stairs(6,12,7);      flat(230);       // second flight to the terrace
  stairs(10,12,-7);    flat(210);       // down again
  stairs(5,26,5);      flat(170);       // broad, shallow garden steps
  stairs(8,10,8.5);    flat(180);       // steep, narrow tower steps
  stairs(14,12,-7);    flat(150);       // long descent
  stairs(4,26,-5.75);  flat(320);       // broad steps down to the start level

  marks.block=x+60;                     // a head-high block: leap at it, catch the lip, pull up
  flat(120); rise(72); flat(150); drop(72); flat(120);
  vine(marks.block+228,y-150,118);

  marks.ravine=x;                       // the ravine: three vines across, ivy down both walls
  const rim=y;
  flat(20); ivy.push(x); drop(96); flat(300); ivy.push(x); rise(96); flat(60);
  marks.ravineEnd=x;
  for(let i=0;i<3;i++) vine(marks.ravine+56+i*98,rim-190,186);

  ivy.push(x); rise(58); flat(210);      // ivy wall up to the last terrace
  marks.wall=x;
  ivy.push(x); drop(58); flat(90); vine(x-40,y-196,150);
  flat(260);

  const world={ s:s, x0:26, x1:x-26, vines:vines, marks:marks,
    indexAt(px){ let lo=0,hi=s.length-1; if(px<=s[0].x0)return 0; if(px>=s[hi].x1)return hi;
      while(lo<hi){ const m=(lo+hi)>>1; if(px>=s[m].x1)lo=m+1; else hi=m; } return lo; },
    yAt(px){ return s[this.indexAt(px)].y; } };

  // every face too tall to walk is an edge: hang from its lip, and climb the ones with ivy on them
  // things lying about that can be picked up
  world.itemsInit=[{x:95,kind:'stone'},{x:2058,kind:'stone'},{x:2160,kind:'apple'},{x:2440,kind:'apple'},{x:2830,kind:'stone'},{x:3400,kind:'stone'}];
  world.items=[]; resetWorld(world);
  world.edges=[];
  for(let i=1;i<s.length;i++){ const d=s[i].y-s[i-1].y; if(Math.abs(d)<=CFG.maxStepUp) continue;
    world.edges.push({x:s[i].x0, y:Math.min(s[i].y,s[i-1].y), floor:Math.max(s[i].y,s[i-1].y), hi:d<0?1:-1, climb:false}); }
  for(const e of world.edges) e.climb=ivy.some(ix=>Math.abs(ix-e.x)<1);
  return world;
}

/* Where may an ankle sit on surface i so the whole boot fits? (dir = which way the toe points) */
const ITEM_R={stone:1.3,apple:2.1};
function resetWorld(world){                                           // put every loose thing back where it started
  world.items.length=0;
  for(const d of world.itemsInit){ const r=ITEM_R[d.kind]; world.items.push({x:d.x,y:world.yAt(d.x)-r,vx:0,vy:0,a:0,rest:true,held:false,kind:d.kind,r:r,init:true}); }
  for(const v of world.vines||[]){ v.pts=null; v.th=0; v.om=0; v.held=false; }
}
function footRange(world,i,dir){
  const f=world.s[i]; let a,b;
  if(dir>0){ a=f.x0+CFG.footBack+0.5; b=f.x1-CFG.footToe-0.5; }
  else     { a=f.x0+CFG.footToe+0.5;  b=f.x1-CFG.footBack-0.5; }
  if(a>b){ a=b=(a+b)/2; }
  return [a,b];
}

/* Ankle position for a planted foot: heel-up pitch pivots on the ball, toe-up pitch pivots on the heel. */
function ankleFor(px,py,pitch,face){
  const c=Math.cos(pitch), sn=Math.sin(pitch);
  if(pitch>=0){ const bx=px+face*CFG.footBall;
    return [bx+face*(-CFG.footBall*c+CFG.ankleH*sn), py-CFG.footBall*sn-CFG.ankleH*c]; }
  const hx=px-face*CFG.footBack;
  return [hx+face*(CFG.footBack*c+CFG.ankleH*sn), py+CFG.footBack*sn-CFG.ankleH*c];
}

function createWalker(world,x,seed){
  const si=world.indexAt(x), gy=world.yAt(x);
  const mk=px=>({px:px,py:gy,si:si,face:1,planted:true,pitch:0,heel:0,landPitch:0,ax:px,ay:gy-CFG.ankleH,
                 settle:false,back:0,lx:0,ly:0,t:0,T:1,sx:0,sy:0,sp:0,tx:px,ty:gy,tsi:si,tax:px,tay:gy-CFG.ankleH,tp:0,lift:0,prof:'flat'});
  const hy=gy-(CFG.ankleH+LEG-CFG.crouchIdle);
  const w={x:x,y:hy,des:hy,by:hy,bv:0,vx:0,dir:1,facing:1,feet:[mk(x-1.6),mk(x+1.6)],arm:[0,0],lean:0,
           kneeF:1,legA:0,legL:26,exert:0,breathP:0,idleT:0,shift:0,gaze:0,grade:0,stair:0,tread:999,S:CFG.stepMin,thr:2.5,time:0,steps:0,events:[],scarf:[],
           mode:'walk',label:'standing',stopX:null,stopV:6,hp:100,ko:false,hitV:0,hitVy:0,freeze:0,foe:null,ai:null,airRot:0,airOm:0,airLeg:0,airLegV:0,strideVar:1,armVar:1,elbowVar:0,armB:[0.22,0.22],squat:0,sway:0,headAdd:0,vy:0,landHold:0,landSquat:0,
           jump:null,act:null,reading:false,readT:0,dancing:false,danceT:0,crawl:null,roll:null,fade:null,last:null,trick:null,shots:world.items,carry:null,pick:null,pickShift:0,load:0,
           vine:null,grip:0,hang:null,mantle:null,wall:null,flip:null,grabCd:0,climbHeld:false,downHeld:false,limbT:0};
  w.seed=seed==null?(Math.random()*1e9|0):seed; w.rand=mulberry32(w.seed);
  for(let i=0;i<6;i++){ const p={x:x-2-i*1.5,y:hy-CFG.torso+i*2.5}; p.ox=p.x; p.oy=p.y; w.scarf.push(p); }
  return w;
}

const destX=f=>f.planted?f.px:f.tx;
/* How hard the player pushes sets the pace: 0..1 walks, 1..2 runs. */
function paceFor(a){ const m=Math.abs(a); return Math.sign(a)*(m<=1?m*CFG.walkSpeed:lerp(CFG.walkSpeed,CFG.runSpeed,m-1)); }
const walkF=sp=>clamp(sp/CFG.walkSpeed,0,1), runF=sp=>clamp((sp-CFG.walkSpeed)/(CFG.runSpeed-CFG.walkSpeed),0,1);
const strideFor=sp=>lerp(CFG.stepMin,CFG.stepMax,walkF(sp))+runF(sp)*(CFG.stepRun-CFG.stepMax);
const swingFor=sp=>lerp(CFG.swingSlow,CFG.swingFast,walkF(sp))-runF(sp)*(CFG.swingFast-CFG.swingRun);

/* Where should the swinging foot come down? Predict where the hips will be at landing and reach half a step past that. */
function pickTarget(w,world,o,goalV,Trem){
  const dir=w.dir, rate=(Math.abs(goalV)<Math.abs(w.vx)?CFG.decel:CFG.accel)*Trem;
  const dv=clamp(goalV-w.vx,-rate,rate), vLand=w.vx+dv, vAvg=w.vx+dv*0.5;
  const sfL=walkF(Math.abs(vLand)), S=strideFor(Math.abs(vLand))*(w.strideVar||1); w._rf=runF(Math.abs(vLand));
  let xf=w.x+vAvg*Trem+dir*S*0.5;
  const j=o.si; let i=world.indexAt(xf);
  if((i-j)*dir>1) i=j+dir;                              // never skip a tread
  if((i-j)*dir<0) i=j;
  if(i===j && world.s[j].w<20) i=j+dir;                 // narrow tread: one foot each
  i=clamp(i,0,world.s.length-1);
  if(w.stopX!=null) xf=dir>0?Math.min(xf,w.stopX+CFG.stopLead):Math.max(xf,w.stopX-CFG.stopLead);   // stopping: land beside where the hips will rest
  const dy=world.yAt(xf)-o.py;                           // a face too tall to step: stay on this surface
  if(dy<-CFG.maxStepUp||dy>CFG.maxStepDown) i=j;
  if(i===j && (xf-o.px)*dir<4) xf=o.px+dir*4;           // always land ahead of the other foot
  const r=footRange(world,i,dir);
  return {i:i,tx:clamp(xf,r[0],r[1]),sf:sfL};
}

/* Point a foot at a landing spot, starting from wherever it is right now. */
function aim(w,world,f,i,tx,T,settle,sf){
  const ty=world.yAt(tx), dy=ty-f.py, sl=world.gAt?world.gAt(tx):0;
  f.prof = (dy<-0.5&&!sl)?'up':((dy>0.5&&!sl)?'down':'flat');
  if(f.prof!=='flat' && !settle) T=Math.max(T,CFG.swingStair*(f.planted?1:0.6));
  f.tp = settle?0:(f.prof==='up'?CFG.toeFirstUp:(f.prof==='down'?CFG.toeFirstDown:-CFG.heelStrike*sf));
  f.lift = f.prof==='flat'?(settle?2.2:lerp(CFG.liftSlow,CFG.liftFast,sf)+(settle?0:(w._rf||0))*(CFG.liftRun-CFG.liftFast)):CFG.liftStair+(w._rf||0)*3;
  if(!f.planted) f.lift*=0.5;                           // re-aimed in mid-air: no need to arc again
  f.face=w.facing;                                      // a boot turns around when it next leaves the ground
  const a=ankleFor(tx,ty,f.tp,f.face);
  f.planted=false; f.settle=settle; f.t=0; f.T=T; f.sx=f.ax; f.sy=f.ay; f.sp=f.pitch;
  f.tx=tx; f.ty=ty; f.tsi=i; f.tax=a[0]; f.tay=a[1];
  // climbing with the toe already against a riser (it happens after a turn): draw the foot back first
  const sf0=world.s[f.si], edge=f.face>0?sf0.x1:sf0.x0;
  f.back = f.prof==='up' ? Math.max(0,(f.ax+f.face*(CFG.footToe+0.5)-edge)*f.face) : 0;
}

function startStep(w,world,f,o,settle,goalV){
  if(settle){
    const r=footRange(world,o.si,w.facing);
    aim(w,world,f,o.si,clamp(o.px-w.facing*3,r[0],r[1]),CFG.swingSettle,true,0);
  }else{
    w.strideVar=vary(w,0.07);
    const T0=swingFor(Math.abs(w.vx))*vary(w,0.06);
    const tg=pickTarget(w,world,o,goalV,T0);
    aim(w,world,f,tg.i,tg.tx,T0,false,tg.sf);
    f.lift*=vary(w,0.2); f.tp+=jitter(w,0.06);
    w.armVar=vary(w,0.2); w.elbowVar=jitter(w,0.14);
  }
}

function swingPose(f){
  const t=f.t; let ux,uy;
  if(f.prof==='up'){        ux=ss((t-0.2)/0.8);   uy=ss(t/0.5);  }       // rise first, then reach
  else if(f.prof==='down'){ ux=ss(t/0.78);        uy=ss((t-0.3)/0.7); }  // reach first, then lower
  else { ux=Math.pow(ss(t),1.25); uy=ux; }                           // flat: the foot trails back at first, then reaches out to land
  f.ax=lerp(f.sx,f.tax,ux)-f.face*f.back*ss(t/0.15)*(1-ss((t-0.3)/0.4));
  // flat ground: the heel kicks up early (the knee folds most just after toe-off), then the shin swings through low and the leg straightens to land
  const arc = f.prof==='flat' ? Math.sin(Math.PI*Math.pow(t,0.6)) : Math.sin(Math.PI*Math.pow(t,0.85));
  f.ay=lerp(f.sy,f.tay,uy)-f.lift*arc;
  f.pitch = f.prof==='up' ? lerp(f.sp,f.tp,ss((t-0.25)/0.5))    // keep the toe tucked until it is above the nosing
                          : lerp(f.sp,f.tp,ss(t*1.15));
}

/* =====================  WALKING (feet drive everything)  ===================== */
function stepWalk(w,world,input,dt,o){
  if(input){ w.dir=Math.sign(input); if(w.dir!==w.facing){ startFade(w,0.16); w.facing=w.kneeF=w.dir; } w.dancing=false; }   // a turn swings the limbs across
  const f0=w.feet[0], f1=w.feet[1], S_=world.s;

  // --- read the ground: are we on stairs, and which way do they go?
  const tread=Math.min(S_[world.indexAt(w.x)].w, S_[world.indexAt(w.x+w.dir*12)].w, S_[f0.si].w, S_[f1.si].w);
  const gradeNow=(world.yAt(w.x-w.dir*12)-world.yAt(w.x+w.dir*12))/24;      // + climbing, - descending
  w.grade+=(gradeNow-w.grade)*(1-Math.exp(-6*dt));
  const onStair=tread<40;
  w.stair+=((onStair?1:0)-w.stair)*(1-Math.exp(-7*dt));
  w.tread=tread;
  const push=Math.abs(input), hurry=clamp(push-1,0,1);                       // pushing past a walk: taking stairs two at a time... well, faster
  let vlim=Math.abs(paceFor(input))*(w.reading?CFG.readSlow:1)*(1+0.035*wobble(w,8,w.time*0.45));   // nobody holds an exact pace
  if(onStair) vlim=Math.min(vlim,tread*(w.grade>0?CFG.cadenceUp:CFG.cadenceDown)*(1+0.6*hurry)*Math.max(Math.min(push,1),0.35));

  // --- hips, horizontally
  let goal=Math.sign(input)*vlim;
  if(input) w.stopX=null;
  else{
    // Stopping: pick the spot a body at this speed comes to rest, and brake smoothly to exactly there.
    // The feet are placed around that spot, so the hips never have to creep over to them afterwards.
    if(w.stopX==null){
      const dv=Math.sign(w.vx)||w.dir, nat=w.vx*w.vx/(2*CFG.stopDecel);
      const front=Math.max((destX(f0)-w.x)*dv,(destX(f1)-w.x)*dv)-CFG.stopLead;     // finish the step already under way and stop over that foot
      w.stopX=w.x+dv*clamp(Math.max(nat,Math.min(front,nat+CFG.stopExtra)),0,32);   // but never drift far past where the brakes would stop him
      w.stopV=Math.max(Math.abs(w.vx),6); }
    const d=w.stopX+w.shift+w.pickShift-w.x;
    goal=Math.abs(d)<0.03?0:Math.sign(d)*Math.min(Math.sqrt(2*CFG.stopDecel*Math.abs(d)),6*Math.abs(d)+2,w.stopV);   // brake, never speed up; ease in gently at the end
  }
  const speedingUp=Math.abs(goal)>Math.abs(w.vx)&&goal*w.vx>=0;
  const a=speedingUp?CFG.accel:CFG.decel, vPrev=w.vx;
  w.vx+=clamp(goal-w.vx,-a*dt,a*dt);
  if(!f0.planted||!f1.planted){                                              // mid-step, hips may not outrun the feet
    const maxD=Math.max(w.thr+3,10);
    for(const f of w.feet){ const d=destX(f)-w.x; if(d*w.vx<0){ const over=Math.abs(d)-maxD; if(over>0){ const cap=CFG.runSpeed*clamp(1-over/7,0.12,1); w.vx=clamp(w.vx,-cap,cap); } } }
  }
  const wasX=w.x; w.x+=(w.vx+w.hitV)*dt;
  if(w.x<world.x0){w.x=world.x0; if(w.vx<0)w.vx=0;} if(w.x>world.x1){w.x=world.x1; if(w.vx>0)w.vx=0;}
  for(const e of world.edges){
    if((wasX-e.x)*e.hi<0){                                                   // on the low side: the face is a wall
      if((w.x-e.x)*e.hi>-9){ w.x=e.x-e.hi*9; w.vx=0; if(w.stopX!=null&&(w.stopX-w.x)*e.hi>0) w.stopX=w.x; }
    }else if((w.x-e.x)*e.hi<3 && w.vx*e.hi<0){ toAir(w); return; }            // walked off the lip: fall
  }

  const sp=Math.abs(w.vx), sf=walkF(sp), rf=runF(sp);
  w.S=strideFor(sp);
  let thrRef=w.S*0.5; if(onStair) thrRef=Math.min(thrRef,tread*0.6);
  const together=f0.planted&&f1.planted&&Math.abs(f0.px-f1.px)<6;
  w.thr=together?2.5:thrRef;

  // --- feet in the air
  for(const f of w.feet) if(!f.planted){
    f.t+=dt/f.T;
    if(f.t>=1){ f.planted=true; f.px=f.tx; f.py=f.ty; f.si=f.tsi; f.landPitch=f.tp; f.heel=0; f.slp=Math.atan((world.gAt?world.gAt(f.tx):0)*f.face); w.steps++;
      if(!f.settle){ w.load=1; w.bv+=CFG.strikeJolt*(0.3+sf); }                      // heel strike: the knee takes the load, the body jolts
      w.events.push({type:'step',x:f.px,y:f.py,speed:sp,stone:S_[f.si].w<40,prof:f.prof}); }
    else{
      if(!f.settle && f.t<0.75){                       // keep correcting the landing spot while there's time
        const ot=f===f0?f1:f0, tg=pickTarget(w,world,ot,goal,(1-f.t)*f.T);
        const rate=(w.stopX!=null?150:90)*dt;
        if(tg.i===f.tsi){ const d=clamp(tg.tx-f.tx,-rate,rate); f.tx+=d; f.tax+=d; }
        else aim(w,world,f,tg.i,tg.tx,Math.max(0.2,(1-f.t)*f.T),false,tg.sf);
      }
      swingPose(f);
    }
  }
  // --- decide whether a foot should leave the ground
  if(f0.planted&&f1.planted){
    const frontX=w.dir>0?Math.max(f0.px,f1.px):Math.min(f0.px,f1.px);
    const braking=w.stopX!=null&&Math.abs(w.vx)>5&&(w.stopX+w.dir*CFG.stopLead-frontX)*w.dir>3;   // the rest point is past both feet: another braking step
    if((input!==0||braking) && w.vx*w.dir>0.5){
      const b0=(w.x-f0.px)*w.dir, b1=(w.x-f1.px)*w.dir;
      // lift the rear foot once it trails far enough, or early if the front foot won't stay ahead for a whole swing
      // Lift the back foot a fixed moment after the front one lands (the double-support beat), so left and right
      // take turns evenly. Waiting for the back foot to trail a set distance instead lets the two feet drift into a limp.
      const lead=-Math.min(b0,b1), Tds=CFG.doubleSupport*(1-0.7*rf);
      const due = together ? Math.max(b0,b1)>w.thr : (lead<w.S*0.5-sp*Tds || Math.max(b0,b1)>w.thr*1.6);
      if(due){ if(b0>=b1) startStep(w,world,f0,f1,false,goal); else startStep(w,world,f1,f0,false,goal); }
    }else if(!input && sp<14 && w.stopX!=null){
      // nearly stopped: set the feet either side of where the hips rest, the worse one first
      const F=w.facing, rest=w.stopX+w.shift, front=f0.px*F>=f1.px*F?f0:f1, rear=front===f0?f1:f0;
      const plan=[[front,rest+F*1.6],[rear,rest-F*1.6]].map(([f,ix])=>{
        let i=world.indexAt(ix); if(Math.abs(world.yAt(ix)-f.py)>CFG.maxStepUp) i=f.si;
        const r=footRange(world,i,F); return {f:f,i:i,tx:clamp(ix,r[0],r[1]),err:Math.abs(f.px-ix)}; });
      plan.sort((a,b)=>b.err-a.err);
      const m=plan[0]; if(m.err>2.6&&Math.abs(m.tx-m.f.px)>1) aim(w,world,m.f,m.i,m.tx,CFG.swingSettle,true,0);
    }
  }
  // --- feet on the ground: heel peels up as the hips pass ahead (o.tap lets a dance lift a heel too)
  const hRef=Math.max(thrRef,4);
  for(let i=0;i<2;i++){ const f=w.feet[i]; if(!f.planted)continue;
    const behind=(w.x-f.px)*w.dir;
    const hT=(f.face===w.dir?ss((behind-0.4*hRef)/(0.8*hRef))*CFG.heelOff:0)+o.tap[i];
    f.heel+=(hT-f.heel)*(1-Math.exp(-25*dt));
    f.landPitch*=Math.exp(-16*dt);
    f.pitch=f.heel+f.landPitch+(f.planted?(f.slp||0):(f.slp||0)*(1-f.t));
    const an=ankleFor(f.px,f.py,f.pitch,f.face); f.ax=an[0]; f.ay=an[1];
  }

  // --- hips, vertically: ride above the supporting foot, but never further than a leg can reach.
  //     w.squat is extra knee bend asked for by a jump wind-up, a landing, or a dance.
  w.squat+=(o.squat-w.squat)*(1-Math.exp(-(o.squat>w.squat?30:9)*dt));
  let ref=Infinity; for(const f of w.feet) if(f.planted) ref=Math.min(ref,f.py);
  if(ref===Infinity) ref=Math.min(f0.ty,f1.ty);
  for(const f of w.feet) if(!f.planted && f.ty>ref) ref+=(f.ty-ref)*ss(f.t)*0.7;   // start sinking early toward a lower landing
  w.load*=Math.exp(-7*dt);
  const crouch=lerp(CFG.crouchIdle,CFG.crouchWalk,sf)+rf*CFG.crouchRun+w.stair*0.6+w.squat+CFG.loadDip*w.load*sf;
  w.des+=(ref-(CFG.ankleH+LEG-crouch)-w.des)*(1-Math.exp(-(o.squat>0.5?26:10)*dt));
  let target=w.des;
  for(const f of w.feet){ if(!f.planted) continue; const dx=Math.min(Math.abs(f.ax-w.x),LMAX-3); target=Math.max(target,f.ay-Math.sqrt(LMAX*LMAX-dx*dx)); }
  // a swinging leg only starts to pull the hips toward it as it comes in to land; until then it bends to stay in reach
  for(const f of w.feet){ if(f.planted) continue;
    const dx2=Math.min(Math.abs(f.ax-w.x),LMAX-3), need=f.ay-Math.sqrt(LMAX*LMAX-dx2*dx2);
    if(need>target) target=lerp(target,need,Math.max(1-ss(f.t/0.3),ss((f.t-0.35)/0.6))); }   // lets go of the hips gradually at lift-off, takes them again at landing
  if(target>w.y) w.y+=Math.min(target-w.y,Math.max(2.2,(target-w.y)*0.5)); else w.y+=(target-w.y)*(1-Math.exp(-(onStair?10:26)*dt));
  for(const f of w.feet){ const dx=f.ax-w.x, dy=f.ay-w.y, d=Math.hypot(dx,dy); if(d>LMAX){ f.ax=w.x+dx/d*LMAX; f.ay=w.y+dy/d*LMAX; } }

  upper(w,dt,o,sf,clamp((w.vx-vPrev)/dt/CFG.accel,-1,1));
  w.label = w.dancing?'dancing':(sp<3&&together ? (w.reading?'reading':'standing') : (onStair&&Math.abs(w.grade)>0.05 ? (w.grade>0?'climbing stairs':'descending stairs') : (sp<3?'standing':(w.reading?'reading on the move':(sp>100?'running':(sp>66?'jogging':(sp<30?'strolling':'walking')))))));

  // --- a jump winds up inside the walk (so the knees bend properly), then leaves the ground
  if(w.jump){ w.jump.t+=dt; if(w.jump.t>=CFG.jumpPrep) launch(w,input); }
}

/* Spring, lean, head, arm targets. Shared by walking and flight. */
function upper(w,dt,o,sf,accN){
  const F=w.facing;
  w.bv+=((w.y-w.by)*480-w.bv*26)*dt; w.by+=w.bv*dt;
  let leanT=(w.vx/CFG.walkSpeed)*CFG.leanSpeed+accN*CFG.leanAccel+F*o.lean+0.022*wobble(w,1,w.time*0.6);
  if(w.mode==='walk') leanT+=F*w.stair*(w.grade>0.05?CFG.leanClimb:(w.grade<-0.05?CFG.leanDescend:0));
  w.lean+=(leanT-w.lean)*(1-Math.exp(-o.leanRate*dt));
  w.headAdd+=(o.head-w.headAdd)*(1-Math.exp(-9*dt));
  // where he looks: at the treads on stairs, at the ground when dropping, up at a vine or ledge ahead, around when idle
  let gz = w.mode==='air' ? (w.vy>60?0.34:-0.1) : (w.stair>0.3?(w.grade<-0.05?0.32:0.16):0.05*sf);
  for(const v of w.world.vines){ const dx=(v.ax-w.x)*F; if(dx>0&&dx<95&&v.ay+v.len<w.y+20){ gz=-0.3; break; } }
  for(const e of w.world.edges){ const dx=(e.x-w.x)*F; if(dx>0&&dx<45&&e.y<w.y-20&&e.hi===F&&w.mode==='walk'){ gz=-0.36; break; } }
  if(w.pick) gz=0.4;
  if(w.idleT>2) gz+=0.22*Math.sin(w.idleT*0.43)*Math.sin(w.idleT*0.17+1)+0.14*wobble(w,5,w.idleT*0.5)-0.05*w.exert;
  w.gaze+=(gz-w.gaze)*(1-Math.exp(-5*dt));
  w.sway+=(o.sway-w.sway)*(1-Math.exp(-16*dt));
  const r=1-Math.exp(-o.rate*dt);
  for(let i=0;i<2;i++){
    const rel=(w.feet[i].ax-w.x)*F;
    const rf=runF(Math.abs(w.vx));
    let ta=w.mode==='air'?0:clamp(-rel*CFG.armSwing*(1+0.6*rf)*w.armVar,-0.55-0.35*rf,0.55+0.35*rf)*(0.35+0.65*sf), tb=0.22+Math.max(0,ta)*0.9+sf*0.25+rf*1.2+w.elbowVar;
    const oa=o.arm[i]; if(oa){ ta=lerp(ta,oa.a,oa.k); tb=lerp(tb,oa.b,oa.k); }
    w.arm[i]+=(ta-w.arm[i])*r; w.armB[i]+=(tb-w.armB[i])*r;
  }
}

/* =====================  OVERLAYS: what the arms, head and knees are asked to do on top of walking  =====================
   Arm targets are {a: shoulder angle from hanging (forward +), b: elbow bend, k: how much to override the walk swing}. */
function overlay(w,dt){
  const o={arm:[null,null],lean:0,leanRate:7,head:0,squat:0,sway:0,rate:12,tap:[0,0],prop:null};
  // standing about: after a moment he settles his weight onto one leg, then the other; the free heel lifts a little
  const still=w.mode==='walk'&&Math.abs(w.vx)<3&&!w.act&&!w.dancing&&!w.jump&&!w.pick&&w.landHold<=0;
  w.idleT=still?w.idleT+dt:0;
  const amp=ss((w.idleT-1.2)/1.8);
  w.shift=amp*2.4*clamp(0.7*Math.sin((w.idleT-1.2)*0.75)+0.5*wobble(w,4,w.idleT*0.33),-1,1);
  if(amp>0){ const mid=(w.feet[0].px+w.feet[1].px)/2, sd=Math.sign(w.shift);
    for(let i=0;i<2;i++) if((w.feet[i].px-mid)*sd<-0.5) o.tap[i]=0.2*Math.abs(w.shift)/2.4; }
  // out of breath: a slight hunch while he recovers
  if(still) o.lean=0.10*w.exert;
  const set=(i,a,b,k)=>{ o.arm[i]={a:a,b:b,k:k==null?1:k}; };
  if(w.landHold>0){ w.landHold-=dt; o.squat=w.landSquat; }
  const bend=pickBend(w);
  w.pickShift=-w.facing*3*bend;                                         // hips sit back to balance the reach
  if(bend>0){ o.squat=CFG.pickSquat*bend*(w.pick.sq||1); o.lean=CFG.pickHinge*bend*(w.pick.hg||1); o.leanRate=12; o.head=0.5*bend; o.rate=16; }
  else if(w.carry&&!w.act) set(1,0.5,1.55,0.9);                         // carrying: held in front at the waist
  if(w.reading){ w.readT+=dt; const pg=w.readT%3.6, flip=pg<0.5?Math.sin(pg/0.5*Math.PI):0;       // now and then, turn a page
    set(0,0.70,1.52); set(1,0.78+flip*0.28,1.45-flip*0.55); o.head=0.36; o.prop='book'; }
  if(w.dancing){ w.danceT+=dt; const p=w.danceT*CFG.danceBeat, s1=Math.sin(Math.PI*p), s2=Math.sin(2*Math.PI*p);
    const big=1+0.25*wobble(w,6,w.danceT*0.6);
    o.squat=(2.2+2.6*(0.5-0.5*Math.cos(2*Math.PI*p)))*big; o.sway=3.2*s1*big; o.lean=-0.10*s1*big; o.head=0.12*s2;
    set(1,1.7+0.95*s1,1.3+0.45*s2); set(0,1.7-0.95*s1,1.3-0.45*s2);
    o.tap=[Math.max(0,s2)*0.42,Math.max(0,-s2)*0.42]; o.rate=18; }
  if(w.jump){ set(0,-0.7,0.25); set(1,-0.85,0.25); o.lean=0.13; o.squat=Math.max(o.squat,CFG.squatJump); o.rate=24; o.prop=null; }
  if(w.mode==='air'){ const up=w.vy<0, fwd=Math.abs(w.vx)>20;
    if(up){ set(0,2.2,0.2); set(1,2.55,0.15); } else { set(0,1.0,0.55); set(1,1.35,0.5); }
    o.lean=fwd?(up?0.14:-0.06):0; o.rate=16; o.prop=null; }
  const A=w.act;
  if(A){ A.t+=dt;
    if(A.name==='throw'){
      if(A.t<0.24){ set(1,-1.75,-1.2); set(0,0.95,0.3); o.lean=-0.17; o.rate=17; o.leanRate=14; o.prop=w.carry?null:'stone'; }
      else if(A.t<0.36){ set(1,2.0,0.1); set(0,-0.5,0.5); o.lean=0.30; o.rate=40; o.leanRate=26; if(A.t<0.30&&!w.carry) o.prop='stone'; }
      else { set(1,0.8,0.4); set(0,-0.2,0.4); o.lean=0.10; o.rate=11; }
      if(A.t>=0.30&&!A.done){ A.done=true; const h=w.last?w.last.arms[1]:{hx:w.x,hy:w.y-20}, F=w.facing;
        let it=w.carry;
        if(it){ w.carry=null; it.held=false; }
        else{ it={kind:'stone',r:ITEM_R.stone,a:0}; w.shots.push(it);
          if(w.shots.length>40){ const k=w.shots.findIndex(q=>!q.init&&q.rest); if(k>=0) w.shots.splice(k,1); } }
        Object.assign(it,{x:h.hx+F*1.5,y:h.hy-1,vx:F*CFG.throwVx*vary(w,0.08)+w.vx*0.6,vy:CFG.throwVy*vary(w,0.1),rest:false});
        w.events.push({type:'throw'}); }
      if(A.t>0.66) w.act=null;
    }else if(A.name==='clap'){
      const f=A.f||3.4, u=A.t-0.16, s=u<0?1:0.5+0.5*Math.cos(2*Math.PI*f*u);           // s: how far apart the hands are
      set(1,1.02+s*0.32,1.35-s*0.28); set(0,1.02-s*0.30,1.35+s*0.10); o.rate=30; o.squat=Math.max(o.squat,0.9*(1-s)); o.head=-0.05; o.prop=null;
      if(u>=(A.n+0.5)/f){ A.n++; w.events.push({type:'clap'}); }
      if(A.n>=(A.max||4)&&u>=(A.max||4)/f+0.05) w.act=null;
    }
  }
  if(w.ext){ const E=w.ext; if(E.arm) for(let i=0;i<2;i++) if(E.arm[i]) o.arm[i]=E.arm[i]; if(E.lean!=null) o.lean=E.lean; if(E.squat!=null) o.squat=Math.max(o.squat,E.squat); if(E.head!=null) o.head=E.head; if(E.rate) o.rate=E.rate; if(E.leanRate) o.leanRate=E.leanRate; if(E.tap) o.tap=E.tap; }
  return o;
}

/* =====================  PICKING UP, CARRYING, PUTTING DOWN  =====================
   He walks up until the thing is a forearm's reach past his lead foot, looking at it.
   Then he bends at the knees and hips together, sits his hips back to keep balance,
   puts his free hand on his knee, and reaches down with the other. Standing up reverses it. */
function nearestItem(w,world){
  let best=null; const g=world.yAt(w.x);
  for(const it of w.shots){ if(!it.rest||it.held) continue;
    const dx=it.x-w.x; if(Math.abs(dx)>46||Math.abs(it.y+it.r-g)>4) continue;
    const F=Math.sign(dx)||w.facing, stand=it.x-F*CFG.pickReach;
    if(Math.abs(world.yAt(stand)-world.yAt(it.x))>1) continue;           // must be able to stand on the same level
    if(!best||Math.abs(dx)<Math.abs(best.x-w.x)) best=it; }
  return best;
}
function dropCarry(w){ const it=w.carry; if(!it) return; w.carry=null; it.held=false; it.rest=false; it.vx=w.vx*0.5; it.vy=w.vy||0; }
function pickDrive(w,world,input,dt){                                  // returns the input to use while a pick or put-down is under way
  const p=w.pick; p.t+=dt;
  if(p.phase==='approach'){
    const F=Math.sign(p.item.x-w.x)||w.facing, d=(p.item.x-F*CFG.pickReach)-w.x;
    if(Math.abs(d)<1.4&&Math.abs(w.vx)<7){
      if(F!==w.facing){ startFade(w,0.16); w.facing=w.dir=w.kneeF=F; }
      p.phase='reach'; p.t=0; return 0; }
    if(p.t>3.5||!p.item.rest){ w.pick=null; return 0; }                   // gave up, or it rolled away
    return Math.sign(d)*Math.max(0.3,Math.min(1,Math.abs(d)/12));
  }
  if(p.phase==='reach'&&p.t>=0.46){
    if(p.put){ const it=p.item; w.carry=null; it.held=false; it.rest=true; it.x=p.gx; it.y=p.gy; }
    else{ const it=p.item; it.held=true; it.rest=false; w.carry=it; }
    p.phase='rise'; p.t=0; w.events.push({type:'pat',x:p.gx}); }
  else if(p.phase==='rise'&&p.t>=0.48) w.pick=null;
  return 0;
}
function pickBend(w){                                                 // 0 standing .. 1 all the way down
  const p=w.pick; if(!p||p.phase==='approach') return 0;
  return p.phase==='reach' ? ss(p.t/0.4) : 1-ss(p.t/0.46);
}
/* After the body is posed: the reaching hand goes to the thing, the other to the knee. */
function pickArms(w,P,world){
  const p=w.pick, F=w.facing;
  if(p&&p.phase!=='approach'){
    const k = p.phase==='reach' ? ss((p.t-0.06)/0.38) : 1-ss((p.t-0.04)/0.4);
    const tx=p.gx, ty=p.gy-(p.put?0:0.8);
    const A=P.arms[1], hx=lerp(A.hx,tx,k), hy=lerp(A.hy,ty,k);
    // the reaching shoulder drops toward the thing, the last couple of units of reach
    const dx=hx-P.sh.x, dy=hy-P.sh.y, d=Math.hypot(dx,dy)||1, give=Math.min(3.2,Math.max(0,d-(CFG.upperArm+CFG.foreArm-0.3)))*k;
    const sx=P.sh.x+dx/d*give, sy=P.sh.y+dy/d*give, e=solve2(sx,sy,hx,hy,CFG.upperArm,CFG.foreArm,-F);
    P.reachSh={x:sx,y:sy};
    P.arms[1]={ex:e.kx,ey:e.ky,hx:e.ax,hy:e.ay};
    const K=P.legs[0], B=P.arms[0], k2=pickBend(w)*0.85, e2=solve2(P.sh.x,P.sh.y,lerp(B.hx,K.kx+F*1.5,k2),lerp(B.hy,K.ky-1.2,k2),CFG.upperArm,CFG.foreArm,-F);
    P.arms[0]={ex:e2.kx,ey:e2.ky,hx:e2.ax,hy:e2.ay};
  }
  if(w.carry){ const H=P.arms[1]; w.carry.x=H.hx+F*1.1; w.carry.y=H.hy+0.9; }
}

/* =====================  JUMPING  ===================== */
function launch(w,input){
  const short=w.jump&&w.jump.cut;
  w.mode='air'; w.jump=null; w.vy=-(CFG.jumpV+CFG.jumpFromSpeed*Math.abs(w.vx))*(short?0.62:1)*vary(w,0.05); w.squat=0;
  w.airRot=0; w.airOm=jitter(w,0.45); w.airLeg=0; w.airLegV=jitter(w,1.2);   // no take-off is perfectly square   // a run carries into a bigger jump
  if(Math.abs(input)>0.3) w.vx=w.dir*Math.max(Math.abs(w.vx),CFG.jumpRun*(0.55+0.45*Math.min(Math.abs(input),1)));   // a held direction makes it a leap
  for(const f of w.feet){ f.planted=false; f.lx=f.ax-w.x; f.ly=f.ay-w.y; f.face=w.facing; }
  w.events.push({type:'jump',x:w.x,y:Math.max(w.feet[0].py,w.feet[1].py)});
}
function stepAir(w,world,input,dt,o){
  const F=w.facing, up=w.vy<0;
  w.grabCd-=dt;
  w.vy+=CFG.gravity*dt; w.vx+=clamp(input,-1,1)*45*dt;
  w.airOm+=(-CFG.rightK*w.airRot-CFG.rightC*w.airOm)*dt; w.airRot+=w.airOm*dt;             // body spin, pulled back upright
  w.airLegV+=(-CFG.legSwingK*w.airLeg-CFG.legSwingC*w.airLegV)*dt; w.airLeg+=w.airLegV*dt;   // legs swinging through and back
  let nx=clamp(w.x+w.vx*dt,world.x0,world.x1); const ny=w.y+w.vy*dt;
  // anything to catch hold of? a vine within arm's reach, a ledge lip, an ivy face
  const hit=nearestGrip(world,nx+F*2,ny-20,w.grabCd);
  if(hit){ w.x=nx; w.y=ny; grabVine(w,hit); return; }
  const le=ledgeCatch(w,world,ny); if(le){ grabLedge(w,le); return; }
  const wl=wallCatch(w,world,nx,ny); if(wl){ w.y=ny; grabWall(w,wl); return; }
  if(w.flip){ w.flip.th+=F*2*Math.PI*CFG.flipSpin*dt; w.x=nx; w.y=ny; w.label='flipping';
    for(const f of w.feet){ f.ax=w.x+f.lx; f.ay=w.y+f.ly; }
    if(w.vy>0 && w.y+13>=world.yAt(w.x)){ w.y=world.yAt(w.x)-13;
      if(Math.abs(w.vx)>25&&canRoll(w,world)){ w.flip=null; w.mode='walk'; startRoll(w,world); }
      else { w.flip=null; for(const f of w.feet){ f.ly=world.yAt(w.x)-w.y-CFG.ankleH; f.ay=w.y+f.ly; } land(w,world); } }
    return; }
  // legs: tuck on the way up, reach for the ground on the way down (further with the foot that is over lower ground)
  const g=[world.yAt(nx+w.feet[0].lx),world.yAt(nx+w.feet[1].lx)], gHi=Math.min(g[0],g[1]), dMax=Math.min(Math.max(g[0],g[1])-gHi,10);
  const lyLow=Math.min(28.4,26.5+dMax), reach=clamp(Math.abs(w.vx)*0.06,0,4.5);
  for(let i=0;i<2;i++){ const f=w.feet[i], lead=i===1;
    const tx0=F*(up?(lead?5:-5.5):(lead?3+reach:-2.5+reach*0.5)), ty0=up?(lead?20:23):lyLow-(dMax-Math.min(g[i]-gHi,10));
    const R=w.airRot-F*w.airLeg*(lead?1:0.8), c=Math.cos(R), sn=Math.sin(R);          // legs turn with the body and swing on their own
    const tx=tx0*c-ty0*sn, ty=tx0*sn+ty0*c;
    f.lx+=(tx-f.lx)*(1-Math.exp(-11*dt)); f.ly+=(ty-f.ly)*(1-Math.exp(-(up?10:17)*dt));
    const d=Math.hypot(f.lx,f.ly); if(d>LMAX-0.6){ f.lx*=(LMAX-0.6)/d; f.ly*=(LMAX-0.6)/d; }
    f.pitch+=((up?0.55:0.12)-f.pitch)*(1-Math.exp(-12*dt)); }
  // a riser taller than we can clear stops us dead
  const sgn=Math.sign(w.vx)||F, probe=nx+sgn*(Math.max(Math.abs(w.feet[0].lx),Math.abs(w.feet[1].lx))+CFG.footToe+1);
  const sole=ny+Math.max(w.feet[0].ly,w.feet[1].ly)+CFG.ankleH;
  if(world.yAt(probe)<sole-4){ nx=w.x; w.vx=0; }
  w.x=nx; w.y=ny;
  for(const f of w.feet){ f.ax=w.x+f.lx; f.ay=w.y+f.ly; }
  upper(w,dt,o,walkF(Math.abs(w.vx)),0);
  w.label='in the air';
  if(w.vy>0){ let pen=-Infinity, gb=world.yAt(w.x); for(const f of w.feet){ const gf=world.yAt(f.ax); if(gf<gb-CFG.maxStepUp) continue; pen=Math.max(pen,f.ay+CFG.ankleH-gf); }   // a foot still over the ledge he left doesn't count
    if(pen>=0){ w.y-=pen; for(const f of w.feet) f.ay-=pen; land(w,world); } }
}
function land(w,world){ w.stopX=null;
  const hard=w.vy>250&&Math.abs(w.vx)>25&&canRoll(w,world);
  w.mode='walk'; w.des=w.y; w.landSquat=clamp(w.vy/24,3,9.5)*vary(w,0.15); w.landHold=0.10;
  w.events.push({type:'land',x:w.x,y:world.yAt(w.x),speed:w.vy,stone:world.s[world.indexAt(w.x)].w<40}); w.vy=0;
  for(const f of w.feet){ const si=world.indexAt(f.ax), r=footRange(world,si,w.facing);     // each boot gets a few frames to find a legal spot
    f.py=world.yAt(clamp(f.ax,r[0],r[1])); aim(w,world,f,si,clamp(f.ax,r[0],r[1]),0.07,true,0); }
  if(hard) startRoll(w,world);                                                             // a long drop rolls out
}

/* =====================  CRAWLING: two hands and two knees, each planted until the body has moved past it  ===================== */
function crawlLimbs(w,world){
  const F=w.facing, mk=(rest,off)=>{ const x=w.x+F*(rest+off); return {rest:rest,x:x,y:world.yAt(x),planted:true,t:0,sx:0,sy:0,tx:x,ty:0}; };
  w.crawl={hands:[mk(20.5,2.4),mk(20.5,-2.4)],knees:[mk(1.5,-2.4),mk(1.5,2.4)],pitch:w.crawl?w.crawl.pitch:0.4};
}
function enterCrawl(w,world){ startFade(w,0.40); w.mode='crawl'; w.reading=w.dancing=false; w.act=null; w.jump=null; w.vx*=0.3; crawlLimbs(w,world); w.events.push({type:'pat'}); }
function standUp(w,world){ w.stopX=null;
  startFade(w,0.45); w.mode='walk'; w.crawl=null; w.roll=null;
  const si=world.indexAt(w.x), r=footRange(world,si,w.facing);
  w.feet.forEach((f,i)=>{ f.planted=true; f.settle=false; f.si=si; f.px=clamp(w.x+(i?1.6:-1.6),r[0],r[1]); f.py=world.yAt(f.px); f.face=w.facing; f.heel=f.landPitch=f.pitch=0;
    const a=ankleFor(f.px,f.py,0,f.face); f.ax=a[0]; f.ay=a[1]; });
  w.des=w.y; w.by=w.y; w.bv=0; w.kneeF=w.facing; w.squat=0;
}
function stepCrawl(w,world,input,dt){
  if(input&&Math.sign(input)!==w.facing){ startFade(w,0.32); w.facing=w.dir=Math.sign(input); crawlLimbs(w,world); }   // shuffle round
  const F=w.facing, c=w.crawl;
  const slow=Math.min(world.s[world.indexAt(w.x)].w,world.s[world.indexAt(w.x+F*20)].w)<40?0.7:1;
  w.vx+=clamp(clamp(input,-1,1)*CFG.crawlSpeed*slow-w.vx,-CFG.crawlAccel*dt,CFG.crawlAccel*dt);
  w.x=clamp(w.x+w.vx*dt,world.x0,world.x1);
  for(const set of [c.hands,c.knees]) for(let i=0;i<2;i++){ const L=set[i], other=set[1-i];
    if(!L.planted){ L.t+=dt/0.26; const u=ss(L.t); L.x=lerp(L.sx,L.tx,u); L.y=lerp(L.sy,L.ty,u)-(set===c.hands?3:1.6)*Math.sin(Math.PI*clamp(L.t,0,1));
      if(L.t>=1){ L.planted=true; L.x=L.tx; L.y=L.ty; if(set===c.hands) w.events.push({type:'pat'}); } }
    else if(other.planted && (w.x+F*L.rest-L.x)*F>CFG.crawlStride/2 && Math.abs(w.vx)>1){
      let tx=w.x+F*(L.rest+CFG.crawlStride/2*vary(w,0.12))+w.vx*0.26; const s=world.s[world.indexAt(tx)];
      tx=s.w<5?(s.x0+s.x1)/2:clamp(tx,s.x0+2.4,s.x1-2.4);
      L.planted=false; L.t=0; L.sx=L.x; L.sy=L.y; L.tx=tx; L.ty=s.y; } }
  // hips hang between the knees, shoulders between the hands; the spine takes whatever slope that gives
  let hy=-Infinity; for(const K of c.knees){ const dx=Math.min(Math.abs(K.x-w.x),12); hy=Math.max(hy,K.y-1.8-Math.sqrt(CFG.thigh*CFG.thigh-dx*dx)); }
  w.y+=(hy-w.y)*(1-Math.exp(-11*dt));
  const shY=(c.hands[0].y+c.hands[1].y)/2-17.3, pT=Math.acos(clamp((w.y-shY)/CFG.torso,-0.4,0.97));
  c.pitch+=(pT-c.pitch)*(1-Math.exp(-10*dt));
  const hip={x:w.x,y:w.y}, tx=F*Math.sin(c.pitch), ty=-Math.cos(c.pitch);
  const neck={x:hip.x+tx*CFG.torso,y:hip.y+ty*CFG.torso}, sh={x:neck.x-tx*2.4,y:neck.y-ty*2.4};
  const ha=F*(c.pitch-0.8), hl=CFG.neck+CFG.headR, head={x:neck.x+Math.sin(ha)*hl,y:neck.y-Math.cos(ha)*hl,a:F*0.3};
  const legs=[],arms=[];
  for(let i=0;i<2;i++){
    const K=c.knees[i], k=bone(hip.x,hip.y,K.x,K.y-1.8,CFG.thigh), bx=k[0]-F*CFG.shin, a=bone(k[0],k[1],bx,world.yAt(bx)-2,CFG.shin);
    legs.push({kx:k[0],ky:k[1],ax:a[0],ay:a[1],pitch:2.6,face:F});                    // boot laid back, sole up
    const H=c.hands[i], e=solve2(sh.x,sh.y,H.x,H.y-1.4,CFG.upperArm,CFG.foreArm,-F);
    arms.push({ex:e.kx,ey:e.ky,hx:e.ax,hy:e.ay});

  return {hip:hip,neck:neck,head:head,sh:sh,legs:legs,arms:arms,face:F,prop:null};

/* =====================  TUMBLE ROLL: one tucked shape turned through a full circle, kept resting on the ground  ===================== */
const TUCK=(function(){
  const hip=[-8,4], P=(p,ang,len)=>[p[0]+Math.sin(ang)*len,p[1]+Math.cos(ang)*len];      // ang measured from straight down, forward +
  const neck=P(hip,Math.PI-1.3,CFG.torso), sh=[neck[0]-(neck[0]-hip[0])/CFG.torso*2.4,neck[1]-(neck[1]-hip[1])/CFG.torso*2.4];
  const head=P(neck,Math.PI-2.75,CFG.neck+CFG.headR), knee=P(hip,2.05,CFG.thigh), ankle=P(knee,-0.75,CFG.shin);
  const elbow=P(sh,-0.1,CFG.upperArm), hand=P(elbow,1.5,CFG.foreArm);
  const T={hip:hip,neck:neck,sh:sh,head:head,knee:knee,ankle:ankle,elbow:elbow,hand:hand}, pad={hip:5.6,neck:5.2,sh:0,head:CFG.headR+0.6,knee:2.8,ankle:4,elbow:2.2,hand:2.2};
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const n in T){ x0=Math.min(x0,T[n][0]-pad[n]); x1=Math.max(x1,T[n][0]+pad[n]); y0=Math.min(y0,T[n][1]-pad[n]); y1=Math.max(y1,T[n][1]+pad[n]); }
  for(const n in T){ T[n][0]-=(x0+x1)/2; T[n][1]-=(y0+y1)/2; }                          // turn about the middle of the ball
  T.pad=pad; return T;
})();
function canRoll(w,world){ const g=world.yAt(w.x), reach=lerp(CFG.rollDist,CFG.rollDistRun,clamp(Math.abs(w.vx)/CFG.runSpeed,0,1)); for(let k=8;k<=reach+10;k+=6) if(world.yAt(w.x+w.facing*k)<g-3) return false; return true; }
function startRoll(w,world){ startFade(w,0.15); w.mode='roll'; w.dancing=false; w.act=null; w.jump=null; w.roll={t:0,cy:null,dist:lerp(CFG.rollDist,CFG.rollDistRun,clamp(Math.abs(w.vx)/CFG.runSpeed,0,1))}; w.events.push({type:'roll',x:w.x,y:world.yAt(w.x)}); }
function stepRoll(w,world,input,dt){
  const r=w.roll, F=w.facing, T=r.T||(r.T=CFG.rollTime*vary(w,0.07)); r.t+=dt; const s=clamp(r.t/T,0,1);
  w.vx=F*r.dist/T*(1.2-0.4*s); w.x=clamp(w.x+w.vx*dt,world.x0,world.x1);
  const th=F*2*Math.PI*lerp(s,ss(s),0.35);
  const j0=tuckPose(w,w.x,0,th,F).J; let cy=Infinity;
  for(const n in j0) cy=Math.min(cy,world.yAt(j0[n].x)-j0[n].y-TUCK.pad[n]);
  r.cy = r.cy==null ? cy : (cy<r.cy?cy:r.cy+(cy-r.cy)*(1-Math.exp(-22*dt)));           // never sink into the ground; settle down gently
  const P=tuckPose(w,w.x,r.cy,th,F), a={x:P.legs[0].ax,y:P.legs[0].ay};
  w.y=P.hip.y; w.lean=th; w.label='rolling';
  if(s>=1){ const hx=P.hip.x; standUp(w,world); w.x=clamp(hx,world.x0,world.x1);               // come up into a crouch and let the walk stand us up
    const si=world.indexAt(w.x), rg=footRange(world,si,F);
    w.feet.forEach((f,i)=>{ f.si=si; f.px=clamp(a.x+(i?0.8:-0.8),rg[0],rg[1]); f.py=world.yAt(f.px); const an=ankleFor(f.px,f.py,0,F); f.ax=an[0]; f.ay=an[1]; });
    w.vx=F*Math.min(Math.abs(w.vx),input*F>0.1?44:18); w.lean=F*0.5; if(w.fade){ w.fade.dur=0.24; w.fade.x0=w.x; } w.events.push({type:'land',x:w.x,y:world.s[si].y,speed:60,stone:world.s[si].w<40}); }
  return P;
}

/* =====================  REACH POSE: a body placed by where its hands and feet are  ===================== */
function reachPose(w,hip,torsoAng,hands,ankles,headTilt,elbowS,kneeS){
  const F=w.facing;
  const neck={x:hip.x+Math.sin(torsoAng)*CFG.torso, y:hip.y-Math.cos(torsoAng)*CFG.torso};
  const tx=(neck.x-hip.x)/CFG.torso, ty=(neck.y-hip.y)/CFG.torso;
  const sh={x:neck.x-tx*2.4, y:neck.y-ty*2.4};
  const ha=torsoAng+F*headTilt, hl=CFG.neck+CFG.headR;
  const head={x:neck.x+Math.sin(ha)*hl, y:neck.y-Math.cos(ha)*hl, a:ha};
  const legs=[],arms=[];
  for(let i=0;i<2;i++){
    const A=ankles[i], L=solve2(hip.x,hip.y,A.x,A.y,CFG.thigh,CFG.shin,A.knee?-kneeS:kneeS);
    L.pitch=A.pitch||0; L.face=A.face||F; legs.push(L);
    const H=hands[i], e=solve2(sh.x,sh.y,H.x,H.y,CFG.upperArm,CFG.foreArm,H.elbow?-elbowS:elbowS);
    arms.push({ex:e.kx,ey:e.ky,hx:e.ax,hy:e.ay});
  }
  return {hip:hip,neck:neck,head:head,sh:sh,legs:legs,arms:arms,face:F,prop:null};
}

/* =====================  VINES  ===================== */
/* A vine is a chain of short links. The swing itself is still the simple pendulum below;
   the chain is what you see: taut from the anchor to the hands, the tail below them free to trail and whip. */
const RN=16;
function ropeInit(v){ v.seg=v.len/RN; v.pts=[]; v.wind=v.ax*0.013;
  for(let i=0;i<=RN;i++){ const L=v.seg*i, x=v.ax+Math.sin(v.th)*L, y=v.ay+Math.cos(v.th)*L; v.pts.push({x:x,y:y,ox:x,oy:y}); } }
function stepVines(world,dt,heldBy,time){
  for(const v of world.vines){
    if(!v.pts) ropeInit(v);
    const P=v.pts, held=v===heldBy; v.held=held;
    const wind=(Math.sin(time*0.6+v.wind)*7+Math.sin(time*1.7+v.wind*3)*3)*dt*dt;
    for(let i=1;i<=RN;i++){ const p=P[i], vx=(p.x-p.ox)*0.992, vy=(p.y-p.oy)*0.992;
      p.ox=p.x; p.oy=p.y; p.x+=vx+wind*i/RN; p.y+=vy+CFG.gravity*dt*dt; }
    let k=0, g=null;
    const pin=()=>{ for(let i=1;i<=k;i++){ const u=i/k; P[i].x=v.ax+(g.x-v.ax)*u; P[i].y=v.ay+(g.y-v.ay)*u; } };
    if(held){ g=gripAt(v,v.hold); k=clamp(Math.round(v.hold/v.seg),1,RN); pin(); }
    for(let it=0;it<10;it++){
      for(let i=1;i<=RN;i++){ const A=P[i-1], B=P[i]; let dx=B.x-A.x, dy=B.y-A.y; const d=Math.hypot(dx,dy)||1e-6, e=(d-v.seg)/d;
        if(i-1===0||i-1<=k){ B.x-=dx*e; B.y-=dy*e; } else { A.x+=dx*e*0.5; A.y+=dy*e*0.5; B.x-=dx*e*0.5; B.y-=dy*e*0.5; } }
      if(held) pin();
    }
    for(let i=1;i<=RN;i++){ const q=P[i], gy=world.yAt(q.x)-0.8; if(q.y>gy){ q.y=gy; q.ox=q.x+(q.ox-q.x)*0.4; } }   // the tail lies on the ground
    if(!held){ const m=P[Math.round(RN*0.6)]; v.th=Math.atan2(m.x-v.ax,m.y-v.ay); v.om=0; }
  }
}
function gripAt(v,L){ return {x:v.ax+Math.sin(v.th)*L, y:v.ay+Math.cos(v.th)*L}; }
function nearestGrip(world,hx,hy,cd){                    // the closest point on any rope, as it actually hangs
  if(cd>0) return null; let best=null;
  for(const v of world.vines){ if(!v.pts) continue;
    for(let i=1;i<=RN;i++){ const A=v.pts[i-1], B=v.pts[i], dx=B.x-A.x, dy=B.y-A.y;
      const u=clamp(((hx-A.x)*dx+(hy-A.y)*dy)/(dx*dx+dy*dy||1),0,1), along=(i-1+u)*v.seg;
      if(along<CFG.gripMin) continue;
      const px=A.x+dx*u, py=A.y+dy*u, d=Math.hypot(hx-px,hy-py);
      if(d<CFG.grabR&&(!best||d<best.d)) best={v:v,L:along,d:d,x:px,y:py}; } }
  return best;
}
function grabVine(w,hit){
  const v=hit.v, Le=hit.L+CFG.hangCM;
  if(hit.x!=null) v.th=Math.atan2(hit.x-v.ax,hit.y-v.ay);                    // the swing starts where the rope really is
  v.om=(w.vx*Math.cos(v.th)-w.vy*Math.sin(v.th))/Le;                    // carry the speed we arrived with into the swing
  startFade(w,0.16); w.mode='vine'; w.vine=v; w.grip=hit.L; w.flip=null; w.jump=null; w.act=null; w.events.push({type:'grab'});
}
function stepVine(w,world,input,dt){
  const v=w.vine; v.held=true; v.hold=w.grip;
  const Le=w.grip+CFG.hangCM;
  const k=CFG.swingG*CFG.gravity/Le;
  v.om+=(-k*Math.sin(v.th)-CFG.vineDamp*v.om+CFG.vinePump*clamp(input,-1,1))*dt;                       // hold the way you are going to pump the swing
  const hi=k*(1-Math.cos(CFG.vineArc)), here=k*(1-Math.cos(v.th));                         // no pumping past a quarter turn, and no unwinding over the top
  if(0.5*v.om*v.om+here>hi) v.om=Math.sign(v.om)*Math.sqrt(Math.max(0,2*(hi-here)));
  v.om=clamp(v.om,-CFG.vineTop/Le,CFG.vineTop/Le);
  v.th+=v.om*dt;
  if(w.climbHeld||w.downHeld) w.grip=clamp(w.grip+(w.climbHeld?-1:1)*CFG.shinny*(0.4+0.6*w.vertAmt)*dt,CFG.gripMin,v.len);
  if(Math.sign(v.om*Math.cos(v.th))) { const d=Math.sign(v.om); if(d&&d!==w.facing&&Math.abs(v.om)>0.25){ startFade(w,0.18); w.facing=w.dir=d; } }
  const g=gripAt(v,w.grip), F=w.facing;
  // the body hangs along gravity plus the swing's own outward pull, not along the rope: upright at the ends, in line at the bottom
  const cf=v.om*v.om*Le, ax=cf*Math.sin(v.th), ay=CFG.swingG*CFG.gravity+cf*Math.cos(v.th), an=Math.hypot(ax,ay)||1;
  const bx=ax/an, by=ay/an, bodyA=Math.atan2(-bx,by);
  w.x=g.x+bx*36; w.y=g.y+by*36;
  w.vx=Le*v.om*Math.cos(v.th); w.vy=-Le*v.om*Math.sin(v.th);
  // the pump: knees tucked under at the back of the arc, legs thrown out in front at the top of the forward swing
  let swing=clamp(v.th*F*1.25+v.om*F*0.30+0.12*wobble(w,7,w.time*1.1),-0.75,1.1), reach=lerp(19,31,ss((swing+0.75)/1.75));
  if(w.climbHeld){ swing=-0.12; reach=18; }                                               // shinnying: knees gripping the rope
  w.legA+=(swing-w.legA)*(1-Math.exp(-14*dt)); w.legL+=(reach-w.legL)*(1-Math.exp(-11*dt));
  const ank=[0,1].map(i=>{ const a2=F*(w.legA+(i?0.19:-0.16)), c=Math.cos(a2), sn=Math.sin(a2),   // the legs are never quite together
      dx=bx*c+by*sn, dy=by*c-bx*sn, L=w.legL+(i?1.6:-1.2);
    return {x:w.x+dx*L+F*(i?2:-2), y:w.y+dy*L, pitch:0.1+w.legA*0.55}; });
  const hands=[{x:g.x+F*1.2,y:g.y+1.2},{x:g.x-F*0.6,y:g.y-0.4}];
  w.bodyOm=w._pb==null?0:(bodyA-w._pb)/dt; w._pb=bodyA;                      // how fast the body is turning, and the legs swinging,
  w.legV=w._pl==null?0:(w.legA-w._pl)/dt; w._pl=w.legA;                      // to carry into the air on release
  w.lean=bodyA;
  w.label='swinging'+(w.climbHeld?' (climbing the vine)':'');
  return reachPose(w,{x:w.x,y:w.y},bodyA,hands,ank,0.12,-F,F);
}
function letGo(w,kick){
  const v=w.vine, Le=w.grip+CFG.hangCM;
  w.vx=Le*v.om*Math.cos(v.th); w.vy=-Le*v.om*Math.sin(v.th)-(kick?CFG.releaseKick:0);
  // the swing doesn't stop when the hands open: the body keeps turning the way it was going, the legs keep swinging,
  // and he has to fight both back upright before he lands
  const F=w.facing;
  w.airRot=w.lean; w.airOm=-v.om*0.85*vary(w,0.15)+jitter(w,0.35);           // the whole body was turning with the rope
  w.airLeg=w.legA||0; w.airLegV=(w.legV||0)*0.6+v.om*F*0.9*vary(w,0.2);      // and the legs carry on the way they were swinging
  w.lean=0; w._pb=w._pl=null;
  v.held=false; w.vine=null; w.grabCd=0.3; toAir(w);
}
function toAir(w){ startFade(w,0.14); w.mode='air'; w.jump=null;
  for(const f of w.feet){ f.planted=false; f.lx=clamp(f.ax-w.x,-14,14); f.ly=clamp(f.ay-w.y,-8,30); f.face=w.facing; } }

/* =====================  LEDGES: catch the lip, hang, pull up  ===================== */
function hangHip(e){ return {x:e.x-e.hi*5, y:e.y+34}; }
function ledgeCatch(w,world,ny){
  if(w.grabCd>0||w.vy<-40) return null;
  for(const e of world.edges){ const h=hangHip(e);
    if(Math.abs(w.x-h.x)<11 && ny>h.y-16 && ny<h.y+13 && (w.x-e.x)*e.hi<0) return e; }
  return null;
}
function grabLedge(w,e){ startFade(w,0.2); w.mode='hang'; w.hang=e; w.limbT=0; w.flip=null; w.vy=w.vx=0; w.facing=w.dir=e.hi; w.events.push({type:'grab'}); }
function stepHang(w,world,input,dt){
  const e=w.hang, F=e.hi, h=hangHip(e);
  w.limbT+=dt; const br=Math.sin(w.limbT*1.6)*0.5;
  w.x+=(h.x-w.x)*(1-Math.exp(-14*dt)); w.y+=(h.y+br-w.y)*(1-Math.exp(-14*dt)); w.vx=w.vy=0;
  if(w.downHeld||input*F<-0.5){ w.grabCd=0.28; w.hang=null; toAir(w); return w.last; }        // let go and drop
  if(w.climbHeld||input*F>0.5) startMantle(w,e);                                              // pull up
  const hands=[{x:e.x-F*1.6,y:e.y+1.2},{x:e.x-F*3.4,y:e.y+1.6}];
  const ank=[{x:w.x-F*1.5,y:w.y+28,pitch:0.5},{x:w.x+F*3,y:w.y+26,pitch:0.4}];
  w.lean=0; w.label='hanging on';
  return reachPose(w,{x:w.x,y:w.y},0,hands,ank,-0.18,-F,F);
}
function startMantle(w,e){ w.mode='mantle'; w.hang=null; w.wall=null; w.mantle={e:e,t:0,x0:w.x,y0:w.y}; w.facing=w.dir=e.hi; }
function stepMantle(w,world,dt){
  const m=w.mantle, e=m.e, F=e.hi, t=clamp(m.t+=dt/CFG.mantleTime,0,1);
  const topY=e.y-(CFG.ankleH+LEG-CFG.crouchWalk-3);
  const pull=ss(clamp(t/0.5,0,1)), rise=ss(clamp((t-0.45)/0.55,0,1)), fwd=ss(clamp((t-0.5)/0.5,0,1));
  w.x=lerp(m.x0,e.x+F*11,fwd); w.y=lerp(lerp(m.y0,e.y+18,pull),topY,rise); w.vx=w.vy=0;   // chest to the lip, then stand up over it
  const mix=(A,B,u)=>({x:lerp(A.x,B.x,u),y:lerp(A.y,B.y,u)});
  const slip=ss(clamp((t-0.62)/0.38,0,1));
  const hands=[mix({x:e.x-F*1.6,y:e.y+1.2},{x:w.x+F*5.5,y:w.y-3},slip),
               mix({x:e.x-F*3.6,y:e.y+1.6},{x:w.x-F*2,y:w.y+1},slip)];
  const tuck=ss(clamp(t/0.45,0,1)), plantA=ss(clamp((t-0.4)/0.35,0,1)), plantB=ss(clamp((t-0.62)/0.38,0,1));
  const ank=[mix(mix({x:m.x0-F*2,y:m.y0+28},{x:e.x-F*6,y:e.y+15},tuck),{x:e.x+F*7,y:e.y-CFG.ankleH},plantA),
             mix({x:m.x0+F*2,y:m.y0+26},{x:e.x+F*16,y:e.y-CFG.ankleH},plantB)];
  ank[0].pitch=lerp(0.4,0.05,plantA); ank[1].pitch=lerp(0.4,0.05,plantB); ank[0].knee=1;
  w.lean=F*(0.15+0.5*fwd*(1-fwd)*2); w.label='pulling up';
  const P=reachPose(w,{x:w.x,y:w.y},w.lean,hands,ank,0.1,-F,F);
  if(t>=1){ startFade(w,0.2); w.mantle=null; standUp(w,world); w.events.push({type:'land',x:w.x,y:world.yAt(w.x),speed:40,stone:true}); }
  return P;
}

/* =====================  IVY WALLS: four limbs on the face, hand over hand  ===================== */
function wallCatch(w,world,nx,ny){
  if(w.grabCd>0) return null;
  for(const e of world.edges){ if(!e.climb) continue;
    const face=-e.hi;                                                   // we cling to the low side of the face
    if(Math.abs(nx-(e.x+face*9))<10 && ny>e.y+12 && ny<e.floor-16) return e; }
  return null;
}
function grabWall(w,e){ startFade(w,0.2); w.mode='wall'; w.wall=e; w.flip=null; w.vine=null; w.vx=w.vy=0; w.facing=w.dir=e.hi; w.events.push({type:'pat'}); }
function stepWall(w,world,input,dt){
  const e=w.wall, F=e.hi, face=-F;
  const v=(w.climbHeld||input*F>0.5?-1:(w.downHeld||input*F<-0.5?1:0))*CFG.climbSpeed*(0.45+0.55*Math.max(w.vertAmt,Math.min(Math.abs(input),1)));
  w.y=clamp(w.y+v*dt,e.y+8,e.floor-CFG.ankleH-8); w.x+=(e.x+face*9-w.x)*(1-Math.exp(-12*dt));
  w.vx=0; w.vy=v; w.limbT+=Math.abs(v)*dt*0.16*(1+0.3*wobble(w,9,w.time*0.9));
  if(v<0&&w.y<=e.y+10){ startMantle(w,e); return w.last; }                                    // topped out
  if(v>0&&w.y>=e.floor-CFG.ankleH-9){ w.grabCd=0.25; w.wall=null; toAir(w); return w.last; }   // reached the bottom
  const ph=Math.sin(w.limbT), hands=[0,1].map(i=>({x:e.x+face*2.6,y:w.y-19+(i?ph:-ph)*5.5}));
  const ank=[0,1].map(i=>({x:e.x+face*4.5,y:w.y+15-(i?ph:-ph)*5,pitch:-0.5}));
  w.lean=0; w.label = v?'climbing the ivy':'on the wall';
  return reachPose(w,{x:w.x,y:w.y},0,hands,ank,-F*0.1,-F,F);
}

/* =====================  AIR FLIP: the roll's tuck, turned in mid-air  ===================== */
function tuckPose(w,cx,cy,th,F){
  const J={}; for(const n in TUCK){ if(n==='pad')continue; const p=TUCK[n], lx=F*p[0];
    J[n]={x:cx+lx*Math.cos(th)-p[1]*Math.sin(th), y:cy+lx*Math.sin(th)+p[1]*Math.cos(th)}; }
  const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
  J.head.a=wrap(th+F*0.9);
  const legs=[0,1].map(()=>({kx:J.knee.x,ky:J.knee.y,ax:J.ankle.x,ay:J.ankle.y,pitch:wrap(0.35+th),face:F}));
  const arms=[0,1].map(()=>({ex:J.elbow.x,ey:J.elbow.y,hx:J.hand.x,hy:J.hand.y}));
  return {hip:J.hip,neck:J.neck,head:J.head,sh:J.sh,legs:legs,arms:arms,face:F,prop:null,J:J};
}
