// ENGINE-START  (pure JS, no DOM — drop this block into any game)

    span(x) {                                        // the flat span under x, base-ground gaps included

  // A pose is a flat set of numbers. Limb angles are radians from "straight down" (+ = forward).
  // torso/head are from "straight up" (+ = lean forward). 1 = far limb (behind), 2 = near limb (front).

  const BASE = { hx: 0, lift: 0, rot: 0, turn: 0, torso: 0, head: 0, sword: 0, wrist: 0, pivot: 0,
    ua1: .12, la1: .25, ua2: -.1, la2: .25, ul1: .02, ll1: .06, f1: H, tf1: 0, ul2: -.02, ll2: .06, f2: H, tf2: 0 };   // tf = toe flex at the ball

  // Gait helper: walk, run and crawl come out of this one function
  function gait(ph, A, bend, lean, armA, armBend) {

    stride: true,                                               // legs driven by the Stride cycle (hips lead, feet follow)
    walkSpeed: 56, runSpeed: 120, accel: 420, decel: 560, stopDecel: 300, stopLead: 1.8, stopExtra: 7,
    cadenceUp: 2.15, cadenceDown: 2.4,
    stepMin: 10, stepMax: 29, swingSlow: .40, swingFast: .34, swingRun: .22, swingStair: .34, swingSettle: .20,

      indexAt(px) { let lo = 0, hi = s.length - 1; if (px <= s[0].x0) return 0; if (px >= s[hi].x1) return hi;

    for (let i = 1; i < s.length; i++) { const d = s[i].y - sy(s[i - 1], s[i].x0); if (Math.abs(d) <= CFG.maxStepUp) continue;

  const sy = (sf, x) => sf.y + (sf.g || 0) * (x - sf.x0);        // height of a surface at x (slopes included)
  function footRange(world, i, dir) {

  // Ankle position for a planted foot: heel-up pitch pivots on the ball, toe-up pitch pivots on the heel

  }
  function createWalker(world, x, seed) {
    const si = world.indexAt(x), gy = world.yAt(x);
    const mk = px => ({ px, py: gy, si, face: 1, planted: true, pitch: 0, heel: 0, landPitch: 0, slopeP: 0, ax: px, ay: gy - CFG.ankleH,
      settle: false, back: 0, t: 0, T: 1, sx: 0, sy: 0, sp: 0, tx: px, ty: gy, tsi: si, tax: px, tay: gy - CFG.ankleH, tp: 0, lift: 0, prof: 'flat' });
    const hy = gy - (CFG.ankleH + LEG - CFG.crouchIdle);
    const w = { world, x, y: hy, des: hy, by: hy, bv: 0, vx: 0, dir: 1, facing: 1, feet: [mk(x - 1.6), mk(x + 1.6)], arm: [0, 0], armB: [.22, .22], lean: 0,
      kneeF: 1, exert: 0, idleT: 0, shift: 0, gaze: 0, grade: 0, stair: 0, hurry: 0, climbing: false, tread: 999, S: CFG.stepMin, thr: 2.5, time: 0, steps: 0, events: [],
      mode: 'walk', label: 'standing', stopX: null, stopV: 6, hitV: 0, strideVar: 1, armVar: 1, elbowVar: 0, squat: 0, sway: 0, headAdd: 0, load: 0,
      reading: false, dancing: false, jump: null, act: null, pick: null, pickShift: 0, landHold: 0, _rf: 0, onFall: null, onTurn: null };

  }
  const destX = f => f.planted ? f.px : f.tx;
  function paceFor(a) { const m = Math.abs(a); return Math.sign(a) * (m <= 1 ? m * CFG.walkSpeed : lerp(CFG.walkSpeed, CFG.runSpeed, m - 1)); }
  const walkF = sp => clamp(sp / CFG.walkSpeed, 0, 1), runF = sp => clamp((sp - CFG.walkSpeed) / (CFG.runSpeed - CFG.walkSpeed), 0, 1);
  const strideFor = sp => lerp(CFG.stepMin, CFG.stepMax, walkF(sp)) + runF(sp) * (CFG.stepRun - CFG.stepMax);
  const swingFor = sp => lerp(CFG.swingSlow, CFG.swingFast, walkF(sp)) - runF(sp) * (CFG.swingFast - CFG.swingRun);
  // Where should the swinging foot come down? Predict where the hips will be at landing and reach half a step past that.
  function pickTarget(w, world, o, goalV, Trem) {
    const dir = w.dir, rate = (Math.abs(goalV) < Math.abs(w.vx) ? CFG.decel : CFG.accel) * Trem;
    const dv = clamp(goalV - w.vx, -rate, rate), vLand = w.vx + dv, vAvg = w.vx + dv * .5;
    const sfL = walkF(Math.abs(vLand)), S = strideFor(Math.abs(vLand)) * (w.strideVar || 1); w._rf = runF(Math.abs(vLand));
    let xf = w.x + vAvg * Trem + dir * S * .5;

    xf = dir > 0 ? Math.min(xf, o.px + reach) : Math.max(xf, o.px - reach);
    const j = o.si; let i = world.indexAt(xf);
    if ((i - j) * dir > 1) {                                  // never skip a tread — unless running on shallow steps, where a stride takes two if the rise fits
      const i2 = clamp(j + 2 * dir, 0, world.s.length - 1), s2 = world.s[i2], x2 = clamp(xf, s2.x0, s2.x1);                     // the two-tread candidate
      const down = sy(s2, x2) > sy(world.s[j], o.px), rise = Math.abs(sy(s2, x2) - sy(world.s[j], o.px)), span2 = 2 * world.s[j].w;   // two treads must fit both the step height and the leg; dropping two is easier than climbing two
      i = (w.hurry > .3 && rise <= (down ? CFG.maxStepDown : CFG.maxStepUp) && span2 <= LEG * (down ? 1.35 : 1.05) && Math.abs(vLand) > CFG.walkSpeed * .55) ? i2 : j + dir; }
    if ((i - j) * dir < 0) i = j;

    const dy = sy(world.s[i], xf) - sy(world.s[j], o.px);     // a face too tall to step: stay on this surface
    if (dy < -CFG.maxStepUp || dy > CFG.maxStepDown) i = j;
    if (i === j && (xf - o.px) * dir < 4) xf = o.px + dir * 4; // always land ahead of the other foot

  }
  function aim(w, world, f, i, tx, T, settle, sf) {
    const ty = sy(world.s[i], tx), dy = ty - f.py, slopeP = Math.atan(world.s[i].g || 0) * w.facing;   // on a ramp the sole lies along the slope
    f.prof = world.s[i].g ? 'flat' : (dy < -.5 ? 'up' : (dy > .5 ? 'down' : 'flat'));
    if (f.prof !== 'flat' && !settle) T = Math.max(T, CFG.swingStair * (1 - .3 * w.hurry) * (Math.abs(dy) > 9 ? 1.35 : 1) * (f.planted ? 1 : .6));   // a two-tread stride takes a little longer

  function startStep(w, world, f, o, settle, goalV) {

    else { w.strideVar = vary(w, .07); const still = Math.abs(w.vx) < 20; const T0 = swingFor(Math.abs(w.vx)) * vary(w, .06) * (still ? .72 : 1); const tg = pickTarget(w, world, o, goalV, T0);

  function swingPose(f) {

      if (REVIEW.on) { if (REVIEW.live > 0) { const was = REVIEW.live; REVIEW.live -= dt; scUpdate(dt); SC.player.visible = false; SC.player.health = 100; if (was > 5.5 && REVIEW.live <= 5.5) for (const z of SC.zombies) if (z.alive) { z.state = 'chase'; z.alert = 1.2; z.lostT = 0; } if (REVIEW.live <= 0) { reviewGo(REVIEW.i); break; } } else _T += dt; CUR_W = SC.world; Object.assign(cam, REVIEW.cam, { tx: REVIEW.cam.x, ty: REVIEW.cam.y, tz: REVIEW.cam.z }); drawScene(SC.world, 13, [...(SC.people || []), ...SC.zombies], { t: _T, dt, lights: [] }); drawReviewHud(dt); break; }
      if (UI.peek && SC.world.sit) { drawPeek(dt); drawNoteCard(dt); break; } else UI.peek = null;
      if (!dialogUp()) scUpdate(dt); else _T += dt;
      const actors = [...(SC.people || []), SC.player, ...SC.zombies]; drawScene(SC.world, Math.min(23.5, nightHour()), actors, { t: _T, dt, lights: SC.lights });
      drawScavHud(dt); drawPulse(dt); drawNoteCard(dt);
      if (UI.modal) { switch (UI.modal.kind) { case 'loot': drawLoot(); break; case 'leave': drawLeave(); break; case 'scavEnd': drawScavEnd(); break; case 'inv': drawScavInv(); break; case 'mission': drawMission(); break; } }
      break;
    }
  }
  soundTick(dt);
  drawDemoBar();
  handleTaps();
  // orientation hint
}
function init() {
  canvas = document.getElementById('c'); ctx = canvas.getContext('2d'); resize(); window.addEventListener('resize', resize); initInput(); initFx();
  requestAnimationFrame(frame);
}
if (!HEADLESS) window.addEventListener('load', init);
