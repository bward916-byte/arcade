<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#11131c">
<title>Ravenkeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* layout: one full-bleed pixel stage; heraldic HUD strip on top, thumb controls in the bottom corners */
:root{--ink:#11131c;--parch:#eadcb6;--gold:#e3b548;--blood:#9a2d28;--moss:#56733c;--steel:#aeb6c2;
  --disp:"Pirata One","UnifrakturCook","Old English Text MT",Georgia,serif;--body:"IM Fell English",Georgia,"Times New Roman",serif;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;touch-action:none}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--parch);font-family:var(--body);overflow:hidden;position:relative;overscroll-behavior:none}
#stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;filter:saturate(1.14) contrast(1.05)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--parch);outline-offset:3px}
#hud{position:absolute;top:8px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:17px;text-shadow:0 2px 0 rgba(17,19,28,.9);pointer-events:none;font-variant-numeric:tabular-nums}
#purse{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-size:24px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff3b8 0 11%,transparent 12%),radial-gradient(circle,#e3b548 0 44%,#b98a22 45% 58%,#e3b548 59%);box-shadow:inset -2px -2px 0 #b07f1c,0 0 0 1.5px #8a6412,0 3px 0 1px rgba(17,19,28,.7)}
.stat{display:flex;align-items:center;gap:5px;white-space:nowrap}
.stat svg{width:15px;height:15px;fill:none;stroke:var(--parch);stroke-width:2;stroke-linecap:round}
#sW svg{stroke:#e0655c}
#sK{gap:4px}
#kbar{width:54px;height:8px;border:1px solid rgba(234,220,182,.7);background:rgba(17,19,28,.6);border-radius:2px;overflow:hidden}
#kfill{display:block;height:100%;width:100%;background:var(--blood)}
#news{flex:0 1 auto;min-width:0;font-size:14px;background:rgba(17,19,28,.66);border:1px solid rgba(234,220,182,.28);padding:2px 9px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:none}
#news:empty{display:none}
#news.alarm{background:rgba(154,45,40,.85);border-color:rgba(234,220,182,.6)}
#day{margin-left:auto;white-space:nowrap;font-family:var(--disp);font-size:21px}
.hb{pointer-events:auto;font-size:14px;background:linear-gradient(rgba(52,46,60,.92),rgba(17,19,28,.92));border:1px solid rgba(234,220,182,.5);border-radius:4px;padding:3px 10px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bump{animation:bump .28s}
@keyframes bump{40%{transform:scale(1.35);color:#fff}}
#hint,#prompt{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(92%,36rem);text-align:center;font-size:16px;line-height:1.3;padding:7px 14px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .35s}
#hint{top:52px;background:linear-gradient(rgba(44,40,54,.95),rgba(17,19,28,.95));border:1px solid rgba(234,220,182,.34);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#prompt{bottom:14px;background:rgba(234,220,182,.94);color:#231a12;border:1px solid #6b5230;box-shadow:0 0 0 2px rgba(17,19,28,.8);font-size:15px}
#prompt b{font-family:var(--disp);font-weight:400;font-size:18px;letter-spacing:.02em}
#prompt .c{display:inline-block;margin-left:2px;padding:0 6px;border-radius:9px;background:#231a12;color:var(--gold)}
#hint.on,#prompt.on{opacity:1}
.touch #prompt{bottom:10px;max-width:calc(100% - 440px)}
@media (max-aspect-ratio:5/4){.touch #prompt{bottom:200px;max-width:92%}}
#card{position:absolute;left:0;right:0;top:24%;margin:0;padding:0 16px;text-align:center;font-family:var(--disp);font-weight:400;font-size:clamp(40px,10vw,92px);line-height:1;text-shadow:0 4px 0 var(--blood),0 8px 0 var(--ink);opacity:0;transform:scale(.94);transition:opacity .6s,transform 3s ease-out;pointer-events:none;text-wrap:balance}
#card.on{opacity:1;transform:none}
#card small{display:block;font-family:var(--body);font-size:18px;margin-top:14px;text-shadow:0 1px 0 var(--ink),0 0 8px var(--ink),0 0 14px var(--ink)}
#pad,.tb{position:absolute;display:none;touch-action:none}
.touch #pad,.touch .tb{display:grid}
.title #pad,.title .tb,.title #hud,.title #prompt{display:none}
#pad{left:max(16px,env(safe-area-inset-left,0px));bottom:18px;width:124px;height:124px;border-radius:50%;place-items:center;background:rgba(17,19,28,.42);border:2px solid rgba(234,220,182,.5)}
#pad svg{position:absolute;top:50%;margin-top:-9px;width:18px;height:18px;fill:var(--parch);opacity:.5;pointer-events:none}
#pad svg:first-of-type{left:7px}
#pad svg:last-of-type{right:7px}
#knob{width:54px;height:54px;border-radius:50%;background:rgba(234,220,182,.88);box-shadow:inset -5px -6px 0 rgba(110,90,50,.5),0 3px 0 rgba(17,19,28,.6);pointer-events:none}
.tb{place-items:center;padding:0;border-radius:50%;background:rgba(17,19,28,.5);border:2px solid rgba(234,220,182,.8)}
.tb.on{background:rgba(227,181,72,.35)}
.tb svg{width:52%;height:52%;fill:none;stroke:var(--parch);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#toss{right:max(18px,env(safe-area-inset-right,0px));bottom:26px;width:86px;height:86px;border-color:rgba(227,181,72,.9)}
#toss .coin{width:38px;height:38px;box-shadow:inset -4px -4px 0 #b07f1c,0 0 0 3px #8a6412}
#swd{right:calc(max(18px,env(safe-area-inset-right,0px)) + 98px);bottom:18px;width:66px;height:66px}
#ban{right:calc(max(18px,env(safe-area-inset-right,0px)) + 62px);bottom:100px;width:60px;height:60px}
#ban.up{background:rgba(154,45,40,.7)}
#title{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:20px 16px;background:linear-gradient(rgba(17,19,28,.15),rgba(17,19,28,.72))}
#title h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(54px,14vw,124px);line-height:.95;letter-spacing:.01em;text-shadow:0 4px 0 var(--blood),0 8px 0 var(--ink)}
#title p{margin:0;font-size:18px;max-width:34rem;text-shadow:0 1px 0 var(--ink),0 0 8px var(--ink);text-wrap:balance}
#go{font-family:var(--disp);font-size:26px;color:var(--ink);background:var(--gold);border:0;border-bottom:4px solid #a87c1c;border-radius:4px;padding:8px 30px 6px;margin-top:6px}
#cont{font-size:17px;background:rgba(17,19,28,.66);border:1px solid rgba(234,220,182,.6);border-radius:4px;padding:7px 20px}
#how{font-size:15px;opacity:.9}
#map{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,10,16,.78);padding:14px 16px;z-index:5;overflow:auto}
#mapin{width:min(100%,46rem);background:#eadcb6;color:#231a12;border:3px solid #6b5230;border-radius:6px;box-shadow:0 0 0 2px #231a12,0 14px 40px rgba(0,0,0,.5);padding:12px 16px 14px}
#mapin h2{margin:0 0 2px;font-family:var(--disp);font-weight:400;font-size:28px;text-align:center}
#mapin p{margin:4px 0 0;font-size:15px;text-align:center}
#lands{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
#lands li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 10px;border:1px solid rgba(107,82,48,.55);border-radius:4px;font-size:14px;line-height:1.25}
#lands li.won{background:rgba(86,115,60,.2)}
#lands li.next{background:rgba(154,45,40,.14);border-color:#9a2d28}
#lands li.far{opacity:.55}
#lands i{width:24px;height:24px;border-radius:50%;border:3px solid #6b5230;display:grid;place-items:center;font-style:normal;font-size:12px}
#lands li.won i{background:#56733c;color:#eadcb6}
#lands li.next i{background:#9a2d28;color:#eadcb6}
#lands b{font-family:var(--disp);font-weight:400;font-size:19px}
#lands em{font-style:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
#mapbtn{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
#mapbtn button{font-family:var(--disp);font-size:20px;border-radius:4px;padding:6px 20px 4px;border:0;border-bottom:3px solid rgba(0,0,0,.35)}
#mgo{background:#9a2d28;color:#eadcb6}
#mgo:disabled{opacity:.45;cursor:not-allowed}
#mno{background:#6b5230;color:#eadcb6}
@media (max-width:560px){#hud{font-size:15px;gap:5px 9px}#purse{font-size:21px}#day{font-size:18px}.hb{font-size:13px;padding:3px 7px}#news{order:9;flex-basis:100%;max-width:max-content}#hint{top:84px;font-size:14px}#kbar{width:40px}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}#card,#hint,#prompt{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="hud">
  <span id="purse" aria-label="Coins"><i class="coin"></i><b id="coins">0</b></span>
  <span class="stat" id="sK" aria-label="The king's health"><svg viewBox="0 0 24 24"><path d="M3 18h18M4 18 3 7l5 4 4-6 4 6 5-4-1 11"/></svg><i id="kbar"><i id="kfill"></i></i></span>
  <span class="stat" id="sA" aria-label="Soldiers"><svg viewBox="0 0 24 24"><path d="M19 3 8 14M5 13l6 6M4 20l4-4M19 3h-4M19 3v4"/></svg><b id="army">0</b></span>
  <span class="stat" id="sW" aria-label="Wounded" hidden><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><b id="wound">0</b></span>
  <span class="stat" id="sF" aria-label="People and housing"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M6 10v10h12V10"/></svg><b id="folk">0</b></span>
  <span id="news" role="status"></span>
  <span id="day">Day 1</span>
  <button id="mapb" class="hb" type="button">Map</button>
  <button id="mute" class="hb" type="button">Sound on</button>
</div>
<h2 id="card"></h2>
<div id="hint" role="status"></div>
<div id="prompt"></div>
<div id="map" hidden><div id="mapin"><h2 id="maph">The realm</h2><p id="mapsub"></p><ol id="lands"></ol><p id="mapnote"></p><div id="mapbtn"><button id="mgo" type="button">March</button><button id="mno" type="button">Stay</button></div></div></div>
<div id="pad" aria-label="Thumbstick: ride left or right">
  <svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg><i id="knob"></i><svg viewBox="0 0 24 24"><path d="m8 4 10 8-10 8z"/></svg>
</div>
<button id="toss" class="tb" type="button" aria-label="Toss coins"><i class="coin"></i></button>
<button id="swd" class="tb" type="button" aria-label="Swing your sword"><svg viewBox="0 0 24 24"><path d="M20 3 9 14M6 13l5 5M4 20l4-4M20 3h-5M20 3v5"/></svg></button>
<button id="ban" class="tb" type="button" aria-label="Raise or lower your banner"><svg viewBox="0 0 24 24"><path d="M6 21V3M6 4h12l-3 4 3 4H6"/></svg></button>
<div id="title">
  <h1>Ravenkeep</h1>
  <p id="tag">A ruined keep, a tired horse and a purse of coins. Raise a kingdom before the raiders return.</p>
  <button id="go" type="button">Ride in</button>
  <button id="cont" type="button" hidden>Continue</button>
  <p id="how">Arrows or A and D to ride. Space tosses coins, F swings your sword, B raises your banner.</p>
</div>

<script>
(()=>{'use strict';
// ---------- core: canvas, helpers, tables
const $=id=>document.getElementById(id);
const cv=$('game'),stage=$('stage');
let ctx=cv.getContext('2d'),W=320,H=180,GY=136,G,B={};
const DAY=96,CX=1600,WORLD=3200,CAMP=1020,BORDER=1530,SPAWN=1130,WALLX=560;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),sgn=v=>v<0?-1:1;
const hash=n=>{n=Math.sin(n*127.1+3.7)*43758.5453;return n-Math.floor(n);};
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mixA=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const css=a=>`rgb(${a.map(Math.round).join(',')})`;
const R=(x,y,w,h,c)=>{if(w<=0||h<=0)return;ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const P=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),1,1);};
function line(x0,y0,x1,y1,c,t){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;ctx.fillStyle=c;
  for(;n<400;n++){ctx.fillRect(x0,y0,t||1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}
}
const toneC={};
const tone=(h,f)=>{f=Math.round(f*20)/20;return toneC[h+f]||(toneC[h+f]=css(rgb(h).map(v=>clamp(v*f,0,255))));};

// buildings: cost per level, and the keep level each level needs
const DEF={
  keep:{n:'Keep',w:40,cost:[5,25,60,120,220],need:[0,0,0,0,0],gives:['a timber hall','a stone keep','a third storey and towers','the great towers','a royal castle']},
  cottage:{n:'Cottages',w:40,cost:[4,12,26],need:[1,2,3],gives:['room for 16 more','room for 16 more','room for 16 more']},
  farm:{n:'Farm',w:100,cost:[5,14,30],need:[1,2,3],gives:['4 coins each dawn','9 coins each dawn','16 coins each dawn']},
  wall:{n:'Gate',w:24,cost:[8,22,50,100],need:[1,2,3,4],gives:['a palisade','a stone gatehouse','a high wall with towers','a fortress gate with boiling oil']},
  barracks:{n:'Barracks',w:56,cost:[8,20,40,70],need:[1,2,3,4],gives:['militia','swordsmen','pikemen','men-at-arms']},
  range:{n:'Archery range',w:50,cost:[8,20,40,70],need:[1,2,3,4],gives:['archers','longbowmen','crossbowmen','fire arrows']},
  market:{n:'Market',w:50,cost:[12,28,60],need:[2,3,4],gives:['6 coins each dawn','14 coins each dawn','26 coins each dawn']},
  infirm:{n:'Infirmary',w:46,cost:[10,24,50],need:[2,3,4],gives:['faster healing, more survive','faster healing','the fastest healing']},
  smith:{n:'Blacksmith',w:46,cost:[16,34,60,100],need:[2,3,4,5],gives:['iron blades','mail coats','steel','plate armour']},
  stable:{n:'Stable',w:56,cost:[24,55],need:[3,4],gives:['hobelars (light horse)','knights']},
  workshop:{n:'Siege workshop',w:60,cost:[28,60,110],need:[3,4,5],gives:['mangonels','ballistas','trebuchets']},
  trap:{n:'Spike pit',w:14,cost:[3],need:[1],gives:['a hidden pit']},
};
const SITES=[['keep','keep',0],['smith','smith',-89],['barracks','barracks',-168],['range','range',-305],['stable','stable',-422],
  ['market','market',81],['infirm','infirm',153],['cotA','cottage',215],['cotB','cottage',265],['cotC','cottage',315],['cotD','cottage',365],['works','workshop',440],
  ['wallW','wall',-WALLX],['wallE','wall',WALLX],['farmW1','farm',-670],['farmW2','farm',-795],['farmE1','farm',670],['farmE2','farm',795],
  ['trapW1','trap',-600],['trapW2','trap',-880],['trapE1','trap',600],['trapE2','trap',880]];
const WALL={hp:[0,120,260,480,800],h:[0,15,22,30,38],half:[4,4,7,10,13],slots:[0,3,6,10,14]};
const KEEP={w:[34,40,48,56,64,72],h:[14,28,48,66,84,102],fl:[0,0,2,3,4,5]};
const FARMY=[0,4,9,16],MARKY=[0,6,14,26],HEALT=[26,14,9,5];
// fighters. side 0 is yours, side 1 is the enemy
const UT={
  militia:{n:'Militia',side:0,at:'barracks',lv:1,cost:1,hp:7,dmg:2,rate:1,reach:8,spd:30},
  sword:{n:'Swordsman',side:0,at:'barracks',lv:2,cost:2,hp:13,dmg:3,rate:.9,reach:7,spd:28,armor:1},
  pike:{n:'Pikeman',side:0,at:'barracks',lv:3,cost:2,hp:11,dmg:3,rate:1.1,reach:12,spd:26,anti:2.5},
  maa:{n:'Man-at-arms',side:0,at:'barracks',lv:4,cost:4,hp:22,dmg:5,rate:1,reach:8,spd:26,armor:2},
  archer:{n:'Archer',side:0,at:'range',lv:1,cost:1,hp:5,dmg:2,rate:1.7,range:100,spd:30},
  longbow:{n:'Longbowman',side:0,at:'range',lv:2,cost:2,hp:6,dmg:3,rate:1.5,range:135,spd:30},
  crossbow:{n:'Crossbowman',side:0,at:'range',lv:3,cost:3,hp:8,dmg:6,rate:2.8,range:115,spd:28,pierce:1},
  hobelar:{n:'Hobelar',side:0,at:'stable',lv:1,cost:3,hp:14,dmg:3,rate:.9,reach:9,spd:64,cav:1},
  knight:{n:'Knight',side:0,at:'stable',lv:2,cost:6,hp:28,dmg:6,rate:.9,reach:10,spd:58,cav:1,armor:2},
  mangonel:{n:'Mangonel',side:0,at:'workshop',lv:1,cost:14,hp:30,dmg:0,rate:6,range:170,minR:50,area:[5,12,6],sdmg:24,spd:16,eng:1},
  ballista:{n:'Ballista',side:0,at:'workshop',lv:2,cost:10,hp:22,dmg:14,rate:4,range:185,minR:20,sdmg:5,spd:18,eng:1,pierce:1},
  trebuchet:{n:'Trebuchet',side:0,at:'workshop',lv:3,cost:30,hp:40,dmg:0,rate:9,range:250,minR:90,area:[9,16,10],sdmg:60,spd:12,eng:1},
  raider:{n:'Raider',side:1,hp:6,dmg:2,rate:1,reach:7,spd:27,loot:.5},
  bowman:{n:'Bowman',side:1,hp:4,dmg:2,rate:2,range:95,spd:25,loot:.5},
  brute:{n:'Brute',side:1,hp:18,dmg:4,rate:1.3,reach:8,spd:22,armor:1,loot:1},
  rider:{n:'Rider',side:1,hp:13,dmg:4,rate:1,reach:9,spd:60,cav:1,loot:1},
  ram:{n:'Ram',side:1,hp:70,dmg:0,sdmg:30,rate:2.2,reach:8,spd:14,eng:1,armor:2,loot:3,sonly:1},
  ecat:{n:'Catapult',side:1,hp:35,dmg:0,rate:6.5,range:185,minR:60,area:[4,9,5],sdmg:24,spd:11,eng:1,loot:3},
  warlord:{n:'Warlord',side:1,hp:140,dmg:9,rate:.9,reach:11,spd:42,cav:1,armor:2,loot:20,boss:1},
};
const TYPES=Object.keys(UT).filter(k=>!UT[k].side);
const LANDS=[
  {n:'Thornwood',sub:'An outlaw camp in the forest',bio:'forest',wall:1,size:18,hall:90,cats:0,reward:40,tribute:4},
  {n:'Greyford',sub:'A river town held by raiders',bio:'river',wall:2,size:40,hall:160,cats:0,reward:80,tribute:7},
  {n:'Blackmoor',sub:"A robber baron's hold on the moor",bio:'moor',wall:3,size:72,hall:260,cats:1,reward:140,tribute:11},
  {n:'Ironpass',sub:'A fort in the high snows',bio:'snow',wall:3,size:110,hall:360,cats:3,reward:220,tribute:16},
  {n:'Dreadmere',sub:"The Warlord's own castle",bio:'ash',wall:4,size:160,hall:520,cats:5,reward:400,tribute:25,boss:1},
];

// ---------- sprites and the pixel font
function sprite(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const mkc=flip=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(flip?w-1-i:i,j,1,1);}}));return c;};
  return {r:mkc(false),l:mkc(true),w,h};

let AC=null,master,noiseBuf,muted=false;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone1(f,d,type,v,f2,delay){
  if(!AC||muted||v<=0)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function burst(d,v,hp){
  if(!AC||muted||v<=0)return;
  const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;
  f.type=hp?'highpass':'lowpass';f.frequency.value=hp||900;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+d+.02);
}

function darkness(t){

}

  for(const b of G.b)if(b.type==='farm'&&b.burnt>0)b.burnt--;
  G.rainT=G.day>2&&hash(G.day*7.31+G.raid.idx)>.74?1:0;       // some days it rains

  if(!G.battle)for(const b of G.S)if(b.hp>0)b.hp=b.max;
  const cl=G.b.reduce((n,b)=>n+(b.type==='cottage'?b.level:0),0),free=popCap()-pop();
  const n=clamp(free,0,cl?2+B.keep.level*2+cl*2:0);

  for(const s of [-1,1])if(G.vag.filter(v=>v.camp===s).length<3&&free-n>0)vagrant(s);
  if(n)hint('settlers','Word spreads. Settlers walk in each dawn while there is room for them.');

  if(G.scene!=='home')return;

  if(pt<.45&&G.t>=.45&&G.raid.day<=G.day&&live){sfx.horn();G.repost=1;hint('tonight'+G.day,`Scouts: raiders strike tonight from ${G.raid.both?'both sides':sideName(G.raid.side)}. Your men move to the gates.`,true);}
  if(pt<.6&&G.t>=.6&&!G.battle&&G.raid.day<=G.day&&live)startRaid();
  if(G.t>=1){G.t-=1;dawn();}
}

// ---------- villagers, vagrants, the court
function enlist(f){
  const o=f.job,i=G.orders.indexOf(o);if(i>=0)G.orders.splice(i,1);
  const u=mkUnit(o.type,f.x,0);G.units.push(u);G.repost=1;sfx.paid();
  for(let k=0;k<5;k++)G.parts.push({x:u.x+rnd(-3,3),h:rnd(4,12),vx:rnd(-8,8),vh:rnd(6,20),life:0,max:.5,col:'#f2e3a0',grav:0});
  hint('soldier','Your first soldier. They hold the gates on their own. Raise your banner (B) and the army follows you instead.');
}
function updFolk(dt){
  const night=G.t>.7||G.t<.03,danger=!!G.battle;
  for(let i=G.folk.length-1;i>=0;i--){
    const f=G.folk[i];let sp=17;f.work=false;
    if(f.st==='enlist'){sp=42;if(Math.abs(f.x-f.tx)<2){enlist(f);G.folk.splice(i,1);continue;}}
    else if(f.st==='build'){sp=40;const b=f.job;if(!b.building){f.st='idle';f.job=null;f.wait=0;f.tx=f.x;}else if(Math.abs(f.x-f.tx)<2){f.work=true;f.dir=sgn(b.x-f.x);}}
    else if(danger){f.tx=CX+((f.id*37)%130-65);sp=38;}
    else if(Math.abs(f.x-f.tx)<2){
      f.wait-=dt;
      if(f.wait<=0){
        f.wait=rnd(1.5,7);
        if(night)f.tx=CX+((f.id*53)%640-320);
        else{const farms=G.b.filter(b=>b.type==='farm'&&b.level&&!b.burnt&&b.burn<=0);
          f.tx=farms.length&&Math.random()<.3?farms[f.id%farms.length].x+rnd(-44,44):CX+rnd(-500,500);}
      }else if(!night&&Math.abs(f.x-CX)>WALLX+50)f.work=true;
    }
    step(f,f.tx,sp,dt);
  }
}
function updVag(dt){
  for(const v of G.vag){
    if(!step(v,v.tx,9,dt)){v.wait-=dt;if(v.wait<=0){v.wait=rnd(2,7);v.tx=v.home+rnd(-16,16);}}
  }
}
function updCourt(dt){
  const L=B.keep.level,hw=KEEP.w[L]/2-7,fl=KEEP.fl[L];
  for(const c of G.court){
    if(Math.abs(c.x-c.tx)<.6){
      c.moving=false;c.wait-=dt;
      if(c.wait<=0){
        c.wait=c.guard?rnd(.5,2):rnd(1,6);
        if(!c.guard&&fl>1&&Math.abs(c.x)>hw-3&&Math.random()<.5)c.fl=clamp(c.fl+(Math.random()<.5?-1:1),0,fl-1);   // takes the stair
        c.tx=Math.random()<.3?sgn(rnd(-1,1))*hw:rnd(-hw,hw);
      }
    }else{c.dir=sgn(c.tx-c.x);c.x+=c.dir*dt*(c.guard?5:6.5);c.walk+=dt*5;c.moving=true;}
  }
}
function nearestIdle(x){let best=null,bd=1e9;for(const f of G.folk)if(f.st==='idle'){const d=Math.abs(f.x-x);if(d<bd){bd=d;best=f;}}return best;}
function updOrders(){
  for(const o of G.orders){if(o.f)continue;const f=nearestIdle(o.b.x);if(!f)break;f.st='enlist';f.job=o;f.tx=o.b.x+rnd(-8,8);o.f=f;}
}
function built(b){
  sfx.built();float(b.x,(b.hgt||20)+14,b.type==='keep'?'KEEP '+b.level:'BUILT','#eadcb6');
  for(let k=0;k<10;k++)G.parts.push({x:b.x+rnd(-b.w/2,b.w/2),h:rnd(2,18),vx:rnd(-10,10),vh:rnd(4,16),life:0,max:rnd(.5,1),col:'#cdbf9a',grav:0});
  const t=b.type,L=b.level;
  if(t==='keep'&&L===1)hint('k1','The keep stands again. Plots are staked out around it: stand on one and toss coins. Cottages bring settlers, farms bring coins.');
  else if(t==='keep'&&L===2)hint('k2','A stone keep. A market, a blacksmith and an infirmary can now be built, and the roads past your border stones are open: there are lands to conquer.');
  else if(t==='keep'&&L===3)hint('k3','Stables and a siege workshop are open to you. Stone walls abroad will need engines.');
  else if(t==='keep'&&L>3)hint('k'+L,'The castle climbs. Its halls fill with courtiers and its roof with guards.');
  else if(t==='barracks'||t==='range'||t==='stable'||t==='workshop')hint('post'+t+L,`${DEF[t].n}: toss coins at the ${L>1?'new post':'post'} beside it to ${t==='workshop'?'build '+DEF[t].gives[L-1]:'arm villagers as '+DEF[t].gives[L-1]}.`,L>1&&!(t==='range'&&L===4));
  else if(t==='wall'&&L===1)hint('wall','Archers climb the gate on their own. Everyone else waits behind it until it breaks or you lead them out.');
  else if(t==='farm'&&L===1)hint('farm','A farm pays each dawn. In a raid, the brazier beside it lets you torch the field under the raiders.');
  else if(t==='trap')hint('trap','A spike pit, hidden under brush. It springs once, then needs a coin to reset.');
  else if(t==='infirm')hint('inf','Fallen soldiers who survive are carried here and return to duty one by one.');
  else if(t==='smith')hint('smith'+L,`The smith now forges ${DEF.smith.gives[L-1]} for every soldier, and for you.`,true);
  save();
}
function updBuild(dt){
  for(const b of G.b){
    if(!b.building)continue;let n=0,asg=0;
    for(const f of G.folk)if(f.st==='build'&&f.job===b){asg++;if(f.work)n++;}
    if(asg<3){const f=nearestIdle(b.x);if(f){f.st='build';f.job=b;f.tx=b.x+(asg-1)*Math.min(8,b.w/4)+rnd(-2,2);}
      else if(!asg)hint('nobuild','Nobody is free to build. Win vagrants at the camps beyond the fields with a coin each.',true);}
    if(n){b.prog+=dt*n/(3+DEF[b.type].cost[b.level]*.12);if(Math.random()<dt*5)sfx.hammer(b.x);}
    if(b.prog>=1){b.building=false;b.prog=0;setLevel(b,b.level+1);built(b);}
  }
}

// ---------- what the king is standing at, and paying for it
const GHOSTH={cottage:14,farm:8,wall:18,barracks:28,range:21,market:15,infirm:24,smith:25,stable:22,workshop:25,trap:3};      // how tall each unbuilt plot's ghost stands
function posts(b){
  const out=[];let i=0;
  for(const t of TYPES){const d=UT[t];if(d.at!==b.type)continue;out.push({type:t,x:b.x+b.dir*(b.w/2+10+14*i),open:b.level>=d.lv});i++;}
  return out;
}
const chip=n=>` <span class="c">${n}</span>`;
function findTarget(){
  if(G.scene!=='home'||G.king.down>0)return null;
  const x=G.king.x,KL=B.keep.level;
  let v=null,vd=22;for(const q of G.vag){const d=Math.abs(q.x-x);if(d<vd){vd=d;v=q;}}
  if(v)return {k:'vag',key:'vag',x:v.x,mark:17,full:1,v,html:'<b>Vagrant</b> A coin wins a villager'};
  for(const b of G.b){
    const d=DEF[b.type];
    if(b.level>0)for(const p of posts(b))if(p.open&&Math.abs(x-p.x)<6){
      const u=UT[p.type],idle=G.folk.filter(f=>f.st==='idle').length,q=G.orders.filter(o=>o.type===p.type).length;
      if(G.orders.length>=60)return {k:'info',key:'full',x:p.x,mark:18,html:`<b>${u.n}</b> The muster roll is full. Wait for villagers to arrive`};
      return {k:'post',key:'p'+p.type,x:p.x,mark:18,full:u.cost,b,type:p.type,html:`<b>${u.n}</b> ${q?q+' waiting for a free villager':u.eng?'built by one villager':idle+' free villagers'}`};
    }
    if(b.type==='farm'&&b.level>0&&!b.burnt&&b.burn<=0&&Math.abs(x-(b.x+b.dir*62))<6)
      return {k:'torch',key:'t'+b.id,x:b.x+b.dir*62,mark:16,full:2,b,html:'<b>Torch the field</b> Burns raiders in it. Costs two harvests'};
    const zone=b.type==='farm'?48:b.type==='trap'?8:b.type==='wall'?13:b.type==='keep'?KEEP.w[b.level]/2:b.w/2;
    if(Math.abs(x-b.x)>zone)continue;
    const mark=b.level||b.type==='keep'?(b.hgt||24)+10:GHOSTH[b.type]+14;
    if(b.building)return {k:'info',key:b.id+'b',x:b.x,mark,html:`<b>${d.n}</b> Under construction`};
    if(b.type==='wall'&&b.level&&b.hp<=0)return {k:'repair',key:b.id+'r',x:b.x,mark:14,full:Math.ceil(d.cost[b.level-1]*.4),b,html:'<b>Rebuild the gate</b> It lies in ruins'};
    if(b.type==='trap'&&b.level&&b.sprung)return {k:'rearm',key:b.id+'a',x:b.x,mark:10,full:1,b,html:'<b>Reset the spike pit</b>'};
    if(b.level>=d.cost.length)return {k:'info',key:b.id+'m',x:b.x,mark,html:`<b>${d.n}</b> ${b.type==='keep'?'A royal castle':b.type==='trap'?'Armed and hidden':'Fully built'}`};
    const need=d.need[b.level];
    if(KL<need){
      if(b.level===0&&KL<need-1)continue;
      return {k:'info',key:b.id+'l',x:b.x,mark,html:`<b>${d.n}</b> Raise the keep to level ${need} first`};
    }
    const name=b.level?`${d.n}, level ${b.level+1}`:b.type==='keep'?'Ruined keep':d.n;
    return {k:'build',key:b.id+'u'+b.level,x:b.x,mark,full:d.cost[b.level],b,html:`<b>${name}</b> ${b.type==='keep'&&!b.level?'Rebuild it as':b.level?'Adds':'Gives'} ${d.gives[b.level]}`};
  }
  return null;
}
function coinFx(x0,x1,h1,n){G.fx.push({x0,x1,h0:18,h1,t:0,big:n>1});}
function refund(){const p=G.part;G.part=null;if(p&&p.amt>0){G.coins+=p.amt;float(G.king.x,30,'+'+p.amt,'#eadcb6');}}
function paid(tg){
  const b=tg.b;
  if(tg.k==='vag'){
    const i=G.vag.indexOf(tg.v);if(i>=0)G.vag.splice(i,1);
    const f=villager(tg.v.x);f.tx=CX+rnd(-120,120);f.wait=0;sfx.paid();
    hint('folk1','A villager. Ride home and toss coins at the ruined keep, and they will rebuild it.');
  }else if(tg.k==='build'){b.building=true;b.prog=0;sfx.paid();}
  else if(tg.k==='repair'){b.hp=b.max;G.repost=1;sfx.built();}
  else if(tg.k==='rearm'){b.sprung=false;sfx.paid();}
  else if(tg.k==='post'){G.orders.push({type:tg.type,b,f:null});sfx.paid();if(!G.folk.length)hint('nofolk','No villager is free to take up arms. Build cottages for settlers, or win vagrants at the camps.',true);}
  else if(tg.k==='torch'){b.burn=14;b.tick=0;sfx.fire(b.x);hint('torch','The field is ablaze. Keep your own men out of it.');}
}
function tossing(dt){
  const tg=G.tgt=findTarget(),key=tg?tg.key:'';
  if(G.part&&G.part.key!==key)refund();
  const want=input.coin||input.coinT||input.padCoin;
  G.hold=want?G.hold+dt:0;G.tossT-=dt;
  if(want&&G.tossT<=0){
    if(!tg||!tg.full){if(G.hold<=dt*1.01)sfx.no();}
    else if(G.coins<1){G.tossT=.6;sfx.no();hint('poor','Your purse is empty. Coins arrive each dawn from taxes, farms and markets.',true);}
    else{
      const p=G.part||(G.part={key,amt:0}),n=Math.min(tg.full-p.amt,Math.floor(G.coins),G.hold>2.4?12:G.hold>1?4:1);
      G.coins-=n;p.amt+=n;G.tossT=.13;G.king.toss=.2;sfx.coin();coinFx(G.king.x,tg.x,tg.mark||12,n);
      if(p.amt>=tg.full){G.part=null;paid(tg);}
    }
  }
  if(!tg)showPrompt('','');
  else{const left=tg.full?tg.full-(G.part?G.part.amt:0):0;showPrompt(tg.html+(tg.full?chip(left):''),key+'/'+left+tg.html);}
}

// ---------- the king
function toggleStance(){
  if(G.king.down>0)return;
  if(!G.units.length){hint('noarmy','You have no soldiers yet. Build a barracks, then toss coins at the post beside it.',true);sfx.no();return;}
  G.stance=G.stance==='hold'?'follow':'hold';G.repost=1;G.formT=0;
  if(G.stance==='hold'&&G.scene==='field')for(const u of G.units)u.post={x:u.x,h:0};
  for(const u of G.units)u.mode=G.stance;
  float(G.king.x,34,G.stance==='follow'?'FOLLOW ME':G.scene==='home'?'TO THE GATES':'HOLD HERE','#eadcb6');tone1(G.stance==='follow'?196:147,.5,'sawtooth',.09,G.stance==='follow'?294:110);
  if(G.stance==='follow')hint('follow','The army marches with you. Ride through your gate to sortie, or past the border stones to go to war.');
}
function updKing(dt){
  const k=G.king;
  if(k.hurt>0)k.hurt-=dt;if(k.swing>0)k.swing-=dt;if(k.toss>0)k.toss-=dt;k.cd-=dt;
  if(k.down>0){k.down-=dt;k.vx=0;if(k.down<=0){k.hp=Math.ceil(k.max/2);k.x=CX+10;}return;}
  const ax=input.key||input.dpad||(Math.abs(input.stick)>.16?input.stick:0)||input.padAxis,want=clamp(ax,-1,1)*88;
  const acc=(Math.abs(want)<1||want*k.vx<0)?460:240;
  k.vx+=clamp(want-k.vx,-acc*dt,acc*dt);
  const nx=clamp(bound(k,k.x+k.vx*dt),18,G.ww-18);if(Math.abs(nx-(k.x+k.vx*dt))>.01)k.vx=0;k.x=nx;
  k.moving=Math.abs(k.vx)>4;
  if(k.moving){k.dir=sgn(k.vx);k.phase+=Math.abs(k.vx)*dt*.085;if(Math.abs(k.vx)>60&&Math.random()<dt*14)G.parts.push({x:k.x-k.dir*8,h:1,vx:-k.dir*rnd(4,14),vh:rnd(4,12),life:0,max:.5,col:'#b9a77c',grav:-20});}
  if((input.sword||input.swordT||input.padSword)&&k.cd<=0){
    k.cd=.42;k.swing=.22;let n=0;const pw=k.dmg*(Math.abs(k.vx)>70?1.5:1);
    for(const f of G.foes){if(f.h>0||n>=3)continue;const d=(f.x-k.x)*k.dir;if(d>-4&&d<17&&!wallBetween(0,k.x,f.x)){hurtU(f,pw,false);n++;}}
    if(!n)for(const s of G.S)if(s.own===1&&s.hp>0&&Math.abs(s.x-k.x)<s.half+16){handHit(s,pw);n=1;break;}
    if(n)sfx.clang(k.x);else lim('whoosh',120,()=>burst(.08,.05,2000));
  }
  k.regen+=dt;if(k.regen>5&&k.hp<k.max)k.hp=Math.min(k.max,k.hp+dt*1.5);
}
function kingDown(){
  const k=G.king;if(k.down>0)return;
  sfx.lose();
  if(G.scene==='field'){k.down=9;k.hp=1;G.field.fail=true;return;}
  const loss=Math.floor(G.coins*.2);G.coins-=loss;k.down=6;k.hp=1;refund();
  card('The king is struck down',`He is carried to the keep.${loss?' The raiders snatch '+loss+' coins.':''}`,4200);
  if(G.stance==='follow'){G.stance='hold';for(const u of G.units)u.mode='hold';G.repost=1;}
}

// ---------- battle: everything stands on one line, walls block the side that does not own them
function wallBetween(side,a,b){
  for(const s of G.S)if(s.hp>0&&s.block&&s.own!==side&&((a<s.x&&b>s.x)||(a>s.x&&b<s.x)))return s;
  return null;
}
function bound(u,nx){
  for(const s of G.S){
    if(s.hp<=0||!s.block||s.own===u.side)continue;
    const f=s.half+2;
    if(u.x<=s.x&&nx>s.x-f)nx=s.x-f;else if(u.x>s.x&&nx<s.x+f)nx=s.x+f;
  }
  return nx;
}
const woundP=()=>Math.min(.88,.55+.1*B.infirm.level);
function hurtU(t,dmg,pierce){
  if(t.gone||(t.king?t.down>0:t.hp<=0))return;
  dmg*=pierce?1:1-.14*Math.min(4,t.armor||0);t.hp-=dmg;t.hurt=.13;
  if(dmg>=1.5&&Math.random()<.35)G.parts.push({x:t.x,h:(t.h||0)+6,vx:rnd(-14,14),vh:rnd(4,20),life:0,max:.4,col:t.eng?'#7a5a3a':'#8a1f1c',grav:-90});
  if(t.king){t.regen=0;sfx.hurt();G.shake=Math.max(G.shake,1.5);if(t.hp<=0){t.hp=0;kingDown();}return;}
  if(G.field&&t.side)G.field.alert=true;
  if(t.hp<=0)fell(t);
}
function fell(t){
  t.gone=1;sfx.fall(t.x);
  const col=t.eng?'#6b5230':t.side?'#5a1f1c':'#8a2a24';
  for(let i=0;i<(t.eng?10:4);i++)G.parts.push({x:t.x+rnd(-2,2),h:rnd(3,9)+(t.h||0),vx:rnd(-16,16),vh:rnd(4,26),life:0,max:rnd(.4,.8),col,grav:-70});
  if(t.side){G.killed++;G.spoils+=UT[t.type].loot||0;if(t.boss){card('The Warlord falls','His host breaks and runs.',3600);for(const f of G.foes)if(!f.gone)f.mode='flee';}}
  else if(!t.eng&&Math.random()<woundP())G.down.push({type:t.type,rank:t.rank,x:t.x,t:0,id:t.id,dir:t.dir});
  else{G.lost++;if(!t.eng)G.parts.push({x:t.x,h:0,vx:0,vh:0,life:0,max:14,col:'#3a3038',grav:0,body:1,dir:t.dir});}
}
function hurtS(s,d){
  if(s.hp<=0)return;
  s.hp-=d;s.flash=.15;if(G.field)G.field.alert=true;
  for(let i=0;i<3;i++)G.parts.push({x:s.x+rnd(-s.half,s.half),h:rnd(2,s.hgt||14),vx:rnd(-14,14),vh:rnd(0,18),life:0,max:.6,col:s.level===1||s.lvl===1?'#7a5a3a':'#9a968c',grav:-80});
  if(s.hp<=0){s.hp=0;breach(s);}
}
function breach(s){
  G.shake=5;sfx.thud(s.x);
  for(let i=0;i<8;i++)G.parts.push({x:s.x+rnd(-s.half-8,s.half+8),h:rnd(1,(s.hgt||14)*.8),vx:rnd(-10,10),vh:rnd(4,12),life:0,max:rnd(1,2),col:'#a39e92',grav:0,big:1});
  for(let i=0;i<26;i++)G.parts.push({x:s.x+rnd(-s.half-4,s.half+4),h:rnd(0,s.hgt||16),vx:rnd(-30,30),vh:rnd(0,40),life:0,max:rnd(.6,1.4),col:i%2?'#8a867c':'#5f5a52',grav:-90});
  for(const u of G.units.concat(G.foes))if(u.h>0&&Math.abs(u.x-s.x)<s.half+4){u.h=0;u.post=null;hurtU(u,3,true);}
  G.repost=1;
  if(s.type==='keep'){sfx.lose();wipe();banner('over','The keep has fallen',`Ravenkeep stood ${G.day} days and threw back ${G.raidsWon} ${G.raidsWon===1?'raid':'raids'}.`,'Ride again');}
  else if(s.type==='wall')card(`The ${s.dir<0?'west':'east'} gate has fallen`,'Your men close the breach with steel.',3000);
  else if(s.kind==='hall')fieldWon();
  else if(s.kind==='ewall')float(s.x,30,'BREACHED','#eadcb6');
}

// only so many men can get at a gate at once, and hand weapons do little to stone: that is what rams and engines are for
function handHit(s,d){
  const rate=s.kind==='hall'?15:s.type==='keep'?(s.level>1?4:6):(s.level||s.lvl)>1?4:12,now=G.clock;
  s.hb=Math.min(rate*1.5,(s.hb||0)+(now-(s.hbT===undefined?now-1:s.hbT))*rate);s.hbT=now;
  d=Math.min(d,s.hb);if(d>0){s.hb-=d;hurtS(s,d);}
}
// archers on a wall see further; massed ranks behind your own gate loose volleys over it
const rangeUp=u=>u.h>0?25:(!u.side&&!u.eng&&u.mode==='hold'&&G.scene==='home'?45:0);
function findS(u,k){
  let best=null,bd=1e9;
  for(const s of G.S){
    if(s.own!==1||s.hp<=0)continue;const d=Math.abs(s.x-u.x);
    if(wallBetween(0,u.x,s.x-sgn(s.x-u.x)*(s.half+3)))continue;
    if(u.range?(d<=u.range+s.half||u.mode==='follow'&&Math.abs(s.x-k.x)<u.range+90):(d<150&&(u.mode==='follow'?Math.abs(s.x-k.x)<130:d<40)))if(d<bd){bd=d;best=s;}
  }
  return best;
}
// ---------- choosing a target
function think(u){
  const foes=u.side?G.P:G.foes,k=G.king,home=G.scene==='home';let best=null,bd=1e9;
  if(u.mode==='flee'){u.tg=null;return;}
  const siege=u.side===0&&!home&&u.eng&&u.area;      // your stone-throwers go for walls before men
  if(siege)best=findS(u,k);

// ---------- every fighter, every frame
function act(u,dt){

  u.think-=dt;if(u.think<=0){u.think=.25+rnd(0,.12);think(u);}
  let t=u.tg;if(t&&(t.gone||t.hp<=0||(t.king&&t.down>0)))t=u.tg=null;
  let want=null,sp=u.spd;const k=G.king;
  if(u.mode==='flee'){want=u.x<G.ww/2?-60:G.ww+60;sp*=1.25;}
  else if(t){
    const isS=t.own!==undefined,d=Math.abs(t.x-u.x),edge=isS?t.half:0,dir=sgn(t.x-u.x);
    if(u.range){
      const rg=u.range+rangeUp(u)+edge;

      else if(d>rg&&(u.side===1||u.mode==='follow'))want=t.x-dir*(rg*.88);
    }else{
      const r=u.reach+edge+(t.cav?2:0)+(isS?(u.id*7%13)*1.8:(u.id%5)*1.4);     // a mob spreads out; the back ranks still land blows

  else if(u.mode==='follow'){want=u.slot;const far=Math.abs(want-u.x);if(far>90||(u.eng&&!G.foes.length))sp*=1.8;if(far<1.5)want=null;}
  else if(u.post){want=u.post.x;if(Math.abs(want-u.x)<1)want=null;}
  const ph=u.mode==='hold'&&u.post&&u.post.h&&Math.abs(u.x-u.post.x)<2?u.post.h:0;
  if(u.h!==ph){u.h+=(ph-u.h)*Math.min(1,dt*9);if(Math.abs(u.h-ph)<.6)u.h=ph;}

    else{u.moving=false;u.vx=0;u.still+=dt;}
  }else{u.moving=false;u.vx=0;u.still+=dt;if(!t)u.run=0;}
}

function raidSize(i){return Math.min(280,Math.round(5+i*6+i*i*1.5));}
function raidMix(i,n){

  add('raider',n-bow-brute-rider);add('bowman',bow);add('brute',brute);
  for(let k=q.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[q[k],q[j]]=[q[j],q[k]];}
  const out=[];
  for(let k=0;k<rider;k++)out.push('rider');
  const ram=i>=3?Math.min(5,1+Math.floor((i-3)/2)):0,cat=i>=6?Math.min(5,1+Math.floor((i-6)/2)):0;
  const mid=q.splice(0,Math.floor(q.length/2));

  }

function drawVag(v,sx,y){
  const d=v.dir,st=Math.floor(v.walk)%4,mv=v.moving;
  R(sx-1+(st===1&&mv?d:0),y-3,1,3,'#3f352d');R(sx+1,y-3,1,3,'#3f352d');R(sx-1,y-7,3,4,'#6e5a48');P(sx,y-5,'#8a7460');R(sx-1+d,y-10,3,3,SKIN[v.id%4]);R(sx-1+d,y-11,3,2,'#4b3c30');P(sx-d,y-9,'#4b3c30');

function drawShot(s){
  const k=s.k,x=s.x0+(s.tx-s.x0)*k,h=s.h0+(s.h1-s.h0)*k+Math.sin(k*Math.PI)*s.arc,sx=Math.round(x-CAM),y=GY+2-Math.round(h);

    const k2=Math.min(1,k+.04),x2=s.x0+(s.tx-s.x0)*k2,h2=s.h0+(s.h1-s.h0)*k2+Math.sin(k2*Math.PI)*s.arc,dx=x2-x,dy=-(h2-h),m=Math.hypot(dx,dy)||1,len=s.kind==='bolt'?6:4;

function draw(){
  const k=G.king;LT=[];WN=[];SNOWR=!!BIO[G.bio].snowy;

  ctx.setTransform(1,0,0,1,0,0);
  drawSky();drawBack();drawRays();drawGround();drawShadows();drawRiver();
  const home=G.scene==='home';
  if(home){drawHomeScenery();for(const b of G.b)drawSite(b);drawTown();drawRavens();drawLife();}else drawFieldScenery();

  const list=[],vis=x=>x>CAM-24&&x<CAM+W+24;

  }

  for(const p of G.parts)if(p.body){const sx=Math.round(p.x-CAM);ctx.globalAlpha=clamp((p.max-p.life)/3,0,1);R(sx-3,GY+2,5,2,p.col);P(sx+2*p.dir,GY+2,'#8a7460');ctx.globalAlpha=1;}
  for(const [row,kind,o] of list){
    const sx=Math.round(o.x-CAM),y=GY+2+Math.round(Math.max(0,row));
    if(kind===0)drawUnit(o,sx,y);
    else if(kind===1)drawFolk(o,sx,y);
    else if(kind===2)drawVag(o,sx,y);
    else if(kind===3){const L=LOOK[o.type]||LOOK.militia;R(sx-3,y-2,5,2,UT[o.type].cav?'#8a6a40':L.t);R(sx+2,y-3,2,2,SKIN[o.id%4]);P(sx-4,y-1,L.l);if(Math.sin(G.clock*3+o.id)>.6)P(sx,y-4,'#c0392b');}
    else{o.swing=0;o.hurt=0;drawMan(sx,y,o,LOOK[o.type]||LOOK.militia,true);}
  }
  if(G.state==='play'&&k.down<=0){
    if(G.stance==='follow'&&G.units.length){       // the royal standard rides at the king's shoulder
      G.stdX=G.stdX===undefined||Math.abs(G.stdX-k.x)>80?k.x:G.stdX+((k.x-G.front*13)-G.stdX)*.12;
      const bx=Math.round(G.stdX-CAM),by=GY+6,fd=k.moving?-k.dir:-G.front;
      R(bx-1,by-3,1,3,'#3b3f55');R(bx+1,by-3,1,3,'#3b3f55');R(bx-1,by-7,3,4,C.red);R(bx-1,by-10,3,3,'#e2aa7c');R(bx-1,by-10,3,1,C.steel);
      R(bx+2,by-29,1,27,C.beam);P(bx+2,by-30,C.gold);flag(bx+(fd>0?3:2),by-29,fd,C.red,11,8);flag(bx+(fd>0?3:2),by-22,fd,C.gold,11,1);
      P(bx+2+fd*4,by-26,'#16131a');P(bx+2+fd*5,by-26,'#16131a');P(bx+2+fd*5,by-27,'#16131a');P(bx+2+fd*6,by-25,'#16131a');
    }

  }

  for(const s of G.shots)drawShot(s);
  for(const p of G.parts){
    if(p.body||p.lit)continue;const sx=Math.round(p.x-CAM);if(sx<-6||sx>W+6)continue;
    if(p.stuck){line(sx,GY+2,sx-p.stuck*2,GY-2,p.col);continue;}
    const y=GY+2-Math.round(p.h);
    if(p.big){ctx.globalAlpha=.42*(1-p.life/p.max);disc(sx,y,1+Math.round(p.life*1.5),p.col);ctx.globalAlpha=1;}else P(sx,y,p.col);
  }
  for(const f of G.fx){const x=f.x0+(f.x1-f.x0)*f.t,h=f.h0+(f.h1-f.h0)*f.t+Math.sin(f.t*Math.PI)*12,c=COIN[Math.floor(G.clock*14)%4];ctx.drawImage(c.r,Math.round(x-CAM)-(c.w>>1),GY-Math.round(h)-3);if(f.big)ctx.drawImage(c.r,Math.round(x-CAM)-(c.w>>1)+3,GY-Math.round(h)-6);}
  weather();drawFore();drawMist();drawRain();drawGrade();
  // night falls over everything, then the fires and windows come back up
  const gloom=Math.min(1,G.dark+(home?G.rain*.3:0));
  if(gloom>.02){
    ctx.fillStyle=`rgba(8,12,40,${(.5*gloom).toFixed(3)})`;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=Math.min(1,G.dark*1.3);for(const w of WN)R(w[0],w[1],w[2],w[3],'#f2c56a');ctx.globalAlpha=1;
  }
  for(const p of G.parts)if(p.lit){const sx=Math.round(p.x-CAM);R(sx,GY+1-Math.round(p.h),1,2,p.col);}
  const la=G.dark>.02?G.dark:0;
  for(const l of LT){const a=l[3]*(l[4]?1:Math.max(la,l[5]?0:.18));glow(l[0],l[1],l[2],l[4]||'255,170,80',a,l[5]);}
  drawFinish();
  // marker over whatever the coins would go to
  const tg=G.tgt;
  if(G.state==='play'&&tg&&!G.mapOpen){
    const sx=Math.round(tg.x-CAM),y=GY-(tg.mark||12)-8+Math.round(Math.sin(G.clock*5)*1.5),ok=!!tg.full,c=ok?'#f2c14e':'#b8b4ac';
    R(sx-2,y,5,1,c);R(sx-1,y+1,3,1,c);P(sx,y+2,c);
    if(ok){const left=tg.full-(G.part?G.part.amt:0),s=String(left),w=textW(s)+7;ctx.drawImage(COIN[0].r,sx-(w>>1),y-7);text(sx-(w>>1)+7,y-7,s,'#fff0a8','#16131a');}
  }
  for(const f of G.floats){ctx.globalAlpha=clamp(1.8-f.t,0,1);ctext(Math.round(f.x-CAM),GY-f.h-Math.round(f.t*9),f.s,f.c,'#16131a');ctx.globalAlpha=1;}
  if(home&&G.state==='play'){
    // which way to trouble: an arrow at the screen edge when raiders are off screen
    let l=0,r=0;for(const f of G.foes){if(f.x<CAM)l++;else if(f.x>CAM+W)r++;}
    const bl=Math.sin(G.clock*6)>0;
    if(l&&bl){R(3,GY-40,1,7,'#c0392b');R(4,GY-39,1,5,'#c0392b');R(5,GY-38,1,3,'#c0392b');text(8,GY-39,l,'#f2f5f8','#16131a');}
    if(r&&bl){R(W-4,GY-40,1,7,'#c0392b');R(W-5,GY-39,1,5,'#c0392b');R(W-6,GY-38,1,3,'#c0392b');text(W-9-textW(String(r)),GY-39,r,'#f2f5f8','#16131a');}
  }
  if(G.fade>0){ctx.fillStyle=`rgba(8,8,14,${Math.min(1,G.fade).toFixed(2)})`;ctx.fillRect(0,0,W,H);}
}

// ---------- the frame: update
function updParts(dt){
  const P=G.parts;if(P.length>800)P.splice(0,P.length-800);
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.life+=dt;if(p.life>=p.max){P.splice(i,1);continue;}
    if(p.body||p.stuck)continue;
    p.x+=p.vx*dt;p.h+=p.vh*dt;p.vh+=p.grav*dt;if(p.h<0){p.h=0;p.vh=0;p.vx*=.4;}
  }
  for(let i=G.floats.length-1;i>=0;i--){const f=G.floats[i];f.t+=dt;if(f.t>1.8)G.floats.splice(i,1);}
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.t+=dt/.32;if(f.t>=1)G.fx.splice(i,1);}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*9);
}
function update(dt){
  G.clock+=dt;
  if(hintT>0){hintT-=dt;if(hintT<=0)$('hint').classList.remove('on');}
  if(G.cardT>0){G.cardT-=dt;if(G.cardT<=0)$('card').classList.remove('on');}
  if(G.state!=='play'){updCourt(dt);updVag(dt);updParts(dt);G.dark=darkness(G.t);return;}
  if(G.mapOpen)return;
  if(G.edgeLock>0)G.edgeLock-=dt;if(G.cheer>0)G.cheer-=dt;if(G.fade>0)G.fade-=dt*1.1;
  if(input.banner){input.banner=false;toggleStance();}
  updTime(dt);updKing(dt);tossing(dt);
  const k=G.king;
  if(G.scene==='home'){
    updFolk(dt);updVag(dt);updCourt(dt);updBuild(dt);
    G.ordT=(G.ordT||0)-dt;if(G.ordT<=0){G.ordT=.3;updOrders();}
    updBattle(dt);updHazards(dt);
    if(Math.abs(k.x-CX)>BORDER&&G.edgeLock<=0){
      if(G.battle){k.x=CX+sgn(k.x-CX)*BORDER;k.vx=0;hint('noleave','You cannot leave while raiders are in your land.',true);G.edgeLock=3;}
      else if(B.keep.level<2){k.x=CX+sgn(k.x-CX)*BORDER;k.vx=0;hint('notyet','The border stones. Raise a stone keep (level 2) before you ride to war in other lands.',true);G.edgeLock=4;}
      else showMap('travel');
    }
    if(G.vag.length&&Math.abs(Math.abs(k.x-CX)-CAMP)<90)hint('camp',document.body.classList.contains('touch')?'Vagrants. Tap the coin button beside one and they join you.':'Vagrants. Toss a coin (Space) beside one and they join you.');
    if(G.clock>75&&!G.folk.length&&!G.units.length&&B.keep.level<1)hint('lost','The vagrant camps lie beyond the fields, a short ride east or west of the ruin.',false);
  }else updField(dt);
  if(G.state!=='play')return;
  updUnits(dt);updShots(dt);updParts(dt);
  G.dark=G.scene==='home'?darkness(G.t):0;
}

// ---------- canvas size
function resize(){
  const dpr=window.devicePixelRatio||1,sw=stage.clientWidth||320,sh=stage.clientHeight||180,tall=sw/sh<1.25;
  const ch=tall?Math.min(sh,clamp(sh-210,sw/1.25,sw*1.5)):sh;
  const sc=tall?Math.max(1,Math.round(sw*dpr/210)):Math.max(1,Math.round(ch*dpr/180),Math.ceil(sw*dpr/520));

document.body.classList.add('title');
reset();G.t=.56;addEventListener('resize',resize);resize();

// ---------- input
const KEYS={ArrowLeft:-1,a:-1,A:-1,ArrowRight:1,d:1,D:1},COINK=[' ','ArrowDown','s','S'],SWORDK=['f','F','x','X','Enter','ArrowUp','w','W'],BANK=['b','B','q','Q','Shift'];
const held=new Set();
addEventListener('keydown',e=>{
  if(G.state!=='play'){if((e.key==='Enter'||e.key===' ')&&document.activeElement.id!=='cont'){e.preventDefault();start();}return;}
  if(G.mapOpen){if(e.key==='Escape'){e.preventDefault();hideMap();}return;}
  if(e.key==='m'||e.key==='M'){showMap('view');return;}
  if(KEYS[e.key]){held.add(e.key);input.key=KEYS[e.key];e.preventDefault();}
  if(COINK.includes(e.key)){input.coin=true;e.preventDefault();}
  if(SWORDK.includes(e.key)){input.sword=true;e.preventDefault();}
  if(BANK.includes(e.key)&&!e.repeat){input.banner=true;e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(KEYS[e.key]){held.delete(e.key);const last=[...held].pop();input.key=last?KEYS[last]:0;}
  if(COINK.includes(e.key))input.coin=false;
  if(SWORDK.includes(e.key))input.sword=false;
});
addEventListener('blur',()=>{held.clear();input.key=0;input.coin=input.sword=false;});
const pad=$('pad'),knob=$('knob');let padId=null;
const padSet=e=>{const r=pad.getBoundingClientRect(),dx=clamp(e.clientX-r.left-r.width/2,-34,34);input.stick=dx/34;knob.style.transform=`translateX(${dx}px)`;};
pad.addEventListener('pointerdown',e=>{padId=e.pointerId;try{pad.setPointerCapture(padId);}catch(_){}padSet(e);e.preventDefault();});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padSet(e);});
for(const ev of ['pointerup','pointercancel'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;input.stick=0;knob.style.transform='';}});
const holdBtn=(id,k)=>{const b=$(id);
  b.addEventListener('pointerdown',e=>{input[k]=true;b.classList.add('on');e.preventDefault();});
  for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{input[k]=false;b.classList.remove('on');});};

$('ban').addEventListener('pointerdown',e=>{input.banner=true;e.preventDefault();});
addEventListener('contextmenu',e=>e.preventDefault());
const touchy=()=>{document.body.classList.add('touch');if(G.state==='title')$('how').textContent='Push the stick to ride. The coin pays, the sword strikes, the flag calls your army to you.';};
if((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0)touchy();

// no text selection, copy bubble or double-tap zoom on the play field; real buttons still get their taps
const quiet=e=>{const t=e.target.closest?e.target:e.target.parentElement;if(!t||!t.closest('#go,#cont,#mute,#mapb,#map'))e.preventDefault();};
for(const ev of ['touchstart','touchmove','touchend','gesturestart','selectstart','dblclick'])document.addEventListener(ev,quiet,{passive:false});
// controller: stick or d-pad rides, A pays, X or B strikes, Y raises the banner, Back opens the map
let padWas=false,padY=false,padM=false;
function pollPad(){
  const gp=navigator.getGamepads?[...navigator.getGamepads()].find(g=>g&&g.connected):null,on=i=>!!(gp&&gp.buttons[i]&&gp.buttons[i].pressed);
  input.padAxis=gp&&Math.abs(gp.axes[0])>.25?gp.axes[0]:0;input.dpad=(on(15)?1:0)-(on(14)?1:0);input.padCoin=on(0)||on(7);input.padSword=on(1)||on(2)||on(5);
  const y=on(3);if(y&&!padY&&G.state==='play'&&!G.mapOpen)input.banner=true;padY=y;

}
addEventListener('gamepadconnected',()=>{if(G.state==='title')$('how').textContent='Controller: stick or d-pad rides, A pays, X strikes, Y raises your banner.';});
$('mapb').addEventListener('click',()=>{$('mapb').blur();showMap('view');});
$('mgo').addEventListener('click',mapGo);
$('mno').addEventListener('click',hideMap);
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').blur();});

// ---------- start and loop
function start(keep){
  if(G.state==='play')return;
  if(G.state==='over'||G.state==='title'&&keep!==true)reset();
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  G.state='play';G.fade=1;input.key=input.stick=0;input.coin=input.coinT=input.sword=input.swordT=input.banner=false;held.clear();
  $('title').hidden=true;document.body.classList.remove('title');
  for(const k in hudLast)delete hudLast[k];
  if(keep!==true)hint('start',document.body.classList.contains('touch')?'Your keep lies in ruins. Vagrants camp beyond the fields on both sides: ride out and find them.':'Ride with the arrow keys or A and D. Your keep lies in ruins. Vagrants camp beyond the fields on both sides: ride out and find them.',true);
}
$('go').addEventListener('click',()=>start());
$('cont').addEventListener('click',()=>{const s=peek();if(s&&restore(s))start(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});addEventListener('pagehide',save);
{const s=peek();if(s){$('cont').hidden=false;$('cont').textContent='Continue, day '+s.day;}}
// an open page keeps its kingdom when a new build arrives
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>G.state==='play'&&G.scene==='home'&&!G.battle?{s:snap()}:{});}catch(e){}
const boot=d=>{try{if(d&&d.s&&restore(d.s))start(true);}catch(e){}};
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});
window.RK={get G(){return G;},get B(){return B;},update,draw,start,reset,restore,snap,setLevel,mkUnit,villager,assignPosts,startRaid,startField,findTarget,dawn,input,UT,DEF,LANDS,toggleStance,showMap,hideMap,mapGo,income,popCap,raidSize};
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  pollPad();for(let i=0;i<G.timeScale;i++)update(dt);
  draw();hud();updAudio();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
