<script>
(function(){const c=document.getElementById('c');function fit(){const w=window.innerWidth,h=window.innerHeight,s=Math.min(w/960,h/540);c.style.width=(960*s)+'px';c.style.height=(540*s)+'px';c.style.left=((w-960*s)/2)+'px';c.style.top=((h-540*s)/2)+'px';}addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();})();
// ENGINE-START  (pure JS, no DOM)
const Motion = (() => {
  const PI = Math.PI, H = PI / 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const lerp = (a, b, t) => a + (b - a) * t;
  const seq = (t, ...stages) => { let s = 0; for (const [e, fn] of stages) { if (t < e || e >= 1) return fn(clamp((t - s) / (e - s), 0, 1)); s = e; } };
  const L = { torso: 28, neck: 3, head: 7, ua: 14, la: 13, th: 16, sh: 16, ft: 7, shoulder: 25, sword: 27 };
  // Pose fields: limb angles from straight down (+forward); torso/head from straight up (+lean forward);
  // la elbow bend (+forearm forward), ll knee bend (+shin back), f foot absolute (PI/2 flat), wrist = blade vs forearm,
  // turn = spin about vertical axis (drawn as squash), rot = whole-body rotation, hx hip shift, lift extra height.
  const BASE = { hx: 0, lift: 0, rot: 0, turn: 0, torso: 0, head: 0, sword: 0, wrist: 0, pivot: 0,
    ua1: .12, la1: .25, ua2: -.1, la2: .25, ul1: .02, ll1: .06, f1: H, ul2: -.02, ll2: .06, f2: H };
  const pose = o => Object.assign({}, BASE, o);
  function gait(ph, A, bend, lean, armA, armBend) {
    const s = Math.sin(ph), c = Math.cos(ph), swing = x => Math.max(0, Math.cos(x - .5));
    return pose({ torso: lean, head: -lean * .5, hx: 1.4 * Math.sin(ph + .6), lift: .9 * Math.abs(Math.cos(ph)),
      ul2: A * s, ll2: .08 + bend * swing(ph), f2: H - .35 * Math.max(0, c) + .2 * Math.max(0, -c) * Math.max(0, s),
      ul1: -A * s, ll1: .08 + bend * swing(ph + PI), f1: H - .35 * Math.max(0, -c) + .2 * Math.max(0, c) * Math.max(0, -s),
      ua2: -armA * s, la2: armBend + .25 * Math.max(0, -s), ua1: armA * s, la1: armBend + .25 * Math.max(0, s) });
  }
  const GUARD = { sword: 1, torso: -.04, head: .02, ua2: 1.1, la2: .3, wrist: .4, ua1: -1.9, la1: -.7, ul2: .55, ll2: .5, f2: H, ul1: -.5, ll1: .12, f1: H };
  const guard = o => pose(Object.assign({}, GUARD, o));
  // returns a pose that is GUARD with the given fields eased in by k (0..1)
  const KFB = Object.assign({}, BASE, { torso: .08, head: -.04, ua2: 1.3, la2: .35, ua1: -.5, la1: 2.05, ul2: .75, ll2: .8, f2: H, ul1: -.6, ll1: .05, f1: H });
  // keys(t, base, [[time, partialPose, ease?], ...]): author a move as a few clean poses; segments ease in-out, or 'out' for a snap
  const keys = (t, base, frames) => { let i = 0; while (i < frames.length - 2 && t > frames[i + 1][0]) i++;
    const [t0, P0] = frames[i], [t1, P1, mode] = frames[i + 1]; let k = clamp((t - t0) / ((t1 - t0) || 1), 0, 1); k = mode === 'out' ? easeOut(k) : mode === 'lin' ? k : ease(k);
    const a = Object.assign({}, base, P0), b = Object.assign({}, base, P1), o = {}; for (const key in b) o[key] = lerp(a[key], b[key], k); return o; };
  const arc = (t, t0, t1, h) => { const k = clamp((t - t0) / (t1 - t0), 0, 1); return h * 4 * k * (1 - k); };   // ballistic height
  const toward = (target, k) => { const g = guard(), o = {}; for (const key in g) o[key] = lerp(g[key], target[key] !== undefined ? target[key] : g[key], k); return o; };

  const Poses = {
    idle: (t) => { const b = Math.sin(t * 1.6); return pose({ torso: .02 + .015 * b, head: -.02 * b, ua1: .12 + .03 * b, ua2: -.1 - .03 * b, lift: .4 + .4 * b }); },
    walk: (t, c) => gait(c.gaitPhase, .42, .9, .04, .3, .35),
    run:  (t, c) => gait(c.gaitPhase, .75, 1.6, .28, .55, 1.5),
    crouch: (t) => pose({ torso: .55, head: -.45, ul2: 1.25, ll2: 2.1, ul1: 1.15, ll1: 2.0, ua2: .5, la2: 1.3, ua1: .6, la1: 1.2 }),
    jumpPrep: () => pose({ torso: .35, head: -.2, ul2: .7, ll2: 1.3, ul1: .6, ll1: 1.2, ua2: -.9, la2: .3, ua1: -.8, la1: .3 }),
    air: (t, c) => { const up = c.vy < 0; return pose({ torso: .15, head: -.05, ua2: up ? 2.6 : 1.6, la2: .3, ua1: up ? 2.4 : 1.4, la1: .3,
      ul2: up ? .9 : .4, ll2: up ? 1.6 : .9, f2: up ? .9 : H + .3, ul1: up ? .5 : .2, ll1: up ? 1.2 : .7, f1: up ? .9 : H + .3 }); },
    land: (t) => { const k = 1 - ease(t); return pose({ torso: .4 * k, head: -.3 * k, ul2: .9 * k, ll2: 1.6 * k, ul1: .8 * k, ll1: 1.5 * k, ua2: -.6 * k + .1, la2: .4, ua1: -.5 * k + .1, la1: .4 }); },

    // ---- Fencing ----
    guard: (t) => { const b = Math.sin(t * 1.7); return guard({ lift: .6 + .6 * b, hx: 1.2 * Math.sin(t * 1.1), ua2: 1.1 + .04 * b, head: .02 - .03 * b }); },
    guardStep: (t, c) => { const s = Math.sin(c.gaitPhase), up = Math.max(0, s), dn = Math.max(0, -s);
      return guard({ ul2: .55 + .18 * s, ll2: .5 + .45 * up, f2: H - .3 * up, ul1: -.5 + .18 * s, ll1: .12 + .45 * dn, f1: H - .3 * dn, lift: 1.5 * Math.abs(s) }); },
    lunge: (t) => seq(t,
      [.12, k => toward({ hx: -3, ua2: .85, la2: .8, torso: -.12 }, k)],
      [.38, k => { k = easeOut(k); return guard({ hx: lerp(-3, 15, k), ua2: lerp(.85, 1.6, k), la2: lerp(.8, 0, k), wrist: lerp(.4, 0, k), torso: lerp(-.12, .32, k), head: -.1 * k,
        ul2: lerp(.55, 1.05, k), ll2: lerp(.5, .35, k), ul1: lerp(-.5, -1.0, k), ll1: lerp(.12, .04, k), f1: H - .25 * k, ua1: lerp(-1.9, -1.25, k), la1: lerp(-.7, 0, k) }); }],
      [.6, () => guard({ hx: 15, ua2: 1.6, la2: 0, wrist: 0, torso: .32, head: -.1, ul2: 1.05, ll2: .35, ul1: -1.0, ll1: .04, f1: H - .25, ua1: -1.25, la1: 0 })],
      [1, k => toward({ hx: 15, ua2: 1.6, la2: 0, wrist: 0, torso: .32, head: -.1, ul2: 1.05, ll2: .35, ul1: -1.0, ll1: .04, f1: H - .25, ua1: -1.25, la1: 0 }, 1 - ease(k))]),
    parry: (t) => { const k = t < .2 ? easeOut(t / .2) : t < .6 ? 1 : 1 - ease((t - .6) / .4);
      return toward({ hx: -4, ua2: .85, la2: 1.3, wrist: .95, torso: -.14, head: .08, ul2: .45, ll2: .65, ll1: .27 }, k); },
    cut: (t) => seq(t,
      [.3, k => toward({ hx: -3, ua2: 3.1, la2: .85, wrist: -.4, torso: -.25, head: .12, ua1: -1.5 }, ease(k))],
      [.48, k => { k = easeOut(k); return guard({ hx: lerp(-3, 8, k), ua2: lerp(3.1, 1.05, k), la2: lerp(.85, .05, k), wrist: lerp(-.4, .35, k), torso: lerp(-.25, .45, k), head: lerp(.12, -.2, k),
        ul2: lerp(.55, 1.0, k), ll2: lerp(.5, .4, k), ul1: lerp(-.5, -.9, k), ll1: lerp(.12, .1, k), f1: H - .3 * k, ua1: lerp(-1.5, -1.0, k) }); }],
      [1, k => toward({ hx: 8, ua2: 1.05, la2: .05, wrist: .35, torso: .45, head: -.2, ul2: 1.0, ll2: .4, ul1: -.9, ll1: .1, f1: H - .3, ua1: -1.0 }, 1 - ease(k))]),
    spin: (t) => seq(t,
      [.22, k => toward({ hx: -4, ua2: -.6, la2: .2, wrist: -.6, torso: -.19, ll2: .9, ll1: .52, lift: -2 }, ease(k))],
      [.7, k => { const e = easeOut(k), a = Math.min(1, k * 2.5); return guard({ turn: e * 2 * PI, hx: lerp(-4, 8, e), ua2: lerp(-.6, 1.55, a), la2: 0, wrist: lerp(-.6, 0, a),
        torso: -.1, head: .05, ll2: .9 - .3 * e, ll1: .52 - .3 * e, ua1: -1.4, la1: 0, lift: 2 * Math.sin(k * PI) }); }],
      [1, k => toward({ hx: 8, ua2: 1.55, la2: 0, wrist: 0, torso: -.1, ll2: .6, ll1: .22, ua1: -1.4, la1: 0 }, 1 - ease(k))]),
    leap: (t) => seq(t,
      [.18, k => toward({ torso: .3, ul2: .8, ll2: 1.3, ul1: .5, ll1: 1.1, ua2: .4, ua1: -1, la1: .3 }, ease(k))],
      [.62, k => { const up = 4 * k * (1 - k); return guard({ lift: 46 * up, hx: 14 * k, torso: .1, head: .15, ua2: lerp(.4, 3.2, easeOut(Math.min(1, k * 2))), la2: .7, wrist: -.5,
        ul2: .9 * up + .2, ll2: 1.5 * up + .3, f2: H - .6 * up, ul1: .4 * up, ll1: 1.2 * up + .2, f1: H - .4 * up, ua1: -1.2, la1: .4 }); }],
      [.76, k => { k = easeOut(k); return guard({ hx: 14 + 6 * k, torso: lerp(.1, .6, k), head: lerp(.15, -.3, k), ua2: lerp(3.2, 1.15, k), la2: lerp(.7, .05, k), wrist: lerp(-.5, .35, k),
        ul2: lerp(.2, 1.15, k), ll2: lerp(.3, 1.6, k), ul1: lerp(0, .9, k), ll1: lerp(.2, 1.5, k), ua1: lerp(-1.2, -.6, k), la1: .3 }); }],
      [1, k => toward({ hx: 20, torso: .6, head: -.3, ua2: 1.15, la2: .05, wrist: .35, ul2: 1.15, ll2: 1.6, ul1: .9, ll1: 1.5, ua1: -.6, la1: .3 }, 1 - ease(k))]),
    salute: (t) => seq(t,
      [.3, k => toward({ ua2: .35, la2: 2.3, wrist: .55, head: -.1, ul2: .1, ll2: .1, ul1: -.1, ll1: .1, ua1: -.3, la1: .3 }, ease(k))],
      [.55, () => guard({ ua2: .35, la2: 2.3, wrist: .55, head: -.1, ul2: .1, ll2: .1, ul1: -.1, ll1: .1, ua1: -.3, la1: .3 })],
      [.8, k => { k = easeOut(k); return guard({ ua2: lerp(.35, 1.0, k), la2: lerp(2.3, .05, k), wrist: lerp(.55, -.2, k), head: .15 * k, torso: .2 * k, ul2: .1, ll2: .1, ul1: -.1, ll1: .1, ua1: -.3, la1: .3 }); }],
      [1, k => toward({ ua2: 1.0, la2: .05, wrist: -.2, head: .15, torso: .2, ul2: .1, ll2: .1, ul1: -.1, ll1: .1, ua1: -.3, la1: .3 }, 1 - ease(k))]),

    open: (t) => { const k = t < .3 ? easeOut(t / .3) : t < .7 ? 1 : 1 - ease((t - .7) / .3);   // guard drops: sword lowers and torso opens up
      return toward({ ua2: .35, la2: .15, wrist: -.35, torso: -.12, head: .12, ua1: -1.2, la1: -.4, ul2: .4, ll2: .35, lift: -1 }, k); },
    ride: (t, c) => { // in the saddle: sways with the stride, leans into a gallop, looks about and pats the horse when standing
      const g = c.gallop ? 1 : 0, mv = (c.sp || 0) > 8, ph = c.gaitPhase || 0, sway = mv ? Math.sin(ph * 2) * (g ? .07 : .035) : Math.sin(t * 1.2) * .015, look = c.look || 0, pat = c.pat || 0;
      return pose({ torso: .12 + .3 * g + sway, head: -.1 - .1 * g - look * .25 + (mv ? -sway * .5 : 0), turn: look * .35,
        ul2: 1.15 + (mv ? Math.sin(ph * 2) * .04 : 0), ll2: 1.25, f2: H - .3, ul1: 1.05, ll1: 1.15, f1: H - .3,
        ua2: lerp(.85 + .3 * g + (mv ? Math.sin(ph * 2 + 1) * .08 : 0), 1.5, pat), la2: lerp(.9 + sway, .3, pat), ua1: .75 + .3 * g, la1: 1.0 + (mv ? Math.sin(ph * 2) * .1 : 0), lift: mv ? Math.max(0, Math.sin(ph * 2)) * (g ? 1.2 : .4) : 0 }); },
    feint: (t) => seq(t,   // half a lunge, then snap back — sells the attack without committing
      [.28, k => toward({ hx: 8, ua2: 1.45, la2: .1, wrist: .1, torso: .2, ul2: .85, ll2: .4, ul1: -.75, ll1: .06, ua1: -1.5, la1: -.3 }, easeOut(k))],
      [1, k => toward({ hx: 8, ua2: 1.45, la2: .1, wrist: .1, torso: .2, ul2: .85, ll2: .4, ul1: -.75, ll1: .06, ua1: -1.5, la1: -.3 }, 1 - easeOut(k))]),
    slash: (t) => seq(t,   // level horizontal cut across the body
      [.3, k => toward({ hx: -3, ua2: -.55, la2: .6, wrist: -.25, torso: -.2, turn: -.35, head: .1, ll2: .6, ll1: .3 }, ease(k))],
      [.5, k => { k = easeOut(k); return guard({ hx: lerp(-3, 7, k), ua2: lerp(-.55, 1.55, k), la2: lerp(.6, 0, k), wrist: lerp(-.25, .1, k), torso: lerp(-.2, .3, k), turn: lerp(-.35, .45, k), head: lerp(.1, -.1, k),
        ul2: lerp(.55, .9, k), ll2: lerp(.6, .4, k), ul1: lerp(-.5, -.8, k), ll1: lerp(.3, .1, k), f1: H - .25 * k, ua1: lerp(-1.9, -1.2, k), la1: lerp(-.7, 0, k) }); }],
      [1, k => toward({ hx: 7, ua2: 1.55, la2: 0, wrist: .1, torso: .3, turn: .45, head: -.1, ul2: .9, ll2: .4, ul1: -.8, ll1: .1, f1: H - .25, ua1: -1.2, la1: 0 }, 1 - ease(k))]),
    fleche: (t, c) => seq(t,   // running attack: two quick steps then a flying thrust
      [.4, k => { const ph = k * 2 * PI * 2, s = Math.sin(ph); return guard({ torso: .35, head: -.1, lift: 2 * Math.abs(s), ua2: .6, la2: .9, wrist: -.2, ua1: -1.4, la1: .2,
        ul2: .3 + .6 * s, ll2: .3 + .9 * Math.max(0, s), f2: H - .3 * Math.max(0, s), ul1: .3 - .6 * s, ll1: .3 + .9 * Math.max(0, -s), f1: H - .3 * Math.max(0, -s) }); }],
      [.58, k => { k = easeOut(k); return guard({ hx: 16 * k, lift: 6 * (1 - k), torso: lerp(.35, .4, k), head: -.15, ua2: lerp(.6, 1.65, k), la2: lerp(.9, 0, k), wrist: lerp(-.2, 0, k), ua1: -1.3, la1: 0,
        ul2: lerp(.3, 1.1, k), ll2: lerp(.3, .3, k), ul1: lerp(.3, -1.05, k), ll1: .05, f1: H - .3 }); }],
      [1, k => toward({ hx: 16, torso: .4, head: -.15, ua2: 1.65, la2: 0, wrist: 0, ua1: -1.3, la1: 0, ul2: 1.1, ll2: .3, ul1: -1.05, ll1: .05, f1: H - .3 }, 1 - ease(k))]),
    pommel: (t) => seq(t,   // close in and bash with the hilt
      [.28, k => toward({ hx: -2, ua2: .45, la2: 2.1, wrist: -1.6, torso: -.08, ua1: -1.2, la1: -.2 }, ease(k))],
      [.45, k => { k = easeOut(k); return guard({ hx: lerp(-2, 7, k), ua2: lerp(.45, 1.35, k), la2: lerp(2.1, 1.25, k), wrist: -1.6, torso: lerp(-.08, .3, k), head: -.1 * k, ul2: .55 + .3 * k, ul1: -.5 - .3 * k, ll1: .12, f1: H - .2 * k, ua1: -1.2, la1: -.2 }); }],
      [1, k => toward({ hx: 7, ua2: 1.35, la2: 1.25, wrist: -1.6, torso: .3, head: -.1, ul2: .85, ul1: -.8, f1: H - .2, ua1: -1.2, la1: -.2 }, 1 - ease(k))]),

    // ---- Pirate dodges & bends ----
    leanBack: (t) => { const k = t < .18 ? easeOut(t / .18) : t < .62 ? 1 : 1 - ease((t - .62) / .38);   // limbo under the blade
      return toward({ hx: -7, torso: -1.05, head: .4, ul2: .75, ll2: .55, ul1: -.25, ll1: .95, f1: H - .5, ua2: 2.7, la2: .3, wrist: .4, ua1: -1.3, la1: 0 }, k); },
    hopBack: (t) => { const up = 4 * Math.min(1, t) * (1 - Math.min(1, t)); return guard({ lift: 16 * up, ul2: .55 + .5 * up, ll2: .5 + .9 * up, f2: H - .5 * up, ul1: -.5 + .3 * up, ll1: .12 + .8 * up, f1: H - .4 * up, torso: -.04 - .15 * up, ua2: 1.1 + .2 * up }); },
    duckCut: (t) => seq(t,   // drop under a high cut and slash the legs
      [.28, k => toward({ torso: .55, head: -.35, ul2: 1.3, ll2: 2.2, ul1: 1.05, ll1: 1.95, f1: H, ua2: -.9, la2: .4, wrist: -.3, ua1: -.6, la1: .9 }, ease(k))],
      [.48, k => { k = easeOut(k); return guard({ hx: 9 * k, torso: .55, head: -.35, ul2: lerp(1.3, 1.35, k), ll2: lerp(2.2, 1.5, k), ul1: lerp(1.05, .25, k), ll1: lerp(1.95, 1.8, k), f1: lerp(H, -H - .3, k), ua2: lerp(-.9, 1.6, k), la2: lerp(.4, 0, k), wrist: lerp(-.3, 0, k), ua1: -.6, la1: .9 }); }],
      [1, k => toward({ hx: 9, torso: .55, head: -.35, ul2: 1.35, ll2: 1.5, ul1: .25, ll1: 1.8, f1: -H - .3, ua2: 1.6, la2: 0, wrist: 0, ua1: -.6, la1: .9 }, 1 - ease(k))]),
    boot: (t) => seq(t,
      [.3, k => toward({ torso: -.3, head: .2, ul2: 1.25, ll2: 1.9, f2: H - .5, ul1: -.4, ua2: 1.4, la2: .6, wrist: .2, ua1: -1.4, la1: 0 }, ease(k))],
      [.5, k => { k = easeOut(k); return guard({ torso: lerp(-.3, -.4, k), head: .25, hx: 3 * k, ul2: lerp(1.25, 1.6, k), ll2: lerp(1.9, .08, k), f2: lerp(H - .5, H + 1.1, k), ul1: -.3, ll1: .12, ua2: 1.4, la2: .6, wrist: .2, ua1: -1.4, la1: 0 }); }],
      [1, k => toward({ torso: -.4, head: .25, hx: 3, ul2: 1.6, ll2: .08, f2: H + 1.1, ul1: -.3, ua2: 1.4, la2: .6, wrist: .2, ua1: -1.4, la1: 0 }, 1 - ease(k))]),


    // ---- Acrobatics (added for the action template) ----
    // A forward somersault that ends in an overhead chop; the fighter travels and can drop off a ledge while doing it.
    flipChop: (t) => seq(t,
      [.2, k => toward({ torso: .35, head: -.15, ul2: .8, ll2: 1.3, ul1: .6, ll1: 1.2, ua2: -.4, la2: .3, wrist: -.3, ua1: -.9, la1: .3 }, ease(k))],
      [.72, k => { const up = 4 * k * (1 - k), a = Math.min(1, k * 1.5); return guard({ rot: 2 * PI * ease(k), pivot: 1, lift: 60 * up, torso: .3, head: -.1,
        ul2: .3 + 1.3 * up, ll2: .4 + 1.8 * up, f2: H - .5 * up, ul1: .2 + 1.1 * up, ll1: .3 + 1.6 * up, f1: H - .5 * up,
        ua2: lerp(-.4, 3.0, a), la2: .4, wrist: -.4, ua1: -1.2, la1: .3 }); }],
      [.86, k => { k = easeOut(k); return guard({ hx: 10 * k, torso: lerp(.3, .55, k), head: -.25, ua2: lerp(3.0, 1.0, k), la2: lerp(.4, .05, k), wrist: lerp(-.4, .35, k),
        ul2: lerp(.3, 1.2, k), ll2: lerp(.4, 1.7, k), ul1: lerp(.2, .9, k), ll1: lerp(.3, 1.5, k), ua1: -.7, la1: .3 }); }],
      [1, k => toward({ hx: 10, torso: .55, head: -.25, ua2: 1.0, la2: .05, wrist: .35, ul2: 1.2, ll2: 1.7, ul1: .9, ll1: 1.5, ua1: -.7, la1: .3 }, 1 - ease(k))]),
