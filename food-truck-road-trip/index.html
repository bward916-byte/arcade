<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Food Truck Road Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sunny, crafty, storybook road trip
   IDEA: a paper-cutout diorama — the truck drives a paper road past paper hills
   PICTURE: layered papercraft landscape, sticker-style truck, ingredients and obstacles in three lanes
   COLOUR and TYPE: sky blue, kraft cream, tomato red; Fredoka
   LAYOUT: thin HUD, order card pinned on the sky, road below, big lane buttons at the bottom */
:root{--ink:#3d3354;--paper:#fffaf0;--red:#ef5a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#7cb85a;font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;color:var(--ink);cursor:pointer}
#app{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;flex-direction:column;background:#7cb85a}
#top{display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:#4aa3df;border-bottom:3px solid #fff}
.pill{display:flex;align-items:center;gap:3px;height:36px;background:var(--paper);border-radius:12px;padding:0 9px 0 3px;font-weight:700;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
.pill img{width:30px;height:30px}
#hearts{display:flex;gap:1px;padding-right:4px}#hearts img{width:24px;height:24px;transition:opacity .2s,transform .2s}#hearts img.off{opacity:.2;filter:grayscale(1);transform:scale(.8)}
.sp{flex:1}
.ib{width:38px;height:36px;border:0;border-radius:12px;background:var(--paper);font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.15);padding:0}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#order{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:16px;padding:5px 9px 5px 5px;box-shadow:0 3px 0 rgba(61,51,84,.18),0 6px 14px rgba(0,0,0,.12);border:3px solid #fff;transition:transform .2s;pointer-events:none}
#order.hide{opacity:0}
#oAni{width:48px;height:48px}
#oArrow{font-weight:700;font-size:15px;opacity:.5}
#oFood{width:44px;height:44px}
#slots{display:flex;gap:3px}
.slot{width:38px;height:38px;border-radius:10px;background:#efe6d6;display:grid;place-items:center;position:relative}
.slot img{width:34px;height:34px;opacity:.55;filter:grayscale(.4)}
.slot.got{background:#c9f0b8}.slot.got img{opacity:1;filter:none;animation:pop .3s}
.slot.got::after{content:'✓';position:absolute;right:-3px;bottom:-5px;font-size:15px;font-weight:700;color:#2e9e4b}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#order.done{transform:scale(1.08)}
#ctl{display:flex;gap:10px;padding:8px 10px calc(max(env(safe-area-inset-bottom),12px) + 8px);background:#5e9c45;border-top:3px solid #fff}
.lane{flex:1;height:58px;border:0;border-radius:18px;background:var(--paper);font-size:26px;font-weight:700;box-shadow:0 4px 0 #3f7a2c;display:flex;align-items:center;justify-content:center;gap:6px}
.lane small{font-size:15px}
.lane:active{transform:translateY(3px);box-shadow:0 1px 0 #3f7a2c}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:auto}
.ov.hide{display:none}
#title{background-size:cover;background-position:center}
.panel{background:var(--paper);border-radius:24px;border:4px solid #fff;box-shadow:0 8px 0 rgba(61,51,84,.2),0 18px 40px rgba(0,0,0,.2);padding:14px 16px;max-width:380px;width:100%}
#logo{width:min(380px,94vw);display:block;margin:0 auto -4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:float 2.4s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-6px) rotate(-1deg)}}
.how{font-size:15px;line-height:1.35;margin:4px 0 10px;font-weight:500}
.btn{background:var(--red);color:#fff;border:3px solid #fff;border-radius:18px;font-size:22px;font-weight:700;padding:8px 30px;min-height:52px;box-shadow:0 5px 0 #b93b30}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b93b30}
.btn.alt{background:#4aa3df;box-shadow:0 5px 0 #2d77ad}
h2{margin:0;font-size:28px}
.garage{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
.tk{flex:1;max-width:110px;border:3px solid #eee3cf;border-radius:16px;background:#fff;padding:4px 2px 6px;font-size:13px;font-weight:700}
.tk img{width:100%;display:block}
.tk.sel{border-color:var(--red);background:#fff1ee}
.tk.lock img{filter:grayscale(1) brightness(1.1);opacity:.55}
.stat{display:flex;justify-content:space-between;font-size:17px;padding:4px 4px;border-bottom:2px dashed #eadfcb;font-weight:600}
.big{font-size:44px;font-weight:700;color:var(--red);line-height:1;margin:4px 0}
.home{display:none;margin-top:12px;font-weight:700;color:#fff;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
body.inhub .home{display:inline-block}
@media (prefers-reduced-motion:reduce){#logo{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill"><img data-art="coin" alt=""><span id="vCo">0</span></div>
    <div class="pill" style="font-size:15px">🚩<span id="vDist">0</span>m</div>
    <div class="sp"></div>
    <div id="hearts"></div>
    <button class="ib" id="snd" aria-label="Sound">🔊</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="order" class="hide"><img id="oAni" alt=""><img id="oFood" alt=""><span id="oArrow">=</span><div id="slots"></div></div>
  </div>
  <div id="ctl"><button class="lane" id="bUp" aria-label="Lane up">▲ <small>up</small></button><button class="lane" id="bDn" aria-label="Lane down">▼ <small>down</small></button></div>
</div>
<div class="ov" id="title"><div style="width:100%;max-width:400px"><img id="logo" data-art="logo" alt="Food Truck Road Trip"><div class="panel">
  <p class="how">Steer between 3 lanes. Grab the ingredients on the order card to cook it for the customer. Dodge cones, rocks, potholes and cars!</p>
  <div class="garage" id="garage"></div>
  <button class="btn" id="play">Let's Go!</button><br><a class="home" href="../index.html">← All games</a></div></div></div>
<div class="ov hide" id="over"><div class="panel" id="overP"></div></div>

function layout(){const vh=window.visualViewport?visualViewport.height:innerHeight;$('app').style.height=vh+'px';
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  laneH=Math.min(H*0.17,W*0.25,120);roadBot=H-Math.max(laneH*0.75,H*0.1);roadTop=roadBot-laneH*3;TX=Math.max(W*0.2,laneH*0.9);makeTex();}
addEventListener('resize',layout);if(window.visualViewport)visualViewport.addEventListener('resize',layout);
const laneY=l=>roadTop+laneH*(l+0.5);

/* paper textures */
let roadPat=null,grassPat=null,sandPat=null;
function paperTex(base,dots,sz=160){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,sz,sz);
  for(let i=0;i<900;i++){g.fillStyle=pick(dots);g.globalAlpha=rnd(.04,.12);g.fillRect(rnd(0,sz),rnd(0,sz),rnd(1,3),rnd(1,3));}
  for(let i=0;i<14;i++){g.strokeStyle=pick(dots);g.globalAlpha=.05;g.lineWidth=1;g.beginPath();const x=rnd(0,sz),y=rnd(0,sz);g.moveTo(x,y);g.lineTo(x+rnd(-30,30),y+rnd(-30,30));g.stroke();}
  return ctx.createPattern(c,'repeat');}
function makeTex(){sandPat=paperTex('#e8c27a',['#ffffff','#b98b45','#f5dca8']);roadPat=paperTex('#5d5866',['#ffffff','#2b2733','#8a8494']);grassPat=paperTex('#7cc25c',['#ffffff','#3f8a34','#a8dc7c']);}

/* state */
let G=null,P=[],FX=[];
const ZL=350,ZONES=[{n:'Sunny Meadow',e:'🌼',tint:[0,0,0,0],top:['tree','house','bush','tree'],bot:['bush','tree','bush']},
  {n:'Cactus Desert',e:'🌵',tint:[255,165,60,.2],top:['cactus','house','cactus','bush'],bot:['cactus','cactus','bush'],sand:1},
  {n:'Sunset Hills',e:'🌅',tint:[255,95,70,.26],top:['tree','house','bush','tree'],bot:['bush','tree','bush']},
  {n:'Starry Night',e:'🌙',tint:[20,22,75,.55],top:['house','tree','house','bush'],bot:['bush','tree','bush'],night:1}];
const zi=d=>Math.floor(d/ZL)%ZONES.length,Z=()=>ZONES[zi(G?G.dist:0)];
const DEC_TOP=ZONES[0].top,DEC_BOT=ZONES[0].bot;
function tintNow(){if(!G)return[0,0,0,0];const d=G.dist,k=Math.min(1,(d%ZL)/40),a=ZONES[(zi(d)+ZONES.length-1)%ZONES.length].tint,b=ZONES[zi(d)].tint;if(d<ZL)return b;return a.map((v,i)=>v+(b[i]-v)*k);}
function sandK(){if(!G)return 0;const d=G.dist,k=Math.min(1,(d%ZL)/40),a=ZONES[(zi(d)+ZONES.length-1)%ZONES.length].sand?1:0,b=Z().sand?1:0;return d<ZL?b:a+(b-a)*k;}
const STARS=Array.from({length:40},()=>[Math.random(),Math.random()*0.8,Math.random()*1.5+0.6]);
function newOrder(){const r=pick(RECIPES);G.order={r,got:r.need.map(()=>false),ani:pick(ANIMALS.filter(a=>!G.order||a!==G.order.ani))};drawOrder();}
function drawOrder(){const o=G.order,el=$('slots');$('oAni').src=ART_SRC[o.ani];$('oFood').src=ART_SRC[o.r.k];el.replaceChildren();
  o.r.need.forEach((k,i)=>{const d=document.createElement('div');d.className='slot'+(o.got[i]?' got':'');const im=document.createElement('img');im.src=ART_SRC[k];im.alt='';d.appendChild(im);el.appendChild(d);});
  $('order').classList.remove('hide');}
function hearts(){const h=$('hearts');h.replaceChildren();for(let i=0;i<maxHp();i++){const im=document.createElement('img');im.src=ART_SRC.heart;im.alt='';if(i>=G.hp)im.className='off';h.appendChild(im);}}
function start(){ac();$('title').classList.add('hide');$('over').classList.add('hide');
  G={lane:1,y:0,t:0,dist:0,coins:0,served:0,hp:maxHp(),inv:0,turbo:0,speed:0,objs:[],decT:[],decB:[],nextSpawn:0,bgx:0,shake:0,count:3.2,cheer:null,order:null,run:true,wob:0};
  G.y=laneY(1);P=[];FX=[];newOrder();hearts();
  for(let x=0;x<W+200;x+=rnd(70,140))G.decT.push({k:pick(DEC_TOP),x,s:rnd(.75,1.05)});for(let x=0;x<W+200;x+=rnd(60,120))G.decB.push({k:pick(DEC_BOT),x,s:rnd(.6,.85)});}
function move(d){if(!G||!G.run||G.count>0)return;const n=clamp(G.lane+d,0,2);if(n!==G.lane){G.prevLane=G.lane;G.laneT=G.t;G.lane=n;SFX.lane();}}
$('bUp').addEventListener('pointerdown',e=>{e.preventDefault();ac();move(-1);});$('bDn').addEventListener('pointerdown',e=>{e.preventDefault();ac();move(1);});
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w'){move(-1);e.preventDefault();}if(e.key==='ArrowDown'||e.key==='s'){move(1);e.preventDefault();}});
let sy=null;cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const r=cv.getBoundingClientRect();sy=e.clientY;const y=e.clientY-r.top;cv._tapY=y;});
cv.addEventListener('pointerup',e=>{if(sy===null)return;const dy=e.clientY-sy;if(Math.abs(dy)>24)move(dy<0?-1:1);else if(G){move(cv._tapY<G.y?-1:1);}sy=null;});
['touchstart','touchmove','touchend'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('.ov'))return;if(e.cancelable)e.preventDefault();},{passive:false}));

/* spawning */
function spawn(){const x=W+laneH;const lanes=[0,1,2].sort(()=>Math.random()-.5);const diff=clamp(G.t/150,0,1);
  const nOb=Math.random()<0.25+diff*0.45?(Math.random()<diff*0.5?2:1):0;const need=G.order.r.need.filter((k,i)=>!G.order.got[i]);
  lanes.forEach((l,i)=>{let o=null;
    if(i<nOb){if(G.t>18&&nOb===1&&(G.lastOb||0)<=1&&Math.random()<0.22+diff*0.18)o={k:'car',l,x:x+laneH*2,v:laneH*1.6,ob:1,flip:1};else o={k:pick(OBST),l,x,ob:1};}
    else if(i===nOb){const r=Math.random();if(r<0.55&&need.length)o={k:pick(need),l,x,ing:1};else if(r<0.75)o={k:pick(INGS),l,x,ing:1};
      else if(r<0.9)o={k:'coin',l,x,coin:1};else if(r<0.95&&G.hp<maxHp())o={k:'heart',l,x,heart:1};else o={k:'bolt',l,x,bolt:1};}
    else if(Math.random()<0.3)o={k:'coin',l,x:x+laneH*rnd(.6,1.2),coin:1};
    if(o){o.t0=G.t;G.objs.push(o);}});
  G.lastOb=nOb;
  if(nOb===0&&Math.random()<0.5){const l=pick([0,1,2]);for(let j=1;j<=3;j++)G.objs.push({k:'coin',l,x:x+laneH*(0.9+j*0.7),coin:1});}}

/* update */
function step(dt){G.t+=dt;if(G.count>0){G.count-=dt;const c=Math.ceil(G.count);if(c!==G._c){G._c=c;c>0?SFX.beep():SFX.go();}G.speed=laneH*1.2;}
  else G.speed=laneH*(2.3+Math.min(2.6,G.t/55))*(G.turbo>0?1.35:1);
  const dx=G.speed*dt;G.dist+=dx/laneH*4;G.bgx+=dx*0.12;
  G.y+=(laneY(G.lane)-G.y)*Math.min(1,dt*16);G.inv=Math.max(0,G.inv-dt);G.turbo=Math.max(0,G.turbo-dt);G.shake=Math.max(0,G.shake-dt*30);G.wob=Math.max(0,G.wob-dt);
  [G.decT,G.decB].forEach((arr,bi)=>{arr.forEach(d=>d.x-=dx);while(arr.length&&arr[0].x<-140)arr.shift();let last=arr.length?arr[arr.length-1].x:W;
    while(last<W+200){last+=bi?rnd(60,130):rnd(70,150);arr.push({k:pick(bi?Z().bot:Z().top),x:last,s:bi?rnd(.6,.85):rnd(.75,1.05)});}});
  const z=zi(G.dist);if(G.zone===undefined)G.zone=z;if(z!==G.zone){G.zone=z;G.zoneT=G.t;G.coins+=5;[659,880,1046,1318].forEach((f,i)=>tone(f,.14,'sine',.07,i*.09));}
  if(G.count<=0){G.nextSpawn-=dx;if(G.nextSpawn<=0){spawn();G.nextSpawn=laneH*rnd(2.1,2.9)*clamp(1.15-G.t/300,0.75,1.15);}}
  const tl=Math.round((G.y-roadTop)/laneH-0.5),tw=laneH*1.25;
  for(let i=G.objs.length-1;i>=0;i--){const o=G.objs[i];o.x-=dx+(o.v||0)*dt;if(o.x<-laneH*2){G.objs.splice(i,1);continue;}
    if(o.ob&&!o.dead&&!o.passed&&o.x<TX-laneH*0.4){o.passed=1;if(o.l===G.prevLane&&o.l!==tl&&G.t-G.laneT<0.7&&G.hp>0){G.coins+=3;txt(TX,G.y-laneH*.6,'Close call! +3','#ffd34d');SFX.coin();burst(TX-laneH*.3,laneY(o.l),['#fff','#ffd34d'],6,120);}}
    if(o.coin&&!o.dead&&SV.truck==='truck_yellow'&&Math.abs(o.l-tl)===1&&Math.abs(o.x-TX)<laneH*0.5){hitObj(o);continue;}
    if(o.l!==tl||o.dead)continue;const hw=o.k==='car'?laneH*0.6:laneH*0.32;if(Math.abs(o.x-TX)<tw*0.42+hw){hitObj(o);}}
  if(G.cheer&&G.t-G.cheer.t>1.6)G.cheer=null;
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.r+=(p.vr||0)*dt;p.life-=dt*(p.fade||1.2);if(p.life<=0)P.splice(i,1);}
  for(let i=FX.length-1;i>=0;i--){if(G.t-FX[i].t>1)FX.splice(i,1);}
  $('vDist').textContent=Math.floor(G.dist);$('vCo').textContent=G.coins;}
function burst(x,y,cols,n=10,sp=220){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(sp*.4,sp);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,g:500,life:1,c:pick(cols),sz:rnd(5,10),r:rnd(0,6),vr:rnd(-8,8),fade:1.3});}}
function txt(x,y,s,c){FX.push({x,y,s,c,t:G.t});}
function hitObj(o){if(o.ob){if(G.inv>0||G.turbo>0){if(G.turbo>0){o.dead=1;o.fly=G.t;burst(o.x,laneY(o.l),['#fff','#ffd34d'],8);SFX.coin();}return;}
    o.dead=1;o.fly=G.t;G.hp--;G.clean=0;G.inv=1.4;G.shake=10;G.wob=0.6;SFX.hit();hearts();burst(TX+laneH*.5,G.y,['#5d5866','#fff','#ef5a4c'],14);txt(TX,G.y-laneH*.6,'Ouch!','#ef5a4c');
    if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
    if(G.hp<=0){G.run=false;setTimeout(gameOver,900);}return;}
  o.dead=1;o.grab=G.t;
  if(o.coin){G.coins+=G.turbo>0?2:1;SFX.coin();burst(TX,G.y,['#ffd34d','#fff3a0'],5,140);return;}
  if(o.heart){G.hp=Math.min(maxHp(),G.hp+1);hearts();SFX.grab();txt(TX,G.y-laneH*.6,'+1 ♥','#ef5a4c');return;}
  if(o.bolt){G.turbo=5;SFX.bolt();txt(TX,G.y-laneH*.6,'TURBO!','#4aa3df');burst(TX,G.y,['#4aa3df','#fff','#ffd34d'],16);return;}
  const od=G.order,i=od.r.need.findIndex((k,j)=>k===o.k&&!od.got[j]);
  if(i>=0){od.got[i]=true;SFX.grab();drawOrder();burst(TX,G.y,['#fff','#c9f0b8','#ffd34d'],8,160);
    if(od.got.every(Boolean)){G.served++;G.clean=(G.clean||0)+1;const mul=1+Math.min(4,G.clean-1)*0.25,pay=Math.round((10+Math.min(30,G.served))*mul);if(mul>1)setTimeout(()=>txt(W*0.62,roadTop-laneH*0.75,`No-bump streak ×${mul}`,'#4aa3df'),250);G.coins+=pay;SFX.serve();$('order').classList.add('done');
      G.cheer={ani:od.ani,food:od.r.k,t:G.t,pay};txt(W*0.62,roadTop-laneH*1.1,`+${pay} ${od.r.n}!`,'#ffd34d');burst(W*0.75,roadTop-laneH*.6,['#ef5a4c','#ffd34d','#4aa3df','#7cc25c','#fff'],26,300);
      setTimeout(()=>{if(G){$('order').classList.remove('done');newOrder();}},650);}}
  else{G.coins++;SFX.coin();txt(TX,G.y-laneH*.55,'+1','#fff');}}

/* draw */
function spr(k,x,y,s,flip=0,rot=0,a=1){const im=ART[k];if(!im)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-s/2,-s/2,s,s);ctx.restore();}
function draw(t){ctx.setTransform(DPR,0,0,DPR,0,0);const sh=G&&G.shake?rnd(-G.shake,G.shake):0;ctx.translate(0,sh);
  // sky bg (mirror tiled)
  const bg=ART.bg,bgH=roadTop+laneH*0.15,bgW=bg?bgH*bg.width/bg.height:W;ctx.fillStyle='#4aa3df';ctx.fillRect(0,-20,W,bgH+20);
  if(bg){const off=(G?G.bgx:t*0.02)%(bgW*2);for(let x=-off,i=0;x<W;x+=bgW,i++){ctx.save();if(i%2){ctx.translate(x+bgW,0);ctx.scale(-1,1);ctx.drawImage(bg,0,0,bgW,bgH);}else ctx.drawImage(bg,x,0,bgW,bgH);ctx.restore();}}
  // top verge decor
  const decs=G?G.decT:[];decs.forEach(d=>{const s=laneH*0.95*d.s;spr(d.k,d.x,roadTop-s*0.42,s);});
  // road
  ctx.fillStyle=roadPat||'#5d5866';ctx.save();ctx.translate(-((G?G.dist*laneH/4:0)%160),0);ctx.fillRect(0,roadTop,W+160,laneH*3);ctx.restore();
  ctx.fillStyle='#fffaf0';ctx.fillRect(0,roadTop-5,W,7);ctx.fillRect(0,roadBot-2,W,7);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,roadTop+2,W,4);
  const dashOff=G?(G.dist*laneH/4)%(laneH*1.4):0;for(let l=1;l<3;l++){const y=roadTop+laneH*l;for(let x=-dashOff;x<W;x+=laneH*1.4){ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x+2,y-1,laneH*0.7,7);ctx.fillStyle='#fffaf0';ctx.fillRect(x,y-3,laneH*0.7,6);}}
  // bottom grass
  ctx.fillStyle=grassPat||'#7cc25c';ctx.fillRect(0,roadBot+5,W,H-roadBot);const sk=sandK();if(sk>0&&sandPat){ctx.globalAlpha=sk;ctx.fillStyle=sandPat;ctx.fillRect(0,roadBot+5,W,H-roadBot);ctx.fillRect(0,roadTop-laneH*0.35,W,laneH*0.33);ctx.globalAlpha=1;}
  if(!G){return;}
  // objects
  const objs=G.objs.slice().sort((a,b)=>a.l-b.l);
  for(const o of objs){let x=o.x,y=laneY(o.l),s=laneH*0.74,a=1,rot=0;
    if(o.k==='car')s=laneH*1.2;if(o.k==='pothole'||o.k==='puddle')s=laneH*0.85;if(o.coin)s=laneH*0.5;
    if(o.grab){const u=(G.t-o.grab)/0.25;if(u>=1)continue;x=x+(TX-x)*u;y=y+(G.y-y)*u;s*=1-u*0.5;a=1-u;}
    else if(o.fly){const u=(G.t-o.fly);if(u>0.8)continue;y-=u*laneH*3-u*u*laneH*2;x+=u*laneH*2;rot=u*8;a=1-u/0.8;}
    else{if(o.ing||o.bolt||o.heart)y+=Math.sin(t*0.006+o.x*0.02)*3;if(o.coin)s*=0.85+0.15*Math.abs(Math.sin(t*0.006+o.x));}
    if(!o.ob&&!o.grab){ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,laneY(o.l)+s*0.38,s*0.32,s*0.08,0,0,Math.PI*2);ctx.fill();}
    if(o.ing&&!o.grab&&G.order.r.need.some((k,j)=>k===o.k&&!G.order.got[j])){ctx.fillStyle='rgba(255,240,140,.55)';ctx.beginPath();ctx.arc(x,y,s*0.58+Math.sin(t*0.01)*3,0,Math.PI*2);ctx.fill();}
    spr(o.k,x,y,s,o.flip,rot,a);}
  // truck
  const tk=SV.truck,ts=laneH*1.35,bob=Math.sin(t*0.025)*1.5,tilt=(laneY(G.lane)-G.y)/laneH*-0.25+(G.wob?Math.sin(G.t*40)*G.wob*0.3:0);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(TX,G.y+ts*0.3,ts*0.42,ts*0.07,0,0,Math.PI*2);ctx.fill();
  if(G.turbo>0){for(let i=0;i<3;i++){ctx.fillStyle=`rgba(74,163,223,${0.25-i*0.07})`;ctx.fillRect(TX-ts*0.5-i*18-rnd(0,10),G.y-ts*0.25+i*8,ts*0.3,5);ctx.fillRect(TX-ts*0.55-i*14-rnd(0,10),G.y+ts*0.08-i*6,ts*0.25,5);}}
  if(G.count<=0&&Math.random()<0.3)P.push({x:TX-ts*0.45,y:G.y+ts*0.18,vx:-rnd(40,90),vy:-rnd(10,40),life:.7,c:'#e9e2f0',sz:rnd(6,11),r:0,fade:1.5,puff:1});
  const blink=G.inv>0&&Math.floor(G.t*12)%2;spr(tk,TX,G.y-ts*0.08+bob,ts,0,tilt,blink?0.45:1);
  if(G.turbo>0)spr('bolt',TX+ts*0.05,G.y-ts*0.55+bob,laneH*0.35);
  // bottom verge decor (in front)
  G.decB.forEach(d=>{const s=laneH*0.9*d.s;spr(d.k,d.x,roadBot+s*0.42+4,s);});
  // particles
  for(const p of P){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;if(p.puff){ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(1.6-p.life),0,Math.PI*2);ctx.fill();}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillRect(-p.sz/2,-p.sz/3,p.sz,p.sz*0.66);ctx.restore();}}
  ctx.globalAlpha=1;
  // zone tint, night stars and headlights
  const tn=tintNow();if(tn[3]>0.01){ctx.fillStyle=`rgba(${tn[0]|0},${tn[1]|0},${tn[2]|0},${tn[3]})`;ctx.fillRect(0,-20,W,H+40);
    const nk=tn[3]>0.4?(tn[3]-0.4)/0.15:0;if(nk>0){for(const s of STARS){ctx.globalAlpha=nk*(0.5+0.5*Math.sin(t*0.003+s[0]*40));ctx.fillStyle='#fff8d0';ctx.fillRect(s[0]*W,s[1]*roadTop*0.6,s[2]*1.6,s[2]*1.6);}ctx.globalAlpha=1;
      ctx.save();ctx.globalCompositeOperation='lighter';const hx=TX+ts*0.45,g=ctx.createLinearGradient(hx,0,hx+laneH*3.2,0);g.addColorStop(0,`rgba(255,235,160,${0.38*nk})`);g.addColorStop(1,'rgba(255,235,160,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(hx,G.y+ts*0.02);ctx.lineTo(hx+laneH*3.2,G.y-laneH*0.75);ctx.lineTo(hx+laneH*3.2,G.y+laneH*0.75);ctx.closePath();ctx.fill();ctx.restore();}}
  if(G.zoneT!==undefined&&G.t-G.zoneT<2.4){const u=G.t-G.zoneT,zz=ZONES[G.zone],sc=u<0.25?u/0.25:1;ctx.save();ctx.globalAlpha=u>2?(2.4-u)/0.4:1;ctx.translate(W/2,roadTop*0.55);ctx.scale(sc,sc);
    ctx.fillStyle='#fffaf0';ctx.strokeStyle='#fff';ctx.lineWidth=4;const bw=Math.min(W*0.8,300);ctx.beginPath();ctx.roundRect?ctx.roundRect(-bw/2,-30,bw,60,18):ctx.rect(-bw/2,-30,bw,60);ctx.fill();
    ctx.font=`700 ${Math.round(laneH*0.26)}px Fredoka,system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#3d3354';ctx.fillText(`${zz.e} ${zz.n}`,0,-8);
    ctx.font=`600 ${Math.round(laneH*0.17)}px Fredoka,system-ui`;ctx.fillStyle='#ef5a4c';ctx.fillText('+5 coins · new scenery!',0,16);ctx.restore();}
  // cheering customer on the verge
  if(G.cheer){const u=G.t-G.cheer.t,pop=u<0.25?u/0.25:1,out=u>1.3?(u-1.3)/0.3:0,s=laneH*1.5*(0.6+0.4*pop)*(1-out*0.5),x=W*0.76,y=roadTop-s*0.42-Math.abs(Math.sin(u*9))*8*(1-out);
    spr(G.cheer.ani,x,y,s,0,0,1-out);spr(G.cheer.food,x-s*0.42,y-s*0.1-Math.sin(u*6)*4,s*0.5,0,Math.sin(u*8)*0.2,1-out);}
  // floating text
  for(const f of FX){const u=G.t-f.t;ctx.globalAlpha=u>0.7?(1-u)/0.3:1;ctx.font=`700 ${Math.round(laneH*0.28)}px Fredoka,system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=6;ctx.strokeStyle='#3d3354';ctx.lineJoin='round';ctx.strokeText(f.s,f.x,f.y-u*40);ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y-u*40);}
  ctx.globalAlpha=1;
  // countdown
  if(G.count>0){const c=Math.ceil(G.count),u=1-(G.count-Math.floor(G.count));ctx.font=`700 ${Math.round(laneH*(1+u*0.3))}px Fredoka,system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=1-u*0.6;
    ctx.lineWidth=10;ctx.strokeStyle='#fff';ctx.strokeText(c,W/2,roadTop-laneH*0.7);ctx.fillStyle='#ef5a4c';ctx.fillText(c,W/2,roadTop-laneH*0.7);ctx.globalAlpha=1;}
  if(G.t<6&&G.count<=0&&G.count>-1.5){ctx.font=`700 ${Math.round(laneH*0.55)}px Fredoka,system-ui`;ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#fff';ctx.strokeText('GO!',W/2,roadTop-laneH*0.7);ctx.fillStyle='#2e9e4b';ctx.fillText('GO!',W/2,roadTop-laneH*0.7);}
  if(G.turbo>0){ctx.fillStyle=`rgba(74,163,223,${0.08+0.05*Math.sin(t*0.02)})`;ctx.fillRect(0,0,W,H);}}
let last=now();function frame(t){const dt=Math.min(0.05,(t-last)/1000);last=t;if(G&&G.run)step(dt);else if(G&&!G.run){G.t+=dt;}if(G&&G.count<=0&&!G.run)G.count=Math.min(G.count,-2);
  if(G){for(let i=P.length-1;i>=0;i--){if(!G.run){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)P.splice(i,1);}}}draw(t);requestAnimationFrame(frame);}

/* title / garage / over */
function garage(){const g=$('garage');g.replaceChildren();TRUCKS.forEach(tr=>{const own=SV.own.includes(tr.k),b=document.createElement('button');b.className='tk'+(SV.truck===tr.k?' sel':'')+(own?'':' lock');
  const im=document.createElement('img');im.src=ART_SRC[tr.k];im.alt='';b.appendChild(im);b.appendChild(document.createTextNode(own?tr.n:`🔒 ${tr.c}`));const pk=document.createElement('div');pk.style.cssText='font-size:11px;font-weight:600;opacity:.75';pk.textContent=tr.p;b.appendChild(pk);
  b.onclick=()=>{ac();if(own){SV.truck=tr.k;SFX.lane();}else if(SV.bank>=tr.c){SV.bank-=tr.c;SV.own.push(tr.k);SV.truck=tr.k;SFX.serve();}else{SFX.hit();b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:240});}save();garage();};g.appendChild(b);});
  const p=document.createElement('div');p.style.cssText='width:100%;font-size:14px;font-weight:600;margin-top:-2px';p.textContent=`Bank: ${SV.bank} coins · Best: ${SV.best}`;g.appendChild(p);g.style.flexWrap='wrap';}
function gameOver(){const nb=G.coins>SV.best;SV.best=Math.max(SV.best,G.coins);SV.bank+=G.coins;SV.bestDist=Math.max(SV.bestDist,Math.floor(G.dist));save();SFX.over();$('order').classList.add('hide');
  const p=$('overP');p.replaceChildren();const h=document.createElement('h2');h.textContent=nb?'New best!':'Road trip over';p.appendChild(h);
  const big=document.createElement('div');big.className='big';big.textContent=`${G.coins} coins`;p.appendChild(big);
  [['Orders served',G.served],['Distance',Math.floor(G.dist)+' m'],['Best',SV.best+' coins'],['Bank',SV.bank+' coins']].forEach(([a,b])=>{const r=document.createElement('div');r.className='stat';const s1=document.createElement('span');s1.textContent=a;const s2=document.createElement('b');s2.textContent=b;r.append(s1,s2);p.appendChild(r);});
  const next=TRUCKS.find(tr=>!SV.own.includes(tr.k));if(next){const n=document.createElement('p');n.style.cssText='font-size:14px;margin:8px 0';n.textContent=SV.bank>=next.c?`You can unlock the ${next.n} truck in the garage!`:`${next.c-SV.bank} more coins to unlock the ${next.n} truck`;p.appendChild(n);}
  const b1=document.createElement('button');b1.className='btn';b1.textContent='Drive again';b1.onclick=start;const b2=document.createElement('button');b2.className='btn alt';b2.textContent='Garage';b2.style.marginLeft='8px';
  b2.onclick=()=>{$('over').classList.add('hide');garage();$('title').classList.remove('hide');G=null;};const wrap=document.createElement('div');wrap.style.marginTop='12px';wrap.append(b1,b2);p.appendChild(wrap);
  $('over').classList.remove('hide');}
$('play').onclick=start;garage();layout();requestAnimationFrame(frame);
window.FTT={get G(){return G;},move};
}
</script>
