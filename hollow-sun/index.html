 for(const[a,b]of[[276,300],[314,346],[362,392],[406,440],[456,482],[496,526]])plat(a,b,32);

 // --- cathedral

  for(let y=4;y<g;y++){put(px,y,'|',10);put(px+1,y,'#',11);put(px+2,y,'|',10);bgf[y*LW+px]=bgf[y*LW+px+1]=bgf[y*LW+px+2]=2;}

 const cvs=document.createElement('canvas');cvs.width=CK*CW*RS;cvs.height=LH*CH*RS;const g=cvs.getContext('2d');g.setTransform(RS,0,0,RS,0,0);prep(g);

function solidAt(px,py){const cx=Math.floor(px/CW),cy=Math.floor(py/CH);if(cx<0||cx>=LW)return true;if(cy<0||cy>=LH)return false;return sol[cy*LW+cx]===1;}
function boxSolid(x,y,w,h){const x0=Math.floor(x/CW),x1=Math.floor((x+w-.01)/CW),y0=Math.floor(y/CH),y1=Math.floor((y+h-.01)/CH);
 for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){if(cx<0||cx>=LW)return true;if(cy<0||cy>=LH)continue;if(sol[cy*LW+cx]===1)return true;}return false;}
function moveBody(e,dtAll,drop){e.grounded=false;
 for(let k=0;k<2;k++){const dt=dtAll/2;
  const nx=e.x+e.vx*dt;
  if(e.vx&&boxSolid(nx,e.y,e.w,e.h)){
   if(e.wasG&&e.vy>=0&&!boxSolid(nx,e.y-CH,e.w,e.h)){e.y-=CH;e.x=nx;e.stepOff=(e.stepOff||0)+CH;}
   else{e.hitWall=true;e.vx=0;}
  }else e.x=nx;
  let ny=e.y+e.vy*dt;
  if(e.vy>=0){
   if(boxSolid(e.x,ny,e.w,e.h)){ny=Math.floor((ny+e.h)/CH)*CH-e.h;e.vy=0;e.grounded=true;}
   else if(!drop){const fb0=e.y+e.h,fb1=ny+e.h,ra=Math.ceil((fb0-.5)/CH),rb=Math.floor(fb1/CH),c0=Math.max(0,Math.floor(e.x/CW)),c1=Math.min(LW-1,Math.floor((e.x+e.w-.01)/CW));
    for(let r=ra;r<=rb&&!e.grounded;r++){if(r<0||r>=LH)continue;for(let cx=c0;cx<=c1;cx++)if(sol[r*LW+cx]===2){ny=r*CH-e.h;e.vy=0;e.grounded=true;break;}}}
  }else if(boxSolid(e.x,ny,e.w,e.h)){ny=(Math.floor(ny/CH)+1)*CH;e.vy=0;}
  e.y=ny;}
 if(!e.grounded&&e.wasG&&e.vy>=0&&e.vy<200&&!drop&&boxSolid(e.x,e.y+CH+2,e.w,e.h)&&!boxSolid(e.x,e.y+CH-2,e.w,e.h)){e.y=Math.floor((e.y+e.h+CH+2)/CH)*CH-e.h;e.grounded=true;e.vy=0;e.stepOff=(e.stepOff||0)-CH;}

function mkStrip(cols,rows,scale,fill,col,fn){const c=document.createElement('canvas');c.width=cols*CW*scale*RS;c.height=rows*CH*scale*RS;const g=c.getContext('2d');g.setTransform(RS*scale,0,0,RS*scale,0,0);prep(g);

 c.lw=cols*CW*scale;c.lh=rows*CH*scale;return c;}
function city(seed,minH,maxH,dens){return(gr,cols,rows)=>{const r=mulberry(seed);let x=0;while(x<cols){const w=5+Math.floor(r()*10),h=minH+Math.floor(r()*(maxH-minH));

    const edge=xx===x||xx===x+w-1,top=yy===rows-hh;let ch=edge?'|':top?'_':((xx-x)%3===1&&yy%2===0?(r()<.3?' ':':'):(r()<.06?'#':' '));
    if(r()<.03&&!edge)ch='/';gr[yy][xx]=ch;}}
   if(r()<.3&&x+2<cols)for(let k=1;k<4;k++)if(rows-h-k>=0)gr[rows-h-k][x+2]=k===3?'+':'|';}
  else if(r()<.5&&x+5<cols){const b=rows-1;gr[b][x+2]='|';gr[b-1][x+2]='|';gr[b-2][x+2]='Y';gr[b-3][x+1]='\\';gr[b-3][x+3]='/';}
  x+=w+Math.floor(r()*3);}};}

function upPlayer(dt){const p=P;if(p.dead)return;const cx0=p.x+p.w/2;
 p.inv-=dt;p.hurtT-=dt;p.dashCd-=dt;p.coy-=dt;p.jbuf-=dt;p.comboT-=dt;p.drop-=dt;p.stepOff*=Math.max(0,1-dt*18);

 if(p.near&&!lock&&p.grounded&&p.atk<=0&&p.dashT<=0){

 }else p.searching=0;
 if(p.dashT>0){p.dashT-=dt;p.vx=p.face*560;p.vy=0;p.ghostT-=dt;if(p.ghostT<=0){p.ghostT=.03;ghosts.push({f:pframe(),x:p.x-21.5,y:p.y-24,flip:p.face<0,life:.28,max:.28});}}
 else{

    else if(p.jumps<2){p.vy=-410;p.jumps=2;p.jbuf=0;sfx('jump');for(let i=-3;i<=3;i++)part(cx0+i*8,p.y+p.h,i*30,60,.35,i%2?'~':'-','#7fe9ff',0);}}

   if(E.atk&&p.atk<=0&&p.dashT<=0&&!p.plunge)startAtk();
   if(E.heal){if(p.cans>0&&p.hp<p.max){p.cans--;p.hp=Math.min(p.max,p.hp+40);sfx('rest');for(let i=0;i<10;i++)part(cx0+rnd(-16,16),p.y+rnd(10,80),0,rnd(-70,-30),rnd(.5,.9),'+','#8fe06a',0);}else sfx('deny');}
   if(E.swap&&p.weapons.length>1&&p.atk<=0){p.wi=(p.wi+1)%p.weapons.length;popup(cx0,p.y-34,WPN[p.weapons[p.wi]][0],WPN[p.weapons[p.wi]][1]);sfx('pick');}
  }}
 const wasG=p.grounded;p.hitWall=false;moveBody(p,dt,p.drop>0);
 if(p.grounded){if(!wasG){for(let i=0;i<4;i++)part(p.x+p.w/2+rnd(-12,12),p.y+p.h,rnd(-70,70),rnd(-40,-5),.35,pickc('.,_'),'#b08a66',100);if(p.plunge)slam();}
  p.jumps=0;p.coy=.1;const c=Math.floor((p.x+p.w/2)/CW),r=Math.floor((p.y+p.h+2)/CH);if(r<LH&&sol[r*LW+c]===1&&groundY[c]>=0&&p.inv<=0&&bossSt!==2){p.safeX=p.x;p.safeY=p.y;}}
 else if(p.coy<=0&&p.jumps===0)p.jumps=1;
 if(p.plunge)hitRect(p.x-12,p.y,p.w+24,p.h+12,14*(1+.25*p.up[0]),0,p.swing);
 const fc=Math.floor((p.x+p.w/2)/CW),fr=Math.floor((p.y+p.h-4)/CH);
 if(p.y>LH*CH+40||(fr>=0&&fr<LH&&sol[fr*LW+fc]===3)){pitFall();return;}
 p.anim+=Math.abs(p.vx)*dt/20;
 for(const w of wpicks)if(!w.taken&&Math.abs(w.x-(p.x+p.w/2))<26&&Math.abs(w.y-(p.y+40))<60){w.taken=true;p.weapons.push(w.id);p.wi=p.weapons.length-1;if(w.id==='shot')p.cells+=6;

function upEnemies(dt){const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
 for(let i=ens.length-1;i>=0;i--){const e=ens[i];if(Math.abs(e.x-pcx)>900)continue;
  e.t+=dt;e.flash-=dt;e.st-=dt;const ecx=e.x+e.w/2,dx=pcx-ecx,dy=pcy-(e.y+e.h/2),ad=Math.abs(dx);
  if(e.type==='husk'){const see=ad<340&&Math.abs(dy)<110&&!P.dead;
   if(e.kb>0)e.kb-=dt;
   else if(see){e.face=dx>0?1:-1;e.vx=lerp(e.vx,ad>14?e.face*(e.fast?125:58):0,dt*6);}
   else{if(e.st<=0){e.st=rnd(1.5,3.5);e.face=-e.face;}e.vx=lerp(e.vx,e.face*26,dt*4);}
   if(e.grounded&&e.kb<=0){const ax=e.face>0?e.x+e.w+4:e.x-4,c=Math.floor(ax/CW),r=Math.floor((e.y+e.h+4)/CH);if(c>=0&&c<LW&&r+1<LH&&!sol[r*LW+c]&&!sol[(r+1)*LW+c]){if(!see)e.face=-e.face;e.vx=0;}}
   e.vy=Math.min(e.vy+1100*dt,700);e.hitWall=false;moveBody(e,dt);if(e.hitWall&&!see)e.face=-e.face;
   upCloth(e.cloth[0],e.x+e.w/2-e.face*5,e.y+18,dt,-300);}
  else if(e.type==='wing'){
   if(e.state==='idle'){e.vx=lerp(e.vx,Math.cos(e.t*1.3)*50+(e.hx-e.x)*.6,dt*3);e.vy=lerp(e.vy,(e.hy-e.y)*2+Math.sin(e.t*4)*30,dt*3);
    if(ad<300&&Math.abs(dy)<260&&e.st<=0&&!P.dead){e.state='dive';e.st=.9;const m=Math.hypot(dx,dy)||1;e.dvx=dx/m*290;e.dvy=dy/m*290;sfx('caw');}}
   else{e.vx=lerp(e.vx,e.dvx,dt*5);e.vy=lerp(e.vy,e.dvy,dt*5);if(e.st<=0){e.state='idle';e.st=rnd(1.4,2.4);}}
   e.x+=e.vx*dt;e.y+=e.vy*dt;}
  else if(e.type==='spit'){if(e.st<=0){if(Math.hypot(dx,dy)<470&&!P.dead){if(e.state==='idle'){e.state='tele';e.st=.45;}
     else{e.state='idle';e.st=rnd(1.8,2.6);const Tt=.95,g=600,sx=ecx,sy=e.ceil?e.y+e.h:e.y;shots.push({x:sx,y:sy,vx:(pcx-sx)/Tt,vy:(pcy-sy-.5*g*Tt*Tt)/Tt,g,life:3,kind:'acid',r:9,dmg:10,foe:1});sfx('spit');}}
    else{e.state='idle';e.st=.6;}}}

   if(e.state==='idle'){if(e.kb>0)e.kb-=dt;else if(ad<420&&Math.abs(dy)<140&&!P.dead){e.face=dx>0?1:-1;e.vx=lerp(e.vx,ad>120?e.face*85:0,dt*5);if(ad<=135&&e.st<=0){e.state='tele';e.st=.5;e.vx=0;sfx('warn');}}else e.vx=lerp(e.vx,0,dt*5);}
   else if(e.state==='tele'){e.vx=0;if(e.st<=0){e.state='lunge';e.st=.28;e.swing=0;sfx('slash2');}}
   else if(e.state==='lunge'){e.vx=e.face*430;e.swing+=dt/.28;const hx=e.face>0?ecx:ecx-92;if(P.x<hx+92&&P.x+P.w>hx&&P.y<e.y+e.h&&P.y+P.h>e.y-10)hurtPlayer(20,ecx);if(e.st<=0){e.state='rec';e.st=.8;}}

   if(e.grounded&&e.vx){const ax=e.vx>0?e.x+e.w+6:e.x-6,c=Math.floor(ax/CW),r=Math.floor((e.y+e.h+4)/CH);if(c>=0&&c<LW&&r+1<LH&&!sol[r*LW+c]&&!sol[(r+1)*LW+c])e.vx=0;}
   e.vy=Math.min(e.vy+1100*dt,700);moveBody(e,dt);const f=e.face,c2=e.x+e.w/2;

  if(b.st>1.1&&!b.named){b.named=true;caption('THE CHOIR WARDEN','KEEPER OF THE LAST EMBER');shake=12;skyBolt();sfx('roar');}

  if(b.hp<=0&&b.state!=='dead'){b.hp=0;b.state='dead';b.st=0;timeScale=.3;shots.length=0;flash=1;shake=18;sfx('roar');cine.barsT=1;bossEnd=0;}

  switch(b.state){
  case'idle':{const side=bcx>pcx?1:-1,tx=clamp(pcx+side*210,AX0+40,AX1-40)-b.w/2,ty=BGY-290+Math.sin(now*2)*14;

   if(b.st>(b.phase===2?.8:1.3)){b.ai=(b.ai+1+(Math.random()<.3?1:0))%3;b.state=['sweep','barrage','slam'][b.ai];b.st=0;b.volleys=0;b.sub=0;sfx('warn');
    if(b.state==='sweep'){b.dir=pcx>(AX0+AX1)/2?-1:1;b.sx=clamp(pcx-b.dir*300,AX0+10,AX1-10-b.w);}}
   break;}
  case'sweep':{if(b.st<.8){b.x=lerp(b.x,b.sx,dt*5);b.y=lerp(b.y,BGY-172,dt*5);b.face=b.dir;}
   else if(b.st<1.6){if(!b.sub){b.sub=1;sfx('slash2');}b.x=clamp(b.x+b.dir*640*dt,AX0,AX1-b.w);
    if(Math.abs(pcx-(b.x+b.w/2))<100&&P.y+P.h>BGY-54)hurtPlayer(22,b.x+b.w/2-b.dir*50);
    part(b.x+b.w/2+rnd(-60,60),BGY-rnd(4,30),-b.dir*rnd(40,200),-rnd(40,200),rnd(.3,.7),pickc("*^'."),'#ff7a3c',400);}
   else{b.state='idle';b.st=0;}break;}
  case'barrage':{b.y=lerp(b.y,BGY-320,dt*3);b.face=pcx>bcx?1:-1;const iv=b.phase===2?.38:.5,n=b.phase===2?5:3;
   if(b.st>.5+b.volleys*iv&&b.volleys<n){b.volleys++;const a0=Math.atan2(P.y+P.h/2-(b.y+50),pcx-bcx),k=b.phase===2?9:7,sp=b.phase===2?230:185;
    for(let i=0;i<k;i++){const a=a0+(i-(k-1)/2)*.2+(b.volleys%2?.1:0);shots.push({x:bcx,y:b.y+50,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0,life:5,kind:'orb',r:7,dmg:12,foe:1});}sfx('orb');}
   if(b.st>.5+n*iv+.5){b.state='idle';b.st=0;}break;}
  case'slam':{if(b.st<.4)b.alpha=1-b.st/.4;
   else if(!b.sub){b.sub=1;b.x=clamp(pcx,AX0+40,AX1-40)-b.w/2;b.y=BGY-470;b.vy=0;b.alpha=0;}

   else{b.alpha=1;b.vy+=3000*dt;b.y+=b.vy*dt;if(b.y+b.h>=BGY){b.y=BGY-b.h;b.state='stuck';b.st=0;shake=16;flash=.4;sfx('boom');const x=b.x+b.w/2;

   break;}
  case'stuck':if(b.st>(b.phase===2?1:1.4)){b.state='idle';b.st=0;}break;

 else if(bossSt===3){sunFill=Math.min(1,sunFill+raw*.25);if(state==='play')endT+=raw;if(endT>5&&state==='play'){state='end';endT=0;cine.barsT=1;}}
