const lr=mulberry(7731);

function put(x,y,ch,c,s){if(x<0||y<0||x>=LW||y>=LH)return;const i=y*LW+x;if(ch!==null){tch[i]=ch;tcol[i]=c;}if(s!==undefined)sol[i]=s;}
function txt(x,y,s,c,so){for(let i=0;i<s.length;i++)if(s[i]!==' ')put(x+i,y,s[i],c,so);}
function gcol(x,y,z){groundY[x]=y;const top=z===2?'=-===':z===3?'#=#%=':'=#=_=';
 put(x,y,top[Math.floor(lr()*5)],z===2?4:z===3?10:1,1);
 for(let yy=y+1;yy<LH;yy++)put(x,yy,'#%&:;.,#% '[Math.floor(lr()*10)],yy<y+3?(z===3?11:2):3,1);}
function terrain(segs,z){let py=null;for(const[x0,x1,y]of segs){
 if(y<0){for(let x=x0;x<x1;x++){put(x,LH-2,'^',8,3);put(x,LH-1,'#',3,1);}py=null;continue;}
 for(let x=x0;x<x1;x++){let h=y;if(py!==null&&py!==y){const k=Math.floor((x-x0)/2)+1,n=Math.abs(y-py);if(k<n)h=py+Math.sign(y-py)*k;}gcol(x,h,z);}
 py=y;}}

function board(c0,row,lines){const w=Math.max(...lines.map(l=>l.length))+4;const g=groundY[c0+1];
 for(let x=c0;x<c0+w;x++){put(x,row,'=',17,2);put(x,row+lines.length+1,'-',4);}
 for(let i=0;i<=lines.length;i++){for(let x=c0;x<c0+w;x++)bgf[(row+1+i)*LW+x]=1;if(i<lines.length){put(c0,row+1+i,'|',4);put(c0+w-1,row+1+i,'|',4);txt(c0+2,row+1+i,lines[i],7);}}
 for(let y=row+lines.length+2;y<g;y++){put(c0+1,y,'|',19);put(c0+w-2,y,'|',19);}}
const WINDOWS=[];
function buildLevel(){
 terrain([[0,58,38],[58,65,-1],[65,100,38],[100,150,33],[150,157,-1],[157,200,33],[200,262,38]],1);
 terrain([[262,540,38]],2);

 for(let y=0;y<LH;y++){put(0,y,'#',3,1);put(1,y,'#',3,1);put(LW-1,y,'#',3,1);put(LW-2,y,'#',3,1);}
 // --- highway
 txt(4,GY-3,'.------.',4);txt(4,GY-2,'| B-07 |',4);txt(4,GY-1,'|__[]__|',4);
 board(30,29,['EVACUATION ROUTE  >>>','ALL LANES  -  STAY CALM']);
 lamp(70);lamp(96);lamp(215);lamp(246);
 for(let x=110;x<150;x++)put(x,32,x%5===0?'T':'-',19);

 board(112,22,['LAST FUEL  40 KM']);
 plat(118,134,27);plat(170,184,27);
 txt(88,GY-1,'_o/\\_.',15);txt(206,GY-1,'.,;:,.',3);
 // --- mall
 for(let y=16;y<38;y++)for(let x=265;x<538;x++){const i=y*LW+x;bgf[i]=1;
  const ch=x%24===0?'|':y%8===0?'-':((x*7+y*3)%13===0?'.':' ');if(ch!==' ')put(x,y,ch,x%24===0?19:6);}
 for(const[hx,hy,rx,ry]of[[312,23,9,4],[402,21,11,5],[468,29,8,3],[506,22,7,4],[350,30,6,3]])
  for(let y=hy-ry-1;y<=hy+ry+1;y++)for(let x=hx-rx-1;x<=hx+rx+1;x++){const d=((x-hx)/rx)**2+((y-hy)/ry)**2+(lr()-.5)*.3;const i=y*LW+x;
   if(d<1){bgf[i]=0;tch[i]=' ';}else if(d<1.35)put(x,y,'%#&'[Math.floor(lr()*3)],19);}
 for(let x=262;x<=540;x++){put(x,14,'=',4,1);put(x,15,'#',19,1);}
 for(let y=14;y<31;y++)for(const x of[262,263,264,538,539,540])put(x,y,x%2?'#':'|',4,1);
 txt(268,12,'M E R I D I A N   M A L L',7);for(let x=270;x<292;x+=7)put(x,13,'|',19);
 txt(283,20,'[ PHARMACY ]',9);txt(328,29,'SPORT + OUTDOOR',7);txt(372,19,'EVERYTHING MUST GO',12);txt(416,29,'FOOD COURT  ->',7);txt(446,19,'SALE  SALE  SALE',12);txt(488,28,'EXIT >',16);
 for(const[a,b]of[[276,300],[314,346],[362,392],[406,440],[456,482],[496,526]])plat(a,b,32);
 for(const[a,b]of[[292,330],[352,400],[430,470]])plat(a,b,26);
 // --- cathedral
 for(let k=0;k<8;k++){const px=552+k*34;if(px+3>=806)break;const g=groundY[px+1]<0?LH:groundY[px+1];
  for(let y=4;y<g;y++){put(px,y,'|',10);put(px+1,y,'#',11);put(px+2,y,'|',10);bgf[y*LW+px]=bgf[y*LW+px+1]=bgf[y*LW+px+2]=2;}
  for(let i=0;i<6;i++){put(px+3+i,9-i,'/',10);put(px+33-i,9-i,'\\',10);}
  for(let x=px+9;x<=px+27;x++)put(x,3,'_',10);
  const c=px+18;WINDOWS.push({x:c*CW,y:14*CH,k:k%3});
  for(let y=0;y<14;y++){const hw=y<4?1+y:4;for(let dx=-hw;dx<=hw;dx++){
   if(Math.abs(dx)===hw||y===13)put(c+dx,13+y,y===13?'_':(dx<0?'/':'\\').replace(/./,m=>y<4?m:'|'),10);
   else put(c+dx,13+y,'*+o%x'[Math.floor(lr()*5)],12+((dx+y*2+k+40)%3));}}}
 for(const[a,b,r]of[[556,574,32],[612,630,28],[660,680,28],[676,694,22],[720,740,24],[750,770,24]])plat(a,b,r);
 for(const x of[712,716,774,778]){put(x,28,'i',13);put(x,29,'|',15);}

}
buildLevel();
const CK=40,chunks=new Map();let frame=0;
function getChunk(k){let c=chunks.get(k);if(c){c.used=frame;return c.cv;}
 const cvs=document.createElement('canvas');cvs.width=CK*CW*RS;cvs.height=LH*CH*RS;const g=cvs.getContext('2d');g.setTransform(RS,0,0,RS,0,0);prep(g);
 for(let y=0;y<LH;y++)for(let x=0;x<CK;x++){const gx=k*CK+x;if(gx>=LW)break;const i=y*LW+gx;
  if(sol[i]===1){g.fillStyle='#0e0a09';g.fillRect(x*CW,y*CH,CW+.5,CH+.5);}else if(bgf[i]){g.fillStyle=bgf[i]===1?'#0a0d11':'#0d0a12';g.fillRect(x*CW,y*CH,CW+.5,CH+.5);}
  const ch=tch[i];if(ch!==' '){g.fillStyle=TC[tcol[i]];g.fillText(ch,x*CW+CW/2,y*CH+CH/2+1);}}
 if(chunks.size>7){let ok=null,ou=1e12;for(const[kk,v]of chunks)if(v.used<ou){ou=v.used;ok=kk;}const o=chunks.get(ok);o.cv.width=0;chunks.delete(ok);}
 chunks.set(k,{cv:cvs,used:frame});return cvs;}
function solidAt(px,py){const cx=Math.floor(px/CW),cy=Math.floor(py/CH);if(cx<0||cx>=LW)return true;if(cy<0||cy>=LH)return false;return sol[cy*LW+cx]===1;}
function boxSolid(x,y,w,h){const x0=Math.floor(x/CW),x1=Math.floor((x+w-.01)/CW),y0=Math.floor(y/CH),y1=Math.floor((y+h-.01)/CH);
 for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){if(cx<0||cx>=LW)return true;if(cy<0||cy>=LH)continue;if(sol[cy*LW+cx]===1)return true;}return false;}
function moveBody(e,dtAll,drop){e.grounded=false;
 for(let k=0;k<2;k++){const dt=dtAll/2;
  const nx=e.x+e.vx*dt;
  if(e.vx&&boxSolid(nx,e.y,e.w,e.h)){
   if(e.wasG&&e.vy>=0&&!boxSolid(nx,e.y-CH,e.w,e.h)){e.y-=CH;e.x=nx;e.stepOff=(e.stepOff||0)+CH;}
   else{e.hitWall=true;e.vx=0;}
  }else e.x=nx;
  let ny=e.y+e.vy*dt;
  if(e.vy>=0){
   if(boxSolid(e.x,ny,e.w,e.h)){ny=Math.floor((ny+e.h)/CH)*CH-e.h;e.vy=0;e.grounded=true;}
   else if(!drop){const fb0=e.y+e.h,fb1=ny+e.h,ra=Math.ceil((fb0-.5)/CH),rb=Math.floor(fb1/CH),c0=Math.max(0,Math.floor(e.x/CW)),c1=Math.min(LW-1,Math.floor((e.x+e.w-.01)/CW));
    for(let r=ra;r<=rb&&!e.grounded;r++){if(r<0||r>=LH)continue;for(let cx=c0;cx<=c1;cx++)if(sol[r*LW+cx]===2){ny=r*CH-e.h;e.vy=0;e.grounded=true;break;}}}
  }else if(boxSolid(e.x,ny,e.w,e.h)){ny=(Math.floor(ny/CH)+1)*CH;e.vy=0;}
  e.y=ny;}
 if(!e.grounded&&e.wasG&&e.vy>=0&&e.vy<200&&!drop&&boxSolid(e.x,e.y+CH+2,e.w,e.h)&&!boxSolid(e.x,e.y+CH-2,e.w,e.h)){e.y=Math.floor((e.y+e.h+CH+2)/CH)*CH-e.h;e.grounded=true;e.vy=0;e.stepOff=(e.stepOff||0)-CH;}
 e.wasG=e.grounded;}

function mkStrip(cols,rows,scale,fill,col,fn){const c=document.createElement('canvas');c.width=cols*CW*scale*RS;c.height=rows*CH*scale*RS;const g=c.getContext('2d');g.setTransform(RS*scale,0,0,RS*scale,0,0);prep(g);
 const gr=[];for(let y=0;y<rows;y++)gr.push(new Array(cols).fill(null));fn(gr,cols,rows);
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ch=gr[y][x];if(ch===null)continue;if(fill){g.fillStyle=fill;g.fillRect(x*CW,y*CH,CW+.6,CH+.6);}if(ch!==' '){g.fillStyle=col;g.fillText(ch,x*CW+CW/2,y*CH+CH/2);}}
 c.lw=cols*CW*scale;c.lh=rows*CH*scale;return c;}
function city(seed,minH,maxH,dens){return(gr,cols,rows)=>{const r=mulberry(seed);let x=0;while(x<cols){const w=5+Math.floor(r()*10),h=minH+Math.floor(r()*(maxH-minH));
  if(r()<dens){for(let xx=x;xx<Math.min(cols,x+w);xx++){const hh=h-(r()<.35?Math.floor(r()*4):0);for(let yy=rows-hh;yy<rows;yy++){
    const edge=xx===x||xx===x+w-1,top=yy===rows-hh;let ch=edge?'|':top?'_':((xx-x)%3===1&&yy%2===0?(r()<.3?' ':':'):(r()<.06?'#':' '));
    if(r()<.03&&!edge)ch='/';gr[yy][xx]=ch;}}
   if(r()<.3&&x+2<cols)for(let k=1;k<4;k++)if(rows-h-k>=0)gr[rows-h-k][x+2]=k===3?'+':'|';}
  else if(r()<.5&&x+5<cols){const b=rows-1;gr[b][x+2]='|';gr[b-1][x+2]='|';gr[b-2][x+2]='Y';gr[b-3][x+1]='\\';gr[b-3][x+3]='/';}
  x+=w+Math.floor(r()*3);}};}
const farStrip=mkStrip(160,18,1,'#140c12','#3c2733',city(11,5,17,.8));

const fgStrip=mkStrip(130,19,1.8,null,'#050304',(gr,cols,rows)=>{const r=mulberry(5);for(let x=4;x<cols-12;x+=22+Math.floor(r()*26)){

function killE(e){const i=ens.indexOf(e);if(i>=0)ens.splice(i,1);const cx=e.x+e.w/2;
 const L=e.type==='husk'?HUSK[0]:e.type==='wing'?WING[0]:e.type==='spit'?SPIT:REAV[0];disint(L,e.x-(L[0].length*CW-e.w)/2,e.y-(L.length*CH-e.h),e.face<0,e.type==='reaver'?'#b9a9c9':'#9aa58a');

 if(Math.random()<.18)drop(cx,e.y,'cell',1);if(Math.random()<(e.type==='reaver'?.6:.07))drop(cx,e.y,'can',1);
 if(e.type==='reaver'){timeScale=.35;shake=10;Q.cantors++;if(Q.cantors===3){const v=npcs[3];v.x=772*CW;v.y=groundY[772]*CH;v.cl.init=false;}}
 if(P.greed)for(let k=0;k<2;k++)drop(cx,e.y+e.h/2,'scrap',1);gainXP({husk:8,wing:6,spit:8,reaver:30}[e.type]);sfx('die');}
function hurtE(e,d,kx){
 if(e===B){if(!bossVuln())return false;B.hp-=d*(B.state==='stuck'?1.5:1);B.flash=.1;}
 else{e.hp-=d;e.flash=.12;if(e.type!=='spit'){e.vx=kx;e.kb=.22;}if(e.type==='wing'){e.state='idle';e.st=.6;}if(e.type==='reaver'&&e.state==='tele'&&d>=14){e.state='rec';e.st=.5;}}
 const cx=e.x+e.w/2,cy=e.y+e.h/2;popup(cx+rnd(-10,10),e.y-6,''+Math.round(d),'#fff2b0');
 for(let i=0;i<6;i++)part(cx,cy+rnd(-20,20),rnd(-160,160)+kx*.3,rnd(-200,40),rnd(.25,.6),pickc("*+'.x"),i%2?'#ffd27a':'#ff7a3c',500);
 hitstop=Math.max(hitstop,.045);shake=Math.max(shake,4);sfx('hit');

 for(let i=ens.length-1;i>=0;i--)test(ens[i]);if(bossSt===2)test(B);return out;}

 for(let i=0;i<14;i++)part(x+rnd(-20,20),y+rnd(-20,20),rnd(-40,40),rnd(-90,-30),rnd(.6,1.3),pickc('%#&@'),'#5a5050',-20);

function upAtk(dt){const p=P;if(p.atk<=0)return;p.atk-=dt;const t=1-p.atk/p.atkDur,cx=p.x+p.w/2,dm=dmgMul();

function upPlayer(dt){const p=P;if(p.dead)return;const cx0=p.x+p.w/2;
 p.inv-=dt;p.hurtT-=dt;p.dashCd-=dt;p.coy-=dt;p.jbuf-=dt;p.comboT-=dt;p.drop-=dt;p.stepOff*=Math.max(0,1-dt*18);

 for(const f of fires)if(Math.abs(f.x-cx0)<42&&Math.abs(f.y-(p.y+p.h))<30)p.near=f;
 for(const n of npcs)if(Math.abs(n.x-cx0)<38&&Math.abs(n.y-(p.y+p.h))<30)p.near=n;

  if(p.near.name){if(E.use){talk(p.near);return;}}

 else{
  if(p.hurtT<=0){const sp=p.atk>0&&p.grounded?50:205;p.vx=lerp(p.vx,p.plunge?0:ax*sp,Math.min(1,dt*(p.grounded?16:7)));if(ax&&p.atk<=0)p.face=ax;}

   if(p.jbuf>0&&!p.plunge){
    if(p.grounded||p.coy>0){p.vy=-455;p.jumps=1;p.jbuf=0;p.coy=0;sfx('jump');for(let i=0;i<5;i++)part(cx0+rnd(-10,10),p.y+p.h,rnd(-60,60),rnd(-50,-10),.4,pickc('.,'),'#b08a66',100);}
    else if(p.jumps<2){p.vy=-410;p.jumps=2;p.jbuf=0;sfx('jump');for(let i=-3;i<=3;i++)part(cx0+i*8,p.y+p.h,i*30,60,.35,i%2?'~':'-','#7fe9ff',0);}}

   if(E.dash&&p.dashCd<=0){p.dashT=.18;p.dashCd=p.dashMax;p.inv=Math.max(p.inv,.26);p.atk=0;p.plunge=false;if(ax)p.face=ax;sfx('dash');}
   
   if(E.heal){if(p.cans>0&&p.hp<p.max){p.cans--;p.hp=Math.min(p.max,p.hp+p.canHeal);sfx('rest');for(let i=0;i<10;i++)part(cx0+rnd(-16,16),p.y+rnd(10,80),0,rnd(-70,-30),rnd(.5,.9),'+','#8fe06a',0);}else sfx('deny');}
   if(false){p.wi=(p.wi+1)%p.weapons.length;popup(cx0,p.y-34,WPN[p.weapons[p.wi]][0],WPN[p.weapons[p.wi]][1]);sfx('pick');}
  }}
 const wasG=p.grounded;p.hitWall=false;moveBody(p,dt,p.drop>0);
 if(p.grounded){if(!wasG){for(let i=0;i<4;i++)part(p.x+p.w/2+rnd(-12,12),p.y+p.h,rnd(-70,70),rnd(-40,-5),.35,pickc('.,_'),'#b08a66',100);if(p.plunge)slam();}
  p.jumps=0;p.coy=.1;const c=Math.floor((p.x+p.w/2)/CW),r=Math.floor((p.y+p.h+2)/CH);if(r<LH&&sol[r*LW+c]===1&&groundY[c]>=0&&p.inv<=0&&bossSt!==2){p.safeX=p.x;p.safeY=p.y;}}
