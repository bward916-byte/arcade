<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cactus Seed Label Generator — Blythe Cactus Farm</title>
<style>
/* ============================================================
   App chrome (input panel + preview)
   ============================================================ */
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0; padding: 0; background: #f5f3ef; color: #222;
}
.app {
  display: grid;
  grid-template-columns: 420px 1fr;
  height: 100vh;
}
.editor {
  background: #2f3e2e; color: #f5f3ef;
  padding: 20px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
}
.editor h1 { margin: 0; font-size: 18px; font-weight: 600; }
.editor h1 small {
  display: block; font-weight: 400; opacity: 0.7; font-size: 12px; margin-top: 2px;
}
.editor textarea {
  width: 100%; height: 280px; resize: vertical;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px; padding: 10px; border-radius: 4px;
  border: 1px solid #4a5d49; background: #1f2a1f; color: #e8e5dc;
}
.editor .row { display: flex; gap: 8px; flex-wrap: wrap; }
.editor button {
  flex: 1; min-width: 120px;
  padding: 9px 14px; border: none; border-radius: 4px;
  font-weight: 600; cursor: pointer; font-size: 13px;
  background: #5a7a59; color: white;
}
.editor button:hover { background: #6a8c69; }
.editor button.secondary { background: #4a4a4a; }
.editor button.secondary:hover { background: #5a5a5a; }
.editor button.danger { background: #7a4a4a; }
.editor button.danger:hover { background: #8c5a5a; }
.editor .status {
  font-size: 12px; padding: 8px 10px; border-radius: 4px;
  background: rgba(255,255,255,0.06); color: #d8d4c8; min-height: 32px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.editor .missing-box, .editor .name-box {
  font-size: 12px; padding: 8px 10px; border-radius: 4px; color: #fff;
}
.editor .missing-box { background: #7a2e2e; border: 1px solid #c96a6a; }
.editor .name-box    { background: #6b5a1e; border: 1px solid #c9a94a; }
.editor .missing-box ul, .editor .name-box ul { margin: 4px 0 0; padding-left: 18px; }
.editor .missing-box li, .editor .name-box li {
  margin: 2px 0; font-family: ui-monospace, Menlo, monospace; font-size: 11px;
}
.editor details { font-size: 12px; }
.editor details summary { cursor: pointer; user-select: none; padding: 4px 0; }
.editor details ul { margin: 4px 0; padding-left: 18px; }
.editor details li { margin: 3px 0; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
.preview {
  overflow-y: auto; background: #d9d6cc; padding: 24px;
}

/* ============================================================
   Order summary (per-batch overrides, above pages)
   ============================================================ */
.order-controls {
  background: white; border: 1px solid #c0bdb0; border-radius: 6px;
  padding: 12px 16px; margin-bottom: 20px; font-size: 12px;
}
.order-controls h2 {
  margin: 0 0 10px; font-size: 13px; font-weight: 600;
  color: #444; text-transform: uppercase; letter-spacing: 0.5px;
}
.batch-block {
  margin-bottom: 10px;
  border: 1px solid #d8d4c8;
  border-radius: 5px;
  overflow: hidden;
  background: white;
}
.batch-block:last-child { margin-bottom: 0; }
.batch-header {
  background: #eef1ec;
  padding: 6px 10px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  border-bottom: 1px solid #d8d4c8;
  font-size: 12px;
  flex-wrap: wrap;
}
.batch-header .batch-names { flex: 1; min-width: 200px; }
.batch-header .lbl {
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  color: #888; margin-right: 3px;
}
.batch-header .val { color: #2f3e2e; font-weight: 600; }
.batch-header .loc { color: #555; margin-left: 4px; }
.batch-header .sep { color: #aaa; margin: 0 6px; }
.batch-header .batch-orders {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; color: #555;
  white-space: nowrap;
}
.item-row {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 12px;
  padding: 6px 10px;
  border-top: 1px solid #f0eee5;
  align-items: center;
  font-size: 12px;
}
.item-row:first-child { border-top: none; }
.item-row .item-what { color: #555; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.item-row .origin-tag {
  font-size: 10px; color: #5a7a59;
  font-family: ui-monospace, Menlo, monospace;
  margin-left: 4px;
}
.item-row .type-pill {
  display: inline-block;
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 2px 6px;
  border-radius: 3px;
  color: #fff;
  background: #888;
}
.item-row .type-pill.type-seeds   { background: #5a8a4a; }
.item-row .type-pill.type-cutting { background: #a87a4a; }
.item-row .type-pill.type-pad     { background: #4a7a8a; }
.item-row .type-pill.type-aquatic { background: #2f6a8a; }
.item-row .type-pill.type-plant,
.item-row .type-pill.type-seedling,
.item-row .type-pill.type-specimen,
.item-row .type-pill.type-pair,
.item-row .type-pill.type-pack    { background: #7a5a8a; }
.item-row .toggle-wrap {
  display: flex; align-items: center; gap: 6px; justify-self: end;
}
.item-row .toggle-label {
  font-size: 10px; color: #888;
  text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600;
}
.order-controls .toggle-group {
  display: flex; gap: 2px; background: #eee; border-radius: 4px; padding: 2px;
}
.order-controls .toggle-group button {
  flex: 1; padding: 4px 8px; border: none; background: transparent;
  font-size: 11px; cursor: pointer; border-radius: 3px;
  color: #555;
}
.order-controls .toggle-group button.active {
  background: #5a7a59; color: white; font-weight: 600;
}

/* ============================================================
   Printed page — 8.5x11 with two columns
   ============================================================ */
.page {
  background: white; width: 8.5in; min-height: 11in;
  margin: 0 auto 20px; padding: 0.5in 0.5in 0.4in;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  display: flex; flex-direction: column;
  page-break-after: always;
  break-after: page;
  position: relative;
}
.page:last-child { page-break-after: auto; break-after: auto; }
.page-header {
  border-bottom: 2px solid #2f3e2e; padding-bottom: 8px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: baseline;
}
.page-header .brand {
  font-size: 14px; font-weight: 700; color: #2f3e2e;
}
.page-header .brand small {
  font-weight: 400; color: #666; margin-left: 6px;
}
.page-header .customer {
  font-size: 13px; color: #333; text-align: right;
}
.page-header .customer .name { font-weight: 600; }
.page-header .customer .label {
  font-size: 10px; color: #888; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.4px;
}
.page-header .customer .ship-to-line .name {
  font-weight: 700; font-size: 14px; color: #2f3e2e;
}
.page-header .customer .buyer-line {
  margin-top: 3px;
}
.page-header .customer .buyer-line .name {
  font-weight: 500; font-size: 12px; color: #555;
}
.page-header .customer .location {
  font-size: 11px; color: #555; margin-top: 1px;
}
.page-header .customer .order { color: #888; font-size: 11px; margin-top: 3px; }
.page-body {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.3in;
}
.page-footer {
  margin-top: 10px; padding-top: 6px; border-top: 1px solid #ddd;
  font-size: 9px; color: #888; text-align: center;
}

/* ============================================================
   Seed entry — one product row inside a column
   ============================================================ */
.seed-entry {
  border-bottom: 1px dashed #c0bdb0;
  padding: 10px 0;
  break-inside: avoid;
  page-break-inside: avoid;
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.seed-entry:last-child { border-bottom: none; }
.seed-scientific {
  font-style: italic; font-weight: 700; font-size: 13.5px; color: #2f3e2e;
  line-height: 1.2;
  margin-bottom: 4px;
}
.seed-common {
  font-size: 10.5px; color: #555; line-height: 1.35;
  margin-top: 1px;
}
.seed-quantity {
  font-size: 11px; font-weight: 600; color: #5a7a59;
  background: #eef3ed; padding: 3px 8px; border-radius: 3px;
  display: inline-block; align-self: flex-start;
}
.seed-quantity.is-cutting { color: #7a5a3a; background: #f4ede2; }
.seed-quantity.is-pad     { color: #4a6f7a; background: #e6eef1; }
.seed-quantity.is-aquatic { color: #2f5a6a; background: #dfecf1; }
.seed-quantity.is-pair, .seed-quantity.is-pack,
.seed-quantity.is-plant, .seed-quantity.is-specimen,
.seed-quantity.is-seedling { color: #5a4a6a; background: #ece6f1; }
.seed-germ {
  font-size: 10.5px; color: #2f3e2e; line-height: 1.3;
  background: #eef3ed; padding: 4px 8px; border-radius: 3px;
  display: flex; flex-wrap: wrap; gap: 10px;
}
.seed-germ strong { color: #2f3e2e; }
.seed-germ-method {
  font-size: 10px; color: #5a4a2a; line-height: 1.3;
  background: #fbf5e8; padding: 3px 8px; border-radius: 3px;
  border-left: 2px solid #c4a45a;
}

.seed-description {
  font-size: 10px; color: #555; line-height: 1.35;
  margin-top: 2px;
}
.seed-variations {
  font-size: 10px; color: #666; line-height: 1.3;
}
.seed-variations .vk { font-weight: 600; color: #444; }
.seed-title-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.seed-title-text { flex: 1; min-width: 0; }
.seed-tape-here {
  flex-shrink: 0;
  width: 70px;
  height: 56px;
  border: 1.5px dashed #c0bdb0;
  padding: 3px;
  text-align: center;
  font-size: 8.5px;
  color: #888;
  border-radius: 3px;
  line-height: 1.15;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafaf8;
}
.seed-order-tag {
  font-size: 8.5px; color: #888; text-align: right;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  margin-top: 2px;
}

/* ============================================================
   Right-column care guide (germination / plant / aquatic)
   Lives on the first page of each care-group.
   ============================================================ */
.is-care-col { padding: 0; }
.care-guide {
  font-size: 10px; line-height: 1.4; color: #2a2a2a;
  background: #faf8f2; border-left: 4px solid #5a7a59;
  padding: 14px 14px 12px; border-radius: 4px;
  height: 100%;
}
.care-guide-aquatic { border-left-color: #2f5a6a; background: #f3f8fa; }
.care-guide-plant   { border-left-color: #7a5a3a; background: #faf6f0; }
.care-guide-title {
  font-size: 14px; font-weight: 700; margin: 0 0 4px;
  color: #2f3e2e; line-height: 1.2;
}
.care-guide-germination .care-guide-title { color: #2f3e2e; }
.care-guide-aquatic    .care-guide-title { color: #2f5a6a; }
.care-guide-plant      .care-guide-title { color: #7a5a3a; }
.care-guide-intro {
  font-size: 9.5px; color: #555; margin: 0 0 8px; font-style: italic;
}
.care-guide h3 {
  font-size: 10.5px; font-weight: 700; color: #2f3e2e;
  margin: 8px 0 3px; padding-bottom: 1px;
  border-bottom: 1px solid #d8d4c8;
  text-transform: uppercase; letter-spacing: 0.4px;
}
.care-guide ul {
  margin: 2px 0 0; padding-left: 14px;
}
.care-guide li {
  margin: 1px 0; line-height: 1.35;
}
.care-guide strong { color: #2f3e2e; }
.care-guide em     { color: #555; }
.care-guide-sub {
  font-size: 10px; color: #2f3e2e;
  margin: 6px 0 1px 0;
  line-height: 1.3;
}
.care-guide-note {
  font-size: 9.5px; color: #555;
  margin: 5px 0 0 0;
  line-height: 1.4;
  font-style: italic;
}
.care-guide-note strong { color: #2f3e2e; font-style: normal; }
.care-guide-foot {
  margin-top: 10px; padding-top: 6px; border-top: 1px dashed #d0ccc0;
  font-size: 9px; color: #777; text-align: center; line-height: 1.4;
}

/* ============================================================
   Print-specific overrides — what shows up on paper
   ============================================================ */
@media print {
  body { background: white; }
  .app { display: block; height: auto; }
  .editor, .order-controls { display: none; }
  .preview { background: white; padding: 0; }
  .page {
    margin: 0; box-shadow: none; width: auto; min-height: auto;
    padding: 0.5in 0.5in 0.4in;
  }
  @page { size: letter; margin: 0; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="editor">
    <h1>
      Cactus Seed Label Generator
      <small>Blythe Cactus Farm · CactusArchive</small>
    </h1>

    <textarea id="orderText" placeholder="Paste Etsy order text here…"></textarea>

    <div class="row">
      <button id="btnProcess">Process Orders</button>
      <button id="btnPrint" class="secondary">Print</button>
    </div>
    <div class="row">
      <button id="btnClear" class="danger">Clear</button>
      <button id="btnLoadLast" class="secondary">Load Saved</button>
    </div>

    <div id="status" class="status">Paste an Etsy order text and click Process Orders.</div>

    <div id="missingBox" class="missing-box" style="display:none;"></div>
    <div id="nameBox" class="name-box" style="display:none;"></div>

    <details id="unmatchedDetails" style="display:none;">
      <summary id="unmatchedSummary">Unmatched lines (0)</summary>
      <ul id="unmatchedList"></ul>
    </details>

    <details>
      <summary>Catalog stats</summary>
      <div id="catalogStats" style="padding:6px 0;"></div>
    </details>
  </aside>

  <main class="preview" id="preview">
    <div style="padding:40px; color:#666; text-align:center;">
      Output will appear here after processing.
    </div>
  </main>
</div>

<script>
/* ============================================================
   PRODUCT CATALOG (generated by build_catalog.py — do not hand-edit)
   ============================================================ */
// =====================================================================
// Cactus Seed Label Generator — Product Catalog
// Generated from listings.csv. Edit by adding/modifying entries below.
// v5 (2026-10-09): all live Etsy listings match; retitled listings fall back
// to a scientific-name match (see matchByName).
// Each entry maps one Etsy listing (or retired listing) to a product.
// =====================================================================

const products = [
  {
    id: "azolla",
    match: [/Azolla|Fairy Moss|Mosquito Fern/i],
    scientific: "Azolla",
    common: "Fairy Moss / Mosquito Fern",
    productType: "aquatic",
    careInstructions: "aquatic",
    synonyms: "Common: Fairy Moss, Mosquito Fern, Water Velvet | Floating aquatic fern — nitrogen fixer",
    description: "Azolla — Fairy Moss or Mosquito Fern — is a tiny floating aquatic fern native worldwide in still or slow-moving freshwater. Forms dense mats of small fronds that can turn red in full sun. Important nitrogen-fixer due to symbiotic cyanobacteria (Anabaena azollae). Excellent for ponds, aquariums, and aquaponics systems. Provides habitat for beneficial insects while blocking light to inhibit algae growth. Doubles biomass in 3-5 days under good conditions. Approx 75 plants per 1 oz.",
    status: "active",
    csvIndex: 0,
  },
  {
    id: "echinopsis_chamaecereus_plant",
    match: [/Echinopsis chamaecereus\s*[—\-]\s*Orange Peanut Cactus/i],
    scientific: "Echinopsis chamaecereus",
    common: "Orange Peanut Cactus (bare root)",
    productType: "plant",
    careInstructions: "plant",
    synonyms: "Syn: Chamaecereus silvestrii | Common: Peanut Cactus — Bare root plant",
    description: "Echinopsis chamaecereus — the Peanut Cactus — is a charming clumping cactus native to the mountainous regions of Tucumán Province in northwestern Argentina. Its short, finger-like stems sprawl and offset freely, forming dense low mounds that resemble a pile of fuzzy peanuts. In late spring and early summer, mature plants produce an absolute explosion of vivid orange trumpet-shaped flowers. One of the easiest and most rewarding cacti to grow.",
    status: "active",
    csvIndex: 1,
  },
  {
    id: "peanut_cactus_cutting_pack",
    match: [/Echinopsis chamaecereus.*Cutting Pack/i],
    scientific: "Echinopsis chamaecereus",
    common: "Peanut Cactus — 4-Color Cutting Pack",
    productType: "pack",
    careInstructions: "plant",
    synonyms: "4-color collection: Westfield Alba (white), Yellow Bird, Orange (typical), Rose Quartz (pink)",
    description: "A curated 4-color collection of Peanut Cactus (Echinopsis chamaecereus) cuttings: 'Westfield Alba' (white blooms), 'Yellow Bird' (yellow blooms), the typical species (orange blooms), and 'Rose Quartz' (pink blooms). A great way to start a peanut cactus color collection.",
    status: "active",
    csvIndex: 2,
  },
  {
    id: "euphorbia_obesa_pair",
    match: [/Euphorbia obesa.*Seed grown male and female pair/i],
    scientific: "Euphorbia obesa",
    common: "Baseball Plant — M/F Pair",
    productType: "pair",
    careInstructions: "plant",
    synonyms: "Common: Baseball Plant Male/Female Pair | Required for seed production (dioecious)",
    description: "Euphorbia obesa — the Baseball Plant — is one of the most iconic dwarf Euphorbias in cultivation. The plant grows as a perfectly spherical, spineless, ribbed body marked with subtle horizontal bands of red-brown. Native to a tiny range in the Eastern Cape of South Africa, where it is now critically endangered in the wild. Obesa is dioecious: a male and a female plant are required for seed production, so a pair is required to produce viable seed.",
    status: "active",
    csvIndex: 4,
  },
  {
    id: "astrophytum_capricorne_var_senilis_specimen",
    match: [/^Astrophytum capricorne var senilis\s*$/i],
    scientific: "Astrophytum capricorne var. senilis",
    common: "Specimen plant",
    productType: "specimen",
    careInstructions: "plant",
    synonyms: "Var: senilis | Specimen plant",
    description: "Astrophytum capricorne var. senilis — Goat's Horn 'Senile' — characterized by an explosion of long, twisted, hair-like spines that nearly obscure the plant body. This is a specimen plant, not seeds.",
    status: "active",
    csvIndex: 6,
  },
  {
    id: "opuntia_debreczyi_pad",
    match: [/^Opuntia debreczyi\s*$/i],
    scientific: "Opuntia debreczyi",
    common: "Potato Cactus — Pad",
    productType: "pad",
    careInstructions: "plant",
    synonyms: "Common: Potato Cactus | Small rounded potato-like pads, extremely cold-hardy",
    description: "Rare Hungarian-bred Opuntia hybrid. Compact pad-forming cactus with blue-green segments. Medium-sized pads with moderate spination. Yellow flowers followed by edible fruits. Cold-hardy hybrid developed for European climates. Hardy to 0°F or below. Prefers full sun and well-drained soil. Drought-tolerant once established. Good for cold-climate cactus gardens.",
    status: "active",
    csvIndex: 7,
  },
  {
    id: "opuntia_cacanapa_ellisiana_pad",
    match: [/Opuntia cacanapa ellisiana|blue spineless prickly pear/i],
    scientific: "Opuntia cacanapa 'Ellisiana'",
    common: "Blue Spineless Prickly Pear — Unrooted Pad",
    productType: "pad",
    careInstructions: "plant",
    synonyms: "Cv. 'Ellisiana' | Common: Blue Spineless Prickly Pear, Texas Spineless | Nearly spineless cultivated form",
    description: "Opuntia cacanapa 'Ellisiana' — the Blue Spineless Prickly Pear — is a cultivated nearly-spineless form of a Texas/Mexico prickly pear with handsome blue-green pads, soft-yellow spring flowers, and edible reddish fruit. The defining feature is the dramatically reduced spination (still has tiny glochids — wear gloves), making it the safest prickly pear to handle and a favorite for landscape and pasture use. Cold-hardy and fast-growing. Ships as a bare-root unrooted pad — let callous a few days if freshly cut, then set on top of dry sandy/gritty mix and wait for roots to anchor before watering.",
    status: "active",
  },
  {
    id: "gymnocalycium_bruchii_plant",
    match: [/^Gymnocalycium bruchii\s*$/i],
    scientific: "Gymnocalycium bruchii",
    common: "Dwarf Chin Cactus (bare root)",
    productType: "plant",
    careInstructions: "plant",
    synonyms: "Common: Dwarf Bruch's Chin Cactus | Bare root plant",
    description: "Gymnocalycium bruchii — Dwarf Bruch's Chin Cactus — small clustering cactus from Argentina forming tight mounds of globular stems. Produces pale pink flowers in spring. One of the most cold-tolerant cacti in cultivation.",
    status: "active",
    csvIndex: 8,
  },
  {
    id: "opuntia_fulgida_crested",
    match: [/Opuntia fulgida.*crested|crested.*boxing glove/i],
    scientific: "Opuntia fulgida f. cristata",
    common: "Crested Boxing Glove Cactus",
    productType: "specimen",
    careInstructions: "plant",
    synonyms: "Syn: Cylindropuntia fulgida | Common: Crested Boxing Glove Cactus, Jumping Cholla",
    description: "Opuntia fulgida (now properly Cylindropuntia fulgida) f. cristata — the Crested Boxing Glove Cactus — is a mutated form of the common Chain Fruit Cholla. Instead of the typical cylindrical jointed stems, the crested form grows as fused, fan-shaped, lumpy 'boxing gloves' of green tissue covered in straw-colored spines. Each plant grows uniquely. A standout among crested cacti.",
    status: "active",
    csvIndex: 9,
  },
  {
    id: "opuntia_zebrina_pad",
    match: [/Opuntia zebrina.*reticulata|Cobra Cactus/i],
    scientific: "Opuntia zebrina f. reticulata",
    common: "Cobra Cactus — Single Pad",
    productType: "pad",
    careInstructions: "plant",
    synonyms: "Common: Cobra Cactus, Consolea | Snake-skin textured pads (f. reticulata)",
    description: "Opuntia zebrina f. reticulata — the Cobra Cactus — is an extraordinary mutated form where the typical smooth pad surface is broken into a raised, netted, snake-skin-like pattern. The reticulated texture catches light beautifully and makes every pad unique. Grows as flat green pads with the characteristic snake-skin reticulation, slowly forming small branching plants.",
    status: "active",
    csvIndex: 10,
  },
  {
    id: "stapelia_multi_cutting_pack",
    match: [/Stapelia Multi Cutting Pack/i, /Stapelia.*Cutting Pack/i],
    scientific: "Stapelia spp.",

/* ============================================================
   PARSER
   Pure function: parseOrders(text) -> Order[]
   Each Order = { orderNumber, customer, lines: OrderLine[] }
   Each OrderLine = {
     productId,            // ref into products[]
     unmatchedTitle,       // when productId is null
     itemQuantity,         // integer (default 1)
     variations,           // { Quantity, Number of Seeds, ... }
     rawTitle              // the matched title line, for debugging
   }
   ============================================================ */

const VARIATION_NAMES = [
  "Number of Seeds",
  "Number of Cuttings",
  "Quantity",
  "Length",
  "Pack Size",
  "Size",
  "Sex",
];

/* Lines we should ignore — Etsy chrome that has no signal. */
const IGNORE_PATTERNS = [
  /^Transaction ID:/i,
  /^Item total$/i, /^Subtotal$/i, /^Shipping price$/i, /^Sales tax/i,
  /^Order total$/i, /^Shop coupon$/i, /^Paid via Etsy/i,
  /^\d+ Item\(s\)$/i, /^Item price$/i,
  /^[\$€£]\d/, /^-?\$\d/,
  /^Open$/i, /^Paid$/i, /^Shipped$/i, /^Completed$/i,
  /^[(]?\d+% off[)]?$/i,
];

/* Decode common HTML entities that Etsy injects into pasted text.
   Etsy sometimes renders the same listing title twice: once HTML-encoded
   (&#39; &amp; &quot;) and once decoded with raw characters. */
function decodeHtmlEntities(s) {
  return s
    .replace(/&#39;/g, "'")
    .replace(/&apos;/g, "'")
    .replace(/&quot;/g, '"')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&nbsp;/g, ' ')
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(parseInt(n, 10)))
    .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
}

/* Strip markdown bold (__Item__) and Etsy formatting noise, decode entities,
   unwrap markdown links [text](url) → text. */
function cleanLine(line) {
  return decodeHtmlEntities(line)
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")    // markdown link → just the text
    .replace(/^_{2}/, "").replace(/_{2}$/, "")  // __title__
    .replace(/^\*+\s*/, "")                      // * prefix
    .replace(/\s+/g, " ")
    .trim();
}

function isIgnored(line) {
  return IGNORE_PATTERNS.some(p => p.test(line));
}

/* Try to match a line against the catalog. Returns the product entry
   or null. If multiple products match, prefers the longest pattern
   match (more specific). */
function matchProduct(line) {
  let best = null;
  let bestLen = 0;
  for (const p of products) {
    for (const re of p.match) {
      const m = line.match(re);
      if (m && m[0].length > bestLen) {
        best = p;
        bestLen = m[0].length;
      }
    }
  }
  return best;
}

/* Parse a variation line. Returns [name, value] or null.
   Handles "Number of Seeds: 10 Seeds", "Number of Seeds10 Seeds",
   "* Quantity1", "Quantity: 5". */
function parseVariation(line) {
  for (const name of VARIATION_NAMES) {
    // Allow optional ": " or no separator between name and value
    const re = new RegExp("^" + name.replace(/ /g, "\\s+") + "\\s*:?\\s*(.+)$", "i");
    const m = line.match(re);
    if (m) return [name, m[1].trim()];
  }
  return null;
}

/* Detect an order delimiter line. Anchored to start of line so we don't
   pick up stray hash-numbers inside chrome text.
   Matches "Receipt #1234567890", "Order #1234567890", "#1234567890$17.44 WHATEVER". */
function parseOrderDelimiter(line) {
  const m = line.match(/^\s*(?:(?:Receipt|Order)\s+)?#\s*(\d{6,})/i);
  if (m) return { orderNumber: m[1] };
  return null;
}

/* Etsy shop manager format announces each order with:
     "Select this order from <Customer Name> on Month DD, YYYY"
   Sometimes the name slot is empty (Etsy template glitch) and the line
   reads "Select this order from on May 12, 2026" — in that case the
   buyer name appears on the very next line on its own.

   Returns:
     null               — line doesn't match Select-from pattern at all
     { name: "..." }    — Select-from line with a non-empty buyer name
     { name: "" }       — Select-from line present but buyer name missing
                           (caller should treat next name-like line as the buyer) */
function parseSelectFromLine(line) {
  const m = line.match(/^\s*Select this order from(?:\s+(.+?))?\s+on\s+[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}\s*$/i);
  if (!m) return null;
  return { name: (m[1] || '').trim() };
}

/* Heuristic fallback for customer name detection. Used only when no
   "Select this order from <name> on <date>" line is present in the paste. */
const CHROME_PREFIXES = [
  // Order status / shipping chrome
  'open','paid','shipped','completed','in progress','new','will ship','marked as',
  'view order','order details','items','item','untracked','ship today','ship by',
  'ship to','ordered ','usps','ups','fedex','standard shipping','first-class',
  'track package','pre-transit','in transit','canceled','fully refunded','refund',
  // Filters / sort
  'sort by','sort ','overdue','today','tomorrow','within','no estimate','destination',
  'united states','international','has note','marked as gift','personalized','shipping',
  'eligible','upgrade','reset filters',
  // Money / counts
  'quantity','total','subtotal','tax','order total','grand total',
  // Etsy nav / shop manager
  'skip to','shop manager','etsy plus','search','dashboard','listings','messages',
  'orders','etsy search','stats','customer service','policy','marketing','finances',
  'apps','help','settings','sales channels','etsy','cactusarchive','square',
  'blythe cactus','want your own','learn more','your account','via etsy',
  'etsy payments','shop coupon','transaction id','select this order',
  'completed may','page','of ',
  // Footer
  'terms of use','privacy','interest-based','local shops','regions','help center',
];

function looksLikeCustomerName(line) {
  if (line.length < 2 || line.length > 80) return false;
  if (/\d/.test(line)) return false;
  if (/[\$€£@/|©®™]/.test(line)) return false;
  const low = line.toLowerCase();
  for (const prefix of CHROME_PREFIXES) {
    if (low.startsWith(prefix)) return false;
  }
  if (!/[A-Za-zÀ-ÿ]/.test(line)) return false;
  if (line === line.toUpperCase() && !/\s/.test(line)) return false;
  const wordCount = line.split(/\s+/).length;
  if (wordCount > 5) return false;
  if (!/[A-ZÀ-Þ][a-zà-þ]/.test(line)) return false;
  return true;
}

/* More permissive than looksLikeCustomerName — used only inside a
   recognized "Ship to" block, where Etsy sometimes renders the
   recipient name lowercase or with non-standard capitalization,
   and may append shop codes like "TRUNG TRAN EC576". */
function looksLikeShipToName(line) {
  if (line.length < 2 || line.length > 80) return false;
  if (/^\d+$/.test(line)) return false;          // all-digit = order/tracking number
  if (/[\$€£@/|©®™]/.test(line)) return false;
  const low = line.toLowerCase();
  for (const prefix of CHROME_PREFIXES) {
    if (low.startsWith(prefix)) return false;
  }
  if (!/[A-Za-zÀ-ÿ]/.test(line)) return false;
  const wordCount = line.split(/\s+/).length;
  if (wordCount > 5) return false;
  return true;
}

/* "City, ST" or "City, State Name" — typical second line of an address block. */
function looksLikeLocation(line) {
  if (line.length < 3 || line.length > 80) return false;
  if (!/,/.test(line)) return false;
  // After the last comma, expect a state-like token (2-letter abbrev or word)
  const parts = line.split(',');
  if (parts.length < 2) return false;
  const tail = parts[parts.length - 1].trim();
  if (tail.length === 0) return false;
  if (!/[A-Za-zÀ-ÿ]/.test(tail)) return false;
  return true;
}

/* A line that reads like a listing title but matched nothing in the catalog.
   These are the dangerous misses: the item gets no label. */
function looksLikeProductTitle(line) {
  if (line.length < 10 || line.length > 160) return false;
  if (/^(cactus\s*archive|blythe cactus)/i.test(line)) return false;
  return /\b(seeds?|seedlings?|cuttings?|unrooted|rooted|pads?|plants?|cactus|cacti|succulents?)\b/i.test(line);
}

/* ---- Fallback matcher --------------------------------------------------
   Etsy titles get rewritten ("Ocotillo Seeds | Fouquieria splendens | ...")
   and stop matching the title patterns above. When that happens, match on
   what doesn't change: the scientific name plus the kind of product.
   Returns a product only when exactly one catalog entry fits. */
const NAME_QUALIFIERS = [/varieg/i, /crest|crist/i, /monstr/i, /furry/i];

function nameTokens(p) {
  if (!/^[A-Z][a-z]+ [a-z]{4,}/.test(p.scientific)) return [];   // real "Genus species" only
  return p.scientific.toLowerCase().replace(/[^a-z\s-]/g, " ").split(/\s+/)
    .filter(w => w.length > 3 && w !== "subsp" && w !== "forma" &&
                 !NAME_QUALIFIERS.some(q => q.test(w)));
}

/* Which productTypes a title could be, judged by its wording. */
function titleTypes(line) {
  if (/\bpair\b/i.test(line)) return ["pair"];
  if (/\bseedlings?\b/i.test(line)) return ["seedling"];
  if (/\bseed[\s-]?grown\b/i.test(line)) return ["seedling", "plant", "specimen"];
  if (/\bseeds?\b/i.test(line)) return ["seeds"];
  if (/\bpack\b/i.test(line)) return ["pack"];
  if (/\bpads?\b/i.test(line)) return ["pad"];
  if (/\b(cuttings?|segments?|unrooted)\b/i.test(line)) return ["cutting"];
  if (/\b(plants?|rooted|specimen)\b/i.test(line)) return ["plant", "seedling", "specimen"];
  return null;
}

function matchByName(line) {
  const low = line.toLowerCase();
  const types = titleTypes(line);
  let best = [], bestScore = 0;
  for (const p of products) {
    if (types && !types.includes(p.productType)) continue;
    const toks = nameTokens(p);
    if (toks.length < 2) continue;                       // need genus + species
    if (!toks.every(t => new RegExp("\\b" + t.slice(0, 7)).test(low))) continue;
    const label = `${p.id} ${p.scientific} ${p.common}`;
    if (!NAME_QUALIFIERS.every(q => q.test(line) === q.test(label))) continue;
    if (toks.length > bestScore) { best = [p]; bestScore = toks.length; }
    else if (toks.length === bestScore) best.push(p);
  }
  if (best.length > 1) {
    const active = best.filter(p => p.status === "active");
    if (active.length === 1) best = active;
  }
  return best.length === 1 ? best[0] : null;
}

function isShipToMarker(line) {
  return /^Ship to\s*:?\s*$/i.test(line);
}

/* Main parser. */
function parseOrders(text) {
  const rawLines = text.split(/\r?\n/);
  const orders = [];
  let cur = null;
  let curLine = null;
  let pendingCustomer = null;
  let expectingFallbackBuyer = false;
  let shipToState = 'none';            // 'none' | 'expecting_name' | 'expecting_location'
  const unmatched = [];
  const missingProducts = [];          // listing titles with no catalog entry
  const nameMatched = [];              // titles matched by scientific name only

  function ensureOrder() {
    if (!cur) {
      cur = {
        orderNumber: null, customer: null, lines: [], candidates: [],
        shipToName: null, shipToLocation: null,
      };
      orders.push(cur);
    }
    return cur;
  }

  function resetSelectFromAndShipTo() {
    expectingFallbackBuyer = false;
    shipToState = 'none';
  }

  for (let i = 0; i < rawLines.length; i++) {
    const original = rawLines[i];
    const line = cleanLine(original);
    if (!line) continue;
    if (isIgnored(line)) continue;

    // 0. "Ship to" marker — enter ship-to capture state for the current order
    if (isShipToMarker(line)) {
      if (cur) shipToState = 'expecting_name';
      continue;
    }

    // 0a. If we are expecting a ship-to name on this line, capture it
    if (shipToState === 'expecting_name') {
      if (looksLikeShipToName(line)) {
        if (cur) cur.shipToName = line;
        shipToState = 'expecting_location';
        continue;
      }
      // Anything else aborts the ship-to capture
      shipToState = 'none';
    }
    if (shipToState === 'expecting_location') {
      if (looksLikeLocation(line)) {
        if (cur) cur.shipToLocation = line;
        shipToState = 'none';
        continue;
      }
      shipToState = 'none';
    }

    // 1a. Select-from line
    const sfResult = parseSelectFromLine(line);
    if (sfResult !== null) {
      if (sfResult.name) {
        pendingCustomer = sfResult.name;
        expectingFallbackBuyer = false;
      } else {
        expectingFallbackBuyer = true;
      }
      shipToState = 'none';
      continue;
    }

    // 1. Order delimiter?
    const od = parseOrderDelimiter(line);
    if (od) {
      cur = {
        orderNumber: od.orderNumber,
        customer: pendingCustomer,
        lines: [],
        candidates: [],
        shipToName: null,
        shipToLocation: null,
      };
      orders.push(cur);
      pendingCustomer = null;
      resetSelectFromAndShipTo();
      curLine = null;
      continue;
    }

    // 2. Variation line
    const v = parseVariation(line);
    if (v) {
      const [vname, vval] = v;
      if (vname === "Quantity" && /^\d+$/.test(vval)) {
        if (curLine) curLine.itemQuantity = parseInt(vval, 10);
        continue;
      }
      if (curLine) {
        curLine.variations[vname] = vval;
        continue;
      }
      continue;
    }

    // 3. Standalone integer = item count (Receipt format)
    if (/^\d+$/.test(line)) {
      if (curLine && curLine.itemQuantity == null) {
        curLine.itemQuantity = parseInt(line, 10);
      }
      continue;
    }

    // 4. Catalog match — title pattern first, scientific name as fallback
    let product = matchProduct(line);
    if (!product) {
      product = matchByName(line);
      if (product) {
        const note = `${line}  →  ${product.scientific} · ${product.common} (${product.productType})`;
        if (!nameMatched.includes(note)) nameMatched.push(note);
      }
    }
    if (product) {
      ensureOrder();
      const last = cur.lines[cur.lines.length - 1];
      const lastIsFresh = last && last === curLine && last.itemQuantity == null &&
                          Object.keys(last.variations).length === 0;
      if (last && last.productId === product.id && lastIsFresh) {
        // Etsy displays each listing title twice in shop manager pastes
        // (often once HTML-entity-encoded, once decoded). Same product as
        // the immediately previous line = duplicate display, not a separate
        // purchase. Skip; variations on subsequent lines attach to the
        // existing curLine.
        continue;
      }
      curLine = {
        productId: product.id,
        unmatchedTitle: null,
        itemQuantity: null,
        variations: {},
        rawTitle: line,
        manualType: null,
        originOrder: cur.orderNumber,
      };
      cur.lines.push(curLine);
      expectingFallbackBuyer = false;
      continue;
    }

    // 4-pre. Buyer name on its own line right after an empty "Select this
    //     order from on <date>" — Etsy shows it as typed, sometimes lowercase.
    if (expectingFallbackBuyer && looksLikeShipToName(line)) {
      pendingCustomer = line;
      expectingFallbackBuyer = false;
      continue;
    }

    // 4a. Looks like a listing title but isn't in the catalog. Record it and
    //     close the current item so this item's variations / quantity don't
    //     get attached to the previous item's label.
    if (looksLikeProductTitle(line)) {
      if (!missingProducts.includes(line)) missingProducts.push(line);
      curLine = null;
      continue;
    }

    // 5. Customer name candidate
    if (looksLikeCustomerName(line)) {
      if (expectingFallbackBuyer) {
        pendingCustomer = line;
        expectingFallbackBuyer = false;
        continue;
      }
      if (cur) {
        cur.candidates.push(line);
        if (!cur.customer && cur.lines.length === 0) {
          cur.customer = line;
        }
      }
      continue;
    }

    // 6. Unmatched
    if (line.length > 4 && !/^https?:/i.test(line) && !/^(View|Print|Edit|Cancel|Save)$/i.test(line)) {
      unmatched.push(line);
    }
  }

  for (const o of orders) {
    for (const l of o.lines) {
      if (l.itemQuantity == null) l.itemQuantity = 1;
      if (!l.originOrder && o.orderNumber) l.originOrder = o.orderNumber;
    }
  }

  const realOrders = orders.filter(o => o.lines.length > 0);
  return { orders: realOrders, unmatched, missingProducts, nameMatched };
}

/* Combine orders into customer batches keyed on SHIP-TO (name + location)
   since the physical destination is what determines whether multiple
   orders go in one package. Falls back to buyer name when ship-to isn't
   detected (e.g., receipt-format pastes). */
function combineOrdersByCustomer(orders) {
  const byKey = new Map();
  const result = [];
  for (const o of orders) {
    // Build combine key: ship-to address > ship-to name > buyer name > null
    let key = null;
    if (o.shipToName && o.shipToLocation) {
      key = `shipto:${o.shipToName.trim().toLowerCase()}|${o.shipToLocation.trim().toLowerCase()}`;
    } else if (o.shipToName) {
      key = `shipto:${o.shipToName.trim().toLowerCase()}`;
    } else if (o.customer) {
      key = `buyer:${o.customer.trim().toLowerCase()}`;
    }

    if (!key) {
      result.push({
        customer: null,
        shipToName: null,
        shipToLocation: null,
        orderNumbers: o.orderNumber ? [o.orderNumber] : [],
        lines: o.lines,
      });
      continue;
    }

    if (!byKey.has(key)) {
      const merged = {
        customer: o.customer,
        shipToName: o.shipToName,
        shipToLocation: o.shipToLocation,
        orderNumbers: o.orderNumber ? [o.orderNumber] : [],
        lines: [...o.lines],
      };
      byKey.set(key, merged);
      result.push(merged);
    } else {
      const existing = byKey.get(key);
      if (o.orderNumber && !existing.orderNumbers.includes(o.orderNumber)) {
        existing.orderNumbers.push(o.orderNumber);
      }
      // Backfill ship-to fields if the existing batch was missing them
      if (!existing.shipToName && o.shipToName) existing.shipToName = o.shipToName;
      if (!existing.shipToLocation && o.shipToLocation) existing.shipToLocation = o.shipToLocation;
      // If buyer names differ across merged orders, keep the first; could
      // also concatenate, but ship-to is the primary identity here.
      existing.lines.push(...o.lines);
    }
  }
  return result;
}

/* ============================================================
   RENDERER
   renderLabels(orders) -> DOM tree inside #preview
   ============================================================ */

const productById = Object.fromEntries(products.map(p => [p.id, p]));

/* Left column: quantity descriptor varies by productType.
   itemQuantity is the number of *units* the customer bought (usually 1).
   variations holds Number of Seeds / Length / Size / Sex etc. */
function formatQuantity(product, line) {
  const itemQ = line.itemQuantity || 1;
  const v = line.variations || {};

  // Helper: pluralize unit by count
  const u = (n, sing, pl) => `${n} ${n === 1 ? sing : pl}`;

  // Effective product type honors manual override
  const type = line.manualType || product.productType;
  const care = line.manualType ?
      (line.manualType === 'seeds' ? 'germination' :
       line.manualType === 'aquatic' ? 'aquatic' : 'plant')
      : product.careInstructions;

  // SEEDS
  if (type === 'seeds') {
    // Find seed count from Number of Seeds, Quantity (if non-digit), or Size
    let seedCountText = null;
    if (v["Number of Seeds"]) seedCountText = v["Number of Seeds"];
    else if (v["Quantity"] && !/^\d+$/.test(v["Quantity"])) seedCountText = v["Quantity"];
    else if (v["Size"]) seedCountText = v["Size"];

    if (seedCountText) {
      // Normalize "10 Seeds" / "Approx 150-200 Seeds" / "1 Seed"
      const clean = seedCountText.replace(/^Approx\s+/i, "Approx ");
      if (itemQ > 1) return `Quantity: ${itemQ} × ${clean}`;
      return `Quantity: ${clean}`;
    }
    return `Quantity: ${itemQ} packet${itemQ === 1 ? '' : 's'}`;
  }

  // AQUATIC
  if (type === 'aquatic') {
    if (v["Quantity"]) return `Quantity: ${v["Quantity"]}`;
    return `Quantity: ${itemQ} portion${itemQ === 1 ? '' : 's'}`;
  }

  // CUTTINGS — show Number of Cuttings, Length, or Size (whichever present)
  if (type === 'cutting') {
    const parts = [];
    if (v["Number of Cuttings"]) parts.push(`Quantity: ${v["Number of Cuttings"]}`);
    else if (itemQ > 1) parts.push(`Quantity: ${u(itemQ, "cutting", "cuttings")}`);
    else parts.push(`Quantity: 1 cutting`);
    if (v["Length"]) parts.push(`Length: ${v["Length"]}`);
    if (v["Size"] && !v["Number of Cuttings"]) parts.push(`Size: ${v["Size"]}`);
    return parts.join(" · ");
  }

  // PAD (Opuntia pads — may come as Single or in multi-packs)
  if (type === 'pad') {
    const parts = [];
    const packSize = v["Pack Size"];
    if (packSize && !/^single$/i.test(packSize)) {
      // Multi-pack: "Quantity: 2 × 3 Pack" (6 pads total)
      parts.push(`Quantity: ${itemQ} × ${packSize}`);
    } else {
      parts.push(`Quantity: ${u(itemQ, "pad", "pads")}`);
    }
    if (v["Size"]) parts.push(`Size: ${v["Size"]}`);
    return parts.join(" · ");
  }

  // SEEDLING — small seed-grown plant
  if (type === 'seedling') {
    const parts = [`Quantity: ${u(itemQ, "seedling", "seedlings")}`];
    if (v["Sex"]) parts.push(`Sex: ${v["Sex"]}`);
    if (v["Size"]) parts.push(`Size: ${v["Size"]}`);
    return parts.join(" · ");
  }

  // SPECIMEN — WYSIWYG one-of-a-kind
  if (type === 'specimen') {
    return `Quantity: ${u(itemQ, "specimen", "specimens")} (as shown)`;
  }

  // PAIR — Euphorbia obesa M/F
  if (type === 'pair') return `Quantity: ${itemQ} M/F pair${itemQ === 1 ? '' : 's'}`;

  // PACK — multi-item collection (cutting pack, 10-pack, etc)
  if (type === 'pack') {
    return `Quantity: ${u(itemQ, "pack", "packs")}`;
  }

  // PLANT (bare-root live plant)
  if (type === 'plant') {
    const parts = [`Quantity: ${u(itemQ, "plant", "plants")}`];
    if (v["Sex"]) parts.push(`Sex: ${v["Sex"]}`);
    if (v["Size"]) parts.push(`Size: ${v["Size"]}`);
    return parts.join(" · ");
  }

  return `Quantity: ${itemQ}`;
}

/* Right column care/germination text. */
/* The effective care type for a line — honors manual override. */
function effectiveCareType(line, product) {
  if (line.manualType === 'seeds') return 'germination';
  if (line.manualType === 'aquatic') return 'aquatic';
  if (line.manualType === 'plant') return 'plant';
  return product ? product.careInstructions : 'plant';
}

/* Small per-entry germination/care badge — species-specific data only.
   The general procedure lives in the right-column care guide. */
function renderEntryGermBadge(product, line) {
  const care = effectiveCareType(line, product);
  if (care !== 'germination') return '';
  const parts = [];
  if (product.germinationTime) parts.push(`<span><strong>Time:</strong> ${escapeHtml(product.germinationTime)}</span>`);
  if (product.germinationTemp) parts.push(`<span><strong>Temp:</strong> ${escapeHtml(product.germinationTemp)}</span>`);
  if (parts.length === 0 && product.productType === 'seeds') {
    parts.push(`<span><strong>Time:</strong> 5–30 days at 70–85°F (typical)</span>`);
  }
  if (parts.length === 0) return '';
  let html = `<div class="seed-germ">${parts.join(" · ")}</div>`;
  if (product.germinationMethod) {
    html += `<div class="seed-germ-method"><strong>Method:</strong> ${escapeHtml(product.germinationMethod)}</div>`;
  }
  return html;
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* Variations dump — show all captured variation values on the label
   per user request to "include as much info as possible". */
function renderVariations(line) {
  const v = line.variations || {};
  const keys = Object.keys(v);
  if (keys.length === 0) return "";
  return `<div class="seed-variations">${keys.map(k => `<span class="vk">${escapeHtml(k)}:</span> ${escapeHtml(v[k])}`).join(" · ")}</div>`;
}

function renderSeedEntry(line, product, opts) {
  const type = line.manualType || product.productType;
  const qClass = `is-${type}`;
  const includeTapeBox = (type === 'seeds');
  const orderTag = line.originOrder ? `<div class="seed-order-tag">#${escapeHtml(line.originOrder)}</div>` : '';

  return `<div class="seed-entry">
    <div class="seed-title-row">
      <div class="seed-title-text">
        <div class="seed-scientific">${escapeHtml(product.scientific)}</div>
        ${product.common ? `<div class="seed-common"><strong>${escapeHtml(product.common)}</strong></div>` : ''}
        ${product.synonyms ? `<div class="seed-common">${escapeHtml(product.synonyms)}</div>` : ''}
      </div>
      ${includeTapeBox ? '<div class="seed-tape-here">Tape<br>vial<br>here</div>' : ''}
    </div>
    <div class="seed-quantity ${qClass}">${escapeHtml(formatQuantity(product, line))}</div>
    ${renderEntryGermBadge(product, line)}
    <div class="seed-description">${escapeHtml(product.description || "")}</div>
    ${renderVariations(line)}
    ${orderTag}
  </div>`;
}

function renderOrderControls(batches) {
  if (batches.length === 0) return "";
  const blocks = [];
  let totalItems = 0;
  batches.forEach((b, bi) => {
    totalItems += b.lines.length;
    const nums = (b.orderNumbers && b.orderNumbers.length)
      ? b.orderNumbers.map(n => '#' + n).join(', ')
      : '—';
    const orderLabel = (b.orderNumbers && b.orderNumbers.length === 1) ? 'Order' : 'Orders';

    const itemRows = b.lines.map((l, li) => {
      const product = productById[l.productId];
      if (!product) return '';
      const effectiveType = l.manualType || product.productType;
      const careType = l.manualType ||
        (product.careInstructions === 'germination' ? 'seeds' :
         product.careInstructions === 'aquatic' ? 'aquatic' : 'plant');
      const make = (val, label) => `<button data-o="${bi}" data-l="${li}" data-v="${val}" class="${careType === val ? 'active' : ''}">${label}</button>`;
      const originTag = (b.orderNumbers && b.orderNumbers.length > 1 && l.originOrder)
        ? ` <span class="origin-tag">#${escapeHtml(l.originOrder)}</span>`
        : '';
      const typePill = `<span class="type-pill type-${escapeHtml(effectiveType)}">${escapeHtml(effectiveType)}</span>`;
      return `<div class="item-row">
        <div class="item-what">${typePill} <em>${escapeHtml(product.scientific)}</em>${originTag}</div>
        <div class="toggle-wrap">
          <span class="toggle-label">Care guide:</span>
          <div class="toggle-group" data-toggle="manualType">
            ${make("seeds", "Seeds")}
            ${make("plant", "Plant")}
            ${make("aquatic", "Aquatic")}
          </div>
        </div>
      </div>`;
    }).join("");

    const shipToPart = b.shipToName
      ? `<span class="lbl">Ship to:</span> <span class="val">${escapeHtml(b.shipToName)}</span>${b.shipToLocation ? ` <span class="loc">${escapeHtml(b.shipToLocation)}</span>` : ''}`
      : '';
    const buyerPart = b.customer
      ? `<span class="lbl">Buyer:</span> <span class="val">${escapeHtml(b.customer)}</span>`
      : '';
    const namesSeparator = (shipToPart && buyerPart) ? ' <span class="sep">·</span> ' : '';
    const namesLine = (shipToPart || buyerPart)
      ? `<div class="batch-names">${shipToPart}${namesSeparator}${buyerPart}</div>`
      : `<div class="batch-names"><em style="color:#888;">(unknown recipient)</em></div>`;

    blocks.push(`<div class="batch-block">
      <div class="batch-header">
        ${namesLine}
        <div class="batch-orders">${orderLabel} ${escapeHtml(nums)}</div>
      </div>
      <div class="batch-items">${itemRows}</div>
    </div>`);
  });

  return `<div class="order-controls">
    <h2>Summary — ${totalItems} item${totalItems === 1 ? '' : 's'} across ${batches.length} ship-to batch${batches.length === 1 ? '' : 'es'}</h2>
    ${blocks.join("")}
  </div>`;
}

/* Layout strategy (matches original app):
   - Group an order's lines by effective care type (germination/plant/aquatic)
   - For each care group:
     - First page: up to 3 entries on left column, comprehensive care guide on right
     - Continuation pages: up to 6 entries spread across both columns (3 per col)
   - Each page repeats the customer header
*/
const FIRST_PAGE_ENTRIES = 3;       // left column only, right is care guide
const CONTINUATION_ENTRIES = 6;     // both columns, 3 per col

function paginateCareGroup(lines) {
  const pages = [];
  if (lines.length === 0) return pages;
  pages.push(lines.slice(0, FIRST_PAGE_ENTRIES));
  for (let i = FIRST_PAGE_ENTRIES; i < lines.length; i += CONTINUATION_ENTRIES) {
    pages.push(lines.slice(i, i + CONTINUATION_ENTRIES));
  }
  return pages;
}

function renderEntriesHtml(lines) {
  return lines.map(l => {
    const product = productById[l.productId];
    if (!product) {
      return `<div class="seed-entry">
        <div class="seed-scientific" style="color:#a44;">Unmatched: ${escapeHtml(l.rawTitle || "(no title)")}</div>
        <div class="seed-common">No catalog entry found. Add a pattern to build_catalog.py.</div>
      </div>`;
    }
    return renderSeedEntry(l, product, {});
  }).join("");
}

function renderPage(order, pageLines, careType, isFirstPage, pageIdx, totalPages) {
  // Printed page only shows the order number(s). Buyer/ship-to names
  // appear in the on-screen order controls panel above the preview.
  let orderInfoText = '';
  if (order.orderNumbers && order.orderNumbers.length > 0) {
    const label = order.orderNumbers.length === 1 ? 'Order' : 'Orders';
    const nums = order.orderNumbers.map(n => `#${escapeHtml(n)}`).join(', ');
    orderInfoText = `${label} ${nums}${totalPages > 1 ? ` · Page ${pageIdx + 1}/${totalPages}` : ''}`;
  } else if (totalPages > 1) {
    orderInfoText = `Page ${pageIdx + 1}/${totalPages}`;
  }

  const customerHtml = orderInfoText
    ? `<div class="customer"><div class="order">${orderInfoText}</div></div>`
    : '';

  let leftHtml, rightHtml;
  if (isFirstPage) {
    leftHtml = renderEntriesHtml(pageLines);
    rightHtml = renderCareGuide(careType);
  } else {
    const mid = Math.ceil(pageLines.length / 2);
    leftHtml = renderEntriesHtml(pageLines.slice(0, mid));
    rightHtml = renderEntriesHtml(pageLines.slice(mid));
  }

  return `<section class="page">
    <header class="page-header">
      <div class="brand">Blythe Cactus Farm <small>· CactusArchive on Etsy</small></div>
      ${customerHtml}
    </header>
    <div class="page-body">
      <div class="page-col page-col-left">${leftHtml}</div>
      <div class="page-col page-col-right ${isFirstPage ? 'is-care-col' : ''}">${rightHtml}</div>
    </div>
    <footer class="page-footer">Thank you for supporting a small Colorado-River-desert nursery.</footer>
  </section>`;
}

function renderPages(batches) {
  const html = [];
  batches.forEach(batch => {
    if (batch.lines.length === 0) return;

    // Group lines by effective care type
    const groups = { germination: [], plant: [], aquatic: [] };
    batch.lines.forEach(line => {
      const product = productById[line.productId];
      const care = effectiveCareType(line, product);
      groups[care].push(line);
    });

    ['germination', 'plant', 'aquatic'].forEach(careType => {
      const lines = groups[careType];
      if (lines.length === 0) return;
      const pages = paginateCareGroup(lines);
      pages.forEach((pageLines, pageIdx) => {
        html.push(renderPage(batch, pageLines, careType, pageIdx === 0, pageIdx, pages.length));
      });
    });
  });
  return html.join("");
}

function renderAll(state) {
  const preview = document.getElementById("preview");
  // state.batches is the combined-by-customer view derived from state.orders
  if (!state.batches || state.batches.length === 0) {
    preview.innerHTML = `<div style="padding:40px; color:#666; text-align:center;">
      No orders parsed. Check the input.
    </div>`;
    return;
  }
  preview.innerHTML = renderOrderControls(state.batches) + renderPages(state.batches);
  // Wire up toggle buttons (batch index, line index)
  preview.querySelectorAll(".toggle-group button").forEach(btn => {
    btn.addEventListener("click", () => {
      const bi = parseInt(btn.dataset.o, 10);
      const li = parseInt(btn.dataset.l, 10);
      const v = btn.dataset.v;
      const product = productById[state.batches[bi].lines[li].productId];
      if (!product) return;
      const defaultCare = product.careInstructions === 'germination' ? 'seeds' :
                          product.careInstructions === 'aquatic' ? 'aquatic' : 'plant';
      state.batches[bi].lines[li].manualType = (v === defaultCare) ? null : v;
      saveState(state);
      renderAll(state);
    });
  });
}

/* ============================================================
   PERSISTENCE — localStorage for current batch
   ============================================================ */
const STORAGE_KEY = "cactusBatch_v2";

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      orders: state.orders,
      batches: state.batches,
      unmatched: state.unmatched,
      missingProducts: state.missingProducts || [],
      nameMatched: state.nameMatched || [],
      sourceText: state.sourceText,
      timestamp: Date.now(),
    }));
  } catch (e) {
    console.warn("Save failed:", e);
  }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.warn("Load failed:", e);
    return null;
  }
}

    return;
  }
  d.style.display = "block";
  s.textContent = `Unmatched lines (${state.unmatched.length})`;
  ul.innerHTML = state.unmatched.slice(0, 50).map(l => `<li>${escapeHtml(l)}</li>`).join("");
}

function process() {
  const text = document.getElementById("orderText").value;
  const { orders, unmatched, missingProducts, nameMatched } = parseOrders(text);
  const batches = deriveBatches(orders);
  state = { orders, batches, unmatched, missingProducts, nameMatched, sourceText: text };
  saveState(state);
  const totalItems = orders.reduce((s,o)=>s+o.lines.length,0);
  const ordersWithCustomers = orders.filter(o => o.customer).length;
  const ordersWithoutCustomers = orders.length - ordersWithCustomers;
  const mergedDelta = orders.length - batches.length;
  let msg = `${orders.length} order${orders.length===1?'':'s'}, ${totalItems} item${totalItems===1?'':'s'}, ${batches.length} customer batch${batches.length===1?'':'es'}.`;
  if (ordersWithoutCustomers > 0) {
    msg += ` ⚠ ${ordersWithoutCustomers} order${ordersWithoutCustomers===1?'':'s'} without customer name.`;
  }
  if (missingProducts.length > 0) {
    msg += ` ⚠ ${missingProducts.length} item${missingProducts.length===1?'':'s'} not in catalog.`;
  }
  if (mergedDelta > 0) {
    msg += ` ${mergedDelta} order${mergedDelta===1?'':'s'} merged into existing customer batch${mergedDelta===1?'':'es'}.`;
  }
  setStatus(msg);
  renderUnmatched();
  renderAll(state);
}

function clearAll() {
  document.getElementById("orderText").value = "";
  state = { orders: [], batches: [], unmatched: [], missingProducts: [], nameMatched: [], sourceText: "" };
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById("preview").innerHTML = `<div style="padding:40px; color:#666; text-align:center;">Cleared. Paste a new batch above.</div>`;
  document.getElementById("unmatchedDetails").style.display = "none";
  document.getElementById("missingBox").style.display = "none";
  document.getElementById("nameBox").style.display = "none";
  setStatus("Cleared.");
}

function loadSaved() {
  const saved = loadState();
  if (!saved) {
    setStatus("No saved batch found.");
    return;
  }
  document.getElementById("orderText").value = saved.sourceText || "";
  // Always re-derive batches in case saved data predates this format
  state = {
    orders: saved.orders || [],
    batches: saved.batches || deriveBatches(saved.orders || []),
    unmatched: saved.unmatched || [],
    missingProducts: saved.missingProducts || [],
    nameMatched: saved.nameMatched || [],
    sourceText: saved.sourceText || "",
  };
  setStatus(`Loaded saved batch from ${new Date(saved.timestamp).toLocaleString()} — ${state.orders.length} order${state.orders.length===1?'':'s'}, ${state.batches.length} customer batch${state.batches.length===1?'':'es'}.`);
  renderUnmatched();
  renderAll(state);
}

function renderCatalogStats() {
  const byType = {};
  const byCare = {};
  for (const p of products) {
    byType[p.productType] = (byType[p.productType] || 0) + 1;
    byCare[p.careInstructions] = (byCare[p.careInstructions] || 0) + 1;
  }
  const retired = products.filter(p => p.status === 'discontinued').length;
  const lines = [
    `Total entries: ${products.length}`,
    `Active: ${products.length - retired}`,
    `Discontinued (still matchable): ${retired}`,
    ``,
    `By productType:`,
    ...Object.entries(byType).map(([k,v]) => `  ${k}: ${v}`),
    ``,
    `By careInstructions:`,
    ...Object.entries(byCare).map(([k,v]) => `  ${k}: ${v}`),
  ];
  document.getElementById("catalogStats").innerHTML =
    lines.map(l => `<div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#d8d4c8;">${escapeHtml(l)}</div>`).join("");
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("btnProcess").addEventListener("click", process);
  document.getElementById("btnPrint").addEventListener("click", () => window.print());
  document.getElementById("btnClear").addEventListener("click", clearAll);
  document.getElementById("btnLoadLast").addEventListener("click", loadSaved);
  renderCatalogStats();

  // Auto-load last batch on open
  const saved = loadState();
  if (saved && saved.sourceText) {
    document.getElementById("orderText").value = saved.sourceText;
    state = {
      orders: saved.orders || [],
      batches: saved.batches || deriveBatches(saved.orders || []),
      unmatched: saved.unmatched || [],
      missingProducts: saved.missingProducts || [],
      nameMatched: saved.nameMatched || [],
      sourceText: saved.sourceText,
    };
    setStatus(`Restored batch from ${new Date(saved.timestamp).toLocaleString()} — ${state.orders.length} order${state.orders.length===1?'':'s'}, ${state.batches.length} customer batch${state.batches.length===1?'':'es'}.`);
    renderUnmatched();
    renderAll(state);
  }
});
</script>
</body>
