<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06141f;font-family:'IM Fell English',Georgia,'Times New Roman',serif;color:#f3e6c8;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 52%,rgba(2,6,16,.5) 100%)}

#flash.on{animation:hit .5s ease-out}

#fade{position:fixed;inset:0;pointer-events:none;background:#04090f;opacity:0}
svg{width:18px;height:18px;vertical-align:-4px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
#hud{position:fixed;top:0;left:0;right:0;display:none;flex-wrap:wrap;gap:5px 6px;justify-content:center;padding:7px 6px 14px;background:linear-gradient(rgba(6,12,20,.9),rgba(6,12,20,.55) 60%,rgba(6,12,20,0));font-size:15px;pointer-events:none}
#hud span{white-space:nowrap;padding:2px 9px 3px 6px;border-radius:13px;background:linear-gradient(rgba(58,38,18,.92),rgba(28,17,8,.92));border:1px solid rgba(226,186,104,.6);box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,190,.18);text-shadow:0 1px 1px #000}
#hud b{font-weight:normal;color:#fff1cf}
#hud .low{border-color:#ff7a5c;animation:pulse 1s infinite}

#hud i{display:inline-block;width:42px;height:7px;margin-left:6px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;vertical-align:1px;box-shadow:inset 0 1px 2px #000}

#hud .low i u{background:linear-gradient(#ff9a7a,#c8402a)}
#panel{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);width:min(440px,calc(100% - 20px));box-sizing:border-box;display:none;padding:14px 16px 16px;border-radius:14px;
 background:repeating-linear-gradient(92deg,rgba(255,220,160,.035) 0 3px,rgba(0,0,0,.05) 3px 7px),linear-gradient(#4a301a,#2a190c 60%,#1d1108);
 border:2px solid #d2a455;box-shadow:0 0 0 3px #2a1808,0 0 0 4px #7a5524,0 16px 44px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,230,170,.18),inset 0 0 46px rgba(0,0,0,.55);animation:rise .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes rise{from{opacity:0;transform:translate(-50%,26px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
#panel.wide{width:min(720px,calc(100% - 20px))}

#panel.title .btns{position:absolute;left:10px;right:10px;bottom:0}
h1{font-family:'Pirata One','IM Fell English',Georgia,serif;font-weight:normal;font-size:clamp(44px,min(15vw,20vh),98px);white-space:nowrap;line-height:.95;margin:0 0 2px;letter-spacing:2px;background:linear-gradient(#fff6d8 10%,#f3c969 45%,#b9781c 82%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2208) drop-shadow(0 8px 16px rgba(0,0,0,.6))}
.orn{color:#f3c969;letter-spacing:8px;font-size:18px;margin:0 0 4px;text-shadow:0 2px 4px #000}
h2{font-family:'Pirata One','IM Fell English',Georgia,serif;font-weight:normal;margin:0 0 8px;font-size:27px;letter-spacing:.5px;color:#f6d37a;text-shadow:0 2px 0 #2a1808,0 0 14px rgba(246,190,90,.35);padding-bottom:7px;background:linear-gradient(90deg,#d2a455,rgba(210,164,85,0)) left bottom/100% 2px no-repeat}
p{margin:4px 0 12px;font-size:16.5px;line-height:1.3;color:#f0e2c2}
#panel.title p{font-style:italic;font-size:18px;text-shadow:0 2px 6px #000}
.btns{display:flex;flex-wrap:wrap;gap:9px}
button{position:relative;overflow:hidden;flex:1 1 120px;min-height:48px;padding:6px 10px;font:inherit;font-size:17px;color:#fff1cf;cursor:pointer;border-radius:10px;border:1px solid #e3ba68;
 background:linear-gradient(#a37031,#774a1c 52%,#55310f);box-shadow:inset 0 1px 0 rgba(255,236,186,.5),inset 0 -4px 7px rgba(0,0,0,.35),0 3px 0 #241406,0 7px 12px rgba(0,0,0,.45);text-shadow:0 1px 2px #000;transition:transform .07s,box-shadow .07s,filter .1s}
button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,236,186,.5),inset 0 -2px 5px rgba(0,0,0,.35),0 0 0 #241406,0 2px 5px rgba(0,0,0,.45);filter:brightness(1.15)}
button.go{color:#2a1706;font-weight:bold;text-shadow:0 1px 0 rgba(255,250,220,.55);border-color:#fff2c0;background:linear-gradient(#ffe69a,#e6ae3c 50%,#b47a16)}
button.go::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.6s infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}

#toast{position:fixed;left:50%;top:25%;transform:translateX(-50%) scale(.9);padding:8px 20px;border-radius:5px;background:linear-gradient(#f6e8bd,#dcc48c);color:#2a1808;border:1px solid #7a5a22;box-shadow:0 0 0 3px rgba(42,24,8,.35),0 8px 22px rgba(0,0,0,.5);font-size:17px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);text-align:center;width:max-content;max-width:84%}

@media (max-height:480px){.row{margin:2px 0;padding:1px 4px 1px 8px}button.sq{flex-basis:34px;height:34px;min-height:34px;font-size:20px}h2{font-size:21px;margin-bottom:4px;padding-bottom:4px}#panel{padding:8px 14px 10px;bottom:12px}#panel.title{bottom:14px}button{min-height:40px}.st{margin:4px 0}p{margin:2px 0 8px}#bar{bottom:12px}.shipc canvas{width:auto;height:22vh;margin:0 auto}.stat{margin:1px 0}.orn{display:none}}
.it{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}#toast img{width:30px;height:30px;vertical-align:-9px;margin-right:6px}#bar button{flex:0 1 150px;padding:6px 6px}#panel.jobs{padding:10px 12px 12px}.jobs h2{font-size:23px;margin-bottom:5px}.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}.job{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 8px;border-radius:9px;border:2px dashed rgba(255,224,138,.6);background:rgba(0,0,0,.28);min-width:0;min-height:36px}.job.on{border:2px solid #8fe89a;background:rgba(60,150,85,.22)}.job .jt{flex:1;min-width:0;line-height:1.15}.job .jt b{font-weight:normal;font-size:16px;color:#f6d37a;white-space:nowrap}.job .jt small{display:block;font-size:11.5px;opacity:.9;font-style:italic;line-height:1.1}.job button.sq{flex:0 0 32px;height:32px;min-height:32px;font-size:20px}
@media (orientation:landscape) and (max-height:520px){#panel.jobs{left:auto;right:8px;transform:none;animation:none;width:49%;bottom:8px}.job{min-height:30px}.job button.sq{flex-basis:28px;height:28px;min-height:28px}}
@media (max-height:480px){.it{width:26px;height:26px}}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div><div id="flash"></div>
<div id="hud"></div><div id="toast"></div><div id="bar"></div><div id="panel"></div><div id="fade"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,US=1,T=0;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;US=Math.max(.8,Math.min(1.8,Math.min(W,H)/420));}
addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)],rgb=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a==null?1:a})`;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const X='xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"';
const IC={
gold:`<svg ${X}><circle cx="10" cy="10" r="8" fill="#e8b93a" stroke="#8a6410" stroke-width="1.5"/><circle cx="10" cy="10" r="4.5" fill="none" stroke="#8a6410" stroke-width="1.2"/></svg>`,
food:`<svg ${X}><path d="M2 14c0-5 4-9 8-9s8 4 8 9z" fill="#c98a45" stroke="#6b3f14" stroke-width="1.3"/><path d="M7 8l1 3M10 7v3M13 8l-1 3" stroke="#6b3f14" stroke-width="1.2" fill="none"/></svg>`,
water:`<svg ${X}><path d="M10 2c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z" fill="#4fb3e8" stroke="#1c5f8a" stroke-width="1.3"/></svg>`,
planks:`<svg ${X}><rect x="2" y="4" width="16" height="5" rx="1" fill="#a8743c" stroke="#5a3a17"/><rect x="2" y="11" width="16" height="5" rx="1" fill="#8f5f2c" stroke="#5a3a17"/></svg>`,
bait:`<svg ${X}><path d="M11 3v9a4 4 0 0 1-8 0l2.5 1.5" fill="none" stroke="#dfe6ec" stroke-width="2" stroke-linecap="round"/><path d="M13 12c3-2 4 2 6 0" stroke="#e07a7a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
powder:`<svg ${X}><circle cx="9" cy="12" r="6.5" fill="#2a2a2e" stroke="#000"/><path d="M13 7l3-4" stroke="#b98a4a" stroke-width="1.6"/><circle cx="16.5" cy="2.5" r="1.5" fill="#ffb02e"/></svg>`,
crew:`<svg ${X}><circle cx="10" cy="6" r="4" fill="#e3b58a" stroke="#6b4423"/><path d="M2 19c0-5 3.5-8 8-8s8 3 8 8z" fill="#2f6f8f" stroke="#17384a"/></svg>`,
hull:`<svg ${X}><path d="M1 10h18c-1 5-3 7-5 7H6c-2 0-4-2-5-7z" fill="#7a4d26" stroke="#3a220f"/><path d="M10 9V2l5 6h-5" fill="#f1e7cf" stroke="#8d7b55"/></svg>`,
day:`<svg ${X}><circle cx="10" cy="10" r="4.5" fill="#ffd257"/><g stroke="#ffd257" stroke-width="1.6"><path d="M10 1v3M10 16v3M1 10h3M16 10h3M3.5 3.5l2 2M14.5 14.5l2 2M3.5 16.5l2-2M14.5 5.5l2-2"/></g></svg>`,
map:`<svg ${X}><rect x="2" y="3" width="16" height="14" rx="1" fill="#e2cf9a" stroke="#7a5a22"/><path d="M11 8l4 4M15 8l-4 4" stroke="#c0281c" stroke-width="1.8"/><path d="M4 13c2-4 4 0 6-3" stroke="#7a5a22" fill="none" stroke-dasharray="1.5 1.5"/></svg>`};
IC.quest=`<svg ${X}><path d="M10 2.5v9" stroke="#ffd257" stroke-width="3.6" stroke-linecap="round"/><circle cx="10" cy="16.5" r="2.1" fill="#ffd257"/></svg>`;IC.wheel=`<svg ${X}><circle cx="10" cy="10" r="6" fill="none" stroke="#caa46a" stroke-width="2"/><g stroke="#caa46a" stroke-width="1.6"><path d="M10 1v18M1 10h18M3.6 3.6l12.8 12.8M16.4 3.6L3.6 16.4"/></g><circle cx="10" cy="10" r="2" fill="#e8b93a"/></svg>`;IC.eye=`<svg ${X}><path d="M1 10c3-5 6-7 9-7s6 2 9 7c-3 5-6 7-9 7s-6-2-9-7z" fill="#f1e7cf" stroke="#5a3a17"/><circle cx="10" cy="10" r="3.6" fill="#2f6f8f"/><circle cx="10" cy="10" r="1.6" fill="#111"/></svg>`;IC.hammer=`<svg ${X}><path d="M4 17L12 8" stroke="#a8743c" stroke-width="2.6" stroke-linecap="round"/><path d="M9 3l8 6-2.5 3-8-6z" fill="#9aa2a8" stroke="#4a545a"/></svg>`;IC.arms=`<svg ${X}><path d="M3 17L15 3l2 0 0 2L5 19z" fill="#dfe4e8" stroke="#5a646a"/><path d="M17 17L5 3 3 3l0 2 12 14z" fill="#dfe4e8" stroke="#5a646a"/><path d="M2 14l4 4M18 14l-4 4" stroke="#e8b93a" stroke-width="2"/></svg>`;const IMG={};for(const k in IC){IMG[k]=new Image();IMG[k].src='data:image/svg+xml;utf8,'+encodeURIComponent(IC[k]);}

const SHIPS=[
 {name:'Sloop',cost:300,speed:1.3,hold:120,hull:70,crew:6,masts:1,len:.8,desc:'Fast, small hold'},
 {name:'Brig',cost:500,speed:1,hold:200,hull:100,crew:10,masts:2,len:1,desc:'Balanced'},
 {name:'Galleon',cost:650,speed:.8,hold:320,hull:140,crew:16,masts:3,len:1.22,desc:'Slow, tough, big hold'}];
const GOODS=[{k:'food',n:'Food',p:4},{k:'water',n:'Water',p:2},{k:'planks',n:'Planks',p:8},{k:'bait',n:'Bait',p:3},{k:'powder',n:'Powder',p:10},{k:'arms',n:'Blades',p:12}];
const PORTS=[{n:'Port Haven',pm:1},{n:'Gull Cay',pm:1.2},{n:'Port Verde',pm:.9},{n:"Smuggler's Reach",pm:1.4},{n:'Coral Bay',pm:1.1},{n:'Santa Aurelia',pm:1}];
const LEG=[260,300,280,340,320],DAYLEN=3.2;
let S,M=null,PT=[],G={sx:0,sy:0,ex:0,ey:0,hudH:40,L:200,px:0,py:0,rx:0,ry:0};const Z={z:1,x:0,y:0};
function newGame(){S={mode:'title',gold:1200,food:0,water:0,planks:0,bait:0,powder:0,crew:0,hull:0,ship:null,day:1,leg:0,dist:0,legLen:1,route:'sea',half:false,dayT:0,tod:.12,map:false,sinceEvent:0,lastEv:'',up:{hull:0,sail:0,hold:0},wx:0,wxT:0,vis:null,wind:1,scroll:0,loot:0,cargo:0,quest:null,act:null,focus:null,zT:1,shake:0,bossEv:false,boltT:0,sxk:.4,brk:0,arms:0,fought:false,warned:false,roles:{helm:0,rig:0,look:0,gun:0,cook:0,carp:0,fish:0}};M=null;}
const holdMax=()=>S.ship.hold+S.up.hold*60,hullMax=()=>S.ship.hull+S.up.hull*30,holdUsed=()=>S.food+S.water+S.planks+S.bait+S.powder+S.cargo+S.arms;
function addGood(k,n){const a=Math.max(0,Math.min(n,Math.floor(holdMax()-holdUsed())));S[k]+=a;return a;}

/* ---------- audio ---------- */
let AC,NB;
function sfx(type){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 const t=AC.currentTime,g=AC.createGain();g.connect(AC.destination);
 const osc=(f0,f1,d,ty,v)=>{const o=AC.createOscillator();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);o.start(t);o.stop(t+d);};
 const noise=(fr,ty,d,v)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter();s.buffer=NB;f.type=ty;f.frequency.value=fr;s.connect(f);f.connect(g);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.start(t);s.stop(t+d);};
 if(type==='coin')osc(900,1500,.15,'square',.06);else if(type==='boom')noise(300,'lowpass',.45,.6);else if(type==='splash')noise(1800,'highpass',.3,.15);
 else if(type==='bad')osc(220,80,.35,'sawtooth',.1);else if(type==='good')osc(500,1000,.25,'triangle',.12);else osc(520,480,.05,'sine',.08);}catch(e){}}

/* ---------- UI ---------- */
let handlers={},barH={};
function panel(html,h,cls){const p=$('panel');p.className=cls||'';p.innerHTML=html;p.style.display='block';handlers=h||{};}
let mkt=false,pGold=0,pHull=0;function closePanel(){$('panel').style.display='none';handlers={};mkt=false;}
function fxWatch(){if(!S.ship){pGold=S.gold;pHull=0;return;}const dg=S.gold-pGold;pGold=S.gold;if(dg>=15&&!mkt&&S.mode!=='outfit'&&S.mode!=='pick'){const e=document.createElement('div');e.className='fl';e.innerHTML=IC.gold+' +'+dg;document.body.appendChild(e);setTimeout(()=>e.remove(),1400);}
 if(S.hull<pHull-.5){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');S.shake=Math.max(S.shake,.3);}pHull=S.hull;}
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;sfx();const f=handlers[b.dataset.a];if(f)f(b);});
$('bar').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;sfx();const f=barH[b.dataset.a];if(f)f(b);});
function card(title,text,opts){mkt=false;const h={};let s=`<h2>${title}</h2>`+(text?`<p>${text}</p>`:'')+'<div class="btns">';
 opts.forEach((o,i)=>{h['o'+i]=o[1];s+=`<button data-a="o${i}" ${o[2]?'disabled':''} ${i===0&&opts.length===1?'class="go"':''}>${o[0]}${o[3]?`<small>${o[3]}</small>`:''}</button>`;});panel(s+'</div>',h);}
function setBar(opts){const b=$('bar');barH={};b.innerHTML=opts.map((o,i)=>{barH['b'+i]=o[1];return`<button data-a="b${i}" class="${o[2]||''}">${o[0]}</button>`;}).join('');b.style.display=opts.length?'flex':'none';}
let toastT;function toast(t){if(!t)return;const e=$('toast');e.textContent=t;{const k=/\+\d|Found|Hauled|map/i.test(t)&&(/gold|silver|strongbox/i.test(t)?'gold':/blade/i.test(t)?'arms':/food|coconut/i.test(t)?'food':/water/i.test(t)?'water':/plank/i.test(t)?'planks':/powder/i.test(t)?'powder':/bait/i.test(t)?'bait':/map/i.test(t)?'map':0);if(k){const im=new Image();im.src=ITEM[k];e.prepend(im);}}e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200);}
let hudStr='';
function hud(){const e=$('hud');if(!S.ship||S.mode==='title'||S.mode==='pick'){if(hudStr){e.style.display='none';hudStr='';}return;}
 const it=(k,v,low)=>`<span class="${low?'low':''}">${IC[k]} <b>${v}</b></span>`;
 const s=it('day','Day '+S.day)+it('gold',S.gold)+it('food',Math.ceil(S.food),S.food<4)+it('water',Math.ceil(S.water),S.water<4)+it('planks',S.planks)+it('bait',S.bait)+it('powder',S.powder)+it('arms',S.arms)+it('crew',S.crew,S.crew<=S.ship.crew/3)+it('hull',Math.ceil(S.hull)+'<i><u style="width:'+clamp(S.hull/hullMax()*100,0,100)+'%"></u></i>',S.hull<hullMax()*.3)+(S.map?it('map','Map'):'')+(S.quest?it('quest',S.quest.name+(S.quest.type==='fish'?' '+Math.min(2,S.quest.prog)+'/2':'')):'');
 if(s!==hudStr){hudStr=s;e.innerHTML=s;e.style.display='flex';G.hudH=e.offsetHeight;}}

/* ---------- flow ---------- */
function showTitle(){newGame();setBar([]);panel('<h1>Far Horizon</h1><div class="orn">✦ ⚓ ✦</div><p>Choose a ship. Stock the hold. Reach Santa Aurelia.</p><div class="btns"><button data-a="go" class="go">Set Sail</button></div>',{go:showShips},'title');}
function showShips(){S.mode='pick';let s='<h2>Choose your ship</h2><div class="ships">';
 const bar=(n,v,m)=>`<div class="stat"><span>${n}</span><i><u style="width:${v/m*100}%"></u></i></div>`;
 SHIPS.forEach((sh,i)=>{s+=`<div class="shipc" data-a="s${i}"><canvas width="220" height="170" id="sc${i}"></canvas><b>${sh.name}</b><small>${sh.desc}</small>${bar('Speed',sh.speed,1.3)}${bar('Hold',sh.hold,320)}${bar('Hull',sh.hull,140)}${bar('Crew',sh.crew,16)}<div class="price">${IC.gold} ${sh.cost}</div></div>`;});
 const h={};SHIPS.forEach((sh,i)=>h['s'+i]=()=>{S.ship=sh;S.gold-=sh.cost;S.crew=sh.crew;S.hull=sh.hull;S.roles.helm=S.roles.rig=S.roles.cook=1;S.mode='outfit';showMarket(1,'Stock the hold',true,()=>{if(S.food<1||S.water<1){toast('You need food and water');return false;}if(S.powder<1&&S.arms<1&&!S.warned){S.warned=true;toast('No powder or blades — pirates hunt these waters');return false;}chooseRoute();});});
 panel(s+`</div><p class="st">${IC.gold} ${S.gold} to spend on ship and supplies</p>`,h,'wide');
 SHIPS.forEach((sh,i)=>{const c=$('sc'+i).getContext('2d');drawShip(c,100,150,122*sh.len,sh.masts,0,{});});}
function showMarket(pm,title,auto,done){const bought={};
 const render=()=>{let s=`<h2>${title}</h2>`;const h={};
  GOODS.forEach(g=>{const pr=Math.round(g.p*pm);s+=`<div class="row"><img class="it" src="${ITEM[g.k]}"><span class="nm">${g.n}<small>${pr}g</small></span><button data-a="m_${g.k}" class="sq">−</button><b class="q">${Math.ceil(S[g.k])}</b><button data-a="p_${g.k}" class="sq">+</button></div>`;
   h['p_'+g.k]=()=>{const n=Math.min(5,Math.floor(S.gold/pr),Math.floor(holdMax()-holdUsed()));if(n<1){toast(S.gold<pr?'Not enough gold':'Hold is full');return;}S[g.k]+=n;S.gold-=n*pr;bought[g.k]=(bought[g.k]||0)+n;render();};
   h['m_'+g.k]=()=>{const n=Math.min(5,bought[g.k]||0);if(n<1)return;S[g.k]-=n;S.gold+=n*pr;bought[g.k]-=n;render();};});
  s+=`<p class="st">${IC.gold} ${S.gold} &nbsp;·&nbsp; Hold ${Math.ceil(holdUsed())}/${holdMax()}</p><div class="btns">`+(auto?'<button data-a="auto">Stock for me</button>':'')+'<button data-a="done" class="go">Done</button></div>';
  h.auto=()=>{const per=S.crew/5,want={water:Math.ceil(per*14),food:Math.ceil(per*14),planks:6,bait:6,powder:5,arms:Math.ceil(S.crew*.7)};
   for(const k of['water','food','planks','bait','powder','arms']){const pr=Math.round(GOODS.find(g=>g.k===k).p*pm);const n=Math.max(0,Math.min(want[k]-S[k],Math.floor(S.gold/pr),Math.floor(holdMax()-holdUsed())));S[k]+=n;S.gold-=n*pr;bought[k]=(bought[k]||0)+n;}render();};
  h.done=()=>{if(done()!==false&&S.mode==='port')closePanel();};panel(s,h);mkt=true;};render();}
function chooseRoute(){S.mode='event';S.vis=null;setBar([]);const to=PORTS[S.leg+1].n;
 card('Course to '+to,'',[['Open sea',()=>startLeg('sea'),false,'shorter · storms & pirates'],['Along the coast',()=>startLeg('coast'),false,'longer · fish & islands']]);}
function startLeg(r){S.route=r;S.dist=0;S.legLen=LEG[S.leg]*(r==='sea'?.85:1.15);S.dayT=0;S.sinceEvent=0;resume();}
function sailBar(){setBar([['Rations: '+(S.half?'Half':'Full'),()=>{S.half=!S.half;sailBar();}],['Stop & fish',()=>{if(S.bait<1){toast('No bait');return;}passDays(1);if(S.mode!=='end')startFish();},''],['Crew',openShip]]);}
function resume(){if(S.mode==='end')return;S.mode='sail';S.vis=null;S.wxT=0;M=null;S.focus=null;S.act=null;S.bossEv=false;closePanel();sailBar();}
function done(msg){toast(msg);resume();}
function dmg(n){S.hull=Math.max(0,S.hull-n);if(S.hull<=0)gameOver('Your ship broke apart and sank.');}
function loseCrew(msg){S.crew--;trimRoles();toast(msg);sfx('bad');if(S.crew<=0)gameOver('The last of your crew is gone.');}
function consume(m){const u=S.crew/5*(S.half?.5:1)*(m||1);S.food=Math.max(0,S.food-u*(1-.15*S.roles.cook));S.water=Math.max(0,S.water-u);
 if(S.water<=0)loseCrew('No water — a sailor dies');else if(S.food<=0){if(Math.random()<.6)loseCrew('Starving — a sailor dies');}
 else if(S.half&&Math.random()<.07)loseCrew('Weak from half rations — a sailor dies');}
function passDays(n){for(let i=0;i<n&&S.mode!=='end';i++){S.day++;consume();}}
function dps(){return 42*S.ship.speed*(1+.15*S.up.sail)*(S.crew<S.ship.crew/2?.75:1)*S.wind*(1+.08*S.roles.helm+.04*S.roles.rig);}
function nextDay(){S.day++;consume();if(S.mode==='end')return;if(S.roles.carp&&S.hull<hullMax())S.hull=Math.min(hullMax(),S.hull+3*S.roles.carp);for(let i=0;i<S.roles.fish;i++)if(S.bait>0&&Math.random()<.55){addGood('food',2);if(Math.random()<.25)S.bait--;}S.wind=R(.8,1.2);S.sinceEvent++;if(S.sinceEvent>=3||Math.random()<.4)rollEvent();}
function arrive(){S.leg++;S.dist=0;setBar([]);sfx('good');let qm='';const q=S.quest;
 if(q){const ok=q.type==='delivery'||(q.type==='fish'&&q.prog>=2)||(q.type==='rescue'&&q.done);if(ok){S.gold+=q.reward;qm=`<br>Quest complete — ${q.name}: +${q.reward} gold`;}else qm=`<br>Quest failed — ${q.name}`;S.cargo=0;S.quest=null;}
 S.vis='port';S.focus='isle';S.zT=1.7;
 if(S.leg>=5){S.mode='end';const sc=S.gold+S.crew*50+Math.ceil(S.hull)+Math.max(0,(45-S.day)*20);
  card('Santa Aurelia!',`You made port on day ${S.day} with ${S.crew} crew and ${S.gold} gold.${qm}<br>Score: <b>${sc}</b>`,[['Sail again',showTitle]]);return;}
 S.mode='event';card(PORTS[S.leg].n,'Day '+S.day+'. Land at last.'+qm,[['Go ashore',()=>startPort(S.leg)]]);}
function gameOver(why){S.mode='end';M=null;setBar([]);sfx('bad');card('Lost at sea',`${why}<br>Day ${S.day}, ${Math.round((S.leg+Math.min(1,S.dist/S.legLen))/5*100)}% of the way.`,[['Try again',showTitle]]);}

const ZF={bigwhale:['prop',1.2],dolphins:['ship',1.5],reef:['prop',1.6],spout:['enemy',1.4],fog:['ship',1.3],mob:['ship',1.3],grumble:['ship',2.1],storm:['ship',1.5],pirates:['enemy',1.9],fish:['prop',1.8],wreck:['prop',2.1],island:['isle',1.8],calm:['ship',1.6],sick:['ship',2.1],merchant:['enemy',1.9],bottle:['prop',2.6],leak:['ship',2],castaway:['prop',2.3],ghost:['enemy',1.9],whale:['prop',1.7],kraken:['ship',1.3],port:['isle',1.7]};
const QUESTS=[null,
 {type:'delivery',name:'Deliver rum',ask:'Carry my rum casks to the next port? They take 20 hold.',reward:150},
 {type:'bounty',name:'Sink the Red Mary',ask:'The Red Mary hunts the next stretch of sea. Sink her and the guild pays well.',reward:260},
 {type:'fish',name:'Land 2 big fish',ask:'The governor wants deep-water fish for his table. Land 2 of the big green ones before the next port.',reward:150},
 {type:'rescue',name:'Find the lost brother',ask:'My brother went overboard on the route ahead. Find him and bring him to port.',reward:220}];
const isNight=()=>S.tod>.68&&S.tod<.95;
function rollEvent(){const q=S.quest;
 if(!S.fought&&S.leg>=2&&S.dist>S.legLen*.5&&S.lastEv!=='pirates')return doEvent('pirates');
 if(q&&q.type==='bounty'&&!q.fled&&S.dist>S.legLen*.45)return doEvent('pirates');
 if(q&&q.type==='rescue'&&!q.seen&&S.dist>S.legLen*.4){q.seen=true;return doEvent('castaway');}
 if(S.map&&S.dist>S.legLen*.35)return doEvent('island');
 const col=S.route==='sea'?1:2,tb=EV.filter(e=>e[0]!==S.lastEv&&e[col]>0&&(e[0]!=='ghost'||isNight())&&(e[0]!=='grumble'||S.half)),wt=e=>e[col]*(S.roles.look&&['wreck','island','bottle','castaway'].includes(e[0])?1.6:1);let r=Math.random()*tb.reduce((a,e)=>a+wt(e),0);
 for(const e of tb){r-=wt(e);if(r<=0)return doEvent(e[0]);}}
function act(to,d,cb){closePanel();S.mode='act';S.act={t:0,d,to,cb};G.rx=G.sx+G.L*.45;G.ry=G.sy;S.focus='row';S.zT=2;}
function doEvent(k){S.mode='event';S.vis=k;S.lastEv=k;setBar([]);const zf=ZF[k];S.focus=zf[0];S.zT=zf[1];
 const on=()=>done('');
 if(k==='storm'){S.wxT=1;card('Storm ahead','Black clouds are closing fast.',[['Ride it out',startStorm,false,'steer through the rocks'],['Reef sails & wait',()=>{passDays(2);dmg(RI(3,8));done('Lost 2 days');},false,'lose 2 days']]);}
 else if(k==='pirates'){const q=S.quest,boss=!!(q&&q.type==='bounty'&&!q.fled);S.bossEv=boss;if(boss)q.fled=true;S.fought=true;
  const tr=Math.max(40,Math.round(S.gold*.25)),ch=clamp(.42*S.ship.speed*(1+.15*S.up.sail)+.12*S.roles.look,.2,.9);
  const pay=()=>{S.gold=Math.max(0,S.gold-tr);done('Paid '+tr+' gold');};
  card(boss?'The Red Mary!':'Pirates!',boss?'Blood-red sails. This is the ship you were paid to sink.':'A black flag on the horizon.',[S.powder<1?['Grapple & board',()=>startBoard(RI(90,200),boss?8:6),false,S.arms<1?'no powder, no blades · desperate':'no powder · blades only']:['Fight',startBattle,false,S.powder+' powder · '+S.arms+' blades'],['Run',()=>{if(Math.random()<ch)done('You outran them');else{dmg(10);if(S.mode==='end')return;toast('They caught you!');S.powder>0?startBattle():pay();}},false,Math.round(ch*100)+'% chance'],['Pay tribute',pay,false,tr+' gold']]);}
 else if(k==='fish')card('Fish running','Gulls are diving on a big school.',[['Drop lines',startFish,S.bait<1,S.bait<1?'no bait':S.bait+' bait'],['Sail on',on]]);
 else if(k==='wreck')card('Wreckage','A broken hull drifts ahead, half under.',[['Salvage the deck',()=>act('prop',2.8,()=>{const r=Math.random();if(r<.25)done('+'+addGood('planks',6)+' planks');else if(r<.5){const g=RI(40,120);S.gold+=g;sfx('coin');done('A strongbox! +'+g+' gold');}else if(r<.75)done('+'+addGood('food',8)+' food');else if(r<.9)done('+'+addGood('powder',3)+' powder');else{dmg(8);sfx('bad');done('The wreck rolls and gouges your hull');}}),false,'safe, small find'],['Dive the hold',startDive,false,'risky, big find'],['Sail on',on]]);
 else if(k==='island')card('Land ho!',S.map?'It matches your treasure map!':'An uncharted island.',[['Go ashore',()=>act('isle',2.4,startIsland),false,'costs a day'],['Sail on',on]]);
 else if(k==='calm')card('Becalmed','The sails hang limp. Not a breath of wind.',[['Man the oars',()=>{consume();done('Extra rations used');},false,'extra rations'],['Wait for wind',()=>{passDays(2);done('Lost 2 days');},false,'lose 2 days']]);
 else if(k==='sick')card('Fever aboard','Half the watch is laid out on deck.',[['Rest a day',()=>{passDays(1);done('The crew recovers');},false,'lose 1 day'],['Press on',()=>{if(Math.random()<.5)loseCrew('The fever takes a sailor');resume();},false,'risk a sailor']]);
 else if(k==='merchant'){const buy=(g,n,c)=>()=>{if(S.gold<c){toast('Not enough gold');return;}const a=addGood(g,n);if(!a){toast('Hold is full');return;}S.gold-=c;toast('+'+a+' '+g);mer();};
  const mer=()=>card('Merchant ship','They offer to trade.',[['Food ×10',buy('food',10,50),false,'50 gold'],['Water ×10',buy('water',10,30),false,'30 gold'],['Planks ×5',buy('planks',5,50),false,'50 gold'],['Sail on',on]]);mer();}
 else if(k==='bottle')card('Something in the water','A corked bottle bobs in the swell.',[['Fish it out',()=>act('prop',2.3,()=>{S.vis=null;if(!S.map){S.map=true;sfx('good');card('A treasure map!','An island is marked on the route ahead.',[['Chart the course',on]]);}else{S.gold+=30;sfx('coin');done('A few coins inside: +30 gold');}})],['Sail on',on]]);
 else if(k==='leak')card('Sprung a leak','Water is spraying through the planks.',[['Patch it',()=>{S.planks-=3;done('Leak patched');},S.planks<3,'3 planks'],['Bail and hope',()=>{dmg(10);done('Hull damaged');},false,'hull damage']]);
 else if(k==='castaway')card('Castaway','A man on a raft waves wildly. A fin circles him.',[['Rescue him',()=>act('prop',2.8,()=>{const q=S.quest;S.vis=null;if(q&&q.type==='rescue'&&!q.done){q.done=true;sfx('good');done('It is the lost brother! Get him to port');}else if(S.crew<S.ship.crew){S.crew++;done('He joins your crew');}else{S.gold+=40;sfx('coin');done('He pays 40 gold for passage');}})],['Sail on',on]]);
 else if(k==='ghost'){S.wxT=.25;card('Ghost ship','A pale ship drifts in the dark with no one at the helm.',[['Board her',()=>act('enemy',3,()=>{const r=Math.random();if(r<.45){const g=RI(150,300);S.gold+=g;sfx('coin');done('Her hold is full of old silver: +'+g+' gold');}else if(r<.7&&!S.map){S.map=true;sfx('good');done('A chart on the captain\'s table — a treasure map!');}else if(r<.7){S.gold+=80;sfx('coin');done('+80 gold from the captain\'s chest');}else{loseCrew('Something drags a sailor below. You flee!');resume();}}),false,'who knows'],['Steer clear',on]]);}
 else if(k==='whale')card('Whales!','A pod is feeding. Where whales feed, big fish follow.',[['Follow the pod',()=>{passDays(1);if(S.mode!=='end')startFish(true);},S.bait<1,S.bait<1?'no bait':'lose 1 day · big fish'],['Sail on',on]]);
 else if(k==='bigwhale')card('A great whale','It breaches off the bow, bigger than the ship. The swell rocks you to the rails.',[['Harpoons!',startHunt,false,'meat and oil · it fights back'],['Give it room',()=>done('It sounds and is gone')]]);
 else if(k==='dolphins')card('Dolphins!','A pod races the bow, leaping clear of the water.',[['Follow them',()=>{const r=Math.random();if(r<.5){S.dist+=40;done('They lead you into a fast current: 40 leagues gained');}else if(r<.8){toast('They lead you to a great shoal');doEvent('fish');}else{dmg(8);done('They skip over a reef you cannot. Hull scraped');}},false,'sailors say they bring luck'],['Hold course',on]]);
 else if(k==='reef')card('Coral shoals','Pale water and breakers ahead. A channel runs through.',[['Thread the channel',()=>startStorm(true),false,'steer through · saves 40 leagues'],['Go around',()=>{passDays(1);done('Lost a day');},false,'lose 1 day']]);
 else if(k==='spout'){S.wxT=.55;const ch=clamp(.35*S.ship.speed+.15*S.roles.rig+.1*S.roles.helm,.15,.9);card('Waterspout','A twisting column of water is bearing down on you.',[['Run before it',()=>{if(Math.random()<ch)done('You slip past its edge');else{S.shake=.5;dmg(RI(10,16));done('It rakes the deck. Hull and rigging torn');}},false,Math.round(ch*100)+'% · riggers help'],['Strike sails & wait',()=>{passDays(1);dmg(3);done('It passes. Lost a day');},false,'lose 1 day']]);}
 else if(k==='fog'){S.wxT=.2;card('Fog bank','You can barely see the bowsprit.',[['Creep ahead',()=>{if(S.roles.look)done('The lookout calls the rocks in time');else if(Math.random()<.55)done('You feel your way through');else{dmg(12);done('Rocks! The hull grinds over them');}},false,S.roles.look?'lookout posted · safe':'no lookout · risky'],['Anchor till it lifts',()=>{passDays(1);done('Lost a day');},false,'lose 1 day']]);}
 else if(k==='mob')card('Man overboard!','A wave takes a sailor off the deck.',[['Throw a line!',startMob]]);
 else if(k==='grumble')card('The crew is grumbling','Half rations and long days. Men mutter at the rail.',[['Share out coin',()=>{S.gold-=60;done('Spirits lift');},S.gold<60,'60 gold'],['Full rations again',()=>{S.half=false;done('Back on full rations');}],['Crack the whip',()=>{if(Math.random()<.4)loseCrew('A sailor jumps ship in the night');resume();},false,'risk a sailor']]);
 else if(k==='kraken'){S.wxT=.5;card('Something beneath','A vast shadow rises under the keel.',[['Fight it off',startKraken,false,'chop the arms'],['Throw meat overboard',()=>{S.food=Math.max(0,S.food-15);done('It takes the bait and sinks away');},S.food<15,'15 food']]);}
}

/* ---------- gauges ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function gauge(c,x,y,w,h,k,c1,c2){c.save();c.fillStyle='rgba(10,6,3,.78)';rr(c,x-3,y-3,w+6,h+6,(h+6)/2);c.fill();c.strokeStyle='#d2a455';c.lineWidth=1.5;c.stroke();if(k>0.01){const fw=Math.max(h,w*k),g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);c.fillStyle=g;rr(c,x,y,fw,h,h/2);c.fill();c.fillStyle='rgba(255,255,255,.32)';rr(c,x+2,y+1,fw-4,h*.35,h*.17);c.fill();}c.restore();}
function flashFx(x,y,r,col){PT.push({x,y,vx:0,vy:0,g:0,r,l:0,m:.35,col,fl:1});}
/* ---------- particles ---------- */
function puff(x,y,n,col,sp,g,r,life){for(let i=0;i<n;i++){const a=R(0,6.28),v=R(.2,1)*sp;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(g?sp*.5:0),g:g||0,r:R(.5,1)*r,l:0,m:R(.6,1)*life,col});}}
function updPT(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.l>p.m)PT.splice(i,1);}}
