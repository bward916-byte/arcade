function sickOne(why){syncMen();const pool=S.men.filter(fit);if(!pool.length){const m=S.men[RI(0,S.men.length-1)];if(m)killMan(m,'dies — '+why);return;}layUp(pool[RI(0,pool.length-1)],'sick',RI(4,6),why);}
function crewDay(){const cook=E('cook')>0;for(const m of S.men.slice()){if(m.st==='hurt'){if(--m.d<=0){m.st='ok';toast(m.n+' is back on his feet');}}
  else if(m.st==='sick'){if(Math.random()<.09*(S.food<=0||S.water<=0?2.5:1)*(cook?.6:1)){killMan(m,'dies of fever');if(S.mode==='end')return;}else if(--m.d<=0){m.st='ok';toast(m.n+' has recovered');}}
  else if(m.post){m.xp=m.xp||{};m.xp[m.post]=(m.xp[m.post]||0)+1;if(m.xp[m.post]===6&&!knows(m,m.post)&&!m.sk2){m.sk2=m.post;const t=m.n+' has learned the '+roleName(m.post).toLowerCase()+' ★';toast(t);logIt(t);}}}}
function consume(m){const u=S.crew*.35*(S.half?.5:1)*(m||1);S.food=Math.max(0,S.food-u*(1-.15*Math.min(2,E('cook'))));S.water=Math.max(0,S.water-u);S.sea=(S.sea||0)+1;{const rot=S.food*.02*(S.sea>5?2:1)*(E('cook')>0?.5:1);S.food-=rot;S.rot=(S.rot||0)+rot;if(S.rot>=4){toast(Math.floor(S.rot)+' food spoiled in the hold');S.rot-=Math.floor(S.rot);}}S.halfDays=S.half?(S.halfDays||0)+1:0;
 const sk=S.men.find(x=>x.st==='sick');
 if(S.water<=0){if(sk&&Math.random()<.6)killMan(sk,'dies of thirst');else sickOne('no water');}
 else if(S.food<=0){if(Math.random()<.6){if(sk&&Math.random()<.5)killMan(sk,'starves');else sickOne('no food');}}
 else if(S.half&&Math.random()<.14)sickOne('weak on half rations');
 else if(S.sea>9&&Math.random()<.12*(E('cook')>0?.5:1))sickOne('scurvy, too long at sea');
 if(S.mode!=='end')crewDay();}
function passDays(n){for(let i=0;i<n&&S.mode!=='end';i++){S.day++;consume();}}
function dps(){return 42*S.ship.speed*(1+.15*S.up.sail)*(S.men.filter(fit).length<S.ship.crew/2?.75:1)*S.wind*(1+.08*E('helm')+.04*E('rig'));}
function nextDay(){if(S.demo){S.day++;return;}S.day++;consume();if(S.mode==='end')return;saveGame();if(S.leg===4&&!S.blk&&S.dist>S.legLen*.55){S.blk=true;doEvent('blockade');return;}if(S.roles.carp&&S.hull<hullMax())S.hull=Math.min(hullMax(),S.hull+3*E('carp'));for(let i=0;i<S.roles.fish;i++)if(S.bait>0&&Math.random()<.55){addGood('food',2);if(Math.random()<.25)S.bait--;}S.wind=R(.8,1.2);S.sinceEvent++;if(S.sinceEvent>=3||Math.random()<.4)rollEvent();}
function arrive(){S.leg++;S.dist=0;S.sea=0;if((S.halfDays||0)>=3&&S.crew>2){const p=S.men.filter(fit),m=p[RI(0,p.length-1)];if(m){S.men.splice(S.men.indexOf(m),1);S.crew--;syncRoles();const t=m.n+' deserts in port — sick of half rations';setTimeout(()=>toast(t),1500);logIt(t);}}S.halfDays=0;setBar([]);sfx('good');let qm='';const q=S.quest;
 if(q){const ok=q.type==='delivery'||(q.type==='fish'&&q.prog>=2)||(q.type==='rescue'&&q.done);if(ok){S.gold+=q.reward;qm=`<br>Quest complete — ${q.name}: +${q.reward} gold`;logIt('Quest done: '+q.name);}else qm=`<br>Quest failed — ${q.name}`;S.cargo=0;S.quest=null;}
 S.vis='port';S.focus='isle';S.zT=1.7;logIt('Made port at '+portAt(S.leg).n);
 if(S.leg>=5){let cg=0;for(const g of TG){cg+=S[g.k]*tSell(g,portAt(5));S[g.k]=0;}S.gold+=cg;if(cg)qm+=`<br>Cargo sold on the quay: +${cg} gold`;
  S.mode='end';const sc=S.gold+S.crew*50+Math.ceil(S.hull)+Math.max(0,(45-S.day)*20);LS.del('fh_save2');
  const b=(LS.get('fh_best')||[]).concat([{sc,ship:S.ship.name,day:S.day}]).sort((x,y)=>y.sc-x.sc).slice(0,5);LS.set('fh_best',b);const best=b[0].sc===sc;
  endCard('Santa Aurelia!',`You made port on day ${S.day} with ${S.crew} crew and ${S.gold} gold.${qm}<br>Score: <b>${sc}</b>${best?' — your best voyage yet!':' · best '+b[0].sc}`);return;}

/* ---------- gauges ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function gauge(c,x,y,w,h,k,c1,c2){c.save();c.fillStyle='rgba(10,6,3,.78)';rr(c,x-3,y-3,w+6,h+6,(h+6)/2);c.fill();c.strokeStyle='#d2a455';c.lineWidth=1.5;c.stroke();if(k>0.01){const fw=Math.max(h,w*k),g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);c.fillStyle=g;rr(c,x,y,fw,h,h/2);c.fill();c.fillStyle='rgba(255,255,255,.32)';rr(c,x+2,y+1,fw-4,h*.35,h*.17);c.fill();}c.restore();}
function flashFx(x,y,r,col){PT.push({x,y,vx:0,vy:0,g:0,r,l:0,m:.35,col,fl:1});}
/* ---------- particles ---------- */
function puff(x,y,n,col,sp,g,r,life){for(let i=0;i<n;i++){const a=R(0,6.28),v=R(.2,1)*sp;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(g?sp*.5:0),g:g||0,r:R(.5,1)*r,l:0,m:R(.6,1)*life,col});}}
function updPT(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.l>p.m)PT.splice(i,1);}}
function drawPT(c){for(const p of PT){const a=1-p.l/p.m;c.globalAlpha=a;if(p.fl){const rad=p.r*(1.3-a*.3),g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);g.addColorStop(0,'rgba(255,250,220,1)');g.addColorStop(.4,p.col);g.addColorStop(1,'rgba(255,120,20,0)');c.globalCompositeOperation='lighter';c.fillStyle=g;c.fillRect(p.x-rad,p.y-rad,rad*2,rad*2);c.globalCompositeOperation='source-over';continue;}c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r*(1+(1-a)*.7),0,6.28);c.fill();}c.globalAlpha=1;}

/* ---------- ship art ---------- */
function drawShip(c,x,y,L,masts,rot,o){c.save();c.translate(x,y);c.rotate(rot);if(o.flip)c.scale(-1,1);const h=L*.2;
 const sail=(X,Y,w,hh)=>{const b=w*.14*(o.wind==null?1:o.wind);const g=c.createLinearGradient(X-w/2,0,X+w/2+b,0);g.addColorStop(0,litCol(o.sailB||'#b9a985'));g.addColorStop(.7,litCol(o.sailA||'#f4ead2'));g.addColorStop(1,litCol(o.sailB||'#cdbd97'));c.fillStyle=g;
  c.beginPath();c.moveTo(X-w/2,Y);c.lineTo(X+w/2,Y);c.quadraticCurveTo(X+w/2+b,Y+hh/2,X+w/2,Y+hh);c.quadraticCurveTo(X,Y+hh-hh*.12,X-w/2,Y+hh);c.quadraticCurveTo(X-w/2+b,Y+hh/2,X-w/2,Y);c.fill();{const g2=c.createLinearGradient(0,Y,0,Y+hh);g2.addColorStop(0,'rgba(255,255,255,.2)');g2.addColorStop(.5,'rgba(0,0,0,0)');g2.addColorStop(1,'rgba(40,25,5,.3)');c.fillStyle=g2;c.fill();}
  c.strokeStyle='rgba(60,40,10,.18)';c.lineWidth=1;for(let i=1;i<4;i++){const xx=X-w/2+w*i/4;c.beginPath();c.moveTo(xx,Y);c.quadraticCurveTo(xx+b,Y+hh/2,xx,Y+hh-hh*.06);c.stroke();}
