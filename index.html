<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1230">
<title>Blythe Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cab:#1b1230;      /* cabinet plum */
  --cab2:#2a1c48;
  --paper:#f3e7c9;    /* label stock */
  --ink:#2b1a12;
  --plastic:#4a4556;
  --plastic2:#67617a;
  --accent:#7fd7ff;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cab);color:var(--paper);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.pixel{font-family:"Silkscreen","Courier New",monospace}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%,#3a2a66 0%,transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px),
    var(--cab)}

/* ===== marquee (the screen) ===== */
#screenWrap{flex:0 0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 0}
#bezel{position:relative;border-radius:18px;padding:8px;
  background:linear-gradient(180deg,#5c5670,#2f2a3c);
  box-shadow:0 8px 0 #120a22,0 14px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
#screen{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;
  box-shadow:inset 0 0 40px rgba(0,0,0,.9)}
#glass{position:absolute;inset:8px;border-radius:10px;pointer-events:none;
  background:
    linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 35%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#screen.flicker{animation:flick .18s steps(2) 1}
@keyframes flick{0%{filter:brightness(2.4) contrast(1.6)}100%{filter:none}}

/* ===== title block ===== */
#info{flex:0 0 auto;padding:16px 18px 6px}
#count{font-size:12px;color:#b9a9dc;letter-spacing:.02em}
#title{font-size:clamp(20px,6.2vw,30px);line-height:1.1;color:#fff;margin-top:6px;
  text-shadow:0 0 14px var(--accent),0 2px 0 #000;word-break:break-word}
#tag{margin-top:8px;font-size:15px;line-height:1.35;color:#ddd3f0;max-width:34em}
#meta{margin-top:10px;font-size:13px;color:#a496c7;display:flex;gap:14px;flex-wrap:wrap}
#meta span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;
  background:var(--accent);border-radius:1px;vertical-align:baseline}

/* ===== play button ===== */
#play{margin:14px 18px 0;display:block;width:calc(100% - 36px);border:0;cursor:pointer;
  padding:16px;border-radius:12px;font-size:18px;color:var(--ink);
  background:linear-gradient(180deg,#fff2d0,#e9d49a);
  box-shadow:0 6px 0 #9a7b3a,0 10px 18px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
#play:active{transform:translateY(5px);box-shadow:0 1px 0 #9a7b3a}
#play:focus-visible,.cart:focus-visible{outline:3px solid #fff;outline-offset:3px}
#play small{display:block;font:13px/1.2 system-ui,sans-serif;margin-top:4px;color:#6b4d1e}

/* ===== cartridge rack ===== */
#rack{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 0 calc(28px + var(--safe-b))}
#rack::before{content:"";position:absolute;left:0;right:0;bottom:calc(14px + var(--safe-b));height:14px;
  background:linear-gradient(180deg,#3d3450,#241b36);border-top:2px solid #6a5f85}
#rail{display:flex;gap:12px;padding:0 calc(50vw - 62px);overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
#rail::-webkit-scrollbar{display:none}
.cart{flex:0 0 124px;height:150px;margin-bottom:18px;scroll-snap-align:center;position:relative;border:0;cursor:pointer;
  background:linear-gradient(180deg,var(--plastic2),var(--plastic));border-radius:10px 10px 6px 6px;
  padding:10px 10px 0;transform:translateY(18px);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.cart::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:12px;
  background:repeating-linear-gradient(90deg,#2b2636 0 4px,#3d3750 4px 8px);border-radius:0 0 4px 4px}
.cart.sel{transform:translateY(0)}
.cart .label{height:96px;border-radius:5px;background:var(--paper);overflow:hidden;position:relative;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.cart canvas{display:block;width:100%;height:100%}
.cart .name{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:9px;line-height:1.2;
  color:var(--ink);background:linear-gradient(0deg,var(--paper) 70%,transparent);text-align:left}
.cart .stripe{position:absolute;top:0;left:0;right:0;height:6px;background:var(--c)}

#status{position:absolute;left:18px;top:8px;font-size:11px;color:#8d7fb0}
@media (prefers-reduced-motion:reduce){.cart,#play{transition:none}#screen.flicker{animation:none}}
@media (min-width:700px) and (min-height:560px){#app{max-width:520px;margin:0 auto;border-left:1px solid #2f2447;border-right:1px solid #2f2447}}
/* phone held sideways: screen on the left, the rest on the right */
@media (orientation:landscape) and (max-height:560px){
  #app{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);grid-template-rows:auto 1fr auto;
    column-gap:14px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  #screenWrap{grid-column:1;grid-row:1/3;padding:10px 0 0;align-self:start}
  #play{grid-column:1;grid-row:3;margin:10px 0 calc(10px + var(--safe-b));width:100%;padding:12px}
  #info{grid-column:2;grid-row:1;padding:12px 4px 0}
  #title{font-size:clamp(16px,3.2vw,24px)}#tag{font-size:13px}#meta{font-size:12px;margin-top:6px}
  #rack{grid-column:2;grid-row:2/4;padding:8px 0 calc(10px + var(--safe-b))}
  #rail{padding:0 calc(27vw - 46px)}
  .cart{flex:0 0 92px;height:112px;margin-bottom:8px;padding:7px 7px 0;transform:translateY(10px)}
  .cart .label{height:72px}.cart .name{font-size:7px;padding:3px 4px}
  #rack::before{bottom:calc(10px + var(--safe-b))}#status{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="screenWrap"><div id="bezel"><canvas id="screen" width="640" height="360"></canvas><div id="glass"></div></div></div>
  <div id="info">
    <div id="count" class="pixel"></div>
    <div id="title" class="pixel"></div>
    <div id="tag"></div>
    <div id="meta"></div>
  </div>
  <button id="play" class="pixel">Play<small></small></button>
  <div id="rack"><div id="status"></div><div id="rail" role="listbox" aria-label="Games"></div></div>
</div>
<script>
const OWNER='bward916-byte';
const GAMES=[
 {repo:'farlight',title:'FARLIGHT',tag:'Crew a survey ship, land on strange worlds and trade with the docktown. Starflight, on your phone.',genre:'Space exploration',orient:'Landscape',c:'#7fd7ff',art:'space'},
 {repo:'hecktown-road',title:'HECKTOWN ROAD',tag:'A Phillips Pet adventure down a very strange road.',genre:'Adventure',orient:'Landscape',c:'#ffb347',art:'road'},
 {repo:'highline',title:'HIGHLINE',tag:'Climb a cinematic mountain ridge, one ledge at a time.',genre:'Mountain adventure',orient:'Landscape',c:'#c9e6ff',art:'mountain'},
 {repo:'last-stand-long-road',title:'LAST STAND: THE LONG ROAD',tag:'An endless cross-country journey through fourteen biomes of zombies and rain.',genre:'Run and gun',orient:'Landscape',c:'#9ee37d',art:'zombie'},
 {repo:'wayfarer',title:'WAYFARER',tag:'Kite wolves around Havenbrook and hold the moat. Touch-first top-down action RPG.',genre:'Action RPG',orient:'Portrait or landscape',c:'#ffd166',art:'town'},
 {repo:'spoil',title:'SPOIL',tag:'A top-down burglary. Pick it, cut it, or dig under it.',genre:'Stealth',orient:'Landscape',c:'#e3a1ff',art:'heist'},
 {repo:'eastward',title:'EASTWARD',tag:'Keep heading east. A 2D adventure platformer with a long horizon.',genre:'Platformer',orient:'Landscape',c:'#ff9e7a',art:'hills'},
 {repo:'ascent',title:'ASCENT',tag:'From cradle to colossus. Grow up, throw rocks, climb higher.',genre:'Climber',orient:'Landscape',c:'#ffe08a',art:'climb'},
 {repo:'dungeon-gauntlet',title:'DUNGEON GAUNTLET',tag:'Torchlit corridors, traps and loot. Get out alive.',genre:'Dungeon crawl',orient:'Landscape',c:'#ff7a7a',art:'dungeon'},
];
const url=r=>`https://${OWNER}.github.io/${r}/`;

/* ---------- procedural label + marquee art ---------- */
function rng(seed){let s=seed>>>0||1;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296);}
function hash(str){let h=2166136261;for(const ch of str)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0;}
const ART={
 space(g,w,h,t,r){g.fillStyle='#050816';g.fillRect(0,0,w,h);
  for(let i=0;i<120;i++){const x=(r()*w+t*(4+r()*10))%w,y=r()*h;g.fillStyle=r()<.2?'#9fd':'#fff';g.fillRect(x,y,r()<.9?1.5:3,1.5);}
  const px=w*.72,py=h*.5,R=h*.26;const grad=g.createRadialGradient(px-R*.4,py-R*.4,R*.1,px,py,R);
  grad.addColorStop(0,'#ffd6a0');grad.addColorStop(1,'#7a2f1e');g.fillStyle=grad;g.beginPath();g.arc(px,py,R,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=3;g.beginPath();g.ellipse(px,py,R*1.7,R*.35,-.3,0,7);g.stroke();
  g.fillStyle='#cfe';g.save();g.translate(w*.25+Math.sin(t*1.3)*6,h*.55+Math.cos(t)*4);g.beginPath();g.moveTo(-14,8);g.lineTo(16,0);g.lineTo(-14,-8);g.lineTo(-8,0);g.fill();
  g.fillStyle='#7fd7ff';g.fillRect(-22-((t*60)%12),-2,8,4);g.restore();},
 road(g,w,h,t,r){g.fillStyle='#16112a';g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++)g.fillStyle='#fff',g.fillRect(r()*w,r()*h*.45,1.5,1.5);
  g.fillStyle='#2a2340';for(let i=0;i<9;i++){const x=i*w/8;g.fillRect(x,h*.42-r()*h*.15,w/8+2,h);}
  g.fillStyle='#0b0a12';g.beginPath();g.moveTo(w*.5,h*.45);g.lineTo(w*1.1,h);g.lineTo(-w*.1,h);g.fill();
  g.fillStyle='#ffb347';for(let i=0;i<6;i++){const k=((i/6)+t*.35)%1;const y=h*.45+k*k*h*.55;g.fillRect(w*.5-2,y,4,10*k+2);}
  const hx=w*.5+Math.sin(t*.8)*w*.05,hy=h*.62;g.fillStyle='#e8c26a';g.beginPath();g.moveTo(hx,hy);g.lineTo(hx-w*.3,h);g.lineTo(hx+w*.3,h);g.fillStyle='rgba(255,220,120,.18)';g.fill();
  g.fillStyle='#e0a040';g.fillRect(hx-16,hy-14,32,22);g.fillStyle='#fff';g.fillRect(hx-10,hy-8,5,5);g.fillRect(hx+5,hy-8,5,5);
  g.fillStyle='#fff';g.fillRect(hx-14,hy+8,8,6);g.fillRect(hx+6,hy+8,8,6);},
 mountain(g,w,h,t,r){const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#1a2b52');sky.addColorStop(1,'#d3a06a');g.fillStyle=sky;g.fillRect(0,0,w,h);
  for(let L=0;L<4;L++){g.fillStyle=['#7f8db0','#4b5a80','#2d3555','#161a2c'][L];g.beginPath();g.moveTo(0,h);let x=0;while(x<=w){g.lineTo(x,h*(.35+L*.14)+Math.sin(x*.02+L)*h*.12+Math.sin(x*.07+L*3)*h*.03);x+=8;}g.lineTo(w,h);g.fill();}
  g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.moveTo(w*.42,h*.16);g.lineTo(w*.47,h*.26);g.lineTo(w*.37,h*.26);g.fill();
  const cx=(t*30)%(w+80)-40;g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(cx,h*.2,40,10,0,0,7);g.fill();
  g.fillStyle='#ffe';g.fillRect(w*.3+Math.sin(t*2)*2,h*.5,4,8);},
 zombie(g,w,h,t,r){g.fillStyle='#2c3a2a';g.fillRect(0,0,w,h);g.fillStyle='#4f6f3a';for(let i=0;i<40;i++)g.fillRect(i*w/40,h*.45-r()*h*.2,w/40-2,h*.3);
  g.fillStyle='#3a3230';g.fillRect(0,h*.7,w,h*.3);g.fillStyle='#d9c68a';for(let i=0;i<8;i++)g.fillRect(((i*w/8)+t*40)%w,h*.85,w/16,3);
  g.strokeStyle='rgba(180,200,230,.35)';for(let i=0;i<70;i++){const x=(r()*w+t*90)%w,y=(r()*h+t*300)%h;g.beginPath();g.moveTo(x,y);g.lineTo(x-2,y+10);g.stroke();}
  g.fillStyle='#8ab04a';for(let i=0;i<4;i++){const x=w*.55+i*34+Math.sin(t*3+i)*3,y=h*.55;g.fillRect(x,y,12,26);g.fillRect(x-6,y+6,24,4);g.fillRect(x+2,y-8,8,8);}
  g.fillStyle='#e6d2a0';g.fillRect(w*.2,h*.55,10,26);g.fillRect(w*.2+9,h*.6,14,4);g.fillStyle='#fff';g.fillRect(w*.2+24+((t*400)%60),h*.61,6,2);},
 town(g,w,h,t,r){g.fillStyle='#3d6a3a';g.fillRect(0,0,w,h);g.fillStyle='#2a5c8a';g.fillRect(w*.12,h*.12,w*.76,h*.76);
  g.fillStyle='#6a8f45';g.fillRect(w*.22,h*.22,w*.56,h*.56);g.fillStyle='#8c8c8c';g.fillRect(w*.22,h*.22,w*.56,6);g.fillRect(w*.22,h*.78-6,w*.56,6);g.fillRect(w*.22,h*.22,6,h*.56);g.fillRect(w*.78-6,h*.22,6,h*.56);
  g.fillStyle='#9a6a3a';g.fillRect(w*.47,h*.06,w*.06,h*.16);
  for(let i=0;i<5;i++){g.fillStyle='#b8552e';g.fillRect(w*.28+i*w*.1,h*.3,w*.07,h*.1);g.fillStyle='#d2a06a';g.fillRect(w*.28+i*w*.1,h*.4,w*.07,h*.08);}
  g.fillStyle='#ffd166';g.fillRect(w*.5+Math.sin(t*2)*20,h*.6+Math.cos(t*1.5)*10,8,8);
  g.fillStyle='#777';for(let i=0;i<3;i++){const a=t*.7+i*2.1;g.fillRect(w*.5+Math.cos(a)*w*.22,h*.5+Math.sin(a)*h*.22,7,7);}
  g.fillStyle='#e8c15a';for(let i=0;i<3;i++)g.fillRect(w*.15+((i*60+t*15)%(w*.7)),h*.17,5,3);},
 heist(g,w,h,t,r){g.fillStyle='#0c0d14';g.fillRect(0,0,w,h);g.strokeStyle='#3b3f58';g.lineWidth=3;
  g.strokeRect(w*.1,h*.15,w*.8,h*.7);g.strokeRect(w*.1,h*.15,w*.35,h*.35);g.strokeRect(w*.55,h*.5,w*.35,h*.35);
  const cx=w*.3+Math.sin(t*.6)*w*.1,cy=h*.65,a=t*.9;g.fillStyle='rgba(255,240,180,.16)';g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,h*.6,a-.4,a+.4);g.fill();
  g.fillStyle='#e3a1ff';g.fillRect(cx-5,cy-5,10,10);g.fillStyle='#c9a23a';g.fillRect(w*.7,h*.28,22,16);g.fillStyle='#fff';g.fillRect(w*.7+9,h*.28+6,4,4);
  g.fillStyle='#8a2f2f';g.fillRect(w*.75+Math.sin(t*1.7)*30,h*.65,8,8);},
 hills(g,w,h,t,r){const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#ffb27a');sky.addColorStop(1,'#ffe5b8');g.fillStyle=sky;g.fillRect(0,0,w,h);
  g.fillStyle='#ff9e50';g.beginPath();g.arc(w*.8,h*.35,h*.14,0,7);g.fill();
  for(let L=0;L<3;L++){g.fillStyle=['#c96a3f','#8a3f2c','#4a2020'][L];g.beginPath();g.moveTo(0,h);let x=0;const off=t*(10+L*14);while(x<=w){g.lineTo(x,h*(.55+L*.13)+Math.sin((x+off)*.015+L)*h*.08);x+=8;}g.lineTo(w,h);g.fill();}
  g.fillStyle='#4a2020';g.fillRect(w*.2,h*.62,60,6);g.fillRect(w*.42,h*.5,50,6);g.fillStyle='#fff3d6';const jy=Math.abs(Math.sin(t*4))*18;g.fillRect(w*.25,h*.62-20-jy,10,20);},
 climb(g,w,h,t,r){g.fillStyle='#8fb6c9';g.fillRect(0,0,w,h);g.fillStyle='#5d4a3a';
  for(let i=0;i<12;i++){const y=h-(i+1)*h*.09+Math.sin(i*1.3)*4;g.fillRect(w*.35+Math.sin(i)*w*.12,y,w*.3,h*.05);}
  const cy=h*.55-Math.sin(t*.8)*h*.15;g.fillStyle='#ffe08a';g.fillRect(w*.5-5,cy,10,18);g.fillStyle='#e6b25a';g.fillRect(w*.5-3,cy-8,7,8);
  g.fillStyle='#777';g.beginPath();g.arc(w*.5+50,cy+40-((t*120)%140),4,0,7);g.fill();
  g.fillStyle='#e9e4d8';for(let i=0;i<4;i++)g.fillRect(((i*80)+t*10)%w,h*.15+i*10,50,6);},
 dungeon(g,w,h,t,r){g.fillStyle='#110c0a';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=18)for(let x=(y/18%2)*20;x<w;x+=40){g.fillStyle=`hsl(20,20%,${10+r()*8}%)`;g.fillRect(x,y,38,16);}
  const fl=.85+Math.sin(t*13)*.08+Math.sin(t*7)*.07;const tx=w*.5,ty=h*.5;const grd=g.createRadialGradient(tx,ty,4,tx,ty,h*.55*fl);
  grd.addColorStop(0,'rgba(255,170,70,.55)');grd.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grd;g.fillRect(0,0,w,h);
  g.fillStyle='#ffb040';g.fillRect(tx-4,ty-10,8,10);g.fillStyle='#5a3a20';g.fillRect(tx-2,ty,4,20);
  g.fillStyle='#ff7a7a';g.fillRect(w*.25+Math.sin(t*3)*5,h*.6,12,16);g.fillStyle='#d4d4d4';g.fillRect(w*.75,h*.6-Math.abs(Math.sin(t*2))*10,10,10);},
 generic(g,w,h,t,r){g.fillStyle='#22263a';g.fillRect(0,0,w,h);for(let i=0;i<30;i++){g.fillStyle=`hsl(${r()*360},60%,60%)`;const x=r()*w,y=(r()*h+t*30*(1+r()))%h;g.fillRect(x,y,12,12);}}
};
function draw(cv,game,t,scale){const g=cv.getContext('2d');const w=cv.width/scale,h=cv.height/scale;g.save();g.scale(scale,scale);(ART[game.art]||ART.generic)(g,w,h,t,rng(hash(game.repo)));g.restore();}

/* ---------- state ---------- */
let list=GAMES.slice(),sel=0,t0=performance.now();
const $=id=>document.getElementById(id);
const screen=$('screen'),rail=$('rail');
function fmtDate(iso){if(!iso)return null;const d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}

function buildRack(){rail.innerHTML='';list.forEach((gm,i)=>{
  const b=document.createElement('button');b.className='cart pixel';b.setAttribute('role','option');b.style.setProperty('--c',gm.c);
  b.innerHTML=`<div class="label"><canvas width="248" height="192"></canvas><div class="stripe"></div><div class="name">${gm.title}</div></div>`;
  b.addEventListener('click',()=>select(i,true));rail.appendChild(b);
  const cv=b.querySelector('canvas');draw(cv,gm,gm.tOff=hash(gm.repo)%100,2);});}
function select(i,scroll){sel=(i+list.length)%list.length;const gm=list[sel];
  document.documentElement.style.setProperty('--accent',gm.c);
  $('count').textContent=`GAME ${sel+1} OF ${list.length}`;$('title').textContent=gm.title;$('tag').textContent=gm.tag;
  const m=[gm.genre,gm.orient];const d=fmtDate(gm.pushed);if(d)m.push('Updated '+d);
  $('meta').innerHTML=m.map(s=>`<span>${s}</span>`).join('');
  $('play').querySelector('small').textContent=url(gm.repo).replace('https://','');
  [...rail.children].forEach((c,k)=>{c.classList.toggle('sel',k===sel);c.setAttribute('aria-selected',k===sel);});
  screen.classList.remove('flicker');void screen.offsetWidth;screen.classList.add('flicker');
  if(scroll)rail.children[sel].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
function launch(){const gm=list[sel];$('play').textContent='Loading '+gm.title+'…';location.href=url(gm.repo);}
$('play').addEventListener('click',launch);
screen.addEventListener('click',launch);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')select(sel+1,true);else if(e.key==='ArrowLeft')select(sel-1,true);else if(e.key==='Enter'&&document.activeElement.id!=='play')launch();});
let snapT;rail.addEventListener('scroll',()=>{clearTimeout(snapT);snapT=setTimeout(()=>{const mid=rail.scrollLeft+rail.clientWidth/2;let best=0,bd=1e9;[...rail.children].forEach((c,k)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;best=k;}});if(best!==sel)select(best,false);},80);});

function frame(now){const t=(now-t0)/1000;draw(screen,list[sel],t+ (list[sel].tOff||0),2);requestAnimationFrame(frame);}
buildRack();select(0,false);requestAnimationFrame(frame);

/* ---------- live discovery: any new Pages repo shows up automatically ---------- */
$('status').textContent='Checking for new games…';
fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=pushed`).then(r=>r.ok?r.json():Promise.reject(r.status)).then(repos=>{
  const known=new Map(list.map(g=>[g.repo,g]));let added=0;
  repos.filter(r=>r.has_pages&&!r.fork).forEach(r=>{
    if(known.has(r.name)){known.get(r.name).pushed=r.pushed_at;}
    else{list.push({repo:r.name,title:r.name.replace(/-/g,' ').toUpperCase(),tag:r.description||'A new game. No notes yet.',genre:'New',orient:'',c:'#ffffff',art:'generic',pushed:r.pushed_at});added++;}});
  list.sort((a,b)=>(b.pushed||'').localeCompare(a.pushed||''));
  const cur=list[sel].repo;buildRack();select(list.findIndex(g=>g.repo===cur),false);
  $('status').textContent=added?`${added} new game${added>1?'s':''} found`:'';
}).catch(()=>{$('status').textContent='';});
</script>
</body>
</html>
