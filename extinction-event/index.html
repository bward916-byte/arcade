   if(GV.mode==='live'&&!G.demo){const ay=GY,ar2=(x,sx,d)=>{cx.fillStyle='rgba(0,0,0,.4)';cx.beginPath();cx.arc(x,ay,20*U,0,TAU);cx.fill();cx.fillStyle='#fff';cx.font='700 '+Math.round(18*U)+'px system-ui,sans-serif';cx.fillText(sx,x,ay+6*U);btns.push({x:x-24*U,y:ay-24*U,w:48*U,h:48*U,fn:()=>gvHop(d)})};ar2(26*U,'‹',-1);ar2((LAND_BAR?W-78*U:W)-26*U,'›',1)}}
  if(G.demo)btns.push({x:0,y:0,w:W,h:H,fn:()=>{state='title'}})}
 const cxm=W/2;
 if(state==='title'){cx.textAlign='center';cx.fillStyle='#fff';cx.font='800 '+Math.round(Math.min(40*U,W*.082))+'px system-ui,sans-serif';cx.fillText('EXTINCTION EVENT',cxm,H*.16);
  cx.fillStyle='rgba(255,255,255,.7)';cx.font='500 '+Math.round(14*U)+'px system-ui,sans-serif';cx.fillText('8.1 billion people. Leave none.',cxm,H*.16+26*U);
  button('START',cxm,H*.8,170*U,48*U,()=>{newGame(false);state='play'},true);button('WATCH DEMO',cxm,H*.8+58*U,170*U,40*U,()=>{newGame(true);state='play'})}
 if((state==='won'||state==='lost')&&G.endT>1.5){const a=clamp((G.endT-1.5)/1.2,0,1);cx.globalAlpha=a;cx.fillStyle='rgba(0,0,0,.45)';cx.fillRect(0,0,W,H);cx.textAlign='center';
  cx.fillStyle=state==='won'?'#ff5a3c':'#9fe0a8';cx.font='800 '+Math.round(Math.min(38*U,W*.095))+'px system-ui,sans-serif';cx.fillText(state==='won'?'EXTINCTION':'HUMANITY ENDURES',cxm,H*.4);
  cx.fillStyle='#fff';cx.font='500 '+Math.round(14*U)+'px system-ui,sans-serif';cx.fillText(state==='won'?G.strikes+' strikes · '+Math.round(G.t*3)+' days':fmt(G.pop)+' survivors rebuild',cxm,H*.4+28*U);
  if(state==='won')cx.fillText(G.strikes<=18?'★★★':G.strikes<=30?'★★☆':'★☆☆',cxm,H*.4+52*U);
  button('PLAY AGAIN',cxm,H*.62,170*U,46*U,()=>{newGame(false);state='play'},true);button('MENU',cxm,H*.62+56*U,170*U,38*U,()=>{state='title'});cx.globalAlpha=1}
}
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;if(state!=='load'){update(dt);if(!(GV.on&&GV.in>=1))drawWorld();if(GV.on)gvDraw();drawHUD()}requestAnimationFrame(frame)}

/* ---------- input ---------- */
const drag={on:false,x:0,y:0,sx:0,sy:0,t:0,moved:false};
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
const ptrs=new Map();let pinch=0;
function down(e){audioInit();const[x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);if(ptrs.size>=2){pinch=0;drag.moved=true;return}drag.on=true;drag.x=drag.sx=x;drag.y=drag.sy=y;drag.moved=false;if(e.preventDefault)e.preventDefault()}
function move(e){if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,pos(e));if(ptrs.size>=2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch>0&&G&&state==='play'&&!G.demo&&!G.dir&&!G.whip){const k=d/pinch;if(GV.on){GV.pz=(GV.pz||1)*k;if(GV.pz<.8){GV.pz=1;gvClose()}}else{const nz=G.uz*k;if(nz>9.2){const c=viewCity();G.uz=8;if(c)gvEnter(c);else toast('NO CITY HERE')}else G.uz=clamp(nz,1,8)}}pinch=d;return}
 if(!drag.on)return;const[x,y]=pos(e);if(Math.hypot(x-drag.sx,y-drag.sy)>10*U)drag.moved=true;if(drag.moved&&state!=='load'&&!(G.demo&&state==='play')&&!GV.on&&!G.whip&&!G.dir){G.rot-=(x-drag.x)/(R0*cam.z);if(G.uz>1.02)G.uy-=(y-drag.y)/(R0*cam.z)}drag.x=x;drag.y=y}
function up(e){ptrs.delete(e.pointerId);pinch=0;if(ptrs.size>0){drag.on=false;return}if(!drag.on)return;drag.on=false;if(drag.moved&&GV.on&&GV.mode==='live'&&state==='play'&&!G.demo){const dx=drag.x-drag.sx;if(Math.abs(dx)>50*U)gvHop(dx<0?1:-1);return}if(drag.moved||state==='load')return;tap(drag.sx,drag.sy)}
function centerCity(lat,lon,maxd){const v=gvec(lat,lon);let best=null,bd=maxd;for(const c of cities){const d=gcd(v,c.v);if(d<bd){bd=d;best=c}}return best}
function viewCity(){const r2=cam.fx*cam.fx+cam.fy*cam.fy;if(r2>=.98)return null;return centerCity(Math.asin(-cam.fy),G.rot+Math.atan2(cam.fx,Math.sqrt(1-r2)),.22)}
function tap(x,y){if(G&&G.dir&&!G.demo&&state==='play'){dirEnd();return}
 for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return}}
 if(state!=='play'||G.demo||G.whip)return;if(GV.on){if(GV.mode==='live')fire(G.sel,GV.c.lat,GV.c.lon);return}
 const nx=(x-cam.ox)/(R0*cam.z),ny=(y-cam.oy)/(R0*cam.z),r2=nx*nx+ny*ny;
 if(G.look){if(r2>=.98)return;const c=centerCity(Math.asin(-ny),G.rot+Math.atan2(nx,Math.sqrt(1-r2)),.2);const la=Math.asin(-ny),lo=G.rot+Math.atan2(nx,Math.sqrt(1-r2));if(c)gvEnter(c);else if(!isLand(la,lo))gvEnter(mkSite(la,lo));else toast('TAP A CITY OR THE SEA');return}
 if(WEAPONS[G.sel].id==='flare'){fire(G.sel,0,0);return}
 if(r2>=.98){toast('TAP THE PLANET');return}const z=Math.sqrt(1-r2);fire(G.sel,Math.asin(-ny),G.rot+Math.atan2(nx,z))}
cv.addEventListener('pointerdown',down);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=0;drag.on=false});cv.addEventListener('wheel',e=>{if(G&&state==='play'&&!G.demo&&!G.dir&&!G.whip){if(GV.on){if(e.deltaY>0)gvClose()}else{const nz=G.uz*Math.exp(-e.deltaY*.0015);if(nz>9.2){const c=viewCity();G.uz=8;if(c)gvEnter(c)}else G.uz=clamp(nz,1,8)}}if(e.preventDefault)e.preventDefault()},{passive:false});

/* ---------- audio ---------- */
let AC=null,NB=null;
function audioInit(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function noise(vol,dur,f0,f1){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=NB;s.loop=true;fl.type='lowpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur)}
function tone(vol,dur,f0,f1,type){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur)}
function snd(k){if(!AC)return;try{
 if(k==='boom'){noise(.8,1.8,1800,60);tone(.7,1.4,110,28)}else if(k==='mega'){noise(1,4.5,2400,40);tone(.9,3.5,90,20);tone(.4,2.5,45,18,'triangle')}
 else if(k==='small'){noise(.35,.7,1400,90);tone(.3,.5,140,45)}else if(k==='whoosh')noise(.18,1.6,300,2600);else if(k==='rumble'){noise(.5,2.2,90,260);tone(.4,2,38,60)}
 else if(k==='charge')tone(.22,2,120,900,'sawtooth');else if(k==='flare'){noise(.6,2.6,6000,300);tone(.3,1.6,700,90,'sawtooth')}
 else if(k==='wave'){noise(.55,3.2,180,1600);tone(.25,2.6,48,34)}else if(k==='whip')noise(.12,.35,400,3000);else if(k==='quake'){noise(.4,1.1,70,220);tone(.35,.9,52,30)}else if(k==='pop')tone(.08,.25,520,140,'triangle');else if(k==='tick')tone(.08,.06,700,500,'square');else if(k==='no')tone(.12,.18,160,110,'square')}catch(e){}}

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);
 U=clamp(Math.min(W,H)/390,.8,1.5);LAND_BAR=W>H*1.25;const top=74*U,bot=LAND_BAR?26*U:112*U,aw=LAND_BAR?W-78*U:W;R0=Math.max(40,Math.min(aw*.46,(H-top-bot)*.48));GX=aw/2;GY=top+(H-top-bot)/2;
 const nb=clamp(Math.round(R0*2*DPR*.72/8)*8,240,400);if(nb!==B||!img){B=nb;bcv.width=bcv.height=B;img=bctx.createImageData(B,B);px=new Uint32Array(img.data.buffer)}}
function boot(){resize();window.addEventListener('resize',resize);
 for(let i=0;i<240;i++)stars.push({x:vr(),y:vr(),d:.3+vr(),s:vr()<.1?2:1,a:.3+vr()*.7,f:.5+vr()*3,p:vr()*6,c:vr()<.15?'#ffd9b0':vr()<.3?'#b9d2ff':'#fff'});
 cx.fillStyle='#000';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.font='600 16px system-ui,sans-serif';cx.textAlign='center';cx.fillText('Building Earth…',W/2,H/2);
 setTimeout(()=>{buildWorld();newGame(false);state='title';requestAnimationFrame(frame)},40)}
window.__g={mkSite,GV,gvOpen,gvTrigger,gvDraw,gvEnter,gvClose,get G(){return G},get state(){return state},set state(v){state=v},update,drawWorld,drawHUD,fire,botPick,newGame,tap,get cities(){return cities},WEAPONS,estimate,get cam(){return cam}};
