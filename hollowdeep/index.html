<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hollowdeep</title>
<style>
html,body{margin:0;height:100%;background:#05050a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#sa{position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style></head><body><canvas id="c"></canvas><div id="sa"></div>
<script>
(()=>{'use strict';
// ================= constants / world =================
const TS=32, WW=36, TOP=14, BH=96, NBIO=6;
const HEART=TOP+NBIO*BH, WH=HEART+14;
const T={AIR:0,ROCK:1,HARD:2,ORE:3,SEAL:4,WALL:5,WATER:6,LAVA:7,HEAL:8};
const tiles=new Uint8Array(WW*WH), bgw=new Uint8Array(WW*WH);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rgb=(c,m=1,a=1)=>`rgba(${clamp(c[0]*m|0,0,255)},${clamp(c[1]*m|0,0,255)},${clamp(c[2]*m|0,0,255)},${a})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function tget(x,y){ if(x<0||x>=WW||y<0||y>=WH) return T.WALL; return tiles[y*WW+x]; }
const isSolid=t=>t===1||t===2||t===3||t===4||t===5||t===8;
const isFluid=t=>t===6||t===7;
let SEED=7;
function h2(x,y){ let n=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(SEED,974711))|0; n=Math.imul(n^(n>>>13),1274126177); n^=n>>>16; return (n>>>0)/4294967296; }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
const fbm=(x,y)=>vnoise(x,y)*.6+vnoise(x*2.1+7.3,y*2.1+3.1)*.3+vnoise(x*4.3+1.7,y*4.3+9.2)*.1;

const BIO=[
 {num:'I',  name:'LIMESTONE HOLLOWS',rock:[122,102,80], acc:[255,197,107],acc2:[255,232,180],bg:[30,21,14], cave:.60,hard:.08,ore:.024,dig:.10,col:1.0,amb:.80,mote:.12,hz:55},
 {num:'II', name:'FUNGAL GROTTO',    rock:[62,88,78],   acc:[95,245,210], acc2:[231,107,255],bg:[6,24,22],  cave:.535,hard:.10,ore:.026,dig:.16,col:1.3,amb:.74,mote:.4,hz:49},
 {num:'III',name:'CRYSTAL VAULTS',   rock:[78,68,118],  acc:[190,145,255],acc2:[107,208,255],bg:[15,10,34], cave:.57,hard:.20,ore:.05, dig:.25,col:1.6,amb:.74,mote:.35,hz:62},
 {num:'IV', name:'SUNKEN SEA',       rock:[48,80,104],  acc:[79,214,255], acc2:[140,255,220],bg:[4,17,32],  cave:.525,hard:.18,ore:.03, dig:.34,col:1.9,amb:.72,mote:.28,hz:41},
 {num:'V',  name:'MAGMA FORGE',      rock:[76,52,48],   acc:[255,122,46], acc2:[255,214,96], bg:[34,9,4],   cave:.565,hard:.28,ore:.036,dig:.45,col:2.2,amb:.70,mote:.5,hz:37},
 {num:'VI', name:'THE ABYSS',        rock:[40,38,70],   acc:[124,255,176],acc2:[255,95,168], bg:[4,3,13],   cave:.53,hard:.32,ore:.04, dig:.56,col:2.5,amb:.80,mote:.45,hz:31},
];
const bioY=b=>TOP+b*BH;
const biomeAt=y=>clamp(Math.floor((y-TOP)/BH),0,NBIO-1);
const RELIC=[
 {k:'bomb',  name:'BLAST CHARGE',   sub:'Craters through rock'},
 {k:'lance', name:'BORE LANCE',     sub:'Drills a shaft straight down'},
 {k:'hammer',name:'QUAKE HAMMER',   sub:'Shatters everything below'},
 {k:'core',  name:'OVERCHARGE CORE',sub:'More energy · bigger blasts'},
 {k:'void',  name:'VOID SEED',      sub:'Devours the rock around it'},
 {k:'titan', name:'TITAN BORE',     sub:'Lance cuts wider and deeper'},
];
const COST={bomb:1,lance:2,hammer:3,void:5};
const relics=[];

function generate(seed){
  SEED=seed; relics.length=0;
  for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){
    let t=T.ROCK, bg=1;
    if(x===0||x===WW-1||y===0||y>=WH-1) t=T.WALL;
    else if(y<TOP){ if(y>=3&&y<=6&&Math.abs(x-WW/2)<=6-(y===3?2:0)) t=T.AIR; }
    else if(y>=HEART){ if(y>HEART&&y<=HEART+9&&x>=3&&x<=WW-4){t=T.AIR;bg=0;} else if(y>HEART) t=T.WALL; }
    else{
      const b=biomeAt(y), B=BIO[b], ly=y-bioY(b);
      if(ly===0) t=T.ROCK;
      else if(ly<=5) t=T.AIR;
      else if(ly<=7) t=T.SEAL;
      else{
        const n=fbm(x*.085,y*.085);
        if(n>B.cave&&x>1&&x<WW-2&&ly>10&&ly<BH-3){
          t=T.AIR; bg=0;
          if(b===3&&vnoise(x*.045+50,y*.045)>.5) t=T.WATER;
          if(b===4&&vnoise(x*.05+90,y*.05)>.66) t=T.LAVA;
        }else{
          const r=h2(x,y+9999);
          t=r<B.ore?T.ORE:r<B.ore+.007?T.HEAL:(vnoise(x*.21+100,y*.21)>.8-B.hard*.62?T.HARD:T.ROCK);
        }
      }
    }
    tiles[y*WW+x]=t; bgw[y*WW+x]=bg;
  }
  for(let b=0;b<NBIO;b++) relics.push({b,x:Math.floor(WW/2+(h2(b,777)-.5)*18)+.5,y:bioY(b)+6,taken:false});
}

// ================= canvas / textures =================
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const lcv=mkc(8,8), lctx=lcv.getContext('2d');
let W=0,H=0,DPR=1,ppt=30; const SA={t:0,r:0,b:0,l:0};
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  lcv.width=Math.ceil(W/3); lcv.height=Math.ceil(H/3);
  ppt=clamp(Math.min(W/13,H/11),18,48);
  try{ const s=getComputedStyle(document.getElementById('sa')); SA.t=parseFloat(s.paddingTop)||0;SA.r=parseFloat(s.paddingRight)||0;SA.b=parseFloat(s.paddingBottom)||0;SA.l=parseFloat(s.paddingLeft)||0; }catch(e){}
}
const TEX=[]; let LSPR; const GSPR={};
function buildTextures(){
  let s=12345; const rnd=()=>{s=(Math.imul(s,1664525)+1013904223)|0;return (s>>>0)/4294967296;};
  for(const B of BIO){
    const base=(mul,n,deco)=>{ const c=mkc(TS,TS), g=c.getContext('2d'); g.fillStyle=rgb(B.rock,mul); g.fillRect(0,0,TS,TS);
      for(let i=0;i<n;i++){ g.fillStyle=rnd()<.55?`rgba(0,0,0,${.05+rnd()*.15})`:`rgba(255,255,255,${.03+rnd()*.08})`; g.fillRect(rnd()*TS|0,rnd()*TS|0,2+rnd()*8|0,2+rnd()*5|0); }
      g.strokeStyle='rgba(0,0,0,.28)'; g.lineWidth=1; g.beginPath(); let x=rnd()*TS,y=rnd()*TS; g.moveTo(x,y); for(let i=0;i<3;i++){x+=(rnd()-.5)*18;y+=(rnd()-.5)*18;g.lineTo(x,y);} g.stroke();
      if(deco) deco(g); return c; };
    const gem=(g,col,core)=>{ for(let i=0;i<3;i++){ const x=6+rnd()*20,y=6+rnd()*20,r=3+rnd()*4; g.fillStyle=col; g.beginPath(); g.moveTo(x,y-r);g.lineTo(x+r*.7,y);g.lineTo(x,y+r);g.lineTo(x-r*.7,y);g.closePath();g.fill(); g.fillStyle=core; g.fillRect(x-1,y-1,2,2);} };
    const set={rock:[base(1,26),base(1,26),base(1,26)],
      hard:[0,1].map(()=>base(.58,16,g=>{ g.strokeStyle='rgba(255,255,255,.16)'; g.beginPath(); for(let i=0;i<3;i++){ const x=rnd()*TS,y=rnd()*TS; g.moveTo(x,y); g.lineTo(x+8+rnd()*10,y+rnd()*6-3); g.lineTo(x+4+rnd()*8,y+8+rnd()*6);} g.stroke(); g.fillStyle='rgba(255,255,255,.3)'; for(let i=0;i<5;i++) g.fillRect(rnd()*TS|0,rnd()*TS|0,1,1); })),
      ore:[0,1].map(()=>base(.86,14,g=>gem(g,'#8ff4ff','#fff'))),
      heal:[base(.86,14,g=>{ for(let i=0;i<3;i++){ g.fillStyle='#ff6b8a'; g.beginPath(); g.arc(7+rnd()*18,7+rnd()*18,3+rnd()*2.5,0,7); g.fill(); } })],
      seal:[(()=>{ const c=mkc(TS,TS),g=c.getContext('2d'); g.fillStyle='#161821'; g.fillRect(0,0,TS,TS); g.fillStyle='#232633'; g.fillRect(2,2,TS-4,TS-4); g.strokeStyle='#0b0c12'; g.lineWidth=2; g.strokeRect(5,5,TS-10,TS-10); g.beginPath(); g.moveTo(16,8);g.lineTo(24,16);g.lineTo(16,24);g.lineTo(8,16);g.closePath(); g.stroke(); return c; })()],
      wall:[base(.2,14)], back:[base(.34,16),base(.3,16)]};
    TEX.push(set);
  }
  LSPR=mkc(128,128); { const g=LSPR.getContext('2d'), gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.82)'); gr.addColorStop(.7,'rgba(255,255,255,.3)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); }
}
function gspr(c){ const k=(Math.min(255,c[0]+4)>>3<<3)+','+(Math.min(255,c[1]+4)>>3<<3)+','+(Math.min(255,c[2]+4)>>3<<3); let s=GSPR[k]; if(!s){ s=GSPR[k]=mkc(64,64); const g=s.getContext('2d'), gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,`rgba(${k},1)`); gr.addColorStop(.4,`rgba(${k},.35)`); gr.addColorStop(1,`rgba(${k},0)`); g.fillStyle=gr; g.fillRect(0,0,64,64);} return s; }

// ================= audio =================
let AC=null,master=null,NBUF=null,droneO=null,droneO2=null,rumG=null,muted=false;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  try{ AC=new C(); master=AC.createGain(); master.gain.value=muted?0:.7; master.connect(AC.destination);
    NBUF=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=NBUF.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; const dg=AC.createGain(); dg.gain.value=.07; lp.connect(dg); dg.connect(master);
    droneO=AC.createOscillator(); droneO.type='sawtooth'; droneO.frequency.value=55; droneO.connect(lp); droneO.start();
    droneO2=AC.createOscillator(); droneO2.type='sine'; droneO2.frequency.value=82.6; droneO2.connect(lp); droneO2.start();
    const rs=AC.createBufferSource(); rs.buffer=NBUF; rs.loop=true; const rf=AC.createBiquadFilter(); rf.type='lowpass'; rf.frequency.value=110; rumG=AC.createGain(); rumG.gain.value=0; rs.connect(rf); rf.connect(rumG); rumG.connect(master); rs.start();
  }catch(e){ AC=null; }
}
function sN(d,f0,f1,v){ if(!AC||muted) return; try{ const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=NBUF; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d); const g=AC.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()); s.stop(t+d+.05);}catch(e){} }
function sT(type,f0,f1,d,v,dl=0){ if(!AC||muted) return; try{ const t=AC.currentTime+dl, o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d); const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);}catch(e){} }
const SFX={
  tick:b=>sN(.05,1800-b*180,500,.16), brk:()=>{sN(.12,900,120,.3);},
  clank:()=>{sT('square',900,700,.06,.08);sT('triangle',1400,1200,.08,.06);},
  boom:()=>{sN(.7,1400,50,.9);sT('sine',130,32,.6,.7);},
  lance:()=>{sT('sawtooth',1400,90,.45,.22);sN(.5,4000,300,.4);},
  quake:()=>{sT('sine',90,24,.9,.9);sN(.9,700,40,.8);},
  voidA:()=>{sT('sine',60,420,1.5,.3);sT('sawtooth',40,200,1.5,.1);}, voidB:()=>{sN(1,2400,40,1);sT('sine',200,22,1,.8);},
  ore:()=>{sT('triangle',880,880,.08,.14);sT('triangle',1320,1320,.12,.14,.07);},
  heal:()=>{sT('sine',520,780,.25,.18);},
  relic:()=>{[392,494,587,784,988].forEach((f,i)=>sT('triangle',f,f,.5,.16,i*.09));},
  hurt:()=>sT('square',220,90,.15,.12), deny:()=>sT('square',160,120,.1,.08), jump:()=>sT('sine',300,460,.08,.05),
  card:()=>{sT('sine',110,110,1.6,.25);sT('sine',165,165,1.6,.16,.05);}, win:()=>{[262,330,392,523,659,784].forEach((f,i)=>sT('sine',f,f,2.4,.16,i*.18));}
};

// ================= state =================
let state='title', time=0, gt=0, runT=0, best=null;
try{ const b=localStorage.getItem('hollowdeep.best'); if(b) best=+b; }catch(e){}
const P={x:0,y:0,vx:0,vy:0,face:1,onG:false,hp:100,energy:0,maxE:12,over:false,titan:false,weapons:[],sel:0,dx:-1,dy:-1,dp:0,swing:0,walk:0,coy:0,inv:0,cool:0,clank:0,tick:0,inW:false,inL:false,regen:0};
const PW=.56, PH=.86;
const cam={x:WW/2,y:6,z:1,zt:1}, shake={x:0,y:0,m:0};
const cine={bars:0,barsT:0,lock:0,card:null,banner:null,slow:0,white:0,flash:0};
let collapseY=-99, collOn=false, collGrace=0, cpB=-1, cp={x:WW/2+.5,y:6.99};
let hint=null, deadT=0, winT=0, flEnergy=0;
const stats={tiles:0,deaths:0};
const parts=[], projs=[], beams=[], quakes=[], voids=[], flashes=[], floaters=[], motes=[];
let lights=[], glows=[], stars=[]; const rings=[], fauna=[]; let faT=0;
const setHint=(s,d=4)=>{ if(!hint||hint.s!==s) hint={s,t:d,d}; };

function startGame(){
  generate((Date.now()&0xffff)||1);
  Object.assign(P,{x:WW/2+.5,y:6.99,vx:0,vy:0,face:1,hp:100,energy:0,maxE:12,over:false,titan:false,weapons:[],sel:0,dx:-1,dp:0,inv:0,cool:0,regen:0});
  rings.length=fauna.length=parts.length=projs.length=beams.length=quakes.length=voids.length=flashes.length=floaters.length=0;
  collapseY=-99; collOn=false; collGrace=0; cpB=-1; cp={x:WW/2+.5,y:6.99}; stats.tiles=0; stats.deaths=0; runT=0;
  state='play'; cam.x=P.x; cam.y=P.y-2; cam.z=.62; cam.zt=1; cine.barsT=1; cine.bars=1; cine.lock=1.4; cine.card=null; cine.banner=null; cine.white=0;
  cine.introT=3.2; setHint(touchUI?'HOLD THE STICK DOWN TO DIG':'HOLD ↓ TO DIG  ·  ← → MOVE  ·  ↑ JUMP',7);
}
function addEnergy(n){ P.energy=Math.min(P.maxE,P.energy+n); }
function hurt(d,src){ if(P.inv>0&&src!=='cave') return; P.hp-=d; if(src!=='cave'&&src!=='lava'){P.inv=.6;} if(P.hurtS===undefined||P.hurtS<=0){SFX.hurt();P.hurtS=.3;} shake.m=Math.max(shake.m,.15);
  if(P.hp<=0&&state==='play'){ state='dead'; deadT=0; stats.deaths++; SFX.boom(); burst(P.x,P.y-.4,20,[220,80,60]); } }
function respawn(){ P.x=cp.x; P.y=cp.y; P.vx=P.vy=0; P.hp=100; P.energy=Math.max(P.energy,Math.min(P.maxE,5)); P.inv=1.5; projs.length=voids.length=beams.length=quakes.length=0;
  if(collOn) collapseY=P.y-30; collGrace=5; state='play'; cam.x=P.x; cam.y=P.y; }

// ================= particles / fx =================
function part(o){ if(parts.length<700) parts.push(o); }
function debris(x,y,b,n,col){ const c=col||BIO[b].rock; for(let i=0;i<n;i++) part({k:0,x:x+(Math.random()-.5)*.8,y:y+(Math.random()-.5)*.8,vx:(Math.random()-.5)*9,vy:-Math.random()*8-1,l:.5+Math.random()*.7,s:.08+Math.random()*.14,c:rgb(c,.6+Math.random()*.7),r:Math.random()*6}); }
function burst(x,y,n,c,sp=10){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=Math.random()*sp; part({k:1,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.25+Math.random()*.5,s:.06+Math.random()*.08,c}); } }
function dust(x,y,n,c){ for(let i=0;i<n;i++) part({k:2,x:x+(Math.random()-.5),y:y+(Math.random()-.5),vx:(Math.random()-.5)*2,vy:-Math.random()*1.5,l:.7+Math.random()*.9,s:.3+Math.random()*.5,c}); }
function bats(x,y){ for(let i=0;i<7;i++) part({k:4,x:x+(Math.random()-.5)*6,y:y+(Math.random()-.5)*4,vx:(Math.random()-.5)*9,vy:-3-Math.random()*5,l:2+Math.random(),s:.22,ph:Math.random()*6}); }
function flash(x,y,r,d,c){ flashes.push({x,y,r,t:0,d,c}); }
function floater(x,y,s,c){ floaters.push({x,y,s,c,t:0}); }
function ring(x,y,r1,d,c){ rings.push({x,y,r1,t:0,d,c}); }
function hot(x,y,c){ part({k:5,x,y,vx:0,vy:0,l:.9+Math.random()*.6,s:.75,c}); }

function destroyTile(x,y,w,hc){
  if(x<1||x>=WW-1||y<1||y>=WH-1) return false;
  const i=y*WW+x, t=tiles[i]; if(t===0||t===T.WALL||isFluid(t)) return false;
  if(y>HEART) return false;
  if(t===T.SEAL){ if(!w) return false; const r=relics[biomeAt(y)]; if(r&&!r.taken) return false; }
  tiles[i]=0; stats.tiles++; const b=biomeAt(y);
  if(t===T.ORE){ addEnergy(2); SFX.ore(); floater(x+.5,y+.2,'+2',[143,244,255]); burst(x+.5,y+.5,6,[143,244,255],6); }
  else if(t===T.HEAL){ P.hp=Math.min(100,P.hp+25); SFX.heal(); floater(x+.5,y+.2,'+25',[255,107,138]); }
  debris(x+.5,y+.5,b,w?1:4,t===T.SEAL?[40,44,60]:null);
  if(w){ if(hc&&Math.random()<.4) hot(x+.5,y+.5,hc); } else dust(x+.5,y+.6,2,rgb(BIO[b].rock,1.3,.3));
  return true;
}
function carve(cx,cy,r,hc){ let n=0; for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++) for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){ const d=Math.hypot(x+.5-cx,y+.5-cy); if(d<r+(h2(x*7,y*3)-.5)*.9&&destroyTile(x,y,true,hc)) n++; } return n; }
function explode(x,y,r){
  carve(x,y,r,[255,120,40]); const b=biomeAt(y); ring(x,y,r*2.3,.45,[255,215,160]); dust(x,y,12,'rgba(28,24,22,.5)'); cine.flash=Math.max(cine.flash,.3); SFX.boom(); shake.m=Math.max(shake.m,.55); cine.slow=.12; cam.z=Math.min(cam.z,.93);
  flash(x,y,r*3.4,.5,[255,190,110]); burst(x,y,26,[255,200,120],14); dust(x,y,10,rgb(BIO[b].rock,1.2,.5)); if(b<2&&Math.random()<.6) bats(x,y-2);
}

// ================= weapons =================
function aimDir(){ const x=inp.x,y=inp.y; if(Math.abs(x)>.45&&Math.abs(x)>=Math.abs(y)) return [Math.sign(x),0]; if(y<-.45) return [0,-1]; return [0,1]; }
function fire(){
  const w=P.weapons[P.sel]; if(!w||P.cool>0||cine.lock>0) return;

        if(r.b===0){ collOn=true; collapseY=P.y-28; collGrace=5; setHint((touchUI?'TAP THE RIGHT SIDE':'PRESS X')+' TO BLAST THROUGH THE SEAL',7); }
