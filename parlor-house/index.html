<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parlor House</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#f0e2c8;font-family:VT323,ui-monospace,monospace;font-size:20px;line-height:1.1;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
@media (orientation:portrait){#app{left:100vw;width:calc(100vh - 30px);width:calc(100dvh - 30px);height:100vw;transform-origin:0 0;transform:rotate(90deg)}
#app.flip{left:0;top:calc(100vh - 30px);top:calc(100dvh - 30px);transform:rotate(-90deg)}}
@media (orientation:landscape){#fl{display:none}}
canvas{position:absolute;top:0;left:0;display:block;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;left:6px;top:6px;display:flex;gap:3px;pointer-events:none}
#hud div{background:rgba(26,18,22,.8);border:1px solid #8a6a40;padding:1px 6px;border-radius:3px;white-space:nowrap;font-size:19px}
#hud em{font-style:normal;font-size:16px;margin-left:2px}
.meter{display:block;height:4px;background:#40282c;margin-bottom:2px;width:44px}.meter i{display:block;height:4px}
#spd{position:absolute;right:6px;top:6px;display:flex;gap:3px}
#goal{position:absolute;left:6px;top:36px;background:rgba(26,18,22,.8);border:1px solid #8a6a40;border-radius:3px;padding:0 6px;font-size:17px;color:#ffd27a;pointer-events:none}#goal:empty{display:none}
#spd button{min-height:30px;padding:1px 8px;background:rgba(92,58,32,.85)}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:min(64%,440px);background:rgba(42,28,32,.93);border:2px solid #c9a26b;border-radius:4px;padding:4px 10px;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#toast b{color:#ffd27a;font-weight:normal;font-size:23px}#toast{display:flex;gap:8px;align-items:center;justify-content:center}#toast div{flex:1;min-width:0}#toast canvas{width:52px;height:52px;border:2px solid #c9a26b;border-radius:3px;flex:0 0 auto;image-rendering:pixelated}
button{font:inherit;color:#f0e2c8;background:rgba(92,58,32,.92);border:1px solid #c9a26b;border-radius:3px;padding:2px 6px;min-height:42px;cursor:pointer;line-height:1}
button:disabled{opacity:.62}
button.on,#spd button.on{background:#c9486a;border-color:#ffd0dc}
button small{display:block;color:#e8c890;font-size:16px}
#panel{position:absolute;left:6px;right:6px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:4px}
#panel button{flex:1;white-space:nowrap;min-width:0;overflow:hidden;font-size:15px;padding:2px 1px}#panel button small{font-size:14px}
#panel .l0.on{background:#2f7a48;border-color:#b8f0c0}#panel .l1.on{background:#a87018;border-color:#ffe0a0}#panel .l2.on{background:#a8243a;border-color:#ffc0c8}
.pan{position:absolute;top:42%;min-height:46px;width:30px;padding:0;font-size:30px;background:rgba(26,18,22,.55);border-color:rgba(201,162,107,.6)}
#result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80%,420px);display:none;border:3px solid #c9a26b;border-radius:5px;padding:12px;background:rgba(42,28,32,.96);text-align:center}
#result{background:#efe6d0;color:#221a14;font-family:Georgia,'Times New Roman',serif;border-color:#221a14;width:min(86%,560px);padding:10px 14px;line-height:1.25}
.npt{font-size:22px;font-weight:bold;letter-spacing:1px;border-bottom:3px double #221a14}.npd{font-size:12px;border-bottom:1px solid #221a14;padding:2px 0;font-style:italic}.nph{font-size:24px;font-weight:bold;margin:6px 0 4px;line-height:1.05}.npl{font-size:15px;text-align:justify}.nps{font-size:12.5px;margin-top:6px;border-top:1px solid #221a14;padding-top:4px}.npsc{font-size:17px;font-weight:bold;margin:5px 0}#result button{font-family:VT323,monospace;min-height:34px;width:60%}
.neg{color:#ff8a7a}.pos{color:#9ad88a}
</style></head><body>
<div id="app">
<canvas id="cv"></canvas>
<div id="hud"></div><div id="goal"></div>
<div id="spd"><button data-act="speed:0">II</button><button data-act="speed:1">&gt;</button><button data-act="speed:2">&gt;&gt;</button><button data-act="speed:4">&gt;&gt;&gt;</button><button data-act="mute" id="mu">&#9834;</button><button data-act="new" id="ng">&#8634;</button><button data-act="flip" id="fl">&#8645;</button></div>
<div id="toast"></div>
<button class="pan" style="left:4px" data-act="pan:-1">&lsaquo;</button><button class="pan" style="right:4px" data-act="pan:1">&rsaquo;</button>
<div id="panel"></div>
<div id="result"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ERAS=[
{y:1865,name:'Boomtown',scale:1,demand:30,legal:0,sign:'SILVER LANTERN'},
{y:1881,name:'Railroad Town',scale:1.6,demand:38,legal:0,sign:'SILVER LANTERN'},
{y:1911,name:'The District',scale:2.5,demand:42,legal:0,sign:'THE SILVER LANTERN'},
{y:1942,name:'Past the County Line',scale:6,demand:36,legal:0,sign:'LANTERN RANCH'},
{y:1971,name:'Licensed House',scale:30,demand:44,legal:1,sign:'SILVER LANTERN RANCH'},
{y:2000,name:'Modern Ranch',scale:120,demand:50,legal:1,sign:'SILVER LANTERN RANCH'}];
const HCOST=[0,150,400,900,1800,3200,5000,7000,10000,14000,20000,30000,42000,80000,130000,500000,1.1e6,1.8e6,2.4e6,3e6],TCOST=[0,300,1200,3500,6000,9000,16000,28000,45000,110000,400000,900000,3e6];
const HNAME=['','','Bartender','Third room','Music','Doorman','Fourth room','Chandelier','Fine wallpaper','Fifth room','Bath house','Sixth room','Flower boxes','Brass beds','Velvet drapes','Marquee lights','House doctor','Roof terrace','Crystal bar','Gold trim','Grand house'];
const tname=n=>['','','General store','Hotel',S.era>=4?'Casino':'Chapel',S.era>=4?'Street lamps':'Street lanterns','Bank',S.era>=3?'Gas station':S.era==2?'Garage':'Livery stable','String lights',S.era>=4?'TV station':S.era==3?'Radio station':'Newspaper',S.era>=3?'Cinema':'Opera house','Hotel wing','Town hall','Fairground'][n];
const pop=()=>Math.round(8*S.town*S.town*[1,1.5,2.5,2,5,12][S.era]+4*S.lv)*10;
const LAW=[['Honest','Fair dealing. Heat cools, good name grows.'],['Shady','Watered drinks. Take +30%, some heat.'],['Crooked','Spiked drinks, robbed patrons. Big take, big heat.']];
const HAIR=['#2a1a10','#6a3a1a','#c9a040','#a03020','#101018','#d8d0c0'];
const DRESS=['#c9486a','#7a4ac0','#2a8a8a','#d8a030','#b03030','#4a70c0','#d870a0','#408a50'];
const SKIN=['#f0c8a0','#d8a070','#a87048','#7a4a30','#f4d8b8'];
let S,speed=1,lastHTML='',nid=1,confirmNew=0;
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();
const year=()=>1865+Math.floor(S.m/12), E=()=>ERAS[S.era], k=()=>ERAS[S.era].scale;
const rooms=()=>S.lv>=11?6:S.lv>=9?5:S.lv>=6?4:S.lv>=3?3:2, price=()=>4*k()*(1+0.04*(S.lv-1))*(1+0.12*(S.madam||0));
const MCOST=[400,2500,15000,90000,600000],MNAME=['Hire a madam','Better madam','Famous madam','Grand madam','Legend madam'];
const steal=()=>S.rival?clamp(0.03*(S.rival*4-S.lv),0,0.3):0,sabCost=()=>300*k()*Math.max(1,S.rival),partyCost=()=>40*k()*(1+S.lv/4);
const upCost=()=>HCOST[S.lv]||0,townCost=()=>TCOST[S.town]||0, payCost=()=>Math.max(30*k()*S.lv,S.cash*.12);
function eraOf(y){let i=0;ERAS.forEach((e,j)=>{if(y>=e.y)i=j});return i}
function dateStr(){return MON[S.m%12]+' '+year()}
function mkWorker(){return{id:nid++,rest:0,hair:pick(HAIR),dress:pick(DRESS),skin:pick(SKIN)}}
function staff(){while(S.workers.length<rooms()+1)S.workers.push(mkWorker());S.workers.length=rooms()+1}
function newGame(){S={m:0,cash:150,rep:20,heat:5,lv:1,town:1,v:2,madam:0,rival:0,rivalCd:0,partyCd:0,goal:0,law:0,workers:[],boom:0,slump:0,closed:0,raid:0,strict:0,evCd:5,neg:0,era:0,over:0,log:[],led:null,result:null};staff();
 log('You open the Silver Lantern in a Nevada silver camp.')}
function log(t){S.log.unshift(dateStr()+' — '+t);S.log.length=Math.min(S.log.length,30)}
function pay(u){S.cash-=u*k()}
let tq=[],tBusy=0;
function toast(t,fx,who,mood){log(t+': '+fx);tq.push([t,fx,who,mood]);if(tq.length>3)tq.shift();pumpT()}
function pumpT(){if(tBusy||!tq.length)return;const[t,fx,who,mood]=tq.shift(),el=$('toast');el.innerHTML=(who?'<canvas width="52" height="52"></canvas>':'')+'<div><b>'+t+'</b><br>'+fx+'</div>';if(who)portrait(el.firstChild,who,mood);el.style.opacity=1;tBusy=1;
 setTimeout(()=>{el.style.opacity=0;setTimeout(()=>{tBusy=0;pumpT()},400)},tq.length?2200:4500)}

/* ---------- events: all banners, nothing stops the clock ---------- */
const EV=[
[()=>S.lv<5,()=>{pay(30);return['Barroom brawl','Damages '+money(-30*k())]}],
[()=>S.era<3,()=>{pay(80);return['Kitchen fire','Repairs '+money(-80*k())]}],
[()=>!E().legal,()=>{S.heat+=10;return['Reformers’ petition','Heat +10']}],
[()=>S.era==0,()=>{S.boom=8;return['Silver strike!','Callers +50% for 8 months']}],
[()=>S.era<2,()=>{S.slump=8;return['The mine lays off','Callers down 40% for 8 months']}],
[()=>!E().legal,()=>{if(S.law){pay(50);return['New sheriff','He wants his cut: '+money(-50*k()),'sheriff','neutral']}S.heat-=10;return['New sheriff','An honest house. He leaves you be: heat -10','sheriff','happy']}],
[()=>S.era<4,()=>{S.slump=3;return['Fever in town','Callers down 40% for 3 months']}],
[()=>true,()=>{S.boom=4;return[['Payday at the mines','Cattle drive in town','Rodeo week','Convention in Reno','Trade show weekend','Big fight weekend'][S.era],'Callers +50% for 4 months']}],
[()=>S.law==0,()=>{S.cash+=60*k();burst(90,150,16,'#ffd27a');return['A generous patron','Tip +'+money(60*k())]}],
[()=>S.law==0,()=>{S.rep+=5;return['Good word spreads','Reputation +5']}],
[()=>S.law==1,()=>{S.rep-=4;return['Grumbling at the bar','Word gets round about the watered whiskey: reputation -4']}],
[()=>S.law==2,()=>{S.heat+=15;return['A robbed patron talks','He went straight to the law: heat +15','sheriff','angry']}],
[()=>S.law==2,()=>{S.rep-=8;return['In the newspaper','"Patrons robbed at the Lantern": reputation -8',S.madam?'madam':null,'angry']}],
[()=>S.era==5,()=>{S.rep+=8;return['Documentary crew','A cable series films at the ranch: reputation +8']}],
[()=>S.era==5,()=>{S.slump=6;return['Ballot question','A county vote on banning the houses scares off callers for 6 months']}],
[()=>E().legal,()=>{if(S.law){pay(60);S.heat+=15;return['Surprise inspection','The books do not add up: fine '+money(-60*k())+', risk +15']}S.rep+=2;return['Surprise inspection','Clean bill: reputation +2']}]];
function onEra(i){S.era=i;S.goal=0;const e=ERAS[i];
 const T=[,'The railroad arrives and the town grows.','Houses are confined to one district. Brick and automobiles.','The Army shuts the districts. You reopen smaller, out on ranch land.',
  'The county licenses the house. First licence: '+money(-200*e.scale)+'. Crooked dealing now risks the licence.','A new century: websites, contractors and brighter neon.'];
 if(i==3){S.lv=Math.min(S.lv,10);S.heat=15;staff()}
 if(i==4){S.cash-=200*e.scale;S.heat=0}
 flashT=performance.now();launch(8,camX+W/2);toast(e.y+' — '+e.name,T[i])}
function scripted(y,mo){
 if(y==1920&&mo==0)toast('Prohibition','Liquor is illegal. An honest house goes dry; a shady one pours behind a curtain.');
 if(y==1929&&mo==9){S.slump=36;toast('The Crash','Wall Street collapses. Callers down 40% for three years.')}
 if(y==1933&&mo==11)toast('Repeal','Prohibition is over. The bar is legal again.');
 if(y==1986&&mo==0){S.strict=1;toast('Mandatory testing','The state tightens the rules. Inspection risk now climbs faster for a house that cuts corners.')}
 if(y==2020&&mo==2){S.closed=14;toast('Shutdown','A pandemic closes every licensed house in Nevada for 14 months.')}}

/* ---------- monthly simulation ---------- */
function tick(){
 if(S.over)return;S.m++;const y=year(),mo=S.m%12;
 if(y>=2027)return endGame(true);
 const ei=eraOf(y);if(ei!==S.era)onEra(ei);
 scripted(y,mo);
 const e=E(),sc=e.scale,L=S.lv,proh=y>=1920&&y<1934;
 let demand=e.demand*(0.5+S.rep/100)*(1+0.025*L)*(1+0.1*(S.town-1))*(S.boom>0?1.5:1)*(S.slump>0?0.6:1)*(1-steal());if(S.closed>0)demand=0;
 const cap=rooms()*12,book=Math.min(demand,cap),pr=price(),house=book*pr*0.5;
 let bar=L>=2?demand*0.3*sc*(1+0.075*L):0;if(proh)bar=S.law?bar*1.5:0;
 const extra=S.law==1?(house+bar)*0.3:S.law==2?book*0.25*pr*3:0;
 const costs=(6+3*L)*sc+(e.legal?25:5)*sc,net=house+bar+extra-costs;
 S.cash+=net;S.led={book,demand,cap,house,bar,extra,costs,net};
 const rt=clamp(20+L*3.5+(L>=10?3:0)-[0,8,22][S.law],10,100);S.rep=clamp(S.rep+clamp(rt-S.rep,-1,1),0,100);
 let dh=[e.legal?-2:-1.5,1,4][S.law];if(e.legal&&S.law)dh*=S.strict?1.5:1.2;if(proh&&S.law)dh+=.5;if(L>=16&&e.legal)dh-=1;
 S.heat=clamp(S.heat+dh,0,100);
 if(S.heat>=100){const fine=Math.max(S.cash*0.3,0)+50*sc;S.cash-=fine;S.rep=Math.max(0,S.rep-10);S.heat=40;S.closed=Math.max(S.closed,e.legal?3:2);S.raid=e.legal?0:1;shake=900;sfx('raid');S.raids=(S.raids||0)+1;
  toast(e.legal?'Licence suspended':'Raid!','Fine '+money(-fine)+'. Closed for '+S.closed+' months.','sheriff','angry')}
 S.lm=S.lm||[0,0,0];S.lm[S.law]++;
 if(y==1910&&mo==3)toast('Halley\'s Comet','It hangs over the valley all year. Look up at night.');if(y==1986&&mo==1)toast('Halley\'s Comet','Back again, 76 years on.');if(y==1942&&mo==5)toast('Blackout drills','Searchlights sweep the night sky over the valley.');
 if(S.boom>0)S.boom--;if(S.slump>0)S.slump--;if(S.partyCd>0)S.partyCd--;
 if(mo==0){const tl=y<1872?0:Math.min(5,1+Math.floor((y-1872)/28));if(S.rivalCd>0)S.rivalCd--;else if(S.rival<tl){S.rival++;toast(S.rival==1?'A rival opens':'The rival expands','The Red Rooster '+(S.rival==1?'opens at the far end of town':'adds a floor')+'. Out-build it or it takes your callers.','rival','happy')}
  if(S.m>36&&Math.random()<.07)disaster()}
 {const G=GOALS[S.era][S.goal];if(G&&G[1]()){S.cash+=G[2];S.goal++;S.gm=(S.gm||0)+1;toast('Goal met',G[0]+'. Prize '+money(G[2])+'.',S.madam?'madam':null,'happy');launch(5,camX+W/2);sfx('goal')}}
 if(S.closed>0&&--S.closed==0){S.raid=0;toast('Open again','The lamp is lit.')}
 S.neg=S.cash<0?S.neg+1:0;if(S.neg>=6)return endGame(false);
 if(--S.evCd<=0&&S.closed<=0){const ok=EV.filter(v=>v[0]());const r=pick(ok)[1]();toast(r[0],r[1],r[2],r[3]);S.evCd=6+rnd(8)}
 S.rep=clamp(S.rep,0,100);S.heat=clamp(S.heat,0,100);
 if(mo==0)save();
 render()}
function endGame(won){S.over=1;speed=0;try{localStorage.removeItem('parlorhouse3')}catch(_){}
 S.result=legacy(won);render()}
function save(){try{localStorage.setItem('parlorhouse3',JSON.stringify({S,nid}))}catch(_){}}
function load(){try{const j=JSON.parse(localStorage.getItem('parlorhouse3'));if(j&&j.S&&!j.S.over){S=j.S;S.town=S.town||1;if(!S.v){if(S.town>=5)S.town++;S.v=2}['madam','rival','rivalCd','partyCd','goal'].forEach(q=>{S[q]=S[q]||0});nid=j.nid;return true}}catch(_){}return false}

/* ---------- UI ---------- */
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e6?s+'$'+(a/1e6).toFixed(2)+'M':a>=1e4?s+'$'+(a/1e3).toFixed(1)+'K':s+'$'+Math.round(a).toLocaleString()};
function render(){
 const e=E(),L=S.led,hc=S.heat>70?'#ff6a5a':S.heat>40?'#e8a030':'#7ac27a';
 $('hud').innerHTML='<div>'+dateStr()+(S.closed>0?' <span class="neg">CLOSED</span>':'')+'</div><div class="'+(S.cash<0?'neg':'')+'">'+short(S.cash)+(L?'<em class="'+(L.net<0?'neg':'pos')+'">'+(L.net<0?'':'+')+short(L.net).replace('$','')+'</em>':'')+'</div>'+
  '<div>&#9733; '+Math.round(S.rep)+'<span class="meter"><i style="width:'+Math.round(S.rep)+'%;background:#ffd27a"></i></span></div>'+
  '<div>'+(e.legal?'&#9878;':'&#128293;')+' '+Math.round(S.heat)+'<span class="meter"><i style="width:'+Math.round(S.heat)+'%;background:'+hc+'"></i></span></div>';
 document.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',b.dataset.act=='speed:'+speed));
 $('ng').textContent=confirmNew?'Restart?':'↺';
 const R=$('result');if(S.result){if(R.style.display!='block'){R.style.display='block';R.innerHTML=S.result}}else R.style.display='none';
 const uc=upCost(),tc=townCost(),pc=payCost(),hm=S.lv>=20,tm=S.town>=13,fill=(c,x)=>' style="background:linear-gradient(90deg,rgba(52,112,66,.95) '+Math.round(clamp(c/x,0,1)*100)+'%,rgba(92,58,32,.92) '+Math.round(clamp(c/x,0,1)*100)+'%)"';
 const G=GOALS[S.era][S.goal];$('goal').textContent=G&&!S.over?'Goal: '+G[0]+' · prize '+short(G[2]):'';
 $('mu').classList.toggle('on',!mute);
 const B=(act,label,sub,ok,c,x,cls)=>'<button class="'+(cls||'')+'" data-act="'+act+'"'+(ok?'':' disabled')+(x?fill(c,x):'')+'>'+label+'<small>'+sub+'</small></button>';
 const mc=MCOST[S.madam],mm=S.madam>=5,sc2=sabCost(),yc=partyCost();
 let h=B('law',LAW[S.law][0],'tap: change',true,0,0,'l'+S.law+' on')+
  B('up',hm?'House '+S.lv:HNAME[S.lv+1],hm?'complete':short(uc),!hm&&S.cash>=uc,S.cash,hm?0:uc)+
  B('town',tm?'Town '+S.town:tname(S.town+1),tm?'complete':short(tc),!tm&&S.cash>=tc,S.cash,tm?0:tc)+
  B('madam',mm?'Madam 5':MNAME[S.madam],mm?'complete':short(mc),!mm&&S.cash>=mc,S.cash,mm?0:mc)+
  B('party','Throw party',S.partyCd>0?'in '+S.partyCd+' mo':short(yc),S.partyCd<=0&&S.cash>=yc&&S.closed<=0,0,0)+
  B('pay',e.legal?'Lawyers':'Pay off',short(pc),S.heat>=5&&S.cash>=pc,0,0)+
  (S.rival?B('sab','Sabotage',S.law==2?short(sc2):'Crooked only',S.law==2&&S.cash>=sc2,0,0):'');
 if(h!==lastHTML){$('panel').innerHTML=h;lastHTML=h}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b||b.disabled||!S)return;const[a,v]=b.dataset.act.split(':');
 if(a=='speed')speed=+v;
 if(a=='flip'){flip=!flip;try{localStorage.setItem('ph_flip',flip?'1':'')}catch(_){}fit()}
 if(a=='pan'){camT=clamp(camX+v*W*.6,camMin,camMax());camBack=0}
 if(a=='law'&&!S.over){S.law=(S.law+1)%3;toast(LAW[S.law][0],LAW[S.law][1]);sfx('tap')}
 if(a=='mute'){mute=!mute;try{localStorage.setItem('ph_mute',mute?'1':'')}catch(_){}if(!mute)au()}
