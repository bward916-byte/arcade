<script>

{y:2080,name:'Starport Age',scale:800,demand:62,legal:1,sign:'SILVER LANTERN'}];

const HNAME=['','','Bartender','Third room','Music','Doorman','Fourth room','Chandelier','Fine wallpaper','Fifth room','Bath house','Sixth room','Flower boxes','Brass beds','Velvet drapes','Marquee lights','House doctor','Roof terrace','Crystal bar','Gold trim','Grand house','Hologram sign','Android barman','Sky lounge','Zero-g suite','Landing pad','Orbital annex'];
const tname=n=>['','','General store','Hotel',S.era>=4?'Casino':'Chapel',S.era>=4?'Street lamps':'Street lanterns','Bank',S.era>=3?'Gas station':S.era==2?'Garage':'Livery stable','String lights',S.era>=4?'TV station':S.era==3?'Radio station':'Newspaper',S.era>=3?'Cinema':'Opera house','Hotel wing','Town hall','Fairground','Maglev station','Arcology tower','Spaceport','Orbital elevator'][n];
const pop=()=>Math.round(8*S.town*S.town*[1,1.5,2.5,2,5,12,30,80][S.era]+4*S.lv)*10;
const LAW=[['Honest','Fair dealing. Heat cools, good name grows.'],['Shady','Watered drinks. Take +30%. Heat climbs slowly toward a raid at 100.'],['Crooked','Spiked drinks, robbed patrons. Big take, heat climbs fast. Lets you burn the rival.']];
const HAIR=['#2a1a10','#6a3a1a','#c9a040','#a03020','#101018','#d8d0c0'];
const DRESS=['#c9486a','#7a4ac0','#2a8a8a','#d8a030','#b03030','#4a70c0','#d870a0','#408a50'];
const SKIN=['#f0c8a0','#d8a070','#a87048','#7a4a30','#f4d8b8'];
let S,speed=1,lastHTML='',nid=1,confirmNew=0;
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();
const year=()=>1865+Math.floor(S.m/12), E=()=>ERAS[S.era], k=()=>ERAS[S.era].scale;
const rooms=()=>S.lv>=11?6:S.lv>=9?5:S.lv>=6?4:S.lv>=3?3:2, price=()=>4*k()*(S.liq>0?1.1:1)*(1+0.04*(S.lv-1))*(1+0.12*(S.madam||0))*(1+0.05*tc('classy'));
const MCOST=[400,2500,15000,90000,600000],MNAME=['Hire a madam','Better madam','Famous madam','Grand madam','Legend madam'];

const upCost=()=>HCOST[S.lv]||0,townCost=()=>TCOST[S.town]||0, payCost=()=>90*k()*S.lv*upx('pay',1.5);
function eraOf(y){let i=0;ERAS.forEach((e,j)=>{if(y>=e.y)i=j});return i}
function dateStr(){return MON[S.m%12]+' '+year()}
const TRAITS={charm:['Charming','Callers +5%','#ff9ac8',1.2],classy:['Classy','Visit price +5%','#e0b848',1.3],tire:['Tireless','Takes 12 visits a month, not 8','#9ad88a',1.5],disc:['Discreet','Heat builds more slowly','#70b0e0',1.2],sticky:['Light-fingered','Shady and crooked take +10%','#c080ff',1.1],song:['Songbird','Bar takings +10%','#ffd27a',1.1],pop:['Well-liked','Good name +3','#f0e8e0',1.2],plain:['Steady','No special trait','#b0a090',.7]};
const tc=t=>S?S.workers.reduce((a,w)=>a+(w.t==t?1:0),0):0;let pickOpen=false,lastPick='',lastHud='';
function gname(){const pool=GN[S&&S.era>=5?2:S&&S.era>=3?1:0];let n,i=0;do{n=pick(pool)}while(S&&i++<20&&(S.workers.some(w=>w.n==n)||(S.cands||[]).some(w=>w.n==n)));return n}
function mkWorker(t){return{id:nid++,rest:0,hair:pick(HAIR),dress:pick(DRESS),skin:pick(SKIN),n:gname(),t:t||pick(Object.keys(TRAITS))}}
function cands(){if(!S.cands||S.cands.length!=3){S.cands=[];const ks=Object.keys(TRAITS).sort(()=>Math.random()-.5);for(let i=0;i<3;i++){let w=mkWorker(ks[i]),n=0;while(n++<12&&S.cands.some(q=>q.hair==w.hair||q.skin==w.skin))w=mkWorker(ks[i]);S.cands.push(w)}}return S.cands}

const maxGirls=()=>Math.ceil(rooms()*1.5),hireCost=()=>40*k()*Math.pow(1.7,S.girls-1),upx=(a,r)=>Math.pow(r,Math.min(10,(S.use&&S.use[a])||0)),used=a=>{S.use=S.use||{};S.use[a]=(S.use[a]||0)+1};
const GN=[['Ruby','Pearl','Clementine','Josie','Mae','Hattie','Lottie','Belle','Dora','Nell','Ada','Cora'],['Betty','Dolores','Rita','Gloria','Peggy','Lorraine','Connie','Vera','Donna','Sheila'],['Jade','Skye','Roxy','Amber','Dakota','Sierra','Raven','Lexi','Nova','Zara']];

 log('You open the Silver Lantern in a Nevada silver camp.')}
function log(t){S.log.unshift(dateStr()+' — '+t);S.log.length=Math.min(S.log.length,30)}
function pay(u){S.cash-=u*k()}
let tq=[],tBusy=0;
function toast(t,fx,who,mood){log(t+': '+fx);tq.push([t,fx,who,mood]);if(tq.length>3)tq.shift();pumpT()}
function pumpT(){if(tBusy||!tq.length)return;const[t,fx,who,mood]=tq.shift(),el=$('toast');el.innerHTML=(who?'<canvas width="64" height="64"></canvas>':'')+'<div><b>'+t+'</b><br>'+fx+'</div>';if(who)portrait(el.firstChild,who,mood);el.style.opacity=1;tBusy=1;
 setTimeout(()=>{el.style.opacity=0;setTimeout(()=>{tBusy=0;pumpT()},400)},tq.length?2200:4500)}

/* ---------- events: all banners, nothing stops the clock ---------- */
const EV=[
[()=>S.lv<5,()=>{pay(30);return['Barroom brawl','Damages '+money(-30*k())]}],
[()=>S.era<3,()=>{pay(80);return['Kitchen fire','Repairs '+money(-80*k())]}],
[()=>!E().legal,()=>{S.heat+=10;return['Reformers’ petition','Heat +10']}],
[()=>S.era==0,()=>{S.boom=8;return['Silver strike!','Callers +50% for 8 months']}],
[()=>S.era<2,()=>{S.slump=8;return['The mine lays off','Callers down 40% for 8 months']}],
[()=>!E().legal,()=>{if(S.law){pay(50);return['New sheriff','He wants his cut: '+money(-50*k()),'sheriff','neutral']}S.heat-=10;return['New sheriff','An honest house. He leaves you be: heat -10','sheriff','happy']}],
[()=>S.era<4,()=>{S.slump=3;return['Fever in town','Callers down 40% for 3 months']}],
[()=>true,()=>{S.boom=4;return[['Payday at the mines','Cattle drive in town','Rodeo week','Convention in Reno','Trade show weekend','Big fight weekend','Launch week','Fleet week'][S.era],'Callers +50% for 4 months']}],
[()=>S.law==0,()=>{S.cash+=60*k();burst(90,150,16,'#ffd27a');return['A generous patron','Tip +'+money(60*k())]}],
[()=>S.law==0,()=>{S.rep+=5;return['Good word spreads','Good name +5']}],
[()=>S.law==1,()=>{S.rep-=4;return['Grumbling at the bar','Word gets round about the watered whiskey: good name -4']}],
[()=>S.law==2,()=>{S.heat+=15;return['A robbed patron talks','He went straight to the law: heat +15','sheriff','angry']}],

[()=>S.era==5,()=>{S.rep+=8;return['Documentary crew','A cable series films at the ranch: good name +8']}],
[()=>S.era==5,()=>{S.slump=6;return['Ballot question','A county vote on banning the houses scares off callers for 6 months']}],
[()=>E().legal,()=>{if(S.law){pay(60);S.heat+=15;return['Surprise inspection','The books do not add up: fine '+money(-60*k())+', risk +15']}S.rep+=2;return['Surprise inspection','Clean bill: good name +2']}]];
