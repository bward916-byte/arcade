<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kawaii Food Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sweet, bouncy, toy-like
   IDEA: a pastel food truck with a merge board as its kitchen counter
   PICTURE: the truck + animal customers on top, the merge board below
   COLOUR and TYPE: strawberry milk pink, mint, butter yellow; Fredoka rounded
   LAYOUT: top resource pills, scene, 7x8 board, three big bottom buttons */
:root{--ink:#6b4257;--pink:#ff8fb8;--line:#f7c6d9;--shadow:#f2b3cb;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;min-width:0}
html,body{margin:0;height:100%;background:#ffe9f2;overflow:hidden;touch-action:none;
  font-family:Fredoka,ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;color:var(--ink);cursor:pointer}
#app{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;flex-direction:column;
  background:radial-gradient(circle at 10px 10px,rgba(255,255,255,.55) 2.5px,transparent 3px) 0 0/22px 22px,linear-gradient(#ffd9ea,#ffeef5)}
#top{display:flex;gap:5px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;align-items:center}
.pill{flex:1;display:flex;align-items:center;gap:4px;background:linear-gradient(#fff,#fff3f8);border:2.5px solid var(--line);border-radius:999px;
  padding:2px 6px 2px 3px;font-weight:700;font-size:15px;position:relative;box-shadow:0 2px 0 var(--shadow);height:34px}
.pill .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;box-shadow:inset 0 -2px 0 rgba(107,66,87,.15),inset 0 2px 0 rgba(255,255,255,.7)}
.pill small{font-size:10px;opacity:.7;margin-left:auto;font-weight:600}
.bar{position:absolute;left:28px;right:9px;bottom:3px;height:4px;background:#f6dbe6;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);width:0;transition:width .3s}
.sq{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);background:#fff;font-size:15px;flex:none;box-shadow:0 2px 0 var(--shadow);padding:0}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.14)}}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bottom{position:relative;display:flex;gap:8px;padding:6px 10px calc(max(env(safe-area-inset-bottom),12px) + 14px)}
.btn{flex:1;background:linear-gradient(#fff 55%,#ffeaf3);border:2.5px solid var(--line);border-radius:18px;padding:6px 4px;font-weight:700;font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--shadow);position:relative;min-height:52px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn .e{font-size:19px;line-height:1;width:32px;height:30px;border-radius:12px;display:grid;place-items:center;background:#ffe3ef;box-shadow:inset 0 -2px 0 rgba(107,66,87,.1)}
#bBook .e{background:#e3f1ff}#bQuest .e{background:#d8f5e6}#wheelBtn .e{background:#e6dbff}#bShop .e{background:#fff1c4}
.dot{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#ff5a8a;border:2px solid #fff;display:none;
  color:#fff;font-size:11px;line-height:14px;font-weight:700;animation:pulse 1s infinite}
.dot.on{display:block}
@keyframes pulse{50%{transform:scale(1.2)}}
#sell{position:absolute;inset:6px 10px calc(max(env(safe-area-inset-bottom),12px) + 14px);display:none;align-items:center;justify-content:center;
  border-radius:18px;border:3px dashed var(--pink);background:#fff0f6;font-weight:700;font-size:15px;gap:6px}
body.dragging #sell{display:flex}
#sell.hot{background:#ffcfe2;transform:scale(1.03)}
#modal{position:fixed;inset:0;background:rgba(107,66,87,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal.hide{display:none}
.sheet{width:100%;max-width:520px;background:#fff8fb;border-radius:26px 26px 0 0;padding:14px 16px calc(max(env(safe-area-inset-bottom),12px) + 20px);
  animation:up .25s ease-out;border-top:4px solid #ffc4de}
@keyframes up{from{transform:translateY(100%)}}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh h2{margin:0;font-size:21px;font-weight:700}
#mx{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);background:#fff;font-size:16px;font-weight:700}
.card{text-align:center;background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:12px;margin-top:10px}
.card .e{font-size:42px;line-height:1.2}
.card h3{margin:2px 0;font-size:19px}
.card p{margin:4px 0;font-size:14px}
.small{font-size:12px!important;opacity:.75}
.buy{background:linear-gradient(#ff9ec7,#ff7fb0);color:#fff;border:none;border-radius:14px;padding:10px 22px;font-weight:700;font-size:16px;
  box-shadow:0 3px 0 #e0608f;margin-top:6px;min-height:44px}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #e0608f}
.buy.off{background:#e8dbe1;box-shadow:0 3px 0 #cfbcc6;color:#9b8590}
.prog{display:flex;justify-content:space-between;margin-top:10px;gap:4px}
.prog span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f3e6ec;filter:grayscale(1);opacity:.45;font-size:17px}
.prog span.on{filter:none;opacity:1;background:#ffe0ee}
.tros{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.tro{background:#fff;border-radius:12px;padding:6px 4px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}.tro span{font-size:26px;display:block}.tro small{font-size:11px;line-height:1.15;display:block}.tro.lk{opacity:.5}
.next{font-size:12px;margin-top:10px;text-align:center;opacity:.8}
.next span{display:inline-block;margin:2px 4px;background:#fff;border-radius:10px;padding:2px 8px;border:1.5px solid var(--line)}
.brow{margin-top:10px}
.bt{font-weight:700;font-size:14px;margin-bottom:4px}
.bitems{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.bi{background:#fff;border:2px solid var(--line);border-radius:12px;text-align:center;padding:3px 1px}
.bi canvas{width:100%;aspect-ratio:1;display:block}
.bi small{display:block;font-size:9.5px;line-height:1.1;min-height:21px;font-weight:600}
.srow{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:8px 10px;margin-top:10px}
.srow .e{font-size:28px}
.srow div{flex:1}
.srow b{display:block;font-size:15px}
.srow small{font-size:12px;opacity:.75}
.srow .buy{margin:0;padding:8px 14px}
.stitle{margin-top:14px;font-weight:700;font-size:14px}
.stitle i{font-weight:500;font-size:11px;opacity:.7;font-style:normal;margin-left:4px}
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.pack{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:8px 4px;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;position:relative;box-shadow:0 3px 0 var(--shadow)}
.pack span{font-size:18px}
.pack small{font-size:13px;color:#c0507f}
.pack em{position:absolute;top:-10px;background:#ff5a8a;color:#fff;font-size:10px;font-style:normal;border-radius:8px;padding:1px 6px}
.link{background:none;border:none;font-size:12px;opacity:.55;margin:14px auto 0;display:block;text-decoration:underline;min-height:32px}
#title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,#fff6fa,#ffd0e4);padding:20px}
#title.hide{display:none}
.tcard{text-align:center}
#tcv{width:280px;height:170px;display:block;margin:0 auto}
#title{background:radial-gradient(circle at 12px 12px,rgba(255,255,255,.6) 3px,transparent 3.5px) 0 0/26px 26px,radial-gradient(circle at 50% 35%,#fff6fa,#ffc9e0)}
#title h1{margin:4px 0 0;font-size:48px;line-height:1.0;font-weight:700;color:#ff6fa3;text-shadow:0 3px 0 #fff,0 6px 0 #f7a9c9,0 10px 14px rgba(255,111,163,.3)}
#title h1 span{display:inline-block;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-6px) rotate(-3deg)}}
#play{animation:pulse 1.3s ease-in-out infinite}
#title p{margin:10px 0 18px;font-size:16px;font-weight:600;opacity:.8}
#play{font-size:20px;padding:14px 30px;border-radius:22px}
.fab{position:absolute;left:8px;top:8px;width:44px;height:44px;border-radius:50%;background:#fff;border:2.5px solid var(--line);font-size:22px;
  box-shadow:0 2px 0 var(--shadow);z-index:2;display:none;padding:0}
.fab.on{display:block}
.wheel{position:relative;width:min(280px,70vw);margin:10px auto 0}
.wheel canvas{width:100%;display:block}
.wptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:30px;color:#ff4f86;text-shadow:0 2px 0 #fff;line-height:1}
.offer{position:relative;background:linear-gradient(135deg,#fff3b0,#ffd0e4);border:2.5px solid #ffb3cf;border-radius:20px;padding:12px;margin-top:10px;display:flex;align-items:center;gap:10px}
.offer .e{font-size:34px}
.offer div{flex:1}
.offer b{display:block;font-size:16px}
.offer small{font-size:12px}
.offer em{position:absolute;top:-10px;left:12px;background:#ff5a8a;color:#fff;font-size:10px;font-style:normal;border-radius:8px;padding:1px 7px;font-weight:700}
.low{animation:pulse .9s infinite}
.sheet{max-height:92vh;overflow:auto}
.btn{font-size:12px;padding:6px 2px}
.qrow{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:9px 10px;margin-top:9px}
.qrow .e{font-size:26px}.qrow div{flex:1}.qrow b{display:block;font-size:14px}
.qbar{height:8px;border-radius:4px;background:#f6dbe6;margin-top:5px;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ec7,#ffd36b)}
.qrow small{font-size:11px;opacity:.75}.qrow .buy{margin:0;padding:8px 12px;font-size:14px}
.qdone{opacity:.55}
.tprev{display:flex;justify-content:center;margin:4px 0}.tprev img{width:min(240px,62vw);filter:drop-shadow(0 4px 6px rgba(150,70,110,.25))}
.home{display:none;margin-top:12px;font-weight:700;color:#c0507f;font-size:14px;text-decoration:underline}
body.inhub .home{display:inline-block}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill" id="pLvl"><div class="ic" style="background:#ffe48a">⭐</div><b id="vLvl">1</b><div class="bar"><i id="vXp"></i></div></div>
    <div class="pill" id="pEn"><div class="ic" style="background:#fff3a8">⚡</div><b id="vEn">50</b><small id="vEt"></small></div>
    <div class="pill" id="pCo"><div class="ic" style="background:#ffe9a8">🪙</div><b id="vCo">0</b></div>
    <div class="pill" id="pGe"><div class="ic" style="background:#e6dbff">💎</div><b id="vGe">5</b></div>
    <button class="sq" id="snd" aria-label="Sound">🔊</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="bottom">
    <button class="btn" id="bTruck"><span class="e">🚚</span>Upgrade<span class="dot" id="dTruck">!</span></button>
    <button class="btn" id="bBook"><span class="e">📖</span>Recipes<span class="dot" id="dBook"></span></button>
    <button class="btn" id="bQuest"><span class="e">📋</span>Quests<span class="dot" id="dQuest">!</span></button>
    <button class="btn" id="wheelBtn"><span class="e">🎡</span>Spin<span class="dot" id="dWheel">1</span></button>
    <button class="btn" id="bShop"><span class="e">🛍️</span>Shop</button>
    <div id="sell">🧺 Drop here to sell <b id="sellV"></b></div>
  </div>
</div>
<div id="modal" class="hide"><div class="sheet"><div class="mh"><h2 id="mt"></h2><button id="mx" aria-label="Close">✕</button></div><div id="mb"></div></div></div>
<div id="title"><div class="tcard"><canvas id="tcv"></canvas><h1 id="tt">Kawaii<br>Food Truck</h1><p>tap · merge · serve · upgrade</p>
  <button class="buy" id="play">Open the truck! 💖</button><br><a class="home" href="../index.html">← All games</a></div></div>

<script>
{
'use strict';
const $=id=>document.getElementById(id);
const app=$('app'),stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const DPR=Math.min(2.5,window.devicePixelRatio||1);
const COLS=6,ROWS=7,MAXL=5,EMAX=50,EREGEN=12000;
const OUT='#6b4257';
const FONT=(s,w=700)=>`${w} ${s}px Fredoka,ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif`;
const now=()=>performance.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const easeOutElastic=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-0.75)*(2*Math.PI)/3)+1;
const easeOutCubic=x=>1-Math.pow(1-x,3);
const idx=(x,y)=>y*COLS+x;

const CH={
  sweet:{name:'Sweets',gen:'Oven',items:['Sugar Cube','Cookie','Donut','Cupcake','Berry Cake','Rainbow Cake'],cols:['#ff9ec7','#ffe066','#fff']},
  drink:{name:'Drinks',gen:'Blender',items:['Water Drop','Milk','Green Tea','Boba Tea','Smoothie','Rainbow Float'],cols:['#8fd3ff','#b8f0d4','#fff']},
  savory:{name:'Savory',gen:'Grill',items:['Onigiri','Dumpling','Taco','Burger','Ramen','Bento Box'],cols:['#ffb27a','#ffe066','#8fdc7a']},
};
const UPS=[
  {n:'Pastel Paint Job',d:'Strawberry-milk pink with a mint stripe',cost:25,e:'🎨'},
  {n:'Striped Awning',d:'Shade for happy customers',cost:50,e:'⛱️'},
  {n:'Grill Station',d:'Unlocks the Grill and savory food!',cost:90,e:'🔥'},
  {n:'Fairy Lights',d:'Twinkly string lights on the roof',cost:150,e:'✨'},
  {n:'Neon Heart Sign',d:'A glowing YUM sign',cost:230,e:'💗'},
  {n:'Kitty Ear Roof',d:'Maximum cuteness',cost:340,e:'🐱'},
  {n:'Flower Boxes',d:'Little blooms under the window',cost:480,e:'🌷'},
  {n:'Golden Trim',d:'The fanciest truck in town',cost:700,e:'👑'},
];
const SPOTS=[{lvl:1,n:'City Street',e:'🏙️'},{lvl:4,n:'Beach Boardwalk',e:'🏖️'},{lvl:7,n:'Sakura Park',e:'🌸'},{lvl:10,n:'Starry Night Market',e:'🌙'}];
const spotIdx=()=>{let k=0;SPOTS.forEach((p,i)=>{if(S.lvl>=p.lvl)k=i;});return k;};
const WHEEL=[{t:'en',v:5,lab:'+5⚡',col:'#fff3a8',w:20},{t:'co',v:30,lab:'30🪙',col:'#ffd6e5',w:18},{t:'ge',v:3,lab:'3💎',col:'#e6dbff',w:14},{t:'box',v:1,lab:'🎁',col:'#d6efff',w:14},
  {t:'en',v:15,lab:'+15⚡',col:'#fff3a8',w:12},{t:'star',v:1,lab:'🌟',col:'#ffe0b8',w:8},{t:'co',v:80,lab:'80🪙',col:'#ffd6e5',w:8},{t:'ge',v:10,lab:'10💎',col:'#d8f5e6',w:6}];
const ANIMALS={bunny:{col:'#ffffff',in:'#ffc4d6'},cat:{col:'#ffd29e',in:'#ffb3a0'},bear:{col:'#d9a37a',in:'#f2c9a8'},
  panda:{col:'#ffffff',in:'#eee6ea'},frog:{col:'#a8e6a1',in:'#d6f5cf'},chick:{col:'#ffe680',in:'#fff3b8'},
  fox:{col:'#ffaa70',in:'#fff4ea'},pig:{col:'#ffc4d6',in:'#ffe0ea'},hamster:{col:'#ffd9a8',in:'#fff4ea'},alien:{col:'#b8f5a0',in:'#e2fbd6'}};

/* ---------- drawing primitives ---------- */
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
let SHADE=null;
function shade(c){if(!SHADE){SHADE=1;}const g=c.createLinearGradient(-30,-50,30,50);g.addColorStop(0,'rgba(255,255,255,.38)');g.addColorStop(0.42,'rgba(255,255,255,0)');g.addColorStop(0.7,'rgba(120,60,90,0)');g.addColorStop(1,'rgba(120,60,90,.2)');c.fillStyle=g;c.fillRect(-80,-80,160,160);}
function shape(c,path,fill,inner,flat){path();c.fillStyle=fill;c.fill();c.save();path();c.clip();if(inner)inner();if(!flat)shade(c);c.restore();path();c.lineWidth=3.5;c.strokeStyle=OUT;c.stroke();}
function sparkle(c,x,y,r,col){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,q=i%2?r*0.32:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();c.fillStyle=col;c.fill();}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*0.7);c.bezierCurveTo(x-s*1.2,y-s*0.1,x-s*0.6,y-s*1.0,x,y-s*0.35);c.bezierCurveTo(x+s*0.6,y-s*1.0,x+s*1.2,y-s*0.1,x,y+s*0.7);c.closePath();}
function starPath(c,x,y,R,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r:R;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();}
function face(c,x,y,k=1,mood=0){
  c.save();c.lineCap='round';
  if(mood===1){c.strokeStyle=OUT;c.lineWidth=2.8*k;for(const s of[-1,1]){c.beginPath();c.arc(x+s*10*k,y+2*k,4*k,Math.PI*1.15,Math.PI*1.85);c.stroke();}}
  else if(mood===2){for(const s of[-1,1]){heartPath(c,x+s*10*k,y+0.5*k,5.4*k);c.fillStyle='#ff4f86';c.fill();}}
  else if(mood===3){c.strokeStyle=OUT;c.lineWidth=2.6*k;for(const s of[-1,1]){c.beginPath();c.arc(x+s*10*k,y-1*k,3.6*k,Math.PI*0.15,Math.PI*0.85);c.stroke();}}
  else{c.fillStyle=OUT;for(const s of[-1,1]){ell(c,x+s*10*k,y,3.4*k,4.2*k);c.fill();}c.fillStyle='#fff';for(const s of[-1,1]){circ(c,x+s*10*k-1.2*k,y-1.7*k,1.35*k);c.fill();}}
  c.fillStyle='rgba(255,120,155,.5)';for(const s of[-1,1]){ell(c,x+s*17*k,y+5.5*k,4.6*k,2.7*k);c.fill();}
  c.strokeStyle=OUT;c.lineWidth=2.2*k;c.beginPath();
  if(mood===1||mood===2){c.moveTo(x-4.5*k,y+4*k);c.quadraticCurveTo(x,y+11*k,x+4.5*k,y+4*k);c.closePath();c.fillStyle='#ff7f9f';c.fill();c.stroke();}
  else{c.moveTo(x-4*k,y+4*k);c.quadraticCurveTo(x-2*k,y+7.5*k,x,y+4.6*k);c.quadraticCurveTo(x+2*k,y+7.5*k,x+4*k,y+4*k);c.stroke();}
  c.restore();
}
function berry(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);
  shape(c,()=>{c.beginPath();c.moveTo(0,10);c.bezierCurveTo(-12,4,-10,-8,0,-6);c.bezierCurveTo(10,-8,12,4,0,10);c.closePath();},'#ff5a76');
  c.fillStyle='#ffe9a8';[[-3,-1],[3,0],[0,4]].forEach(p=>{circ(c,p[0],p[1],1.1);c.fill();});

function sprite(key,size,fn,sil=false,m=1.3){
  size=Math.max(8,Math.round(size));const k=key+'|'+size+(sil?'s':'');let s=SPR.get(k);if(s)return s;
  const side=Math.ceil(size*m*DPR);const oc=document.createElement('canvas');oc.width=oc.height=side;
  const c=oc.getContext('2d');c.translate(side/2,side/2);const sc=size/100*DPR;c.scale(sc,sc);c.lineJoin='round';c.lineCap='round';
  fn(c);
  if(sil){c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-atop';c.fillStyle='#dcc8d2';c.fillRect(0,0,side,side);}
  SPR.set(k,oc);return oc;
}

}

  return cl;}

function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;document.body.classList.remove('dragging');$('sell').classList.remove('hot');lastAct=now();
  if(cancel||S.board[d.k]!==d.it)return;

    if(sel>=0&&sel!==d.k){const a=S.board[sel],o=S.board[d.k];const from=sel;sel=-1;
      if(a&&o.t==='item'&&o.l<MAXL&&(a.t==='star'||(a.t==='item'&&a.c===o.c&&a.l===o.l))){moveTo(from,d.k);return;}}

    // truck drive in
    let tx=IW/2,rot=0,sq=0;
    if(T<1.15){const u=Math.min(1,T/1.15);tx=-tw/2+(IW/2+tw/2)*easeOutCubic(u);rot=-0.04;if(Math.random()<0.6)Q.push({k:'dust',x:tx-tw*0.45,y:ty+th*0.42,vx:rnd(-3,-1),vy:rnd(-1.5,-0.3),life:1,s:rnd(10,20)});}
    else{const a=T-1.15;rot=Math.sin(a*18)*0.06*Math.max(0,1-a*2.2);sq=exploded?Math.max(0,0.12-(T-1.55)*0.4)*Math.sin((T-1.55)*30):0;}
    if(T>=1.0&&!stopped){stopped=true;tone(900,0.35,'sawtooth',0.05,0,0.4);noise(0.3,0.1,4000,800);}
    if(truck){x.save();x.translate(tx,ty+th/2);x.rotate(rot);x.scale(1+sq,1-sq);x.fillStyle='rgba(60,20,60,.25)';ell(x,0,0,tw*0.45,th*0.06);x.fill();x.drawImage(truck,-tw/2,-th,tw,th);x.restore();}
    // explosion
    if(T>=1.55&&!exploded){exploded=true;flash=1;shk=26;noise(0.9,0.5,1800,60);tone(70,0.6,'sine',0.35,0,0.5);buzz(60);
      const ex=IW/2-tw*0.05,ey=ty-th*0.15;for(let i=0;i<34;i++){Q.push({k:'food',img:foods[i%foods.length],x:ex,y:ey,vx:rnd(-11,11),vy:rnd(-19,-7),life:1,s:rnd(44,78),r:rnd(0,6),vr:rnd(-0.25,0.25)});}
      for(let i=0;i<160;i++){const a=Math.random()*Math.PI*2,v=rnd(3,14);Q.push({k:'conf',x:ex,y:ey,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,life:1,s:rnd(5,10),c:pick(['#ff8fb8','#ffe066','#8fd3ff','#b8f0a0','#c9a8ff','#fff']),r:rnd(0,6),vr:rnd(-0.3,0.3)});}
      for(let i=0;i<3;i++)Q.push({k:'ring',x:ex,y:ey,life:1,d:i*0.12,s:IW*(0.5+i*0.3)});}
    if(exploded&&T<2.25){const a=T-1.55,u=Math.min(1,a/0.12),ex=IW/2-tw*0.05,ey=ty-th*0.15,R1=Math.min(IW*0.42,190)*(u<1?u:1+0.05*Math.sin(a*30))*(a>0.5?Math.max(0,1-(a-0.5)/0.2):1);
      if(R1>2){x.save();x.translate(ex,ey);x.rotate(-0.12);x.beginPath();for(let i=0;i<28;i++){const ang=i/28*Math.PI*2,rr2=i%2?R1*0.62:R1;x.lineTo(Math.cos(ang)*rr2,Math.sin(ang)*rr2*0.82);}x.closePath();
        x.fillStyle='#ffe066';x.fill();x.lineWidth=6;x.strokeStyle='#6b4257';x.stroke();x.beginPath();for(let i=0;i<28;i++){const ang=i/28*Math.PI*2+0.1,rr2=(i%2?0.62:1)*R1*0.72;x.lineTo(Math.cos(ang)*rr2,Math.sin(ang)*rr2*0.82);}x.closePath();x.fillStyle='#ff6fa3';x.fill();
        x.font=FONT(Math.round(R1*0.42),700);x.textAlign='center';x.textBaseline='middle';x.lineWidth=R1*0.07;x.strokeStyle='#6b4257';x.strokeText('POP!',0,0);x.fillStyle='#fff';x.fillText('POP!',0,0);x.restore();}}
    // fireworks
    if(T>1.9&&T-lastFw>0.42&&T<7){lastFw=T;firework(rnd(IW*0.1,IW*0.9),rnd(IH*0.06,IH*0.4));}
    for(let i=FW.length-1;i>=0;i--){const f=FW[i];if(f.ring){f.life-=0.05;if(f.life<=0){FW.splice(i,1);continue;}x.globalAlpha=f.life;circ(x,f.x,f.y,(1-f.life)*60+6);x.fillStyle='#fff';x.fill();x.globalAlpha=1;continue;}f.x+=f.vx;f.y+=f.vy;f.vy+=0.06;f.vx*=0.985;f.vy*=0.985;f.life-=0.016;if(f.life<=0){FW.splice(i,1);continue;}
      x.globalAlpha=f.life;x.fillStyle=f.c;circ(x,f.x,f.y,f.s*f.life+0.6);x.fill();x.globalAlpha=f.life*0.35;circ(x,f.x,f.y,f.s*2.2);x.fill();}x.globalAlpha=1;
    // particles
    for(let i=Q.length-1;i>=0;i--){const p=Q[i];
      if(p.k==='ring'){const a=(T-1.55-p.d);if(a<0)continue;const u=a/0.7;if(u>=1){Q.splice(i,1);continue;}x.globalAlpha=1-u;circ(x,p.x,p.y,p.s*easeOutCubic(u));x.lineWidth=14*(1-u);x.strokeStyle='#fff';x.stroke();x.globalAlpha=1;continue;}
      p.x+=p.vx;p.y+=p.vy;
      if(p.k==='dust'){p.life-=0.03;p.s+=0.6;x.globalAlpha=p.life*0.6;circ(x,p.x,p.y,p.s);x.fillStyle='#fff3f8';x.fill();x.globalAlpha=1;}
      else if(p.k==='food'){p.vy+=0.42;p.r+=p.vr;if(p.y>IH+80){Q.splice(i,1);continue;}x.save();x.translate(p.x,p.y);x.rotate(p.r);const d=p.s*1.3;x.drawImage(p.img,-d/2,-d/2,d,d);x.restore();}
      else if(p.k==='conf'){p.vy+=0.25;p.vx*=0.98;p.r+=p.vr;p.life-=0.006;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();}
      else if(p.k==='heart'){p.vy-=0.02;p.life-=0.02;x.globalAlpha=Math.max(0,p.life);heartPath(x,p.x,p.y,p.s);x.fillStyle='#ff5a8a';x.fill();x.globalAlpha=1;}
      if(p.life<=0||p.y>IH+60)Q.splice(i,1);}
    // logo
    const fs1=Math.min(IW/5.2,86),fs2=fs1*0.72,ly=IH*0.17;
    const drawLine=(chars,size,y,start,gap)=>{x.font=FONT(Math.round(size),700);x.textAlign='center';x.textBaseline='middle';const wd=chars.map(ch=>x.measureText(ch).width),tot=wd.reduce((a,b)=>a+b,0);let cx2=IW/2-tot/2;
      chars.forEach((ch,i)=>{const a=T-(start+i*gap),cw=wd[i];if(a>0&&ch!==' '){const u=Math.min(1,a/0.2),sc2=u<1?3.2-2.2*easeOutCubic(u):1+0.06*Math.sin(T*6+i);
        const key=y+'|'+i;if(u>=1&&!landed.has(key)){landed.add(key);shk=Math.max(shk,6);noise(0.12,0.18,900,120);}
        x.save();x.translate(cx2+cw/2,y+Math.sin(T*3+i*0.7)*3);x.rotate((1-u)*0.4*(i%2?1:-1));x.scale(sc2,sc2);x.globalAlpha=Math.min(1,a*6);
        x.lineJoin='round';x.lineWidth=size*0.2;x.strokeStyle='#6b4257';x.strokeText(ch,0,size*0.05);x.lineWidth=size*0.12;x.strokeStyle='#fff';x.strokeText(ch,0,0);
        const g=x.createLinearGradient(0,-size/2,0,size/2);g.addColorStop(0,'#ffb3d1');g.addColorStop(1,'#ff4f8f');x.fillStyle=g;x.fillText(ch,0,0);x.restore();}cx2+=cw;});};
    drawLine(L1,fs1,ly,2.05,0.08);drawLine(L2,fs2,ly+fs1*0.95,2.6,0.06);
    if(T>3.3&&!fanfare){fanfare=true;SFX.level();}
    // animals pop
    pals.forEach((sp,i)=>{const a=T-(3.0+i*0.12);if(a<0)return;const n=pals.length,px=IW*(i+0.5)/n,sz=Math.min(IW/n*1.25,110);const hop=Math.abs(Math.sin(a*5+i))*sz*0.18,rise=Math.min(1,a/0.35);
      const py=IH+sz*0.2-easeOutBack(rise)*sz*0.95-hop;const d=sp.width/DPR*(sz/96);x.drawImage(sp,px-d/2,py-d/2,d,d);if(Math.random()<0.02)Q.push({k:'heart',x:px,y:py-sz*0.6,vx:rnd(-0.5,0.5),vy:-1,life:1,s:rnd(5,8)});});
    // tap prompt
    if(T>4.2){x.font=FONT(22,700);x.textAlign='center';x.globalAlpha=0.6+0.4*Math.sin(T*5);x.lineWidth=6;x.strokeStyle='#fff';x.strokeText('Tap to start!',IW/2,IH*0.8);x.fillStyle='#ff4f8f';x.fillText('Tap to start!',IW/2,IH*0.8);x.globalAlpha=1;}
    else if(T>0.6){x.font=FONT(13,600);x.textAlign='right';x.globalAlpha=0.7;x.fillStyle='#fff';x.fillText('tap to skip',IW-14,IH-18);x.globalAlpha=1;}
    x.restore();
    if(flash>0){x.fillStyle=`rgba(255,255,255,${flash})`;x.fillRect(0,0,IW,IH);flash-=0.045;}
    if(T>10)end();else requestAnimationFrame(step);}
  noise(1.1,0.08,300,3000);requestAnimationFrame(step);
}

if(ART_SRC.bg2)$('title').style.background=`linear-gradient(rgba(255,240,247,.55),rgba(255,214,232,.85)),url(${ART_SRC.bg2}) center/cover`;
if(location.hash==='#hub')document.body.classList.add('inhub');
layout();titleLoop();requestAnimationFrame(frame);
}
</script>
